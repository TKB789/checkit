<!doctype html>
<html lang="en">
<head>
<script>try{var t=localStorage.getItem("sgp-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Group Practice</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#5b6475;--line:#dde1e8;--accent:#2f5bd3;--accent-ink:#fff;--ok:#1d7a46;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbeaea;--warnbg:#fff6e0;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--mute:#9aa3b2;--line:#2c3340;--accent:#7b9cff;--accent-ink:#0d1222;--ok:#5fd08f;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a1a;--warnbg:#332a12;--chip:#252b36}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--mute:#9aa3b2;--line:#2c3340;--accent:#7b9cff;--accent-ink:#0d1222;--ok:#5fd08f;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a1a;--warnbg:#332a12;--chip:#252b36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;margin:0 0 4px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#theme{flex:none;padding:6px 12px;font-size:.9rem}
.sub{color:var(--mute);margin:0 0 16px}
.tabs{display:flex;gap:8px;margin:0 0 16px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.setup{border-left:4px solid var(--accent)}
.setup h2{margin:0 0 6px;font-size:1.15rem}
.score{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--mute);font-size:.95rem}
.bar{flex:1 1 160px;height:8px;background:var(--chip);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.qn{font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.q{font-weight:600;margin:2px 0 4px}
.hint{color:var(--mute);font-size:.88rem;margin:0 0 10px}
label.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;cursor:pointer}
label.opt input{margin-top:4px;width:18px;height:18px;flex:none}
label.opt.right{background:var(--okbg);border-color:var(--ok)}
label.opt.wrong{background:var(--badbg);border-color:var(--bad)}
label.opt .tag{display:block;margin-top:3px;font-size:.8rem;font-weight:600}
.right .tag{color:var(--ok)}.wrong .tag{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fb{margin-top:12px;border-radius:10px;padding:12px;background:var(--chip)}
.fb .v{font-weight:700}.fb .v.ok{color:var(--ok)}.fb .v.no{color:var(--bad)}
.key{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warnbg);font-size:.93rem}
.refs{color:var(--mute);font-size:.82rem;margin-top:6px}
.done{border-color:var(--accent)}
.notes .n{border-top:1px solid var(--line);padding:12px 0}
.notes .n:first-child{border-top:0;padding-top:0}
.n h3{font-size:1rem;margin:0 0 4px}
.n .meta{color:var(--mute);font-size:.8rem}
.empty{color:var(--mute)}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:70px}
.hist{color:var(--mute);font-size:.9rem;margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none}
sub{font-size:.75em}

.pool,.zone{border:1px dashed var(--line);border-radius:12px;padding:10px;min-height:56px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;background:var(--bg)}
.pool.empty-pool{color:var(--mute);font-size:.9rem;align-items:center}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.zone{background:var(--bg);display:flex;flex-direction:column;gap:6px;cursor:pointer}
.zone>.zt{font-weight:600;font-size:.9rem}
.zone.over,.pool.over{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.zone.target{border-color:var(--accent)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.92rem;cursor:grab;user-select:none;touch-action:manipulation;max-width:100%}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.chip.right{background:var(--okbg);border-color:var(--ok);cursor:default}
.chip.wrong{background:var(--badbg);border-color:var(--bad);cursor:default}
.chip .tag{display:block;margin-top:4px;font-size:.8rem;font-weight:600}
.chip.right .tag{color:var(--ok)}.chip.wrong .tag{color:var(--bad)}
.chip svg.qq{display:block}
.chip.has-svg{padding:6px}
.nb textarea{min-height:180px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.filters button{padding:5px 12px;font-size:.88rem}
.saved{color:var(--mute);font-size:.82rem;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Study Group Practice</h1><button id="theme" aria-label="Switch light or dark mode"></button></div>
  <p class="sub" id="sub"></p>
  <div class="tabs"><button data-t="p1" class="on">Practice 1</button><button data-t="p2">Practice 2</button><button data-t="notes">Notes <span id="nCount"></span></button></div>
  <div id="v-p1"></div>
  <div id="v-p2" class="hidden"></div>
  <div id="v-notes" class="hidden"></div>
</div>
<div class="toast" id="toast"></div>
<script id="data" type="application/json">[{"title": "Neighborhood crime rates", "setup": "A city analyst models the crime rate in <b>47<\/b> neighborhoods using <b>15<\/b> candidate factors. A regression with all 15 factors has R² = 0.80 on the training data, but 5-fold cross-validation estimates R² = 0.41.", "parts": [{"q": "What does the gap between 0.80 and 0.41 most likely tell her?", "type": "multi", "fixed": false, "options": ["The model is fitting many random patterns in the training data", "With only about three data points per factor, this is not surprising", "The model is underfit, so it needs more factors", "The cross-validated R² should be ignored, since the training R² uses all 47 neighborhoods"], "answer": [0, 1], "explain": "Training R² rewards fitting random patterns; cross-validation measures data the model didn't fit. With 47 points and 15 factors (about 3 per factor), overfitting is the most likely explanation. (A cross-validation mistake is possible in general, but nothing here suggests one, and the training R² is never the better estimate of performance on new data.)", "concept": "Spotting overfitting", "note": "Training R² ≫ cross-validated R² with few points per factor → overfit; trust the cross-validated estimate.", "refs": ["M11 L1", "M3 L4"]}, {"q": "A coworker runs stepwise regression: it keeps 8 factors, training R² 0.79, cross-validated R² 0.58. Removing the two factors that are no longer significant raises the cross-validated R² to 0.62. Which are true?", "type": "multi", "fixed": false, "options": ["The stepwise model still overfits somewhat (training 0.79 vs cross-validated 0.58)", "Dropping the two insignificant factors gave a simpler model that did no worse on the cross-validated estimate", "The models should be compared on cross-validated R², not training R²", "Stepwise found the best possible subset, since it checked each factor"], "answer": [0, 1, 2], "explain": "The remaining gap between 0.79 and 0.58 shows the stepwise model still fits some random patterns (greedy selection keeps a few such factors). Dropping the two weak factors gave a simpler model whose cross-validated R² didn't fall (0.58 to 0.62; a gain that small on 47 points may partly be noise). Only cross-validated R² can show this; training R² never falls when factors are added, so it always favors the bigger model. Stepwise is greedy, so it doesn't search every subset.", "concept": "Greedy selection and pruning weak factors", "note": "Greedy selection can still overfit; dropping insignificant factors gives a simpler model that may do as well or better; compare on cross-validated R².", "refs": ["M11 L2", "M11 L3"]}, {"q": "She then runs lasso on the <b>raw, unscaled<\/b> data. Median income is in dollars (tens of thousands); the number of police stations is 0–4. Both truly matter. Which are true?", "type": "multi", "fixed": false, "options": ["For an effect of similar size across its range, the station count needs a far larger coefficient than income", "So the station factor uses much more of the budget Σ|aⱼ| ≤ τ, and is more likely to be dropped", "Income is more likely to be dropped, because its values are larger", "The units don't matter, because lasso picks factors by importance"], "answer": [0, 1], "explain": "A coefficient converts units into effect: a factor with a tiny range needs a big coefficient, which is expensive under Σ|aⱼ| ≤ τ. Without scaling, the budget follows units, not importance. Scale first.", "concept": "Why lasso needs scaled data", "note": "Unscaled lasso penalizes small-range factors (they need big coefficients) → scale first.", "refs": ["M11 L2", "M2 L7"]}, {"q": "After scaling, lasso keeps 6 factors (cross-validated R² 0.63). It kept <b>property tax paid<\/b> and dropped <b>home value<\/b>, which are correlated 0.97. Next year only home value will be available for every neighborhood. Which are true?", "type": "multi", "fixed": false, "options": ["Lasso often keeps just one of a highly correlated pair, not necessarily the one you'd prefer", "She should swap in home value, refit, and check the cross-validated R²", "Home value must be useless, since lasso dropped it", "Ridge regression would have dropped both"], "answer": [0, 1], "explain": "With two near-duplicate factors, lasso usually keeps one. Which one isn't a statement about usefulness, so practical constraints (cost, availability) are the analyst's call. Ridge keeps both.", "concept": "Correlated factors in lasso", "note": "Lasso keeps one of a correlated pair; override with judgment (cost, availability) and re-validate.", "refs": ["M11 L3"]}, {"q": "Her manager asks her to cut τ much further, \"to be safe from overfitting.\" The cross-validated R² falls to 0.48. Which are true?", "type": "multi", "fixed": false, "options": ["The model is now likely underfit: real effects are being cut out", "τ should be chosen by comparing cross-validated results across several values", "A smaller τ always gives a safer, better model", "The fall means the data must have changed"], "answer": [0, 1], "explain": "Too tight a budget removes real factors and shrinks the rest: high bias. The best τ is in between, found by validation.", "concept": "Choosing the budget τ", "note": "Too small τ → underfit; pick τ where cross-validated quality is best.", "refs": ["M11 L2", "M11 L2b"]}]}, {"title": "Predicting hospital stays", "setup": "Two models predict how many days a patient stays in hospital. <b>Model A<\/b>: training R² 0.95, validation R² 0.60. <b>Model B<\/b>: training R² 0.70, validation R² 0.68.", "parts": [{"q": "Which are the most reasonable conclusions?", "type": "multi", "fixed": false, "options": ["Model A is overfit", "Model A has the higher variance in the bias–variance sense", "Model A will probably predict new patients better, since its training R² is higher", "Model B fits random patterns more than Model A"], "answer": [0, 1], "explain": "A's big drop from training to validation shows it fits random patterns: low bias, high variance. Judge models on validation data.", "concept": "Diagnosing with training vs validation", "note": "Big train–validation drop → overfit (high variance); choose by validation.", "refs": ["M11 L2b", "Discussion 7.3"]}, {"q": "The analyst refits Model A with ridge regression (Σⱼ aⱼ² ≤ τ), trying smaller and smaller τ. Which are true?", "type": "multi", "fixed": false, "options": ["Training R² falls or stays the same as τ gets smaller", "Validation R² may rise at first, then fall once τ is too small", "Factors drop out of the model one by one", "Training R² rises, because the coefficients get better"], "answer": [0, 1], "explain": "Shrinking coefficients reduces fit to all patterns: less variance, more bias. That helps validation until real effects are shrunk away. Ridge shrinks coefficients toward 0 but doesn't set them to exactly 0, so no factor drops out.", "concept": "Ridge regression and τ", "note": "Ridge: smaller τ → training fit down; validation up then down; no variables removed.", "refs": ["M11 L2c", "M11 L2b"]}, {"q": "At the first τ she tries, the coefficients don't change at all. Which are true?", "type": "multi", "fixed": false, "options": ["The ordinary regression solution was already inside the constraint region", "She needs a larger τ before ridge has any effect", "Ridge regression doesn't work on this kind of data", "The data must not have been scaled"], "answer": [0], "explain": "If Σaⱼ² of the ordinary solution is already ≤ τ, the constraint doesn't bind and nothing changes. A larger τ only loosens it further; she needs a smaller τ. Scaling changes the coefficients' sizes, but a non-binding constraint is fully explained by τ being too large, so 'must' doesn't follow.", "concept": "When the ridge constraint has no effect", "note": "Ridge changes nothing until τ is small enough that the ordinary solution falls outside the circle.", "refs": ["M11 L2c"]}, {"q": "A colleague asks why lasso on the same data set some coefficients to 0 but ridge didn't. Which are true?", "type": "multi", "fixed": false, "options": ["The lasso constraint region has corners on the axes, where some coefficients are 0", "The error contours usually first touch the round ridge region between the axes", "Ridge uses a different error function from lasso", "Ridge would also set coefficients to 0 if the data were scaled"], "answer": [0, 1], "explain": "Both minimize the same squared error. Lasso's diamond-shaped region has corners on the axes, where the error contours often touch first; ridge's circle has no corners, so the contours generally touch it between the axes and every coefficient stays nonzero. Scaling changes the sizes of the coefficients, not the shape of the region.", "concept": "Lasso vs ridge geometry", "note": "Same error; lasso diamond corners → zeros; ridge circle → no zeros.", "refs": ["M11 L2a"]}, {"q": "Besides ridge, which are reasonable next steps for Model A?", "type": "multi", "fixed": false, "options": ["Use fewer factors, chosen with lasso or elastic net and checked on validation data", "Collect data on more patients", "Ask physicians which factors are plausible real effects", "Add squared and interaction terms for every factor"], "answer": [0, 1, 2], "explain": "Fewer factors, more data and expert knowledge all reduce fitting to random patterns. More terms make overfitting worse.", "concept": "Fixing an overfit model", "note": "Overfit fixes: fewer factors, regularization, more data, expert input; not more terms.", "refs": ["Discussion 7.3", "M11 L1", "M11 L2b"]}]}]</script>
<script id="data2" type="application/json">[{"title": "A theme park's analytics week", "setup": "A theme park's analytics team is testing a new ticket-purchase page, measuring guests and rides, and checking which probability models fit its data. Every question on this page is drag and drop: drag each card into a box (or tap a card, then tap a box). A box can hold several cards, and some boxes may stay empty.", "parts": [{"q": "Each visitor to the ticket page either buys or doesn't. Match each quantity to the distribution that usually models it best.", "type": "match", "fixed": false, "cats": ["Bernoulli", "Binomial", "Geometric", "Poisson", "Exponential", "Weibull", "Normal"], "items": ["How many guests join the roller-coaster line in a 10-minute window, when guests arrive at random", "Whether one particular visitor buys a ticket (yes or no)", "How long a ride's motor runs before it fails, when failures get more likely as the motor wears", "How many of the next 1,000 visitors buy, if each buys independently with the same probability", "Adult guests' heights", "How many visitors arrive before the first purchase of the morning", "The time between two guests joining that line"], "answer": [3, 0, 5, 1, 6, 2, 4], "why": ["Count of random arrivals in a fixed time interval: Poisson.", "One yes/no trial with probability p: Bernoulli.", "Time to failure with a changing failure rate (shape k > 1 = wearing out): Weibull.", "Number of successes in n independent, identical yes/no trials: binomial.", "A quantity made of many small effects, clustered symmetrically around its mean: normal.", "Number of trials until the first success: geometric.", "Time between random (Poisson) arrivals: exponential."], "explain": "Ask what is being counted or timed: one yes/no (Bernoulli), successes in n tries (binomial), tries until the first success (geometric), arrivals in a time window (Poisson), time between random arrivals (exponential), time to failure with a changing rate (Weibull).", "conc  the far left: a long right tail and a short left tail (right-skewed).", "S-shape: points fall below the line on the left and rise above it on the right, so both tails are more extreme than the reference.", "Inverse S: points rise above the line on the left and fall below on the right, so both tails are less extreme than the reference.", "Points lie along y = x: the quantiles match.", "A straight line steeper than y = x: same shape, wider spread.", "A straight line parallel to y = x but above it: same shape, every quantile shifted up (larger mean)."], "explain": "On a Q-Q plot, a straight line means the shapes match; its position and slope compare the center and spread. Bends show the tails: ends that move away from y = x mean heavier tails on that side, and ends that pull toward the middle mean lighter tails.", "concept": "Reading Q-Q plots", "note": "Straight on y = x = match; parallel = shifted; steeper = more spread; S = heavy tails; inverse S = light tails; upward bend on the right = right-skewed.", "refs": ["M13 L4"]}, {"q": "Putting both together: for each check below, what will the Q-Q plot most likely look like?", "type": "match", "fixed": false, "cats": ["Matches the reference distribution", "Longer right tail than the reference (right-skewed)", "Heavier tails at both ends", "Lighter tails at both ends", "Same shape, but a larger mean than the reference", "Same shape, but more spread than the reference"], "items": ["Adult guests' heights (roughly normal), plotted against a normal with the same mean and standard deviation", "Times between guests joining a ride line (truly exponential), plotted against a normal distribution", "Daily attendance (standard deviation 900), plotted against a normal with the right mean but standard deviation 300", "The same inter-arrival times, plotted against an exponential distribution with the right rate", "Daily attendance (roughly normal, mean 18,000), plotted against a normal with mean 16,000 and the right standard deviation"], "answer": [0, 1, 5, 0, 4], "why": ["A normal against a matching normal lines up along y = x.", "Exponential data have a long right tail and a short left one, so against a normal the plot bends upward on the right.", "The data are 3 times as spread out, so the points form a line about 3 times as steep.", "Data plotted against their own distribution line up along y = x.", "Every data quantile sits about 2,000 above the reference's: a parallel line above y = x."], "explain": "Knowing a quantity's distribution lets you predict its Q-Q plot: the same distribution gives y = x, a skewed distribution against a symmetric one bends, and wrong mean or spread shift or tilt the line. That's also how Q-Q plots validate a simulation: compare simulated output with real data.", "concept": "Distributions and their Q-Q plots", "note": "Same distribution → y = x; exponential vs normal → right-skew bend; wrong mean → parallel shift; wrong spread → different slope.", "refs": ["M13 L3", "M13 L4", "M13 L6"]}, {"q": "Match each situation to the design-of-experiments approach it calls for.", "type": "match", "fixed": false, "cats": ["Comparison and control", "Blocking", "A/B test", "Full factorial design", "Fractional factorial design", "Multi-armed bandit", "Representative survey sample"], "items": ["Survey guests about a new ride idea, making sure families, teens and seniors are included in proportion to the park's visitors", "Test two versions of the ticket page on randomly chosen visitors at the same time, and see which sells more", "Test 3 two-level features of the park app (8 combinations) when all 8 versions can be built", "Before crediting the new page for higher sales, make sure the old and new pages were shown to similar visitors over the same days", "Weekend and weekday guests behave very differently, so randomize the page versions separately within weekends and within weekdays", "Try 5 new snack prices over the summer, shifting more stands toward the prices that are selling best as results come in", "Test 8 two-level features of the park app, but only 16 versions can be built, chosen so each level and each pair of levels appears equally often"], "answer": [6, 2, 3, 0, 1, 5, 4], "why": ["A sample that represents the population: a representative survey sample.", "Two versions, random visitors, a quick answer: an A/B test.", "Every combination of the factors is tested: full factorial.", "Compare like with like so the difference can be credited to the change: comparison and control.", "Group by a factor that affects the response and randomize within groups: blocking.", "Exploit the leaders while still exploring, updating as results arrive: a bandit.", "A balanced subset of the 2⁸ = 256 combinations: fractional factorial."], "explain": "Match the design to the goal: compare fairly (comparison and control), cut noise from a known factor (blocking), pick between versions quickly (A/B), learn every factor's effect (full factorial) or most of them with fewer runs (fractional factorial), earn while learning (bandit), and survey a representative group.", "concept": "Matching designs to situations", "note": "Fair comparison → control; noisy known factor → block; two versions → A/B; all combos → full factorial; balanced subset → fractional; learn while earning → bandit.", "refs": ["M12 L1", "M12 L2", "M12 L3", "M12 L4"]}]}]</script>
<script>
(function(){
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600);}
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}
function shuf(n,seed){const idx=[...Array(n).keys()],r=rng(seed);for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}return idx;}
const same=(a,b)=>[...a].sort().join()===[...b].sort().join();
function refList(r){return (r||[]).map(x=>String(x).replace(/^M(\d+) L(\w+)/,'Module $1 · Lesson $2')).join('; ');}
const load=(k,d)=>{try{const s=JSON.parse(localStorage.getItem(k)||'null');return s||d;}catch(e){return d;}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

// ---- Practice 1 keeps its original storage key and format; the shared notes live there too, so existing notes stay.
const K1='study-group-practice-1-m2', K2='study-group-practice-2';
let DB1=load(K1,null); if(!DB1||!DB1.attempts) DB1={attempts:[],notes:[]}; DB1.notes=DB1.notes||[]; if(typeof DB1.notebook!=='string') DB1.notebook='';
let DB2=load(K2,null); if(!DB2||!DB2.attempts) DB2={attempts:[]};
const PR={
  p1:{name:'Practice 1',sub:'Variable selection · 2 scenarios · 10 questions · select all that apply',SCS:JSON.parse(document.getElementById('data').textContent),pre:'',db:()=>DB1,save:()=>put(K1,DB1)},
  p2:{name:'Practice 2',sub:'Distributions, Q-Q plots and experiment design · 4 drag-and-drop questions',SCS:JSON.parse(document.getElementById('data2').textContent),pre:'p2-',db:()=>DB2,save:()=>put(K2,DB2)}
};
for(const k in PR){const pr=PR[k];pr.P=[];pr.SCS.forEach((sc,si)=>sc.parts.forEach(p=>pr.P.push(Object.assign({id:pr.pre+'q'+(pr.P.length+1),n:pr.P.length+1,si,pr:k},p))));
  pr.byId=id=>pr.P.find(p=>p.id===id);
  pr.newAttempt=(ids,kind)=>{const D=pr.db();D.attempts.push({n:D.attempts.length+1,kind:kind||'all',ids:ids||pr.P.map(p=>p.id),ans:{},started:Date.now()});pr.save();};
  if(!pr.db().attempts.length) pr.newAttempt();
  {const D=pr.db(),a=D.attempts[D.attempts.length-1]; if(a.kind!=='missed'&&a.ids.length<pr.P.length){ if(!Object.keys(a.ans).length) a.ids=pr.P.map(p=>p.id); else pr.newAttempt(); D.attempts[D.attempts.length-1].kind='all'; pr.save(); }}
  pr.cur=()=>{const D=pr.db();return D.attempts[D.attempts.length-1];};}
const findP=id=>{for(const k in PR){const p=PR[k].byId(id);if(p)return p;}return null;};
const saveNotes=()=>put(K1,DB1);
function refsOf(n){const p=n.pid&&findP(n.pid);return n.refs||(p&&p.refs)||[];}
function hasNote(pid){return DB1.notes.some(n=>n.pid===pid);}
function addNote(p,why){if(hasNote(p.id))return false;const pr=PR[p.pr];DB1.notes.push({id:'n'+Date.now()+Math.random().toString(36).slice(2,6),pid:p.id,practice:pr.name,refs:p.refs||[],sc:pr.SCS[p.si].title,title:p.concept,key:p.note,explain:p.explain,q:p.q,why,mine:'',at:Date.now()});saveNotes();return true;}

// ---- drag-and-drop working state (not saved until submitted)
const WIP={}; let SEL=null;   // WIP[qid] = {itemIndex: catIndex}; SEL = {q, i}
function matchOk(p,place){return p.items.every((_,i)=>place[i]===p.answer[i]);}

function renderQuiz(k){
  const pr=PR[k],att=pr.cur(),ids=att.ids,done=ids.filter(id=>att.ans[id]).length,right=ids.filter(id=>att.ans[id]&&att.ans[id].ok).length;
  let h=`<div class="card"><div class="score"><b>Attempt ${att.n}${att.kind==='missed'?' · missed questions only':''}</b><span>${done} of ${ids.length} answered · ${right} correct</span><div class="bar"><i style="width:${ids.length?100*done/ids.length:0}%"></i></div></div></div>`;
  let lastSi=-1;
  ids.forEach((id,qi)=>{const p=pr.byId(id),a=att.ans[id];
    if(p.si!==lastSi){lastSi=p.si;const sc=pr.SCS[p.si];h+=`<div class="card setup"><div class="qn">Scenario ${p.si+1} of ${pr.SCS.length}</div><h2>${esc(sc.title)}</h2><div>${sc.setup}</div></div>`;}
    h+=`<div class="card" id="c-${id}"><div class="qn">Question ${qi+1} of ${ids.length}</div><div class="q">${p.q}</div>`;
    if(p.type==='match') h+=matchHTML(p,att,a); else h+=multiHTML(p,att,a);
    if(a){h+=`<div class="fb"><div class="v ${a.ok?'ok':'no'}">${a.ok?'Correct':'Not quite'}${a.ok?'':' · added to your notes'}</div><div>${p.explain}</div><div class="key"><b>Key idea:</b> ${p.note}</div>${p.refs&&p.refs.length?`<div class="refs">Lecture: ${esc(refList(p.refs))}</div>`:''}<div class="row">${hasNote(id)?`<button disabled>In your notes ✓</button>`:`<button data-add="${id}">Add to notes</button>`}</div></div>`;}
    h+=`</div>`;});
  if(done===ids.length){const missed=ids.filter(id=>!att.ans[id].ok),D=pr.db();
    h+=`<div class="card done"><h2 style="margin:0 0 6px;font-size:1.15rem">Score: ${right} / ${ids.length} (${Math.round(100*right/ids.length)}%)</h2><p style="margin:0">${missed.length?`You missed ${missed.length}. ${missed.length===1?'It is':'They are'} in your notes.`:'All correct. Nice work.'}</p><div class="row"><button class="primary" data-retest="all" data-pr="${k}">Retest all questions</button>${missed.length?`<button data-retest="missed" data-pr="${k}">Retest missed only (${missed.length})</button>`:''}<button data-goto="notes">Review notes</button></div>`;
    if(D.attempts.length>1){h+=`<ul class="hist">`+D.attempts.map(t=>{const d=t.ids.filter(i=>t.ans[i]),r=d.filter(i=>t.ans[i].ok).length;return `<li>Attempt ${t.n}${t.kind==='missed'?' (missed only)':''}: ${d.length?`${r} / ${d.length}`:'not started'}</li>`;}).join('')+`</ul>`;}
    h+=`</div>`;}
  document.getElementById('v-'+k).innerHTML=h;
}
function multiHTML(p,att,a){
  const ord=p.fixed?p.options.map((_,i)=>i):shuf(p.options.length,att.n*97+p.n*13+7);
  let h=`<p class="hint">${p.type==='single'?'Choose one.':'Select all that apply.'}</p>`;
  ord.forEach(i=>{const picked=a?a.picks.includes(i):false,isAns=p.answer.includes(i);let cls='',tag='';
    if(a){ if(isAns&&picked){cls='right';tag='Correct choice';} else if(isAns&&!picked){cls='wrong';tag='Missed: this is true';} else if(!isAns&&picked){cls='wrong';tag='Not true';} }
    h+=`<label class="opt ${cls}"><input type="${p.type==='single'?'radio':'checkbox'}" name="r-${p.id}" data-p="${p.id}" value="${i}" ${picked?'checked':''} ${a?'disabled':''}><span>${p.options[i]}${tag?`<span class="tag">${tag}</span>`:''}</span></label>`;});
  if(!a) h+=`<div class="row"><button class="primary" data-submit="${p.id}">Submit</button></div>`;
  return h;
}
const chip=(p,i,extra,cls)=>`<div class="chip ${/<svg/.test(p.items[i])?'has-svg':''} ${cls||''}" ${extra||''}>${p.items[i]}</div>`;
function matchHTML(p,att,a){
  const ord=shuf(p.items.length,att.n*131+p.n*17+3);
  let h=`<p class="hint">Drag each card into a box, or tap a card and then tap a box. Tap a placed card to move it again. Some boxes may stay empty.</p>`;
  if(!a){const place=WIP[p.id]||{},left=ord.filter(i=>place[i]===undefined);
    h+=`<div class="pool ${left.length?'':'empty-pool'}" data-zone="${p.id}|pool">${left.length?left.map(i=>chip(p,i,`draggable="true" data-chip="${p.id}|${i}"`,SEL&&SEL.q===p.id&&SEL.i===i?'sel':'')).join(''):'All cards placed.'}</div><div class="zones">`;
    p.cats.forEach((c,ci)=>{h+=`<div class="zone ${SEL&&SEL.q===p.id?'target':''}" data-zone="${p.id}|${ci}"><div class="zt">${esc(c)}</div>${ord.filter(i=>place[i]===ci).map(i=>chip(p,i,`draggable="true" data-chip="${p.id}|${i}"`,SEL&&SEL.q===p.id&&SEL.i===i?'sel':'')).join('')}</div>`;});
    h+=`</div><div class="row"><button class="primary" data-submit="${p.id}">Submit</button><button data-clear="${p.id}">Clear</button></div>`;}
  else{h+=`<div class="zones">`;
    p.cats.forEach((c,ci)=>{const here=ord.filter(i=>a.place[i]===ci);
      h+=`<div class="zone" style="cursor:default"><div class="zt">${esc(c)}</div>${here.map(i=>{const ok=p.answer[i]===ci;return chip(p,i,'',ok?'right':'wrong').replace(/<\/div>$/,`<span class="tag">${ok?'Correct':'Belongs in: '+esc(p.cats[p.answer[i]])}</span><span style="display:block;font-size:.85rem;margin-top:2px">${esc(p.why[i])}</span></div>`);}).join('')||'<span class="empty" style="font-size:.85rem">(empty)</span>'}</div>`;});
    const n=p.items.filter((_,i)=>a.place[i]===p.answer[i]).length; h+=`</div><p class="refs" style="margin-top:8px">${n} of ${p.items.length} cards placed correctly.</p>`;}
  return h;
}
function renderNotes(){
  const F=renderNotes.f||'all', list=DB1.notes.filter(n=>F==='all'||(F==='own'?!n.pid:(n.practice||'Practice 1')===F));
  document.getElementById('nCount').textContent=DB1.notes.length?`(${DB1.notes.length})`:'';
  let h=`<div class="card nb"><b>Overall notebook</b><p class="hint" style="margin:2px 0 8px">One running page of notes for the whole topic, across both practices. Saved automatically in this browser.</p><textarea id="notebook" placeholder="Big ideas, formulas, things the group discussed…">${esc(DB1.notebook)}</textarea><div class="saved" id="nbSaved"></div></div>`;
  h+=`<div class="card notes"><div class="filters">${['all','Practice 1','Practice 2','own'].map(f=>`<button data-filter="${f}" class="${F===f?'on':''}">${f==='all'?'All':f==='own'?'My own notes':f}</button>`).join('')}</div>`;
  if(!list.length) h+=`<p class="empty">No notes here yet. Missed questions are added automatically, and you can add any graded question with "Add to notes".</p>`;
  list.forEach(n=>{h+=`<div class="n"><h3>${esc(n.title||'My note')}</h3>${n.pid?`<div class="meta">${n.why==='missed'?'Missed':'Added'} · ${esc(n.practice||'Practice 1')}${n.sc?' · '+esc(n.sc):''} · ${n.q.replace(/<svg[\s\S]*?<\/svg>/g,'[plot]').replace(/<[^>]+>/g,'')}</div><div class="key"><b>Key idea:</b> ${n.key}</div><div style="margin-top:6px">${n.explain}</div>${refsOf(n).length?`<div class="refs">Lecture: ${esc(refList(refsOf(n)))}</div>`:''}`:''}<textarea data-mine="${n.id}" placeholder="Your own note (saved automatically)">${esc(n.mine||'')}</textarea><div class="row"><button data-del="${n.id}">Remove</button></div></div>`;});
  h+=`</div><div class="card"><b>Add your own note</b><textarea id="newNote" placeholder="Anything you want to remember"></textarea><div class="row"><button class="primary" id="addOwn">Add note</button><button id="copyNotes">Copy all notes</button></div></div>`;
  h+=`<div class="card"><div class="row" style="margin:0"><button id="reset">Start over (clear grades and notes on this device)</button></div></div>`;
  document.getElementById('v-notes').innerHTML=h;
}
function render(){renderQuiz('p1');renderQuiz('p2');renderNotes();}
let TAB='p1';
function tab(t){TAB=t;for(const v of ['p1','p2','notes'])document.getElementById('v-'+v).classList.toggle('hidden',v!==t);
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.getElementById('sub').textContent=t==='notes'?'Shared notes for both practices':PR[t].sub;try{localStorage.setItem('sgp-tab',t);}catch(e){}window.scrollTo(0,0);}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

function place(qid,i,zone){const w=WIP[qid]=WIP[qid]||{};if(zone==='pool')delete w[i];else w[i]=+zone;SEL=null;const k=findP(qid).pr;renderQuiz(k);}
document.addEventListener('click',e=>{
  const ch=e.target.closest('[data-chip]'), z=e.target.closest('[data-zone]');
  if(SEL&&z){const [q,zone]=z.dataset.zone.split('|'),self=ch&&ch.dataset.chip===SEL.q+'|'+SEL.i;
    // holding a card: tapping anywhere in a box (even on another card) drops it there; tapping a pool card switches the selection
    if(q===SEL.q&&!self&&!(ch&&zone==='pool')){place(q,SEL.i,zone);return;}}
  if(ch){const [q,i]=ch.dataset.chip.split('|');SEL=(SEL&&SEL.q===q&&SEL.i===+i)?null:{q,i:+i};renderQuiz(findP(q).pr);return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.submit){const id=b.dataset.submit,p=findP(id),pr=PR[p.pr];
    if(p.type==='match'){const w=WIP[id]||{};if(p.items.some((_,i)=>w[i]===undefined)){toast('Place every card first');return;}
      const ok=matchOk(p,w);pr.cur().ans[id]={place:Object.assign({},w),ok};delete WIP[id];if(!ok)addNote(p,'missed');}
    else{const picks=[...document.querySelectorAll(`input[data-p="${id}"]:checked`)].map(x=>+x.value);if(!picks.length){toast('Select at least one option');return;}
      const ok=same(picks,p.answer);pr.cur().ans[id]={picks,ok};if(!ok)addNote(p,'missed');}
    pr.save();render();document.getElementById('c-'+id).scrollIntoView({block:'nearest'});}
  else if(b.dataset.clear){delete WIP[b.dataset.clear];SEL=null;renderQuiz(findP(b.dataset.clear).pr);}
  else if(b.dataset.add){if(addNote(findP(b.dataset.add),'added'))toast('Added to notes');render();document.getElementById('c-'+b.dataset.add).scrollIntoView({block:'nearest'});}
  else if(b.dataset.retest){const pr=PR[b.dataset.pr],att=pr.cur(),ids=b.dataset.retest==='missed'?att.ids.filter(id=>!att.ans[id].ok):pr.P.map(p=>p.id);pr.newAttempt(ids,b.dataset.retest);render();window.scrollTo(0,0);toast('New attempt started. Options are reshuffled.');}
  else if(b.dataset.goto){tab(b.dataset.goto);}
  else if(b.dataset.filter){renderNotes.f=b.dataset.filter;renderNotes();}
  else if(b.dataset.del){DB1.notes=DB1.notes.filter(n=>n.id!==b.dataset.del);saveNotes();render();}
  else if(b.id==='addOwn'){const t=document.getElementById('newNote').value.trim();if(!t)return;DB1.notes.push({id:'n'+Date.now(),title:'My note',mine:t,at:Date.now()});saveNotes();render();toast('Note added');}
  else if(b.id==='copyNotes'){const strip=s=>String(s||'').replace(/<svg[\s\S]*?<\/svg>/g,'[plot]').replace(/<sub>(.*?)<\/sub>/g,'$1').replace(/<[^>]+>/g,'');
    const txt=[DB1.notebook.trim()?'OVERALL NOTEBOOK\n'+DB1.notebook.trim():''].concat(DB1.notes.map(n=>[n.title+(n.practice?' ('+n.practice+')':''),n.key?'Key idea: '+strip(n.key):'',strip(n.explain),refsOf(n).length?'Lecture: '+refList(refsOf(n)):'',n.mine?'My note: '+n.mine:''].filter(Boolean).join('\n'))).filter(Boolean).join('\n\n');
    if(!txt){toast('Nothing to copy yet');return;}
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Notes copied'),()=>toast('Copy not available here'));}
  else if(b.id==='reset'){if(confirm('Clear all attempts and notes for both practices on this device?')){DB1={attempts:[],notes:[],notebook:''};DB2={attempts:[]};PR.p1.newAttempt();PR.p2.newAttempt();render();tab('p1');}}
});
// drag and drop (mouse); touch uses tap-to-place above
let DRAG=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-chip]');if(!c)return;DRAG=c.dataset.chip;e.dataTransfer.setData('text/plain',DRAG);e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-zone]');if(!z||!DRAG)return;if(z.dataset.zone.split('|')[0]!==DRAG.split('|')[0])return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over');});
document.addEventListener('dragleave',e=>{const z=e.target.closest('[data-zone]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over');});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-zone]');if(!z||!DRAG)return;e.preventDefault();const [q,i]=DRAG.split('|'),[zq,zone]=z.dataset.zone.split('|');DRAG=null;if(q===zq)place(q,+i,zone);});
document.addEventListener('dragend',()=>{DRAG=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));});
document.addEventListener('input',e=>{
  if(e.target.id==='notebook'){DB1.notebook=e.target.value;saveNotes();const s=document.getElementById('nbSaved');if(s)s.textContent='Saved';return;}
  const id=e.target.dataset&&e.target.dataset.mine;if(!id)return;const n=DB1.notes.find(x=>x.id===id);if(n){n.mine=e.target.value;saveNotes();}});
render();
let start='p1';try{const s=localStorage.getItem('sgp-tab');if(s&&['p1','p2','notes'].includes(s))start=s;}catch(e){}
if(/#p2|#practice2/.test(location.hash))start='p2';else if(/#notes/.test(location.hash))start='notes';
tab(start);
const TB=document.getElementById('theme');
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){TB.textContent=isDark()?'☀️ Light':'🌙 Dark';}
TB.onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('sgp-theme',t);}catch(e){}paintTheme();};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);}catch(e){}
paintTheme();
})();
</script>
</body>
