<!doctype html>
<html lang="en">
<head>
<script>try{var t=localStorage.getItem("sgp-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Group Practice 1</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#5b6475;--line:#dde1e8;--accent:#2f5bd3;--accent-ink:#fff;--ok:#1d7a46;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbeaea;--warnbg:#fff6e0;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--mute:#9aa3b2;--line:#2c3340;--accent:#7b9cff;--accent-ink:#0d1222;--ok:#5fd08f;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a1a;--warnbg:#332a12;--chip:#252b36}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--mute:#9aa3b2;--line:#2c3340;--accent:#7b9cff;--accent-ink:#0d1222;--ok:#5fd08f;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a1a;--warnbg:#332a12;--chip:#252b36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;margin:0 0 4px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#theme{flex:none;padding:6px 12px;font-size:.9rem}
.sub{color:var(--mute);margin:0 0 16px}
.tabs{display:flex;gap:8px;margin:0 0 16px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.setup{border-left:4px solid var(--accent)}
.setup h2{margin:0 0 6px;font-size:1.15rem}
.score{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--mute);font-size:.95rem}
.bar{flex:1 1 160px;height:8px;background:var(--chip);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.qn{font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.q{font-weight:600;margin:2px 0 4px}
.hint{color:var(--mute);font-size:.88rem;margin:0 0 10px}
label.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;cursor:pointer}
label.opt input{margin-top:4px;width:18px;height:18px;flex:none}
label.opt.right{background:var(--okbg);border-color:var(--ok)}
label.opt.wrong{background:var(--badbg);border-color:var(--bad)}
label.opt .tag{display:block;margin-top:3px;font-size:.8rem;font-weight:600}
.right .tag{color:var(--ok)}.wrong .tag{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fb{margin-top:12px;border-radius:10px;padding:12px;background:var(--chip)}
.fb .v{font-weight:700}.fb .v.ok{color:var(--ok)}.fb .v.no{color:var(--bad)}
.key{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warnbg);font-size:.93rem}
.refs{color:var(--mute);font-size:.82rem;margin-top:6px}
.done{border-color:var(--accent)}
.notes .n{border-top:1px solid var(--line);padding:12px 0}
.notes .n:first-child{border-top:0;padding-top:0}
.n h3{font-size:1rem;margin:0 0 4px}
.n .meta{color:var(--mute);font-size:.8rem}
.empty{color:var(--mute)}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:70px}
.hist{color:var(--mute);font-size:.9rem;margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none}
sub{font-size:.75em}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Study Group Practice 1</h1><button id="theme" aria-label="Switch light or dark mode"></button></div>
  <p class="sub">Variable selection · 2 scenarios · 10 questions · select all that apply</p>
  <div class="tabs"><button id="tQuiz" class="on">Quiz</button><button id="tNotes">My notes <span id="nCount"></span></button></div>
  <div id="quiz"></div>
  <div id="notes" class="hidden"></div>
</div>
<div class="toast" id="toast"></div>
<script id="data" type="application/json">[{"title": "Neighborhood crime rates", "setup": "A city analyst models the crime rate in <b>47<\/b> neighborhoods using <b>15<\/b> candidate factors. A regression with all 15 factors has R² = 0.80 on the training data, but 5-fold cross-validation estimates R² = 0.41.", "parts": [{"q": "What does the gap between 0.80 and 0.41 most likely tell her?", "type": "multi", "fixed": false, "options": ["The model is fitting many random patterns in the training data", "With only about three data points per factor, this is not surprising", "The model is underfit, so it needs more factors", "The cross-validated R² should be ignored, since the training R² uses all 47 neighborhoods"], "answer": [0, 1], "explain": "Training R² rewards fitting random patterns; cross-validation measures data the model didn't fit. With 47 points and 15 factors (about 3 per factor), overfitting is the most likely explanation. (A cross-validation mistake is possible in general, but nothing here suggests one, and the training R² is never the better estimate of performance on new data.)", "concept": "Spotting overfitting", "note": "Training R² ≫ cross-validated R² with few points per factor → overfit; trust the cross-validated estimate.", "refs": ["M11 L1", "M3 L4"]}, {"q": "A coworker runs stepwise regression: it keeps 8 factors, training R² 0.79, cross-validated R² 0.58. Removing the two factors that are no longer significant raises the cross-validated R² to 0.62. Which are true?", "type": "multi", "fixed": false, "options": ["The stepwise model still overfits somewhat (training 0.79 vs cross-validated 0.58)", "Dropping the two insignificant factors gave a simpler model that did no worse on the cross-validated estimate", "The models should be compared on cross-validated R², not training R²", "Stepwise found the best possible subset, since it checked each factor"], "answer": [0, 1, 2], "explain": "The remaining gap between 0.79 and 0.58 shows the stepwise model still fits some random patterns (greedy selection keeps a few such factors). Dropping the two weak factors gave a simpler model whose cross-validated R² didn't fall (0.58 to 0.62; a gain that small on 47 points may partly be noise). Only cross-validated R² can show this; training R² never falls when factors are added, so it always favors the bigger model. Stepwise is greedy, so it doesn't search every subset.", "concept": "Greedy selection and pruning weak factors", "note": "Greedy selection can still overfit; dropping insignificant factors gives a simpler model that may do as well or better; compare on cross-validated R².", "refs": ["M11 L2", "M11 L3"]}, {"q": "She then runs lasso on the <b>raw, unscaled<\/b> data. Median income is in dollars (tens of thousands); the number of police stations is 0–4. Both truly matter. Which are true?", "type": "multi", "fixed": false, "options": ["For an effect of similar size across its range, the station count needs a far larger coefficient than income", "So the station factor uses much more of the budget Σ|aⱼ| ≤ τ, and is more likely to be dropped", "Income is more likely to be dropped, because its values are larger", "The units don't matter, because lasso picks factors by importance"], "answer": [0, 1], "explain": "A coefficient converts units into effect: a factor with a tiny range needs a big coefficient, which is expensive under Σ|aⱼ| ≤ τ. Without scaling, the budget follows units, not importance. Scale first.", "concept": "Why lasso needs scaled data", "note": "Unscaled lasso penalizes small-range factors (they need big coefficients) → scale first.", "refs": ["M11 L2", "M2 L7"]}, {"q": "After scaling, lasso keeps 6 factors (cross-validated R² 0.63). It kept <b>property tax paid<\/b> and dropped <b>home value<\/b>, which are correlated 0.97. Next year only home value will be available for every neighborhood. Which are true?", "type": "multi", "fixed": false, "options": ["Lasso often keeps just one of a highly correlated pair, not necessarily the one you'd prefer", "She should swap in home value, refit, and check the cross-validated R²", "Home value must be useless, since lasso dropped it", "Ridge regression would have dropped both"], "answer": [0, 1], "explain": "With two near-duplicate factors, lasso usually keeps one. Which one isn't a statement about usefulness, so practical constraints (cost, availability) are the analyst's call. Ridge keeps both.", "concept": "Correlated factors in lasso", "note": "Lasso keeps one of a correlated pair; override with judgment (cost, availability) and re-validate.", "refs": ["M11 L3"]}, {"q": "Her manager asks her to cut τ much further, \"to be safe from overfitting.\" The cross-validated R² falls to 0.48. Which are true?", "type": "multi", "fixed": false, "options": ["The model is now likely underfit: real effects are being cut out", "τ should be chosen by comparing cross-validated results across several values", "A smaller τ always gives a safer, better model", "The fall means the data must have changed"], "answer": [0, 1], "explain": "Too tight a budget removes real factors and shrinks the rest: high bias. The best τ is in between, found by validation.", "concept": "Choosing the budget τ", "note": "Too small τ → underfit; pick τ where cross-validated quality is best.", "refs": ["M11 L2", "M11 L2b"]}]}, {"title": "Predicting hospital stays", "setup": "Two models predict how many days a patient stays in hospital. <b>Model A<\/b>: training R² 0.95, validation R² 0.60. <b>Model B<\/b>: training R² 0.70, validation R² 0.68.", "parts": [{"q": "Which are the most reasonable conclusions?", "type": "multi", "fixed": false, "options": ["Model A is overfit", "Model A has the higher variance in the bias–variance sense", "Model A will probably predict new patients better, since its training R² is higher", "Model B fits random patterns more than Model A"], "answer": [0, 1], "explain": "A's big drop from training to validation shows it fits random patterns: low bias, high variance. Judge models on validation data.", "concept": "Diagnosing with training vs validation", "note": "Big train–validation drop → overfit (high variance); choose by validation.", "refs": ["M11 L2b", "Discussion 7.3"]}, {"q": "The analyst refits Model A with ridge regression (Σⱼ aⱼ² ≤ τ), trying smaller and smaller τ. Which are true?", "type": "multi", "fixed": false, "options": ["Training R² falls or stays the same as τ gets smaller", "Validation R² may rise at first, then fall once τ is too small", "Factors drop out of the model one by one", "Training R² rises, because the coefficients get better"], "answer": [0, 1], "explain": "Shrinking coefficients reduces fit to all patterns: less variance, more bias. That helps validation until real effects are shrunk away. Ridge shrinks coefficients toward 0 but doesn't set them to exactly 0, so no factor drops out.", "concept": "Ridge regression and τ", "note": "Ridge: smaller τ → training fit down; validation up then down; no variables removed.", "refs": ["M11 L2c", "M11 L2b"]}, {"q": "At the first τ she tries, the coefficients don't change at all. Which are true?", "type": "multi", "fixed": false, "options": ["The ordinary regression solution was already inside the constraint region", "She needs a larger τ before ridge has any effect", "Ridge regression doesn't work on this kind of data", "The data must not have been scaled"], "answer": [0], "explain": "If Σaⱼ² of the ordinary solution is already ≤ τ, the constraint doesn't bind and nothing changes. A larger τ only loosens it further; she needs a smaller τ. Scaling changes the coefficients' sizes, but a non-binding constraint is fully explained by τ being too large, so 'must' doesn't follow.", "concept": "When the ridge constraint has no effect", "note": "Ridge changes nothing until τ is small enough that the ordinary solution falls outside the circle.", "refs": ["M11 L2c"]}, {"q": "A colleague asks why lasso on the same data set some coefficients to 0 but ridge didn't. Which are true?", "type": "multi", "fixed": false, "options": ["The lasso constraint region has corners on the axes, where some coefficients are 0", "The error contours usually first touch the round ridge region between the axes", "Ridge uses a different error function from lasso", "Ridge would also set coefficients to 0 if the data were scaled"], "answer": [0, 1], "explain": "Both minimize the same squared error. Lasso's diamond-shaped region has corners on the axes, where the error contours often touch first; ridge's circle has no corners, so the contours generally touch it between the axes and every coefficient stays nonzero. Scaling changes the sizes of the coefficients, not the shape of the region.", "concept": "Lasso vs ridge geometry", "note": "Same error; lasso diamond corners → zeros; ridge circle → no zeros.", "refs": ["M11 L2a"]}, {"q": "Besides ridge, which are reasonable next steps for Model A?", "type": "multi", "fixed": false, "options": ["Use fewer factors, chosen with lasso or elastic net and checked on validation data", "Collect data on more patients", "Ask physicians which factors are plausible real effects", "Add squared and interaction terms for every factor"], "answer": [0, 1, 2], "explain": "Fewer factors, more data and expert knowledge all reduce fitting to random patterns. More terms make overfitting worse.", "concept": "Fixing an overfit model", "note": "Overfit fixes: fewer factors, regularization, more data, expert input; not more terms.", "refs": ["Discussion 7.3", "M11 L1", "M11 L2b"]}]}]</script>
<script>
(function(){
const SCS=JSON.parse(document.getElementById('data').textContent);
const P=[];SCS.forEach((sc,si)=>sc.parts.forEach(p=>P.push(Object.assign({id:'q'+(P.length+1),n:P.length+1,si},p))));
const KEY='study-group-practice-1-m2';
let DB={attempts:[],notes:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.attempts) DB=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function newAttempt(ids,kind){DB.attempts.push({n:DB.attempts.length+1,kind:kind||'all',ids:ids||P.map(p=>p.id),ans:{},started:Date.now()});save();}
if(!DB.attempts.length) newAttempt();
{const a=DB.attempts[DB.attempts.length-1]; if(a.kind!=='missed'&&a.ids.length<P.length){ if(!Object.keys(a.ans).length) a.ids=P.map(p=>p.id); else newAttempt(); a.kind='all'; save(); }}
const cur=()=>DB.attempts[DB.attempts.length-1];
const byId=id=>P.find(p=>p.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}
function order(p,att){const idx=p.options.map((_,i)=>i);if(p.fixed)return idx;const r=rng(att.n*97+p.n*13+7);for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}return idx;}
const same=(a,b)=>[...a].sort().join()===[...b].sort().join();
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600);}
function refList(r){return (r||[]).map(x=>String(x).replace(/^M(\d+) L(\w+)/,'Module $1 · Lesson $2')).join('; ');}
function refsOf(n){const p=n.pid&&byId(n.pid);return n.refs||(p&&p.refs)||[];}
function hasNote(pid){return DB.notes.some(n=>n.pid===pid);}
function addNote(p,why){if(hasNote(p.id))return false;DB.notes.push({id:'n'+Date.now()+Math.random().toString(36).slice(2,6),pid:p.id,refs:p.refs||[],sc:SCS[p.si].title,title:p.concept,key:p.note,explain:p.explain,q:p.q,why,mine:'',at:Date.now()});save();return true;}

function renderQuiz(){
  const att=cur(), ids=att.ids, done=ids.filter(id=>att.ans[id]).length, right=ids.filter(id=>att.ans[id]&&att.ans[id].ok).length;
  let h='';
  h+=`<div class="card"><div class="score"><b>Attempt ${att.n}${att.kind==='missed'?' · missed questions only':''}</b><span>${done} of ${ids.length} answered · ${right} correct</span><div class="bar"><i style="width:${ids.length?100*done/ids.length:0}%"></i></div></div></div>`;
  let lastSi=-1;
  ids.forEach((id,k)=>{const p=byId(id),a=att.ans[id],ord=order(p,att);
    if(p.si!==lastSi){lastSi=p.si;const sc=SCS[p.si];h+=`<div class="card setup"><div class="qn">Scenario ${p.si+1} of ${SCS.length}</div><h2>${esc(sc.title)}</h2><div>${sc.setup}</div></div>`;}
    h+=`<div class="card" id="c-${id}"><div class="qn">Question ${k+1} of ${ids.length}</div><div class="q">${p.q}</div><p class="hint">Select all that apply.</p>`;
    ord.forEach(i=>{const picked=a?a.picks.includes(i):false,isAns=p.answer.includes(i);
      let cls='',tag='';
      if(a){ if(isAns&&picked){cls='right';tag='Correct choice';} else if(isAns&&!picked){cls='wrong';tag='Missed: this is true';} else if(!isAns&&picked){cls='wrong';tag='Not true';} }
      h+=`<label class="opt ${cls}"><input type="checkbox" data-p="${id}" value="${i}" ${picked?'checked':''} ${a?'disabled':''}><span>${p.options[i]}${tag?`<span class="tag">${tag}</span>`:''}</span></label>`;});
    if(!a){h+=`<div class="row"><button class="primary" data-submit="${id}">Submit</button></div>`;}
    else{h+=`<div class="fb"><div class="v ${a.ok?'ok':'no'}">${a.ok?'Correct':'Not quite'}${a.ok?'':' · added to your notes'}</div><div>${p.explain}</div><div class="key"><b>Key idea:</b> ${p.note}</div>${p.refs&&p.refs.length?`<div class="refs">Lecture: ${esc(refList(p.refs))}</div>`:''}<div class="row">${hasNote(id)?`<button disabled>In your notes ✓</button>`:`<button data-add="${id}">Add to notes</button>`}</div></div>`;}
    h+=`</div>`;});
  if(done===ids.length){const missed=ids.filter(id=>!att.ans[id].ok);
    h+=`<div class="card done"><h2 style="margin:0 0 6px;font-size:1.15rem">Score: ${right} / ${ids.length} (${Math.round(100*right/ids.length)}%)</h2><p style="margin:0">${missed.length?`You missed ${missed.length}. ${missed.length===1?'It is':'They are'} in your notes.`:'All correct. Nice work.'}</p><div class="row"><button class="primary" data-retest="all">Retest all questions</button>${missed.length?`<button data-retest="missed">Retest missed only (${missed.length})</button>`:''}<button data-tab="notes">Review notes</button></div>`;
    if(DB.attempts.length>1){h+=`<ul class="hist">`+DB.attempts.map(t=>{const d=t.ids.filter(i=>t.ans[i]),r=d.filter(i=>t.ans[i].ok).length;return `<li>Attempt ${t.n}${t.kind==='missed'?' (missed only)':''}: ${d.length?`${r} / ${d.length}`:'not started'}</li>`;}).join('')+`</ul>`;}
    h+=`</div>`;}
  document.getElementById('quiz').innerHTML=h;
}
function renderNotes(){
  document.getElementById('nCount').textContent=DB.notes.length?`(${DB.notes.length})`:'';
  let h=`<div class="card notes">`;
  if(!DB.notes.length) h+=`<p class="empty">No notes yet. Missed questions are added automatically, and you can add any graded question with "Add to notes".</p>`;
  DB.notes.forEach(n=>{h+=`<div class="n"><h3>${esc(n.title||'My note')}</h3>${n.pid?`<div class="meta">${n.why==='missed'?'Missed':'Added'}${n.sc?' · '+esc(n.sc):''} · ${n.q.replace(/<[^>]+>/g,'')}</div><div class="key"><b>Key idea:</b> ${n.key}</div><div style="margin-top:6px">${n.explain}</div>${refsOf(n).length?`<div class="refs">Lecture: ${esc(refList(refsOf(n)))}</div>`:''}`:''}<textarea data-mine="${n.id}" placeholder="Your own note (saved automatically)">${esc(n.mine||'')}</textarea><div class="row"><button data-del="${n.id}">Remove</button></div></div>`;});
  h+=`</div><div class="card"><b>Add your own note</b><textarea id="newNote" placeholder="Anything you want to remember"></textarea><div class="row"><button class="primary" id="addOwn">Add note</button>${DB.notes.length?`<button id="copyNotes">Copy all notes</button>`:''}</div></div>`;
  h+=`<div class="card"><div class="row" style="margin:0"><button id="reset">Start over (clear grades and notes)</button></div></div>`;
  document.getElementById('notes').innerHTML=h;
}
function render(){renderQuiz();renderNotes();}
function tab(t){document.getElementById('quiz').classList.toggle('hidden',t!=='quiz');document.getElementById('notes').classList.toggle('hidden',t!=='notes');document.getElementById('tQuiz').classList.toggle('on',t==='quiz');document.getElementById('tNotes').classList.toggle('on',t==='notes');window.scrollTo(0,0);}
document.getElementById('tQuiz').onclick=()=>tab('quiz');document.getElementById('tNotes').onclick=()=>tab('notes');
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.submit){const id=b.dataset.submit,p=byId(id),picks=[...document.querySelectorAll(`input[data-p="${id}"]:checked`)].map(x=>+x.value);
    if(!picks.length){toast('Select at least one option');return;}
    const ok=same(picks,p.answer);cur().ans[id]={picks,ok};if(!ok)addNote(p,'missed');save();render();document.getElementById('c-'+id).scrollIntoView({block:'nearest'});}
  else if(b.dataset.add){if(addNote(byId(b.dataset.add),'added'))toast('Added to notes');render();document.getElementById('c-'+b.dataset.add).scrollIntoView({block:'nearest'});}
  else if(b.dataset.retest){const att=cur(),ids=b.dataset.retest==='missed'?att.ids.filter(id=>!att.ans[id].ok):P.map(p=>p.id);newAttempt(ids,b.dataset.retest);render();window.scrollTo(0,0);toast('New attempt started. Options are reshuffled.');}
  else if(b.dataset.tab){tab(b.dataset.tab);}
  else if(b.dataset.del){DB.notes=DB.notes.filter(n=>n.id!==b.dataset.del);save();render();}
  else if(b.id==='addOwn'){const t=document.getElementById('newNote').value.trim();if(!t)return;DB.notes.push({id:'n'+Date.now(),title:'My note',mine:t,at:Date.now()});save();render();toast('Note added');}
  else if(b.id==='copyNotes'){const strip=s=>String(s||'').replace(/<sub>(.*?)<\/sub>/g,'$1').replace(/<[^>]+>/g,'');const txt=DB.notes.map(n=>[n.title,n.key?'Key idea: '+strip(n.key):'',strip(n.explain),refsOf(n).length?'Lecture: '+refList(refsOf(n)):'',n.mine?'My note: '+n.mine:''].filter(Boolean).join('\n')).join('\n\n');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Notes copied'),()=>toast('Copy not available here'));}
  else if(b.id==='reset'){if(confirm('Clear all attempts and notes on this device?')){DB={attempts:[],notes:[]};newAttempt();render();tab('quiz');}}
});
document.addEventListener('input',e=>{const id=e.target.dataset&&e.target.dataset.mine;if(!id)return;const n=DB.notes.find(x=>x.id===id);if(n){n.mine=e.target.value;save();}});
render();
const TB=document.getElementById('theme');
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){TB.textContent=isDark()?'☀️ Light':'🌙 Dark';}
TB.onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('sgp-theme',t);}catch(e){}paintTheme();};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);}catch(e){}
paintTheme();
})();
</script>
</body>
</html>
