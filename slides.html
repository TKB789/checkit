s poorly. What's the fix?", "o": [["Add a squared term: y = a₀ + a₁x₁ + a₂x₁²", "Transforming the data can make the fit linear in the coefficients."], ["Drop the predictor, since it isn't linear", "The predictor matters; the form is wrong.", "Discarding useful data."], ["Use k-means to find the two arms of the U", "That's not a regression fix.", "Mixing up methods."], ["Keep the line and just report its low R²", "A better form is available.", "Giving up too soon."]]}, "M8 L5#7–12": {"q": "Which model is still \"linear regression\" (linear in its coefficients)?", "o": [["y = a₀ + a₁x₁² + a₂sin(x₂)", "Transformed inputs are fine; the coefficients still enter linearly."], ["y = a₀ + a₁x₁ + x₂^(a₂)", "The coefficient is an exponent, so it isn't linear in a₁.", "Missing where the nonlinearity is."], ["y = a₀ + a₁x₁ · e^(a₂x₂)", "The coefficient sits inside an exponential.", "Missing where the nonlinearity is."], ["y = a₀ + sin(a₁x₁)", "The coefficient is inside sin().", "Missing where the nonlinearity is."]]}, "M8 L5#13–14": {"q": "A promotion lifts sales more in stores with larger floor space. How should a regression capture this?", "o": [["Add a promotion × floor-space product term", "An interaction lets one effect depend on another variable."], ["Add a squared term for the promotion variable", "That models curvature in one variable, not dependence.", "Confusing squares with interactions."], ["Add a promotion + floor-space sum as a new input", "A sum is just a linear combination of existing terms.", "Using a sum."], ["Take the log of sales and keep the rest the same", "That alone doesn't let the promotion effect vary by size.", "Misplacing the fix."]]}, "M8 L6#4–6": {"q": "A predictor's coefficient has a p-value of 0.30. What does this mean?", "o": [["Such an estimate is common even if the true effect is 0", "The p-value assumes no effect and asks how surprising the data are."], ["There's a 30% chance the true coefficient is exactly 0", "A p-value isn't the probability the null is true.", "Misreading the p-value."], ["The predictor explains 30% of the response's variation", "That's an R²-type statement.", "Confusing with R²."], ["The predictor's effect is small in practical terms", "p-values don't measure effect size.", "Equating p-value with size."]]}, "M8 L6#7–8": {"q": "A model has 1,000,000 data points, and every attribute has p < 0.01. Why be careful?", "o": [["Huge samples make even trivially small effects significant", "The lecture puts it as “even unrelated attributes”; strictly, it’s tiny but real effects. Also: p-values are only probabilities, not certainties."], ["Small p-values mean that every attribute truly matters", "With huge data, tiny effects look significant.", "Overtrusting p-values."], ["p-values can't be computed with this much data", "They can; they just get small.", "Inventing a limit."], ["All p-values below 0.01 prove the model is overfit", "p-values don't measure overfitting.", "Mixing up ideas."]]}, "M8 L6#9–10": {"q": "A coefficient's 95% confidence interval is [−0.4, 1.2]. What does this suggest?", "o": [["The data are consistent with no effect at all", "The interval includes 0, so it's not significant at 5%."], ["The effect is certainly positive, around 0.4", "The interval allows negative values.", "Ignoring the lower bound."], ["95% of data points fall between −0.4 and 1.2", "It's about the coefficient, not the data.", "Confusing CI with data range."], ["The model explains between 40% and 120% of variance", "That's not what a CI measures.", "Confusing CI with R²."]]}, "M8 L6#11–12": {"q": "Two ad channels have the same estimated coefficient. Channel A's 95% CI is [0.1, 3.9]; Channel B's is [1.8, 2.2]. What does this tell you?", "o": [["B's effect is estimated much more precisely than A's", "A narrower interval means less uncertainty."], ["A's effect is larger, since its interval reaches higher", "The estimates are the same; A's is just less certain.", "Reading width as size."], ["Only B is statistically significant at the 5% level", "Neither interval includes 0, so both are significant.", "Misreading significance."], ["The two channels have identical uncertainty", "The widths differ greatly.", "Ignoring interval width."]]}, "M8 L6#13–15": {"q": "A regression has R² = 0.59. What does that mean?", "o": [["It explains 59% of variability; the rest is noise or other factors", "Adjusted R² also adjusts for the number of attributes."], ["59% of its predictions are exactly right, and 41% are all wrong", "R² measures variability explained, not hits.", "Misreading R²."], ["There's a 59% chance that the whole model is correct", "R² isn't a probability.", "Misreading R²."], ["59% of its coefficients are statistically significant", "Not what R² measures.", "Confusing R² with p-values."]]}, "M9 L1#3–8": {"q": "Women's weights vary little at low values but much more at high values. What is this called?", "o": [["Heteroscedasticity: unequal variance", "The spread changes across the range. (Strictly, heteroscedasticity is spread that changes with a predictor, fitted value or time, as in a residual fan.)"], ["Multicollinearity: correlated inputs", "That's about predictors moving together.", "Mixing up terms."], ["A trend: a rise in values over time", "There's no time element.", "Mixing up issues."], ["Normality: a symmetric bell curve", "Unequal spread breaks the bell shape.", "Misreading the pattern."]]}, "M9 L1#9–10": {"q": "Plotted over time, a series spreads out more and more as time goes on. What is this, and is the series stationary?", "o": [["Heteroscedasticity; not stationary, since the variance changes", "Stationary series keep a constant mean and variance."], ["Heteroscedasticity; stationary, since the mean stays the same", "A changing variance breaks stationarity.", "Checking only the mean."], ["Multicollinearity; not stationary, since inputs are correlated", "That's about correlated predictors.", "Mixing up terms."], ["A seasonal cycle; stationary, since the pattern repeats", "No repeating cycle is described.", "Mixing up patterns."]]}, "M9 L1#11–14": {"q": "Software fits a Box-Cox transform to a response and picks λ close to 1. What does that suggest?", "o": [["The data needs little or no transformation", "λ = 1 is essentially a shift, so the shape barely changes."], ["The data needs a strong log transformation", "A log corresponds to λ near 0, not 1.", "Confusing λ values."], ["The response has a strong upward time trend", "λ describes the variance-stabilizing shape, not trend.", "Mixing up issues."], ["The transformed values will all equal one", "λ is a power, not the output value.", "Misreading the parameter."]]}, "M9 L2#3–6": {"q": "Gold prices rise steadily over several decades. What is this called, and why can it matter in a model?", "o": [["A trend; it can distort factor-based models", "Remove it (detrend) so the model isn't just fitting time."], ["A seasonal cycle; it repeats at the same time each year", "A steady long-run rise isn't a cycle.", "Confusing trend and seasonality."], ["An outlier; it should be removed before modeling", "A long-run rise isn't a single odd point.", "Mixing up modules."], ["Heteroscedasticity; it calls for a Box-Cox transform", "That's about unequal spread.", "Mixing up issues."]]}, "M9 L2#7": {"q": "A regression predicts a restaurant's yearly sales from ten years of local income and population, all of which rise over time. Why detrend first?", "o": [["Shared growth over time can fake a relationship among factors", "Removing the trend from response and predictors keeps the model from fitting time itself."], ["Regression can't handle predictors that are measured in years", "It can; the issue is shared trend.", "Misstating the problem."], ["Detrending makes the response variable normally distributed", "That's Box-Cox's goal.", "Mixing up methods."], ["Detrending removes the correlation among the predictors", "That's PCA's goal.", "Mixing up methods."]]}, "M9 L2#8–9": {"q": "How do you detrend a time-series factor?", "o": [["Fit y = a₀ + a₁·time; subtract the fit from each value", "Do this factor by factor with one-dimensional regression."], ["Run PCA on all the factors at once to remove their trend", "PCA removes correlation, not trends.", "Mixing up methods."], ["Divide each value by its seasonal factor from the last cycle", "That removes seasonality.", "Mixing up methods."], ["Apply a Box-Cox transform with λ = 0 to each factor", "That addresses variance, not trend.", "Mixing up methods."]]}, "M9 L3#3–4": {"q": "Predicting next-day returns from many stocks' past returns, why might you exclude days dominated by major news like elections?", "o": [["External shocks, not past returns, drive those days", "Those days don't reflect the relationship being modeled."], ["Returns on those days are recorded much less accurately", "The data is accurate; the driver is different.", "Blaming data quality."], ["Those days make the predictors less correlated", "Correlation isn't the reason to drop them.", "Mixing up issues."], ["Including them would force a Box-Cox transform", "Unusual days don't require a transform.", "Mixing up methods."]]}, "M9 L3#5–7": {"q": "Stocks in the same sector tend to move together. Why is that a problem for a regression with thousands of stocks, and how does PCA help?", "o": [["Predictors are correlated; PCA makes uncorrelated components", "Correlated predictors are hard to separate; components aren't."], ["Predictors have a trend; PCA removes the trend over time", "Detrending handles trends.", "Mixing up methods."], ["Predictors are heteroscedastic; PCA equalizes the variance", "Box-Cox handles unequal variance.", "Mixing up methods."], ["Predictors have outliers; PCA drops the extreme days", "PCA doesn't drop data.", "Mixing up methods."]]}, "M9 L3#8–9": {"q": "What does PCA do to a set of predictors?", "o": [["Makes new uncorrelated coordinates, ranked by importance", "Then you can keep just the first n."], ["Deletes the correlated predictors, keeping the best ones", "It builds new combinations; it doesn't just delete.", "Confusing PCA with variable selection."], ["Scales every predictor to 0–1, then clusters them", "Not what PCA does.", "Mixing up methods."], ["Transforms the response so it's normally distributed", "That's Box-Cox.", "Mixing up methods."]]}, "M9 L3#10–15": {"q": "PCA is applied to a 2-D cloud of points. How are the new axes D1 and D2 chosen?", "o": [["D1 follows the most spread; D2 is perpendicular to it", "The axes rotate so the new coordinates are uncorrelated."], ["D1 and D2 are the original x- and y-axes, left unchanged", "PCA rotates to new axes.", "Missing the rotation."], ["D1 follows the least spread; D2 follows the most spread", "Reversed.", "Flipping the order."], ["D1 and D2 are chosen at random, then kept if they fit well", "They follow the data's spread.", "Misunderstanding PCA."]]}, "M9 L4#4–7": {"q": "In PCA, what do the eigenvectors of the scaled data's covariance matrix provide?", "o": [["The directions, or weights, that define each component", "Each eigenvector gives one component's weights."], ["The amount of variance explained by each component", "That's what the eigenvalues give.", "Confusing vectors with values."], ["The predictors to delete because they're redundant", "PCA combines predictors; it doesn't pick ones to delete.", "Confusing with variable selection."], ["The coefficients linking each predictor to the response", "PCA never uses the response.", "Confusing with regression."]]}, "M9 L4#8–9": {"q": "After PCA, you want a model with fewer variables. Which components do you keep?", "o": [["The first n, which explain the most variance", "Later components carry little variance and often mostly noise."], ["The last n: they carry the least correlation", "All components are uncorrelated; the first ones matter most.", "Reversing the order."], ["The original factors with the smallest means", "PCA works with components, not raw means.", "Guessing."], ["All of them, since dropping any loses the benefit", "Keeping fewer is the point.", "Missing dimension reduction."]]}, "M9 L4#10": {"q": "Customer data lies along a curved, crescent-shaped band rather than a straight line. Which approach suits it best?", "o": [["Kernel PCA, which can capture nonlinear structure", "Kernels let PCA find curved patterns, as in SVMs."], ["Standard PCA, simply keeping more of the components", "More linear components still miss the curve's shape.", "More components fix everything."], ["Standard PCA after detrending each of the factors", "Detrending removes time trends, not curvature.", "Mixing up methods."], ["Standard PCA after a Box-Cox fix on the response", "PCA works on predictors; the response isn't involved.", "Mixing up methods."]]}, "M9 L4#11–14": {"q": "Why convert a principal-component regression back into implied coefficients on the original factors?", "o": [["To interpret the model in terms of measured variables", "Original factors are what people understand and collect."], ["To make the components correlated again for better accuracy", "Mapping back doesn't change correlation or accuracy.", "Misreading the purpose."], ["To recover the information from dropped components", "Dropped components stay dropped.", "Expecting lost info back."], ["To raise the model's R² on the training data", "It's the same model, just re-expressed.", "Expecting a better fit."]]}, "M9 L5#3": {"q": "What does it mean for v to be an eigenvector of a square matrix A?", "o": [["Av = λv: A only stretches v by the factor λ", "λ is the matching eigenvalue."], ["Av = v + λ: A shifts v by the amount λ", "It's multiplication by λ, not addition.", "Garbling the definition."], ["vA = λ: v is a row whose entries sum to λ", "Not the definition.", "Garbling the definition."], ["Av = 0: A sends v to zero, and λ is its length", "That's only the λ = 0 case.", "Confusing with the null space."]]}, "M9 L5#4": {"q": "How many principal components can PCA produce from m original predictors?", "o": [["At most m, one for each original dimension", "PCA rotates m dimensions into m new ones."], ["Exactly two, whatever the value of m is", "Two is just a common plotting choice.", "Confusing with 2-D plots."], ["One for each pair of correlated predictors", "Components aren't tied to predictor pairs.", "Misreading PCA."], ["One for each data point in the data set", "Components are directions in predictor space.", "Confusing rows and columns."]]}, "M9 L6#2–3": {"q": "A stakeholder asks what \"Component 2\" in your PCA model measures. Why is that hard to answer?", "o": [["It blends many original factors into one new variable", "Each component is a weighted mix of all factors."], ["It is always pure noise with no real-world meaning", "Later components can carry real signal.", "Assuming later means noise."], ["It is the single original factor ranked second", "Components are combinations, not single factors.", "Confusing with variable ranking."], ["It is correlated with Component 1, muddling both", "Components are uncorrelated.", "Misreading PCA."]]}, "M9 L6#4–9": {"q": "When does keeping only the first principal component work well for classifying red vs. blue points?", "o": [["When the top-variance direction also splits the two classes", "PCA ignores labels, so it only helps if variance and separation line up."], ["Always, since the first component has the most variance", "High variance doesn't guarantee separation.", "Overstating PCA."], ["When the second component has the most variance", "The first has the most by construction.", "Misreading PCA order."], ["When all components have equal variance", "Then no component stands out.", "Guessing."]]}, "M9 L6#10": {"q": "Why can PCA discard information that would help predict the response?", "o": [["It ranks directions by predictor variance, not the response", "High-variance directions need not relate to the response."], ["It deletes the predictors most correlated with the response", "PCA never looks at the response at all.", "Misreading PCA."], ["It only works when the response is normally distributed", "PCA makes no assumption about the response.", "Mixing up assumptions."], ["It weights directions by how noisy the response is", "The response plays no role in PCA.", "Bringing in the response."]]}, "M10 L1#4–5": {"q": "On the opening slides, what does CART stand for, and what other kind of problem gets its own tree name?", "o": [["Classification and regression trees; decision making uses decision trees", "The slides list CART for classification and regression problems, and decision trees for decision making."], ["Clustering and regression trees; forecasting uses time-series trees", "The C is classification, not clustering, and no time-series tree appears.", "Mixing up classification and clustering."], ["Classification and regression testing; validation uses decision trees", "The T is trees: the method splits the data into branches.", "Misreading the acronym."], ["Combined additive regression trees; only regression problems use them", "CART covers classification too.", "Inventing the acronym."]]}, "M10 L1#6–7": {"q": "In the marketing-email example, the “25 or younger” regression has 13.75 for number of children and the “older than 25” regression has 28.13. What does this show?", "o": [["The same factor can have a different effect in different groups", "That is the reason for splitting: one regression on everyone would force a single coefficient for children."], ["Older customers have about twice as many children", "Coefficients describe the effect of each child on spending, not how many children people have.", "Reading a coefficient as an average of the factor."], ["The younger group’s regression is wrong and should be dropped", "Both are legitimate fits to their own groups.", "Expecting the coefficients to agree."], ["Age should be added as one more factor in a single regression", "A single age term can’t let the children effect change with age; the tree gives each group its own coefficients.", "Missing why the data is split."]]}, "M10 L1#8": {"q": "In the “25 or younger” regression, income over $30,000 has coefficient 0; for “older than 25” it is 7.13. What does that mean?", "o": [["Higher income is estimated to add to spending only in the older group", "A 0 coefficient means the factor has no estimated effect in that group; the older group’s model adds 7.13 for income over $30K."], ["No one in the younger group earns over $30,000", "A 0 coefficient is an estimated effect, not a statement that the group has no such customers.", "Reading a 0 coefficient as missing data."], ["Income over $30,000 lowers younger customers’ spending", "A negative coefficient would mean that; 0 means no effect.", "Misreading the sign."], ["Income matters the same in both groups once age is controlled", "The two coefficients differ, so the effect differs by group.", "Ignoring the difference."]]}, "M10 L1#9–12": {"q": "In the marketing-email tree, the “Age > 50” node sits under the “Age > 25” branch. Which data points does it hold?", "o": [["All data points with age over 50", "Each node holds the data points that satisfy every branch condition on the path to it."], ["All data points with age 26–50", "That is its sibling node.", "Reading the wrong node."], ["All data points, since every node uses the full data set", "Only the root holds all the data; each branch takes a subset.", "Missing how branches divide the data."], ["Data points over 50 who have at least one child", "The children split is under the 26–50 node in the slide’s tree.", "Adding a condition from another branch."]]}, "M10 L1#13–18": {"q": "Using the slide’s tree (age ≤ 25 / > 25, then ≤ 50 / > 50, then no children / ≥ 1 child), how is spending predicted for a 37-year-old with 2 children?", "o": [["Follow > 25, then ≤ 50, then ≥ 1 child, and use that leaf’s model", "Prediction walks down the branches to one leaf and uses only that leaf’s model."], ["Average the predictions of every leaf in the tree", "Averaging many trees is a random forest; one tree uses one leaf.", "Mixing up a tree with a forest."], ["Use the root’s regression, since it was fit on all the data", "The root’s model is replaced by the more specific leaf models.", "Stopping at the root."], ["Use the “> 25” node’s model, since the age branch is the first split", "The path continues down to a leaf.", "Stopping too early."]]}, "M10 L1#19–21": {"q": "Why don’t trees in practice fit a full regression at every node?", "o": [["It means lots of regressions, and deep nodes have few data points", "Computation grows with the number of nodes, and full regressions on few points overfit."], ["Regression can’t be fit on a subset of the data", "Each node’s data is just a smaller data set; it can be fit.", "Thinking subsets can’t be modeled."], ["Deep nodes have more data points than the root", "It’s the opposite: each split leaves fewer points per node.", "Reversing the picture."], ["Full regressions would make the tree impossible to explain", "The slide’s two reasons are the number of regressions and the shrinking data per node.", "Naming the wrong reason."]]}, "M10 L1#22–24": {"q": "A tree uses the simplest regression in each node, y = a₀. Minimizing Σ(yᵢ − a₀)² gives what value of a₀?", "o": [["The average response of the data points in that node", "Setting the derivative −2Σ(yᵢ − a₀) to zero gives a₀ = Σyᵢ / (number of points in the node)."], ["The median response of the data points in that node", "The median minimizes absolute errors; squared errors give the mean.", "Mixing up the two error measures."], ["The average response over the whole data set", "The sum runs only over the node’s own data points.", "Using the wrong data."], ["Zero, since the derivative is set to zero", "Setting the derivative to zero is how you solve for a₀, not its value.", "Confusing the method with the answer."]]}, "M10 L1#25–28": {"q": "In the simple version used in practice, what does a leaf of a logistic regression tree give, and what does a leaf of a classification tree give?", "o": [["Logistic: fraction of its points with a “true” response; classification: its most common class", "Each is the simplest model for its type of response."], ["Logistic: its average response; classification: its median class", "The average is the regression-tree leaf, and classes have no median.", "Mixing up the leaf models."], ["Logistic: a full logistic regression; classification: an SVM", "In practice the leaves hold the simple version, for the same overfitting and computation reasons.", "Missing the simplification."], ["Logistic: the most common class; classification: a probability", "That swaps the two.", "Reversing the pair."]]}, "M10 L1#29–32": {"q": "Why is the method called a regression “tree”?", "o": [["Flipped upside down, it has a root node, branches and leaves", "The convention of drawing the root at the top stuck, but the picture is a tree turned over."], ["It was first used to model the growth of trees", "The name describes the shape of the diagram.", "Inventing a history."], ["Each leaf grows a new regression every time data is added", "The name comes from the picture, not from updating.", "Taking the metaphor too far."], ["It was named after the statistician who developed it", "The name comes from the root–branch–leaf shape.", "Inventing a history."]]}, "M10 L2#4–5": {"q": "A slide shows a branch on (number of courses) × (available classrooms) ≥ 1,000. Why do trees in practice usually branch on one factor at a time?", "o": [["There’s no good algorithm for finding good combinations of factors", "Combinations can make sense in theory, but there are too many to search well, so common practice uses single factors."], ["A branch on a combination of factors can’t be drawn as a tree", "It can; the branch is just a more complex condition.", "Thinking combinations break the tree shape."], ["Combinations of factors always overfit the data", "The issue is finding good combinations, not that they always overfit.", "Overstating the risk."], ["Multiplying factors changes their units, which trees can’t handle", "Units aren’t the problem; search is.", "Naming the wrong reason."]]}, "M10 L2#6–8": {"q": "In the lecture’s branching method, how is a leaf split while growing the tree?", "o": [["Find each factor’s best split; make the biggest variance decrease if it beats a threshold", "The method calculates the leaf’s variance, finds the split on each factor that lowers it most, and splits only if the decrease is above the threshold."], ["Split on the factor most correlated with the response, at its median", "The slide’s criterion is the decrease in variance, not correlation.", "Inventing a criterion."], ["Split on a random factor, then check it on the other half of the data", "Random factors are a forest idea; the other half is for pruning.", "Mixing up the steps."], ["Make every possible split, then keep the one with the most data points", "Splits are judged by variance decrease, and leaf size is only a minimum.", "Misreading the criterion."]]}, "M10 L2#9–10": {"q": "The tree is grown on half the data. What is done with the other half?", "o": [["At each branching point, compare error with and without the branch; remove it if branching increases error", "Fresh data checks whether each split helps or only fit random effects in the growing half."], ["Grow a second tree, then average the two trees", "That is closer to a forest; the lecture uses the other half to prune.", "Mixing up pruning and forests."], ["Re-estimate each leaf’s average with all the data", "The other half is used to test the branches.", "Missing the pruning step."], ["Nothing: it is set aside for a final test only", "In this method it is used for pruning.", "Mixing up pruning with a test set."]]}, "M10 L2#11–13": {"q": "Different branching methods share the same key ideas. Which list matches the slide?", "o": [["Use a quality metric, find the best factor, check the branch helped or prune it back", "These ideas apply to regression and classification trees alike."], ["Pick factors at random, average many trees, never prune", "That describes a random forest, not branching in general.", "Mixing up methods."], ["Split on every factor, keep all branches, test only at the end", "Branches are checked and pruned back if they don’t help.", "Skipping the check."], ["Pick the factor with the widest range, split at its middle, stop at depth 3", "None of these are the slide’s ideas.", "Inventing rules."]]}, "M10 L3#5–7": {"q": "On the slide’s sales table, the data split first on promotion, then the promotion days split on holiday: Sat 828 and Sun 712 (no holiday), Mon 588 (holiday). Using leaf averages, what does the tree predict for a promoted non-holiday day?", "o": [["770", "The leaf holds 828 and 712; their average is 770."], ["828", "That is the highest value in the leaf, not its average.", "Using one point instead of the leaf average."], ["709", "That averages all three promotion days, ignoring the holiday split.", "Stopping one branch early."], ["601", "That averages all six days, ignoring both splits.", "Using the root."]]}, "M10 L3#8–9": {"q": "Why does the random forest method introduce randomness?", "o": [["To grow many different trees whose average may beat a single tree", "Trees with different strengths and weaknesses make averaging worthwhile."], ["To make each tree as accurate as possible", "Each tree is a little worse; the combination is better.", "Focusing on single trees."], ["To make the model easier to explain", "Forests are harder to explain.", "Reversing the trade-off."], ["To avoid needing any training data", "Every tree is trained on data.", "Misunderstanding the method."]]}, "M10 L3#10–12": {"q": "With n original data points, how is the data for each tree in a random forest chosen?", "o": [["n points drawn at random, so some appear several times and others not at all", "This is bootstrapping: each tree sees slightly different data."], ["n/2 points, with the other half saved for pruning", "Forest trees aren’t pruned, and they use n points.", "Mixing up the single-tree method."], ["All n points, each used exactly once", "Then every tree would see the same data.", "Missing the resampling."], ["A different block of consecutive rows for each tree", "Points are drawn at random, not in blocks.", "Misunderstanding bootstrapping."]]}, "M10 L3#13–14": {"q": "How does branching in a random forest tree differ from a single tree?", "o": [["Randomly pick a small set of factors, then branch on the best factor in that set", "Each branch sees only a random subset, so the trees end up different."], ["Branch on a random factor at a random value", "The best factor within the random set is still chosen.", "Making everything random."], ["Branch on combinations of all the factors at once", "It uses a small subset of single factors.", "Reversing the idea."], ["Branch on the single best factor overall, as before", "That is the single-tree method the slide contrasts with.", "Missing the change."]]}, "M10 L3#15–20": {"q": "How many trees does a random forest usually contain, according to the slides, and which one is used?", "o": [["Usually 500–1,000; all of them are combined", "Each tree may give a different model, so no single one is chosen."], ["Usually 5–10; the most accurate one is used", "Forests are much larger, and they combine rather than choose.", "Treating it as model selection."], ["Usually 500–1,000; the one with the lowest training error is used", "No tree is picked; the forest combines them.", "Treating it as model selection."], ["Exactly one per factor; each tree uses only its own factor", "Tree count isn’t tied to the number of factors.", "Inventing a rule."]]}, "M10 L3#21–26": {"q": "How does a random forest give its answer for regression and for classification?", "o": [["Regression: the average predicted response; classification: the most common predicted response", "Averaging and voting combine all the trees."], ["Regression: the median; classification: the class of the first tree", "The slides say average and most common.", "Misremembering the rules."], ["Regression: the most common prediction; classification: the average", "That swaps the two.", "Reversing the pair."], ["Both: the prediction of the tree with the most leaves", "No single tree decides.", "Treating it as selection."]]}, "M10 L3a#2": {"q": "How does the lecture define explainability (interpretability)?", "o": [["How easy it is to know how a model creates its output", "It is about understanding how predictor values affect the result."], ["How accurately a model predicts new data", "That’s predictive quality, which can rise as explainability falls.", "Mixing up the two."], ["How many factors a model uses", "A model with few factors can still be hard to explain.", "Confusing size with clarity."], ["How quickly a model can be computed", "Speed isn’t part of the definition.", "Naming the wrong property."]]}, "M10 L3a#3–6": {"q": "In the movie-ticket regression, the coefficient on the top four stars’ salary is 0.25. How is it read?", "o": [["Each extra dollar of star salary adds a quarter ticket: $4 per ticket", "A linear regression coefficient gives a clear per-unit effect."], ["Star salary explains 25% of ticket sales", "A coefficient is a per-unit effect, not a share explained.", "Reading it as R²."], ["Each extra dollar of salary adds 4 tickets", "0.25 tickets per dollar means it takes $4 for one ticket.", "Inverting the coefficient."], ["Star salary raises sales by 25% over the baseline", "It adds tickets per dollar, not a percentage.", "Reading it as a percent change."]]}, "M10 L3a#7–12": {"q": "The regression tree says star salary’s effect is 1/3 if there are 5 or fewer similar movies; otherwise 1/2 if rated restrictive; otherwise 1/6 with 97+ days left; otherwise 0. Why does the slide call this “not so helpful”?", "o": [["It’s exactly what the model says, but the chain of conditions doesn’t explain why", "A tree can be described precisely and still be hard to understand."], ["The tree’s numbers are wrong", "They are what the model gives.", "Doubting the model rather than its explainability."], ["Trees can’t use yes/no factors like rating", "The tree branches on rating.", "Misreading the tree."], ["The tree ignores star salary", "The tree states salary’s effect for every branch.", "Misreading the tree."]]}, "M10 L3a#13–14": {"q": "What does a random forest tell you about its variables, according to the slides?", "o": [["The relative branching importance of each variable, but not how it affects the result", "That’s not precise enough for interpretability or explainability."], ["Each variable’s coefficient, averaged over the trees", "Forest trees don’t share coefficients to average.", "Treating a forest like a regression."], ["Nothing at all about the variables", "It does give relative importance.", "Understating what it reports."], ["Which variables cause the response", "Importance is about usefulness for branching, not cause.", "Reading cause into importance."]]}, "M10 L3a#15–20": {"q": "On the slides’ scale from more to less explainable, what is the order, and what can the less explainable end offer?", "o": [["Linear regression, regression tree, random forest; sometimes better results on complex patterns", "Less explainable models can identify and model more complex patterns."], ["Random forest, regression tree, linear regression; always better results", "The order is reversed, and better results aren’t guaranteed.", "Reversing the scale."], ["Regression tree, linear regression, random forest; faster computation", "A linear regression is the most explainable.", "Misplacing the tree."], ["Linear regression, random forest, regression tree; easier adoption", "A forest is the least explainable, and adoption is easier for explainable models.", "Misplacing the forest."]]}, "M10 L3a#21": {"q": "Besides helping us understand “why,” which two reasons do the slides give for preferring a more explainable model?", "o": [["Decision-makers are more likely to use it, and it’s sometimes legally required", "Both can matter more than a gain in accuracy."], ["It always predicts better, and it needs less data", "Neither is claimed; less explainable models sometimes predict better.", "Inventing advantages."], ["It never overfits, and it runs faster", "Neither is the slides’ reason.", "Inventing advantages."], ["It uses more factors, and it handles missing data", "Neither is the slides’ reason.", "Inventing advantages."]]}, "M10 L4#11": {"q": "The slide also writes the logistic model as log(p / (1 − p)) = a₀ + a₁x₁ + … + aⱼxⱼ. What does this form say?", "o": [["The log of the odds is a linear function of the predictors", "It is the same model rearranged; p / (1 − p) is the odds."], ["The probability p is a linear function of the predictors", "That’s linear regression, which can leave the 0–1 range.", "Missing the transformation."], ["The predictors must be logged before fitting", "The log is on the response side.", "Misplacing the log."], ["p is always below 0.5", "p can be anywhere from 0 to 1.", "Misreading the formula."]]}, "M10 L4#12–16": {"q": "With 0/1 responses, plotted points sit on top of each other at 0 and 1. The slides instead show, at each x value, the fraction of responses that are 1. What should you keep in mind with such a chart?", "o": [["Bars based on very few observations, often at the ends, can be extreme", "A bar of 0 or 1 from one or two data points says little; mind how many observations each bar represents."], ["Every bar is equally reliable, since each is a fraction", "Fractions from few observations are much noisier.", "Ignoring sample size."], ["A bar above 0.5 means the model predicts 1 there", "The chart shows observed fractions, not model predictions.", "Confusing data with the model."], ["The chart shows the logistic coefficients", "It shows observed fractions.", "Misreading the chart."]]}, "M10 L4#17–18": {"q": "Which of these carries over from linear regression to logistic regression, according to the slides?", "o": [["Transformations, interaction terms, variable selection, trees and random forests", "All appear on the slide as similarities."], ["A closed-form solution for the coefficients", "That’s listed as a difference: logistic regression has none.", "Mixing up similarities and differences."], ["R² as the fraction of variance explained", "Logistic regression has only pseudo R².", "Mixing up similarities and differences."], ["Responses that can be any real number", "Logistic responses are probabilities.", "Missing the point of logistic regression."]]}, "M10 L4#19–24": {"q": "Which differences between logistic and linear regression do the slides list?", "o": [["Longer to compute, no closed-form solution, harder to judge model quality", "It is still fast, but fitting is iterative and R² doesn’t carry over."], ["Can’t use interaction terms or variable selection", "Those are listed as similarities.", "Mixing up the lists."], ["Needs categorical predictors only", "It uses any predictors.", "Inventing a limit."], ["Can’t be used inside trees or forests", "Logistic regression trees and random logistic regression forests are listed.", "Mixing up the lists."]]}, "M10 L4#25–26": {"q": "A logistic regression reports a pseudo R² of 0.35. What does that mean?", "o": [["It’s a quality measure for comparing models, not the fraction of variance explained", "The slide says pseudo R² doesn’t really measure the fraction of variance."], ["The model explains 35% of the variance in the response", "That’s linear-regression R²; pseudo R² isn’t that.", "Carrying R² over to logistic regression."], ["35% of predictions are correct", "It isn’t an accuracy.", "Misreading the measure."], ["The p-value of the model is 0.35", "It isn’t a p-value.", "Misreading the measure."]]}, "M10 L4#27–28": {"q": "How does the slide use logistic regression for classification?", "o": [["Answer “yes” if p is at least a threshold, e.g. give the loan if p ≥ 0.7", "Thresholding turns the probability into a yes/no decision."], ["Answer “yes” whenever p is above 0", "Almost every p is above 0.", "Missing the threshold."], ["Always use 0.5 as the threshold", "The slide’s example uses 0.7; the threshold is a choice.", "Assuming a fixed threshold."], ["Refit the model with a 0/1 response", "It already has one; classification just applies a threshold.", "Misunderstanding the step."]]}, "M10 L4#29–30": {"q": "What does the ROC curve plot?", "o": [["Sensitivity against 1 − specificity, one point per threshold", "Sensitivity = TP/(TP + FN); specificity = TN/(TN + FP)."], ["Specificity against sensitivity, one point per data point", "It is one point per threshold, with 1 − specificity on the x-axis.", "Misplacing the axes."], ["The predicted probability against each predictor", "That’s the logistic curve.", "Mixing up the two curves."], ["Accuracy against the threshold", "Neither axis is accuracy.", "Misreading the chart."]]}, "M10 L4#31–35": {"q": "Joe repaid his loan; Moe did not. What is the AUC, and what value means just guessing?", "o": [["The chance the model scores Joe higher than Moe; 0.5", "AUC is the probability a random “yes” is estimated higher than a random “no.”"], ["The chance the model scores Joe higher than Moe; 0", "A model that always ranks wrong would score 0; guessing scores 0.5.", "Misplacing the baseline."], ["The share of loans classified correctly; 0.5", "That’s accuracy at one threshold, not AUC.", "Mixing up AUC and accuracy."], ["The share of loans repaid; 1", "AUC isn’t a repayment rate.", "Misreading the measure."]]}, "M10 L4#36–37": {"q": "What is the slides’ caveat about ROC and AUC?", "o": [["A quick-and-dirty quality estimate that doesn’t differentiate the costs of false negatives and false positives", "AUC ignores misclassification costs. To find the highest-value model, value the confusion matrix instead."], ["They only work for linear regression", "They are for classifiers such as logistic regression.", "Misplacing the tool."], ["They require a threshold of exactly 0.5", "The curve covers all thresholds.", "Misreading the curve."], ["They always favor the more explainable model", "AUC says nothing about explainability.", "Inventing a property."]]}, "M10 L5#2–3": {"q": "Which kinds of models do confusion matrices evaluate, according to the slides?", "o": [["Classification-type models, such as SVM, k-nearest-neighbor and logistic regression", "Each compares the model’s class with the true class."], ["Only logistic regression", "Any classification-type model works.", "Limiting the tool."], ["Regression models that predict a number", "A number has no category to confuse.", "Mixing up model types."], ["Clustering models with no known classes", "A confusion matrix needs the true classes.", "Mixing up supervised and unsupervised."]]}, "M10 L5#4–5": {"q": "Using the slide’s guidelines, what is a false negative?", "o": [["A point in the category that the model says is not", "“Negative” is what the model said; “false” means it was wrong."], ["A point not in the category that the model says is", "That is a false positive.", "Swapping the two errors."], ["A point not in the category, correctly classified", "That is a true negative.", "Misreading “false.”"], ["Any point the model is unsure about", "Every point gets a class.", "Inventing a category."]]}, "M10 L5#6–7": {"q": "In the spam example (real email = positive): TP 490, FN 10, FP 100, TN 400. Why is the share of the inbox that is spam 100 / (100 + 490), about 17%?", "o": [["The inbox holds everything the model calls real (TP + FP), and FP of them are spam", "Spam in the inbox is spam the model called real."], ["The inbox holds all 1,000 emails, and 100 are spam", "Filtered email doesn’t reach the inbox.", "Using the wrong denominator."], ["The inbox holds the 500 real emails, and 100 are spam", "Real email filtered out (FN) isn’t in the inbox.", "Using the wrong denominator."], ["The inbox holds TN + FN, and 100 of those are spam", "TN and FN are what the model filtered.", "Mixing up the columns."]]}, "M10 L5#8–10": {"q": "In the same spam example, what share of real email is wrongly filtered as spam?", "o": [["2%: FN / (TP + FN) = 10 / 500", "All truly real email is TP + FN."], ["1%: 10 / 1,000", "The denominator is the real email only.", "Using all email."], ["17%: 100 / 590", "That is the share of the inbox that is spam.", "Mixing up the two measures."], ["20%: 100 / 500", "That is the share of spam let through.", "Using the wrong row."]]}, "M10 L5#11": {"q": "Sensitivity, hit rate, recall and true positive rate appear as separate measures on the slides. What do they have in common?", "o": [["They’re all TP / (TP + FN)", "They are different names for the same measure."], ["They’re all TN / (TN + FP)", "That’s specificity.", "Mixing up the rows."], ["They’re all TP / (TP + FP)", "That’s positive predictive value (precision).", "Mixing up the denominators."], ["They’re all (TP + TN) / total", "That’s accuracy.", "Mixing up measures."]]}, "M10 L5#12–13": {"q": "The slides show a crowd of measures (hit rate, fall-out, recall, likelihood ratios, …). What is the lecture’s advice about them?", "o": [["Understand the confusion matrix and work out the measure you need", "Many have several names; memorizing them all isn’t the point."], ["Memorize every measure, since each is tested separately", "The lecture says not to get bogged down in them.", "Missing the advice."], ["Use only accuracy, since the others are redundant", "Accuracy ignores the kinds of mistakes.", "Picking the wrong measure."], ["Use the diagnostic odds ratio for every model", "No single measure is recommended for all cases.", "Inventing a rule."]]}, "M10 L6#2–4": {"q": "A spam filter (real email = positive) has TP = 490, FN = 10, FP = 100, TN = 400. How many real emails were wrongly sent to spam?", "o": [["10 (the false negatives)", "Real emails classified as spam are FN here."], ["100", "Those are spam emails let into the inbox (FP).", "Swapping FP and FN."], ["490", "Those were correctly delivered.", "Wrong cell."], ["400", "Those are spam correctly caught.", "Wrong cell."]]}, "M10 L6#5–8": {"q": "What costs does the lecture assign to the spam filter’s outcomes?", "o": [["$0 for correct, $0.04 to read a spam, $1 to miss a real message", "These are estimates of lost productivity."], ["$1 to read a spam, $0.04 to miss a real message", "That swaps the two costs.", "Reversing the costs."], ["$0.04 for every email, right or wrong", "Correct classifications cost nothing.", "Ignoring the outcome."], ["$1 for every mistake of either kind", "The two mistakes cost very different amounts.", "Treating mistakes as equal."]]}, "M10 L6#9–15": {"q": "With 50% spam and TP 490, FN 10, FP 100, TN 400, why is the total cost $14 (1.4¢ per email)?", "o": [["10 lost real emails × $1 + 100 spams read × $0.04 = $10 + $4", "Correct classifications cost $0; divide $14 by 1,000 emails for 1.4¢."], ["110 mistakes × about $0.13 each", "Each kind of mistake has its own cost.", "Averaging the costs."], ["490 × $0.04 − 10 × $1", "Correct real emails cost nothing.", "Costing the wrong cells."], ["100 spams read × $0.10 + 10 lost emails × $0.40", "The costs are $0.04 and $1.", "Using the wrong costs."]]}, "M10 L6#16–18": {"q": "If only 40% of email is spam, the lecture scales the real-email row by 60/50 and the spam row by 40/50, giving $15.20. Why does the cost go up when there’s less spam?", "o": [["More real email means more of the expensive mistake: lost real messages", "10 × 1.2 × $1 = $12, plus 100 × 0.8 × $0.04 = $3.20."], ["Less spam means each spam read costs more", "The cost per mistake doesn’t change.", "Changing the costs instead of the counts."], ["The model has to be retrained, which costs money", "Only the counts are rescaled.", "Misreading the step."], ["It doesn’t: $15.20 is less than $14", "$15.20 is more.", "Misreading the numbers."]]}, "M10 L6#22–25": {"q": "A second filter gives TP 450, FN 50, FP 50, TN 450: only 10% of the inbox is spam, versus 17% for the first. Why is it worse?", "o": [["It loses 50 real emails: $50 + $2 = $52, or 5.2¢ per email versus 1.4¢", "It cuts the cheap mistake and adds more of the expensive one."], ["It makes more mistakes in total", "It makes 100 mistakes, fewer than the first filter’s 110.", "Counting mistakes instead of costing them."], ["It lets more spam into the inbox", "It lets less spam in: 10% of the inbox.", "Misreading the result."], ["It has a lower AUC", "The comparison is by cost, and AUC isn’t given.", "Using the wrong measure."]]}, "M10 L6#26–27": {"q": "The lecture shows a real email (an “Overdue Notification”) that landed in the junk folder. Which cell does it illustrate, with real email as positive?", "o": [["False negative: a real message the model called spam", "It’s the $1 mistake, and the reason a filter that loses real mail can cost more."], ["False positive: a spam the model let through", "The message was real and was filtered.", "Swapping the two errors."], ["True negative: spam correctly filtered", "The message wasn’t spam.", "Misreading the example."], ["True positive: real mail kept in the inbox", "It didn’t reach the inbox.", "Misreading the example."]]}, "M10 L7#5–7": {"q": "When does the lecture use Poisson regression, and what is estimated?", "o": [["When the response follows a Poisson distribution, like arrivals at airport security; λ(x)", "The arrival rate is a function of factors such as time."], ["When the response is a probability; p(x)", "That’s logistic regression.", "Mixing up methods."], ["When there’s little data and an expert opinion; a prior", "That’s Bayesian regression.", "Mixing up methods."], ["When the response changes shape across the data; knots", "That’s splines.", "Mixing up methods."]]}, "M10 L7#8–13": {"q": "Which describes regression splines as presented?", "o": [["Polynomials fit to different parts of the data, with smooth connections; order-k means order-k polynomials", "MARS (the slide says “multi-adaptive”; the standard name is multivariate adaptive regression splines) is an example, called “Earth” in many libraries."], ["One high-degree polynomial fit to all the data", "Splines fit different pieces to different parts.", "Missing the pieces."], ["Separate lines with jumps where they meet", "The connections are smooth.", "Missing the smoothness."], ["Averages of the k closest data points", "That’s KNN regression.", "Mixing up methods."]]}, "M10 L7#14–18": {"q": "In the lecture’s Bayesian regression example (a child’s adult height from the parents’ heights), what is the expert opinion, and when is the method most helpful?", "o": [["Coefficients uniformly distributed between 0.8 and 1.2; when there isn’t much data", "Bayes’ theorem updates the starting distribution with the data."], ["Coefficients exactly 1.0; when there’s a lot of data", "The prior is a distribution, and it helps most with little data.", "Missing the distribution."], ["The child’s height is uniform between 0.8 and 1.2 m; with any data", "The prior is on the coefficients.", "Misplacing the prior."], ["Coefficients from a linear regression; when the response is a count", "The prior comes from expert opinion.", "Mixing up methods."]]}, "M10 L7#19–20": {"q": "How does KNN regression predict a response?", "o": [["Average the responses of the k closest data points", "It plots the data and uses no prediction function."], ["Take the most common class among the k closest points", "That’s KNN classification.", "Mixing up regression and classification."], ["Fit a regression on the k closest points", "It just averages them.", "Adding a step."], ["Average all the data points", "Only the k closest.", "Ignoring the neighbors."]]}, "M11 L1#6–8": {"q": "When does having many factors in a model create a danger of overfitting?", "o": [["When the number of factors is close to, or more than, the number of data points", "Then the model has enough flexibility to fit random effects as well as real ones."], ["Whenever there are more than 10 factors, regardless of data size", "It depends on factors relative to data points, not a fixed count.", "Using a fixed cutoff."], ["Only when the factors are correlated", "Correlation is a separate issue; too many factors per point overfits even if uncorrelated.", "Confusing overfitting with collinearity."], ["Only when the response is a probability", "Overfitting applies to any factor-based model.", "Limiting it to one model type."]]}, "M11 L1#9–14": {"q": "A regression fit to several 3-point samples gives very different estimates for the same parents' height. What does this show?", "o": [["With few points per factor, estimates are driven by random effects in each sample", "Each line fits that sample's random taller- or shorter-than-expected points."], ["Parents' height doesn't affect children's height", "The real effect exists; the small samples just distort it.", "Confusing noise with no effect."], ["The sample with the steepest line is the right one", "No single small sample is trustworthy.", "Trusting one noisy fit."], ["Regression only works with one factor", "The problem is too few points per factor, not regression itself.", "Blaming the method."]]}, "M11 L1#15–16": {"q": "Twenty independent factors each have p-value 0.05. About how likely is it that at least one is really meaningless?", "o": [["About 64% (1 − 0.95²⁰)", "Following the lecture's reasoning (each treated as having a 5% chance of being meaningless), all 20 being real is 0.95²⁰ ≈ 0.36, so 1 − 0.36 ≈ 64%. Strictly, a p-value isn't the probability that a factor is meaningless; this is the lecture's simplification."], ["About 5%", "5% is for one factor; it compounds across 20.", "Not compounding."], ["100%", "Likely, but not certain.", "Overstating."], ["About 20%", "That would be adding 1% per factor; it isn't how probabilities combine.", "Adding probabilities wrongly."]]}, "M11 L1#17–22": {"q": "Adult height vs. the temperature 37 days after birth: all the data give a flat line, but some 3-point subsets give clear slopes. What does that show?", "o": [["With few data points, a model can find effects that don't exist (overfitting)", "The factor has no real effect; small samples fit random patterns."], ["Temperature after birth really affects height", "The full data shows essentially no effect.", "Trusting a small-sample fit."], ["The full-data line is wrong because it's flat", "Flat is the right answer here.", "Reversed."], ["3-point fits are more accurate because they're simpler", "Fewer points means more noise, not more accuracy.", "Confusing few points with a simple model."]]}, "M11 L1#23–29": {"q": "A lender removes race, sex, religion and marital status from its data. Why might a regulator still reject a complex credit model?", "o": [["Other factors, like zip code, can stand in for forbidden ones, and a complex model makes that hard to rule out", "Proxies can let the model use forbidden information indirectly."], ["Regulators reject every model with more than 10 factors", "There's no such fixed rule; the issue is showing it doesn't use forbidden information.", "Inventing a rule."], ["Removing columns always lowers accuracy below legal limits", "Accuracy isn't the legal issue.", "Wrong concern."], ["Because R² must be reported for credit models", "R² isn't the issue.", "Wrong concern."]]}, "M11 L2#4–6": {"q": "How does forward selection work?", "o": [["Start with no factors; at each step add the best factor if the improvement is good enough", "Stop when nothing left is good enough or the model is as large as you want."], ["Start with all factors; remove the worst one each step", "That's backward elimination.", "Swapping the two."], ["Try every subset of factors and pick the best", "That's not greedy step-by-step selection.", "Confusing with exhaustive search."], ["Shrink all coefficients toward zero", "That's ridge regression.", "Wrong method."]]}, "M11 L2#7–8": {"q": "Why are forward selection, backward elimination and stepwise called greedy?", "o": [["Each step does what looks best now, without considering future options", "That's the definition of a greedy algorithm."], ["They use all the data", "Unrelated to the name.", "Guessing."], ["They always find the best possible model", "Greedy methods aren't guaranteed to.", "Overstating."], ["They add as many factors as possible", "They stop when improvements aren't good enough.", "Misreading “greedy.”"]]}, "M11 L2#9–10": {"q": "What makes stepwise regression different from forward selection?", "o": [["After each addition, it removes any factors that no longer look good", "A new factor can make an earlier one unnecessary."], ["It never removes a factor once added", "That describes plain forward selection (apart from its optional clean-up at the end).", "Reversing the difference."], ["It uses a budget on the coefficients", "That's lasso.", "Wrong method."], ["It only works with BIC", "It can use p-values, AIC, BIC or R².", "Overly narrow."]]}, "M11 L2#11–15": {"q": "Why are forward selection, backward elimination and stepwise regression called greedy?", "o": [["At each step they take whatever looks best right now, without considering future steps", "So they can miss the best overall subset."], ["They use as many factors as possible", "They add or remove one at a time.", "Misreading \"greedy\"."], ["They always find the best subset", "Greedy steps don't guarantee that.", "Overstating."], ["They need far more data than lasso", "Not the meaning of greedy.", "Wrong reason."]]}, "M11 L2#16–20": {"q": "How should the lasso budget τ be chosen?", "o": [["Try several values and pick the best trade-off between number of variables and model quality", "It depends on how many variables you want and how quality changes."], ["Always use τ = 1", "There's no universal value.", "Using a default blindly."], ["Use the largest τ possible", "That just gives ordinary regression.", "Maximizing fit."], ["τ equals the number of factors", "τ is a budget on coefficient sizes.", "Confusing quantities."]]}, "M11 L2#21–23": {"q": "If the absolute-value term is removed from the elastic net, what model remains?", "o": [["Ridge regression", "Only the squared-coefficient constraint is left."], ["Lasso", "Lasso is what you get by removing the squared term.", "Swapping them."], ["Stepwise regression", "Stepwise isn't a constrained optimization.", "Wrong family."], ["Ordinary least squares, always", "Not unless the remaining constraint doesn't bind.", "Overlooking the remaining constraint."]]}, "M11 L2#24": {"q": "What does the lasso add to a standard regression?", "o": [["A limit on the sum of the absolute values of the coefficients (Σ|aⱼ| ≤ τ)", "The regression spends this budget on the most important factors; the rest get 0."], ["A limit on the number of data points", "The budget is on coefficients.", "Wrong constraint."], ["A penalty on squared coefficients only", "That's ridge.", "Swapping lasso and ridge."], ["A requirement that every coefficient be positive", "No sign requirement.", "Inventing a constraint."]]}, "M11 L2a#2–6": {"q": "In two dimensions, what shape is the set of coefficients allowed by the lasso, and by ridge?", "o": [["Lasso: a diamond; ridge: a circle", "|a₁| + |a₂| ≤ τ is a diamond; a₁² + a₂² ≤ τ is a circle."], ["Lasso: a circle; ridge: a diamond", "Reversed.", "Swapping them."], ["Both are squares", "Neither is a square.", "Guessing."], ["Both are ellipses", "The ellipses are the error contours.", "Mixing up the error and the constraint."]]}, "M11 L2a#7–9": {"q": "Why does the lasso usually set some coefficients to exactly 0, while ridge doesn't?", "o": [["The error ellipses tend to first touch the diamond at a corner on an axis, but touch the circle between axes", "Corners have a zero coordinate; the circle has no corners."], ["Ridge uses a smaller τ", "It's the shape, not the size.", "Wrong reason."], ["Lasso ignores the error function", "Both minimize the same error.", "Misunderstanding the objective."], ["Ridge rounds coefficients up", "No rounding is involved.", "Inventing a mechanism."]]}, "M11 L2a#13–14": {"q": "In two dimensions, what shapes are the lasso and ridge constraint regions?", "o": [["Lasso: a diamond with corners on the axes; ridge: a circle", "|a₁| + |a₂| ≤ τ vs a₁² + a₂² ≤ τ."], ["Lasso: a circle; ridge: a diamond", "Reversed.", "Swapped shapes."], ["Both are squares", "Neither is a square.", "Wrong shape."], ["Both are ellipses", "The error contours are the ellipses.", "Mixing the region with the error contours."]]}, "M11 L2a#15–19": {"q": "In the two-coefficient picture, where is the lasso or ridge solution?", "o": [["Where the smallest error ellipse first touches the allowed region", "Larger ellipses mean larger error, so the first touch is the best allowed point."], ["At the center of the allowed region", "The center (all zeros) usually has large error.", "Ignoring the error."], ["At the center of the error ellipses, always", "Only if that point is inside the region.", "Forgetting the constraint."], ["Wherever the region is widest", "Width doesn't decide it.", "Wrong rule."]]}, "M11 L2a#20–24": {"q": "Why does lasso often set coefficients exactly to zero?", "o": [["Its diamond region has corners on the axes, which the error ellipse usually touches first", "At a corner, one coefficient is 0, so that variable is dropped."], ["Because it uses a different error function from ridge", "Both minimize the same squared error.", "Wrong reason."], ["Because its region is round", "That's ridge, which rarely gives zeros.", "Swapped shapes."], ["It never does", "That is lasso's main feature.", "Wrong."]]}, "M11 L2a#25–26": {"q": "Why does ridge regression rarely set a coefficient exactly to zero?", "o": [["Its circular region has no corners, so the ellipse almost always touches it where both coefficients are nonzero", "Ridge shrinks but keeps every variable."], ["It uses absolute values", "That's lasso.", "Swapped methods."], ["It always sets the smaller coefficient to zero", "It doesn't select variables.", "Wrong."], ["It can't be drawn in two dimensions", "It can: a circle.", "Wrong."]]}, "M11 L2b#4–8": {"q": "In the bias–variance tradeoff, what happens as a model fits the data more closely?", "o": [["It fits real patterns better but also fits more random patterns: lower bias, higher variance", "That's the overfitting direction."], ["It fits only real patterns better", "A model can't tell real from random patterns.", "Assuming selectivity."], ["Bias and variance both fall", "They trade off.", "Ignoring the tradeoff."], ["Bias rises and variance falls", "That's what happens when fitting less.", "Reversing the direction."]]}, "M11 L2b#9–12": {"q": "Why does removing variables and shrinking coefficients add bias?", "o": [["The model misses or minimizes real effects, and predictions drift toward a₀", "That's underfitting real patterns."], ["It makes the data biased", "The data don't change; the model's fit does.", "Confusing model bias with data bias."], ["It increases the variance of predictions", "It reduces it.", "Reversing the effect."], ["It always improves predictions", "Only up to a point; too much underfits.", "Overgeneralizing."]]}, "M11 L2b#13–18": {"q": "Besides validation, what helps a model focus on real patterns rather than random ones?", "o": [["Talking with experts in the field", "Physicians, marketers or engineers know which effects are plausible."], ["Adding more factors", "That raises the risk of fitting random patterns.", "Overfitting."], ["Using only the training data", "Training data can't separate real from random.", "Missing the point."], ["Maximizing R²", "Training R² rewards random fits.", "Chasing fit."]]}, "M11 L2b#20–23": {"q": "On a graph of error vs. level of fit, where is total error smallest?", "o": [["At a sweet spot in the middle, where underfitting error and overfitting error balance", "Underfitting error falls and overfitting error rises as fit increases."], ["At the most complex fit", "Overfitting error is largest there.", "More fit = better."], ["At the simplest fit", "Underfitting error is largest there.", "Simpler = better."], ["Anywhere; total error is constant", "It's U-shaped.", "Wrong."]]}, "M11 L2c#2–3": {"q": "What is ridge regression mainly used for?", "o": [["Reducing overfitting by shrinking every coefficient (regularization)", "It reduces variance at the cost of some bias."], ["Selecting a small set of variables", "Ridge keeps all variables.", "Confusing with lasso."], ["Classifying data into two groups", "It's a regression method.", "Wrong task."], ["Increasing the model's fit to the training data", "It decreases the fit.", "Reversing the effect."]]}, "M11 L2c#4–10": {"q": "What does ridge regression do to the coefficients when the ordinary regression solution lies outside its circle?", "o": [["It shrinks all of them toward 0", "Tighter circles shrink them more."], ["It sets some of them to exactly 0", "That's the lasso.", "Confusing with lasso."], ["It leaves them unchanged", "That happens only if the solution is already inside the circle.", "Missing the binding case."], ["It makes them all equal", "It pulls them toward each other but doesn't equalize them.", "Overstating."]]}, "M11 L2c#11–14": {"q": "What happens if the ridge budget τ is made too small?", "o": [["The model may become underfit", "Coefficients shrink so much that real effects are lost."], ["The model becomes more overfit", "Shrinking reduces overfitting; too much causes underfitting.", "Reversing the effect."], ["Variables are removed", "Ridge doesn't remove variables.", "Confusing with lasso."], ["Nothing changes", "A tighter budget shrinks coefficients more.", "Ignoring the constraint."]]}, "M11 L3#4–8": {"q": "When are greedy methods like stepwise regression most appropriate?", "o": [["For quick, initial data exploration", "They point out factors worth investigating; refine later with lasso or elastic net."], ["For building the final predictive model", "Lasso or elastic net usually predict better.", "Overusing greedy methods."], ["When there are more factors than data points", "That's when overfitting is most dangerous.", "Wrong situation."], ["Never", "They're useful for exploration.", "Dismissing them."]]}, "M11 L3#9–13": {"q": "What is a drawback of ridge regression when there are some good predictors?", "o": [["Their coefficients may be underestimated, since ridge pulls coefficients toward each other", "Larger coefficients cost more in the constraint."], ["It removes them from the model", "Ridge keeps every variable.", "Confusing with lasso."], ["It can't be used with scaled data", "It should be used with scaled data.", "Wrong concern."], ["It always overfits", "It reduces overfitting.", "Reversing the effect."]]}, "M11 L3#14–15": {"q": "Why can accepting some bias reduce prediction error?", "o": [["Prediction error comes from bias² and variance; a bit more bias can buy a larger drop in variance", "That's the idea behind lasso and ridge."], ["Bias never affects prediction error", "It's one of the two parts.", "Ignoring bias."], ["Variance is always zero for simple models", "It's lower, not zero.", "Overstating."], ["Biased models always predict best", "Too much bias underfits.", "Overgeneralizing."]]}, "M11 L3#16–17": {"q": "Two highly correlated tests, one cheap and one expensive, could both predict well. What might the lasso do?", "o": [["Keep only one of them, possibly the expensive one", "Check correlations yourself and remove the expensive test if needed."], ["Always keep the cheaper one", "Lasso doesn't know about costs.", "Assuming it does."], ["Keep both with equal coefficients", "That's closer to what ridge does.", "Confusing with ridge."], ["Drop both", "It usually keeps one of a correlated pair.", "Overstating."]]}, "M11 L3#18–21": {"q": "Which variable-selection method should you use?", "o": [["There's no reliable rule: try several and use judgment", "Analytics is partly art; compare results."], ["Always lasso", "No single method always wins.", "One-size-fits-all."], ["Always stepwise, because it's fastest", "Speed isn't the criterion.", "Wrong criterion."], ["Whichever gives the highest training R²", "Training R² rewards overfitting.", "Using the wrong metric."]]}, "M12 L1#4–6": {"q": "When is design of experiments needed?", "o": [["When the data don't exist yet and you must design how to collect a useful subset quickly and efficiently", "DOE plans data collection so it can answer the question."], ["Only after a model has been built", "DOE is most useful before collecting data.", "Wrong timing."], ["Whenever a data set is very large", "Size isn't the trigger; missing data is.", "Wrong trigger."], ["Only in agriculture", "It's used in marketing, retail, polling, medicine and more.", "Too narrow."]]}, "M12 L1#8–14": {"q": "To test whether red used cars sell for more than blue ones, why must other factors be controlled?", "o": [["Otherwise differences in age or car type could explain the price gap instead of color", "The groups need the same mix of other important features."], ["Because color can't be measured accurately", "Measurement isn't the issue.", "Wrong concern."], ["To make the sample larger", "Control is about comparability, not size.", "Confusing goals."], ["Control isn't needed if both groups are large", "Large but different groups are still confounded.", "Trusting size."]]}, "M12 L1#15–18": {"q": "What does blocking on car type do in the red-vs-blue car study?", "o": [["Reduces the variability of estimates by analyzing sports cars and family cars separately", "Each block has lower variance than all cars together."], ["Removes color from the analysis", "Color is still what's being tested.", "Confusing the roles."], ["Increases the sample size", "Blocking doesn't add data.", "Wrong effect."], ["Makes car type the response", "Price is still the response.", "Confusing roles."]]}, "M12 L1#19–20": {"q": "Why analyze red sports cars and red family cars separately when studying red cars?", "o": [["Car type is a blocking factor: it creates variation, so accounting for it lowers the variance of the estimates", "Sports cars are more often red, which adds variation."], ["To make the sample larger", "Splitting makes each group smaller.", "Wrong reason."], ["Because color doesn't matter", "Color is what's being studied.", "Wrong."], ["Blocking removes the need for randomization", "You still randomize within blocks.", "Overstating."]]}, "M12 L2#3–5": {"q": "Ad A: 46 clicks in 1,003 displays; ad B: 97 in 997. What kind of data is this, and what's the likely conclusion?", "o": [["Binomial data for each ad; a hypothesis test would show B is very likely better", "About 4.6% vs 9.7% on roughly 1,000 displays each."], ["Normal data; the ads are equally good", "The gap is far too large to be chance.", "Misjudging the gap."], ["Geometric data; A is better", "Clicks out of displays are binomial, and B has more clicks.", "Wrong distribution and conclusion."], ["It can't be analyzed because the counts differ", "Comparing proportions handles different counts.", "Wrong concern."]]}, "M12 L2#6–9": {"q": "Which three things does an A/B test need?", "o": [["Fast enough data collection, a representative sample, and a test that's small compared with the total population", "Otherwise the answer is late, doesn't apply, or has little left to benefit."], ["Exactly 2,000 trials, equal group sizes and a 5% threshold", "Those are details of one example, not requirements.", "Mistaking an example for a rule."], ["A complete data set, a regression model and a validation set", "A/B testing collects new data.", "Wrong setting."], ["Two factors, three levels each, and ANOVA", "That's a factorial design.", "Confusing methods."]]}, "M12 L2#10–13": {"q": "If only 2,500 views of an ad are expected, why is testing on the first 2,000 a problem?", "o": [["Too few views are left to benefit from the answer", "The test should be small relative to the population."], ["2,000 is too few to run a test", "It's plenty; the problem is what's left.", "Wrong problem."], ["The test can't be randomized", "It can be.", "Wrong problem."], ["It isn't a problem", "Most of the audience would be used up.", "Missing the condition."]]}, "M12 L3#3–5": {"q": "Three features with two choices each: how many combinations does a full factorial design test?", "o": [["8", "2 × 2 × 2 = 8."], ["6", "That adds choices instead of multiplying.", "Adding instead of multiplying."], ["3", "That's the number of features.", "Counting features."], ["4", "That's a fractional design.", "Confusing with fractional."]]}, "M12 L3#6": {"q": "What makes a fractional factorial design balanced?", "o": [["Each choice appears equally often, and each pair of choices appears equally often", "For 3 two-choice factors in 4 runs: each choice twice, each pair once."], ["Every combination is tested once", "That's a full factorial.", "Confusing with full."], ["Half the features are tested", "All features are tested; only some combinations.", "Misreading “fractional.”"], ["Each combination is tested on an equal number of people", "That's about sample size, not the design's balance.", "Wrong meaning."]]}, "M12 L3#7": {"q": "When can regression on categorical factors estimate each choice's effect from a subset of combinations?", "o": [["When the factors are roughly independent (few significant interactions); add interaction terms where needed", "White text on a white background is a clear interaction."], ["Only when every combination is tested", "A subset can work if factors are independent.", "Requiring a full design."], ["Only when the response is a probability", "The response here is clicks.", "Wrong condition."], ["Never; regression can't use categorical factors", "Categorical variables work in regression.", "Wrong belief."]]}, "M12 L4#4–7": {"q": "What do exploration and exploitation mean?", "o": [["Exploration: get more information; exploitation: use the best-looking option for immediate value", "Bandits balance the two."], ["Exploration: use the best option; exploitation: test new ones", "Reversed.", "Swapping them."], ["Both mean collecting more data", "Exploitation is about using what you know.", "Merging them."], ["They are two kinds of hypothesis test", "They're goals, not tests.", "Wrong category."]]}, "M12 L4#8–11": {"q": "How does a multi-armed bandit approach assign tests over time?", "o": [["Start with equal probabilities, then update them and test likely-best options more often", "It keeps exploring while increasingly exploiting."], ["Test every option the same fixed number of times", "That's the approach bandits improve on.", "Describing fixed testing."], ["Stop testing all but the leader after the first test", "It keeps testing others sometimes.", "Stopping exploration too early."], ["Pick one option at random and use it forever", "No learning happens.", "No exploration."]]}, "M12 L4#12–17": {"q": "With 10 ads tested 1,000 times each, and ad 1 best, why was value lost?", "o": [["About 9,000 displays showed a worse ad", "Every display of a worse ad loses clicks."], ["Because ad 1 was shown too often", "Showing the best ad doesn't lose value.", "Reversing the loss."], ["Because 1,000 tests is too few to learn anything", "The loss comes from showing worse ads.", "Wrong problem."], ["No value was lost", "Worse ads cost clicks.", "Ignoring the cost."]]}, "M12 L4#18–21": {"q": "Which is NOT one of the choices you make when running a multi-armed bandit?", "o": [["The true best option, set in advance", "If you knew that, you wouldn't need to test."], ["How many tests to run between recalculating probabilities", "A real parameter.", "Missed a parameter."], ["How to update the probabilities (e.g. Bayesian updating)", "A real parameter.", "Missed a parameter."], ["How to pick the next alternative to test", "A real parameter.", "Missed a parameter."]]}, "M13 L1#3–6": {"q": "In the season-ticket example, what simple model replaced a large data-collection effort?", "o": [["Each holder arrives at about the same point relative to the crowd, with deviations fitting a normal distribution", "Tracking how the stadium fills is enough."], ["A regression on weather, traffic and demographics", "That data turned out to be unnecessary.", "Using the complex model."], ["A Markov chain of seat changes", "Not the model used.", "Wrong model."], ["A Poisson model of ticket sales", "Not the model used.", "Wrong model."]]}, "M13 L1#7–11": {"q": "Why is selling an unused season-ticket seat earlier both better and riskier?", "o": [["Earlier makes the upgraded fan happier, but the ticket holder might still show up", "That trade-off is what the model must balance."], ["Earlier is always better with no risk", "The holder may arrive.", "Ignoring the risk."], ["Later is always better", "Then the upgrade is worth less.", "Ignoring the benefit."], ["Timing doesn't matter", "It's the whole question.", "Wrong."]]}, "M13 L1#20–21": {"q": "In the season-ticket example, what answered \"when to sell the upgraded seat\" without a big predictive model?", "o": [["A simple distribution of when each holder arrives relative to the crowd", "Holder X tends to arrive after about 60% of others, fairly consistently."], ["A regression on age, weather, opponent and traffic", "That needs lots of data; the simple model was enough.", "Assuming complex is necessary."], ["Asking every holder in advance", "Not the approach.", "Wrong."], ["Selling every seat at the start of the game", "That ignores the risk the holder shows up.", "Wrong."]]}, "M13 L2#4": {"q": "What does the binomial distribution describe?", "o": [["The number of yes outcomes in n independent Bernoulli trials with the same probability p", "E.g. donations from a monthly mailing."], ["The number of trials until the first yes", "That's the geometric.", "Confusing with geometric."], ["The time between arrivals", "That's the exponential.", "Wrong distribution."], ["A single yes/no event", "That's the Bernoulli.", "Wrong distribution."]]}, "M13 L2#5–6": {"q": "A charity gets far more donations one month than the binomial model makes likely. What's the reasonable conclusion?", "o": [["The donation probability p was probably different that month", "A very unlikely count suggests the constant-p assumption failed."], ["The binomial model proves p is unchanged", "The low probability is evidence against that.", "Reversing the logic."], ["Donations must be dependent on each other", "Possible, but the lesson's inference is about p changing.", "Overreaching."], ["Nothing can be concluded", "It's a hypothesis-test style inference.", "Missing the test."]]}, "M13 L2#7–9": {"q": "As n gets very large (with p fixed), what does the binomial distribution approach?", "o": [["The normal distribution", "Handy for calculations with large n."], ["The Poisson distribution", "That limit needs p to shrink as n grows (np fixed); with p fixed, it's the normal.", "Wrong limit."], ["The geometric distribution", "Unrelated limit.", "Wrong limit."], ["The uniform distribution", "Unrelated.", "Wrong limit."]]}, "M13 L2#10–13": {"q": "In a geometric model of units produced until the first defect, what is p?", "o": [["The probability of a defect, the outcome being waited for", "p can be a bad outcome; define it as the event you're counting to."], ["The probability of a good unit", "That's 1 − p here.", "Assuming p is always good."], ["The number of good units", "p is a probability.", "Confusing quantities."], ["The defect rate per hour", "That's a rate in time, not per trial.", "Mixing time and trials."]]}, "M13 L2#14–15": {"q": "Counts of travelers passed before each security pull-aside don't fit a geometric distribution. What might that suggest?", "o": [["Screeners' decisions may depend on recent history rather than each person independently", "Independent identical trials would give a geometric fit."], ["The screeners are perfectly independent", "A good fit would suggest that, not a poor one.", "Reversing the logic."], ["The data must be wrong", "The poor fit is information.", "Dismissing evidence."], ["The binomial must be used instead", "The issue is dependence, not the counting setup.", "Wrong fix."]]}, "M13 L2#16–19": {"q": "Data on hits until a bat breaks fits a geometric distribution well. What does that suggest?", "o": [["The hits behave like independent, identically distributed (i.i.d.) Bernoulli trials", "Geometric assumes i.i.d. trials."], ["Each hit makes breaking more likely", "That would break the i.i.d. assumption.", "Reversed."], ["The bat never breaks", "Wrong.", "Wrong."], ["Nothing about independence", "A geometric fit is evidence for it.", "Missing the point."]]}, "M13 L2#20–23": {"q": "Counts of people screened between searches at an airport do NOT fit a geometric distribution. What does that suggest?", "o": [["Screeners aren't deciding independently: recent history (e.g. no search in a while) affects them", "Independent decisions would give a geometric shape."], ["Screeners choose people completely at random", "Then it would fit.", "Reversed."], ["The data must be wrong", "It's a real finding.", "Blaming the data."], ["Geometric can't model counts", "It models counts until a success.", "Wrong."]]}, "M13 L3#4–7": {"q": "Why did the airport team record times between arrivals instead of counting arrivals per period?", "o": [["It was much easier to click a stopwatch at each arrival, and exponential gaps imply Poisson arrivals", "Either view describes the same process."], ["Counts can't be modeled", "They can (Poisson); gaps were just easier to collect.", "Wrong reason."], ["To get a normal distribution", "The gaps fit an exponential.", "Wrong distribution."], ["Because arrivals weren't random", "They were Poisson, i.e. random.", "Contradiction."]]}, "M13 L3#8–9": {"q": "How are Poisson arrivals and exponential inter-arrival times related?", "o": [["Poisson arrivals with r
