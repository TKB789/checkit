"points": ["Variables a\u2080 \u2026 a\u2098; constraints none.", "Objective: maximize \u03a0_{i: y\u1d62=1} p(x\u1d62) \u00b7 \u03a0_{i: y\u1d62=0} (1 \u2212 p(x\u1d62)), where p(x\u1d62) = 1 / (1 + e^\u2212(a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c)) (the likelihood). The transcript describes it loosely as minimizing prediction error."], "key": "Logistic regression maximizes the likelihood of the observed 0/1 outcomes.", "eq": ["Maximize \u03a0_{y\u1d62=1} p(x\u1d62) \u03a0_{y\u1d62=0} (1 \u2212 p(x\u1d62))", "p(x\u1d62) = 1/(1 + e^\u2212(a\u2080+\u03a3\u2c7ca\u2c7cx\u1d62\u2c7c))"]}, {"p": "17\u201318", "title": "Support vector machine models", "points": ["Hard classification: variables a\u2080 \u2026 a\u2098; constraints (a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c)y\u1d62 \u2265 1 for each i (every point correctly classified); objective printed as 'Maximize \u03a3\u2c7c a\u2c7c\u00b2'.", "Soft classification: same variables, no constraints; minimize \u03a3\u1d62 max{0, 1 \u2212 (a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c)y\u1d62} + \u03bb \u03a3\u2c7c a\u2c7c\u00b2 (errors plus margin term)."], "key": "Hard SVM: classify every point, widest margin. Soft SVM: trade errors against margin in the objective.", "watch": "Slide misprint: hard SVM should MINIMIZE \u03a3\u2c7c a\u2c7c\u00b2. The margin is 2/\u221a(\u03a3\u2c7c a\u2c7c\u00b2), so maximizing the margin means minimizing \u03a3\u2c7c a\u2c7c\u00b2 (the soft version correctly minimizes it).", "eq": ["(a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c)y\u1d62 \u2265 1 for each i", "Minimize \u03a3\u1d62 max{0, 1 \u2212 (a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c)y\u1d62} + \u03bb \u03a3\u2c7c a\u2c7c\u00b2"]}, {"p": "19\u201322", "title": "Time series models", "points": ["Exponential smoothing: variables \u03b1, \u03b2, \u03b3; constraints 0 \u2264 \u03b1 \u2264 1, 0 \u2264 \u03b2 \u2264 1, 0 \u2264 \u03b3 \u2264 1; minimize \u03a3\u209c (x\u209c \u2212 x\u0302\u209c)\u00b2 (plot of data vs smoothed).", "ARIMA: variables \u03bc, \u03c6\u1d62, \u03b8\u1d62; no constraints; minimize \u03a3\u209c (x\u209c \u2212 x\u0302\u209c)\u00b2, where D\u208dd\u208e\u209c = \u03bc + \u03a3\u1d62 \u03c6\u1d62D\u208dd\u208e\u209c\u208b\u1d62 \u2212 \u03a3\u1d62 \u03b8\u1d62(x\u0302\u209c\u208b\u1d62 \u2212 x\u209c\u208b\u1d62).", "GARCH: variables \u03c9, \u03b2\u1d62, \u03b3\u1d62; no constraints; minimize \u03a3\u209c (\u03c3\u209c\u00b2 \u2212 \u03c3\u0302\u209c\u00b2)\u00b2, where \u03c3\u0302\u209c\u00b2 = \u03c9 + \u03a3\u03b2\u1d62\u03c3\u00b2\u209c\u208b\u1d62 + \u03a3\u03b3\u1d62\u03b5\u00b2\u209c\u208b\u1d62."], "key": "Time series models fit their parameters by minimizing squared forecast error; exponential smoothing adds 0\u20131 bounds.", "watch": "The slide's ARIMA equation writes the AR coefficients as \u03b1\u1d62 while listing them as \u03c6\u1d62; they're the same thing. Its GARCH line shows '\u2212 \u03a3\u03b3\u1d62\u03b5\u00b2', but GARCH adds that term (as in Module 7).", "eq": ["0 \u2264 \u03b1, \u03b2, \u03b3 \u2264 1", "Minimize \u03a3\u209c (x\u209c \u2212 x\u0302\u209c)\u00b2", "Minimize \u03a3\u209c (\u03c3\u209c\u00b2 \u2212 \u03c3\u0302\u209c\u00b2)\u00b2"]}, {"p": "23\u201324", "title": "k-means for clustering", "points": ["Data: x\u1d62\u2c7c = coordinate j of data point i.", "Variables: z\u2c7c\u2096 = coordinate j of cluster center k; y\u1d62\u2096 = 1 if point i is in cluster k, 0 if not.", "Constraint: \u03a3\u2096 y\u1d62\u2096 = 1 for every point (each point in exactly one cluster).", "Objective: minimize \u03a3\u1d62 \u03a3\u2096 y\u1d62\u2096 (\u03a3\u2c7c (x\u1d62\u2c7c \u2212 z\u2c7c\u2096)^p)^(1/p), the total distance from points to their cluster centers."], "key": "k-means = choose centers and 0/1 assignments to minimize total distance.", "eq": ["\u03a3\u2096 y\u1d62\u2096 = 1 for all i", "Minimize \u03a3\u1d62 \u03a3\u2096 y\u1d62\u2096 (\u03a3\u2c7c (x\u1d62\u2c7c \u2212 z\u2c7c\u2096)^p)^(1/p)"]}, {"p": "25", "title": "Summary", "points": ["Some optimization models that underlie statistical models (also maximum likelihood estimation, per the transcript).", "Next: classifying optimization models, and which solve faster."], "key": "Optimization is underneath most of the course's models."}]}, {"lec": "M15 L5a", "title": "Using Optimization to Customize Statistical/ML Models", "intro": "Because models like regression are optimization problems, you can change the objective or add constraints to fit a question that the standard model doesn't. Examples: different error exponents, a forced zero intercept, ordered coefficients, and choosing exactly F features.", "topics": ["Changing the error exponent", "Least absolute error", "Built-in vs custom constraints", "Zero intercept", "Ordered coefficients", "Exact feature selection with binaries"], "slides": [{"p": "2", "title": "About this lesson", "points": ["Optimization underlies many analytics/data science models, so optimization can be used to customize them."], "key": "If a model is an optimization, you can edit it."}, {"p": "3\u20138", "title": "Changing the objective", "points": ["Standard regression minimizes \u03a3\u1d62 (y\u1d62 \u2212 (a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c))\u00b2, so points far from the line (large residuals) pull the coefficients the most.", "If far points shouldn't matter that much, change the exponent from 2 to, say, 3/2, and solve with optimization software.", "Exponent 1 with absolute values: minimize \u03a3\u1d62 |y\u1d62 \u2212 (a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c)|, the sum of absolute error (absolute value so positive and negative residuals don't cancel). Many regression packages already offer this."], "key": "Lower the exponent to reduce the pull of far-away points.", "watch": "On these slides the sums use m for data points and n for factors, the reverse of L5.", "eq": ["Minimize \u03a3\u1d62 |y\u1d62 \u2212 (a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c)|^(3/2)", "Minimize \u03a3\u1d62 |y\u1d62 \u2212 (a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c)|"]}, {"p": "9\u201311", "title": "Adding constraints", "points": ["Lasso, ridge and elastic net each add a constraint (to reduce overfitting): \u03a3|a\u2c7c| \u2264 \u03c4_lasso, \u03a3a\u2c7c\u00b2 \u2264 \u03c4_ridge, \u03bb\u03a3|a\u2c7c| + (1 \u2212 \u03bb)\u03a3a\u2c7c\u00b2 \u2264 \u03c4_elastic.", "Other constraints? Ones tied to the question itself."], "key": "Constraints can encode what the question requires."}, {"p": "12\u201314", "title": "Example: zero intercept", "points": ["A steamroller's acceleration on flat ground as a function of motor setting (0 = off to 1 = full power): with the motor off it doesn't move, so the model must give 0 at power 0.", "Add constraint a\u2080 = 0. Common enough that many packages have it built in."], "key": "Physical facts can become constraints (a\u2080 = 0).", "eq": ["a\u2080 = 0"]}, {"p": "15\u201317", "title": "Example: decreasing coefficients", "points": ["A professional sports project (confidential) needed a\u2081 \u2265 a\u2082 \u2265 \u2026 \u2265 a\u2099.", "And the differences decreasing too: a\u2081 \u2212 a\u2082 \u2265 a\u2082 \u2212 a\u2083 \u2265 \u2026 \u2265 a\u2099\u208b\u2081 \u2212 a\u2099.", "Hard for a regression package, easy to write in optimization, solved quickly. Ordered (order-constrained) regression is used in chemical engineering, oil drilling and sports."], "key": "Ordering rules on coefficients are just linear constraints.", "eq": ["a\u2081 \u2265 a\u2082 \u2265 \u2026 \u2265 a\u2099", "a\u2c7c\u208b\u2081 \u2212 a\u2c7c \u2265 a\u2c7c \u2212 a\u2c7c\u208a\u2081"]}, {"p": "18\u201320", "title": "Feature selection: lasso is indirect", "points": ["Lasso: higher \u03c4 for more features, lower \u03c4 for fewer, but there's no way to directly set \u03c4 for a specific number of features; you try values until you get the count you want."], "key": "Lasso controls the number of features only indirectly."}, {"p": "21\u201324", "title": "Feature selection with binary variables", "points": ["New variable w\u1d62 = 1 if feature i is selected, 0 otherwise.", "Select exactly F features: \u03a3\u1d62 w\u1d62 = F.", "a\u1d62 \u2264 U\u1d62w\u1d62 (no positive coefficient unless selected) and a\u1d62 \u2265 L\u1d62w\u1d62 (no negative coefficient unless selected); U\u1d62 and L\u1d62 are bounds (a very large number / very large negative number if unsure). If w\u1d62 = 0, a\u1d62 = 0.", "Minimizing squared error, this finds the best subset of F features on the training data among all subsets of size F."], "key": "Binaries + linking constraints pick exactly F features and the best coefficients for them.", "watch": "It's the best subset for training error; it can still overfit, so validate.", "eq": ["\u03a3\u1d62 w\u1d62 = F", "a\u1d62 \u2264 U\u1d62w\u1d62", "a\u1d62 \u2265 L\u1d62w\u1d62"]}, {"p": "25", "title": "Summary", "points": ["Use optimization to customize statistical and ML models: add custom constraints, select features. The same ideas apply beyond linear regression."], "key": "Customize by editing the objective or constraints."}]}, {"lec": "M15 L6", "title": "Classification of Optimization Models", "intro": "How fast an optimization model solves depends on its structure. This lecture ranks the main types from easiest to hardest, introduces heuristics for hard problems, and covers network models, which solve fastest of all.", "topics": ["Linear programs", "Convex quadratic and convex programs", "Integer and binary programs", "Non-convex programs", "Heuristics", "Network models"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Optimization models answer prescriptive questions and underlie descriptive and predictive models; some solve quickly, others take a long time.", "This lesson: how to classify optimization models, and which solve quickly."], "key": "Structure determines solve time."}, {"p": "4", "title": "General form", "points": ["x = vector of variables. Minimize f(x) or maximize f(x), subject to x \u2208 X (the variables must belong to a set X)."], "key": "Every model: optimize f(x) subject to x \u2208 X.", "eq": ["Minimize/Maximize f(x) subject to x \u2208 X"]}, {"p": "5\u20137", "title": "Linear program", "points": ["f(x) is linear: C + \u03a3\u1d62 c\u1d62x\u1d62.", "X is defined by linear equations and inequalities: \u03a3\u1d62 a\u1d62\u2c7cx\u1d62 \u2264 b\u2c7c, = b\u2c7c or \u2265 b\u2c7c for each constraint j.", "Easy and fast to solve, even for very large instances (over a million variables and constraints, per the transcript)."], "key": "Linear objective + linear constraints = LP: fast even when huge.", "eq": ["C + \u03a3\u1d62 c\u1d62x\u1d62", "\u03a3\u1d62 a\u1d62\u2c7cx\u1d62 \u2264 / = / \u2265 b\u2c7c"]}, {"p": "8", "title": "Convex quadratic program", "points": ["f(x) is a convex quadratic function (minimize f, or maximize \u2212f); constraints are linear.", "Easy and fast, but not as fast as linear programs."], "key": "Convex quadratic objective + linear constraints: still fast.", "watch": "Markowitz's return \u2212 \u03b8\u00b7risk objective (maximized) is this kind of model."}, {"p": "9", "title": "Convex optimization program", "points": ["Objective concave if maximizing, convex if minimizing; constraint set X is a convex set.", "Easy to solve mathematically, but finding solutions can take a lot longer."], "key": "Convex problems are reliably solvable, sometimes slowly."}, {"p": "10", "title": "Integer program", "points": ["A linear program plus some (or all) variables restricted to integer values; variables could be binary (0 or 1).", "More difficult to solve, even with good software; some small integer programs can't be solved optimally in days (transcript)."], "key": "Integer (and binary) variables make problems much harder.", "watch": "Binary variables are more restricted but not easier."}, {"p": "11", "title": "General non-convex program", "points": ["The problem isn't convex: hard to find optimal solutions, even for small problems."], "key": "Non-convex = hardest."}, {"p": "12\u201315", "title": "Ranking, and what to do if it's too hard", "points": ["From quickest/easiest to slowest/hardest: 1. linear programs, 2. convex quadratic programs, 3. convex programs, 4. integer programs, 5. general non-convex programs.", "Too hard? Use a heuristic: a rule-of-thumb process that usually gives good solutions (not guaranteed optimal), as in clustering."], "key": "LP < convex QP < convex < integer < non-convex; heuristics when exact is too slow."}, {"p": "16\u201321", "title": "Network models (a type of linear program)", "points": ["Nodes (vertices) are locations; arcs (edges) are connections. x\u1d62\u2c7c = flow on the arc from i to j.", "Constraints: flow into a node = flow out (including flow entering or leaving the network there); flow on each arc between its min and max.", "Objective: linear in the variables.", "If all data are integers, the optimal variable values automatically come out integer too, without integer constraints. Solved even faster than general LPs with special algorithms."], "key": "Network flow LPs solve fastest and give integer answers for free when data are integer."}, {"p": "22\u201325", "title": "Common network models", "points": ["Shortest path: quickest/shortest route from one place to another (Google Maps, GPS).", "Assignment: which worker gets which job to maximize workforce efficiency.", "Maximum flow: how much oil can get through a complex pipeline network each hour."], "key": "Shortest path, assignment, maximum flow."}, {"p": "26", "title": "Summary", "points": ["Classification of optimization problems.", "Next: dealing with uncertainty in data, forecasts and system behavior."], "key": "Know the types and their difficulty order."}]}, {"lec": "M15 L7", "title": "Stochastic Optimization", "intro": "So far every input was treated as known. When forecasts or parameters are uncertain, you can model conservatively, use chance constraints, optimize over scenarios, or use dynamic programming.", "topics": ["Conservative modeling (+\u03b8)", "Chance constraints", "Scenario modeling", "Robust solutions", "Expected-cost optimization", "Dynamic programming, MDPs"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: parameters treated as known values; forecasts used their expected value with no uncertainty.", "This lesson: what if data, parameters or forecasts aren't known exactly?"], "key": "Using only the expected value can give bad decisions for many outcomes."}, {"p": "4\u20136", "title": "Model conservatively", "points": ["Call center: x\u1d62 = workers starting a 5-day shift on day i, d\u1d62 = expected demand. Constraint x_Fri + x_Sat + x_Sun + x_Mon + x_Tue \u2265 d_Tue.", "Conservative version: require expected demand plus an extra \u03b8. Usually a few extra workers, but less likely to be short when demand is high.", "Chance constraint (with a good demand distribution): P(enough workers to meet demand) \u2265 p.", "You choose \u03b8 or p."], "key": "Add a buffer \u03b8, or require meeting demand with probability \u2265 p.", "eq": ["x_Fri + x_Sat + x_Sun + x_Mon + x_Tue \u2265 d_Tue + \u03b8", "P(x_Fri + \u2026 + x_Tue \u2265 d_Tue) \u2265 p"]}, {"p": "7\u201310", "title": "Scenario modeling and robust solutions", "points": ["Define many scenarios, e.g. a product rollout with two small recurring bugs, one major bug 3 days after launch, two major immediate bugs, a catastrophic failure after 10,000 signups, etc.", "d\u1d62\u209b = expected demand on day i in scenario s.", "Robust solution: satisfy every scenario's demand (one constraint per scenario). Can be expensive: lots of idle workers in most scenarios."], "key": "Robust = meet every scenario; safe but costly.", "eq": ["x_Fri + x_Sat + x_Sun + x_Mon + x_Tue \u2265 d_Tue,s for every scenario s"]}, {"p": "11\u201313", "title": "Optimize expected cost", "points": ["Minimize 5(x_Sun + \u2026 + x_Sat) + \u03a3\u209b c(p_Sun,s y_Sun,s + \u2026 + p_Sat,s y_Sat,s).", "c = cost per worker below demand; y\u1d62\u209b = shortfall on day i in scenario s; p\u1d62\u209b = probability of scenario s.", "Example constraints: x_Fri + x_Sat + x_Sun + x_Mon + x_Tue + y_Tue,1 \u2265 d_Tue,1 and y_Tue,1 \u2265 0.", "Many scenarios mean many constraints, so models get large fast and may need heuristics."], "key": "Expected-cost: pay for workers plus probability-weighted shortfall costs.", "watch": "The slide indexes probability as p\u1d62\u209b but defines it as the probability of scenario s; it doesn't depend on the day.", "eq": ["Minimize 5\u03a3\u1d62 x\u1d62 + \u03a3\u209b c \u03a3\u1d62 p\u209b y\u1d62\u209b", "\u03a3_{j working day i} x\u2c7c + y\u1d62\u209b \u2265 d\u1d62\u209b, y\u1d62\u209b \u2265 0"]}, {"p": "14\u201319", "title": "Other structures: dynamic programming", "points": ["Everything so far is mathematical programming (variables, constraints, objective); other models have different structure.", "Dynamic program: states (the exact situation, and their values) and decisions (choices of next state); Bellman's equation determines the optimal decision in each state.", "Stochastic dynamic program: decisions have uncertain outcomes, with known probabilities of the next state.", "Markov decision process: a stochastic dynamic program with discrete states and decisions, where probabilities depend only on the current state and decision. (Transcript: approximate dynamic programming also exists.)"], "key": "DP: states + decisions + Bellman; add probabilities \u2192 stochastic DP; discrete and memoryless \u2192 MDP.", "watch": "An MDP is the decision-making cousin of a Markov chain (M13): same memoryless transitions, plus decisions."}, {"p": "20", "title": "Summary", "points": ["Optimization under uncertainty: mathematical programming (conservative, chance constraints, scenarios) and dynamic programming."], "key": "Several ways to optimize when inputs are uncertain."}]}, {"lec": "M15 L8", "title": "Basics of Optimization Algorithms", "intro": "How solvers work at a high level: start somewhere, then repeatedly step in an improving direction. Convex problems guarantee the optimum; non-convex ones can stall at local optima or infeasible points.", "topics": ["Initialization", "Improving direction and step size", "Newton's method", "Convex vs non-convex", "Local optimum", "Running time"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: building optimization models. This lesson: how to solve them."], "key": "Algorithms, at a high level."}, {"p": "4\u20138", "title": "Two main steps", "points": ["Create a first solution (can be simple, bad or even infeasible).", "Repeat: find an improving direction t; use a step size \u03b8 to move along it; new solution = old solution + \u03b8t.", "Stop when the solution doesn't change much or time runs out."], "key": "Start, then step: x\u207f\u207a\u00b9 = x\u207f + \u03b8t.", "eq": ["x\u207f\u207a\u00b9 = x\u207f + \u03b8t"]}, {"p": "9", "title": "Newton's method (calculus)", "points": ["Finding a root of f(x): current solution x\u2099; x\u2099\u208a\u2081 = x\u2099 \u2212 f(x\u2099)/f\u2032(x\u2099).", "Improving direction \u2212f(x\u2099)/f\u2032(x\u2099), step size 1."], "key": "Newton's method is an improving-direction method with step size 1.", "eq": ["x\u2099\u208a\u2081 = x\u2099 \u2212 f(x\u2099)/f\u2032(x\u2099)"]}, {"p": "10\u201313", "title": "Convex vs non-convex", "points": ["Convex optimization problem: guaranteed to find the optimal solution.", "Non-convex: not guaranteed. Example: minimize (x \u2212 \u00bd)\u00b2 subject to x \u2208 {0, 1}. The allowable solutions are 0 and 1 (value \u00bc each), but Newton's method converges to \u00bd, which is infeasible.", "Example: a wavy f(x) where the method stops at a local optimum (better than everything nearby, no improving direction) instead of the real optimal solution farther away."], "key": "Non-convex: may converge to an infeasible point or a local optimum.", "watch": "The {0, 1} example sits under a 'Convex optimization problem' title, but a two-point (binary) feasible set is NOT convex; that's why Newton fails there."}, {"p": "14", "title": "Running time", "points": ["Linear programs (and many network algorithms): often fast.", "Integer programs: can be long (tree-based methods with direction/step subproblems)."], "key": "LPs fast, IPs slow."}, {"p": "15", "title": "Summary", "points": ["The course doesn't cover algorithm details, but it's good to know what solvers do in the background."], "key": "Know the idea: start, improve, stop."}]}]}, {"module": "m16", "title": "Advanced Models", "n": 16, "lectures": [{"lec": "M16 L1", "title": "Non-Parametric Methods", "intro": "Hypothesis tests from basic statistics assume a known distribution. These tests work from ranks or paired yes/no outcomes instead, so they still apply when you have no good model of the distribution.", "topics": ["When the distribution is unknown", "McNemar's test", "Wilcoxon signed rank (median)", "Wilcoxon for paired samples", "Mann-Whitney"], "slides": [{"p": "2\u20133", "title": "Why non-parametric tests", "points": ["Standard hypothesis tests assume we know the underlying distribution we're testing against.", "Sometimes all we have is the responses and no good model of how they're distributed; non-parametric tests cover that case."], "key": "No distribution assumption needed: tests use ranks or counts instead."}, {"p": "4\u20139", "title": "McNemar's test (paired yes/no)", "points": ["Two virus treatments are each tried on the same 100 virus samples: A works on 61, B on 68. Is B better, or is it luck?", "Scenario 1: both fail 32, both work 61, only B works 7, only A works 0. B works everywhere A does plus 7 more, p \u2248 0.02, so B looks better.", "Scenario 2: both fail 12, both work 41, only B 27, only A 20. Same totals, but p \u2248 0.38, so B is not shown to be better.", "McNemar ignores the pairs where A and B agree and runs a binomial test on the pairs where they differ."], "key": "Only the discordant pairs matter; the same totals can give opposite conclusions.", "eq": ["Scenario 1: 7 of 7 discordant favour B \u2192 two-sided p = 2\u00b70.5\u2077 \u2248 0.016", "Scenario 2: 27 of 47 discordant favour B \u2192 p \u2248 0.38"], "watch": "The slide's '(accept)' and '(reject)' labels refer to the conclusion 'B is better'. In hypothesis-test terms, p = 0.02 rejects the null of no difference and p = 0.38 fails to reject it."}, {"p": "10\u201311", "title": "Wilcoxon signed rank test for a median", "points": ["Assumes only that the distribution is continuous and symmetric. Question: is its median different from a value m?", "Rank |y\u2081 \u2212 m|, \u2026, |y\u2099 \u2212 m| from smallest to largest; W = sum of the ranks of the points where y\u1d62 > m; get a p-value for W (software, or a table in the old days)."], "key": "One data set: compare its median to a value using signed ranks.", "eq": ["W = \u03a3_{y\u1d62 > m} rank(|y\u1d62 \u2212 m|)"]}, {"p": "12\u201313", "title": "Wilcoxon for paired samples, and which paired test", "points": ["For pairs (y\u1d62, z\u1d62), rank |y\u1d62 \u2212 z\u1d62| instead of |y\u1d62 \u2212 m|; the question is whether the two sets of observations differ.", "Paired numeric data \u2192 Wilcoxon. Paired yes/no data \u2192 McNemar."], "key": "Paired numeric = Wilcoxon; paired yes/no = McNemar."}, {"p": "14", "title": "Mann-Whitney test (unpaired)", "points": ["For two independent, unpaired samples y\u2081\u2026y\u2099 and z\u2081\u2026z_m.", "Rank all observations together, compute each group's rank sum minus its minimum possible sum, take U = the smaller one, and find its significance with software or a table."], "key": "Unpaired samples: rank everything together and compare the groups' rank sums.", "eq": ["U_y = \u03a3\u1d62 rank(y\u1d62) \u2212 n(n+1)/2", "U_z = \u03a3\u2c7c rank(z\u2c7c) \u2212 m(m+1)/2", "U = min{U_y, U_z}"], "watch": "The transcript says to compare the smaller raw rank sum; the slide subtracts n(n+1)/2 and m(m+1)/2 first, which is the standard U statistic."}, {"p": "15", "title": "Summary", "points": ["Two data sets: McNemar (paired yes/no), Wilcoxon signed rank (paired numeric), Mann-Whitney (unpaired). One data set: Wilcoxon signed rank against a possible median.", "There are other non-parametric tests too."], "key": "Pick by number of data sets, paired or not, and numeric or yes/no."}]}, {"lec": "M16 L1a", "title": "Matching Tests to Situations", "intro": "A decision guide for choosing a test: how many data sets, whether they're paired, and whether the metric uses exact values, ranks, or yes/no outcomes.", "topics": ["Parametric, non-parametric and binomial tests", "One sample or two", "Paired or unpaired", "What metric you're analyzing", "Antibiotic example"], "slides": [{"p": "2\u20133", "title": "Three families of tests", "points": ["Parametric tests use the exact values of the data, such as the mean (e.g. Student's t-test).", "Non-parametric tests use ranks, such as the median (e.g. Mann-Whitney, Wilcoxon).", "Binomial-based tests use successes and failures, such as a fraction of successes (e.g. McNemar).", "Each comes in one-sample, two-sample unpaired, and two-sample paired versions."], "key": "Exact values \u2192 parametric; ranks \u2192 non-parametric; successes/failures \u2192 binomial."}, {"p": "4\u20135", "title": "How many data sets?", "points": ["One data set: compare its mean, median, etc. to a specific value m.", "Two data sets: compare their means, medians, etc. to each other."], "key": "One set vs a value, or two sets vs each other."}, {"p": "6\u20138", "title": "Paired or unpaired", "points": ["Example: flight prices from Atlanta to New York. Every Monday and every Thursday of the year gives one pair per week, so testing whether Monday is pricier uses a paired test.", "Prices from the first 30 Mondays and the last 30 Thursdays of the year have no natural pairing, so use an unpaired test.", "Paired vs unpaired only matters for two-sample tests."], "key": "Paired = each observation in one set has a natural partner in the other."}, {"p": "9\u201311", "title": "What metric are you analyzing?", "points": ["A mean or any metric that uses exact values \u2192 parametric.", "A median or any metric that uses ranks \u2192 non-parametric.", "A success probability or any metric built from counts of binary outcomes \u2192 binomial."], "key": "The metric decides the test family."}, {"p": "12\u201317", "title": "Example: antibiotic tests", "points": ["Two antibiotics for ear infections: 50 bacteria strains, each put in one dish with antibiotic A and one with antibiotic B; remaining bacteria measured after 24 hours.", "Two data sets (one per antibiotic), and each strain gives a pair of results, so it's a paired two-sample test.", "Paired and comparing average remaining bacteria \u2192 parametric; median remaining bacteria \u2192 non-parametric; number of strains where A or B does better \u2192 binomial."], "key": "Same experiment, three different tests depending on the question asked.", "watch": "Slide misprint: the two-sample slide labels both samples '50 tests of antibiotic 1'; the second sample is antibiotic 2 (the pictures are labeled A and B)."}, {"p": "18", "title": "Summary", "points": ["How many data sets: one \u2192 one-sample test; two \u2192 two-sample test, paired or unpaired.", "Type of metric: mean or exact values \u2192 parametric; median or ranks \u2192 non-parametric; fraction of successes or binary outcomes \u2192 binomial."], "key": "Three questions pick the test: how many sets, paired or not, and what metric."}]}, {"lec": "M16 L2", "title": "Bayesian Modeling", "intro": "Bayes' rule and empirical Bayes models, with two counterintuitive examples and how to explain them to decision-makers.", "topics": ["Bayes' rule", "Medical test example", "Empirical Bayes idea", "NCAA basketball model", "Shrinking an extreme result"], "slides": [{"p": "2\u20134", "title": "Bayes' rule", "points": ["Bayesian models rest on a rule of conditional probability: Bayes' rule (Bayes' theorem).", "Bayesian results are often counterintuitive, so being able to explain them to people who never learned the math is key to getting them accepted."], "key": "P(A|B) = P(B|A)P(A)/P(B).", "eq": ["P(A|B) = P(B|A)\u00b7P(A) / P(B)"]}, {"p": "5\u20138", "title": "Medical test example", "points": ["The test catches the disease 98% of the time when it's present, gives false positives for 8% of healthy people, and 1% of people have the disease, so 8.9% test positive.", "A = has the disease, B = tests positive: P(A|B) = 0.98 \u00d7 0.01 / 0.089 \u2248 11%.", "Why so low: so many more people are healthy that false positives outnumber true positives roughly 8 to 1."], "key": "A positive test with a rare disease still usually means no disease.", "eq": ["P(positive) = 0.98\u00b70.01 + 0.08\u00b70.99 \u2248 0.089", "P(disease | positive) = 0.0098 / 0.089 \u2248 0.11"], "watch": "The slide's 'true positives: 98%' means the detection rate among people who have the disease (sensitivity), not 98% of all positives."}, {"p": "9\u201311", "title": "Empirical Bayes", "points": ["Used when an overall distribution is known or can be estimated, but there's only a little data for the specific case.", "Example: predicting NCAA basketball tournament games from regular-season results."], "key": "Combine a broad prior with a little specific data."}, {"p": "12\u201318", "title": "The NCAA model", "points": ["The home-minus-road point difference X is roughly normal with mean m + h (h = home-court advantage, m = true strength difference, unknown) and variance \u03c3\u00b2.", "Across teams, the strength difference is normal: m ~ N(0, \u03c4\u00b2).", "Observed x isn't the true m. Bayes' rule gives the distribution of M given X = x, which is also normal.", "Estimate \u03c3, \u03c4 and h from past data; integrate the posterior from 0 to \u221e to get P(home team is better | x)."], "key": "The posterior mean is the observed margin minus home court, shrunk toward 0.", "eq": ["X ~ N(m + h, \u03c3\u00b2), m ~ N(0, \u03c4\u00b2)", "M | X = x ~ N( \u03c4\u00b2/(\u03c4\u00b2+\u03c3\u00b2) \u00b7 (x \u2212 h), \u03c4\u00b2\u03c3\u00b2/(\u03c4\u00b2+\u03c3\u00b2) )", "P(home better | X = x) = \u222b\u2080^\u221e P(M = m | X = x) dm"]}, {"p": "19\u201321", "title": "A 20-point home win", "points": ["Estimates: h \u2248 4, \u03c4 \u2248 6, \u03c3 \u2248 11.", "Of the 20 points: about 4 from home court, about 12.5 from randomness, and only about 3.5 from the teams' real difference, less than home court.", "So the model says the winner is slightly more likely to lose a rematch on the other court, and real data agrees (slightly under 50%).", "Reason: randomness variance (\u2248 120) is far larger than strength variance (\u2248 36), so a big margin is mostly luck and gets shrunk."], "key": "When noise variance dwarfs signal variance, extreme results are shrunk hard.", "eq": ["\u03c4\u00b2/(\u03c4\u00b2+\u03c3\u00b2) = 36/157 \u2248 0.23", "0.23 \u00d7 (20 \u2212 4) \u2248 3.7"], "watch": "Exact arithmetic: 36/(36+121) \u00d7 (20 \u2212 4) \u2248 3.7 points; the slide rounds to 3.5."}, {"p": "22", "title": "Summary", "points": ["Even one observation, combined with a broader set of observations, supports a deduction or prediction.", "Bayesian models are especially useful when there isn't much data."], "key": "Bayes shines when specific data is scarce."}]}, {"lec": "M16 L3", "title": "Communities in Graphs", "intro": "Finding highly interconnected groups inside large networks, where things spread fast, using the Louvain algorithm.", "topics": ["Why communities matter", "Graph vocabulary", "Modularity", "Louvain algorithm steps", "Heuristic, but fast"], "slides": [{"p": "2\u20134", "title": "Why find communities", "points": ["Applications: marketing messages on social media, disease outbreaks, computer viruses, words moving between languages, terrorist network communication.", "Focus: automated ways to find highly interconnected subpopulations."], "key": "Inside a dense group, things spread quickly."}, {"p": "5\u20139", "title": "Flu example", "points": ["People are circles and a line means two people share a room daily. A person four connections away will get the flu slowly.", "A cluster where most people link to the infected person, or to people who do, will get it fast. The same holds for a marketing message."], "key": "Distance in the graph and density of links drive spread."}, {"p": "10\u201311", "title": "Vocabulary", "points": ["Community: a set of nodes highly connected within itself.", "Graph = nodes (vertices, the circles) + arcs (edges, the lines). Clique: a set of nodes that all have edges to each other.", "Finding cliques is mathematically hard; communities don't need to be full cliques."], "key": "A community is dense, not necessarily complete."}, {"p": "12\u201316", "title": "Modularity", "points": ["The Louvain algorithm decomposes a graph into communities by maximizing modularity.", "a\u1d62\u2c7c = weight of the arc between i and j (0 if none); w\u1d62 = total weight of arcs at node i; W = total weight of all arcs.", "Modularity measures how well the graph splits into groups connected a lot inside and little between."], "key": "Louvain maximizes modularity.", "eq": ["Modularity = (1/2W) \u03a3_{i,j in same community} (a\u1d62\u2c7c \u2212 w\u1d62w\u2c7c/2W)"]}, {"p": "17\u201322", "title": "Louvain steps", "points": ["Step 0: every node is its own community.", "Step 1: repeatedly move a node into an adjacent node's community where it raises modularity the most (or leave it), cycling through the nodes until no move helps.", "Step 2: turn each community into a super-node (super-arcs between communities carry the summed weights; a self-arc carries the internal weight), then repeat Step 1 on the super-nodes."], "key": "Move nodes greedily, collapse communities, repeat."}, {"p": "23", "title": "Summary", "points": ["Louvain is a heuristic: not guaranteed to find the best partition, but it gives very good solutions very quickly.", "It's built into R, Python and other tools."], "key": "Fast and good, not guaranteed optimal."}]}, {"lec": "M16 L4", "title": "Neural Networks and Deep Learning", "intro": "Models that learn to react to patterns we can't write rules for, how they're structured and trained, and why they're hard to use.", "topics": ["Patterns we can't describe", "Three levels of neurons", "Training the weights", "Practical difficulties", "Deep learning"], "slides": [{"p": "2\u20134", "title": "Reacting to patterns we don't understand", "points": ["CAPTCHA example: we read distorted letters easily but can't write rules a computer could follow.", "Neural networks and deep learning train a system to react to whatever patterns we react to, without knowing what they are. Strong in speech, handwriting, NLP and image recognition."], "key": "Use them when the rules can't be written down."}, {"p": "5\u201310", "title": "Structure", "points": ["Three levels of simulated neurons: input, hidden (possibly several layers), output.", "Each input neuron takes one piece of information (e.g. one pixel's darkness).", "Each neuron takes inputs from the previous layer, computes a function of the weighted inputs, and passes the result on. For CAPTCHA, one output neuron per possible character; the prediction is the strongest output."], "key": "Weighted inputs flow forward through layers."}, {"p": "11\u201312", "title": "Learning", "points": ["Weights and functions are updated according to how wrong each output was, e.g. with gradient descent.", "With enough data the weights settle so the network gives correct outputs."], "key": "Errors drive the weight updates.", "watch": "The transcript stresses the practical side: lots of training data, a learning algorithm that's hard to tune (too slow vs. jumping around), and poor generalization (retrain for a new language; a 20-package routing model may fail at 30, so use optimization for routing)."}, {"p": "13\u201314", "title": "Deep learning", "points": ["Similar to neural networks, with many layers ('deep'). An old idea that only recently became practical.", "Relative success in natural language processing, speech recognition and image recognition; in practice often better than plain neural networks."], "key": "Deep = many layers; often the better approach."}]}, {"lec": "M16 L5", "title": "Competitive Models", "intro": "When the system reacts intelligently to your decisions, you need game theory: competitive (and sometimes cooperative) decision-making.", "topics": ["Us against the data vs. a reacting system", "Examples", "Game theory and cooperative game theory", "Simultaneous vs sequential", "Pure vs mixed strategies", "Information and zero-sum"], "slides": [{"p": "2\u20138", "title": "Beyond us-against-the-data", "points": ["Descriptive models tease out an understanding of reality; predictive models find hidden relationships to predict the future; prescriptive models find the best thing to do.", "All of these assume the system doesn't react. If it reacts intelligently, analytics must consider all sides."], "key": "If others respond to your choice, model their response."}, {"p": "9\u201313", "title": "Examples", "points": ["Pricing: competitors change their prices. Government tax policy: companies change how they store and spend money. Employee incentives: employees change behavior.", "Auctions: competitors adjust bids, e.g. US spectrum auctions. Supply chains (e.g. a chip maker and a laptop maker): both cooperative and competitive, negotiating payments."], "key": "Pricing, tax, incentives, auctions, supply chains."}, {"p": "14\u201316", "title": "Game theory", "points": ["Competitive decision-making is called game theory; with competition plus cooperation it's cooperative game theory.", "See the 16.5a demo for a basic example."], "key": "Game theory = competitive decision-making."}, {"p": "17\u201322", "title": "Timing", "points": ["Simultaneous decisions can't be changed once made (e.g. a sealed-bid auction): strategy, counter-strategy, counter-counter-strategy, and so on toward the best solution.", "Sequential games: decisions are made in turn, and one side may see the other's strategy first."], "key": "Simultaneous vs sequential games."}, {"p": "23\u201324", "title": "Pure vs mixed strategies", "points": ["Pure strategy: one choice (like the gas station example).", "Mixed strategy: randomize according to probabilities. In rock-paper-scissors any pure strategy loses; picking each with probability 1/3 is best."], "key": "Sometimes the best plan is randomized."}, {"p": "25\u201326", "title": "Information levels", "points": ["Perfect information: everyone knows everyone's situation (chess).", "Imperfect information: e.g. the real gas stations don't know each other's margins exactly; it can also be asymmetric, with some players knowing more."], "key": "Perfect, imperfect, and asymmetric information."}, {"p": "27\u201329", "title": "Zero-sum vs non-zero-sum", "points": ["Zero-sum: whatever one side gains the other loses (a $1 bet on rock-paper-scissors).", "Non-zero-sum: total benefit can rise or fall with the decisions (economies)."], "key": "Zero-sum is a fixed pie; non-zero-sum isn't."}, {"p": "30", "title": "Summary", "points": ["The best strategies in competitive situations are usually found with optimization models."], "key": "Game theory runs on optimization."}]}, {"lec": "M16 L5a", "title": "Competitive Model Demo", "intro": "Two gas stations on one corner choose prices. Working through the profit table shows a stable equilibrium, a prisoner's dilemma, and why competition drives prices toward cost.", "topics": ["Setup", "Cost $1: low price dominates", "Stable equilibrium and prisoner's dilemma", "Cost $1.75: high price wins", "Any price: undercutting"], "slides": [{"p": "2\u20135", "title": "Setup", "points": ["Two gas stations at the same corner (BP and Shell) each choose $2.50 or $2.00 per gallon.", "Same price \u2192 demand d splits 50/50; otherwise (almost) all demand goes to the cheaper one."], "key": "A 2\u00d72 pricing game."}, {"p": "6\u201310", "title": "Cost $1.00/gallon (Shell's view)", "points": ["Both $2.50: each gets d/2 \u00d7 $1.50 = 0.75d.", "Shell $2.00 vs BP $2.50: Shell gets d \u00d7 $1.00 = 1.00d. Shell $2.50 vs BP $2.00: Shell gets 0.", "Both $2.00: each gets d/2 \u00d7 $1.00 = 0.50d.", "Whatever BP does, $2.00 is better for Shell; by symmetry the same holds for BP."], "key": "Lower price is better no matter what the other does.", "eq": ["(2.50, 2.50): 0.75d each", "(2.00 vs 2.50): 1.00d vs 0", "(2.00, 2.00): 0.50d each"]}, {"p": "11\u201314", "title": "Stable equilibrium and the prisoner's dilemma", "points": ["Both at $2.00 is a stable equilibrium: neither has an incentive to change.", "Here the equilibrium is worse for both than agreeing on $2.50: a prisoner's dilemma. Even with an agreement, each has an incentive to cheat.", "The equilibrium isn't always worse in game theory."], "key": "Individually rational can be jointly worse."}, {"p": "15\u201318", "title": "Cost $1.75/gallon", "points": ["Both $2.50: each 0.375d. Undercut at $2.00: 0.25d. Both $2.00: each 0.125d.", "If the other station charges $2.50, matching at $2.50 (0.375d) beats undercutting (0.25d), so both charging the higher price is now stable with no agreement needed, and it's better for both."], "key": "A thin margin removes the incentive to undercut.", "eq": ["(2.50, 2.50): d/2 \u00d7 0.75 = 0.375d", "undercut: d \u00d7 0.25 = 0.25d", "(2.00, 2.00): d/2 \u00d7 0.25 = 0.125d"], "watch": "Slide misprint: the arrows say 'higher price is better' in both columns, but they compare cells from different columns. If BP charges $2.00, Shell earns $0 at $2.50 and 0.125d at $2.00, so the lower price is better there. Both ($2.50, $2.50) and ($2.00, $2.00) are stable; the higher-price equilibrium is better for both."}, {"p": "19\u201324", "title": "Any price", "points": ["If Shell prices above BP it sells nothing; equal, it gets d/2 \u00d7 (p \u2212 cost); just below, it gets d \u00d7 (p \u2212 cost).", "So each keeps undercutting the other slightly until price is about equal to cost.", "This is part of why competition lowers prices for consumers or pushes companies to differentiate."], "key": "Undercutting drives price toward cost.", "eq": ["p_Shell > p_BP: 0", "p_Shell = p_BP: (d/2)(p_Shell \u2212 cost)", "p_Shell < p_BP: d(p_Shell \u2212 cost)"]}]}, {"lec": "M16 L6", "title": "Natural Language Processing", "intro": "Language is a common, unstructured kind of data that needs its own modeling: recognizing not just words but what they mean.", "topics": ["Structured data vs language", "Where NLP helps", "Why it's hard", "NLP tasks", "A call-center story"], "slides": [{"p": "2", "title": "Language as data", "points": ["Most course data has been structured, numeric or categorical. Language is one of the most common types of data people take in."], "key": "NLP handles unstructured text and speech."}, {"p": "3\u20138", "title": "Where NLP helps", "points": ["Healthcare (diagnosis, automated caretakers), technical support and call centers, document search and classification (e.g. finding supportive case law), sentiment analysis (what hotel guests like and dislike), maybe even teaching."], "key": "Diagnosis, support, document search, sentiment."}, {"p": "9\u201311", "title": "Why it's hard", "points": ["'I blew my nose', 'I blew my chance', 'I blew my horn' have identical structure but different meanings of 'blew', and the last one has two meanings itself (bragging or playing a trumpet).", "Recognizing words isn't enough; meaning depends on context."], "key": "Same structure, different meanings."}, {"p": "12\u201317", "title": "NLP tasks", "points": ["Speech-to-text (blue vs blew; Aaron, Aron or Erin).", "Recognizing named entities and co-references (what 'it' refers to).", "Meaning in context: part-of-speech tagging and word sense.", "Sentiment (likes or dislikes; literal or sarcastic).", "The inverse problem: choosing words to convey a message, sometimes in a human-sounding way."], "key": "Many tasks: from words, to meaning, to generation."}, {"p": "18\u201320", "title": "The call-center story", "points": ["The professor assumed a call-center voice was an automated system and asked for a human; it was a human, from near his hometown. Even humans struggle with language."], "key": "Even people find language hard."}]}, {"lec": "M16 L7", "title": "Survival Models", "intro": "Models that predict the probability of an event before a given time, based on predictor variables, with the Cox proportional hazards model and the problem of censored data.", "topics": ["What survival models predict", "Uses", "Cox proportional hazards", "Reading the coefficients", "Censored data"], "slides": [{"p": "2\u20135", "title": "What and where", "points": ["Predict the probability an event happens (or not) before a certain time, based on predictor variables (unlike the plain distributions of Module 13).", "Insurance (life, auto, theft/loss), medicine (treatment effects, e.g. transplant survival), machinery and sensors (maintenance and replacement)."], "key": "Time-to-event probability driven by predictors.", "watch": "The transcript links this to change detection: survival models can schedule preventive maintenance so change detection flags emergencies less often."}, {"p": "6\u201311", "title": "Cox proportional hazards model", "points": ["Given each data point's predictors x\u2081\u2026x\u2099 and event time y.", "h\u2080(t) is the baseline hazard at time t when all predictors are zero; each factor multiplies it by e^(\u03b2\u2c7cx\u2c7c).", "\u03b2\u2c7c = 0: no effect. \u03b2\u2c7c > 0: a positive x\u2c7c raises the hazard. \u03b2\u2c7c < 0: a positive x\u2c7c lowers it.", "Like logistic regression, it uses an exponential function."], "key": "Each predictor scales the baseline hazard by e^(\u03b2\u2c7cx\u2c7c).", "eq": ["h(t) = h\u2080(t)\u00b7e^(\u03b2\u2081x\u2081 + \u2026 + \u03b2\u2099x\u2099) = h\u2080(t)\u00b7e^(\u03b2\u2081x\u2081)\u00b7\u2026\u00b7e^(\u03b2\u2099x\u2099)"], "watch": "The slide calls h(t) a 'probability of the event at time t'; strictly it's a hazard rate (the event rate at t among those still at risk)."}, {"p": "12\u201317", "title": "Censored data", "points": ["A patient who got a transplant 12 years ago and is still alive: survival is at least 12 years, but the true value is unknown.", "Censored data: no data before or after a specific time, or after a certain number of observed events (e.g. track train cars until 20 derailments).", "Survival models have extensions that handle censoring (not covered in the course)."], "key": "Censored = we only know the event time is beyond (or before) some point."}, {"p": "18\u201319", "title": "Example of censored data", "points": ["You, still watching the video at its end: we only know you lasted at least that long."], "key": "Still going at the end = censored."}]}, {"lec": "M16 L8", "title": "Gradient Boosting", "intro": "A computing technique that improves a starting model by repeatedly adding new models fit to its errors (the negative gradient of the loss).", "topics": ["Boosting: adding models", "Fitting H to the negative gradient", "Step size and regularization", "Iterating", "Same pattern as optimization"], "slides": [{"p": "2\u20134", "title": "Roadmap", "points": ["Earlier lessons covered model types, their uses, data needs and how they work.", "Gradient boosting is more a computing topic: it uses model after model to augment one you already have. An example follows next lesson."], "key": "Not a new model type, a way to improve one."}, {"p": "5\u20139", "title": "Basic idea", "points": ["Start with a model and add other models to it ('boosting'); fit the added models using gradient information ('gradient').", "Used with factor-based models (regression, classification) and tree-based models built on them. Common implementations include XGBoost."], "key": "Model + model + model\u2026, each fit with gradient information."}, {"p": "10\u201317", "title": "Fitting the next model", "points": ["Model F gives predictions F(x) and errors y \u2212 F(x). If H(x) = y \u2212 F(x) exactly, F + H would fit the training data perfectly.", "So fit H on the same predictors x, with response = the negative gradient of the loss (quality metric) at F's predictions. For squared-error regression this is essentially the residuals.", "For other losses (absolute error, classification metrics) the gradient isn't exactly the residuals, but the idea is the same.", "F + H gives better training predictions; often H is a tree."], "key": "H is fit to \u2212\u2207L(F(x)), not to y.", "eq": ["Response for H: \u2212\u2207L(F(x))", "F + \u03b3H, with \u03b3 chosen to minimize training error, or smaller to regularize"]}, {"p": "18\u201322", "title": "Iterating", "points": ["F\u2080 can be very simple, e.g. the average response. Fit H\u2080 to \u2212\u2207L(F\u2080), set F\u2081 = F\u2080 + \u03b3\u2080H\u2080, then fit H\u2081 to \u2212\u2207L(F\u2081), and so on.", "Stop when improvement is small or time runs out; the final F_k = F\u2080 plus k weighted H models."], "key": "Repeat: fit to the gradient, add, recompute.", "eq": ["F_{k+1} = F_k + \u03b3_k H_k", "F_k = F\u2080 + \u03a3\u1d62 \u03b3\u1d62H\u1d62"]}, {"p": "23", "title": "Sound familiar?", "points": ["It mirrors how optimization is solved: start with a solution, find an improving direction, pick a step size, move, repeat. Not a coincidence: optimization is under the hood."], "key": "Gradient boosting is gradient-style optimization over models."}, {"p": "24", "title": "Wrap-up", "points": ["There are many computational details (e.g. how to weight each H), taught in another course."], "key": "The idea, not the details, is what this course covers."}]}, {"lec": "M16 L8a", "title": "Gradient Boosting Example", "intro": "One iteration of gradient boosting by hand on four data points with squared-error loss, including choosing the step size.", "topics": ["Data and starting tree F\u2080", "Gradient of the loss", "Tree H\u2080 fit to the negative gradient", "F\u2080 + H\u2080 vs F\u2080 + \u00bdH\u2080", "Optimal step size \u03b3\u2080 = 0.56"], "slides": [{"p": "2\u20135", "title": "Data and F\u2080", "points": ["Four points (x\u2081, x\u2082, y): (1, 2, 4), (2, 7, 5), (1, 5, 2), (2, 5, 2).", "F\u2080 is a regression tree with one split on x\u2081: if x\u2081 < 2 predict 6x\u2081 \u2212 x\u2082, else \u2212x\u2081 + x\u2082. Predictions 4, 5, 1, 3.", "Loss L = total squared error = 0 + 0 + 1 + 1 = 2."], "key": "A tree with a regression in each leaf.", "eq": ["F\u2080 = 6x\u2081 \u2212 x\u2082 (x\u2081 < 2); \u2212x\u2081 + x\u2082 (x\u2081 \u2265 2)", "L = \u03a3\u1d62 (y\u1d62 \u2212 F\u2080(x\u1d62))\u00b2 = 2"]}, {"p": "6\u20139", "title": "The gradient", "points": ["Expand L into one squared term per point; the partial derivative for point i is \u22122(y\u1d62 \u2212 F\u2080(x\u1d62)).", "Gradient [0, 0, \u22122, 2]; negative gradient [0, 0, 2, \u22122]."], "key": "For squared error, the negative gradient is 2 \u00d7 residual.", "eq": ["\u2202L/\u2202F\u2080(x\u1d62) = \u22122(y\u1d62 \u2212 F\u2080(x\u1d62))"], "watch": "The table header '\u2212\u2207F\u2080(x\u1d62)' means the negative gradient of the loss at F\u2080's predictions, \u2212\u2207L(F\u2080(x\u1d62))."}, {"p": "10", "title": "Tree H\u2080", "points": ["New data: same predictors, response = negative gradient [0, 0, 2, \u22122].", "H\u2080 splits on x\u2082: if x\u2082 < 5 predict 2x\u2081 \u2212 x\u2082, else \u22123.5x\u2081 + x\u2082. Predictions 0, 0, 1.5, \u22122."], "key": "H\u2080 approximates the negative gradient.", "eq": ["H\u2080 = 2x\u2081 \u2212 x\u2082 (x\u2082 < 5); \u22123.5x\u2081 + x\u2082 (x\u2082 \u2265 5)"]}, {"p": "11\u201318", "title": "F\u2081 = F\u2080 + H\u2080", "points": ["Each point goes through both trees, e.g. point 1: (6x\u2081 \u2212 x\u2082) + (2x\u2081 \u2212 x\u2082) = 8x\u2081 \u2212 2x\u2082 = 4.", "Predictions 4, 5, 2.5, 1, so L = 1.25 (down from 2). Keeping the F\u2080 and H\u2080 columns lets you just add them."], "key": "Adding H\u2080 cuts the error from 2 to 1.25."}, {"p": "19\u201320", "title": "A half step", "points": ["F\u2081 = F\u2080 + \u00bdH\u2080 gives 4, 5, 1.75, 2 and L = 0.0625, much better than the full step.", "Multipliers of 1 or \u00bd are just guesses."], "key": "The step size matters."}, {"p": "21\u201325", "title": "Optimal step size", "points": ["F\u2081 = F\u2080 + \u03b3\u2080H\u2080; write L as a function of \u03b3\u2080, differentiate, set to zero.", "\u22127 + 12.5\u03b3\u2080 = 0 gives \u03b3\u2080 = 0.56.", "F\u2081 = F\u2080 + 0.56H\u2080 predicts 4, 5, 1.84, 1.88, with L = 0.04."], "key": "Choose \u03b3 by minimizing training loss.", "eq": ["dL/d\u03b3\u2080 = \u22122\u03a3\u1d62 H\u2080(x\u1d62)(y\u1d62 \u2212 F\u2080(x\u1d62) \u2212 \u03b3\u2080H\u2080(x\u1d62)) = \u22127 + 12.5\u03b3\u2080", "\u03b3\u2080 = 7/12.5 = 0.56"]}, {"p": "26", "title": "Next iteration", "points": ["The new predictions become F for the next gradient: [0, 0, \u22120.32, \u22120.24], so the next H is fit to the negative gradient [0, 0, 0.32, 0.24]."], "key": "Repeat with the new F.", "eq": ["\u22122(2 \u2212 1.84) = \u22120.32", "\u22122(2 \u2212 1.88) = \u22120.24"], "watch": "Slide misprint: the derivatives are written \u22122(y\u1d62 \u2212 0.56F\u2081(x\u1d62)); they should be \u22122(y\u1d62 \u2212 F\u2081(x\u1d62)). The 0.56 is already inside F\u2081, and the numbers shown (e.g. \u22122(2 \u2212 1.84)) use F\u2081 directly."}]}]}]}</script>
<script id="fc-data" type="application/json">{"M1 L1#5–8": {"q": "A hospital wants to know which of three staffing plans will keep patient wait times lowest. What type of analytics question is this?", "o": [["Prescriptive: it asks which action would be best", "Choosing among actions to reach a goal is prescriptive."], ["Predictive: it's about what future wait times will be", "Forecasts may feed in, but the question is which plan to choose.", "Stopping at the forecast."], ["Descriptive: it studies the wait times patients have now", "It isn't just describing current waits.", "Missing the decision."], ["Descriptive: it explains why patients have to wait", "Explaining causes isn't the goal; picking a plan is.", "Confusing explanation with decision."]]}, "M1 L1#9": {"q": "An analyst starts running algorithms on a data set before stating the business problem in precise, mathematical terms. What is the main risk?", "o": [["It may answer a different question than the real one", "Without first expressing the real situation as math, the analysis may not address the actual decision."], ["The algorithms will run too slowly to finish on the data", "Speed isn't the core issue; relevance to the problem is.", "Focusing on computation."], ["The results will be correct but hard to explain to managers", "The bigger risk is solving the wrong problem, not presenting it.", "Focusing on communication only."], ["There's little risk, since good data defines the problem", "Data alone doesn't say what question to answer.", "Believing data defines the question."]]}, "M1 L1#10": {"q": "An analyst builds a delivery-time regression, finds a delivery will take 42 minutes, then tells the dispatcher \"leave 45 minutes.\" Which modeling step is \"tell the dispatcher 45 minutes\"?", "o": [["Turning the math back into a real solution", "Step 3: translate the math answer into action."], ["Expressing the real-life situation as math", "That's step 1, building the model.", "Mixing up steps 1 and 3."], ["Analyzing the math to get a numeric answer", "That's step 2 (getting 42 minutes).", "Mixing up steps 2 and 3."], ["Validating the model on held-out data", "Validation is cross-cutting, not a modeling step here.", "Mixing up concepts."]]}, "M1 L3#3–4": {"q": "To plan deliveries, an analyst writes cost = 50 × trucks + 3 × miles. In the modeling cycle (real situation → math → analysis → real answer), what is this equation?", "o": [["The model: the real situation expressed as math", "Writing the situation as math is the modeling step."], ["The analysis: solving the math to get a number", "Analysis comes after, when you use the equation.", "Thinking the model is the solving step."], ["The solution: the recommendation for the manager", "That's turning the math back into a real answer.", "Thinking the model is the final answer."], ["The data: the inputs the equation will be fit to", "The data feeds the model; it isn't the model itself.", "Equating the model with the data."]]}, "M1 L3#5": {"q": "In estimate = 37 + 81×Size + 76×Weight + 4×Distance, what happens if Weight increases while Size and Distance stay the same?", "o": [["The estimate rises by 76 per unit of Weight", "Each coefficient is the change in the estimate per unit of its input, holding the others fixed."], ["The estimate falls, since Weight adds more cost", "The coefficient on Weight is positive.", "Misreading the sign."], ["The estimate rises by 76 + 81 + 4 per unit", "Only Weight's coefficient applies when only Weight changes.", "Adding every coefficient."], ["Nothing, unless Size and Distance change too", "Each input affects the estimate on its own.", "Thinking inputs only act together."]]}, "M2 L1#2–6": {"q": "A spam filter's boundary is shifted so that only very clear spam gets filtered out. What is the trade-off?", "o": [["Fewer real emails are lost, but more spam gets in", "Shifting the boundary trades one type of error for the other."], ["Fewer real emails are lost, with no other change", "Shifting moves errors around; it doesn't remove them.", "Expecting a free lunch."], ["More real emails are lost, but less spam gets in", "That's shifting the boundary the other way.", "Moving the line the wrong way."], ["Both kinds of error fall, since the margin is wider", "Shifting changes position, not width.", "Confusing position with width."]]}, "M2 L1#7–8": {"q": "Voters are supportive, opposition, or undecided. Which method handles three classes most directly?", "o": [["KNN: a voter joins the most common nearby class", "Majority vote works for any number of classes."], ["One SVM line, which splits the data into three sides", "One line has only two sides.", "Forgetting a line splits in two."], ["Standardization, which turns three classes into one scale", "That's data preparation, not classification.", "Mixing up tools."], ["k-means, since there are no labels for any of the voters", "The voters' classes are known; that's classification.", "Confusing classification with clustering."]]}, "M2 L1#9": {"q": "A bank's loan data has six attributes: income, credit history, age, family size, assets, and liabilities. How does an SVM handle all six, not just two?", "o": [["Same way: a boundary with a coefficient per attribute", "With m attributes, the classifier is Σⱼ aⱼxⱼ + a₀ = 0 (a hyperplane)."], ["It uses only two at a time, so you choose the best pair", "SVM works in any number of dimensions.", "Thinking the 2-D picture is a limit."], ["It needs a kernel before it can use more than two", "Kernels allow curved boundaries, not extra attributes.", "Mixing up kernels and dimensions."], ["It first averages the six attributes into one score", "Each attribute gets its own coefficient.", "Collapsing the attributes."]]}, "M2 L1#10–12": {"q": "Two unscaled applicants differ by 30 credit-score points and $1,000 of income. What dominates their Euclidean distance?", "o": [["Income: √(30² + 1,000²) ≈ 1,000, nearly all of it", "The large-unit attribute swamps the other, which is why KNN needs scaling."], ["Credit score: it's the more important attribute", "Importance doesn't matter to raw distance; units do.", "Confusing importance with scale."], ["Both equally: distance treats attributes the same", "Raw distance favors big units.", "Ignoring units."], ["Neither: 30 and 1,000 cancel out in the formula", "Squares don't cancel.", "Misreading the formula."]]}, "M2 L1#13–17": {"q": "Many different lines separate a bank's repaid and defaulted applicants perfectly. Why does it matter which one you choose?", "o": [["A line close to some points is more likely to misclassify new ones", "That's why SVM picks the line with the widest margin."], ["It doesn't; lines that fit perfectly classify new points the same way", "Different lines can label new applicants differently.", "Thinking a perfect fit is enough."], ["Only the line through the average of the data is actually valid", "That's not the criterion.", "Confusing classification with regression."], ["The steepest line uses the attributes most efficiently for new data", "Slope isn't the criterion.", "Focusing on the wrong property."]]}, "M2 L2#2–7": {"q": "Why does SVM choose the separating line with the widest margin to the nearest points of each class?", "o": [["It leaves the most room for new points near the boundary", "New points that differ a bit from the training data are still likely to land on the right side."], ["It passes through as many of the data points as possible", "We want the line far from the points, not on them.", "Reversing the margin idea."], ["It guarantees zero classification errors on any new data", "It improves the odds but guarantees nothing.", "Overstating the margin."], ["It makes the model's coefficients as large as possible", "A wide margin comes from small coefficients (margin = 2/√Σaⱼ²).", "Reversing the math."]]}, "M2 L2#8–11": {"q": "A classifier separates its training data perfectly, but the boundary passes very close to a few points. Why is that risky?", "o": [["Slightly different new points may land on the wrong side", "A boundary hugging the data is fragile; a wide margin is more robust."], ["It must already misclassify some of the training data", "It can separate the training data perfectly and still be fragile.", "Confusing fragility with training error."], ["It means the model relies equally on every data point", "Only the nearby points set such a boundary.", "Misunderstanding what drives the line."], ["It means no straight line could ever separate the classes", "They are separated; the issue is how narrowly.", "Confusing narrow with inseparable."]]}, "M2 L2#12–14": {"q": "A bank's repaid and defaulted applicants overlap, so no straight line separates them perfectly. What does a soft-margin SVM do?", "o": [["Accepts some errors in exchange for a wider margin", "It minimizes errors + λ·(margin term), balancing the two."], ["Deletes the points on the wrong side, then draws the line", "It keeps the data and accepts some errors.", "Treating inconvenient points as bad data."], ["Refuses to fit until the classes separate perfectly", "That's a hard margin; soft margins exist for this case.", "Thinking SVMs need perfect separation."], ["Switches to clustering, since overlapping classes fail", "It stays a classification problem.", "Confusing overlap with missing labels."]]}, "M2 L2#15–19": {"q": "Foraging for mushrooms, calling a poisonous one \"safe\" is far worse than throwing away a safe one. How should the classifier line move?", "o": [["Toward the safe side, so borderline ones get called poisonous", "Give more room on the side of the costlier mistake."], ["Toward the poisonous side, so borderline ones get called safe", "That makes the costly mistake more common.", "Moving the line the wrong way."], ["Stay centered, since the widest margin is always best", "Unequal costs justify shifting it.", "Ignoring error costs."], ["Stay put, and drop borderline mushrooms from the data", "The fix is to shift the line, not delete data.", "Treating the problem as bad data."]]}, "M2 L2#20": {"q": "An SVM on scaled income and credit score gives a near-zero income coefficient and a large credit-score coefficient. What does that mean?", "o": [["Income adds little; credit score mostly decides the class", "The boundary is nearly perpendicular to the credit-score axis, so income barely moves it."], ["Income matters most, since its coefficient is small and precise", "A small coefficient means little influence.", "Reversing the logic."], ["The model is broken, since both coefficients should be similar", "Unequal coefficients just show unequal importance.", "Expecting equal weights."], ["Credit score adds little, since large coefficients are penalized", "The penalty keeps coefficients small overall; a large one still means impact.", "Misreading the penalty."]]}, "M2 L3#3": {"q": "A restaurant's table has daily hamburger sales, day of week, and \"holiday (y/n).\" Which labeling is right?", "o": [["Sales: quantitative; day: categorical; holiday: binary", "Binary is a subset of categorical data."], ["Sales: categorical; day: quantitative; holiday: binary", "Higher sales mean more; day names have no order meaning here.", "Swapping types."], ["Sales: quantitative; day: quantitative; holiday: unstructured", "Day of week is categorical; holiday is binary.", "Treating labels as numbers."], ["All three are unstructured, since they're recorded daily", "They're structured data.", "Confusing time series with unstructured."]]}, "M2 L3#4–5": {"q": "A housing data set has size, age, location, and sale price. You want to estimate sale prices for new listings. Which column is the response?", "o": [["Sale price: the answer you want for each point", "The response (outcome) is what the model predicts."], ["Size, since it's the most important attribute", "Important inputs are still attributes.", "Confusing importance with role."], ["Location, since it's the only categorical column", "Data type doesn't decide the role.", "Confusing type with role."], ["None; every column in the table is an attribute", "The column you predict is the response.", "Missing the response."]]}, "M2 L3#6": {"q": "Which data set is unstructured, and why?", "o": [["Free-text customer reviews: hard to store in columns", "Structured data can be described and stored in a structured way; text can't easily."], ["Hair color for 1,000 people, since the values aren't numbers", "Categorical data is still structured.", "Thinking non-numeric means unstructured."], ["Zip codes for 1,000 homes, since their numbers have no meaning", "That's categorical, still structured.", "Confusing categorical with unstructured."], ["A store's daily sales, since the values change over time", "That's a time series, still structured.", "Confusing time series with unstructured."]]}, "M2 L3#7": {"q": "Zip codes are numbers. Why are they treated as categorical rather than quantitative?", "o": [["A higher zip code doesn't mean more of anything", "Quantitative numbers have meaning (higher = more); zip codes are just labels."], ["They have too many digits to be used quantitatively", "Digit count isn't the issue.", "Guessing from number format."], ["They are always stored as text inside databases", "Storage format doesn't decide the type.", "Confusing storage with meaning."], ["Quantitative data always has to include decimals", "Whole numbers can be quantitative (e.g., sales).", "Inventing a rule."]]}, "M2 L3#8": {"q": "A child's height is recorded on most birthdays, but a few years are skipped. Is it still time-series data?", "o": [["Yes: the same data recorded over time; gaps are allowed", "Time series are often, but not always, at equal intervals."], ["No: the gaps make it unrelated data about separate years", "It's still one quantity tracked over time.", "Over-restricting the definition."], ["No: a time series must be recorded at equal intervals", "Equal intervals are common but not required.", "Over-restricting the definition."], ["Only after the missing years are filled in by estimates", "It's a time series with or without imputation.", "Confusing cleaning with definition."]]}, "M2 L4#4": {"q": "A genetics study has 20,000 attributes (genes) but only 80 patients. What is the main risk when fitting a classifier?", "o": [["It can separate the data by chance and generalize poorly", "With far more attributes than points, a spurious boundary is easy to find."], ["No classifier can be fit with more attributes than rows", "Methods like SVM can still be fit; the danger is overfitting.", "Thinking fitting is impossible."], ["More attributes always make any classifier more accurate", "Extra attributes add noise and chances for spurious fits.", "Assuming more columns help."], ["The patients are too alike for any boundary to exist", "With so many attributes, a boundary is easy to find.", "Reversing the problem."]]}, "M2 L4#5": {"q": "A linear classifier labels points by whether a weighted sum of attributes plus an intercept is above or below zero. What does changing only the intercept do?", "o": [["Slides the boundary without changing its direction", "The intercept shifts the line; the weights set its orientation."], ["Rotates the boundary toward the key attribute", "Rotation comes from changing the attribute weights.", "Confusing intercept with slope."], ["Changes how much each attribute matters to the class", "Relative importance comes from the weights.", "Confusing intercept with weights."], ["Widens the margin without moving the boundary", "Margin width depends on the attribute weights.", "Linking intercept to margin."]]}, "M2 L4#6–8": {"q": "A red point (yᵢ = −1) moves deeper into the red side, so Σⱼ aⱼxᵢⱼ + a₀ gets more negative. What happens to (Σⱼ aⱼxᵢⱼ + a₀)·yᵢ?", "o": [["It increases, so the ≥ 1 constraint holds more easily", "Multiplying a more negative number by −1 gives a larger positive number."], ["It decreases, so the point is more likely to break it", "The sign flip by yᵢ = −1 makes it grow.", "Forgetting to multiply by yᵢ."], ["It stays the same, since yᵢ doesn't change at all", "The score changes, so the product changes.", "Ignoring the score."], ["It becomes negative, so the point is now misclassified", "A red point deeper in red is more correctly classified.", "Reversing the logic."]]}, "M2 L4#9–11": {"q": "A hard-margin SVM is fit to data where the two classes overlap. What happens?", "o": [["No valid boundary exists, so a soft margin is needed", "Hard margin requires every point on its correct side, which is impossible here."], ["It finds the boundary with the fewest training errors", "A hard margin permits no errors at all.", "Confusing hard and soft margins."], ["It automatically drops the points that overlap", "It has no mechanism to remove data.", "Assuming automatic cleaning."], ["It widens the margin until the overlap disappears", "Widening the margin can't remove overlap.", "Misunderstanding the margin."]]}, "M2 L4#12–17": {"q": "The error term is max{0, 1 − (Σⱼ aⱼxᵢⱼ + a₀)yᵢ}. What does the \"0\" do?", "o": [["Points far enough on the correct side add no error", "If 1 − (…)yᵢ is negative, the point is past its margin, so it contributes 0."], ["It forces the intercept a₀ to be zero in the model", "It's a floor on the error, not a constraint on a₀.", "Misreading the 0."], ["It counts every misclassified point as exactly zero", "Misclassified points get positive error.", "Reversing the logic."], ["It stops the margin from ever getting any wider", "It's unrelated to margin width.", "Mixing up the terms."]]}, "M2 L4#18–20": {"q": "Why does a soft-margin SVM minimize error plus a weighted margin term, rather than just one of them?", "o": [["Each alone gives a poor boundary; the sum balances them", "Error alone can overfit; margin alone can ignore many errors."], ["Minimizing error alone always fits new data best", "It can give a narrow, overfit boundary.", "Equating training fit with quality."], ["Maximizing the margin alone always gives the fewest errors", "A very wide margin may misclassify many points.", "Overvaluing the margin."], ["Adding them removes the need to scale the data", "Scaling is still needed.", "Mixing up issues."]]}, "M2 L5#3–7": {"q": "After fitting an SVM, you add a new training point far from the boundary, on its correct side, and refit. What happens?", "o": [["Nothing; distant correct points don't set the boundary", "Only the support vectors, the points nearest the boundary, determine it."], ["The boundary shifts slightly toward the new point", "Only points at or inside the margin affect it.", "Thinking every point pulls."], ["The boundary shifts slightly away from the new point", "Only points at or inside the margin affect it.", "Thinking every point pushes."], ["The margin widens, since there's more data supporting it", "Adding distant points doesn't change the margin.", "More data means wider margin."]]}, "M2 L5#8–10": {"q": "In an SVM, what are the \"support vectors,\" and why do they matter?", "o": [["The points nearest the boundary; they alone set where it goes", "Moving far-away points doesn't change the line; moving support vectors does."], ["All points in the larger class, which pull the line toward them", "Only the closest points matter.", "Thinking every point pulls equally."], ["The coefficients aⱼ, which set the slope and the margin width", "Those are the model's parameters, not points.", "Confusing coefficients with points."], ["The points farthest from the line, which anchor it in place", "It's the closest points, not the farthest.", "Reversing the idea."]]}, "M2 L6#6–7": {"q": "You shift an SVM boundary away from its center and closer to the red margin line. What happens to how borderline points are classified?", "o": [["More borderline points get classified blue", "The red side shrinks, so fewer mistakes are made on the blue side (and more on red)."], ["More borderline points get classified red", "Moving toward red shrinks the red region.", "Moving the line the wrong way."], ["Nothing changes, since the margin width is the same", "The boundary's position decides the class of borderline points.", "Confusing position with width."], ["All points inside the margin become errors", "Only which side they fall on changes.", "Overstating the effect."]]}, "M2 L6#8–9": {"q": "An SVM spam filter can give each type of training error its own penalty. Losing a real email is much worse than missing a spam. How should penalties be set?", "o": [["Penalize flagging real email more than missing spam", "Costlier errors get bigger penalties, so the model avoids them more."], ["Penalize missing spam more than flagging real email", "That makes the costly error cheaper to the model.", "Flipping the weights."], ["Set a zero penalty on flagging real email", "A zero penalty makes that error free, not forbidden.", "Reversing the logic."], ["Keep equal penalties; rely on the margin weight", "The margin weight trades margin vs. error, not error types.", "Mixing up the two weights."]]}, "M2 L6#10–11": {"q": "An SVM uses income in dollars (~50,000) and credit score (~700) without scaling. Why does this distort the classifier?", "o": [["It minimizes Σaⱼ², so coefficient sizes depend on each unit", "Income needs a tiny coefficient, which skews the margin trade-off."], ["SVM software refuses to run on attributes outside 0 to 1", "It runs; the answer is just distorted.", "Thinking scaling is a software rule."], ["Unscaled data means the two classes can never be separated at all", "Scaling doesn't create or remove separability.", "Overstating the effect."], ["Large income values count as outliers and become support vectors", "Large units don't make points outliers.", "Confusing scale with outliers."]]}, "M2 L6#12–14": {"q": "After scaling, an SVM's coefficient on \"years at current address\" is 0.001, while the others are near 1. What's a reasonable conclusion?", "o": [["That attribute is probably not relevant; consider dropping it", "With scaled data, a near-zero coefficient means it barely moves the boundary."], ["It's the most important attribute, since its effect is so precise", "A small coefficient means little influence.", "Reversing the logic."], ["It should be unscaled again so that its coefficient becomes larger", "Unscaling changes the units, not its real influence.", "Chasing the number."], ["It means the data can't be separated with this set of attributes", "It's about one attribute's relevance.", "Mixing up unrelated issues."]]}, "M2 L6#15–16": {"q": "Approved and rejected applicants are separated by a curved boundary, not a straight line. How can SVM still be used?", "o": [["Use a kernel, which allows a nonlinear classifier", "Kernel methods extend SVM to curved boundaries."], ["It can't; SVM only ever draws straight lines", "Kernels let SVM handle nonlinear boundaries.", "Missing the extension."], ["Scale the data until the curved boundary straightens", "Scaling changes units, not the shape of the boundary.", "Overstating scaling."], ["Add more classes until each boundary becomes linear", "The number of classes is set by the problem.", "Inventing a fix."]]}, "M2 L7#3–4": {"q": "Credit scores are scaled to [0, 1] using the data's min (300) and max (850). A new applicant with a score of 900 is added and becomes the new max. What happens to everyone else's scaled scores?", "o": [["All except the minimum shrink a bit, since the range is wider", "(x − min)/(max − min): a bigger max means a bigger denominator. The minimum stays at 0."], ["They all get a bit larger, since the max went up", "A larger max shrinks the scaled values.", "Reversing the effect."], ["They stay the same, since only one point was added", "The max sets the scale for everyone.", "Missing the dependence on max."], ["Only scores near 850 change; the rest stay put", "Every scaled value depends on the max.", "Thinking the effect is local."]]}, "M2 L7#5–7": {"q": "An unscaled SVM has an income coefficient of 5 and a credit-score coefficient of 700. If each is nudged up by the same amount, which change raises Σⱼ aⱼ² more?", "o": [["The credit-score change: a big coefficient's square grows faster", "The increase in a² is about 2a × the change, so larger coefficients dominate."], ["The income change, since income values are much larger than scores", "Σaⱼ² depends on the coefficients, not on the data values.", "Confusing data size with coefficient size."], ["Both raise it equally, since the change to each is the same size", "Squares grow faster for larger numbers.", "Ignoring the square."], ["Neither raises it, since the margin only depends on the intercept", "The margin depends on Σaⱼ², not a₀.", "Misreading the margin."]]}, "M2 L7#8": {"q": "Household incomes are min-max scaled to [0, 1], and one billionaire is in the data. What happens to everyone else's scaled income?", "o": [["Almost all get squeezed into a narrow band near 0", "The extreme max inflates the range, compressing everyone else."], ["They spread out evenly across the full 0–1 range", "The outlier stretches the denominator, not the spread.", "Ignoring outliers' effect."], ["They're unaffected, since only the max itself changes", "Every value is divided by the full range.", "Thinking the effect is local."], ["They get pushed toward 1, since the max went up", "A bigger max lowers scaled values.", "Reversing the effect."]]}, "M2 L7#9": {"q": "After an attribute is standardized, what are its mean and standard deviation, and what does a value of −2 mean?", "o": [["Mean 0, SD 1; −2 is two SDs below the mean", "Each value becomes (xᵢⱼ − μⱼ)/σⱼ."], ["Min 0, max 1; −2 is an error in the data", "That's scaling to a bounded range.", "Mixing up scaling and standardization."], ["Mean 1, SD 0; −2 is three units below the mean", "SD 0 would mean no spread at all.", "Swapping the values."], ["Mean 0, SD 1; −2 is the second-lowest value", "It's a distance from the mean in SDs, not a rank.", "Reading it as a rank."]]}, "M2 L7#10–11": {"q": "RGB color values run from 0 to 255 and will feed a neur
