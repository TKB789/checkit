ate λ ⇔ exponential times between arrivals with mean 1/λ", "It works in both directions."], ["Poisson arrivals ⇔ normal inter-arrival times", "The gaps are exponential.", "Wrong distribution."], ["They're unrelated", "They describe the same process two ways.", "Missing the link."], ["Exponential mean = λ", "The mean gap is 1/λ.", "Inverting the mean."]]}, "M13 L3#10–11": {"q": "Software reports that inter-arrival times fit a Weibull with k = 1.002 better than an exponential. What should you think?", "o": [["It's essentially exponential; the extra parameter is probably fitting randomness", "k = 1 reduces the Weibull to the exponential."], ["Arrivals definitely aren't Poisson", "The difference is negligible.", "Overreading software output."], ["Always use the best-fitting distribution reported", "Think about what the output means.", "Trusting the ranking blindly."], ["The failure rate is clearly rising", "1.002 is essentially constant.", "Overreading the parameter."]]}, "M13 L3#12–15": {"q": "What does the Weibull shape parameter k > 1 mean?", "o": [["The failure rate increases over time, as with wear-out (e.g. tires)", "k < 1: decreasing; k = 1: constant (exponential)."], ["The failure rate decreases over time", "That's k < 1.", "Reversing."], ["Failures are memoryless", "That's k = 1.", "Wrong value."], ["The distribution becomes Poisson", "Weibull with k = 1 is the exponential, not Poisson.", "Wrong reduction."]]}, "M13 L3#16–18": {"q": "A part's Weibull shape parameter is k > 1. What does that mean?", "o": [["The failure rate increases over time: things wear out (like tires)", "k < 1: worst fail first; k = 1: constant rate."], ["Failures get rarer over time", "That's k < 1.", "Reversed."], ["The failure rate is constant", "That's k = 1.", "Wrong k."], ["The part never fails", "Wrong.", "Wrong."]]}, "M13 L3#19": {"q": "What is a Weibull distribution with k = 1?", "o": [["The exponential distribution", "Constant failure rate."], ["The normal distribution", "No.", "Wrong family."], ["The Poisson distribution", "Poisson counts arrivals; exponential is the time between them.", "Mixing count and time."], ["The geometric distribution", "That's discrete.", "Wrong family."]]}, "M13 L3#20": {"q": "Fitting software says the data are Weibull with k = 1.002. What's the sensible reading?", "o": [["Use an exponential (k = 1): the tiny difference is probably noise", "Treat software output as guidance."], ["k = 1.002 proves the failure rate is increasing", "The difference is negligible.", "Over-reading the fit."], ["Reject both distributions", "The fit is fine.", "Overreacting."], ["Always use the exact software output", "It can fit noise.", "Trusting software blindly."]]}, "M13 L4#5–7": {"q": "What does each point on a Q-Q plot of two data sets represent?", "o": [["The value at the same quantile in each data set", "E.g. both 25th percentiles."], ["One data point from each set, in the order collected", "Points are matched by quantile, not order.", "Wrong matching."], ["The difference between the means", "It shows whole distributions.", "Wrong summary."], ["A residual from a regression", "Unrelated.", "Wrong plot."]]}, "M13 L4#8–9": {"q": "Why look at a Q-Q plot instead of just running a statistical test?", "o": [["It shows where the distributions differ, such as the tails, which a single test value can hide", "Important if extreme values are the point of the study."], ["Tests can't compare distributions", "They can; they just give one number.", "Wrong belief."], ["Q-Q plots require equal sample sizes, making them stricter", "They don't require equal sizes.", "Wrong property."], ["It always gives a different answer from the test", "Often they agree; the plot adds detail.", "Overstating."]]}, "M13 L4#10–11": {"q": "On a Q-Q plot, data set 2 is higher at low quantiles and lower at high quantiles. What does that mean?", "o": [["Data set 2 is squashed toward the middle (less spread out)", "Its low values are higher and its high values lower."], ["Data set 2 is more spread out", "That would be the opposite pattern.", "Reversing."], ["The data sets match", "Matching points sit on the 45° line.", "Misreading."], ["Data set 2 is shifted up everywhere", "It's lower at the high end.", "Misreading."]]}, "M13 L4#12": {"q": "Besides comparing two data sets, what else can a Q-Q plot compare?", "o": [["One data set against a theoretical distribution (e.g. normal or exponential)", "Its quantiles vs the distribution's quantiles."], ["Two models' coefficients", "Not what Q-Q plots do.", "Wrong use."], ["A mean against a median", "Not a Q-Q plot.", "Wrong use."], ["Nothing else", "Comparing to a distribution is a main use.", "Too narrow."]]}, "M13 L4#13": {"q": "On a Q-Q plot, sample 2 is larger than sample 1 at low quantiles and smaller at high quantiles. What does that mean?", "o": [["Sample 2 is squashed toward the middle (lighter tails, less spread)", "Its low values are higher and its high values lower."], ["Sample 2 is more spread out", "Reversed.", "Reversed."], ["The samples match", "They would lie on the line.", "Wrong."], ["Sample 2 has a larger mean everywhere", "It's larger only at the low end.", "Wrong."]]}, "M13 L5#4–9": {"q": "What does Kendall notation describe, and what does it leave out?", "o": [["Arrival and service distributions, servers, queue size, population and discipline; not extensions like hanging up or balking", "Those can still be modeled, but the math gets hard; simulation is the fallback."], ["Only the number of servers", "It covers much more.", "Too narrow."], ["Everything about any queue", "Some behaviors aren't included.", "Overstating."], ["The cost of waiting", "Not part of the notation.", "Wrong content."]]}, "M13 L5#10–11": {"q": "Why can simple queues with Poisson arrivals and exponential service times be solved in closed form?", "o": [["Both are memoryless: exponential service times, and the Poisson arrival process (exponential gaps)", "How long a call has lasted, or since the last arrival, doesn't change what happens next."], ["Because there's only one server", "Closed forms also exist with more servers and capacity limits.", "Too narrow."], ["Because all callers wait the same time", "Waits vary.", "Wrong assumption."], ["Because arrivals are evenly spaced", "Poisson arrivals are random.", "Wrong assumption."]]}, "M13 L5#12": {"q": "For a simple queue with arrival rate λ and service rate μ > λ, what fraction of the time is the server busy?", "o": [["λ/μ", "Arrival rate over service rate (utilization)."], ["μ/λ", "Reversed; that's more than 1.", "Reversed."], ["λ/(μ − λ)", "That appears in waiting-time formulas.", "Wrong formula."], ["1, always", "Only if λ ≥ μ.", "Wrong."]]}, "M13 L5#13": {"q": "Tire failure becomes more likely the more a tire is worn. What does that imply about modeling it?", "o": [["It isn't memoryless, so it isn't exponential; a Weibull with k > 1 may fit", "Exponential times are memoryless; wear-out depends on past use."], ["It must be exponential", "Wear-out contradicts memorylessness.", "Ignoring wear."], ["It must be Poisson", "Poisson counts arrivals.", "Wrong distribution."], ["It can't be modeled", "The Weibull can model it.", "Giving up."]]}, "M13 L5#14–16": {"q": "Call lengths fit an exponential distribution. What does that tell you?", "o": [["The process is memoryless: the remaining call time doesn't depend on how long the call has lasted", "Exponential ⟺ memoryless."], ["Long calls are more likely to end soon", "That would be memory.", "Reversed."], ["Arrivals must be on a fixed schedule", "Unrelated.", "Wrong."], ["Nothing about memory", "Exponential is the memoryless distribution.", "Missing the point."]]}, "M13 L5#17–18": {"q": "Why can't tire failure at 10,000 miles be modeled with an exponential distribution?", "o": [["Tires wear out, so failure gets more likely with use: not memoryless (try Weibull with k > 1)", "The exponential assumes no wear."], ["Tires never fail", "Wrong.", "Wrong."], ["Miles aren't a measure of time", "Usage works like time here.", "Wrong reason."], ["Exponential only models counts", "It models times.", "Mixing families."]]}, "M13 L5#19–24": {"q": "In Kendall notation, what does \"M/M/1\" describe?", "o": [["Memoryless (Poisson) arrivals, memoryless (exponential) service, 1 server", "Arrivals / service / servers."], ["1 arrival per minute", "Not the meaning.", "Wrong."], ["A queue with a maximum length of 1", "Queue size is a later letter.", "Wrong position."], ["Mean arrivals equal mean service", "Not the meaning.", "Wrong."]]}, "M13 L6#3–4": {"q": "What's the difference between deterministic and stochastic simulations?", "o": [["Deterministic: same inputs always give the same outputs; stochastic: modeled randomness makes outputs vary", "Stochastic simulations are generally more useful in analytics."], ["Deterministic simulations run faster, so they're random", "Unrelated.", "Confusion."], ["Stochastic simulations use differential equations", "That's continuous-time simulation.", "Mixing categories."], ["There's no difference", "There is.", "Missing the distinction."]]}, "M13 L6#5–6": {"q": "Which simulation type fits a call center?", "o": [["Discrete-event: the state changes only when a call arrives or a worker finishes", "Continuous-time fits things like chemical processes."], ["Continuous-time with differential equations", "Better for processes that change continuously.", "Wrong type."], ["Deterministic only", "Calls are random.", "Ignoring randomness."], ["None; call centers can't be simulated", "They're a classic example.", "Wrong."]]}, "M13 L6#7–9": {"q": "Wafers arrive every 20 s on average and take 19 s to process on average. Why does a queue form?", "o": [["Random variability in arrivals and processing creates bursts, even though average capacity exceeds demand", "With exact averages, no queue would form."], ["Because 19 s is longer than 20 s", "It's shorter.", "Misreading the numbers."], ["Because the machine breaks down", "No breakdowns in the example.", "Inventing a cause."], ["A queue can't form here", "With randomness it does: the lecture says about 19 wafers on average (queueing math: ≈ 19 in the system, ≈ 18 waiting in line).", "Trusting averages."]]}, "M13 L6#10–13": {"q": "Why must a stochastic simulation be replicated many times?", "o": [["One run is a single random outcome that may not be representative", "Look at the distribution of outcomes."], ["To make the computer run faster", "More runs take longer.", "Wrong reason."], ["Because pseudo-random numbers repeat after one run", "That's not why.", "Wrong reason."], ["It doesn't need replication", "It does.", "Missing the step."]]}, "M13 L6#14": {"q": "In simulation software, what is an \"entity\"?", "o": [["Something that moves through the system, like a bag or a person", "Resources (e.g. workers) serve the entities."], ["A worker who serves customers", "That's a resource.", "Mixing terms."], ["A queue", "That's a module.", "Mixing terms."], ["A random number", "Generated under the hood.", "Wrong."]]}, "M13 L6#15": {"q": "A simulation matches the real system's average output but not its variability. Is it validated?", "o": [["No; variability should match too", "Same average with different spread isn't a good reflection of reality."], ["Yes; matching the average is enough", "Variability matters for decisions.", "Checking only averages."], ["Yes, if it ran 1,000 times", "Replication doesn't fix a wrong model.", "Confusing replication with validation."], ["Only if the simulation is deterministic", "Unrelated.", "Confusion."]]}, "M13 L6#16": {"q": "A simulation's average throughput matches real data, but its variance doesn't. Is it validated?", "o": [["No: both the average and the spread should match", "Matching only the mean isn't enough."], ["Yes: matching averages is enough", "Variability matters for decisions.", "Checking only the mean."], ["Yes, if the simulation ran long enough", "Run length doesn't fix a wrong spread.", "Wrong fix."], ["Validation isn't needed for simulations", "It's essential.", "Wrong."]]}, "M13 L7#3–9": {"q": "Why use the same random numbers in matching replications of two simulated setups?", "o": [["Each pair becomes the same scenario, so you can see which setup is better scenario by scenario", "That allows a paired, non-parametric comparison."], ["To make both setups give identical results", "Different setups still give different results.", "Misunderstanding."], ["To save memory", "Not the reason.", "Wrong reason."], ["Because random numbers can't change", "They can; this is a deliberate choice.", "Confusion."]]}, "M13 L7#10–13": {"q": "What's the main caveat about using simulation for decisions?", "o": [["It's only as good as its inputs; missing information or wrong assumptions give wrong answers", "E.g. assuming all workers are equally fast when they differ a lot."], ["Simulations are always too slow to use", "Not the caveat.", "Wrong concern."], ["Simulations can't handle randomness", "Stochastic simulations do.", "Wrong belief."], ["Simulation can only describe, not prescribe", "It's a strong prescriptive tool.", "Wrong belief."]]}, "M13 L7#14–15": {"q": "A call-center simulation assumes every worker answers calls equally fast, but real workers vary a lot. What's the risk?", "o": [["Wrong input assumptions can lead to wrong, costly decisions", "A simulation is only as good as its inputs."], ["None: averages are all that matter", "Variability changes queue behavior.", "Ignoring variability."], ["The simulation will refuse to run", "It runs; the answers are wrong.", "Wrong."], ["It makes the simulation more accurate", "Reversed.", "Reversed."]]}, "M13 L7a#2–4": {"q": "Why didn't the disease simulation match the real data at first?", "o": [["The real data came from contact tracing, which tends to overestimate prevalence and cluster size; the comparison had to simulate that collection process", "The disease model wasn't the problem."], ["The disease parameters were wrong", "They came from recent literature; the measurement differed.", "Blaming the wrong part."], ["Too few replications", "Not the issue identified.", "Wrong cause."], ["The simulation was deterministic", "Not the issue.", "Wrong cause."]]}, "M13 L7a#5": {"q": "Many disease simulations matched the end-of-period prevalence but disagreed shortly after. What was the lesson?", "o": [["Validate on several indicators (e.g. cluster-size distribution, largest cluster), not one number", "Several models can match one statistic."], ["Pick the model with the highest prevalence", "Not a validation principle.", "Arbitrary choice."], ["Any model matching prevalence is valid", "They gave very different predictions.", "Under-validating."], ["Validation isn't possible for disease models", "It was, with more metrics.", "Giving up."]]}, "M13 L7a#6–7": {"q": "How many metrics should a disease-spread simulation match to be validated?", "o": [["Several: prevalence, cluster-size distribution, largest cluster and others", "Matching one metric isn't enough."], ["Just overall prevalence", "Other metrics can still be wrong.", "Too few checks."], ["None if the medical parameters are current", "Up-to-date inputs still produced mismatches.", "Trusting inputs."], ["Only the one the client cares about", "Validate the structure too.", "Too narrow."]]}, "M13 L7a#8–13": {"q": "Why did contact-tracing data show a much higher disease rate than the true 29%?", "o": [["Contact tracing starts from sick people and their contacts, so the sample over-represents disease", "The collection method biased the data."], ["The simulation was wrong", "The real data was the biased one.", "Blaming the model."], ["The disease spread faster in reality", "Not the explanation.", "Wrong."], ["Random chance", "It was systematic bias.", "Wrong."]]}, "M13 L7a#14–16": {"q": "How was the disease simulation finally validated?", "o": [["Simulate the disease, then simulate the data collection (contact tracing), and compare that with the real data", "Then all metrics matched."], ["Change the medical parameters until prevalence matched", "That would fit the wrong target.", "Tuning to biased data."], ["Ignore the mismatched metrics", "They revealed the problem.", "Ignoring evidence."], ["Collect no more data", "Not the fix.", "Wrong."]]}, "M13 L8#3–5": {"q": "In a Markov chain, how do you get tomorrow's state probabilities from today's vector π?", "o": [["Multiply π by the transition matrix P", "Repeat for each further step."], ["Add P to π", "It's matrix multiplication.", "Wrong operation."], ["Multiply P by itself only", "That gives two-step transitions, not probabilities from π.", "Missing π."], ["Take the average of P's rows", "Not how steps work.", "Wrong operation."]]}, "M13 L8#6–9": {"q": "Why aren't Markov chains used more often, and where are they still useful?", "o": [["Real systems are rarely memoryless; but long-run analyses like PageRank and rankings can still be meaningful", "Memorylessness matters less in the long run."], ["They need too much data; they're useful only for weather", "Weather is actually a poor fit.", "Reversed example."], ["They can't have more than two states", "They can have many.", "Wrong limit."], ["They always lack a steady state", "Most real applications have one.", "Overstating."]]}, "M13 L8#10–14": {"q": "What equations give the steady-state probabilities?", "o": [["π P = π and the probabilities sum to 1", "In steady state, one more step leaves π unchanged."], ["π P = 0", "Steady state means unchanged, not zero.", "Wrong equation."], ["P = I", "That's not a condition on π.", "Wrong equation."], ["π = the first row of P", "Only by coincidence.", "Wrong shortcut."]]}, "M13 L8#15": {"q": "What is the key assumption of a Markov chain?", "o": [["Memoryless: the next state depends only on the current state", "Many real systems don't satisfy it, but long-run analysis can still work."], ["All states are equally likely", "Not required.", "Wrong."], ["States never repeat", "They can.", "Wrong."], ["Transitions depend on the whole history", "That's the opposite.", "Reversed."]]}, "M13 L8#16–20": {"q": "How can a Markov chain rank web pages?", "o": [["Model random jumps along links; pages with high steady-state probabilities rank higher", "A simplified version of PageRank."], ["Rank pages by number of words", "Not a Markov chain.", "Wrong."], ["Rank by the first step's probabilities", "Steady state, not one step.", "Wrong time scale."], ["Alphabetically", "No.", "Wrong."]]}, "M14 L1#5–7": {"q": "In the national temperature study, why is some data missing?", "o": [["Gauges break down, and readings go unrecorded until they're replaced", "Equipment failures leave gaps."], ["People skip the question on purpose", "That's the human-interaction example.", "Mixing up the examples."], ["The wireless transmission breaks up", "That's the biometric device example.", "Mixing up the examples."], ["The readings are too extreme and are removed as outliers", "Outliers are wrong-but-present values, a different issue.", "Confusing missing with outlier."]]}, "M14 L1#8": {"q": "What does the \"Data problems\" slide list?", "o": [["Missing data, wrong data, and often patterns in missing or wrong data", "All three points are on the slide."], ["Missing data only; wrong data is always caught", "Wrong data is listed too.", "Thinking wrong data is rare."], ["Outliers, duplicates and typos", "Not the slide's list.", "Inventing categories."], ["Missing data, which is always random", "The slide stresses there are often patterns.", "Assuming missingness is random."]]}, "M14 L1#9–13": {"q": "In the transplanted-livers example, why is \"headaches the week before\" missing more often than \"sex\"?", "o": [["It isn't in standard records; someone must ask and record it, and that may not happen", "Easy-to-observe facts are recorded; asked-for facts get skipped."], ["Patients with headaches refuse to answer", "No such claim; the issue is the question not being asked.", "Inventing a bias."], ["Headaches are rare, so the value is usually 0", "Not why it's missing.", "Confusing a value of 0 with missing."], ["It's an outlier and is removed", "It's never recorded at all.", "Confusing missing with outlier."]]}, "M14 L2#5–9": {"q": "In the consumer purchasing example, dropping people who don't report income gives a model that:", "o": [["Predicts low and middle earners well but is poorly trained for high earners", "High earners are the ones dropped."], ["Predicts high earners best", "They were mostly removed.", "Reversed direction."], ["Is equally good for everyone", "The dropped group is systematic.", "Assuming random missingness."], ["Can't be fit at all", "It can; it's just biased.", "Overstating."]]}, "M14 L2#10–12": {"q": "If a categorical variable has missing data, the simplest non-imputation fix is:", "o": [["Add a category called \"missing\"", "Employed (full, part, un-) becomes (full, part, un-, missing)."], ["Set the missing values to 0", "That's for quantitative variables.", "Mixing up the two cases."], ["Replace them with the mode", "That's imputation (estimating).", "Confusing flagging with imputing."], ["Drop the variable", "Not the slide's method.", "Overreacting."]]}, "M14 L2#13–15": {"q": "If a quantitative variable like height has missing data, the slide's approach is:", "o": [["Set all missing values to 0 and add a new categorical variable showing whether the value is missing", "Persons 4 and 6 get Height 0 and Missing? = Yes."], ["Add a category \"missing\" to the height values", "Height is numeric, so it can't take a category label.", "Using the categorical fix on numbers."], ["Replace missing heights with the mean height", "That's imputation, the next lesson.", "Confusing flagging with imputing."], ["Set missing heights to 0 with no other change", "Without the indicator, 0 would be read as a real height.", "Forgetting the indicator."]]}, "M14 L2#16–22": {"q": "Including interactions between the missing indicator and all other variables is like:", "o": [["Splitting into two models, one for points with height data and one without (a tree with a single branch)", "Each variable gets a separate coefficient for each group."], ["Imputing the missing heights", "No value is estimated.", "Confusing flagging with imputing."], ["Removing the points with missing height", "They stay, in their own model.", "Confusing with throwing away."], ["Adding random perturbation", "Nothing random is added.", "Mixing up lessons."]]}, "M14 L3#4–7": {"q": "What advantages does mean/median/mode imputation have?", "o": [["It hedges against being too wrong, and it's easy to compute", "Both are on the slide."], ["It removes bias", "It can be biased; that's its disadvantage.", "Reversed."], ["It captures the variability of the data", "Every missing value gets the same number.", "Confusing with perturbation."], ["It uses other factors to predict the value", "That's regression imputation.", "Confusing approaches."]]}, "M14 L3#8–10": {"q": "What are the slide's disadvantages of regression imputation?", "o": [["It's complex (build, fit, validate, test a model) and doesn't capture all the variability", "Both are listed."], ["It's always more biased than the mean", "It usually reduces bias.", "Reversed."], ["It can't use categorical factors like profession", "Profession is one of the example factors.", "Wrong limit."], ["It needs no validation", "It needs the full build-fit-validate-test process.", "Underestimating the work."]]}, "M14 L3#11–13": {"q": "What is \"perturbation\" in imputation?", "o": [["Adding a random amount up or down to each imputed value, e.g. normally distributed", "It restores realistic spread."], ["Removing imputed values that look wrong", "Nothing is removed.", "Confusing with outlier removal."], ["Re-running the regression many times", "Not the slide's method.", "Inventing a method."], ["Using the median instead of the mean", "That's a midrange choice.", "Confusing approaches."]]}, "M14 L3#14–19": {"q": "How does the slide answer \"doesn't imputation add errors?\"", "o": [["Yes… but regular data also probably has errors", "Typos, misread instruments, drifting sensors already affect \"complete\" data."], ["No, imputed values are exact", "They're estimates.", "Overconfidence."], ["Yes, so never impute", "The lesson still recommends limited imputation.", "Overreacting."], ["No, perturbation cancels the errors", "Perturbation adds error.", "Reversed."]]}, "M15 L1#2–4": {"q": "How does optimization relate to earlier models like regression and clustering?", "o": [["Many of them use optimization underneath to find their best parameters", "Optimization is a key part of descriptive and predictive models too."], ["It replaces them", "It sits under and on top of them.", "Overstating."], ["It's unrelated to them", "Most statistical/ML models are fitted by optimization.", "Missing the connection."], ["It's only used for clustering", "It's used for nearly all of them.", "Too narrow."]]}, "M15 L1#5–12": {"q": "Which is NOT one of the slide's examples of optimization for prescriptive analytics?", "o": [["Detecting a change in a process mean", "That's change detection (CUSUM), Module 6."], ["Airplane mechanic scheduling", "Listed.", "Missed the example."], ["Crude oil shipment planning", "Listed.", "Missed the example."], ["GPS routing for cars", "Listed.", "Missed the example."]]}, "M15 L1#13–14": {"q": "In the slide's diagram, what does optimization sit on top of?", "o": [["Descriptive and predictive analytics, and it feeds decision making", "Prescriptive analytics builds on the other two."], ["Decision making, which feeds it", "The arrow goes from optimization to decisions.", "Reversed arrow."], ["Only descriptive analytics", "Predictive analytics feeds it too.", "Incomplete."], ["Simulation only", "Not the diagram.", "Wrong module."]]}, "M15 L1#15–16": {"q": "What's different about software for optimization compared with regression?", "o": [["Software automates solving, but building the model is up to you", "For regression, software automates both."], ["Software automates building but not solving", "Reversed.", "Reversed roles."], ["There's no good software for solving", "Solvers are good.", "Underrating solvers."], ["Nothing; both are fully automated", "Model building needs human expertise.", "Missing the main point."]]}, "M15 L1#17–20": {"q": "What did the three studies show about prescriptive analytics use?", "o": [["3% in 2013, a prediction of 35% by 2020, and 85% by 2021", "Gartner 2013, Gartner 2016, Gurobi 2021."], ["85% in 2013, falling to 3% by 2021", "Reversed trend.", "Reversed order."], ["35% in 2013, then steady", "It started at 3%.", "Wrong numbers."], ["It was never measured", "Three studies are cited.", "Missed the slide."]]}, "M15 L2#4–11": {"q": "What are the variables in an optimization model?", "o": [["The decisions the solver picks the best values for", "E.g. time spent in each state."], ["The fixed data", "Data are constants in optimization.", "Statistics-style use of \"variable\"."], ["The restrictions on decisions", "Those are constraints.", "Confusing parts."], ["The quality measure", "That's the objective function.", "Confusing parts."]]}, "M15 L2#12–18": {"q": "Why is the constraint Σ_d vᵢd = yᵢ needed?", "o": [["The solver only sees the math, so related variables must be linked explicitly", "Otherwise it could set yᵢ = 12 and every vᵢd = 0."], ["To limit the campaign to 30 days", "That's a different constraint.", "Mixing constraints."], ["To make the objective linear", "Not its purpose.", "Inventing a reason."], ["It isn't needed; the definitions already link them", "The solver ignores English definitions.", "Trusting variable names."]]}, "M15 L2#19–20": {"q": "In the campaign objective, where do α, β, the square root and the day factors come from?", "o": [["Other analytics models, e.g. regression on past campaigns", "\"Determined by other analytics models!\""], ["The solver chooses them", "They're inputs, not decisions.", "Treating parameters as variables."], ["They're always 1", "They must be estimated.", "Ignoring estimation."], ["The constraints", "They're in the objective.", "Mixing parts."]]}, "M15 L2#21–26": {"q": "A feasible solution is:", "o": [["Variable values that satisfy all constraints", "Feasible = possible."], ["The best solution", "That's optimal.", "Feasible vs optimal."], ["Any guess, even one breaking constraints", "That's just a solution.", "Too loose."], ["A solution with the best constraint values", "Constraints aren't scored.", "Confusing parts."]]}, "M15 L3#4–17": {"q": "In the diet problem, what are the variables?", "o": [["xᵢ = amount of food i in the daily diet", "One variable per food."], ["aᵢⱼ = nutrient j per unit of food i", "That's data.", "Data vs variables."], ["mⱼ and Mⱼ, the nutrient limits", "Those are data.", "Data vs variables."], ["cᵢ = cost of food i", "That's data.", "Data vs variables."]]}, "M15 L3#18–21": {"q": "Which is NOT one of the \"other complexities\" for the diet model?", "o": [["Transaction fees per food", "That's from the stock model."], ["Variety in diets", "Listed.", "Missed it."], ["Seasonal cost variation", "Listed.", "Missed it."], ["Taste of combinations of foods", "Listed.", "Missed it."]]}, "M15 L3#22–28": {"q": "With xᵢ = number of people working on day i, what's hard to write?", "o": [["The rule that each worker works 5 days in a row, then 2 off", "\"5-day requirement: ???\""], ["The demand constraints", "Those are easy: xᵢ ≥ dᵢ.", "Wrong difficulty."], ["The objective", "Easy: sum of the xᵢ.", "Wrong difficulty."], ["Integrality", "Easy: xᵢ integer.", "Wrong difficulty."]]}, "M15 L3#29–34": {"q": "With start-day variables, the objective is:", "o": [["Minimize 5(x_Sun + x_Mon + … + x_Sat)", "Each starter works 5 days."], ["Minimize x_Sun + … + x_Sat", "That counts people, not worker-days.", "Missing the factor 5."], ["Minimize 2(x_Sun + … + x_Sat)", "2 is days off.", "Wrong factor."], ["Maximize Σ dᵢ", "Demand is data.", "Mixing parts."]]}, "M15 L4#3": {"q": "In Markowitz's model, what does θ do?", "o": [["Weights the risk term; varying it trades expected return against risk", "Larger θ penalizes variance more."], ["It's the budget", "That's B.", "Mixing symbols."], ["It's the transaction fee", "That's t.", "Mixing symbols."], ["It's each stock's expected return", "That's rᵢ.", "Mixing symbols."]]}, "M15 L4#4": {"q": "How is a per-stock transaction fee modeled?", "o": [["Subtract Σᵢ t yᵢ, with yᵢ = 1 if stock i is bought: a fixed charge", "Same fee whatever the amount."], ["Subtract Σᵢ t xᵢ", "That charges in proportion to the amount.", "Fixed vs proportional."], ["Add the constraint t ≤ B", "Not the model.", "Wrong part."], ["It can't be modeled", "Binaries make it easy.", "Missing the tool."]]}, "M15 L4#5": {"q": "What does the linking constraint xᵢ ≤ B yᵢ do?", "o": [["If yᵢ = 0, forces xᵢ = 0; if yᵢ = 1, allows up to B", "It ties the amount to the yes/no decision."], ["Forces at least B in each stock", "It's an upper limit.", "Wrong direction."], ["Sets a minimum investment", "That's xᵢ ≥ mᵢyᵢ.", "Mixing constraints."], ["Charges the transaction fee", "The fee is in the objective.", "Mixing parts."]]}, "M15 L4#6": {"q": "What does xᵢ ≥ mᵢ yᵢ do?", "o": [["If you invest in stock i, you invest at least mᵢ", "Either nothing or at least the minimum."], ["Caps investment at mᵢ", "It's a lower bound.", "Wrong direction."], ["Forces investing in every stock", "yᵢ = 0 allows 0.", "Missing the binary."], ["Links the fee to the amount", "Not its role.", "Mixing constraints."]]}, "M15 L4#7": {"q": "\"Invest in exactly one of Coca-Cola and PepsiCo\" is:", "o": [["y_Coca-Cola = 1 − y_PepsiCo", "Opposite decisions."], ["y_Coca-Cola = y_PepsiCo", "That's both or neither.", "Same vs opposite."], ["y_Coca-Cola + y_PepsiCo ≥ 1", "That allows both.", "At least vs exactly."], ["y_Coca-Cola = 1", "That's \"invest in Coca-Cola\".", "Wrong rule."]]}, "M15 L4#8–9": {"q": "In option 2, why is z_Energy ≥ yᵢ (for each energy stock) needed?", "o": [["So z_Energy must be 1 whenever any energy stock is bought", "Otherwise the solver sets z = 0 and skips the rule."], ["To cap energy investment", "Not its role.", "Wrong purpose."], ["To force buying energy stocks", "It only reacts to yᵢ.", "Reversed logic."], ["It isn't needed", "Without it the if-then fails.", "Missing the link."]]}, "M15 L4#10–11": {"q": "Which is NOT one of the four uses of integer variables listed?", "o": [["Making the model convex", "Integer variables make it non-convex and harder."], ["Fixed charges in the objective", "Listed.", "Missed it."], ["Constraints requiring same/opposite decisions", "Listed.", "Missed it."], ["If-then constraints", "Listed.", "Missed it."]]}, "M15 L4a#2–3": {"q": "The manager asks for \"schedules that don't conflict with the union contract and don't make us pay more than necessary.\" What must the analyst do?", "o": [["Discover the details: what the contract requires and how many workers are needed", "Real requests are vague."], ["Build the textbook model and stop", "The real constraints are still unknown.", "Skipping discovery."], ["Ignore the union contract", "It's the source of constraints.", "Missing the point."], ["Ask the solver to infer the constraints", "Solvers only use what you write.", "Over-trusting software."]]}, "M15 L4a#4–8": {"q": "For extra workers, the slide sets Prob(wait time > ??) < ??. For an emergency call center:", "o": [["Both ?? should be low", "Short waits, rarely exceeded."], ["Both can be higher", "That's the non-emergency case.", "Reversed cases."], ["Only the wait time matters", "Both thresholds matter.", "Incomplete."], ["No extra workers are needed", "Uncertainty needs a buffer.", "Ignoring variability."]]}, "M15 L4a#9–13": {"q": "Where might the daily demand dᵢ come from?", "o": [["Another model, such as a regression forecast", "Optimization inputs often come from other models."], ["The solver", "It's data, not a decision.", "Data vs variables."], ["The union contract", "The contract gives rules, not demand.", "Mixing sources."], ["It's always given exactly", "It must be estimated.", "Ignoring uncertainty."]]}, "M15 L4a#14–20": {"q": "If nobody mentions \"no partial shifts\", what might the model return?", "o": [["Fractional workers, e.g. 10.5 (ten full shifts plus one half shift)", "An unstated \"obvious\" constraint is missing."], ["An infeasible model", "It solves fine, just unrealistically.", "Expecting the solver to notice."], ["Exactly the right schedule", "It breaks an unstated rule.", "Trusting the first answer."], ["Negative workers", "Non-negativity is already there.", "Mixing constraints."]]}, "M15 L4a#21": {"q": "What's the recommended process?", "o": [["Get information, build the model, check whether solutions make sense, and repeat if not", "Modeling is iterative."], ["Build once, then deploy", "Feedback usually reveals gaps.", "One-shot thinking."], ["Solve first, ask questions later", "Discovery comes first.", "Reversed order."], ["Ask for all constraints in one meeting", "People can't list them all at once.", "Unrealistic."]]}, "M15 L4a#22–24": {"q": "In the professor's project where the company was accidentally violating US law, what happened?", "o": [["The goal shifted to minimizing the extra cost of full compliance, and optimization still slightly cut operating costs while avoiding a large fine", "Discovery found the violation."], ["The project was cancelled", "It continued with a new goal.", "Misremembering."], ["They ignored the law to save money", "They reached full compliance.", "Reversed."], ["Costs rose sharply", "Costs slightly fell.", "Reversed."]]}, "M15 L4a#25–30": {"q": "Which is NOT in the L4a summary?", "o": [["Always use the cheapest solver", "Not mentioned."], ["Discover constraints and the objective", "Listed.", "Missed it."], ["Maybe build other models for inputs", "Listed.", "Missed it."], ["Iterate between modeling, optimizing and feedback", "Listed.", "Missed it."]]}, "M15 L5#4–6": {"q": "As an optimization model, linear regression has:", "o": [["Variables a₀…aₘ, no constraints, and minimize the sum of squared errors", "Fit the coefficients."], ["Variables xᵢⱼ and constraints on yᵢ", "Data are constants.", "Statistics vs optimization view."], ["Constraints Σ|aⱼ| ≤ τ", "That's lasso.", "Wrong model."], ["Variables a₀…aₘ, constraint aⱼ ≥ 0, and maximize the number of points on the line", "No constraints; the objective is squared error.", "Inventing constraints and objective."]]}, "M15 L5#7–12": {"q": "From the optimization point of view, in regression:", "o": [["The aⱼ are variables and the xᵢⱼ are constants", "The solver picks the coefficients; data are fixed."], ["The xᵢⱼ are variables and the aⱼ are constants", "That's the statistics view.", "Swapped views."], ["Both are variables", "Data are fixed when fitting.", "Confusion."], ["Neither; only y varies", "The coefficients vary.", "Confusion."]]}, "M15 L5#13–15": {"q": "Ridge regression as optimization is linear regression plus:", "o": [["The constraint Σⱼ aⱼ² ≤ τ", "Sum of squared coefficients."], ["The constraint Σⱼ |aⱼ| ≤ τ", "That's lasso.", "Lasso vs ridge."], ["λΣ|aⱼ| + (1 − λ)Σaⱼ² ≤ τ", "That's elastic net.", "Mixing models."], ["No change", "It adds a constraint.", "Missing it."]]}, "M15 L5#16": {"q": "What does logistic regression's optimization maximize?", "o": [["Πᵢ:yᵢ=1 p(xᵢ) × Πᵢ:yᵢ=0 (1 − p(xᵢ)), the likelihood of the observed outcomes", "Coefficients that make the observed 0/1 data most likely."], ["Σ (yᵢ − p(xᵢ))²", "Not the slide's objective.", "Using linear regression's form."], ["The margin", "That's SVM.", "Mixing models."], ["Σ aⱼ²", "Not logistic regression.", "Mixing models."]]}, "M15 L5#17–18": {"q": "In hard-classification SVM as an optimization, what are the constraints?", "o": [["(a₀ + Σⱼ aⱼxᵢⱼ)yᵢ ≥ 1 for every point: all points correctly classified", "Hard = no errors allowed."], ["None", "That's soft classification.", "Hard vs soft."], ["0 ≤ aⱼ ≤ 1", "That's exponential smoothing's style.", "Mixing models."], ["Σ aⱼ² ≤ τ", "That's ridge.", "Mixing models."]]}, "M15 L5#19–22": {"q": "What do ARIMA and GARCH minimize when fitted?", "o": [["Squared error: Σ(xₜ − x̂ₜ)² for ARIMA, Σ(σₜ² − σ̂ₜ²)² for GARCH", "Both minimize squared error; GARCH on the variance."], ["The number of parameters", "Not the objective.", "Confusing with model selection."], ["The margin", "That's SVM.", "Mixing models."], ["Total distance to centers", "That's k-means.", "Mixing models."]]}, "M15 L5#23–24": {"q": "What does Σₖ yᵢₖ = 1 mean in k-means?", "o": [["Each data point is assigned to exactly one cluster", "The assignment constraint."], ["Each cluster has one point", "Summed over clusters, not points.", "Wrong index."], ["Only one cluster exists", "Misreading.", "Misreading."], ["Centers sum to 1", "Centers are coordinates.", "Wrong variable."]]}, "M15 L5a#3–8": {"q": "Why change the regression error exponent from 2 to 3/2 or 1?", "o": [["To reduce how much points far from the line pull the coefficients", "Squaring gives large residuals the biggest influence."], ["To increase the influence of far points", "A lower exponent reduces it.", "Reversed."], ["To make the model a network model", "Not related.", "Inventing."], ["To force a zero intercept", "That's a constraint, not an exponent.", "Mixing customizations."]]}, "M15 L5a#9–11": {"q": "In the steamroller example, why add a₀ = 0?", "o": [["With the motor off (setting 0), acceleration must be 0", "A physical fact becomes a constraint."], ["To reduce overfitting", "That's lasso/ridge.", "Mixing reasons."], ["Because the intercept is always 0", "Only when the question requires it.", "Overgeneralizing."], ["To make coefficients decreasing", "That's a different example.", "Mixing examples."]]}, "M15 L5a#12–14": {"q": "In the sports example, what constraints were added?", "o": [["a₁ ≥ a₂ ≥ … ≥ aₙ, and the differences between consecutive coefficients decreasing too", "Ordered (order-constrained) regression."], ["All coefficients equal", "Not the example.", "Misreading."], ["All coefficients positive only", "Not the full rule.", "Incomplete."], ["a₀ = 0", "That's the steamroller.", "Mixing examples."]]}, "M15 L5a#15–17": {"q": "What's the limitation of lasso for picking a specific number of features?", "o": [["τ controls the number only indirectly; you try values until you get the count you want", "There's no way to set τ for exactly F features."], ["Lasso can't select features", "It does, via zero coefficients.", "Mixing with ridge."], ["Higher τ gives fewer features", "Higher τ gives more.", "Reversed."], ["It always picks all features", "Not with small τ.", "Wrong."]]}, "M15 L5a#18–20": {"q": "In optimization feature selection, what does Σᵢ wᵢ = F do?", "o": [["Selects exactly F features", "wᵢ = 1 if feature i is selected."], ["Caps coefficient sizes at F", "Not its role.", "Mixing constraints."], ["Forces all coefficients to F", "Misreading.", "Misreading."], ["Sets the intercept", "Not related.", "Misreading."]]}, "M15 L5a#21–24": {"q": "Why are both aᵢ ≤ Uᵢwᵢ and aᵢ ≥ Lᵢwᵢ needed?", "o": [["One blocks a positive and one blocks a negative coefficient when wᵢ = 0, so aᵢ = 0", "Coefficients can have either sign."], ["One is enough", "An unselected feature could still have the other sign.", "Forgetting negatives."], ["To make coefficients decreasing", "Different rule.", "Mixing examples."], ["To select exactly F features", "That's Σwᵢ = F.", "Mixing constraints."]]}, "M15 L6#4": {"q": "What makes a model a linear program?", "o": [["A linear objective and constraints defined by linear equations and inequalities", "Fast even for very large instances."], ["Integer variables", "That's an integer program.", "Mixing types."], ["A quadratic objective", "That's a quadratic program.", "Mixing types."], ["Any convex objective", "That's a convex program.", "Too broad."]]}, "M15 L6#5–7": {"q": "A convex optimization program has:", "o": [["A convex objective if minimizing (concave if maximizing) and a convex constraint set", "Easy to solve mathematically, but can be slow."], ["A concave objective when minimizing", "Reversed.", "Convex vs concave."], ["Integer variables", "Those make it non-convex.", "Mixing types."], ["No constraints", "Constraints are allowed if the set is convex.", "Too narrow."]]}, "M15 L6#8": {"q": "A model maximizes expected return − θ × variance with linear constraints. What type is it, and how hard?", "o": [["A convex quadratic program: easy and fast, but not as fast as a linear program", "The Markowitz model is this type."], ["A linear program", "The objective is quadratic.", "Wrong type."], ["An integer program, so very slow", "No integer variables.", "Wrong type."], ["A non-convex program with no reliable solver", "It's convex.", "Wrong type."]]}, "M15 L6#9": {"q": "An integer program is:", "o": [["A linear program where some or all variables must be integers (possibly binary)", "Harder to solve, even with good software."], ["A linear program with integer data", "Integer data isn't the issue.", "Data vs variables."], ["Always faster than an LP", "It's slower.", "Reversed."], ["A program with only binary variables", "Binaries are one case.", "Too narrow."]]}, "M15 L6#10": {"q": "What makes an integer program harder than a linear program?", "o": [["Some variables must be whole numbers (or 0/1), which makes solving much harder", "Small ones can take days."], ["It has more constraints", "Not the defining difference.", "Wrong reason."], ["Binary variables make it easier", "Binary is still hard.", "Wrong."], ["It has a quadratic objective", "That's a quadratic program.", "Wrong type."]]}, "M15 L6#11": {"q": "What's the order from quickest/easiest to slowest/hardest?", "o": [["Linear, convex quadratic, convex, integer, general non-convex", "The slide's ranking."], ["Integer, linear, convex, convex quadratic, non-convex", "Integer programs are near the hard end.", "Wrong order."], ["Non-convex, convex, linear, integer, quadratic", "Reversed and scrambled.", "Wrong order."], ["Convex quadratic, linear, integer, convex, non-convex", "LPs are fastest.", "Wrong order."]]}, "M15 L6#12–15": {"q": "If a problem is too hard to solve optimally, what can you use?", "o": [["A heuristic: a rule-of-thumb process that usually gives good solutions", "As in k-means clustering."], ["Nothing; it can't be used", "Heuristics work.", "Giving up."], ["A larger problem", "Makes it harder.", "Backwards."], ["Remove the objective", "Then nothing is optimized.", "Nonsense."]]}, "M15 L6#16–21": {"q": "What special property do network models have?", "o": [["If all data are integer, the optimal variable values are automatically integer", "No integer constraints needed."], ["They're always non-convex", "They're LPs.", "Wrong type."], ["They need heuristics", "They solve very fast.", "Wrong."], ["They can't have arc capacities", "Min/max arc flows are allowed.", "Misreading."]]}, "M15 L6#22–25": {"q": "\"How much oil can get through a pipeline network each hour?\" is a:", "o": [["Maximum flow model", "Max throughput through a network."], ["Shortest path model", "That's routing.", "Mixing models."], ["Assignment model", "That's matching.", "Mixing models."], ["Integer program", "It's a network LP.", "Wrong type."]]}, "M15 L7#4–6": {"q": "How can the call center model be made conservative?", "o": [["Require expected demand plus an extra θ on each day", "Fewer shortages, more idle workers."], ["Require expected demand minus θ", "That makes shortages more likely.", "Wrong direction."], ["Remove the demand constraints", "Then no one is scheduled.", "Nonsense."], ["Minimize demand", "Demand is data.", "Data vs variables."]]}, "M15 L7#7–10": {"q": "What's a robust solution in scenario modeling?", "o": [["One that satisfies every scenario's constraints", "Safe but possibly expensive."], ["One that optimizes expected cost", "That's the other approach.", "Mixing approaches."], ["One for the most likely scenario only", "It covers all.", "Too narrow."], ["One with no constraints", "It has many.", "Wrong."]]}, "M15 L7#11–13": {"q": "What's the main difficulty with scenario models?", "o": [["Each scenario adds its own constraints, so models grow very large and may need heuristics", "Size explodes."], ["They can't handle uncertainty", "That's their purpose.", "Reversed."], ["They need no probabilities", "Expected-cost versions do.", "Wrong."], ["They're always infeasible", "Not true.", "Overstating."]]}, "M15 L7#14–19": {"q": "A Markov decision process is:", "o": [["A stochastic dynamic program with discrete states and decisions, where probabilities depend only on the current state and decision", "Memoryless transitions plus decisions."], ["A deterministic dynamic program", "It's stochastic.", "Missing the randomness."], ["A Markov chain with no decisions", "It has decisions.", "Mixing with M13."], ["A linear program", "Different structure.", "Mixing types."]]}, "M15 L8#4–8": {"q": "What are the two main steps of most optimization algorithms?", "o": [["Create a first solution, then repeatedly move in an improving direction by a step size", "New = old + θt."], ["Guess randomly until done", "Not the method.", "Too vague."], ["Solve all constraints, then the objective", "Not the method.", "Inventing."], ["Build the model, then validate it", "That's modeling, not solving.", "Mixing topics."]]}, "M15 L8#9": {"q": "In Newton's method xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ), what's the step size?", "o": [["1, with improving direction −f(xₙ)/f′(xₙ)", "It moves one unit along the direction."], ["f′(xₙ)", "That's part of the direction.", "Mixing parts."], ["f(xₙ)", "That's part of the direction.", "Mixing parts."], ["0", "Then nothing moves.", "Nonsense."]]}, "M15 L8#10–13": {"q": "For a convex optimization problem, these algorithms:", "o": [["Are guaranteed to find the optimal solution", "Convexity guarantees it."], ["May stop at a local optimum", "That's the non-convex risk.", "Mixing cases."], ["Always converge to infeasible points", "No.", "Overstating."], ["Never finish", "They converge.", "Wrong."]]}, "M15 L8#14": {"q": "Which typically take longest to solve?", "o": [["Integer programs", "Tree-based searches with many subproblems."], ["Linear programs", "Often fast.", "Reversed."], ["Network models", "Very fast.", "Reversed."], ["Convex quadratic programs", "Fast-ish.", "Wrong ranking."]]}, "M16 L1#2–3": {"q": "When are non-parametric tests the right choice?", "o": [["When we have responses but no good model of their underlying distribution", "They work from ranks or counts instead of a known distribution."], ["Only when the data are normally distributed", "That's when parametric tests work best.", "Reversed assumption."], ["Only when the sample is very large", "Sample size isn't the trigger; the unknown distribution is.", "Wrong trigger."], ["When we want to estimate the mean exactly", "Means are the parametric case.", "Mixing test families."]]}, "M16 L1#4–9": {"q": "Treatment A works on 61 of 100 virus samples and B on 68. Why can the same totals give p ≈ 0.02 in one scenario and p ≈ 0.38 in another?", "o": [["McNemar depends on how the discordant pairs split: 7 vs 0 is strong evidence, 27 vs 20 is weak", "Only disagreements matter, and their balance sets the p-value."], ["The second scenario used fewer samples", "Both used the same 100 samples.", "Misreading the setup."], ["The totals were computed differently", "The totals (61 and 68) are identical.", "Misreading the setup."], ["McNemar's test is unreliable", "It's working as intended: the pairing carries the information.", "Blaming the test."]]}, "M16 L1#10–11": {"q": "What does the Wilcoxon signed rank test for medians assume?", "o": [["The distribution is continuous and symmetric", "Those are its only assumptions."], ["The distribution is normal", "No specific distribution is assumed.", "Too strong."], ["The data are yes/no outcomes", "That's McNemar's territory.", "Mixing tests."], ["Nothing at all", "Continuity and symmetry are assumed.", "Too weak."]]}, "M16 L1#12–13": {"q": "Paired data: which test for numeric outcomes and which for yes/no outcomes?", "o": [["Numeric → Wilcoxon signed rank; yes/no → McNemar", "The outcome type picks between them."], ["Numeric → McNemar; yes/no → Wilcoxon", "Reversed.", "Reversed."], ["Both → Mann-Whitney", "Mann-Whitney is for unpaired data.", "Ignoring pairing."], ["Both → t-test", "That's parametric and for numeric data only.", "Wrong family."]]}, "M16 L1#14": {"q": "In the Mann-Whitney test, what is U?", "o": [["The smaller of the two groups' rank sums, each minus its minimum possible value", "U_y = Σ rank(yᵢ) − n(n+1)/2, and likewise for z; U = the smaller."], ["The larger raw rank sum", "The smaller (adjusted) sum is used.", "Reversed."], ["The difference in group medians", "U is built from ranks, not medians.", "Wrong statistic."], ["The number of observations in the smaller group", "That's a sample size, not the statistic.", "Wrong quantity."]]}, "M16 L1a#2–3": {"q": "Which pairing of test family and what it uses is correct?", "o": [["Parametric → exact values (e.g. the mean); non-parametric → ranks (e.g. the median); binomial → successes and failures", "That's the three-way split."], ["Parametric → ranks; non-parametric → exact values", "Reversed.", "Reversed."], ["Binomial → the median", "Binomial tests count successes.", "Mixing families."], ["Non-parametric → the mean", "Means are parametric.", "Mixing families."]]}, "M16 L1a#4–5": {"q": "Flight prices: one dataset from every Monday, one from every Thursday of the same year. Is the data paired?", "o": [["Yes: each week gives one Monday and one Thursday price", "The week links each pair."], ["No, because they're different days", "Different days can still pair up by week.", "Missing the natural pairing."], ["Only if the prices are equal", "Pairing is about structure, not values.", "Confusing pairing with equality."], ["It can't be paired, because pairs need the same flight on the same day", "Pairs just need a natural one-to-one link.", "Too strict."]]}, "M16 L1a#6–8": {"q": "Prices from the first 30 Mondays and the last 30 Thursdays of the year. What test structure fits?", "o": [["Unpaired two-sample", "There's no natural link between a particular Monday and a particular Thursday."], ["Paired two-sample", "The weeks don't line up, so there are no pairs.", "Seeing pairs that aren't there."], ["One-sample", "There are two data sets.", "Wrong number of sets."], ["Paired or unpaired doesn't matter", "It decides between, e.g., Wilcoxon and Mann-Whitney.", "Ignoring structure."]]}, "M16 L1a#9–11": {"q": "A question about a success probability or fraction of successes calls for which kind of test?", "o": [["A binomial-based test", "Counts of binary outcomes follow a binomial distribution."], ["A parametric test on the mean", "The question is about counts of successes.", "Wrong family."], ["A rank-based test", "Ranks are for medians and other rank metrics.", "Wrong family."], ["No test is possible", "Binomial tests handle it.", "Too pessimistic."]]}, "M16 L1a#12–17": {"q": "Two antibiotics are each tested on the same 50 bacteria strains. Comparing the number of strains where A beats B needs which test?", "o": [["A paired binomial-based test", "Each strain is a pair, and the outcome is binary (A better or B better)."], ["A paired parametric test", "That's for comparing average remaining bacteria.", "Wrong metric."], ["A paired non-parametric test", "That's for comparing median remaining bacteria.", "Wrong metric."], ["An unpaired test", "Every strain gets both antibiotics, so the data are paired.", "Missing the pairing."]]}, "M16 L2#2–4": {"q": "Why does the lesson stress explaining Bayesian results to decision-makers?", "o": [["The results are often counterintuitive, and acceptance depends on people who never learned the math understanding them", "Explaining the intuition gets results used."], ["Bayesian math is harder than other models in the course", "The transcript says it isn't harder.", "Misreading the reason."], ["Decision-makers must redo the calculations", "They need the intuition, not the math.", "Wrong goal."], ["Bayesian models are rarely right", "The NCAA data confirm the model.", "Wrong claim."]]}, "M16 L2#5–8": {"q": "Why is the chance of disease so low after a positive test?", "o": [["Healthy people are so common that false positives outnumber true positives", "About 8 false positives for every true one."], ["The test is inaccurate", "It catches 98% of cases; the base rate is the issue.", "Blaming the test."], ["Most sick people test negative", "Only 2% of sick people test negative.", "Wrong reason."], ["The calculation ignores the prior", "It uses the 1% prior; that's exactly why it's low.", "Reversed."]]}, "M16 L2#9–11": {"q": "When is empirical Bayes especially useful?", "o": [["When an overall distribution is known or estimable but there's little data for the specific case", "It combines a broad prior with a small specific sample."], ["When there's a huge amount of data for every case", "Then the prior adds little.", "Reversed."], ["Only when the data are binary", "The NCAA example uses point margins.", "Too narrow."], ["When no past data exist", "Past data are needed to estimate the prior.", "Missing the input."]]}, "M16 L2#12–18": {"q": "In X ~ N(m + h, σ²), what are m and h?", "o": [["m = the true strength difference (unknown); h = home-court advantage", "The observed margin is centered on their sum."], ["m = the observed margin; h = the home team's points", "x is the observed margin.", "Mixing observed and true."], ["m = the mean margin over all games; h = the variance", "σ² is the variance.", "Mixing parameters."], ["m = the home team's strength; h = the road team's strength", "m is a difference between them.", "Wrong definition."]]}, "M16 L2#19–21": {"q": "What does the model predict if the 20-point winner plays the same opponent on the road?", "o": [["It's slightly more likely to lose, and real data agree", "3.5 points of real edge is less than the 4-point home advantage."], ["It wins by about 20 again", "The margin was mostly luck and home court.", "No shrinkage."], ["It wins by about 16", "Home court flips to the other team.", "Forgetting h."], ["The model can't say", "It gives the posterior and P(better).", "Too pessimistic."]]}, "M16 L3#2–4": {"q": "Why does finding communities matter for spread (flu, marketing)?", "o": [["Within a highly interconnected group, things spread much faster", "Many direct and two-step links to the source."], ["Communities block all spread", "Spread is just slower between groups.", "Overstating."], ["Spread only happens along cliques", "Any edges carry it.", "Too narrow."], ["It only matters for computer viruses", "Marketing, disease, language and more.", "Too narrow."]]}, "M16 L3#5–9": {"q": "What is a clique?", "o": [["A set of nodes that all have edges to each other", "Every pair is connected."], ["Any group with many edges", "That's a community; a clique needs every edge.", "Mixing terms."], ["A single node with no edges", "That's an isolated node.", "Wrong term."], ["The longest path in a graph", "Unrelated.", "Wrong term."]]}, "M16 L3#10–11": {"q": "How do communities differ from cliques?", "o": [["Communities only need many internal edges; some can be missing", "Finding cliques is hard, and full cliques aren't required."], ["They're the same thing", "A clique needs every edge.", "Merging terms."], ["Communities have no internal edges", "They're densely connected.", "Reversed."], ["A community must contain a clique", "Not required.", "Inventing a rule."]]}, "M16 L3#12–16": {"q": "What does modularity measure?", "o": [["How well the graph splits into groups connected a lot inside and little between", "Internal weight beyond what the nodes' weights would give by chance."], ["The number of nodes", "Not a size measure.", "Wrong idea."], ["The length of the shortest path", "Different measure.", "Wrong idea."], ["How many cliques exist", "It's about partition quality.", "Wrong idea."]]}, "M16 L3#17–22": {"q": "In Step 1 of Louvain, what happens to each node?", "o": [["It moves to the adjacent community that raises modularity the most, or stays if no move helps", "Greedy moves, repeated until none improve."], ["It's merged with its nearest neighbor no matter what", "Moves must raise modularity.", "Ignoring the criterion."], ["It's removed from the graph", "Nodes are reassigned, not removed.", "Inventing a step."], ["It forms a clique", "Cliques aren't required.", "Mixing terms."]]}, "M16 L4#2–4": {"q": "What kind of problem are neural networks and deep learning best suited to?", "o": [["Reacting to patterns we can't describe with rules, such as handwriting in CAPTCHAs", "They learn whatever pattern our brains react to."], ["Problems with a simple known formula", "Then use the formula.", "Wrong fit."], ["Planning delivery routes of varying size", "Optimization fits routing better.", "Wrong tool."], ["Small datasets with few observations", "They need lots of data.", "Reversed."]]}, "M16 L4#5–10": {"q": "What does each neuron do?", "o": [["Takes inputs from the previous layer, computes a function of the weighted inputs, and passes the output on", "That's the slide's description."], ["Stores one training example", "It transforms inputs; it doesn't store data.", "Wrong idea."], ["Picks the final answer", "Only the output layer's strongest result does.", "Too narrow."], ["Counts the inputs", "It weights and transforms them.", "Wrong idea."]]}, "M16 L4#11–12": {"q": "How does a neural network learn?", "o": [["Weights are updated based on how wrong the outputs were, e.g. by gradient descent", "Errors drive the updates."], ["It's given the weights by an expert", "They're learned from data.", "Wrong idea."], ["It memorizes each input", "It adjusts weights to generalize.", "Wrong idea."], ["It picks the best of several random networks", "Not the method described.", "Inventing a method."]]}, "M16 L4#13–14": {"q": "How does deep learning differ from a basic neural network?", "o": [["Same layered idea, with many layers; in practice often better", "\"Deep\" means many layers."], ["It uses no layers", "It's layered too.", "Wrong idea."], ["It's a completely new idea", "The core is old; making it work is recent.", "Wrong history."], ["It's only for numeric tables", "Strong in language, speech and images.", "Wrong scope."]]}, "M16 L5#2–8": {"q": "Why do prescriptive models need game theory in some situations?", "o": [["They assume the system doesn't react, but competitors or people may react intelligently to the decision", "Then you must consider all sides."], ["They can't use data", "They use data; the issue is reaction.", "Wrong issue."], ["They only work with optimization", "Game theory also uses optimization.", "Wrong issue."], ["Descriptive models already cover reactions", "They don't model reactions.", "Wrong claim."]]}, "M16 L5#9–13": {"q": "Which situation is both competitive and cooperative?", "o": [["Supply chain partners who need the product to succeed but negotiate payments", "That's cooperative game theory."], ["A sealed-bid auction", "Purely competitive.", "Missing the cooperative part."], ["Rock-paper-scissors", "Purely competitive, zero-sum.", "Wrong example."], ["Two gas stations setting prices", "Competitive (unless they collude).", "Wrong example."]]}, "M16 L5#14–16": {"q": "What is a sequential game?", "o": [["Decisions are made in turn, and a player may see the other's choice first", "Unlike simultaneous games such as sealed-bid auctions."], ["Everyone decides at once and can't change", "That's simultaneous.", "Reversed."], ["A game played many times", "That's a repeated game.", "Wrong term."], ["A game with random moves", "That's about mixed strategies.", "Wrong term."]]}, "M16 L5#17–22": {"q": "Why is a mixed strategy best in rock-paper-scissors?", "o": [["Any pure strategy can be exploited, so randomizing with probability 1/3 each is the best bet", "Predictability loses."], ["Rock always wins", "Paper beats rock.", "Wrong claim."], ["Mixed strategies guarantee a win", "They avoid being exploited; they don't guarantee wins.", "Overstating."], ["It's a sequential game", "It's simultaneous.", "Wrong type."]]}, "M16 L5#23–24": {"q": "Chess is an example of which kind of game?", "o": [["Perfect information", "Both players see everything."], ["Imperfect information", "Nothing is hidden in chess.", "Reversed."], ["Cooperative game", "Purely competitive.", "Wrong type."], ["Non-zero-sum game", "One side's win is the other's loss.", "Wrong type."]]}, "M16 L5#25–26": {"q": "Which describes a non-zero-sum game?", "o": [["The total benefit can be higher or lower depending on decisions, as in an economy", "The pie isn't fixed."], ["One side's gain equals the other's loss", "That's zero-sum.", "Reversed."], ["Nobody can win", "Not the definition.", "Wrong idea."], ["Every player gets the same payoff", "Not required.", "Wrong idea."]]}, "M16 L5#27–29": {"q": "How are the best strategies in competitive situations usually found?", "o": [["With optimization models", "Finding the best strategy is an optimization."], ["By regression", "Not the method.", "Wrong tool."], ["By trial and error only", "Optimization is used.", "Wrong tool."], ["They can't be found", "They usually can.", "Too pessimistic."]]}, "M16 L5a#2–5": {"q": "Gas stations, cost $1: why does each choose the lower price?", "o": [["Whatever the other charges, the lower price gives more profit (1.00d vs 0.75d, or 0.50d vs 0)", "Lower price is best in both columns."], ["Both together earn more at the lower price", "They'd earn more at the higher price (0.75d each).", "Reversed."], ["The lower price always gets all the demand", "At equal prices demand is split.", "Ignoring the tie case."], ["It's required by law", "Not part of the model.", "Inventing a rule."]]}, "M16 L5a#6–10": {"q": "What is a prisoner's dilemma in this example?", "o": [["The stable outcome is worse for both than agreeing on the higher price, yet each has an incentive to cheat on an agreement", "Individual incentives beat the joint best."], ["Both stations go bankrupt", "They still earn 0.50d each.", "Overstating."], ["One station always wins", "It's symmetric.", "Wrong idea."], ["The equilibrium is always worse in game theory", "Not always, as the $1.75 case shows.", "Overgeneralizing."]]}, "M16 L5a#11–14": {"q": "With cost $1.75, why is ($2.50, $2.50) stable without any agreement?", "o": [["If the other charges $2.50, matching earns 0.375d but undercutting earns only 0.25d", "Neither gains by deviating."], ["$2.50 earns more whatever the other charges", "If the other charges $2.00, $2.50 earns 0 vs 0.125d; the slide's arrows overstate this.", "Trusting the slide arrows."], ["Costs are higher, so prices must be higher", "The reason is the payoffs, not a rule.", "Vague reasoning."], ["The game becomes zero-sum", "Totals still vary.", "Wrong type."]]}, "M16 L5a#15–18": {"q": "If the stations can choose any price, what happens in this model?", "o": [["They keep undercutting each other slightly until price is about equal to cost", "Undercutting captures all demand."], ["Prices rise without limit", "Undercutting pushes them down.", "Reversed."], ["They settle at $2.50", "Any price is allowed now.", "Old setup."], ["One station exits immediately", "Not in the model.", "Inventing an outcome."]]}, "M16 L5a#19–24": {"q": "If two gas stations can set any price, what happens in the simple model?", "o": [["Each undercuts the other slightly until the price is about equal to cost", "Undercutting captures all the demand."], ["Prices rise steadily", "Reversed.", "Reversed."], ["They settle at the higher of two fixed prices", "Any price is allowed.", "Old setup."], ["One station always charges zero", "Not the result.", "Wrong."]]}, "M16 L6#3–8": {"q": "Why is natural language processing hard, per the \"I blew my …\" sentences?", "o": [["Sentences with the same structure can give a word different meanings, and one sentence can have two meanings", "Meaning depends on context."], ["Computers can't recognize words", "Word recognition works; meaning is the hard part.", "Wrong issue."], ["The sentences are ungrammatical", "They're grammatical.", "Wrong issue."], ["Language data is numeric", "It's unstructured.", "Wrong issue."]]}, "M16 L6#9–11": {"q": "Working out what \"it\" refers to in a sentence is which NLP task?", "o": [["Co-reference", "Linking a pronoun to what it refers to."], ["Speech-to-text", "That identifies spoken words.", "Wrong task."], ["Sentiment analysis", "That judges attitude.", "Wrong task."], ["Named-entity recognition", "That spots specific named things.", "Close but different."]]}, "M16 L6#12–17": {"q": "What is NLP's \"inverse problem\"?", "o": [["Choosing words to convey a given idea or sentiment, sometimes sounding human", "Going from meaning to language."], ["Translating text into speech only", "Too narrow.", "Wrong idea."], ["Undoing a sentiment score", "Not the term.", "Wrong idea."], ["Reading text backwards", "Not the term.", "Wrong idea."]]}, "M16 L7#2–5": {"q": "What do survival models predict?", "o": [["The probability an event happens (or not) before a certain time, based on predictor variables", "Time-to-event with predictors."], ["The exact time of the event", "They give probabilities.", "Overstating."], ["Only whether a patient survives", "Machinery, insurance and more.", "Too narrow."], ["A distribution with no predictors", "That's Module 13's distributions.", "Missing the predictors."]]}, "M16 L7#6–11": {"q": "In h(t) = h₀(t)e^(β₁x₁+…+βₙxₙ), what is h₀(t)?", "o": [["The baseline hazard at time t when all predictors are zero", "Each factor multiplies it."], ["The hazard for the average data point", "It's for all predictors at zero.", "Wrong baseline."], ["The coefficient of time", "It's a function, not a coefficient.", "Mixing symbols."], ["The probability of surviving to t", "That's a survival probability.", "Mixing quantities."]]}, "M16 L7#12–17": {"q": "A patient got a transplant 12 years ago and is still alive. What is known about their survival time?", "o": [["Only that it's at least 12 years: censored data", "The true value is unknown."], ["It's exactly 12 years", "They're still alive.", "Treating censored as exact."], ["Nothing; drop the patient", "Dropping long survivors biases results.", "Throwing away data."], ["It's at most 12 years", "It's at least 12.", "Reversed."]]}, "M16 L8#5–9": {"q": "What do \"gradient\" and \"boosting\" each refer to?", "o": [["Boosting = adding models together; gradient = fitting the added models with gradient information", "Model plus model plus model, each fit to the gradient."], ["Boosting = speeding up training; gradient = a slope chart", "Not the meanings.", "Wrong idea."], ["Boosting = resampling the data; gradient = the learning rate", "Not the meanings.", "Wrong idea."], ["Both mean regularization", "Not the meanings.", "Wrong idea."]]}, "M16 L8#10–17": {"q": "For losses like absolute error or classification metrics, how does the boosting target change?", "o": [["It's still the negative gradient of the loss, which may no longer equal the residuals", "Same idea, different gradient."], ["Boosting can't be used", "It works with many losses.", "Too narrow."], ["The target is always the residuals", "Only for squared error, roughly.", "Overgeneralizing."], ["The target becomes y", "Still the negative gradient.", "Wrong target."]]}, "M16 L8#18–22": {"q": "What can the starting model F₀ be?", "o": [["Even something very simple, like the average response", "Later rounds fix its errors."], ["It must be a deep neural network", "Any model works.", "Too strict."], ["It must already be nearly perfect", "Boosting improves weak starts.", "Too strict."], ["It must be a tree with the same split as H", "No such rule.", "Inventing a rule."]]}, "M16 L8#23": {"q": "Why does gradient boosting \"sound familiar\"?", "o": [["It matches optimization algorithms: start, find an improving direction, pick a step size, move, repeat", "Optimization is under the hood."], ["It's the same as k-means", "Different algorithm.", "Wrong match."], ["It's cross-validation", "Different idea.", "Wrong match."], ["It's exponential smoothing", "Different idea.", "Wrong match."]]}, "M16 L8a#2–5": {"q": "In the example, F₀ predicts 4, 5, 1, 3 for y = 4, 5, 2, 2. What is the total squared error?", "o": [["2", "0 + 0 + 1 + 1."], ["0", "Points 3 and 4 are off by 1.", "Missed errors."], ["1", "Two points are each off by 1.", "Counted one error."], ["4", "Squares of 1 are 1.", "Doubled."]]}, "M16 L8a#6–9": {"q": "What is the negative gradient for those four points?", "o": [["[0, 0, 2, −2]", "−∂L/∂F = 2(y − F): 2(2−1) = 2, 2(2−3) = −2."], ["[0, 0, −2, 2]", "That's the gradient, not its negative.", "Sign error."], ["[0, 0, 1, −1]", "The squared loss doubles the residual.", "Missing the factor 2."], ["[4, 5, 2, 2]", "That's y.", "Wrong target."]]}, "M16 L8a#10": {"q": "F₁ = F₀ + H₀ predicts 4, 5, 2.5, 1. What is its total squared error?", "o": [["1.25", "0 + 0 + 0.25 + 1, down from 2."], ["0.04", "That's with the optimal step.", "Wrong step."], ["2", "That's F₀.", "Old model."], ["0.0625", "That's the half step.", "Wrong step."]]}, "M16 L8a#11–18": {"q": "Using ½H₀ instead of H₀ gives total squared error 0.0625. What does that show?", "o": [["The step size matters; the full step overshot", "Multipliers of 1 or ½ are just guesses."], ["Half steps are always optimal", "The optimum here is 0.56.", "Overgeneralizing."], ["H₀ was fit wrongly", "It's fine; the step was too big.", "Blaming H."], ["Boosting doesn't help", "Error dropped from 2.", "Wrong conclusion."]]}, "M16 L8a#19–20": {"q": "How is the optimal γ₀ = 0.56 found?", "o": [["Write the loss as a function of γ₀, set its derivative to zero: −7 + 12.5γ₀ = 0", "γ₀ = 7/12.5 = 0.56; predictions 4, 5, 1.84, 1.88 and L = 0.04."], ["By trying 1 and ½ and averaging", "It's solved exactly.", "Guessing."], ["By setting γ₀ to the learning rate of the tree", "No such rate here.", "Inventing a rule."], ["γ₀ = 1 divided by the number of points", "No such rule.", "Inventing a rule."]]}, "M16 L8a#21–25": {"q": "The slide writes the next derivatives as −2(yᵢ − 0.56F₁(xᵢ)). What's correct?", "o": [["−2(yᵢ − F₁(xᵢ)), since the 0.56 is already inside F₁; the numbers shown use F₁ directly", "e.g. −2(2 − 1.84) = −0.32. Slide misprint."], ["The slide is right: multiply F₁ by 0.56 again", "That would apply the step twice.", "Trusting the misprint."], ["−2(yᵢ − F₀(xᵢ))", "The next round uses F₁.", "Old model."], ["−2(yᵢ − H₀(xᵢ))", "The loss is about F's predictions.", "Wrong function."]]}, "M16 L8a#26": {"q": "After F₁ = F₀ + 0.56H₀, what is the next tree H₁ fit to?", "o": [["The negative gradient at F₁'s predictions, e.g. [0, 0, 0.32, 0.24]", "Then repeat."], ["The original y", "Boosting fits the gradient.", "Refitting y."], ["The same target as H₀", "The gradient changes with F.", "Reusing the old gradient."], ["F₁'s predictions", "They carry no error information.", "Wrong target."]]}}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent); const MODS=D.modules;
const K='isye-ss-v1'; let S={u:{},f:{},best:{}}; try{const x=JSON.parse(localStorage.getItem(K)||'null'); if(x&&x.u) S=Object.assign({best:{}},x);}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}};
let V={m:0,l:null,mode:'mod'}; try{const v=JSON.parse(sessionStorage.getItem(K+'v')||'null'); if(v) V=v;}catch(e){}
const keep=()=>{try{sessionStorage.setItem(K+'v',JSON.stringify(V));}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s||'').replace(/<[^>]+>/g,'');
const sid=(L,s)=>L.lec+'#'+s.p; const $=s=>document.querySelector(s); const view=$('#view');
function prog(L){const n=L.slides.length,u=L.slides.filter(s=>S.u[sid(L,s)]).length;return {n,u};}
function chips(){ $('#mods').innerHTML=MODS.map((M,i)=>`<button data-m="${i}" aria-pressed="${V.mode!=='search'&&i===V.m}">M${M.n}</button>`).join(''); }
function card(L,s,showLec){ const id=sid(L,s),u=!!S.u[id],f=!!S.f[id];
  return `<div class="card${u?' ok':''}${f?' flag':''}" data-id="${esc(id)}"><div class="pg">${showLec?esc(L.lec)+' · ':''}Slide${/[–-]/.test(s.p)?'s':''} ${esc(s.p)}</div><h3>${s.title}</h3><ul>${s.points.map(x=>`<li>${x}</li>`).join('')}</ul>${s.key?`<div class="key"><b>Key idea:</b> ${s.key}</div>`:''}${s.watch?`<div class="watch"><b>Watch out:</b> ${s.watch}</div>`:''}<div class="acts">${FCM[id]?`<button data-fct="${esc(id)}">🃏 Test yourself</button>`:''}<!--FC-act--><button data-u="${esc(id)}" aria-pressed="${u}">${u?'✓ Understood':'I understand this'}</button><button data-f="${esc(id)}" aria-pressed="${f}">${f?'Marked not sure':'Not sure'}</button>${showLec?`<button data-open="${esc(L.lec)}">Open deck</button>`:''}</div><div class="fcin" id="fcin-${cssId(id)}"></div></div>`; }
function findLec(name){ for(let i=0;i<MODS.length;i++){ const j=MODS[i].lectures.findIndex(L=>L.lec===name); if(j>=0) return [i,j]; } return null; }
function render(){ chips(); const M=MODS[V.m];
  if(V.mode==='search') return renderSearch();
  if(V.mode==='deck') return renderDeck();/*FC-render*/
  if(V.mode==='lec'&&M.lectures[V.l]) return renderLec(M,V.l);
  
  const fl=[]; M.lectures.forEach(L=>L.slides.forEach(s=>{ if(S.f[sid(L,s)]) fl.push([L,s]); }));
  let h=`<h2 style="margin:4px 0">Module ${M.n} · ${esc(M.title)}</h2><p class="sub">${M.lectures.length} slide decks · ${M.lectures.reduce((a,L)=>a+prog(L).u,0)} of ${M.lectures.reduce((a,L)=>a+L.slides.length,0)} summaries understood</p>${fcBar(cardsOf(M.lectures),'mod','Module '+M.n)}
`;
  M.lectures.forEach((L,j)=>{ const p=prog(L); h+=`<button class="lec" data-lec="${j}"><b>${esc(L.lec)} · ${esc(L.title)}</b><span>${esc(strip(L.intro||''))}</span><span>${p.n} summaries · ${p.u} understood</span><div class="bar"><i style="width:${p.n?100*p.u/p.n:0}%"></i></div></button>`; });
  if(fl.length) h+=`<h3>Marked "not sure" in this module</h3>`+fl.map(([L,s])=>card(L,s,true)).join('');
  view.innerHTML=h; }
function renderLec(M,j){ const L=M.lectures[j], p=prog(L);
  let h=`<div class="row"><button data-back="1">← Module ${M.n}</button></div><h2 style="margin:10px 0 2px">${esc(L.lec)} · ${esc(L.title)}</h2><p class="sub" id="lsub">${p.u} of ${p.n} understood</p>${L.intro?`<div class="intro">${L.intro}</div>`:''}${fcBar(cardsOf([L]),'lec','this deck')}`;
  h+=L.slides.map(s=>card(L,s,false)).join('');
  h+=`<div class="nav2">${j>0?`<button data-lec="${j-1}">← ${esc(M.lectures[j-1].lec)}</button>`:'<span></span>'}${j<M.lectures.length-1?`<button class="primary" data-lec="${j+1}">${esc(M.lectures[j+1].lec)} →</button>`:(V.m<MODS.length-1?`<button class="primary" data-m="${V.m+1}">Module ${MODS[V.m+1].n} →</button>`:'<span></span>')}</div>`;
  view.innerHTML=h; }
function renderSearch(){ const q=$('#q').value.trim().toLowerCase(); const terms=q.split(/\s+/).filter(Boolean); const out=[];
  MODS.forEach(M=>M.lectures.forEach(L=>L.slides.forEach(s=>{ const t=(strip(s.title)+' '+s.points.map(strip).join(' ')+' '+strip(s.key)+' '+strip(s.watch)+' '+L.title).toLowerCase(); if(terms.every(w=>t.includes(w))) out.push([L,s]); })));
  view.innerHTML=`<p class="sub">${out.length} slide summar${out.length===1?'y':'ies'} match “${esc(q)}”</p>`+out.slice(0,60).map(([L,s])=>card(L,s,true)).join('')+(out.length>60?'<p class="small">Showing the first 60; refine the search.</p>':''); }
// ---------- topic check (drag-and-drop matching)
let CK=null;
function shuffle(a,r){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rng(seed){ return ()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }; }
const SKIP=/^(overview|previously|this lesson|summary|recap|title|questions?|introduction|intro|example|examples|outline|agenda)\b/i;
function buildCheck(M){ const r=rng(Date.now()&0xffff); const seen=new Set(), pool=[];
  M.lectures.forEach(L=>L.slides.forEach(s=>{ const name=strip(s.title).trim(), desc=strip(s.key||'').trim(); const k=name.toLowerCase();
    if(!desc||!name||SKIP.test(name)||seen.has(k)) return; seen.add(k);
    const words=name.split(/\s+/).filter(w=>w.length>3).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    const masked=words.length?desc.replace(new RegExp('\\b('+words.join('|')+')\\b','gi'),'___'):desc;
    pool.push({name,desc:masked,ref:L.lec+', slide'+(/[–-]/.test(s.p)?'s ':' ')+s.p}); }));
  const per=5, maxQ=10; let picked=pool;
  if(pool.length>per*maxQ){ shuffle(pool,r); picked=pool.slice(0,per*maxQ); }
  const qs=[]; for(let i=0;i<picked.length;i+=per){ const g=picked.slice(i,i+per); if(g.length<2) { if(qs.length) qs[qs.length-1].pairs.push(...g); continue; } qs.push({pairs:g}); }
  qs.forEach(q=>{ q.cats=q.pairs.map(x=>x.name); q.items=shuffle(q.pairs.map((x,c)=>({t:x.desc,c,ref:x.ref})),r); q.place=q.items.map(()=>-1); q.done=false; });
  return {m:M.n,qs,i:0,sel:null}; }
function renderCheck(M){ if(!CK||CK.m!==M.n) CK=buildCheck(M); const Q=CK.qs[CK.i];
  let h=`<div class="row"><button data-back="1">← Module ${M.n}</button></div><h2 style="margin:10px 0 2px">Module ${M.n} topic check</h2><p class="sub">Question ${CK.i+1} of ${CK.qs.length}. Drag each description to the topic it describes (or tap a description, then tap a topic).</p>`;
  h+=`<div class="pool" data-zone="-1">${Q.items.map((it,i)=>Q.place[i]===-1?chip(Q,i):'').join('')}</div><div class="buckets">${Q.cats.map((c,ci)=>`<div class="bucket" data-zone="${ci}"><div class="bh">${esc(c)}</div><div class="bz">${Q.items.map((it,i)=>Q.place[i]===ci?chip(Q,i):'').join('')}</div></div>`).join('')}</div>`;
