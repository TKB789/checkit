<style>
:root{--bg:#F7F9FC;--card:#fff;--ink:#16233B;--ink2:#4A5874;--line:#C9D4E6;--pen:#2F5BD3;--penink:#fff;--ok:#1D7A4E;--okbg:#E3F4EA;--bad:#C23B2E;--badbg:#FBE8E5;--warn:#8A5A00;--warnbg:#FFF3D1;--muted:#EEF2F8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1522;--card:#161E2E;--ink:#E4EAF5;--ink2:#A5B1C8;--line:#2A3650;--pen:#7FA2FF;--penink:#0F1522;--ok:#5CC592;--okbg:#12301F;--bad:#F2877B;--badbg:#3A1714;--warn:#F2C66B;--warnbg:#3A2D08;--muted:#1C2639}}
:root[data-theme="dark"]{--bg:#0F1522;--card:#161E2E;--ink:#E4EAF5;--ink2:#A5B1C8;--line:#2A3650;--pen:#7FA2FF;--penink:#0F1522;--ok:#5CC592;--okbg:#12301F;--bad:#F2877B;--badbg:#3A1714;--warn:#F2C66B;--warnbg:#3A2D08;--muted:#1C2639}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 80px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 12px;font-size:.95rem}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--pen);color:var(--penink);border-color:var(--pen)}
button[aria-pressed="true"]{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chips button{padding:6px 10px;border-radius:999px;font-size:.9rem}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.lec{display:block;width:100%;text-align:left;margin:0 0 8px}
.lec b{display:block}.lec span{display:block;font-size:.85rem;color:var(--ink2)}
.bar{height:6px;background:var(--muted);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.pg{font-size:.76rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.card h3{margin:2px 0 6px;font-size:1.04rem}
.card ul{margin:0 0 8px;padding-left:20px}.card li{margin:0 0 4px}
.key{background:var(--okbg);border-radius:9px;padding:7px 11px;margin:6px 0}
.watch{background:var(--warnbg);border-radius:9px;padding:7px 11px;margin:6px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.acts button{font-size:.88rem;padding:6px 10px}
.card.ok{border-color:var(--ok)}.card.flag{border-color:var(--warn)}
.intro{background:var(--muted);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav2{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.small{font-size:.88rem;color:var(--ink2)}
mark{background:var(--warnbg);color:inherit}
/* matching */
.pool,.bucket{border:1px dashed var(--line);border-radius:12px;padding:8px;min-height:48px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.pool{background:var(--muted);margin:8px 0}
.buckets{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:620px){.buckets{grid-template-columns:1fr 1fr}}
.bucket{background:var(--card);flex-direction:column;align-items:stretch}
.bucket .bh{font-size:.85rem;font-weight:700;margin:0 0 4px}
.bucket .bz{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 9px;font-size:.9rem;cursor:grab;user-select:none;touch-action:manipulation}
.chip.sel{border-color:var(--pen);box-shadow:0 0 0 2px var(--pen)}
.chip.right{background:var(--okbg);border-color:var(--ok)}.chip.wrong{background:var(--badbg);border-color:var(--bad)}
.chip .fix{display:block;font-size:.75rem;color:var(--ink2)}
.bucket.over{border-color:var(--pen)}
.score{font-weight:700}
.btnlink{display:inline-block;background:var(--pen);color:var(--penink);border-radius:10px;padding:8px 12px;text-decoration:none;font-weight:600}
</style>

ers both models and the cross-cutting concepts needed to use them well."}, {"p": "10\u201311", "title": "Course Structure", "points": ["1. Knowledge-based introduction: analytics models, cross-cutting concepts, situations and examples, basic mathematical detail.", "2. Experience-based section: case studies, practice using models."], "key": "Two parts: learn the tools, then practise applying them."}, {"p": "12\u201314", "title": "Homework Assignments", "points": ["Homework is mostly a tool for learning, less for grading.", "Practise using models and some commonly used analytics software.", "Make sure key basic concepts are learned, link material with real analytics questions, develop learning beyond the videos.", "Learn to use software without being told exactly what to do."], "key": "Homework is for learning, including figuring out software on your own."}, {"p": "15", "title": "Summary", "points": ["Knowledge-building: analytics models and cross-cutting concepts.", "Experience building: software homeworks and cases.", "Let's get started!"], "key": "Knowledge first, then experience."}]}, {"lec": "M1 L2a", "title": "Homework grading and Q&A", "intro": "How homework is graded, how peer reviews work, and how to use the course message boards to get and give help.", "topics": ["Homework grading scale", "Peer reviews", "Course message boards", "Building professional connections"], "slides": [{"p": "2\u20133", "title": "About This Lesson", "points": ["Previous video: course structure (modeling, cross-cutting, experiential) and hands-on homeworks.", "This video: homework grading, and how to get (and give) help."], "key": "Grading and getting help."}, {"p": "4\u20135", "title": "Homework Grading Scale", "points": ["100: all correct (perhaps except a few details) with a deeper solution than expected.", "90: most or all correct, meets expectations. 75: not correct, but a reasonable attempt.", "50: not correct, insufficient effort. 0: not submitted.", "Focus your efforts on learning."], "key": "A reasonable attempt still earns 75; meeting expectations earns 90."}, {"p": "6\u20137", "title": "Peer Reviews", "points": ["Benefits: see others' approaches; practise evaluating others' analyses.", "Process: peer reviews are assigned after the due date.", "Take them seriously, think about the approach, give helpful feedback."], "key": "Peer review is itself a learning exercise."}, {"p": "8\u201310", "title": "Ask Questions!", "points": ["Use the course message boards to ask about course material, homework, modeling, software, extensions of the material, and applying it to your job.", "Answer each other's questions; TAs and the instructor will too.", "Build professional connections for this course, other courses and your career."], "key": "Message boards are for asking, answering and networking."}, {"p": "11", "title": "Let's Get Started!", "points": ["Use homework to increase learning.", "Use message boards to ask, answer, discuss and connect."], "key": "Homework and boards are learning tools."}]}, {"lec": "M1 L3", "title": "What is modeling?", "intro": "Short lesson on how the word \u201cmodel\u201d is used to mean three different things.", "topics": ["Three meanings of \u201cmodel\u201d", "General vs. fitted model", "Regression estimate example"], "slides": [{"p": "2", "title": "Overview", "points": ["This lesson: \u201cmodel\u201d can be three different things."], "key": "The word \u201cmodel\u201d is used loosely."}, {"p": "3\u20134", "title": "Modeling", "points": ["1. Real-life situation expressed as math; 2. analyze the math; 3. turn the math analysis back into a real-life solution.", "The \u201cmodel\u201d is the first step: the situation expressed as math."], "key": "A model is the mathematical expression of a real situation."}, {"p": "5", "title": "Modeling", "points": ["All of these are called \u201cmodels\u201d: Regression (a general type of model).", "Regression based on size, weight, distance (the type plus chosen attributes).", "Reg by attributes; past outcomes are known."}, {"p": "10\u201312", "title": "Loan Applicants Classification Example", "points": ["One applicant plotted as a point: credit score 730 (horizontal axis), income $76,000 (vertical axis).", "Then all past applicants plotted; color shows whether each repaid (blue) or defaulted (red).", "Real problems have more attributes (each one another dimension): length of time as a bank customer, number of dependents, total assets and liabilities, etc."], "key": "Two attributes are used so the data can be drawn; real models use many."}, {"p": "13\u201317", "title": "Loan Applicants Classification Example", "points": ["A line is drawn separating the two groups.", "A new applicant falling on the repaid side of the line is approved; one on the other side is not (arrows point to two new points).", "Many different lines (shown overlaid) separate the past data equally well."], "key": "Classifier = boundary; but infinitely many lines fit, so which is best?"}]}, {"lec": "M2 L2", "title": "Choosing a classifier", "intro": "Graphical intuition for picking the best separating line: stay far from points, accept some errors when data overlap, shift the line when one error type costs more, and read attribute importance from the line's direction.", "topics": ["Line furthest from both groups", "Hard vs. soft classifier", "Unequal costs of errors", "Shifting the line from costly errors", "Line parallel to an axis"], "slides": [{"p": "2\u20137", "title": "Loan Applicants Classification Example", "points": ["Scatter of applicants; one separating line, then many possible separating lines.", "Two candidate lines compared: they agree on most points but classify an ambiguous new applicant differently.", "Parallel lines bound the gap between the groups; arrows show how close each group comes to the line."], "key": "Different valid lines give different answers for points in between."}, {"p": "8\u201311", "title": "Loan Applicants Classification Example", "points": ["A line passing very close to points (circled) nearly misclassifies them; a slight change in the data or the line would flip them.", "Data are inexact, so prefer the line that is furthest from the points of both groups.", "Distances from the nearest points to the line are marked."], "key": "Choose the line with the most room for error (largest margin)."}, {"p": "12\u201314", "title": "Loan Applicants Classification Example", "points": ["Overlapping data: no line separates the two colors perfectly.", "Best compromise line with the misclassified points circled (soft classifier: accept some errors).", "A different, nearly horizontal line on the same data for comparison."], "key": "Hard classifier separates perfectly; soft classifier minimizes misclassification when that is impossible."}, {"p": "15\u201319", "title": "Unequal costs of mistakes", "points": ["Original line shown dashed; new line shifted away from one group, so ambiguous points fall on the cheaper-error side (e.g. a bad loan costs more than rejecting a good applicant).", "Leaf and mushroom images: when misclassifying a poisonous plant could be fatal, push the line even further, even misclassifying some safe points.", "Medical Analytics image: the same logic applies to medical testing."], "key": "The more costly an error, the further the line moves away from that side."}, {"p": "20", "title": "Loan Applicants Classification Example", "points": ["The separating line is vertical: classification depends only on credit score.", "Income (vertical axis) adds nothing to the decision."], "key": "A line parallel to an axis means that axis's attribute is irrelevant."}]}, {"lec": "M2 L3", "title": "Data definitions", "intro": "Vocabulary for data in analytics: data points, attributes, responses, and the main types of data.", "topics": ["Rows, columns, data points", "Attribute/feature/predictor synonyms", "Response or outcome", "Structured vs. unstructured data", "Quantitative, categorical, binary data", "Unrelated v s, stock prices, a child's height on each birthday."], "key": "Time series data points are linked through time."}, {"p": "9", "title": "Summary", "points": ["Data points; attributes/features; responses/outcomes.", "Structured vs. unstructured; quantitative, categorical, binary; unrelated vs. time series."], "key": "Terms used throughout the course."}]}, {"lec": "M2 L4", "title": "Support vector machines (SVM)", "intro": "The math behind SVM: the separating line as an equation, constraints for each class, maximizing the margin, and the soft-classifier objective that trades error against margin.", "topics": ["SVM notation: m, n, x\u1d62\u2c7c, y\u1d62", "Separating line equation", "Margin width 2/\u221a\u03a3a\u2c7c\u00b2", "Hard-margin optimization", "Per-point error max{0, \u2026}", "Error vs. margin trade-off \u03bb"], "slides": [{"p": "2\u20133", "title": "Classification", "points": ["Example: classifying loan applicants by credit score and income.", "Find the line separating the two groups."], "key": "Recap of the classification picture."}, {"p": "4", "title": "Classification: Support Vector Machines", "points": ["Required background: the data definitions lesson.", "Terms like data point, attribute and response are used next."], "key": "Know the data vocabulary first."}, {"p": "5", "title": "Notation and the line", "points": ["m = number of data points; n = number of attributes; x\u1d62\u2c7c = jth attribute of ith data point (x\u1d62\u2081 = credit score, x\u1d62\u2082 = income of person i).", "y\u1d62 = response: 1 if data point i is blue, \u22121 if red.", "Line: a\u2081x\u2081 + a\u2082x\u2082 + \u2026 + a\u2099x\u2099 + a\u2080 = 0, i.e. \u03a3\u2c7c a\u2c7cx\u2c7c + a\u2080 = 0."], "key": "The classifier is a line (hyperplane) with coefficients a\u2080\u2026a\u2099."}, {"p": "6\u20138", "title": "Constraints for each class", "points": ["Blue points: a\u2081x\u1d62\u2081 + \u2026 + a\u2099x\u1d62\u2099 + a\u2080 \u2265 1; red points: \u2026 \u2264 \u22121 (two parallel solid lines at \u00b11 bound the gap).", "Because y\u1d62 = \u00b11, both combine into one constraint for all points: (\u03a3\u2c7c a\u2c7cx\u1d62\u2c7c + a\u2080)y\u1d62 \u2265 1."], "key": "Multiplying by y\u1d62 turns two constraints into one."}, {"p": "9\u201311", "title": "Maximizing the margin", "points": ["Distance between the solid lines = 2/\u221a(\u03a3\u2c7c a\u2c7c\u00b2).", "Maximizing it is the same as: minimize \u03a3\u2c7c (a\u2c7c)\u00b2 subject to (\u03a3\u2c7c a\u2c7cx\u1d62\u2c7c + a\u2080)y\u1d62 \u2265 1 for each data point i."], "key": "Hard SVM: smallest \u03a3a\u2c7c\u00b2 that still classifies every point correctly."}, {"p": "12\u201317", "title": "When points can't be separated", "points": ["Correct side: (\u03a3\u2c7c a\u2c7cx\u1d62\u2c7c + a\u2080)y\u1d62 \u2212 1 \u2265 0; wrong side: \u2026 \u2212 1 < 0.", "Error for data point i: max{0, 1 \u2212 (\u03a3\u2c7c a\u2c7cx\u1d62\u2c7c + a\u2080)y\u1d62}: zero if correctly beyond the margin, growing the further it is on the wrong side.", "Total error: \u03a3\u1d62 max{0, 1 \u2212 (\u03a3\u2c7c a\u2c7cx\u1d62\u2c7c + a\u2080)y\u1d62}; margin denominator: \u03a3\u2c7c (a\u2c7c)\u00b2."], "key": "Errors are measured by how far a point is on the wrong side of its margin line."}, {"p": "18\u201320", "title": "Support Vector Machine", "points": ["Minimize \u03a3\u1d62 max{0, 1 \u2212 (\u03a3\u2c7c a\u2c7cx\u1d62\u2c7c + a\u2080)y\u1d62} + \u03bb \u03a3\u2c7c (a\u2c7c)\u00b2.", "\u03bb trades off the two goals: larger \u03bb favors a wider margin, smaller \u03bb favors fewer errors.", "This combined objective is the support vector machine model."], "key": "Soft SVM = minimize total error plus \u03bb \u00d7 margin term.", "watch": "m counts data points and n counts attributes; sums over i run to m, over j to n."}]}, {"lec": "M2 L5", "title": "SVM: what the name means", "intro": "Short lesson explaining \u201csupport vectors\u201d as the points that hold up the boundary and why it is called a \u201cmachine\u201d.", "topics": ["Meaning of \u201csupport vector\u201d", "Points that hold up the boundary", "Why \u201cmachine\u201d in SVM"], "slides": [{"p": "2", "title": "Overview", "points": ["Previous lessons: Support Vector Machine (SVM).", "This lesson: what the name SVM means."], "key": "Name explained."}, {"p": "3\u20137", "title": "Support vectors", "points": ["A point that holds up a shape is a support vector.", "Support vectors can support the sides, top, etc., not just the bottom."], "key": "Support vectors are the points touching and holding the boundary in place."}, {"p": "8\u201310", "title": "Basic SVM Model for Classification", "points": ["The closest points of each class touch the margin lines and \u201csupport\u201d the classifier.", "The SVM model determines these support vectors automatically from the data, hence \u201cmachine\u201d."], "key": "Only the support vectors determine where the classifier goes."}]}, {"lec": "M2 L6", "title": "Advanced support vector machines", "intro": "Extensions of SVM: soft classification, shifting the line for unequal error costs, weighting errors, the need to scale data, reading attribute importance from coefficients, and kernels.", "topics": ["Soft classification objective", "Shifting intercept for error costs", "Error weights m\u1d62", "Scaling before SVM", "Near-zero coefficients", "Kernel methods for nonlinear boundaries"], "slides": [{"p": "2\u20133", "title": "Classification: Support Vector Machines", "points": ["Separable data: minimize \u03a3\u2c7c (a\u2c7c)\u00b2 subject to (a\u2081x\u1d62\u2081 + \u2026 + a\u2099x\u1d62\u2099 + a\u2080)y\u1d62 \u2265 1 for each data point i."], "key": "Recap of the hard classifier."}, {"p": "4\u20135", "title": "Soft Classification", "points": ["When data overlap: minimize \u03a3\u1d62 max{0, 1 \u2212 (\u03a3\u2c7c a\u2c7cx\u1d62\u2c7c + a\u2080)y\u1d62} + \u03bb \u03a3\u2c7c (a\u2c7c)\u00b2.", "Trades off classification error against margin size."], "key": "Soft SVM allows some errors."}, {"p": "6\u20137", "title": "Shifting the line", "points": ["The classifier can be moved within the margin by changing only a\u2080.", "Example: a\u2081x\u2081 + \u2026 + a\u2098x\u2098 + [\u2154(a\u2080 \u2212 1) + \u2153(a\u2080 + 1)] = 0, i.e. intercept a\u2080 \u2212 \u2153: the line moves \u2154 of the way toward one margin line.", "Used when one type of misclassification is more costly."], "key": "Shift the intercept to move the line away from costly errors.", "watch": "This slide indexes attributes up to m (a\u2098x\u2098); elsewhere the number of attributes is n."}, {"p": "8\u20139", "title": "Weighting errors", "points": ["Minimize \u03a3\u1d62 m\u1d62 max{0, 1 \u2212 (\u03a3\u2c7c a\u2c7cx\u1d62\u2c7c + a\u2080)y\u1d62} + \u03bb \u03a3\u2c7c (a\u2c7c)\u00b2.", "m\u1d62 > 1 for more-costly errors; m\u1d62 < 1 for less-costly errors."], "key": "Weights m\u1d62 build error costs into the objective."}, {"p": "10\u201311", "title": "Need to scale the data!", "points": ["The objective minimizes \u03a3\u2c7c (a\u2c7c)\u00b2, so attributes on very different scales (income vs. credit score) distort the solution.", "Scale the data first."], "key": "Always scale data before SVM."}, {"p": "12\u201314", "title": "Coefficients and relevance", "points": ["Line a\u2081x\u2081 + a\u2082x\u2082 + \u2026 + a\u2099x\u2099 + a\u2080 = 0.", "Near-zero coefficients are probably not relevant for classification.", "Example: a vertical line in the loan chart means income is not helpful for classifying."], "key": "Small coefficients signal unimportant attributes (with scaled data)."}, {"p": "15\u201316", "title": "Extensions", "points": ["Works the same in more dimensions (more attributes).", "Kernel methods allow nonlinear classifiers.", "Other methods (e.g. logistic regression) give probability answers.", "Other methods: coming up."], "key": "SVM generalizes to many attributes and curved boundaries."}]}, {"lec": "M2 L7", "title": "Scaling and standardization", "intro": "Why attributes on different scales cause trouble (shown with the SVM loan example) and the two fixes: scaling to a range and standardizing to mean 0, standard deviation 1.", "topics": ["Effect of attribute magnitudes", "Sum of squared coefficients example", "Scaling to [0,1]", "Scaling to a general range", "Standardizing to mean 0, SD 1", "When to scale vs. standardize"], "slides": [{"p": "2", "title": "Overview", "points": ["Common data preparation tasks: scaling and standardization."], "key": "Data preparation lesson."}, {"p": "3\u20134", "title": "SVM example", "points": ["Classify loan applicants as good or bad credit risks; household income is ~10\u2075, credit score ~10\u00b2.", "Given data x\u1d62\u2c7c, the classifier is 0 = a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c; maximize the gap by minimizing \u03a3\u2c7c a\u2c7c\u00b2."], "key": "Attributes differ in magnitude by 1000\u00d7."}, {"p": "5\u20137", "title": "SVM example", "points": ["0 = 1,000,000 + 5\u00d7Income + 700\u00d7CreditScore: \u03a3a\u2c7c\u00b2 = 5\u00b2 + 700\u00b2 = 490,025.", "Change credit coefficient to 701: \u03a3a\u2c7c\u00b2 = 5\u00b2 + 701\u00b2 = 491,426 (higher by 1401).", "0 = 700,000 + 37.8\u00d7Income + 700\u00d7CreditScore gives the same sum 491,426 (37.8\u00b2 + 700\u00b2).", "A tiny change in one coefficient equals a large change in the other; the third line is very different from the first two."], "key": "Without scaling, the objective is dominated by the large-magnitude coefficient.", "watch": "37.8\u00b2 + 700\u00b2 \u2248 491,429; the slide shows 491,426 because 37.8 is rounded."}, {"p": "8", "title": "Adjusting the data - Scaling", "points": ["Common scaling: data between 0 and 1, factor by factor. x<sub>min j<\/sub> = min\u1d62 x\u1d62\u2c7c, x<sub>max j<\/sub> = max\u1d62 x\u1d62\u2c7c.", "x\u1d62\u2c7c<sup>scaled<\/sup> = (x\u1d62\u2c7c \u2212 x<sub>min j<\/sub>)/(x<sub>max j<\/sub> \u2212 x<sub>min j<\/sub>).", "General scaling between b and a: x\u1d62\u2c7c<sup>scaled [b,a]<\/sup> = x\u1d62\u2c7c<sup>scaled [0,1]<\/sup>(a \u2212 b) + b."], "key": "Min-max scaling maps each factor onto a fixed range."}, {"p": "9", "title": "Adjusting the data - Standardizing", "points": ["Scaling to a normal distribution; common: mean 0, standard deviation 1.", "Factor j has mean \u03bc\u2c7c = \u03a3\u1d62 x\u1d62\u2c7c / n and standard deviation \u03c3\u2c7c.", "x\u1d62\u2c7c<sup>standardized<\/sup> = (x\u1d62\u2c7c \u2212 \u03bc\u2c7c)/\u03c3\u2c7c."], "key": "Standardizing centers each factor and divides by its spread.", "watch": "Here n is the number of data points being averaged (in the SVM lessons that count was m)."}, {"p": "10\u201311", "title": "Adjusting the data", "points": ["Scaling: data in a bounded range, e.g. neural networks, optimization models that need bounded data, batting averages (.000\u20131.000), RGB color intensities (0\u2013255), SAT scores (200\u2013800).", "Standardization: e.g. principal component analysis, clustering.", "Sometimes it won't be clear. Try both!"], "key": "Bounded range \u2192 scale; otherwise often standardize."}, {"p": "12", "title": "Summary", "points": ["It is often necessary to scale or standardize the input data.", "Should be used throughout this course: \u201cIt's not just a good idea \u2014 it's the law.\u201d"], "key": "Scale or standardize by default."}]}, {"lec": "M2 L8", "title": "k-nearest neighbor algorithm", "intro": "The k-nearest-neighbor (KNN) classifier, its distance and weighting choices, and a summary of the classification module.", "topics": ["KNN majority vote", "Straight-line distance metric", "Weighted attributes in distance", "Choosing k", "Classification module summary"], "slides": [{"p": "2\u20137", "title": "k-Nearest Neighbor algorithm", "points": ["Loan chart with a new, unclassified point.", "Find the class (color) of a new point: pick the k closest points (\u201cnearest neighbors\u201d) to it.", "The new point's class is the most common among the k neighbors."], "key": "KNN classifies by majority vote of the nearest points; no line needed."}, {"p": "8\u201311", "title": "k-Nearest Neighbor algorithm: keep in mind", "points": ["Can use other distance metrics; straight-line distance is \u221a(\u03a3\u1d62 |x\u1d62 \u2212 y\u1d62|\u00b2).", "Attributes can be weighted by importance: \u221a(\u03a3\u1d62 w\u1d62|x\u1d62 \u2212 y\u1d62|\u00b2).", "Unimportant attributes can be removed (w\u1d62 = 0).", "Choose a good value of k (see validation lesson)."], "key": "KNN depends on the distance metric, attribute weights and k.", "watch": "Here x\u1d62 and y\u1d62 are the ith attributes of two points, not the response y\u1d62 from SVM."}, {"p": "12\u201315", "title": "Classification Topic Summary", "points": ["Divide data points into groups based on similarity; comes up a lot in analytics.", "Graphical intuition.", "Basic solution methods: support vector machine (SVM) and k-nearest-neighbor (KNN) approaches; both are machine learning algorithms."], "key": "SVM and KNN are the module's two classifiers."}, {"p": "16\u201317", "title": "Additional subjects", "points": ["Data terminology and data types.", "Validation, distance metrics, confusion matrices."], "key": "Related topics covered elsewhere."}]}], "n": 2}, {"module": "m3", "title": "Validation", "lectures": [{"lec": "M3 L1", "title": "Introduction to validation", "intro": "Why a model's fit on its own training data overstates its quality: data contain both real and random effects, illustrated with a birthday-of-the-month example.", "topics": ["Training-data accuracy is too optimistic", "Real vs. random effects", "Birthday day-of-month example", "Random patterns always appear"], "slides": [{"p": "2\u20134", "title": "Overview", "points": ["This lesson: validation, i.e. how good is the model?", "E.g. how accurately does it classify loan applicants, how well does it predict future sales, how often does it correctly determine whether a transplanted liver will transmit infectious encephalitis?"], "key": "Validation measures how good a model really is."}, {"p": "5\u20137", "title": "Model Validation", "points": ["Example: 24 data points, 3 incorrectly classified, so 87.5% correctly classified.", "But that figure is measured on the same data used to build the classifier: too optimistic!"], "key": "Accuracy on the data the model was fit to overstates its quality."}, {"p": "8\u20139", "title": "Model Validation", "points": ["Data has two types of patterns: real effect (a real relationship between attributes and response) and random effect (random, but looks like a real effect).", "Fitting matches both real and random effects.", "Real effects are the same in all data sets; random effects differ in each data set."], "key": "A fitted model learns noise as well as signal; only signal carries over."}, {"p": "10\u201314", "title": "Real example: What day of the month were you born?", "points": ["One cohort's birth days: 3, 21, 24, 24, 25, 26, 27, 30, 30, 31. Is this MS Analytics cohort really more likely to be born in the last 10 days of a month?", "Best predictor: \u201cyou were born on the 26th\u201d, with errors 23, 5, 2, 2, 1, 0, \u22121, \u22124, \u22124, \u22125. Random effect!", "On a new data set (2, 9, 11, 12, 14, 21, 24, 24, 29, 31) the same predictor gives errors 24, 17, 15, 14, 12, 5, 2, 2, \u22123, \u22125: much worse."], "key": "A pattern fitted to random effects fails on new data."}, {"p": "15\u201316", "title": "Was this pattern just luck?", "points": ["No: some random pattern would have shown up anyway.", "E.g. early in month, middle of month, even-numbered day, odd-numbered day, day a multiple of 3, day close to one of my kids' birthdays, etc."], "key": "With enough possible patterns, some will appear by chance."}, {"p": "17", "title": "Summary", "points": ["Can't measure a model's effectiveness on data it was trained on.", "Model fit captures real and random effects; only real effects are duplicated in other data."], "key": "Evaluate on data the model hasn't seen."}]}, {"lec": "M3 L2", "title": "Validation and test data sets", "intro": "Splitting data into training, validation and test sets, and why the best model's validation score is itself too optimistic, so a separate test set is needed.", "topics": ["Training set vs. validation set", "Comparing SVM and KNN models", "Thought experiment on equally good models", "Why a separate test set", "Training\u2013validation\u2013test flowchart"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: don't judge a model on how well it fits the training data.", "This lesson: better ways to measure a model's performance."], "key": "Measuring performance properly."}, {"p": "4", "title": "Validation", "points": ["Use a larger set of data to fit the model and a smaller set to measure its effectiveness.", "Loan application: create the classifier on the training set; measure effectiveness on the validation set.", "E.g. 90% right in the training set but 80% right in the validation set."], "key": "Validation accuracy is typically lower than training accuracy."}, {"p": "5\u20137", "title": "Training and Validation Sets", "points": ["Split data: training set (larger) to fit the model; validation set (smaller) to estimate effectiveness.", "Diagram shows the data being divided into the two sets."], "key": "Fit on one part, evaluate on the other."}, {"p": "8\u201310", "title": "Choosing the best model?", "points": ["Example: 5 SVM models score 93, 88, 96, 97, 95 /100; 5 KNN models score 94, 94, 90, 95, 82 /100. SVM-4 (97) is circled as best.", "Problem: observed performance = real quality + random effects.", "High-performing models are more likely to have above-average random effects, so the chosen model's observed performance is probably too optimistic."], "key": "Picking the max of noisy scores biases its score upward."}, {"p": "11\u201312", "title": "Thought experiment", "points": ["Suppose all 10 models are equally good (real quality 93); differences are all due to randomness.", "Random effects: +0, \u22125, +3, +4, +2 (SVM) and +1, +1, \u22123, +2, \u221211 (KNN), giving totals 93, 88, 96, 97, 95, 94, 94, 90, 95, 92.", "Highest total (SVM-4, 97) has the highest randomness (+4): real model quality is lower than observed quality."], "key": "The winner's score includes lucky noise.", "watch": "KNN-5 total is printed 92; it should be 82 (93 \u2212 11), matching the earlier table."}, {"p": "13", "title": "Test Sets", "points": ["Training data set to fit the models.", "Validation data set to choose the best model.", "Test data set to estimate performance of the chosen model."], "key": "Three sets, three jobs."}, {"p": "14", "title": "Flowchart", "points": ["Build model(s) using the training set \u2192 choosing between models?", "Yes: choose best model using the validation set, then estimate its quality using the test set.", "No, only one model was built: go straight to estimating quality using the test set."], "key": "A validation set is needed only when comparing models."}, {"p": "15", "title": "Summary", "points": ["Training set: building models. Validation set: picking a model. Test set: estimating performance of the chosen model.", "Future: how to split data into each of these sets."], "key": "Never reuse the selection data to report performance."}]}, {"lec": "M3 L3", "title": "Splitting data", "intro": "How much data to put in training, validation and test sets, and two ways to split (random and rotation), including bias risks.", "topics": ["Split size rules of thumb", "60/20/20 split example", "Random splitting", "Rotation splitting", "Bias from rotation", "Combined splitting approach"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: training set builds the model, validation set compares models, test set estimates performance of the chosen model.", "This lesson: how to split data into training, validation and test sets."], "key": "How to split."}, {"p": "4\u20135", "title": "Splitting Data", "points": ["Working with one model (only training and test sets needed): rule of thumb 70\u201390% training, 10\u201330% test.", "Comparing models (training, validation and test needed): 50\u201370% training, split the rest equally between validation and test."], "key": "Most data goes to training; validation only when comparing models."}, {"p": "6\u20137", "title": "Splitting Data: Method 1, Random", "points": ["Example: 1000 data points, 60% training, 20% validation, 20% test.", "Randomly choose 600 points for training, then 200 of the remaining 400 for validation; the remaining 200 form the test set."], "key": "Random assignment to sets."}, {"p": "8\u201315", "title": "Splitting Data: Method 2, Rotation", "points": ["Take turns selecting points.", "Example 5-data-point rotation sequence: Training\u2013Validation\u2013Training\u2013Test\u2013Training (gives 60/20/20).", "Animation deals the data points one by one into the training, validation and test sets."], "key": "Rotation assigns points to sets in a repeating cycle."}, {"p": "16\u201317", "title": "Be careful about introducing bias", "points": ["Example: daily sales data (Mon\u2013Fri). Randomness could give one set more early or late data; rotation separates data equally.", "But rotation may introduce bias: a 5-data-point rotation puts all Mondays in one set, all Tuesdays in one set, etc.", "Consider a combined approach, e.g. 60% of Monday data for training, 60% of Tuesday data for training, etc."], "key": "Pick a split that doesn't line up with patterns in the data.", "watch": "Rotation length matching a cycle in the data (5 weekdays) is what causes the bias."}, {"p": "18", "title": "Summary", "points": ["How much data to use for training, validation and test; how to partition the data.", "Future: cross-validation."], "key": "Next: cross-validation."}]}, {"lec": "M3 L4", "title": "Cross-validation", "intro": "k-fold cross-validation: rotating which part of the data is used for validation, averaging the results, and then refitting the chosen model on all the data.", "topics": ["Important data only in one set", "Different meanings of \u201ck\u201d", "k-fold procedure", "Averaging k evaluations", "Don't average fold coefficients", "Refit on all data"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previous lessons: measure effectiveness by separating data into training, validation and test sets.", "This lesson: validation, how good is the model?"], "key": "Improving on a single split."}, {"p": "4", "title": "Cross Validation", "points": ["Question: what if important data only appears in the validation or test sets?", "Solution: use cross-validation (shown beside the training/validation/test flowchart)."], "key": "Cross-validation lets every point be used for training."}, {"p": "5\u20136", "title": "k-Fold Cross Validation: side note", "points": ["Uses of \u201ck\u201d in analytics: k-means, k-nearest neighbor, k-fold cross validation.", "All those \u201ck\u201ds mean different things (sorry!)."], "key": "k in k-fold \u2260 k in KNN or k-means."}, {"p": "7\u20139", "title": "k-Fold Cross Validation", "points": ["Set aside 20% for testing; the other 80% is for training and validation.", "The 80% is split into k parts (here 4, numbered 1\u20134)."], "key": "Test data stays separate; the rest is divided into folds."}, {"p": "10\u201313", "title": "k-Fold Cross Validation", "points": ["Each round, three parts are used for training and the remaining part for validation.", "Repeated four times so each part is the validation set exactly once."], "key": "Every fold takes one turn as validation."}, {"p": "14", "title": "k-Fold Cross Validation", "points": ["For each of the k parts: train the model on all the other parts and evaluate it on the one remaining part.", "Average the k evaluations to estimate the model's quality.", "No standard number to use as k (but k = 10 is common)."], "key": "Average of k validation scores = model quality estimate."}, {"p": "15\u201316", "title": "What Model Should We Choose?", "points": ["The four splits give four different fitted models, 0 = a\u2080,\u2096 + \u03a3\u2c7c a\u2c7c,\u2096x\u2c7c for k = 1\u20264.", "Answer: none. Do not average the coefficients across the four splits.", "Train the model again using all the data."], "key": "Cross-validation evaluates; the final model is refit on all data."}, {"p": "17", "title": "Summary", "points": ["k-fold cross-validation: better use of data, better estimate of model quality, choose model more effectively."], "key": "Cross-validation beats a single validation split."}]}], "n": 3}, {"module": "m4", "title": "Clustering", "lectures": [{"lec": "M4 L1", "title": "Introduction to clustering", "intro": "What clustering is (grouping data points / discovering groups in data) and the kinds of questions it answers, with application examples and a two-attribute picture of the same data clustered different ways.", "topics": ["Definition of clustering", "Market segmentation example", "Personalized medicine", "Locating facilities", "Image analysis", "Data investigation"], "slides": [{"p": "2", "title": "Overview", "points": ["This lesson: what clustering is.", "And what questions clustering answers."], "key": "Sets up clustering as a new kind of analytics task."}, {"p": "3\u20139", "title": "Clustering: grouping data points", "points": ["Clustering = grouping data points that are similar to each other.", "First use: targeted marketing / market segmentation \u2014 splitting customers into groups to market to differently.", "Built-up list of attributes for the car example: size, price, versatility, coolness, gas mileage \u2014 each is a dimension buyers could be grouped on."], "key": "Clustering groups points by similarity across their attributes."}, {"p": "10\u201318", "title": "Discovering groups in data points", "points": ["Further uses: personalized medicine (groups of patients who respond alike), locating facilities (grouping locations to serve with one site; shown with map pictures).", "Image analysis: grouping pixels or features in a picture (illustrated with a dot pattern and a photo).", "Data investigation: finding groups first, then studying each group (shown over a background of binary digits)."], "key": "Clustering also discovers structure you didn't know was there."}, {"p": "19\u201324", "title": "Clustering example: age vs miles driven", "points": ["Scatter plot of potential buyers: Age (horizontal) vs Miles Driven / Year (vertical).", "The same points circled as two clusters, then as four clusters.", "Notice: one dataset supports several reasonable clusterings \u2014 the number and shape of groups is a choice."], "key": "There is no single \"right\" clustering from the picture alone.", "watch": "More clusters always look tighter; whether 2 or 4 is better depends on how the clusters will be used (see L4)."}]}, {"lec": "M4 L2", "title": "Distance norms", "intro": "How to measure distance between points: Euclidean, rectilinear, the general p-norm (Minkowski) distance, and the \u221e-norm, with a warehouse example of when the \u221e-norm is the right choice.", "topics": ["Euclidean (2-norm) distance", "Rectilinear (1-norm) distance", "Minkowski p-norm distance", "Infinity norm as maximum", "Automated storage and retrieval example"], "slides": [{"p": "2\u20136", "title": "Distance norms: Euclidean and rectilinear", "points": ["Euclidean (straight-line) distance: distance = \u221a((x\u2081 \u2212 y\u2081)\u00b2 + (x\u2082 \u2212 y\u2082)\u00b2).", "Rectilinear distance: distance = |x\u2081 \u2212 y\u2081| + |x\u2082 \u2212 y\u2082| \u2014 travel along the axes, like driving a street grid.", "Grid diagram (Dimension 1 \u00d7 Dimension 2) contrasts the straight line with the axis-aligned path."], "key": "Different distance definitions give different numbers for the same two points."}, {"p": "7\u201311", "title": "Generalizing: p-norm (Minkowski) distance", "points": ["Two dimensions: Distance = \u1d56\u221a(|x\u2081 \u2212 y\u2081|\u1d56 + |x\u2082 \u2212 y\u2082|\u1d56).", "n dimensions: Distance = \u1d56\u221a(\u03a3\u1d62\u208c\u2081\u207f |x\u1d62 \u2212 y\u1d62|\u1d56), called the p-norm or Minkowski distance.", "p = 2 gives Euclidean (2-norm); p = 1 gives rectilinear (1-norm).", "Teaser question: what is the \u221e-norm distance?"], "key": "Euclidean and rectilinear are special cases of one formula."}, {"p": "12\u201320", "title": "P-norm distance: the \u221e-norm", "points": ["Set p = \u221e: Distance = \u221e\u221a(\u03a3\u1d62 |x\u1d62 \u2212 y\u1d62|<sup>\u221e<\/sup>) = \u221e\u221a(|x\u2081 \u2212 y\u2081|<sup>\u221e<\/sup> + \u2026 + |x\u2099 \u2212 y\u2099|<sup>\u221e<\/sup>).", "The sum equals the largest |x\u1d62 \u2212 y\u1d62| to the infinity power \u2014 the biggest term swamps all others.", "So Distance = \u221e\u221a(max\u1d62 |x\u1d62 \u2212 y\u1d62|<sup>\u221e<\/sup>) = max\u1d62 |x\u1d62 \u2212 y\u1d62|.", "\u221e-norm = largest (absolute) of a set of numbers."], "key": "The \u221e-norm distance is just the largest single-coordinate difference.", "watch": "The \"\u221e power then \u221e root\" argument is informal; formally it's the limit as p \u2192 \u221e."}, {"p": "21\u201322", "title": "Questions about infinity norms", "points": ["Joke question: whose friends actually say \"infinity norm\"?", "Real question: when would infinity-norm distances be used?"], "key": "Motivates a practical use of the \u221e-norm."}, {"p": "23\u201329", "title": "Example: automated storage and retrieval", "points": ["Picture sequence (no text): a robotic crane moves along an aisle of stacked boxes and raises/lowers its arm to reach a box.", "If horizontal and vertical motion happen at the same time, the time to reach a box is the larger of the two times \u2014 an \u221e-norm distance.", "(If the machine moved, then stretched, the times would add \u2014 a 1-norm.)"], "key": "Simultaneous motions in different dimensions \u2192 use the \u221e-norm."}, {"p": "30\u201331", "title": "Picture slides", "points": ["Photo of a crowded supermarket checkout area (no text).", "Drawing of a figure-eight track with cars (no text)."], "key": "Illustrations only; no new definitions."}]}, {"lec": "M4 L3", "title": "K-means clustering", "intro": "Writes clustering as an optimization model, then gives the k-means algorithm (assign points to nearest center, recompute centers, repeat) and classifies it as a heuristic expectation-maximization method.", "topics": ["Clustering optimization formulation", "Cluster membership variables y\u1d62\u2096", "K-means algorithm steps", "Centroid recalculation", "Heuristic vs optimal solution", "Expectation-maximization (EM)"], "slides": [{"p": "2\u20133", "title": "Clustering: previously / this lesson", "points": ["Previously: clustering = grouping data points.", "This lesson: solve it using the k-means algorithm."], "key": "Moves from the idea of clustering to an algorithm."}, {"p": "4\u201311", "title": "Clustering as an optimization model", "points": ["Scatter plot of unclustered data points.", "Notation: x\u1d62\u2c7c = attribute j of data point i; y\u1d62\u2096 = 1 if data point i is in cluster k, 0 if not; z\u2c7c\u2096 = coordinate j of cluster center k.", "Minimize over y, z: \u03a3\u1d62 \u03a3\u2096 y\u1d62\u2096 \u221a(\u03a3\u2c7c (x\u1d62\u2c7c \u2212 z\u2c7c\u2096)\u00b2) \u2014 total distance from each point to its own cluster's center.", "Subject to \u03a3\u2096 y\u1d62\u2096 = 1 for each i \u2014 every point is in exactly one cluster."], "key": "Clustering = choose centers and assignments to minimize total point-to-center distance.", "watch": "This exact model is hard to solve for large data, which is why the k-means heuristic is used."}, {"p": "12\u201319", "title": "The k-means algorithm", "points": ["Step 0: pick k cluster centers within the range of the data.", "Step 1: assign each data point to the nearest cluster center.", "Step 2: recalculate each cluster center as the centroid (mean) of its assigned points.", "Repeat steps 1\u20132 until no changes; the plots show points switching clusters and centers moving each round."], "key": "Alternate assign-points and move-centers until nothing changes."}, {"p": "20\u201323", "title": "What kind of algorithm k-means is", "points": ["It is a machine learning algorithm.", "It is a heuristic: fast and good, but not guaranteed to find the absolute best solution.", "It is an expectation-maximization (EM) method: alternate an expectation step (find cluster centers) and a maximization step (assign points to clusters)."], "key": "K-means is a fast EM-style heuristic, not an exact optimizer.", "watch": "The slide labels finding centers as the expectation step and assigning points as the maximization step; many textbooks describe k-means the other way round (E = assign, M = update centers). The alternation is what matters."}]}, {"lec": "M4 L4", "title": "Practical details for k-means", "intro": "Using k-means in practice: outliers, running from several starting points because it is a heuristic, and choosing the number of clusters k by fitting the situation and comparing total distance.", "topics": ["Outliers in k-means", "Multiple random restarts", "Choosing number of clusters k", "Total distance vs k plot", "Elbow of the curve"], "slides": [{"p": "2\u20133", "title": "Clustering: previously / this lesson", "points": ["Previously: grouping data points, solved with k-means.", "This lesson: k-means in practice."], "key": "Practical issues when running k-means."}, {"p": "4", "title": "Outliers", "points": ["Scatter of three groups plus one point far away, labeled \"Outlier\".", "Such a point can pull a cluster center toward it or end up in a cluster of its own."], "key": "Watch for outliers before clustering (data preparation is Module 5)."}, {"p": "5\u20137", "title": "K-means is a heuristic", "points": ["Heuristic: fast, good, but not guaranteed to find the absolute best solution.", "So run it several times with different initial cluster centers and choose the best solution found.", "Also test different values of k (number of clusters)."], "key": "Restart from different initial centers and keep the best result."}, {"p": "8\u201314", "title": "How many clusters?", "points": ["Same data shown with different numbers of clusters.", "Choose k to fit the situation you're analyzing \u2014 how the clusters will be used.", "Compare total distances: chart of Total Distance vs Clusters (1\u20137) falls steeply then flattens.", "Total distance always shrinks as k grows, so look for where adding clusters stops helping much (the bend, often called the \"elbow\")."], "key": "Pick k from the business need plus the point of diminishing returns in total distance.", "watch": "Don't pick the k with the lowest total distance \u2014 that is always the largest k (each point its own cluster gives zero)."}]}, {"lec": "M4 L5", "title": "Clustering for prediction", "intro": "How to use a k-means result predictively: assign a new data point to the cluster whose center is nearest, which divides the space into regions around the centers.", "topics": ["Assigning a new point", "Nearest cluster center rule", "Voronoi diagram regions"], "slides": [{"p": "2\u20133", "title": "Clustering: previously / this lesson", "points": ["Previously: grouping data points, solved with k-means.", "This lesson: use k-means in a predictive way."], "key": "From describing data to classifying new points."}, {"p": "4\u20137", "title": "Predictive clustering: a new point", "points": ["Scatter plot with cluster centers marked as triangles.", "A new data point arrives; lines are drawn from it to cluster centers.", "Predict its cluster as the one with the nearest center."], "key": "New point \u2192 cluster of the closest center."}, {"p": "8\u201310", "title": "Predictive clustering: regions", "points": ["The plane is shaded into regions, one per cluster center: every location in a region is closer to that center than to any other (a Voronoi diagram).", "An arrow shows a new point falling into a region \u2014 that region's cluster is the prediction."], "key": "Nearest-center assignment partitions the whole space into regions."}]}, {"lec": "M4 L6", "title": "Clustering vs classification", "intro": "Contrasts classification (correct groups already known) with clustering (correct groups unknown) and links them to supervised and unsupervised learning.", "topics": ["Classification vs clustering contrast", "Known vs unknown correct answers", "Supervised learning", "Unsupervised learning"], "slides": [{"p": "2\u20138", "title": "Classification vs clustering", "points": ["Both group data points.", "Classification chart (credit score example): a line separates points whose correct classification is already known.", "Clustering chart: overlapping candidate groupings with a \"?\" \u2014 the correct classification of data points is not known."], "key": "Classification has known answers to learn from; clustering does not."}, {"p": "9\u201310", "title": "Supervised vs unsupervised learning", "points": ["Supervised learning: the correct answer (response) is known for each data point. Example: classification.", "Unsupervised learning: the correct answer (response) is not known. Example: clustering."], "key": "Clustering is unsupervised; classification is supervised."}]}], "n": 4}, {"module": "m5", "title": "Data preparation and outliers", "lectures": [{"lec": "M5 L1", "title": "Data preparation: introduction", "intro": "Why data needs preparing before modeling: examples of quantitative model data and two common issues, differing scales and extraneous information.", "topics": ["Quantitative data examples", "Differences in data scale", "Extraneous information", "Prepare data before modeling"], "slides": [{"p": "2", "title": "Overview", "points": ["Examples of model data.", "Potential data issues."], "key": "Introduces why data preparation matters."}, {"p": "3\u20134", "title": "Data preparation: data in our analysis", "points": ["We use specific data in analysis: predictors (regression), factors (classification), et cetera.", "Quantitative examples: credit scores, average daily temperature in Atlanta, number of hot dogs sold, price of stocks, amount of a certain chemical in drinking water, and more."], "key": "Models run on quantitative data that may need cleaning first."}, {"p": "5\u20136", "title": "Data preparation: potential issues", "points": ["Scale of the data: e.g. household income ~10<sup>5<\/sup> vs credit scores ~10<sup>2<\/sup> \u2014 very different magnitudes.", "Be aware of possible outliers (covered in later lessons).", "Extraneous information complicates the model and makes the solution harder to interpret correctly."], "key": "Watch for scale differences, outliers and unneeded data."}, {"p": "7", "title": "Data preparation: when", "points": ["Address possible problems before building your models.", "Future units of the course assume the data has already been processed."], "key": "Data preparation comes first; later modules take it as done."}, {"p": "8", "title": "Summary", "points": ["Covered: examples of quantitative data and potential problems within the data.", "Next: how to prepare a set of data."], "key": "Sets up the outlier lessons that follow."}]}, {"lec": "M5 L2", "title": "Outlier detection", "intro": "Defines outliers and three types (point, contextual, collective), then shows ways to find them: box-and-whisker plots, other automated methods, and large errors from a fitted model.", "topics": ["Point outliers", "Contextual outliers", "Collective outliers", "Box-and-whisker plot", "Model error to find outliers"], "slides": [{"p": "2", "title": "Previously / this lesson", "points": ["Previous lesson: why data preparation is needed.", "This lesson: what an outlier is and how to detect outliers."], "key": "Moves from general data prep to outliers."}, {"p": "3\u20135", "title": "Point outliers", "points": ["Outlier: a data point that's very different from the rest.", "Scatter plot with two groups (G1, G2) and isolated points O1 and O2.", "Point outliers: O1, perhaps O2 \u2014 values far from the rest of the data."], "key": "A point outlier is far from all other data.", "watch": "O2 is only \"perhaps\" an outlier \u2014 being somewhat apart is a judgment call."}, {"p": "6\u20138", "title": "Contextual outliers", "points": ["Chart of Temperature over Time: a smooth repeating wave with one sudden dip.", "Contextual outlier: the value isn't far from the rest overall, but is far from points nearby in time."], "key": "Some outliers are only unusual relative to their neighbors in time."}, {"p": "9\u201312", "title": "Collective outliers", "points": ["ECG trace over Time (0\u201310000) with regular spikes; one stretch is marked where an expected beat is missing.", "Collective outlier: something is missing in a range of points, but you can't tell exactly where."], "key": "A group of points can be abnormal even if no single point is."}, {"p": "13\u201316", "title": "Finding outliers: box-and-whisker plot", "points": ["Box-and-whisker plot of data on a 100\u20131000 scale: a box for the middle of the data, whiskers for the usual range, and a few points plotted beyond the top whisker.", "Points outside the whiskers are candidate outliers.", "Other automated methods also exist."], "key": "A box-and-whisker plot flags values far outside the usual range."}, {"p": "17\u201320", "title": "Outlier detection: another approach", "points": ["Same Temperature vs Time wave, with the dip circled.", "Fit an exponential smoothing model.", "Point(s) with very large error might be outliers."], "key": "Large model errors point to possible outliers, including contextual ones."}, {"p": "21", "title": "Summary", "points": ["Types of outliers: point, contextual, collective.", "Outlier detection: automated methods (e.g. box-and-whisker) and modeling error."], "key": "Know the three outlier types and two ways to detect them."}]}, {"lec": "M5 L3", "title": "Dealing with outliers", "intro": "What to do once outliers are found: investigate whether they are bad or real data, omit or impute bad data, and handle real outliers carefully, e.g. by modeling them separately.", "topics": ["Bad data vs real data", "Investigating outlier sources", "Omitting or imputing bad points", "Expected outliers in large data", "Separate model for outlier probability", "Chick-fil-A sales spike"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previous lesson: what outliers are and how to find them.", "This lesson: what to do with outliers."], "key": "From detecting outliers to handling them."}, {"p": "4\u201313", "title": "Outliers: bad data or real?", "points": ["Outliers can be bad data: a sensor fails, a contaminated experiment, wrong data input.", "Or\u2026 maybe they are real data.", "Need to investigate: where the data came from, how it was compiled, and unique situations."], "key": "Investigate an outlier before deciding what it is."}, {"p": "14\u201320", "title": "Dealing with outliers: bad vs real data", "points": ["Bad data: omit the data points, or use imputation (fill in an estimated value).", "Real/correct data: outliers are expected in large data sets.", "Normal-distribution example: 4% of data outside two standard deviations.", "With 1,000,000 data points, >2000 expected outside three standard deviations."], "key": "In big data sets, real outliers are normal, not errors.", "watch": "For a normal distribution about 4.5\u20135% lies beyond two standard deviations (the slide rounds to 4%), and about 0.27% beyond three \u2014 roughly 2,700 of 1,000,000, consistent with \">2000\"."}, {"p": "21\u201325", "title": "Removing real outliers can be too optimistic", "points": ["Removing real-data outliers can make results too optimistic.", "Example: time to transport perishable medicine from the US to Africa.", "Outlying data points come from weather events or political issues \u2014 and these events can and do occur."], "key": "Dropping real outliers hides risks that will happen again."}, {"p": "26\u201328", "title": "Dealing with outliers (alternative)", "points": ["Logistic regression model: estimate the probability of outliers happening under different conditions.", "Second model: estimate length of delivery under normal conditions, using data without outliers."], "key": "Model how likely outliers are, and model normal behavior separately."}, {"p": "29\u201330", "title": "Chick-fil-A's weekly sales (simulated data)", "points": ["Chart of Sales vs Weeks (simulated): sales vary in a steady band, with one huge single-week spike.", "The spike is a big, real outlier, not an error."], "key": "Some outliers are real events that no model would have predicted."}, {"p": "31", "title": "Summary", "points": ["Outliers aren't predictable; example: Chick-fil-A, a big, real sales outlier.", "Investigate the data just in case you're wrong."], "key": "Always investigate before treating an outlier as bad data."}]}], "n": 5}, {"module": "m6", "title": "Change detection", "lectures": [{"lec": "M6 L1", "title": "Introduction to change detection", "intro": "What change detection is (deciding whether something has changed in time-series data) and why it matters, with business, science and policy examples plus semiconductor and railroad-safety cases.", "topics": ["Definition of change detection", "Deciding whether action is needed", "Measuring impact of past action", "Semiconductor manufacturing example", "Railroad safety temperature readings", "False readings in real data"], "slides": [{"p": "2", "title": "Change detection", "points": ["Change detection = determining whether something has changed.", "Applies to time series / time-dependent data."], "key": "Change detection asks: has the process behind the data changed?"}, {"p": "3\u20139", "title": "Change detection: examples", "points": ["Determine whether action might be needed: when is it time for preventive maintenance? Has global temperature changed? Have sales decreased due to competition?", "Determine the impact of a past action: did a business tax decrease spur more hiring? Did a price discount increase sales?", "Determine changes to help plan."], "key": "Used to trigger action, judge past actions, and plan."}, {"p": "10\u201311", "title": "Semiconductor manufacturing", "points": ["Photo of a semiconductor production line.", "Using change detection to predict and avoid future problems."], "key": "Catch process drift before it causes defects."}, {"p": "12\u201315", "title": "Example: railroad safety", "points": ["Ideal readings: Temperature vs Time rises steadily \u2014 a warning point, then breakdown; a clear signal before failure.", "Actual readings: noisy, with a false reading (a temporary spike) before the real breakdown.", "Real data makes it harder to tell a true change from random variation."], "key": "A good method must warn early without reacting to every blip."}]}, {"lec": "M6 L2", "title": "Cumulative sum (CUSUM) for change detection", "intro": "The CUSUM method: accumulate how far observations exceed their expected mean, reset at zero, and declare a change when the sum passes a threshold T; shows the role of C and T with a worked table and the decrease version.", "topics": ["CUSUM statistic S\u209c", "Threshold T", "Slack value C", "CUSUM worked table", "Detecting a decrease", "False change detection"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: value of change detection; railroad safety example.", "This lesson: the CUSUM approach to change detection."], "key": "Introduces a specific change-detection method."}, {"p": "4", "title": "Cumulative sum (CUSUM) approach", "points": ["CUSUM = cumulative sum approach to change detection.", "Can detect an increase, a decrease, or both."], "key": "One method, set up for whichever direction of change matters."}, {"p": "5\u201313", "title": "CUSUM: basic statistic", "points": ["x\u209c = observed value at time t; \u03bc = mean of x if no change. Chart: x\u209c vs t fluctuating around \u03bc.", "S\u209c = max{0, S\u209c\u208b\u2081 + (x\u209c \u2212 \u03bc)}: add today's amount above the mean to the running total.", "The max with 0 resets the total so that values below the mean can't build up a negative balance.", "Is S\u209c \u2265 T? If yes, declare that a change (increase) has occurred."], "key": "S\u209c grows only when observations keep running above the mean.", "watch": "Without the reset at 0, a long stretch below the mean would delay detecting a later increase."}, {"p": "14\u201317", "title": "CUSUM with slack value C", "points": ["S\u209c = max{0, S\u209c\u208b\u2081 + (x\u209c \u2212 \u03bc \u2212 C)}; Is S\u209c \u2265 T?", "C pulls each term down, so normal random variation above \u03bc doesn't accumulate.", "Larger C or T: fewer false alarms but slower detection; smaller: faster detection but more false alarms."], "key": "C and T trade off detection speed against false alarms."}, {"p": "18\u201322", "title": "CUSUM worked example", "points": ["Table with columns t, x\u209c, x\u209c \u2212 \u03bc, x\u209c \u2212 \u03bc \u2212 C, S\u209c for t = 0\u201320, using T = 150, C = 0 (here \u03bc = 135, since x\u2081 = 120 gives \u221215).", "Pages 18\u201319 list the data; from page 20, values from t = 11 on are 100 higher \u2014 the change (arrow at t = 11).", "S\u209c: 0, 95, 0, 145, 90, 105, 60, 65, 80, 35 for t = 1\u201310; at t = 4, S\u209c = 145, just under T \u2014 \"false change almost detected\".", "At t = 11, S\u209c = 180 \u2265 150 \u2014 \"change detected\"; S\u209c keeps climbing to 1035 by t = 20."], "key": "With T = 150 the change at t = 11 is caught immediately, but a noise spike at t = 4 nearly triggered a false alarm.", "watch": "S\u209c resets to 0 at t = 1 and t = 3 because S\u209c\u208b\u2081 + (x\u209c \u2212 \u03bc \u2212 C) was negative."}, {"p": "23\u201324", "title": "Detecting an increase or a decrease", "points": ["Increase: S\u209c = max{0, S\u209c\u208b\u2081 + (x\u209c \u2212 \u03bc \u2212 C)}; Is S\u209c \u2265 T?", "Decrease: S\u209c = max{0, S\u209c\u208b\u2081 + (\u03bc \u2212 x\u209c \u2212 C)}; Is S\u209c \u2265 T?", "For a decrease, the sum builds when observations fall below the mean."], "key": "Flip x\u209c \u2212 \u03bc to \u03bc \u2212 x\u209c to detect decreases; run both to detect either."}, {"p": "25\u201326", "title": "CUSUM chart", "points": ["Control-chart view: S\u209c plotted over t with a horizontal line at the threshold T.", "S\u209c stays low, then rises and crosses T; a vertical line marks the point where the change is flagged."], "key": "Plotting S\u209c against T makes the detection moment visible."}]}, {"lec": "M6 L3", "title": "Ethics: honestly reporting our results", "intro": "Homework wrap-up on whether Atlanta summers end later, why different CUSUM choices give different answers, and the analyst's duty to report results honestly rather than to fit prior beliefs.", "topics": ["Atlanta summer-end homework", "Parameter and data choice effects", "Unscientific rationales", "Honest reporting of results", "Climate change data limitations"], "slides": [{"p": "2", "title": "Overview", "points": ["Homework wrap-up: usually, questions go to the forum.", "This homework includes an important analytics ethics issue.", "This lesson: homework wrap-up and analytics ethics."], "key": "Uses the homework to raise an ethics point."}, {"p": "3\u20134", "title": "Change detection homework", "points": ["Based on temperature data: do summers in Atlanta end later?", "Relates to climate change \u2014 both a scientific question and a polarizing political topic."], "key": "A data question with strong opinions attached."}, {"p": "5\u20136", "title": "Different approaches lead to different answers", "points": ["Some find summers ending later; some find summers not ending later.", "Answers differ even if everyone uses the same CUSUM methodology.", "Sources of difference: choice of parameters (C, T), choice of data, interpretation of results."], "key": "Analyst choices can change the conclusion."}, {"p": "7", "title": "Some unscientific rationales", "points": ["Answer \"No\" because the model says no \u2014 but \"I know climate change is happening, temperatures are getting hotter\", therefore the model is wrong.", "Answer \"Yes\" due to belief in climate change evidence \u2014 but the model says no, therefore there's a problem with the model or analysis."], "key": "Overriding results with prior beliefs is not analysis.", "watch": "These are shown as examples of reasoning to avoid, not as valid conclusions."}, {"p": "8\u20139", "title": "Interpret honestly", "points": ["Our responsibility: honestly report the results; provide correct information, insights and suggestions.", "Our real value: use models and data to obtain insights and suggestions that others can't come up with."], "key": "An analyst's value depends on reporting what the data shows."}, {"p": "10\u201312", "title": "Summary", "points": ["Why assign homework with ambiguous results? To learn to be faithful to your results.", "Does this data show climate change? Can't tell from this small data set.", "Always be honest and true to your analysis."], "key": "Report what your analysis shows, even when it's ambiguous."}]}], "n": 6}, {"module": "m7", "title": "Time series models", "lectures": [{"lec": "M7 L1", "title": "Introduction to exponential smoothing", "intro": "Introduces time series data, the kinds of variation it contains (trends, cycles, randomness), and the basic exponential smoothing formula for estimating a baseline from noisy observations.", "topics": ["Examples of time series data", "Baseline S\u209c vs observed x\u209c", "Doctor's blood pressure example", "Basic exponential smoothing formula", "Initial condition S\u2081 = x\u2081"], "slides": [{"p": "2\u20134", "title": "Previously", "points": ["Examples of time series data: highest daily temperature at the Atlanta airport, a stock's price every 2 seconds, daily hamburger sales at a restaurant, blood pressure readings over time.", "Pages 3\u20134 show pictures of such data (e.g., a board of stock prices).", "This lesson: exponential smoothing."], "key": "Time series data = the same response measured over many time periods."}, {"p": "5\u20137", "title": "Variation in Time Series Data", "points": ["Trends over time: e.g., a stock price that is increasing or decreasing.", "Cyclical variations: annual temperature cycles, weekly sales cycles."], "key": "Time series can have trends and cycles."}, {"p": "8\u201310", "title": "Randomness", "points": ["Random variation appears in temperatures, stock prices, blood pressure and hamburger sales.", "Charts plot hamburger sales and blood pressure by day: values jump up and down around an underlying level."], "key": "On top of trends and cycles, observations contain random noise."}, {"p": "11\u201316", "title": "Example", "points": ["S\u209c: the expected baseline response at time period t (e.g., true blood pressure at hour t).", "x\u209c: the observed response (observed blood pressure at hour t).", "Imagine you are a doctor: what is the real blood pressure over time without variation?", "If a reading is different, is it an increase in the baseline, or just a random event?"], "key": "The task is to separate the baseline from random fluctuation.", "watch": "Keep the notation straight: S is the estimated baseline, x is what was actually observed."}, {"p": "17\u201319", "title": "Solution", "points": ["Two ways to answer:", "S\u209c = x\u209c: the observed blood pressure is a real indicator of the baseline.", "S\u209c = S\u209c\u208b\u2081: today's baseline is the same as yesterday's baseline."], "key": "Two extremes: trust the new observation fully, or ignore it."}, {"p": "20\u201324", "title": "Solution - Exponential Smoothing Method", "points": ["Combines both: S\u209c = \u03b1x\u209c + (1 \u2212 \u03b1)S\u209c\u208b\u2081, with 0 < \u03b1 < 1.", "\u03b1 \u2192 0: a lot of randomness in the system, so lean on the previous baseline.", "\u03b1 \u2192 1: not much randomness in the system, so trust the current observation."], "key": "Exponential smoothing is a weighted average of the new observation and the previous baseline.", "watch": "Small \u03b1 gives heavy smoothing; large \u03b1 tracks the data closely."}, {"p": "25\u201327", "title": "Future", "points": ["How to start: initial condition S\u2081 = x\u2081.", "This basic version does not deal with trends or cyclical variations.", "Future: include trends and cyclical variation."], "key": "Start with S\u2081 = x\u2081; the basic model handles only randomness."}]}, {"lec": "M7 L2", "title": "Trend and cyclic effects", "intro": "Extends exponential smoothing to include a trend term and a multiplicative seasonal (cyclic) factor, giving double and triple exponential smoothing (Holt-Winters).", "topics": ["Trend term T\u209c", "Multiplicative seasonality factor C\u209c", "Cycle length L", "Holt-Winters / Winters' method", "Single, double, triple smoothing"], "slides": [{"p": "2\u20136", "title": "Previously", "points": ["Exponential smoothing analyzes time series data: the same response known for many time periods.", "S\u209c = \u03b1x\u209c + (1 \u2212 \u03b1)S\u209c\u208b\u2081, 0 < \u03b1 < 1.", "Trade-off: trust x\u209c when \u03b1 is large; trust S\u209c\u208b\u2081 when \u03b1 is small.", "More randomness \u2192 trust the previous estimate S\u209c\u208b\u2081; less randomness \u2192 trust what you see, x\u209c."], "key": "\u03b1 sets how much to trust new data versus the previous baseline."}, {"p": "7\u201310", "title": "Time Series complexities", "points": ["Trends: increasing or decreasing.", "Cyclical patterns: annual temperature cycles, weekly sales cycles, daily blood pressure cycles.", "This lesson: adding trends and cycles to the exponential smoothing model."], "key": "The basic model must be extended for trend and seasonality."}, {"p": "11\u201313", "title": "Trends", "points": ["T\u209c: the trend at time period t.", "Baseline: S\u209c = \u03b1x\u209c + (1 \u2212 \u03b1)(S\u209c\u208b\u2081 + T\u209c\u208b\u2081) \u2014 the previous baseline is pushed forward by the previous trend.", "Trend: T\u209c = \u03b2(S\u209c \u2212 S\u209c\u208b\u2081) + (1 \u2212 \u03b2)T\u209c\u208b\u2081 \u2014 a smoothed estimate of the change in baseline, with its own constant \u03b2.", "Initial condition: T\u2081 = 0."], "key": "The trend is itself exponentially smoothed, using \u03b2."}, {"p": "14\u201318", "title": "Cyclic patterns", "points": ["Cycles could be added like the trend (an additive component), or alternatively as seasonalities in a multiplicative way.", "L: the length of a cycle; C\u209c: the multiplicative seasonality factor for time t, which inflates or deflates the observation.", "New baseline formula with trend and seasonality: S\u209c = \u03b1x\u209c/C\u209c\u208b\u2097 + (1 \u2212 \u03b1)(S\u209c\u208b\u2081 + T\u209c\u208b\u2081)."], "key": "Divide the observation by last cycle's seasonal factor to de-seasonalize it.", "watch": "The divisor is C\u209c\u208b\u2097 (same point in the previous cycle, L periods ago), not C\u209c\u208b\u2081."}, {"p": "19\u201320", "title": "Cyclic patterns", "points": ["Update the seasonal factor in a similar way: C\u209c = \u03b3(x\u209c/S\u209c) + (1 \u2212 \u03b3)C\u209c\u208b\u2097.", "C\u2081, \u2026, C\u2097 = 1: no initial cyclic effect.", "Example: if C is 1.1 on Sunday, sales were 10% higher just because it was Sunday; of 550 sold on Sunday, 500 is the baseline value and 50 is the 10% extra."], "key": "C\u209c is a smoothed ratio of observation to baseline, with constant \u03b3."}, {"p": "21", "title": "Starting Conditions", "points": ["Trend: T\u2081 = 0, showing no initial trend.", "Multiplicative seasonality: multiplying by 1 shows no initial cyclic effect, so the first L values of C are set to 1."], "key": "Start with no trend and neutral seasonal factors."}, {"p": "22", "title": "Exponential Smoothing Model", "points": ["Sometimes called single, double or triple exponential smoothing (baseline only; + trend; + trend and seasonality).", "Triple exponential smoothing is also called Winters' Method or Holt-Winters."], "key": "Triple exponential smoothing = Holt-Winters."}, {"p": "23", "title": "Future", "points": ["How to find good values of \u03b1, \u03b2, \u03b3.", "How to use exponential smoothing for descriptive analytics and forecasting.", "Where the name \"exponential smoothing\" comes from."], "key": "Next: choosing parameters, forecasting, and the name's origin."}]}, {"lec": "M7 L3", "title": "Exponential smoothing: what the name means", "intro": "Explains the two halves of the name: the formula smooths out peaks and valleys, and expanding it recursively shows every past observation weighted by exponentially shrinking powers of (1 \u2212 \u03b1).", "topics": ["Why it's called \"smoothing\"", "Recursive expansion of S\u209c", "Extended form of exponential smoothing", "Weights (1 \u2212 \u03b1)\u1d4f on past observations"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previous lesson: exponential smoothing for time series data (same response known for many time periods).", "This lesson: where the name \"exponential smoothing\" comes from."], "key": "Explains the name, not a new model."}, {"p": "4\u20135", "title": "Smoothing", "points": ["S\u209c = \u03b1x\u209c + (1 \u2212 \u03b1)S\u209c\u208b\u2081.", "The explanation for single exponential smoothing works exactly the same way for the trend and seasonality versions."], "key": "Same reasoning applies to single, double and triple smoothing.", "watch": "The slides print \u03b1 in a font that can look like \u221d; it is \u03b1 throughout."}, {"p": "6\u20137", "title": "Exponential Smoothing Equation", "points": ["Example: \u03b1 = \u00bd gives S\u209c = \u00bdx\u209c + \u00bdS\u209c\u208b\u2081.", "High x\u209c: S\u209c is not as high, pulled down by (1 \u2212 \u03b1)S\u209c\u208b\u2081.", "Low x\u209c: S\u209c is not as low, pulled up by (1 \u2212 \u03b1)S\u209c\u208b\u2081.", "So peaks and valleys are smoothed out."], "key": "\"Smoothing\": the baseline reacts only partly to each jump."}, {"p": "8\u201313", "title": "Exponential", "points": ["Substitute S\u209c\u208b\u2081 = \u03b1x\u209c\u208b\u2081 + (1 \u2212 \u03b1)S\u209c\u208b\u2082 into the formula: S\u209c = \u03b1x\u209c + (1 \u2212 \u03b1)\u03b1x\u209c\u208b\u2081 + (1 \u2212 \u03b1)\u00b2S\u209c\u208b\u2082.", "Keep substituting (S\u209c\u208b\u2082, S\u209c\u208b\u2083, \u2026): S\u209c = \u03b1x\u209c + (1 \u2212 \u03b1)\u03b1x\u209c\u208b\u2081 + (1 \u2212 \u03b1)\u00b2\u03b1x\u209c\u208b\u2082 + (1 \u2212 \u03b1)\u00b3\u03b1x\u209c\u208b\u2083 + (1 \u2212 \u03b1)\u2074S\u209c\u208b\u2084, and so on.", "The weights on older observations are increasing powers of (1 \u2212 \u03b1) \u2014 that is the \"exponential\"."], "key": "\"Exponential\": repeated substitution produces powers of (1 \u2212 \u03b1)."}, {"p": "14\u201317", "title": "Exponential Smoothing - Extended Form", "points": ["Extended form: S\u209c = \u03b1x\u209c + (1 \u2212 \u03b1)\u03b1x\u209c\u208b\u2081 + (1 \u2212 \u03b1)\u00b2\u03b1x\u209c\u208b\u2082 + (1 \u2212 \u03b1)\u00b3\u03b1x\u209c\u208b\u2083 + (1 \u2212 \u03b1)\u2074\u03b1x\u209c\u208b\u2084 + (1 \u2212 \u03b1)\u2075\u03b1x\u209c\u208b\u2085 + \u2026", "Every past observation contributes to the current baseline estimate.", "More-recent observations are more important: newer observations are weighted more, since 0 < 1 \u2212 \u03b1 < 1."], "key": "S\u209c is a weighted sum of all past data with exponentially decaying weights."}, {"p": "18", "title": "Summary", "points": ["Exponential smoothing smooths out jumps in observed data.", "It weights all past observations exponentially.", "More-recent observations are more important to the current baseline estimate."], "key": "Smoothing + exponentially decaying weights = the name."}]}, {"lec": "M7 L4", "title": "Forecasting with exponential smoothing", "intro": "Shows how to use exponential smoothing for simple forecasting: the baseline alone, then adding trend, then multiplicative seasonality, and how \u03b1, \u03b2, \u03b3 can be chosen by minimizing squared forecast error.", "topics": ["One-step forecast F\u209c\u208a\u2081 = S\u209c", "k-step forecast with trend", "Forecast with seasonal factor", "Choosing \u03b1, \u03b2, \u03b3 by optimization"], "slides": [{"p": "2\u20133", "title": "Previously", "points": ["Exponential smoothing smooths out randomness (peaks and valleys).", "This lesson: exponential smoothing used for simple forecasting."], "key": "From describing the past to predicting the future."}, {"p": "4\u20137", "title": "Forecasting", "points": ["Basic equation: S\u209c = \u03b1x\u209c + (1 \u2212 \u03b1)S\u209c\u208b\u2081.", "Prediction: S\u209c\u208a\u2081 = \u03b1x\u209c\u208a\u2081 + (1 \u2212 \u03b1)S\u209c, but x\u209c\u208a\u2081 is unknown; best guess x\u209c\u208a\u2081 = S\u209c.", "So the forecast for period t+1 is F\u209c\u208a\u2081 = \u03b1S\u209c + (1 \u2212 \u03b1)S\u209c, i.e., F\u209c\u208a\u2081 = S\u209c.", "Further ahead: F\u209c\u208a\u2096 = S\u209c, k = 1, 2, \u2026 (a flat forecast)."], "key": "Without trend or seasonality, the forecast is just the latest baseline."}, {"p": "8\u201312", "title": "Forecasting with trend", "points": ["Include the trend: S\u209c = \u03b1x\u209c + (1 \u2212 \u03b1)(S\u209c\u208b\u2081 + T\u209c\u208b\u2081); T\u209c = \u03b2(S\u209c \u2212 S\u209c\u208b\u2081) + (1 \u2212 \u03b2)T\u209c\u208b\u2081.", "Best estimate of the next baseline is the most current baseline estimate; best estimate of the trend is the most current trend estimate.", "Forecast for t+1: F\u209c\u208a\u2081 = S\u209c + T\u209c.", "k periods ahead: F\u209c\u208a\u2096 = S\u209c + kT\u209c, k = 1, 2, \u2026"], "key": "With trend, extend the baseline by k times the current trend."}, {"p": "13\u201316", "title": "Forecas
