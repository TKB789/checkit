al network. Why scale them to [0, 1] rather than standardize?", "o": [["They have natural bounds, and neural networks want a bounded range", "Scaling fits bounded data (RGB, batting averages, SAT scores) into a fixed range."], ["RGB values are normally distributed, which requires scaling instead", "Normal-like data is the case for standardizing.", "Reversing the rule."], ["Standardizing would erase the color information completely", "Standardizing keeps the information; it's just a different fit.", "Overstating the downside."], ["Scaling removes any outliers from the color data before use", "Scaling doesn't remove outliers.", "Confusing scaling with cleaning."]]}, "M2 L8#2–7": {"q": "How does k-nearest-neighbor classification label a new point?", "o": [["The most common class among its k nearest points", "Its neighbors vote, and the majority class wins."], ["The class whose average point lies closest to it", "That's a nearest-centroid rule, not KNN.", "Confusing neighbors with centroids."], ["The side of a boundary fit to the training data", "That's how SVM works.", "Mixing up methods."], ["The label of its cluster after forming k clusters", "That's k-means, which ignores labels.", "Confusing KNN with k-means."]]}, "M2 L8#8–11": {"q": "In KNN's weighted distance √(Σᵢ wᵢ|xᵢ − yᵢ|²), what happens when you increase one attribute's weight wᵢ?", "o": [["That attribute counts more in picking the neighbors", "Differences in it now add more to the distance."], ["That attribute counts less, since its distances get divided", "Weights multiply, not divide.", "Reversing the weight."], ["All attributes count equally, since weights cancel out", "Weights change each attribute's influence.", "Ignoring the weights."], ["k increases, so more neighbors get to vote", "Weights don't change k.", "Mixing up parameters."]]}, "M2 L8#12–15": {"q": "A fraud team scores millions of transactions a day using a huge training set. Why might KNN be slower than a linear SVM at prediction time?", "o": [["It compares each new case to the stored training points", "KNN does its work at prediction time; SVM just evaluates one equation."], ["It must refit its boundary every time a new case arrives", "KNN has no fitted boundary to refit.", "Thinking KNN trains a boundary."], ["It needs scaled data, which a linear SVM doesn't need", "Both benefit from scaling; that isn't about speed.", "Confusing prep with speed."], ["It solves a larger optimization problem for each case", "KNN does no optimization at prediction time.", "Confusing KNN with SVM."]]}, "M3 L1#5–7": {"q": "A classifier gets 3 of 24 training points wrong (87.5% correct). Why is 87.5% a poor estimate of how it will do on new data?", "o": [["It's too optimistic, since it's measured on the data used to fit it", "The fit captured some random quirks of those 24 points."], ["It's too pessimistic, since the three errors were probably outliers", "Training accuracy tends to overstate, not understate.", "Reversing the bias."], ["It's fine, as long as the classifier has the widest possible margin", "Margin width doesn't fix training-data optimism.", "Mixing up unrelated ideas."], ["It's fine, since 24 points is plenty to measure accuracy on", "The problem isn't size; it's measuring on training data.", "Thinking more points fixes the issue."]]}, "M3 L1#8–9": {"q": "When a model is fit to training data, which patterns does it learn, and which of them carry over to new data?", "o": [["Both real and random; only real effects repeat", "Random effects look real in the training data but don't show up elsewhere."], ["Only real effects, since random ones average away", "The fit captures both; that's why training accuracy is optimistic.", "Assuming the fit ignores noise."], ["Real and random effects; both repeat in new data", "Random effects are specific to the training data.", "Treating noise as signal."], ["Only random effects, since real ones are too small", "Real effects are what the model is after.", "Reversing the idea."]]}, "M3 L1#10–14": {"q": "You try more and more candidate predictors on the same small group and keep the best-fitting one. What happens?", "o": [["Its training fit improves, but its fit on new data doesn't", "More tries mean more chances to fit random effects."], ["Its fit on new data improves as much as its training fit", "Random effects don't repeat in new data.", "Trusting the training fit."], ["Its training fit gets worse, since there's more to choose from", "The best of more options fits at least as well.", "Reversing the effect."], ["Nothing changes, since the group's data stays the same", "Trying more predictors changes what you pick.", "Ignoring selection."]]}, "M3 L1#15–16": {"q": "While exploring data, an analyst finds a surprising pattern after checking dozens of possibilities. What's the best way to tell if it's real?", "o": [["Check whether it holds on data not used to find it", "Real effects repeat on fresh data; chance findings usually don't."], ["Check whether it's strong enough on the same data", "Chance patterns can look very strong on the data that found them.", "Trusting in-sample strength."], ["Rerun the same search to see if it's found again", "The same data will give the same chance pattern.", "Reusing the same data."], ["Add more attributes to see if the pattern survives", "More attributes means more chances for spurious patterns.", "Thinking more variables confirm it."]]}, "M3 L2#4": {"q": "A loan classifier is 90% right on its training data and 80% right on validation data. Which is the better estimate of its real accuracy?", "o": [["80%, from the validation set", "Training accuracy is inflated by random effects."], ["90%, from the training set", "Training accuracy is too optimistic.", "Trusting training data."], ["85%, the average of the two", "Averaging keeps the training bias.", "Splitting the difference."], ["Neither is a useful estimate", "Validation gives a useful estimate for one model.", "Over-skepticism."]]}, "M3 L2#5–7": {"q": "You have one data set and want to both fit a model and measure how good it is. How should you split it?", "o": [["A larger part to fit the model, a smaller part to measure it", "Most data goes to training; a held-out part gives an honest estimate."], ["A smaller part to fit the model, a larger part to measure it", "The model needs most of the data to learn.", "Flipping the sizes."], ["Use it all to fit, then measure on that same data again", "That estimate would be too optimistic.", "Ignoring the lesson."], ["Split it into two equal halves, one for each purpose", "Usually training gets the larger share.", "Assuming equal sizes."]]}, "M3 L2#8–10": {"q": "You compare 20 models on one validation set and pick the top scorer. Why is its validation score probably too optimistic?", "o": [["Picking the max tends to favor models that got lucky", "A score is real quality plus noise; the winner tends to have positive noise."], ["The validation set was used to fit the chosen model", "It wasn't used for fitting; the bias comes from selection.", "Misplacing the source of bias."], ["Validation sets are smaller, so scores always run high", "Small sets are noisier, not biased upward by themselves.", "Blaming set size."], ["All 20 scores are inflated by the same fixed amount", "Only the selected maximum carries the upward bias.", "Thinking the bias is uniform."]]}, "M3 L2#11–12": {"q": "Suppose all 10 models truly have quality 93. SVM-4 scores 97 on validation because of +4 of random luck. What does this show?", "o": [["The top scorer is often the luckiest; its real quality is less", "Selecting the max selects positive randomness."], ["SVM-4 really is the best of the ten models, by about 4 points", "All ten are equally good by construction.", "Mistaking luck for quality."], ["The random parts cancel out, so 97 is the right estimate", "Picking the max keeps the luck, not cancels it.", "Assuming noise averages out."], ["KNN models are worse on average than the SVM models are", "All ten have the same real quality.", "Reading noise as a real difference."]]}, "M3 L2#13": {"q": "A team compared 5 SVM and 5 KNN loan models on validation data, picked the best, and now wants its expected accuracy. What's the correct last step?", "o": [["Score the chosen model once on a separate test set", "Test data estimates the chosen model's performance."], ["Report the best validation score, since it's held out", "Picking the maximum makes that score optimistic.", "Trusting the winning score."], ["Average the ten validation scores and report that", "That describes all models, not the chosen one.", "Averaging models."], ["Retrain on the test set and report training accuracy", "That reuses test data and is optimistic.", "Misusing the test set."]]}, "M3 L2#14": {"q": "You built only one model; there's nothing to choose between. Which data sets do you need?", "o": [["Training and test: fit it, then estimate quality on the test set", "Validation is for choosing among models; with one, skip it."], ["Training, validation, and test, since all three are always needed", "Validation is only needed to choose among models.", "Thinking all three are always needed."], ["Training only, since its accuracy is fine with one model", "Training accuracy is still optimistic.", "Trusting training data."], ["Validation and test only, since training data isn't needed", "The model must be fit on training data.", "Dropping the fitting step."]]}, "M3 L3#4–5": {"q": "With one model, you move data from training to test (e.g., 90/10 to 70/30). What happens?", "o": [["The quality estimate gets more reliable, but the model learns from less data", "It's a trade-off between fitting and measuring."], ["The quality estimate gets less reliable, but the model learns from more data", "That's moving data the other way.", "Reversing the trade-off."], ["Both improve, since more test data always helps the model too", "Test data isn't used to fit the model.", "Thinking test data trains the model."], ["Nothing changes, since the total amount of data is the same", "The split changes what each set can do.", "Ignoring the trade-off."]]}, "M3 L3#6–7": {"q": "A customer file is sorted by signup date. An analyst takes the first 70% of rows as training and the rest as test. What's the main risk?", "o": [["The two sets may differ in systematic ways over time", "Early and late customers can differ, so the sets aren't comparable."], ["The test set will be too large to measure accuracy well", "30% is a typical test share.", "Worrying about the wrong thing."], ["Sorted data can't be used to fit most kinds of models", "Row order doesn't stop fitting.", "Inventing a rule."], ["The training set will contain copies of the test rows", "A cut-off split keeps the sets separate.", "Confusing split with leakage."]]}, "M3 L3#8–15": {"q": "Instead of a random split, you assign rows in a repeating cycle (e.g., train, validate, train, test, train). What does this guarantee?", "o": [["Each set is spread evenly across the data order", "Rotation avoids one set by chance getting mostly early or late rows."], ["Each set is free of any patterns hidden in the data", "A cycle that matches a pattern in the data can create bias.", "Overstating rotation."], ["Each set gets the most typical rows in the data set", "Assignment depends on position, not on how typical a row is.", "Misunderstanding rotation."], ["Each set ends up with the same number of rows", "Shares follow how many slots each set gets.", "Assuming equal sizes."]]}, "M3 L3#16–17": {"q": "For weekday (Mon–Fri) sales data, what risk does a 5-point rotation create?", "o": [["All Mondays land in one set, all Tuesdays in one set, and so on", "Rotation may introduce bias when its cycle matches a pattern in the data."], ["Random chance could give one set more early or late data points", "That's the risk of a random split, not rotation.", "Swapping the two risks."], ["The training set ends up with fewer points than the test set", "Rotation keeps the 60/20/20 proportions.", "Misunderstanding rotation."], ["Rotation can't be used with daily data, only with monthly data", "It can; it just needs care.", "Over-restricting the method."]]}, "M3 L4#4": {"q": "With one fixed split, a few important points end up only in the validation set. How does k-fold cross-validation help?", "o": [["Every point gets used for training in some rounds", "Each fold takes a turn as validation, so no data is left out of training."], ["It speeds up training on the full training data set", "Speed isn't the reason; it takes more rounds.", "Guessing a practical benefit."], ["It removes the need for a separate test set at the end", "You still need a test set to estimate quality.", "Dropping the test step."], ["It lowers the number of attributes each model uses", "It changes the splits, not the attributes.", "Mixing up issues."]]}, "M3 L4#5–6": {"q": "Only 2% of transactions are fraud. Why might you use stratified folds in k-fold cross-validation?", "o": [["So each fold has about the same share of fraud cases", "Otherwise some folds may have few or no fraud cases to evaluate."], ["So each fold has the same number of attributes", "Folds split rows, not attributes.", "Mixing up rows and columns."], ["So the fraud cases are all kept in the training folds", "Then no fold could evaluate fraud detection.", "Hiding the key class."], ["So fewer folds are needed to cover the whole data", "Stratifying doesn't change the number of folds.", "Guessing a speed benefit."]]}, "M3 L4#7–9": {"q": "What happens to the number of models you must fit as k increases in k-fold cross-validation?", "o": [["It grows: one model per fold, so more computation", "Each fold takes a turn as validation."], ["It shrinks, since each fold gets smaller as k grows", "More folds means more models.", "Reversing the effect."], ["It stays at one, since all folds share one model", "Each fold trains its own model.", "Misunderstanding the method."], ["It depends only on the size of the test set", "It depends on k.", "Mixing up sets."]]}, "M3 L4#10–13": {"q": "In k-fold cross-validation, what happens for each of the k parts?", "o": [["Train on all the other parts and evaluate on that one part", "Then average the k evaluations to estimate the model's quality."], ["Train on that one part and evaluate on all the other parts", "Reversed: most data trains the model.", "Flipping training and validation."], ["Train and evaluate on that same part, then compare the results", "You never evaluate on the data you trained on.", "Reusing training data."], ["Evaluate on that part, then permanently delete it from the data", "Nothing is deleted.", "Inventing a step."]]}, "M3 L4#14": {"q": "With 10-fold cross-validation, how many times is each (non-test) data point used for training and for validation?", "o": [["Training 9 times, validation once", "It's held out in exactly one of the ten rounds."], ["Training once, validation 9 times", "Reversed.", "Flipping the roles."], ["Training 10 times, validation 10 times", "A point is never trained and validated on in the same round.", "Double counting."], ["It depends on the random seed", "k-fold assigns each point to exactly one fold.", "Confusing with random resampling."]]}, "M3 L4#15–16": {"q": "Five-fold cross-validation shows a regression model works well. Each fold produced slightly different coefficients. What model should you deploy?", "o": [["Refit the model on all the data and use that fit", "Cross-validation chose the approach; the final fit uses every point."], ["Average the five sets of coefficients into one model", "Averaging coefficients isn't the standard final step.", "Averaging fold models."], ["Use the fold model with the best validation score", "That fold's edge is likely luck, and it saw less data.", "Picking the luckiest fold."], ["Use the fold model whose coefficients vary the least", "No fold model is the intended final model.", "Inventing a tiebreaker."]]}, "M4 L1#3–9": {"q": "A carmaker surveys buyers on how much they care about size, price, versatility, coolness, and mileage, then clusters them. What does each cluster represent?", "o": [["A segment of buyers with similar priorities", "Each segment can get its own marketing."], ["The car model each buyer will end up purchasing", "Clusters group people; they don't predict purchases.", "Confusing clustering with prediction."], ["Buyers who will buy vs. buyers who won't buy", "That would need labels (classification).", "Confusing clustering with classification."], ["The average price that each buyer can afford", "That's a number, not a group.", "Confusing clustering with regression."]]}, "M4 L1#10–18": {"q": "In personalized medicine, why cluster patients?", "o": [["To find groups likely to respond alike to treatment", "Discovering groups of similar patients lets care fit each group."], ["To diagnose each patient using labeled past diagnoses", "With known labels, that's classification.", "Confusing clustering with classification."], ["To forecast the total number of patients next year", "That's a time-series forecast.", "Mixing up methods."], ["To detect when a patient's vital signs drift upward", "That's change detection.", "Mixing up methods."]]}, "M4 L1#19–24": {"q": "Drivers plotted by age and miles driven per year could reasonably be grouped into 2 clusters or into 5. Which is correct?", "o": [["Either can be; the right number depends on the purpose", "Same data, different groupings; choose what fits the situation."], ["Only one; the algorithm will find the one true grouping", "Clusters aren't uniquely defined.", "Thinking clusters are uniquely defined."], ["Always 5, since more clusters always fit the data better", "Fit alone doesn't pick the number of clusters.", "Minimizing distance only."], ["Neither, since the drivers would need labels to be grouped", "Clustering finds groups without labels.", "Confusing clustering with classification."]]}, "M4 L2#2–6": {"q": "A taxi must drive along a city's rectangular street grid. Why is rectilinear (1-norm) distance a better fit than straight-line distance?", "o": [["It goes one way, then the other: |x₁ − y₁| + |x₂ − y₂|", "It can't cut diagonally through buildings."], ["Straight-line distance can't be computed on a city map", "It can; it just doesn't match street travel.", "Missing the point."], ["Street grids make the ∞-norm the most natural distance", "The ∞-norm is for simultaneous moves.", "Mixing up norms."], ["It gives the shortest distance, which is always preferred", "It's actually longer; it just matches the travel.", "Thinking shorter is better."]]}, "M4 L2#7–11": {"q": "Two analysts cluster the same customers, one using Euclidean distance and one using Manhattan distance. Why can their clusters differ?", "o": [["The nearest center can change when the metric changes", "Different metrics can rank the same distances differently."], ["Manhattan distance only works for data with two attributes", "It works in any number of dimensions.", "Inventing a limit."], ["k-means ignores the metric, so the data must differ", "The metric decides nearest-center assignments.", "Thinking the metric is irrelevant."], ["Euclidean distance always gives more clusters than Manhattan", "The number of clusters is set by the analyst.", "Thinking the metric sets k."]]}, "M4 L2#12–20": {"q": "Why does the p-norm distance (Σ|xᵢ − yᵢ|ᵖ)^(1/p) approach max |xᵢ − yᵢ| as p → ∞?", "o": [["The largest term dominates; the root undoes its power", "So the ∞-norm is the largest absolute difference."], ["Every term grows equally, so the result approaches their sum", "The largest term grows fastest and dominates.", "Confusing the ∞-norm with the 1-norm."], ["The root shrinks everything to 0, so all distances vanish", "The root undoes the power, leaving the max.", "Misreading the limit."], ["The smallest term dominates, so it approaches the minimum", "The largest term dominates.", "Reversing max and min."]]}, "M4 L2#21–22": {"q": "For the p-norm distance between two fixed points, what happens as p increases from 1 toward ∞?", "o": [["It shrinks toward the largest single difference", "As p grows, the biggest difference dominates the sum."], ["It grows toward the sum of all the differences", "The 1-norm (the sum) is the largest; it shrinks from there.", "Reversing the direction."], ["It shrinks toward the smallest single difference", "The largest term dominates, not the smallest.", "Reversing max and min."], ["It stays the same, since the points didn't move", "Different p gives different distances.", "Ignoring p."]]}, "M4 L2#23–29": {"q": "A warehouse robot moves along the aisle and lifts its arm at the same time. Why does the ∞-norm match its travel time?", "o": [["Time is set by whichever move takes longer", "Both motions run at once, so time = max of the two."], ["The time is the sum of the two movement times", "That's if it moved, then lifted (1-norm).", "Missing \"at the same time.\""], ["The time follows the straight line to the box", "Its motors don't move along the diagonal.", "Defaulting to Euclidean."], ["The time depends only on the vertical lift", "It depends on the larger of the two.", "Ignoring one dimension."]]}, "M4 L2#30–31": {"q": "A robot moves along the aisle and lifts at the same time. If you speed up only the lift, in which case does its total time drop?", "o": [["Only if the lift was the slower of the moves", "Time is the max of the two (∞-norm); speeding the faster move doesn't help."], ["Always, since the lift is part of every trip", "If the aisle move is slower, it sets the time.", "Using the sum instead of the max."], ["Never, since only horizontal speed matters", "The lift matters when it's the slower move.", "Ignoring one dimension."], ["Only if both moves are exactly the same length", "It's about which one takes longer.", "Guessing."]]}, "M4 L3#4–11": {"q": "Standard k-means chooses clusters to make which quantity as small as possible?", "o": [["Total (squared) distance from points to their own center", "The lecture’s slide writes total distance d(xᵢ, zₖ); textbook k-means squares it (the within-cluster sum of squares), which is why the mean is the right center update. Either wording points here."], ["Total distance between all pairs of cluster centers", "It keeps points near centers; it doesn't shrink center gaps.", "Reversing the goal."], ["Number of points that end up in the largest cluster", "Cluster size isn't the objective.", "Guessing."], ["Number of clusters needed to cover all the points", "k is fixed in advance, not minimized.", "Thinking k is optimized."]]}, "M4 L3#12–19": {"q": "When does the k-means algorithm stop repeating its assign-and-update steps?", "o": [["When no point changes its cluster between two passes", "Then the centers stop moving too, so it has converged."], ["After exactly one pass through all the data points", "One pass is rarely enough for the centers to settle.", "Dropping the loop."], ["When every cluster holds the same number of points", "Equal sizes aren't a goal of k-means.", "Inventing a rule."], ["When total distance reaches zero for all the points", "That only happens if every point is its own center.", "Expecting a perfect fit."]]}, "M4 L3#20–23": {"q": "k-means is called a heuristic. What does that mean in practice?", "o": [["It's fast and usually good, but not guaranteed best", "So run it several times from different starting centers."], ["It's exact and always finds the best possible clustering", "It can get stuck in a worse solution.", "Overstating k-means."], ["It needs labeled points before it can find centers", "It's unsupervised.", "Confusing clustering with classification."], ["It's slow, so it should be run only once on the data", "It's fast, which lets you run it many times.", "Reversing its strengths."]]}, "M4 L4#4": {"q": "Running k-means with k = 3, one point sits far from all three groups. What can it do to the result?", "o": [["Pull a center toward it, or even end up as its own cluster", "Outliers can distort k-means; consider handling them first."], ["Nothing, since k-means ignores points far from the centers", "Every point is assigned and affects its center.", "Thinking outliers are ignored."], ["Become a support vector that sets the cluster boundaries", "That's SVM terminology.", "Mixing up methods."], ["Force k-means to raise k to 4 on its own", "k is chosen by the analyst.", "Thinking the algorithm picks k."]]}, "M4 L4#5–7": {"q": "Two k-means runs on the same data from different random starting centers give different clusters. What should you do?", "o": [["Run it several times, and keep the lowest total distance", "As a heuristic, it can land in different local solutions."], ["Trust the first run, since later runs only add random noise", "Different starts can find better solutions.", "Treating a heuristic as exact."], ["Average the centers from the runs into a single final answer", "Averages of solutions may not be good solutions.", "Averaging solutions."], ["Conclude the data has no clusters, since the runs disagree", "Disagreement comes from the heuristic, not the data.", "Over-reading the variation."]]}, "M4 L4#8–14": {"q": "Total distance to cluster centers always falls as k grows. So how should you choose k?", "o": [["Fit the situation; look for where the drop levels off", "The elbow shows where extra clusters stop helping much."], ["Pick the k with the smallest total distance to centers", "That always picks the largest k (one point per cluster).", "Minimizing a quantity that always falls."], ["Always pick k = 3, since most data has three groups", "There's no fixed k.", "Inventing a default."], ["Let k-means choose k automatically from the data", "k is the analyst's choice.", "Thinking the algorithm picks k."]]}, "M4 L5#4–7": {"q": "A company clustered its existing stores with k-means. A new store opens. How is it assigned to a cluster?", "o": [["To the cluster whose center is nearest", "Predictive clustering uses the existing centers."], ["By re-running k-means on all the stores", "You just use the existing centers.", "Overcomplicating prediction."], ["To the cluster that has the most stores", "It's by distance, not size.", "Using the wrong rule."], ["By a vote of its k nearest labeled stores", "That's KNN classification.", "Confusing k-means with KNN."]]}, "M4 L5#8–10": {"q": "What does a Voronoi diagram show for a set of cluster centers?", "o": [["The region of space closest to each center", "Any new point in a region is assigned to that region's center."], ["The exact outline of each cluster's points", "Regions cover all space, not just the data.", "Misreading the diagram."], ["The areas where outliers should be removed", "Not what the diagram shows.", "Guessing."], ["The margin between two labeled SVM classes", "That's SVM, not clustering.", "Mixing up methods."]]}, "M4 L6#2–8": {"q": "Both classification and clustering put data points into groups. What is the key difference?", "o": [["Classification knows the right groups; clustering doesn't", "Classification learns from labels; clustering discovers groups."], ["Classification uses distances; clustering never uses distance", "k-means uses distance.", "Inventing a difference."], ["Clustering needs more attributes than classification", "Not the distinction.", "Guessing."], ["Classification groups points; clustering predicts numbers", "Both group points.", "Confusing clustering with regression."]]}, "M4 L6#9–10": {"q": "Which pair is correctly labeled supervised vs. unsupervised?", "o": [["Predicting loan default from labeled history: supervised; grouping shoppers: unsupervised", "Supervised = the response is known for each training point."], ["Predicting loan default from labeled history: unsupervised; grouping shoppers: supervised", "Reversed.", "Swapping the definitions."], ["Both are supervised, since an analyst watches each model run", "It's about known responses, not human oversight.", "Taking the words literally."], ["Both are unsupervised, since neither uses a validation set", "Validation isn't the distinction.", "Mixing up ideas."]]}, "M5 L1#3–4": {"q": "A team plans to feed a raw customer table straight into a model. Why is inspecting and preparing the predictors first usually worth it?", "o": [["Problems in the inputs flow directly into the model's results", "Models learn from the data as given, flaws included."], ["Most algorithms refuse to run on data that hasn't been cleaned", "Most will run fine; they just produce worse answers.", "Thinking prep is a software rule."], ["Preparation guarantees the model will generalize to new data", "Clean data helps but guarantees nothing about generalization.", "Overstating what prep achieves."], ["It lets you skip validation because the data is now trustworthy", "Validation is still needed after preparation.", "Treating prep as validation."]]}, "M5 L1#5–6": {"q": "A k-nearest-neighbors model uses income (tens of thousands) and credit score (hundreds) without scaling. What happens?", "o": [["Income dominates the distance, so credit score barely counts", "Distances are driven by the attribute with the largest range."], ["Credit score dominates, since it has more distinct values", "Range, not the number of distinct values, drives distance.", "Misjudging what drives distance."], ["Nothing, since KNN weights each attribute by importance", "Plain KNN treats all attributes alike, units included.", "Overtrusting the method."], ["Income values all become outliers because they are large", "Large units don't make values outliers.", "Confusing scale with outliers."]]}, "M5 L1#7": {"q": "Where does handling data issues like scaling and outliers usually fit in an analytics workflow?", "o": [["Mostly before modeling, revisited as models reveal issues", "Prep comes first, but model results can expose problems to recheck."], ["Only after modeling, since models show which issues matter", "Waiting means early models are built on distorted data.", "Reversing the order."], ["Only when validation accuracy turns out to be poor", "Data problems can hide behind decent accuracy.", "Treating prep as a fallback."], ["Once at the start, then never again for that project", "New findings often send you back to the data.", "Treating prep as one-and-done."]]}, "M5 L2#3–5": {"q": "A data point sits 2.5 standard deviations from the mean. Is it an outlier?", "o": [["Maybe: an outlier is just very different from the rest", "SD cutoffs are rules of thumb for flagging, not the definition."], ["Yes: anything beyond 2 SDs is an outlier by definition", "2 SDs is one rule of thumb, not the definition.", "Confusing a rule with the definition."], ["No: only data-entry errors can count as outliers", "Outliers can be real data.", "Assuming outliers are errors."], ["No: only the single largest value can be an outlier", "Several points can be outliers.", "Over-simplifying."]]}, "M5 L2#6–8": {"q": "A website gets 50,000 visits in one hour at 3 a.m. That count is normal at midday but far above its usual overnight level. What kind of outlier is this?", "o": [["Contextual: typical overall, but odd for when it occurred", "The value is ordinary; its timing makes it odd."], ["Point: far from every other value, regardless of its timing", "50,000 is common at midday, so it's not extreme overall.", "Ignoring context."], ["Collective: a pattern missing across a range of hours", "It's one odd reading, not a missing pattern.", "Mixing up outlier types."], ["Not an outlier, since the value is within the overall range", "Values can be outliers relative to their context.", "Looking only at the value."]]}, "M5 L2#9–12": {"q": "An ECG trace is missing a heartbeat, but every single reading looks normal on its own. What kind of outlier is this?", "o": [["Collective: something is missing across a range of points", "No single point is wrong, but the group of points is."], ["Point: one reading is far from all the other readings", "No single reading is extreme.", "Looking for one extreme value."], ["Contextual: a normal value at an odd time of day", "It's a missing pattern, not one odd-timed value.", "Mixing up types."], ["Not an outlier, since each reading is normal alone", "Outliers can be patterns across points.", "Checking points one at a time only."]]}, "M5 L2#13–16": {"q": "On a box-and-whisker plot of delivery times, how are possible outliers flagged?", "o": [["As points beyond the whiskers", "The box covers the middle; whiskers reach the typical range."], ["As points inside the box", "The box is the middle 50% of the data.", "Misreading the plot."], ["As the median line in the box", "That's the center of the data.", "Misreading the plot."], ["As the ends of the whiskers", "Points past the whiskers are flagged.", "Misreading the plot."]]}, "M5 L2#17–20": {"q": "A July temperature of 58°F is normal for the year overall but odd for July. How can you catch it?", "o": [["Fit exponential smoothing; flag readings with big errors", "The model expects a July value, so 58°F leaves a big error."], ["Remove the top and bottom 5% of all the temperature values", "58°F isn't extreme overall.", "Trimming by value only."], ["Standardize the readings and flag any with z-score above 3", "That judges the value alone, ignoring timing.", "Ignoring context."], ["Cluster the readings and flag clusters with only one point", "That ignores time order.", "Mixing up methods."]]}, "M5 L3#4–13": {"q": "Which outlier is most likely bad data rather than a real event?", "o": [["A reading from a sensor later found faulty", "Sensor failure, contaminated experiments, and wrong data input are bad-data causes."], ["A week of huge sales during a real local festival", "That's a real outlier.", "Confusing real events with bad data."], ["A long shipping delay caused by a major storm", "That's a real outlier.", "Confusing real events with bad data."], ["A very tall person in a random sample of adults", "Rare but real.", "Assuming extremes are errors."]]}, "M5 L3#14–20": {"q": "As a normal data set grows from 1,000 to 1,000,000 points, what happens to the number of points beyond 3 SDs?", "o": [["It grows in proportion: big data has many real extremes", "About 0.3% of points: ~3 vs. ~2,700."], ["It stays about the same, since extremes are always rare", "The share stays the same, so the count grows.", "Confusing share with count."], ["It shrinks, since more data averages extremes out", "More data means more tail points.", "Confusing with the mean."], ["It drops to 0, since big data is always normal", "Normal data always has tails.", "Assuming extremes vanish."]]}, "M5 L3#21–25": {"q": "A shipping model drops all storm- and politics-related delays before it's fit. What's the risk?", "o": [["It becomes too optimistic, since those delays do happen", "Real outliers carry real risk; removing them hides it."], ["It becomes too pessimistic about the remaining shipments", "Dropping long delays makes it optimistic, not pessimistic.", "Reversing the direction."], ["None, since rare delays barely change the average", "Ignoring real risk makes plans too optimistic.", "Assuming rare events don't matter."], ["None, since such delays are always data-entry errors", "These are real events.", "Assuming outliers are errors."]]}, "M5 L3#26–28": {"q": "Why fit the normal-conditions delivery model without the disrupted shipments?", "o": [["Huge delays would distort the normal-case estimate", "The disruption model covers those cases separately."], ["Disrupted shipments are bad data that should be deleted", "They're real; they're just modeled separately.", "Treating real outliers as bad data."], ["Linear regression can't be fit to more than one group", "It can; the point is to keep estimates clean.", "Inventing a limitation."], ["It makes the model's R² exactly 1 for normal shipments", "It improves the fit but isn't perfect.", "Overstating the effect."]]}, "M5 L3#29–30": {"q": "A restaurant's weekly sales show one huge spike, confirmed real (a one-time local event that won't recur). For a model of normal weekly sales, what's the right approach?", "o": [["Remove it, and document that it was a verified one-off, not an error", "Real but not relevant to normal weeks: the lecture allows removing a real one-off that can't be predicted, as long as you record why."], ["Delete it, since any spike that large must come from bad data", "It's confirmed real; the reason to remove it is that it won't recur, not that it's wrong.", "Assuming spikes are errors."], ["Forecast the next spike exactly, since spikes follow a pattern", "A one-off with no predictors can't be forecast. If spikes recurred with known causes, you'd model their chance separately (e.g. logistic).", "Overtrusting models."], ["Keep it in, since removing real data always biases the model", "Real extremes that recur or matter to the cost of errors should stay; a verified one-off that won't recur can go.", "Treating every real point as one to keep."]]}, "M6 L1#2": {"q": "A factory tracks a machine's output every hour. Which question is change detection?", "o": [["Has the average output shifted since last week?", "Change detection asks whether something has changed, using time-series data."], ["What will the machine's output be next hour?", "That's forecasting.", "Confusing change detection with forecasting."], ["Which hours of the day behave similarly to each other?", "That's clustering.", "Mixing up methods."], ["Was yesterday's 3 pm reading a single strange value?", "That's outlier detection.", "Confusing change detection with outlier detection."]]}, "M6 L1#3–9": {"q": "After a new checkout design launches, change detection finds a rise in conversion rate. What is the main caution in crediting the redesign?", "o": [["Other factors that changed at the same time may explain it", "Detecting a shift doesn't establish what caused it."], ["Change detection can't be used on data from before a launch", "Pre-launch data is exactly what sets the baseline.", "Misunderstanding the baseline."], ["A rise in conversion can only be detected with forecasting", "Change detection is designed for this kind of question.", "Mixing up methods."], ["A detected change always means the effect will be permanent", "Shifts can fade; detection says nothing about duration.", "Overclaiming persistence."]]}, "M6 L1#10–11": {"q": "In chip manufacturing, a machine can drift so parts come out slightly off spec. What does change detection offer here?", "o": [["Early warning of drift, before many bad parts pile up", "Catching a shift early limits the damage."], ["A grouping of parts into clusters by their measurements", "That's clustering.", "Mixing up methods."], ["A forecast of next month's demand for the finished chips", "That's forecasting a different quantity.", "Mixing up methods."], ["A label for each part based on past, inspected examples", "That's classification.", "Mixing up methods."]]}, "M6 L1#12–15": {"q": "A railroad bearing monitor shows one false temperature spike, then a real rise before breakdown. Why is CUSUM better than alarming on any single high reading?", "o": [["It builds up evidence, so one spike fades but a steady rise alarms", "With C and T set well, a lone spike won't cross T; a steady rise will."], ["It ignores all high readings, so it can never be fooled by false spikes", "It uses high readings; it just needs them to persist.", "Overstating CUSUM."], ["It predicts the exact day of breakdown from the first temperature spike", "It detects change; it doesn't forecast a date.", "Confusing detection with forecasting."], ["It removes the spike as an outlier before looking at the other readings", "CUSUM doesn't delete data.", "Mixing up modules."]]}, "M6 L2#4": {"q": "A hospital monitors patients' blood glucose, where both high and low levels are dangerous. How should CUSUM be set up?", "o": [["Run both an increase and a decrease CUSUM together", "Each one-sided sum watches one dangerous direction."], ["Run only an increase CUSUM, since highs are more common", "Low levels are dangerous too and would be missed.", "Watching only one direction."], ["Run only a decrease CUSUM, since lows are more urgent", "High levels would then go undetected.", "Watching only one direction."], ["Skip CUSUM, since it can only detect one-time spikes", "CUSUM detects sustained shifts, in either direction.", "Misunderstanding CUSUM."]]}, "M6 L2#5–13": {"q": "You're setting up CUSUM for a call center's daily wait times. Where should the baseline mean μ come from?", "o": [["A past period when the process was known to be stable", "μ should reflect normal behavior with no change present."], ["The most recent week, since it's the most up to date", "Recent data may already include the change you're watching for.", "Contaminating the baseline."], ["The highest value seen so far, to avoid any false alarms", "That would hide real increases.", "Confusing μ with a threshold."], ["The entire history, including any known past shifts", "Known shifts would bias the baseline.", "Mixing changed and normal data."]]}, "M6 L2#14–17": {"q": "What does adding C to the CUSUM formula (xₜ − μ − C) do?", "o": [["It keeps normal random variation from building up", "Only deviations bigger than C add to the total."], ["It makes every reading count more toward the alarm's total", "It subtracts, so readings count less.", "Reversing C's effect."], ["It resets the running total to zero at every time step", "The max with 0 handles the floor; C dampens noise.", "Mixing up components."], ["It sets how many readings are needed before an alarm fires", "That's closer to T's role.", "Confusing C and T."]]}, "M6 L2#18–22": {"q": "What happens to CUSUM's behavior if you raise the threshold T?", "o": [["Fewer false alarms, but real changes are detected later", "Sₜ must build up more evidence before it crosses T."], ["More false alarms, but real changes are detected sooner", "That's lowering T.", "Reversing the trade-off."], ["Fewer false alarms and faster detection at the same time", "Raising T trades speed for fewer false alarms.", "Ignoring the trade-off."], ["No change, since only C affects how fast it detects", "T directly sets when the alarm goes off.", "Ignoring T."]]}, "M6 L2#23–24": {"q": "Why run separate increase and decrease CUSUMs instead of one running sum of raw deviations from the mean?", "o": [["In one sum, rises and drops can cancel and hide changes", "Separate sums keep each direction's evidence from being offset."], ["One sum would need a threshold T that changes each day", "A fixed threshold works; cancellation is the issue.", "Inventing a limitation."], ["A single sum could only detect decreases, never increases", "A raw sum isn't limited to one direction.", "Misreading the math."], ["Two sums make each alarm certain to be a real change", "False alarms are still possible with two sums.", "Overstating accuracy."]]}, "M6 L2#25–26": {"q": "A process truly changes at t = 50, but CUSUM crosses the threshold T at t = 58. Why the gap?", "o": [["CUSUM needs evidence to build up before it crosses T", "Detection lags the real change; a lower T shortens the lag."], ["The change actually happened at t = 58, not at t = 50", "The crossing is the alarm, not the change itself.", "Equating change and detection."], ["CUSUM made an error and should be rerun with the data", "Delay is expected, not a mistake.", "Misreading the lag."], ["The gap is a false alarm between the two points", "A delay isn't a false alarm.", "Misreading the lag."]]}, "M6 L3#3–4": {"q": "A CUSUM finds a shift with one C and T, but slightly different reasonable values show no shift. What should you report?", "o": [["The result depends on settings, so evidence is weak", "Honest reporting includes how fragile the finding is."], ["The shift, since the first settings were chosen first", "Order of trying doesn't make settings correct.", "Anchoring on the first result."], ["No shift, since the majority of settings found none", "Vote-counting settings hides the real uncertainty.", "Treating settings as votes."], ["Whichever result best supports the project's goals", "That's fitting results to preferences.", "Cherry-picking results."]]}, "M6 L3#5–6": {"q": "Two teams use the same CUSUM method on the same question and reach different conclusions. What can explain this?", "o": [["Choices of C and T, of data, and of interpretation", "The method is the same, but judgment calls differ."], ["Different software computes the same formula differently", "The formula gives the same result anywhere.", "Blaming software."], ["One team must have made an arithmetic mistake", "Reasonable choices can differ without errors.", "Assuming one right answer."], ["CUSUM gives a random answer each time it's run", "It's deterministic given C, T, and data.", "Misunderstanding CUSUM."]]}, "M6 L3#7": {"q": "Which reasoning is unscientific?", "o": [["\"I know it's happening, so the model must be wrong\"", "Rejecting results because they disagree with your beliefs isn't science."], ["\"I tried several C and T values before choosing one\"", "Testing parameters is normal, if reported honestly.", "Confusing tuning with bias."], ["\"The data set was small, so the result is uncertain\"", "That's an honest limitation.", "Mixing up ideas."], ["\"The data can't answer this question with confidence\"", "That's honest reporting.", "Reversing the lesson."]]}, "M6 L3#8–9": {"q": "A client wants your analysis to confirm a decision they've already made, but the data points the other way. What's your job?", "o": [["Report honestly, including results they didn't want", "An analyst's value is correct information and insights others can't find."], ["Adjust the model until it supports the client's decision", "That's fitting results to beliefs.", "Reversing the lesson."], ["Report only the parts of the analysis that support them", "That's cherry-picking.", "Hiding results."], ["Decline to report anything that might upset the client", "Silence isn't honest reporting.", "Avoiding the issue."]]}, "M7 L1#5–7": {"q": "Daily ice-cream sales rise over the years, peak every summer, and bounce around day to day. Which kinds of variation are these?", "o": [["A trend, a cyclical (seasonal) pattern, and randomness", "Time series mix trends, cycles, and random variation."], ["Outliers, missing values, and a trend in the sales", "Nothing here is missing or extreme.", "Mixing up data-prep issues."], ["A trend, an interaction effect, and heteroscedasticity", "Those are regression and variance terms.", "Mixing up modules."], ["Randomness only, since sales always bounce around", "The long-run rise and summer peaks are systematic.", "Missing the structure."]]}, "M7 L1#8–10": {"q": "Besides trend and cyclic (seasonal) patterns, what else does a time series contain?", "o": [["Random variation: observations jump around the underlying level", "Exponential smoothing exists to see through this noise."], ["Nothing; trend and season explain every value", "Real data always has noise.", "Assuming a perfect fit."], ["Only outliers caused by data errors", "Ordinary randomness isn't an error.", "Confusing noise with bad data."], ["A constant that never changes", "That would be the level, not the noise.", "Mixing up the parts."]]}, "M7 L1#11–16": {"q": "Today's blood-pressure reading is above the current baseline. How does the new baseline change as α increases?", "o": [["It moves closer to today's reading", "Sₜ = αxₜ + (1 − α)Sₜ₋₁ puts more weight on xₜ."], ["It stays closer to the old baseline", "That's what a smaller α does.", "Reversing α."], ["It moves below the old baseline", "A higher reading pulls it up.", "Misreading the sign."], ["It doesn't change at all", "α sets how much it moves.", "Ignoring α."]]}, "M7 L1#17–19": {"q": "In Sₜ = αxₜ + (1 − α)Sₜ₋₁, what happens at the two extremes α = 1 and α = 0?", "o": [["α = 1: Sₜ = xₜ (trust the reading); α = 0: Sₜ = Sₜ₋₁ (ignore it)", "Exponential smoothing sits between these extremes."], ["α = 1: Sₜ = Sₜ₋₁ (ignore it); α = 0: Sₜ = xₜ (trust the reading)", "Reversed: α weights the new reading.", "Reversing α's meaning."], ["α = 1: Sₜ = 0 (no baseline); α = 0: Sₜ = xₜ₊₁ (next reading)", "Neither extreme gives those.", "Garbling the formula."], ["α = 1: Sₜ = the average; α = 0: Sₜ = the median reading", "Neither extreme gives those.", "Guessing."]]}, "M7 L1#20–24": {"q": "If the best-fit α is close to 0, or close to 1, what does that say about the system?", "o": [["α → 0: a lot of randomness. α → 1: not much randomness", "More randomness means trusting the previous baseline more."], ["α → 0: not much randomness. α → 1: a lot of randomness", "Reversed.", "Flipping α's meaning."], ["α → 0: a strong trend. α → 1: a strong seasonal pattern", "α is about randomness vs. trust in new data.", "Confusing α with β and γ."], ["α → 0: very few data points. α → 1: very many data points", "α isn't about sample size.", "Guessing."]]}, "M7 L2#7–10": {"q": "In trend-adjusted (Holt) smoothing, why does the level update blend the new reading with last level plus last trend, not last level alone?", "o": [["To project the old level forward so it doesn't lag", "Adding the trend moves the prior estimate to where it should be now."], ["To double-count growth so forecasts run slightly high", "The goal is an unbiased level, not an inflated one.", "Thinking bias is intentional."], ["To remove seasonality from the reading before blending", "Seasonality is handled by separate factors.", "Confusing trend with seasonality."], ["To keep the level fixed while only the trend updates", "The level still updates every period.", "Misreading the update."]]}, "M7 L2#11–13": {"q": "In Tₜ = β(Sₜ − Sₜ₋₁) + (1 − β)Tₜ₋₁, what happens to the trend estimate as β increases?", "o": [["It reacts more to the latest baseline change", "Larger β trusts the newest change over the old trend."], ["It leans more heavily on the old trend estimate", "That's what a smaller β does.", "Reversing β."], ["It ignores the baseline completely", "β weights the baseline's change.", "Misreading the formula."], ["It becomes seasonal instead of linear", "β only affects the trend.", "Mixing up parameters."]]}, "M7 L2#14–18": {"q": "In Holt-Winters with multiplicative seasonality, why is a December reading divided by December's seasonal factor before updating the baseline?", "o": [["So the holiday peak doesn't inflate the baseline", "Deseasonalizing lets the baseline track the underlying level."], ["So December forecasts come out higher next year", "Division removes the peak; it doesn't boost forecasts.", "Reversing the adjustment."], ["So the trend estimate absorbs the holiday effect", "The seasonal factor, not the trend, holds that effect.", "Confusing trend with seasonality."], ["So random noise in December is fully removed", "Division removes the seasonal effect, not the noise.", "Confusing seasonality with noise."]]}, "M7 L2#19–20": {"q": "Sunday sales keep beating what the Sunday factor predicts. What happens to that factor over time, and how does γ affect it?", "o": [["It rises gradually, and faster when γ is larger", "Cₜ = γ(xₜ/Sₜ) + (1 − γ)Cₜ₋ₗ blends in each new ratio."], ["It rises gradually, and faster when γ is smaller", "Smaller γ means slower updates.", "Reversing γ."], ["It stays fixed, since factors are set at the start", "Factors update every cycle.", "Thinking factors are fixed."], ["It falls, since the baseline catches up", "Higher-than-expected sales raise it.", "Misreading the update."]]}, "M7 L2#21": {"q": "Every day's burger sales rise 10%, but the weekly pattern stays the same. What happens to the multiplicative seasonal factors?", "o": [["They stay about the same; the baseline absorbs it", "Factors are ratios to the baseline, so an across-the-board rise doesn't change them."], ["They all rise by about 10%, matching the new sales", "The baseline rises too, so the ratios hold.", "Forgetting the baseline moves."], ["They all fall, since the baseline grew faster", "Baseline and sales rise together.", "Guessing."], ["Only the busiest day's factor goes up by 10%", "The whole pattern is unchanged.", "Guessing."]]}, "M7 L2#22": {"q": "Monthly electricity demand has a slowly rising level and a strong summer/winter cycle. Which smoothing approach fits best?", "o": [["Holt-Winters, with level, trend, and season", "Triple smoothing captures all three components."], ["Holt's linear method, with only level and trend", "It has no seasonal term for the annual cycle.", "Missing the seasonality."], ["Simple exponential smoothing with a very small α", "Small α smooths noise but ignores trend and cycle.", "Ignoring structure."], ["GARCH, since demand swings between the seasons", "GARCH models changing variance, not a mean cycle.", "Mixing up methods."]]}, "M7 L3#4–5": {"q": "With α = ½ (Sₜ = ½xₜ + ½Sₜ₋₁), how does Sₜ respond to an unusually high or low reading xₜ?", "o": [["High xₜ: Sₜ pulled down. Low xₜ: pulled up. Peaks and valleys smooth out", "That's why it's called \"smoothing.\""], ["High xₜ: Sₜ goes even higher. Low xₜ: even lower. Peaks are amplified", "The previous baseline pulls it back toward the middle.", "Reversing the effect."], ["High xₜ and low xₜ are both ignored; Sₜ always equals Sₜ₋₁ exactly", "α = ½ still gives xₜ half the weight.", "Treating α as 0."], ["Sₜ always equals xₜ exactly, so no smoothing happens with α = ½", "That would need α = 1.", "Treating α as 1."]]}, "M7 L3#6–7": {"q": "How does simple exponential smoothing weight past data compared with a 7-day moving average?", "o": [["All past days, with weights shrinking the older they are", "Weights decay geometrically but never reach zero."], ["Only the last 7 days, each weighted exactly the same", "That describes the moving average itself.", "Confusing the two methods."], ["Older days weighted more, since they're better confirmed", "Recent observations get the most weight.", "Reversing the weighting."], ["Only today and yesterday, weighted by α and 1 − α", "Expanding the recursion reaches all past data.", "Missing the recursion."]]}, "M7 L3#8–13": {"q": "Why is exponential smoothing called \"exponential\"?", "o": [["Weights shrink by a constant factor per period back", "Weights follow α(1 − α)ⁿ, an exponential decay."], ["Its forecasts grow exponentially, like compound interest", "The weights, not the forecasts, are exponential.", "Misreading the name."], ["It drops every observation older than a few periods", "All past observations keep some small weight.", "Overstating the decay."], ["It is meant only for data that grows exponentially", "It is used on many kinds of series.", "Taking the name literally."]]}, "M7 L3#14–17": {"q": "One wild reading arrives. With a smaller α, how does it affect the baseline?", "o": [["It moves the baseline less, and that fades slowly", "Weights α(1 − α)ⁿ start small and decay slowly when α is small."], ["It moves the baseline more, and its effect fades quickly", "That's a large α.", "Reversing α."], ["It has no effect, since small α ignores new readings", "It still gets weight α.", "Treating small as zero."], ["It replaces the baseline, since it's the latest reading", "That's α = 1.", "Misreading α."]]}, "M7 L4#4–7": {"q": "A simple exponential smoothing model tracks daily web visits. What is its forecast for tomorrow?", "o": [["Today's smoothed baseline value", "With no trend or season, the current level is the best guess."], ["Today's raw observed visit count", "That ignores the smoothing; the baseline is used.", "Confusing observation with baseline."], ["Today's baseline plus α visits", "α is a weight, not a growth step.", "Misusing α."], ["The average of all past visit counts", "Recent data gets more weight than old data.", "Confusing with a plain mean."]]}, "M7 L4#8–12": {"q": "With a positive trend, what happens to the forecast Fₜ₊ₖ = Sₜ + kTₜ as you forecast further ahead?", "o": [["It rises steadily, by Tₜ per period", "The trend is added once per period ahead."], ["It stays flat at Sₜ, whatever the value of k", "That's basic smoothing with no trend.", "Dropping the trend."], ["It doubles with each extra period ahead", "The trend adds; it doesn't multiply.", "Treating growth as exponential."], ["It falls back toward the long-run average", "A positive trend pushes it up.", "Assuming mean reversion."]]}, "M7 L4#13–16": {"q": "Saturday's seasonal factor is 0.8 instead of 1.2. What happens to Saturday's forecast compared with baseline + trend?", "o": [["It's 20% below instead of 20% above", "The factor multiplies (Sₜ + kTₜ)."], ["It's 20% above either way", "A factor under 1 lowers the forecast.", "Ignoring the factor."], ["It's 0.8 units below", "The factor multiplies; it doesn't subtract.", "Treating the factor as additive."], ["It's unchanged, since trend dominates", "The factor applies to the whole forecast.", "Ignoring seasonality."]]}, "M7 L5#5–8": {"q": "For which series is simple exponential smoothing (no trend or seasonal terms) the best fit?", "o": [["Noisy readings around a slowly drifting level", "It tracks a changing level while filtering noise."], ["Sales that grow by a steady amount each month", "It lags behind a trend; add a trend term.", "Ignoring trend."], ["Hourly traffic with a strong daily cycle", "It can't capture a repeating cycle.", "Ignoring seasonality."], ["Returns whose volatility changes over time", "Changing variance calls for a model like GARCH.", "Mixing up targets."]]}, "M7 L5#9–12": {"q": "A service gains roughly 500 subscribers every month. What do the first differences of the subscriber count look like?", "o": [["Values scattered around 500, with no trend left", "Differencing a linear trend leaves a roughly constant series."], ["A curve that keeps rising faster month to month", "That would need an accelerating original series.", "Misunderstanding differencing."], ["Values that are all close to exactly zero", "The differences equal the monthly gain, about 500.", "Confusing with second differences."], ["The same upward trend as the original counts", "Differencing removes a linear trend.", "Thinking differencing does nothing."]]}, "M7 L5#13–15": {"q": "What makes a regression \"autoregressive\"?", "o": [["It predicts a series from that series' own earlier values", "\"Auto\" = self; it only works with time-series data."], ["The software fits it automatically, with no choices needed", "\"Auto\" refers to using the series' own past.", "Taking \"auto\" literally."], ["It regresses the model's errors until they reach zero", "That's closer to the moving-average idea.", "Mixing up ARIMA parts."], ["It works on any kind of data, not only on time series", "It needs time-series data.", "Reversing the idea."]]}, "M7 L5#16–18": {"q": "Exponential smoothing's Sₜ can be expanded into a weighted sum of xₜ, xₜ₋₁, xₜ₋₂, … all the way back. How does that relate to autoregression?", "o": [["Order-∞ autoregression; order-p uses only the last p", "Every past value gets some (shrinking) weight."], ["It's order-1 autoregression, using only yesterday's value", "All past values get weight, not just one.", "Missing the expansion."], ["It's order-0, since it uses no past values at all", "It uses past values through Sₜ₋₁.", "Missing the connection."], ["They're unrelated, since smoothing isn't a regression", "The expansion shows the connection.", "Missing the connection."]]}, "M7 L5#19": {"q": "What is ARIMA's moving-average part?", "o": [["Using previous forecast errors as predictors, going back q periods", "Order-q moving average: εₜ₋₁, εₜ₋₂, …, εₜ₋q. (The slide writes εₜ = x̂ₜ − xₜ; textbooks use xₜ − x̂ₜ. The sign is absorbed by the coefficients.)"], ["Averaging the last q observed values of the series to get the next forecast", "Despite the name, it uses past errors.", "Taking the name literally."], ["Taking q-th order differences of the data to make it stationary", "That's the \"I\" (differences) part.", "Mixing up ARIMA parts."], ["Averaging the q largest values to smooth out peaks in the data", "Not the definition.", "Guessing."]]}, "M7 L5#20–22": {"q": "In ARIMA(p, d, q), what do the three numbers control?", "o": [["p: past values used; d: times differenced; q: past errors used", "AR terms on differences, differencing order, MA terms on past forecast errors."], ["p: past errors used; d: times differenced; q: past values used", "p is the AR part (values); q is the MA part (errors).", "Swapping p and q."], ["p: forecast periods; d: data points; q: seasonal length", "None of these are ARIMA's parameters.", "Guessing."], ["p: past variances; d: differences; q: squared errors", "Variances and squared errors belong to GARCH.", "Mixing ARIMA and GARCH."]]}, "M7 L5#23–29": {"q": "Which ARIMA model is basic exponential smoothing?", "o": [["ARIMA(0, 1, 1)", "One difference and one moving-average term."], ["ARIMA(0, 1, 0)", "That's a random walk.", "Mixing up special cases."], ["ARIMA(0, 0, 0)", "That's white noise.", "Mixing up special cases."], ["ARIMA(1, 0, 0)", "That's a first-order AR model.", "Mixing up special cases."]]}, "M7 L5#30–31": {"q": "A new product has only 15 weeks of noisy sales with a few spikes. Which forecasting approach is usually more sensible?", "o": [["Exponential smoothing, which needs little data", "ARIMA needs more history to identify its orders reliably."], ["ARIMA, since it always beats simpler methods", "Complex models can overfit short, noisy series.", "Assuming complexity wins."], ["GARCH, since spikes mean the mean is changing", "GARCH models variance, not the level of sales.", "Mixing up targets."], ["Neither; no forecast is possible with 15 weeks", "Simple methods can still give useful forecasts.", "Overstating data needs."]]}, "M7 L6#6–7": {"q": "A dealer forecasts pickup-truck demand at 100 trucks. Why also forecast the variance?", "o": [["To know how far off it could be, e.g., for safety stock", "Variance tells how much the forecast might be higher or lower than the truth."], ["To make the 100-truck forecast more accurate on average", "Variance doesn't change the expected value.", "Confusing mean and variance."], ["To detect whether demand has shifted since last month", "That's change detection.", "Mixing up methods."], ["To remove the trend before forecasting the demand", "That's detrending.", "Mixing up methods."]]}, "M7 L6#8–11": {"q": "An investor compares two portfolios with the same expected return. GARCH forecasts much higher variance for one. What does that mean?", "o": [["It's riskier: more volatility for the same return", "Variance is a proxy for risk; the other portfolio is the better deal."], ["It's safer, since higher variance means more upside", "Higher variance means more risk.", "Reversing the idea."], ["It will earn more, since risk always brings more return", "Here the expected returns are the same.", "Ignoring the setup."], ["Nothing, since GARCH only forecasts prices, not risk", "GARCH forecasts variance.", "Mixing up targets."]]}, "M7 L6#12–13": {"q": "GARCH looks a lot like ARIMA. What are its two key differences?", "o": [["It uses variances and squared errors, with no differencing", "ARIMA uses observations, linear errors, and differences."], ["It uses differenced variances and linear, not squared, errors", "Both are reversed.", "Reversing both points."], ["It forecasts the mean, while ARIMA forecasts the variance", "Reversed.", "Swapping targets."], ["It needs no data, and works only on data with no trend", "Neither is true.", "Guessing."]]}, "M8 L1#3–6": {"q": "A political scientist regresses election results on economic factors to see which ones mattered. What kind of use is this?", "o": [["Descriptive: how does the system work?", "It explains the effect of economic factors on elections."], ["Predictive: which party will win next time?", "The goal is to explain, not forecast.", "Mixing up question types."], ["Prescriptive: which policy should be passed?", "No action is being chosen.", "Mixing up question types."], ["Change detection: did voter behavior shift?", "That's a different method.", "Mixing up methods."]]}, "M8 L1#7–11": {"q": "An insurer uses regression to estimate an applicant's remaining lifetime from age, health, and habits. What kind of use is this?", "o": [["Predictive: what will happen, from related factors", "It estimates what will happen for a new applicant."], ["Descriptive: how the system of lifetimes works", "The goal is a forecast for a new applicant.", "Mixing up question types."], ["Prescriptive: which applicants to turn down", "It estimates a number; the decision comes later.", "Confusing prediction and decision."], ["Clustering: grouping applicants with no response", "There's a response (lifetime).", "Mixing up methods."]]}, "M8 L1#12–18": {"q": "You regress new car sales on the workforce participation rate. Which is the response and which is the predictor?", "o": [["Response: car sales. Predictor: participation rate", "You're explaining sales using participation."], ["Response: participation rate. Predictor: car sales", "Swapped.", "Mixing up response and predictor."], ["Both are predictors; the response is the intercept", "The intercept is a coefficient, not a column.", "Misreading the setup."], ["Both are responses; there's no predictor in the model", "Regression needs a predictor.", "Misreading the setup."]]}, "M8 L1#19–23": {"q": "A store-sales model shows a large positive residual for one store. What does that tell you?", "o": [["Actual sales were well above the model's prediction", "A residual is actual minus predicted."], ["The model predicted far more sales than actually occurred", "That would be a large negative residual.", "Reversing the residual sign."], ["The store's predictor values are unusually large", "Residuals are about the response, not the inputs.", "Confusing residual with leverage."], ["The store's sales were far above the average store's", "That's a deviation from the mean, not a residual.", "Confusing residual with deviation."]]}, "M8 L1#24": {"q": "Why does least squares square each error before summing, rather than just adding raw errors?", "o": [["So positive and negative errors can't cancel out", "Raw errors can sum to zero even for a bad line."], ["So outliers have less influence on the fitted line", "Squaring gives outliers more influence, not less.", "Reversing outlier sensitivity."], ["So the fitted line passes through every data point", "Least squares rarely hits every point.", "Expecting a perfect fit."], ["So that every coefficient comes out positive", "Coefficients can still be negative.", "Confusing errors with coefficients."]]}, "M8 L1#25–27": {"q": "How do software packages find ordinary least squares coefficients?", "o": [["Solve exactly where the error's slope is zero", "Squared error is a convex bowl, so setting derivatives to 0 gives the minimum."], ["Try many random lines and keep the best one found", "The solution is exact, not a random search.", "Thinking regression is trial and error."], ["Draw the line through the two most extreme points", "That ignores most of the data.", "Using a shortcut line."], ["Pick the slope that makes the most residuals zero", "It minimizes squared error, not zero counts.", "Misreading the objective."]]}, "M8 L1#28–29": {"q": "A model of monthly electric bill ($) on home size (sq ft) has a size coefficient of 0.08. What does 0.08 mean?", "o": [["Each extra sq ft adds about 8 cents to the monthly bill", "A coefficient is the response change per unit of the predictor."], ["Home size explains about 8% of the variation in bills", "That would be an R² statement.", "Confusing a coefficient with R²."], ["A 1% bigger home has about an 8% higher monthly bill", "That reading needs logs of both variables.", "Using a log-log reading."], ["There's an 8% chance size is unrelated to the bill", "That misreads it as a p-value.", "Confusing a coefficient with p-value."]]}, "M8 L2#3": {"q": "What is maximum likelihood estimation (MLE)?", "o": [["Picking parameters that make the data most probable", "Likelihood measures how probable the data is under a set of parameters."], ["Choosing the model with the most parameters available", "More parameters isn't the criterion.", "Misreading \"maximum.\""], ["Choosing parameters with the smallest p-values", "MLE isn't based on p-values.", "Confusing with p-values."], ["Choosing the model with the largest adjusted R²", "That's a different criterion.", "Confusing with R²."]]}, "M8 L2#4–6": {"q": "Under what assumption about the errors does maximum likelihood give the same line as least squares?", "o": [["Errors are normal with mean 0, independent, identical", "Then maximizing likelihood = minimizing squared error."], ["Errors are all positive and grow with the size of the predictor", "That's not the condition.", "Guessing."], ["Errors follow a trend over time and must be detrended first", "That's not the condition.", "Mixing up modules."], ["Any error distribution at all, since the two always match", "Only under normal i.i.d. errors.", "Overgeneralizing."]]}, "M8 L2#7": {"q": "Errors in a delivery-time model have heavy tails, with occasional huge delays. Is least squares still the maximum likelihood fit?", "o": [["No; the MLE would weight huge errors less heavily", "Least squares equals MLE only when errors are normal."], ["Yes; least squares is the MLE for any error shape", "The match requires normal errors.", "Overgeneralizing the equivalence."], ["Yes, as long as the sample is reasonably large", "Sample size doesn't change the error distribution.", "Thinking size fixes everything."], ["No; MLE can't be computed for non-normal errors", "MLE works for many error distributions.", "Over-narrowing MLE."]]}, "M8 L2#8": {"q": "Why is maximum likelihood considered more general than least squares?", "o": [["It can fit models under many error distributions", "You specify the distribution, and MLE follows from it."], ["It never needs any assumption about the errors", "MLE requires an assumed distribution.", "Thinking MLE is assumption-free."], ["It always gives a smaller sum of squared errors", "Least squares minimizes that by definition.", "Confusing the objectives."], ["It automatically picks which predictors to include", "MLE estimates parameters, not model structure.", "Confusing fitting with selection."]]}, "M8 L2#10–13": {"q": "AIC = 2k − 2 ln(L*). Why does it add 2k?", "o": [["To penalize extra parameters, balancing good fit and simplicity", "Without it, adding parameters would always look better (overfitting)."], ["To reward extra parameters, since they always improve the fit", "It penalizes them.", "Reversing the penalty."], ["To remove the outliers that lower the likelihood L*", "It doesn't touch the data.", "Mixing up ideas."], ["To scale the parameters so they're comparable in size", "That's not its role.", "Mixing up ideas."]]}, "M8 L2#14–18": {"q": "A regression has m predictors plus an intercept. What is k, the number of parameters, in its AIC?", "o": [["k = m + 1 (m coefficients plus a₀)", "AIC = 2(m + 1) − 2 ln(L*). Lecture convention; software often also counts the error variance (m + 2), which shifts every model equally."], ["k = m (only the coefficients on x)", "The intercept a₀ is also estimated.", "Forgetting the intercept."], ["k = n (the number of data points)", "k counts parameters, not data.", "Mixing up k and n."], ["k = 2 (slope and intercept only)", "That's only for one predictor.", "Assuming simple regression."]]}, "M8 L2#19": {"q": "You compute AIC for three candidate models on the same data. How do you use the values?", "o": [["Prefer the lowest; only the differences matter", "The absolute AIC value has no meaning on its own."], ["Prefer the highest, since it reflects the best fit", "Lower AIC is better.", "Reversing the direction."], ["Prefer the one closest to 0, whatever its sign", "AIC's scale depends on the data; zero isn't special.", "Treating AIC as absolute."], ["Reject any model whose AIC is above 100 outright", "There's no absolute AIC cutoff.", "Inventing a threshold."]]}, "M8 L2#20": {"q": "You're comparing models with 12 parameters on only 40 data points. Why use corrected AIC (AICc)?", "o": [["Plain AIC under-penalizes complexity in small samples", "AICc adds extra penalty when n is small relative to k."], ["Plain AIC can't be computed with fewer than 100 points", "AIC can be computed; it's just biased here.", "Inventing a limit."], ["AICc penalizes less, so more predictors can be kept", "AICc penalizes more, not less.", "Reversing the correction."], ["AICc corrects for predictors correlated with each other", "It corrects for sample size, not collinearity.", "Mixing up issues."]]}, "M8 L2#21": {"q": "Model 2's AIC is higher than Model 1's. What happens to Model 2's relative likelihood, e^((AIC₁ − AIC₂)/2), as the gap grows?", "o": [["It shrinks quickly toward 0", "Each extra point of AIC gap cuts it by a constant factor."], ["It grows, favoring Model 2 more", "A higher AIC is worse.", "Reversing AIC."], ["It shrinks slowly, in a straight line", "It's exponential, not linear.", "Ignoring the exponential."], ["It stays at 50%", "It depends on the gap.", "Ignoring the formula."]]}, "M8 L2#22": {"q": "An analyst cares most about forecast accuracy, not the most compact model. Which criterion tends to lean that way?", "o": [["AIC, which penalizes extra parameters more lightly", "AIC tends to favor models that predict well; BIC favors sparser ones."], ["BIC, since a bigger penalty always forecasts better", "Too strong a penalty can drop useful predictors.", "Equating simplicity with accuracy."], ["Plain likelihood, since it has no penalty at all", "With no penalty, you risk overfitting.", "Ignoring overfitting."], ["Plain R², since only it reflects forecast accuracy", "R² on training data rises with any added predictor.", "Overtrusting training R²."]]}, "M8 L2#23": {"q": "Two customer-churn models have BIC values that differ by only 1. What's a reasonable conclusion?", "o": [["Evidence is weak; weigh simplicity and other checks", "Small BIC gaps give little reason to prefer either model."], ["The lower-BIC model is clearly and decisively better", "A gap of 1 is weak evidence.", "Overreading small gaps."], ["The higher-BIC model is better, since it fits data more", "Lower BIC is preferred.", "Reversing the direction."], ["Both models are overfit, so neither should be used", "A small gap says nothing about overfitting.", "Misreading the comparison."]]}, "M8 L3#4": {"q": "A retailer regresses weekly sales on price, promotion, and season to learn how much a promotion adds. What's the response, and what type of question is it?", "o": [["Weekly sales; descriptive", "It explains how the sales system works."], ["Promotion; descriptive", "Promotion is a predictor.", "Swapping response and predictor."], ["Weekly sales; predictive", "The goal is to explain, not forecast.", "Mixing up question types."], ["Price; prescriptive", "Price is a predictor, and nothing is decided.", "Mixing up both."]]}, "M8 L3#5–9": {"q": "A home-price model includes both square footage and number of bedrooms. The bedroom coefficient is negative. What's the most likely reason?", "o": [["At a fixed size, more bedrooms mean smaller rooms", "Each coefficient is the effect holding the other predictors fixed."], ["Homes with more bedrooms sell for less overall", "Overall, bigger homes with more bedrooms usually cost more.", "Ignoring \"holding others fixed.\""], ["The model must contain a data-coding error somewhere", "Negative signs can be legitimate here.", "Assuming an error."], ["Bedrooms have no relationship with price at all", "A negative coefficient is still a relationship.", "Misreading the sign."]]}, "M8 L3#10–13": {"q": "You estimate a 2-year-old's adult height from the parents' heights, the child's height at 2, and sex. What's the response, and what type of question is it?", "o": [["Adult height; predictive", "It forecasts a future outcome for a new child."], ["Height at age 2; predictive", "That's a predictor.", "Swapping response and predictor."], ["Adult height; descriptive", "The goal is a forecast.", "Mixing up question types."], ["Father's height; descriptive", "That's a predictor.", "Mixing up both."]]}, "M8 L3#14–17": {"q": "A model has x₁, x₂, and an x₁x₂ product term. Why isn't x₁'s coefficient alone the full effect of x₁?", "o": [["x₁'s effect also shifts with x₂ through the product term", "The effect of x₁ is a₁ + a₃x₂, which depends on x₂."], ["x₁'s coefficient is always zero in interaction models", "It's usually nonzero.", "Inventing a rule."], ["The product term makes the model nonlinear in coefficients", "It's still linear in the coefficients.", "Misunderstanding \"linear.\""], ["x₁'s effect is captured only by its p-value there", "p-values don't measure effect size.", "Confusing significance with effect."]]}, "M8 L4#2–3": {"q": "Towns with more hospitals have more deaths. Is this causation or correlation?", "o": [["Correlation: big towns have more of both", "Correlation = happen together; causation = one causes the other."], ["Causation: hospitals cause more deaths", "An outside factor (population) drives both.", "Treating correlation as cause."], ["Causation: deaths cause more hospitals", "Both follow from town size.", "Guessing a direction."], ["Neither, unless the p-value is below 0.05", "p-values don't decide causation.", "Confusing significance with cause."]]}, "M8 L4#4–10": {"q": "Average winter temperature strongly predicts hours spent outdoors (low p-value). Does temperature cause people to go outside?", "o": [["Probably: it makes sense, but regression can't prove it", "The direction is plausible, so causation is likely but unproven."], ["Yes, definitely: the low p-value proves the cause", "p-values show association, not cause.", "Treating a low p-value as proof."], ["No, definitely not: correlation is never real causation", "Correlation can reflect causation; it just doesn't prove it.", "Over-skepticism."], ["It's the reverse: more time outdoors warms the winter", "That direction makes no sense.", "Reversing the direction."]]}, "M8 L4#11–12": {"q": "Across towns, ice-cream sales and swimming accidents rise together. What's the most likely explanation?", "o": [["A third factor, hot weather, drives both", "An outside factor can create a correlation with no causation."], ["Eating ice cream causes swimming accidents", "There's no sensible mechanism.", "Treating correlation as cause."], ["Swimming accidents cause ice-cream sales", "There's no sensible mechanism.", "Guessing a direction."], ["It must be random, since the p-value is small", "A small p-value means it's unlikely to be random.", "Misreading p-values."]]}, "M8 L4#13": {"q": "Stores that renovated show higher sales. Which finding would most weaken the claim that renovation raised sales?", "o": [["Sales were already rising before the renovations", "Cause must come before effect; this suggests reverse causation."], ["The sales–renovation link has a very small p-value", "That supports an association, not undercuts it.", "Misreading p-values."], ["The regression's R² is only about 0.40", "Modest R² doesn't undercut a causal effect.", "Equating R² with causation."], ["Renovation costs varied widely across stores", "Cost variation doesn't address causation.", "Focusing on irrelevant detail."]]}, "M8 L4#14": {"q": "Cheese eaten per person and civil-engineering doctorates awarded move together closely over the years. What should you conclude?", "o": [["Probably a meaningless correlation; no sensible cause", "With enough variables, some will line up by chance."], ["Eating more cheese causes more doctorates to be awarded", "There's no sensible mechanism.", "Treating correlation as cause."], ["More doctorates cause people to eat more cheese", "There's no sensible mechanism.", "Guessing a direction."], ["Their close fit proves a hidden real relationship", "A close fit can still be random.", "Overtrusting correlation."]]}, "M8 L5#4–6": {"q": "Data plotted against a predictor dips, then rises in a U shape. A straight line fit
