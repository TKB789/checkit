, "title": "Comparison", "points": ["Forward selection, backward elimination and stepwise regression: good for initial analysis, but often don't perform as well on other data (they can fit random effects and look better than they are, e.g., higher R-squared).", "Stepwise is the most common of the first three.", "LASSO and elastic net: slower but better prediction. The professor recommends them except for introductory data exploration."], "key": "Greedy for quick exploration; LASSO/elastic net for the final model."}, {"p": "9\u201313", "title": "Regularized Regression", "points": ["Lasso (some coefficients forced to 0 to simplify model): minimize \u03a3\u1d62 (y\u1d62 \u2212 (a\u2080 + a\u2081x\u2081\u1d62 + \u2026 + a\u2c7cx\u2c7c\u1d62))\u00b2 subject to \u03a3|a\u2c7c| \u2264 T.", "Ridge (coefficients shrink toward 0 to reduce variance in estimate): same objective, subject to \u03a3a\u2c7c\u00b2 \u2264 T.", "Elastic net: same objective, subject to \u03bb\u03a3|a\u2c7c| + (1 \u2212 \u03bb)\u03a3a\u2c7c\u00b2 \u2264 T, i.e., the lasso term plus the ridge term.", "The professor notes shrinking adds some bias but reduces variance in the coefficient estimates."], "key": "Elastic net = lasso's absolute-value term + ridge's quadratic term."}, {"p": "14\u201315", "title": "Prediction Error", "points": ["Prediction error is a function of bias and variance.", "Chart vs. model complexity: bias\u00b2 falls, variance rises, and prediction error is U-shaped.", "So trading some bias for less variance can give better predictive models."], "key": "Accepting some bias can reduce total prediction error."}, {"p": "16\u201317", "title": "Elastic net", "points": ["Advantages: variable selection benefits of LASSO and predictive benefits of ridge regression.", "Disadvantages: arbitrarily rules out some correlated variables like LASSO; underestimates coefficients of very predictive variables like ridge regression.", "The professor's example: two highly correlated medical tests, one cheap and one costly; LASSO might keep the expensive one, so check correlations yourself."], "key": "Elastic net combines both methods' strengths and weaknesses."}, {"p": "18\u201321", "title": "Which one to use?", "points": ["No good rule of thumb for when to use each approach.", "Compare the differences: if you have time to try one, try several.", "Analytics is an art; human input is always beneficial."], "key": "Try multiple methods and apply judgment."}]}], "n": 11}, {"module": "m12", "title": "Design of experiments", "lectures": [{"lec": "M12 L1", "title": "Introduction to Design of Experiments", "intro": "When the full data set is hard to get, design of experiments (DOE) plans which data to collect; introduces comparison/control and blocking.", "topics": ["When full data is hard to get", "Representative survey samples", "Comparison and control", "Blocking factors", "Red vs. blue used cars"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: data is given, or can be easily collected.", "This lesson: the full data set is hard to get, so we use Design of Experiments (DOE). The professor describes it as designing a way to collect the best subset of data quickly and efficiently, sufficient to answer our questions."], "key": "DOE plans data collection when we can't get all the data."}, {"p": "4\u20136", "title": "Design of Experiments (DOE): banner ads", "points": ["Example: advertise Georgia Tech's Master of Science in Analytics degree.", "Two ads are designed (shown side by side); which is better, i.e., which gets more people to click?"], "key": "Choosing between designs is a DOE question."}, {"p": "7", "title": "Design of Experiments (DOE): online retailer", "points": ["Example: an online retailer's page showing \"related to items you've viewed\".", "Which similar or related products should it show? The professor adds: also which complementary products might lead to a larger purchase."], "key": "Retailers must decide which product mix to show customers."}, {"p": "8\u201314", "title": "Design of Experiments (DOE): surveys and more", "points": ["Surveys: surveying everyone is too expensive, so we need a representative sample.", "Many dimensions, not so many data points: the professor's poll example needs representative combinations of sex, age group and other factors while surveying only about 600 people.", "Other uses: comparing combinations of medical treatments, maximizing agricultural productivity, determining factors that lead to a startup company's success."], "key": "Small samples must still represent many combinations of factors."}, {"p": "15\u201318", "title": "Comparison and Control", "points": ["Question: do red used cars sell for higher prices than blue used cars? Compare the prices.", "Need to control other factors besides color, such as age and sports cars vs. family cars.", "The professor's example: comparing two-year-old red Porsches with 10-year-old blue family cars would confound color with age and car type."], "key": "Compare like with like by controlling for other factors."}, {"p": "19\u201320", "title": "Blocking", "points": ["A blocking factor is something that creates variation.", "Example: sports car vs. family car (sports cars are more likely to be red).", "The professor notes analyzing red sports cars and red family cars separately gives lower variance than analyzing all red cars together."], "key": "Accounting for blocking factors reduces variability in estimates."}, {"p": "21", "title": "Summary", "points": ["Future: specific methods of DOE and how they work."], "key": "Next: specific DOE methods."}]}, {"lec": "M12 L2", "title": "A/B Testing", "intro": "A/B testing chooses between two alternatives by randomly showing each, collecting data and running a hypothesis test, with conditions for when it works.", "topics": ["Two banner ad versions", "Click-through hypothesis test", "Conditions for valid A/B test", "Sample small relative to population"], "slides": [{"p": "2", "title": "Overview", "points": ["Previously: the need for design of experiments.", "This lesson: choosing the best out of several alternatives."], "key": "Starting with the simplest case: two alternatives."}, {"p": "3\u20135", "title": "A/B testing: banner ads", "points": ["Example: two different versions of a Georgia Tech banner ad (\"MS in Analytics\" vs. \"Master of Science in Analytics Degree\").", "How to decide which ad to show? The professor suggests randomly showing one or the other for, say, the first 2,000 displays and tracking clicks."], "key": "Collect data instead of arguing about which ad is better."}, {"p": "6\u20139", "title": "A/B testing: results", "points": ["Case 1: Ad A got 46 clicks in 1003 uses (5%); Ad B got 97 clicks in 997 uses (10%). Hypothesis test: B is significantly better.", "Case 2: Ad A 46/1003 (5%); Ad B 47/997 (5%). Hypothesis test: no significant difference.", "The professor notes this is essentially binomial data for each ad."], "key": "A simple hypothesis test tells whether one alternative is really better."}, {"p": "10\u201313", "title": "A/B testing: requirements", "points": ["Use to choose between two alternatives when: 1. data can be collected quickly;", "2. data is representative of the population the answer will be used on;", "3. the amount of data is small compared to the whole population (the professor's example: testing on 2,000 of only 2,500 expected views leaves little benefit)."], "key": "A/B testing needs fast, representative, relatively small samples."}, {"p": "14\u201315", "title": "Summary", "points": ["A/B testing tests which of two alternatives is better; a common approach in marketing.", "Future: what if there are several alternatives, and how to figure out the best one?"], "key": "Next: more alternatives and more factors."}]}, {"lec": "M12 L3", "title": "Factorial Designs", "intro": "Full and fractional factorial designs for measuring the impact of multiple factors, balanced designs, and using regression when factors are independent.", "topics": ["Full factorial design", "ANOVA for factor importance", "Fractional factorial design", "Balanced design", "Regression with independent factors"], "slides": [{"p": "2", "title": "Overview", "points": ["Previously: A/B testing to compare two alternatives, e.g., which banner ad generates more clicks.", "This lesson: compare the impact of multiple factors."], "key": "From which ad is better to why it's better."}, {"p": "3\u20135", "title": "Factorial design: full factorial", "points": ["The two ads differ in font, wording and background color.", "Full factorial design: test every combination, 2 fonts \u00d7 2 wordings \u00d7 2 backgrounds = 8 combinations; use ANOVA to determine the importance of each factor.", "What if there are many combinations? 7 factors with 3 choices each = 3\u2077 = 2187 combinations, often too many to test."], "key": "Testing every combination grows exponentially with factors."}, {"p": "6", "title": "Factorial design: fractional factorial", "points": ["Fractional factorial design: test a subset of combinations.", "Tables compare the 8-row full design (font \u00d7 MS in Analytics/Master of Science in Analytics \u00d7 White/Gold) with a 4-row fractional design.", "Balanced design: test each choice the same number of times (here twice) and each pair of choices the same number of times (here once)."], "key": "A balanced subset can still measure every factor's effect."}, {"p": "7", "title": "Independent Factors", "points": ["If factors are independent, test a subset of combinations and use regression to estimate effects, with a categorical variable per factor.", "Example: background color (gold, blue, white) and font size (10, 12, 14 point).", "Background color and font color are not independent (a white font on a white background fails), so interaction terms may be needed."], "key": "Regression works when factors don't interact much."}, {"p": "8", "title": "Summary", "points": ["Factorial design: use before collecting data, to determine effects of factors.", "Full factorial design tests all combinations; partial factorial design estimates all effects by comparing some combinations.", "The professor also mentions response surface methodology, which allows squared terms as well as linear ones."], "key": "Plan factorial tests before collecting data."}]}, {"lec": "M12 L4", "title": "Multi-Armed Bandits", "intro": "Testing many alternatives while balancing exploration (more information) against exploitation (immediate value), using the multi-armed bandit approach.", "topics": ["Exploration vs. exploitation", "Lost value from fixed testing", "One-armed bandit slot machine", "Updating probability each is best", "Bandit algorithm parameters"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: A/B testing two banner ad designs with a basic hypothesis test.", "This lesson: what if there are more alternatives?"], "key": "Extending testing to many alternatives."}, {"p": "4\u20137", "title": "Exploration vs. Exploitation", "points": ["Example with 10 alternatives: 10,000 tests (1,000 on each).", "Only the 1,000 tests on the best ad got maximum value; 9,000 tests lost value.", "Tradeoff: more information vs. immediate value, i.e., exploration vs. exploitation."], "key": "Every test on a worse option costs value."}, {"p": "8\u201311", "title": "Multi-Armed Bandit: the name", "points": ["A single slot machine is a one-armed bandit; the professor explains: one lever arm, and calibrated to give the player negative expected value.", "Several slot machines with unknown payouts: a multi-armed bandit. Finding the best requires testing them."], "key": "The name comes from choosing among slot machines."}, {"p": "12\u201317", "title": "Multi-Armed Bandit: the approach", "points": ["K alternatives; start with no information, so each has equal probability of being selected.", "Repeat: choose an alternative to test based on the probability of each being best; after testing, update the probabilities of each being best.", "Continue until the best alternative is clear. The professor notes this keeps exploring while making better options more likely (exploiting)."], "key": "Shift tests toward likely winners as evidence accumulates."}, {"p": "18\u201321", "title": "Parameters in the iteration", "points": ["Number of tests between recalculating probabilities.", "How to update the probabilities (the professor mentions Bayesian updates or estimating from observed distributions).", "How to pick an alternative to test, based on probabilities and/or expected values."], "key": "Several design choices control how the bandit behaves."}, {"p": "22\u201324", "title": "Summary", "points": ["There's no simple rule for the best parameter choices.", "Better than running a fixed, large number of tests; worthwhile because it learns faster on the fly and creates more value."], "key": "Bandits learn while earning."}]}], "n": 12}, {"module": "m13", "title": "Probability-based models and simulation", "lectures": [{"lec": "M13 L1", "title": "Introduction to Advanced Probability Distributions", "intro": "Why simple probability-distribution models are sometimes all you need, illustrated by predicting when season ticket holders won't show up.", "topics": ["Simple models can beat complex ones", "Season ticket seat upgrades", "Factors for no-show prediction", "Arrival time relative to crowd"], "slides": [{"p": "2", "title": "Overview", "points": ["This lesson: probability distributions and what they can tell us. The professor calls them a very underappreciated analytics tool."], "key": "Probability distributions can give insight on their own."}, {"p": "3\u20136", "title": "Simple Modeling", "points": ["Sometimes simple approaches work better.", "The professor's consulting examples: security lane flow at the Atlanta airport (after September 11), whether a season ticket holder will show up for a sporting event, staffing and promotions at a fast-food chain, etc."], "key": "Try a simple model before a big-data model."}, {"p": "7\u201311", "title": "Example: season ticket holder no-shows", "points": ["Predict when a season ticket holder might not show up for a game.", "Goal: improve fan experience and increase profit. Idea: upgrade fans at the game to unused season ticket seats.", "At what point should the seat upgrade be sold? Benefit of selling earlier: the upgraded customer is happier. Drawback: what if the ticket holder shows up?"], "key": "Selling upgrades earlier is worth more but riskier."}, {"p": "12\u201313", "title": "Example: the question", "points": ["Determine the earliest time they should sell the seat upgrade.", "Pause and think about factors to include in a predictive model."], "key": "Viewers are asked to brainstorm predictive factors."}, {"p": "14\u201319", "title": "Example: possible factors", "points": ["Season ticket holder factors: age, marital status, children, career, past arrival data.", "Team factors: how well the team is playing, standings, star players.", "Game factors: opponent, special milestones, giveaways, special significance of the game. Day factors: day of week, holiday, season, weather, traffic.", "Lots of data!"], "key": "A full predictive model would need a huge amount of data."}, {"p": "20\u201321", "title": "Example: simple distribution analysis", "points": ["Do a simple probability-distribution analysis first: arrival time before the game, relative to everyone else.", "Example: season ticket holder X tends to arrive after about 60% of others arrive, and this didn't depend much on other factors. The professor adds the deviation was modeled well by a normal distribution.", "Conclusion: use a simple probability distribution, tracking how the stadium fills, to help answer the company's question."], "key": "A simple distribution answered the question without the extra data."}, {"p": "22", "title": "Summary", "points": ["Sometimes a simple model is all you need.", "Probability distributions can form the backbone of such simple models."], "key": "Don't skip the simple probability model."}]}, {"lec": "M13 L2", "title": "Bernoulli, Binomial and Geometric Distributions", "intro": "What the Bernoulli, binomial and geometric distributions are good at modeling, and how to use the geometric distribution to test whether trials are i.i.d.", "topics": ["Bernoulli coin flip", "Charity donation consistency", "Binomial converges to normal", "Trials until first success", "Testing i.i.d. with geometric fit", "Airport screening example"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: matching data to a probability distribution.", "This lesson: specific distributions (binomial, geometric), focusing on modeling and use rather than formulas to memorize."], "key": "Focus on what each distribution models."}, {"p": "4", "title": "Bernoulli Distribution", "points": ["Like flipping a coin, but it might not be 50/50.", "Probability mass function: P(X = 1) = p, P(X = 0) = 1 \u2212 p.", "Useful when we start doing multiple \"coin flips\"."], "key": "Bernoulli models a single yes/no event."}, {"p": "5\u20136", "title": "Example: charity donations", "points": ["A charity asks 1/12 of its mailing list for donations each month.", "For each person, P(sends donation) = p and P(does not send donation) = 1 \u2212 p.", "Assumptions: donations are the same size, and p does not change month to month. The number of donations each month is then binomially distributed.", "The professor notes the charity can test whether p changed by checking how likely the observed count is under the binomial."], "key": "Summing Bernoulli trials gives a binomial count."}, {"p": "7\u20139", "title": "Binomial Distribution", "points": ["Probability of getting x successes out of n independent identically distributed Bernoulli(p) trials.", "PMF: P(X = x) = (n choose x) p\u02e3(1 \u2212 p)\u207f\u207b\u02e3 = [n!/((n \u2212 x)! x!)] p\u02e3(1 \u2212 p)\u207f\u207b\u02e3, with a plot of the probabilities f(x).", "For large n, the binomial converges to the normal distribution (handy since huge factorials get messy)."], "key": "Binomial counts successes; for large n use the normal approximation."}, {"p": "10\u201313", "title": "Example: how many trials until\u2026", "points": ["How many interviews until the first job offer? Or how many job offers until someone accepts?", "How many hits until a baseball bat breaks? How many good units manufactured before a defective one?", "How many Bernoulli trials until\u2026 is the geometric distribution."], "key": "\"How many tries until\" questions are geometric."}, {"p": "14\u201315", "title": "Geometric Distribution", "points": ["PMF: P(X = x) = (1 \u2212 p)\u02e3 p, with a decreasing bar plot of f(x).", "Probability of having x Bernoulli(p) failures until the first success, or x Bernoulli(1 \u2212 p) successes until the first failure.", "The professor warns to think carefully about which outcome p refers to (it can be a good or a bad outcome)."], "key": "Define p as the probability of the outcome that ends the run."}, {"p": "16\u201319", "title": "Geometric Distribution: testing i.i.d.", "points": ["Assumes each Bernoulli trial is independent and identically distributed (i.i.d.).", "Can compare data to the geometric distribution to test whether i.i.d. is true.", "Example, hits until a baseball bat breaks: if it fits a geometric distribution, hits are i.i.d. Bernoulli trials; if it doesn't fit, hits are not i.i.d. and other factors need to be considered."], "key": "A geometric fit suggests independent, identical trials."}, {"p": "20\u201323", "title": "Geometric Distribution Example: airport screening", "points": ["Are security personnel more likely to pull someone aside if there hasn't been a search in a while?", "Plot the number of people passed through before each search. Left chart: data close to geometric, so each person is screened independently.", "Right chart: data not close to geometric, so recent history affects decision making."], "key": "Comparing to geometric reveals whether screeners act independently."}, {"p": "24", "title": "Summary", "points": ["Bernoulli: like flipping a coin. Binomial: count of successful flips in n trials.", "Geometric: unsuccessful flips before the first success."], "key": "Three distributions built from Bernoulli trials."}]}, {"lec": "M13 L3", "title": "Poisson, Exponential and Weibull Distributions", "intro": "The Poisson, exponential and Weibull distributions, what they model (arrivals, inter-arrival times, time to failure) and cautions about distribution-fitting software.", "topics": ["Poisson random arrivals", "Exponential inter-arrival times", "ATL security line data", "Weibull time to failure", "Weibull shape parameter k", "Distribution-fitting software caution"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: matching data to a probability distribution.", "This lesson: Poisson, exponential, Weibull, focusing on modeling and use."], "key": "Distributions for arrivals and failures."}, {"p": "4\u20137", "title": "Poisson Distribution", "points": ["Probability mass function f(x) = \u03bb\u02e3e^\u2212\u03bb / x!, with a plot of probabilities for x = 0 to 20.", "Good at modeling random arrivals; \u03bb = average number of arrivals per time period.", "Arrivals are independent and identically distributed (i.i.d.)."], "key": "Poisson counts i.i.d. random arrivals per period."}, {"p": "8\u20139", "title": "Exponential Distribution", "points": ["As printed, \"Probability Mass Function\": f(x) = \u03bbe^\u2212\u03bbx, with a decreasing density plot.", "Relation to Poisson: if arrivals are Poisson(\u03bb), time between successive arrivals is exponential(\u03bb). Poisson arrivals \u27fa exponential inter-arrival times.", "The professor notes the average inter-arrival time is 1/\u03bb."], "key": "Exponential inter-arrival times go with Poisson arrivals.", "watch": "The slide labels this a probability mass function; the exponential is continuous, so f(x) is a probability density function."}, {"p": "10\u201311", "title": "Example: security line delays at ATL", "points": ["After September 11, 2001, stricter U.S. airport rules caused long security delays at Atlanta's airport; Georgia Tech helped out.", "Collected inter-arrival times (easier than counting arrivals per period); they turned out to be exponentially distributed.", "So the arrival process was Poisson, which the professor says helped build the simulation model."], "key": "Measuring inter-arrival times revealed Poisson arrivals."}, {"p": "12\u201315", "title": "Weibull Distribution", "points": ["As printed, \"Probability Mass Function\" with scale parameter \u03bb and shape parameter k: f(x) = (k/\u03bb)(x/\u03bb)\u1d4f\u207b\u00b9e^\u2212(x/\u03bb)\u1d4f.", "Weibull: time between failures. Geometric: number of tries between failures.", "Lightbulb example: how many light-switch flips until the bulb fails? (geometric). Leave the bulb on; how long until it fails? (Weibull)"], "key": "Weibull models time to failure; geometric models tries to failure.", "watch": "The slide says probability mass function; Weibull is continuous, so this is a probability density function."}, {"p": "16\u201318", "title": "Weibull Distribution: shape parameter k", "points": ["k < 1: failure rate decreases with time, \"worst things fail first\" (e.g., parts with defects).", "k > 1: failure rate increases with time, \"things that wear out\" (e.g., tires).", "k = 1: failure rate is constant with time."], "key": "k tells whether failures become rarer, more common or stay constant."}, {"p": "19", "title": "Weibull Distribution: k = 1", "points": ["f\u2096(x) = (k/\u03bb)(x/\u03bb)\u1d4f\u207b\u00b9e^\u2212(x/\u03bb)\u1d4f. If k = 1, Weibull = exponential: f\u2081(x) = (1/\u03bb)e^\u2212(x/\u03bb).", "Replace \u03bb with 1/\u03bb to get the exponential distribution. The professor jokes the two notations were never coordinated."], "key": "The exponential is a special case of the Weibull."}, {"p": "20", "title": "Data fitting", "points": ["Software input: a set of data. Outputs: fits to various distributions and their parameters.", "Warning: only use software output as guidance. Example: software returns Weibull with k = 1.002; it might be better to use exponential (Weibull with k = 1).", "Remember data may have random noise in it; think about what the output means before using it."], "key": "Don't let fitting software overfit noise with extra parameters."}]}, {"lec": "M13 L4", "title": "Q-Q Plots", "intro": "Quantile-quantile plots for visually checking whether two data sets, or a data set and a probability distribution, have about the same distribution.", "topics": ["Plotting matching quantiles", "45-degree line comparison", "Mismatched tails", "Data vs. theoretical quantiles", "Why visualize instead of test"], "slides": [{"p": "2\u20134", "title": "Overview", "points": ["This lesson: visualizing whether two distributions are about the same, or whether a data set is distributed similarly to a probability distribution.", "Statistical tests can hide details, so visualization is sometimes important."], "key": "A plot can show what a single test statistic hides."}, {"p": "5\u20137", "title": "Q-Q Plot: building it", "points": ["Axes: sample 1 quantiles (horizontal, 0\u201370) and sample 2 quantiles (vertical, 0\u201360).", "The professor explains that similar distributions should have about the same value at each quantile, even with different numbers of data points.", "Plot each quantile pair, e.g., the 50th percentile (median) of sample 1 vs. that of sample 2, then the 25th percentile, and so on."], "key": "Each point pairs the same percentile from both data sets."}, {"p": "8\u20139", "title": "Q-Q Plot: good and poor matches", "points": ["If the data sets match, points fall on or near the 45-degree line.", "Comparison plot: in the poor match, sample 2 has higher values at both the low and high ends of the range.", "The professor notes the plot shows how they differ, which a test result alone wouldn't."], "key": "Distance from the 45-degree line shows where distributions differ."}, {"p": "10\u201311", "title": "Q-Q Plot: tails", "points": ["Points match well everywhere except the very ends of the upper and lower tails.", "The professor notes a statistical test might call this a good match, but if the project is about extreme values, the Q-Q plot shows it isn't."], "key": "Check the tails when extreme values matter."}, {"p": "12", "title": "Q-Q Plots: data vs. a distribution", "points": ["Test whether a single data set is a good fit to a probability distribution.", "Horizontal axis: the data. Vertical axis: theoretical values of the percentiles (calculated or simulated)."], "key": "Q-Q plots also compare data to a theoretical distribution."}, {"p": "13", "title": "Q-Q Plots: reading shapes", "points": ["Example plot: for lower quantiles sample 2 has larger values and for higher quantiles smaller values, so sample 2 is squashed toward the middle.", "The professor says understanding how to read plots matters more than memorizing shapes."], "key": "Read Q-Q plots by reasoning, not memorization."}]}, {"lec": "M13 L5", "title": "Queuing", "intro": "Using Poisson and exponential distributions to model queues, closed-form results for simple queues, the memoryless property and Kendall notation.", "topics": ["Telemarketing autodialer queue", "Arrival rate \u03bb and service rate \u03bc", "Single-server queue formulas", "Memoryless property", "Tire failure lawsuit example", "Kendall notation"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: probability distributions.", "This lesson: using distributions to model queues."], "key": "From fitting distributions to modeling system behavior."}, {"p": "4\u20139", "title": "Queuing Example: telemarketing", "points": ["An autodialer automatically calls phone numbers; if a call is answered, it is put into a queue (waiting line).", "How many employees should we have? Based on how many people answer the autodialer and how long calls last once an employee is on the phone.", "Diagram: calls arrive to the queue based on a distribution of time between arrivals; employees answer calls; calls finish based on a distribution of talking time."], "key": "Staffing depends on arrival and service distributions."}, {"p": "10\u201311", "title": "Queuing Example: simple case", "points": ["Poisson(\u03bb) call arrivals, a queue of calls to be handled, 1 employee, exponential(\u03bc) call times.", "Can calculate: expected fraction of time the employee is busy, expected waiting time before talking to the employee, expected number of calls waiting in queue, etc."], "key": "Poisson arrivals with exponential service give computable answers."}, {"p": "12", "title": "Queuing Example: formulas", "points": ["Arrival rate = \u03bb; service rate = \u03bc > \u03bb.", "Transition equations (\u2265 1 call in the queue): P(next event is an arrival) = \u03bb/(\u03bb + \u03bc); P(next event is a finished call) = \u03bc/(\u03bb + \u03bc).", "Expected fraction of time busy = \u03bb/\u03bc; expected waiting time = \u03bb/(\u03bc(\u03bc \u2212 \u03bb)); expected number of calls waiting in queue = \u03bb\u00b2/(\u03bc(\u03bc \u2212 \u03bb))."], "key": "Closed-form queue measures follow from \u03bb and \u03bc."}, {"p": "13", "title": "Queuing Example: more complex", "points": ["A more complex example: Poisson(\u03bb) arrivals, 2 employees, exponential(\u03bc) call times (the professor adds a limit of four calls in the system).", "Closed-form answers still exist, due to the memoryless property."], "key": "Memorylessness keeps more complex queues solvable."}, {"p": "14\u201316", "title": "Memoryless Property", "points": ["Exponential is memoryless: the distribution of remaining call time = the initial distribution of call time.", "Poisson is memoryless: the distribution of time to next arrival = the initial distribution; Poisson inter-arrival times are exponentially distributed.", "Data fits exponential \u27f9 memoryless; not memoryless \u27f9 not exponential."], "key": "Fitting an exponential tells you the process has no memory."}, {"p": "17\u201318", "title": "Memoryless Property: law firm example", "points": ["Should a tire manufacturer pay damages for an accident when a tire with 10,000 miles failed? Probability(tire fails at 10,000 miles) = ?", "Tires are more likely to fail the more worn out they are, so tire failure is not memoryless and can't be modeled with the exponential.", "Maybe try Weibull with k > 1."], "key": "Wear-out processes need a Weibull, not an exponential."}, {"p": "19\u201324", "title": "Queuing Models: parameters", "points": ["Potential parameters: general arrival distribution [A], general service distribution [S], number of servers [c], size of the queue [K], population size [N], queuing discipline [D].", "Kendall notation describes these (e.g., \"M/M/1 queue\").", "The professor mentions extensions outside Kendall notation, like hanging up after waiting too long or balking at a long line, which make the math hard."], "key": "Kendall notation summarizes a queue's structure."}, {"p": "25", "title": "Summary", "points": ["Queuing models and the memoryless property.", "Future: simulation."], "key": "When queue math gets too hard, simulate."}]}, {"lec": "M13 L6", "title": "Simulation Basics", "intro": "Types of simulation, why discrete-event stochastic simulation is valuable for variable systems, simulation software elements, replications and validation.", "topics": ["Deterministic vs. stochastic simulation", "Continuous-time vs. discrete-event", "Wafer machine queue example", "Entities, modules, resources", "Replications", "Validating against real data"], "slides": [{"p": "2", "title": "Overview", "points": ["Simulation: build a model to watch its behavior.", "Examples: manufacturing processes, airport security lines, freight train dispatching, etc."], "key": "Simulation lets us study a system by running a model of it."}, {"p": "3\u20134", "title": "Types of Simulations: randomness", "points": ["Deterministic simulations: same inputs give the same outputs (no randomness).", "Stochastic simulations: used when the system has randomness; the focus of this lesson."], "key": "Stochastic simulations model randomness."}, {"p": "5\u20136", "title": "Types of Simulations: time", "points": ["Continuous-time simulations: changes happen continuously (e.g., chemical processes, propagation of diseases), often modeled with differential equations.", "Discrete-event simulations: changes happen at discrete time points, e.g., call center simulations when someone calls or a worker finishes talking to someone. The focus of this lesson."], "key": "Discrete-event simulation updates only when events happen."}, {"p": "7\u20139", "title": "Simulation: why use it", "points": ["Discrete-event stochastic simulations are valuable when systems have high variability; using average values isn't good enough.", "Example: a machine in a manufacturing process. The professor's numbers: wafers arrive every 20 seconds and take 19 seconds on average, so with no variability there's never a delay.", "Animation (Arena software) with Poisson arrivals and exponential processing: a large queue sometimes builds, about 19 wafers waiting on average."], "key": "Variability creates queues that averages hide."}, {"p": "10\u201313", "title": "Simulation: examples", "points": ["Airport baggage simulation (two concourses with gates): decide how many baggage tugs are needed and where.", "Cancer treatment clinic: building layout and staff, to find the right mix of workers and resources like exam rooms.", "Airline global flight network: help react to disruptions; the screen also shows the software's modeling elements."], "key": "Simulation handles complex real systems."}, {"p": "14", "title": "Simulation software", "points": ["Elements of a model include entities (things that move through the simulation, e.g., bags, people), modules (parts of a process, e.g., queues, storage), actions, resources (e.g., workers), decision points and statistical tracking.", "Often a \"drag and drop\" programming style.", "Under the hood: (pseudo) random number generation, tracking, animation, etc. The professor notes pseudo-random numbers matter if you code a simulation yourself."], "key": "Software assembles models from standard building blocks."}, {"p": "15", "title": "Replications", "points": ["Replications = number of runs of the simulation. One replication is one data point and may be unrepresentative.", "Run multiple times to get a distribution of outcomes.", "Example: a histogram of simulated average daily throughput across replications (bins from 150\u2013200 to 350\u2013400)."], "key": "Run many replications and look at the distribution."}, {"p": "16", "title": "Simulation Validation", "points": ["Use real data to validate that the simulation gives reasonable results.", "If real and simulated averages don't match, there's a problem; if averages match but variances don't, there's still a problem.", "Histograms compare simulated vs. actual throughput."], "key": "Validate both the mean and the spread against reality."}, {"p": "17", "title": "Summary", "points": ["This lesson: simulation basics.", "Future: simulations for prescriptive analytics."], "key": "Next: using simulation to make decisions."}]}, {"lec": "M13 L7", "title": "Prescriptive Simulation", "intro": "Using a validated simulation to answer what-if questions and compare alternatives, with care about randomness and input quality.", "topics": ["What-if questions with simulation", "Baggage tugs per gate", "Common random numbers", "Garbage in, garbage out", "Call center worker variability"], "slides": [{"p": "2", "title": "Overview", "points": ["Previously: simulation basics.", "This lesson: simulation for analysis."], "key": "Using simulations to decide what to do."}, {"p": "3\u20139", "title": "Simulation: asking \"what if?\"", "points": ["Simulation is useful for asking \"what if?\" questions.", "Examples: simulated change in throughput from investing in faster machines (the professor mentions $100,000), the value of hiring an extra call-center worker, where to station baggage tugs, etc.", "Compare simulation results across options; some simulation software can also do heuristic optimization of parameters (e.g., buffer sizes)."], "key": "Run the simulation under each option and compare."}, {"p": "10\u201313", "title": "Simulation Comparisons", "points": ["Example, baggage system: how many tugs at each gate? Simulation 1: one tug per gate. Simulation 2: one tug per two gates.", "Compare metrics, e.g., the fraction of bags that get to baggage claim in 20 minutes or less.", "Be careful: one set of \"random\" observations could be better than another. Avoid this by using the same random numbers in both, so each replication is a paired scenario."], "key": "Use common random numbers for fair comparisons."}, {"p": "14\u201315", "title": "Simulation Comparisons: caveat", "points": ["Simulation can be a powerful tool, but the model is only as good as the quality of its input; missing or incorrect information may lead to incorrect answers.", "Example: a call center simulation assumed workers answer calls equally quickly, but there was lots of variability between workers. The wrong assumption can lead to costly bad decisions."], "key": "Bad assumptions in, bad decisions out."}, {"p": "16", "title": "Summary", "points": ["Simulation as an analytics tool.", "Interested in learning more? Check out the Georgia Tech simulation course."], "key": "Simulation is a key prescriptive tool."}]}, {"lec": "M13 L7a", "title": "Example: The Difficulty of Validating a Simulation", "intro": "A disease-spread research example showing why validating a simulation can be hard and how simulating the data collection process solved it.", "topics": ["Validating systems that don't exist", "Two interacting diseases", "Multiple validation metrics", "Contact-tracing sampling bias", "Simulating data collection"], "slides": [{"p": "2\u20134", "title": "Validation Can Be Hard", "points": ["Easier to validate: a simulation of something that exists, by comparing performance metrics of simulation vs. reality.", "Harder to validate: a simulation of something that doesn't exist (e.g., a redesigned baggage system)."], "key": "Without a real system to compare, validation is harder."}, {"p": "5", "title": "Validation Example", "points": ["Spread of two interacting diseases (from the professor's PhD student's research).", "Matching disease prevalence doesn't work: multiple models match after D simulated days but give very different results after D + 7 days.", "At least one is wrong, but which? If we can't tell which model is right, we can't tell what's a good public health policy."], "key": "Matching one metric can't distinguish between models."}, {"p": "6\u20137", "title": "Deeper Validation", "points": ["Multiple measures of disease spread: overall prevalence, distribution of disease cluster size, largest disease cluster size, other structural metrics.", "Need matches in all metrics to show validation.", "Problem: the metrics didn't match up, even though medical parameters were up to date."], "key": "Validate on several metrics, not just one."}, {"p": "8\u201313", "title": "Answer: Simulated Data Collection!", "points": ["In the whole simulated population, 12 out of 41 = 29% have the disease.", "Real data came from contact tracing: start with a volunteer with the disease and check their contacts, and so on. The sample grows as 1 out of 1 = 100%, 4 out of 6 = 66.7%, 7 out of 12 = 58.3%, 7 out of 14 = 50% have the disease.", "So the collected data overestimates prevalence (and cluster size) compared with the true 29%."], "key": "The real data was biased by how it was collected."}, {"p": "14\u201316", "title": "Solution", "points": ["Simulation 1: simulate disease propagation.", "Simulation 2: given the simulated propagation, simulate data collection.", "The professor notes the results then matched in all metrics, and this was the only model tested that did."], "key": "Simulate the measurement process too, then compare to real data."}]}, {"lec": "M13 L8", "title": "Markov Chains", "intro": "Markov chain models based on system states and transition probabilities, steady-state probabilities, the memoryless assumption, and applications like web page ranking.", "topics": ["Transition matrix", "Weather states example", "Steady-state probabilities", "Memoryless assumption limits", "PageRank-style web ranking"], "slides": [{"p": "2", "title": "Overview", "points": ["This lesson: the Markov chain model, based on states of a system."], "key": "Markov chains model movement between states."}, {"p": "3\u20135", "title": "Markov Chains: transition matrix", "points": ["For each state i, p\u1d62\u2c7c = transition probability from state i to state j; P = {p\u1d62\u2c7c} is the transition matrix.", "Weather example (rows = today, columns = tomorrow: Sunny, Cloudy, Rainy): Sunny .75, .15, .10; Cloudy .20, .40, .40; Rainy .40, .30, .30."], "key": "The transition matrix holds all one-step probabilities."}, {"p": "6\u20139", "title": "Markov Chains: multi-step probabilities", "points": ["Question: long-run probability of rainy days?", "Given \u03c0 = (.5, .25, .25) = probabilities of (Sunny, Cloudy, Rainy) today, \u03c0P = (.525, .25, .225) gives tomorrow's probabilities.", "(\u03c0P)P = (.53375, .24625, .22) gives the day after tomorrow."], "key": "Multiply by P once per step forward."}, {"p": "10\u201314", "title": "Markov Chains: steady state", "points": ["Could calculate (((\u03c0P)P)P)P\u2026 = \u03c0P^\u221e, but instead use the \"steady state\".", "In steady state, applying P gives the vector back: \u03c0*P = \u03c0*. Solve \u03c0*P = \u03c0* with \u03a3\u1d62\u03c0*\u1d62 = 1.", "It might not always exist: there can't be cyclic behavior, and every state must be reachable from all others."], "key": "Steady-state probabilities solve \u03c0*P = \u03c0*."}, {"p": "15", "title": "Markov Chains \u2013 Key Assumption", "points": ["Memoryless: state transitions only depend on the most recent state (tomorrow's weather depends only on today's).", "Most systems do not exhibit this property, so why learn about Markov chains?"], "key": "Memorylessness is the main limitation."}, {"p": "16\u201320", "title": "Markov Chains: web search example", "points": ["States are the web pages on a topic (Pages A\u2013E in the diagram).", "For pages i, j: p\u1d62\u2c7c = p if page i links to page j, 0 if not. The Markov chain is jumping randomly from page to page.", "Use the steady-state probabilities to rank web pages: Google PageRank (sort of)."], "key": "Steady-state visit frequency can rank pages."}, {"p": "21", "title": "Markov Chains: other applications", "points": ["The professor's research: ranking college basketball teams (LRMC).", "Urban sprawl, population dynamics, disease propagation: not memoryless in the short run, but that doesn't matter for long-run system dynamics."], "key": "Useful for long-run analysis even when short-run memory exists."}, {"p": "22", "title": "Summary", "points": ["Markov chain modeling is not so common; its limitation is the assumption that the system is memoryless.", "Powerful in some cases."], "key": "A niche but powerful tool."}]}], "n": 13}, {"module": "m14", "title": "Missing data", "n": 14, "lectures": [{"lec": "M14 L1", "title": "Introduction to Missing Data", "intro": "Models usually assume every data value is available. This lecture shows how often data goes missing in practice and why the pattern of what's missing matters as much as how much is missing.", "topics": ["Where missing data comes from", "Missing vs wrong data", "Some factors are missing more often", "Bias: some values are missing more often", "Censored data (date of death)"], "slides": [{"p": "2\u20134", "title": "Overview", "points": ["Previously: analytics models built on data, assuming we know all of it. In regression, for example, every x_ij (factor j of data point i) is assumed to be there.", "This lesson: what if some of the data is missing?", "The transcript's point: data sets can easily hold billions of values, so it would be surprising if none were missing."], "key": "Real data sets almost always have some missing values.", "watch": "Big data sets don't avoid the problem; more values means more chances for some to be missing."}, {"p": "5\u20137", "title": "Missing data: where it comes from", "points": ["National temperature study (thousands of locations, hourly readings): gauges break down, and readings are lost until they're replaced.", "Biometric study with a wireless device sending readings every 10 seconds: transmission sometimes breaks up.", "Human interaction: people fill in forms incorrectly or skip fields (sometimes on purpose, e.g. leaving out a phone number), don't know parts of their medical history, and data can be unavailable because of something upstream (e.g. a data set bought from another company)."], "key": "Machines, transmission and people all cause missing values.", "watch": "Some data is left out on purpose, which is one reason missing values can follow a pattern."}, {"p": "8", "title": "Data problems", "points": ["Two kinds of problem: missing data and wrong data (a mistyped number, a garbled transmission, a value in the wrong field).", "Wrong data that is far from the rest is an outlier, covered in its own lesson (Module 5).", "There are often patterns in missing or wrong data."], "key": "Missing and wrong data are both common, and both can have patterns.", "watch": "This module is about missing values; very wrong values are handled as outliers."}, {"p": "9\u201313", "title": "Patterns in missing data", "points": ["Some data is more likely to be missing than other data.", "Transplanted livers: the recipient's sex is easy to record and is in standard records; whether they had headaches the week before must be asked and is often not recorded. One factor having more missing values than another is manageable.", "Income: people with higher incomes are more likely to leave the income question blank.", "Radar gun: more reliable at normal speeds; a very slow car may be treated as an anomaly and not recorded.", "Bias in the missing data: when certain values are more likely to be missing, the data you do have is not a fair sample.", "The transcript adds a related case: in heart transplant survival data, 'date of death' is missing for everyone still alive, so the missing values are mostly the successful transplants (censored data)."], "key": "The harder problem is when certain values (not just certain factors) are more likely to be missing.", "watch": "'This factor has more missing values' (fine) is different from 'high values of this factor are more likely to be missing' (biased)."}, {"p": "14", "title": "Summary", "points": ["Next: how to deal with missing data."], "key": "The next two lessons give the methods."}]}, {"lec": "M14 L2", "title": "Methods that Don't Require Imputation", "intro": "Three options exist when a data point has missing values: throw it away, mark it with a categorical variable, or estimate the value. This lecture covers the first two, which avoid guessing what the missing value is.", "topics": ["Three options for missing data", "Throwing away data points", "Adding a 'missing' category", "Zero plus a missing indicator for numeric factors", "Interaction terms split the model in two"], "slides": [{"p": "2\u20134", "title": "Overview: three ways to deal with missing data", "points": ["Previously: data can be incomplete, with missing values.", "Three options: throw the data point away, use a categorical variable to indicate that data is missing, or estimate the missing value (imputation).", "The car table shows 7 cars with Color, Style, Miles and Price; car 2's Style and car 5's Miles are 'missing'.", "This lesson: ways of dealing with missing data without estimating it."], "key": "Discard, flag, or estimate: this lesson covers discard and flag.", "watch": "Estimating missing values is imputation, which is the next lesson."}, {"p": "5\u20139", "title": "Throw away", "points": ["Pros: it doesn't introduce errors from bad estimates, and it's easy to implement.", "Cons: you may lose too many data points, and the missing data may be censored or biased.", "Example: living transplant recipients. Patients with no date of death are more likely to be successful transplants, so dropping them makes the model too pessimistic about survival.", "Example: consumer purchasing. If high-income people don't report income, dropping them gives a model that predicts low and middle earners well but is poorly trained for high earners.", "Check the pattern of missing data before throwing points away."], "key": "Throwing away is easy and adds no estimation error, but can shrink and bias the data.", "watch": "Dropping censored points (patients still alive) biases survival estimates downward."}, {"p": "10\u201312", "title": "Categorical variable has missing data: add a 'missing' category", "points": ["If the factor with missing data is categorical, add one more category, 'missing'.", "Example: Employed (full, part, un-) becomes (full, part, un-, missing); the person with no answer gets 'missing'."], "key": "For a categorical factor, 'missing' is just another category.", "watch": "This keeps the data point and doesn't guess which category it belongs to."}, {"p": "13\u201315", "title": "Quantitative variable has missing data: zero plus an indicator", "points": ["If the factor is quantitative (e.g. height, number of children), set all missing values to 0 and add a new categorical variable saying whether the value is missing.", "Table: ID, Height, # kids; persons 4 and 6 have no height. They get Height = 0 and Missing? = Yes; everyone else gets Missing? = No."], "key": "Missing numeric value \u2192 0 plus a yes/no 'missing' flag.", "watch": "The 0 isn't an estimate of height; the flag tells the model those rows are different."}, {"p": "16\u201322", "title": "Missing data could be biased: include interactions", "points": ["Missing data could be biased: here, the data points with missing height are more likely to have more kids (persons 4 and 6 have 4 and 5 kids).", "Then the other variables' coefficients can be pulled one way or another to account for the missing points.", "Fix: include interaction terms between the missing indicator and the other variables. The table adds a '#kids,missing' column that equals # kids when height is present and 0 when it's missing.", "With interactions between the indicator and every other variable, each variable effectively appears twice (e.g. # kids when height is missing, # kids when it isn't).", "That splits the data into two models: 'Height data' (persons 1, 2, 3, 5) and 'No height data' (persons 4, 6). The transcript calls it a tree with a single branch."], "key": "Interacting the missing flag with every other variable gives two separate models: one for rows with the value, one without.", "watch": "The '#kids,missing' column holds # kids for rows where height is NOT missing (0 for missing rows), despite its name."}, {"p": "23\u201324", "title": "Summary", "points": ["Two ways of dealing with missing data: remove the points, or add categorical variables.", "Both avoid estimating what the missing data may be.", "Next: imputation."], "key": "Removing and flagging both avoid guessing the missing value."}]}, {"lec": "M14 L3", "title": "Imputation Methods", "intro": "Imputation estimates the missing values. This lecture compares three approaches that trade off simplicity and realism, then gives a limit on how much to impute and how to think about the extra error.", "topics": ["Mean, median or mode imputation", "Regression imputation", "Adding perturbation", "No more than 5% per factor", "Layers of error"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: missing data exists, and there are ways to deal with it without estimating the missing values.", "This lesson: imputation, which means estimating the missing values."], "key": "Imputation = estimating missing values."}, {"p": "4\u20137", "title": "First approach: midrange value", "points": ["Use the mean or median (numeric data) or the mode (categorical data) for every missing value of that factor.", "Advantages: it hedges against being too wrong, and it's easy to compute.", "Disadvantage: biased imputation. Example: people with high incomes are less likely to answer the survey, so the mean or median of the answers will underestimate the missing values.", "Table: incomes 18,000, 27,000, 45,000 and 84,000 answered; 64,000, 120,000 and 340,000 did not. The answered mean is 43,500 and the median 36,000, below every non-answer."], "key": "Mean/median/mode imputation is simple but biased when certain values are more likely to be missing.", "watch": "Mode is for categorical factors; mean or median for numeric ones."}, {"p": "8\u201310", "title": "Second approach: regression", "points": ["Build a model that predicts the missing factor from the other factors. Aim: reduce or eliminate the bias problem.", "Income example: predict income from factors such as zip code, profession and number of cars owned (table from Fast food server, $15,000, 0 cars, up to Dentist, $403,000, 4 cars).", "Disadvantages: complex (build, fit, validate and test a whole model just to estimate missing values), and it doesn't capture all the variability.", "The transcript adds: the data gets used twice (once to impute, once to fit the main model), so you could overfit. It usually gives better values than the mean."], "key": "Regression imputation is less biased but more work, and it gives every similar point the same value.", "watch": "'Regression' here means any predictive model of the missing factor; the transcript says 'a predictive model like regression'."}, {"p": "11\u201313", "title": "Imputation with variability (perturbation)", "points": ["Imputation doesn't capture all the variability, even with a regression model (e.g. doctors in one zip code with three cars have a wide range of incomes but get the same estimate).", "Impute with added variability: add a perturbation (a random amount up or down) to each imputed value, e.g. normally distributed variation based on the predictive model's error.", "Less accurate on average, but more accurate variability.", "The figure is a line from 'No perturbation' (more accurate on average, less accurate variability) to 'Perturbation distributed according to actual variability' (less accurate on average, more accurate variability)."], "key": "Perturbation trades accuracy of each value for a realistic spread of values.", "watch": "Perturbation makes each imputed value less accurate on average; it doesn't improve accuracy."}, {"p": "14\u201319", "title": "Imputation approaches: limits and errors", "points": ["Data used twice (overfitting risk), so limit the amount of imputation you do.", "Rule of thumb: no more than 5% per factor. Beyond that, the transcript suggests an alternative such as indicator (categorical) variables for missing data.", "Question: doesn't imputation add errors? Yes: imputation error + perturbation error + model error.", "Yes\u2026 but regular data also probably has errors (mis-read instruments, typos, badly calibrated sensors), and those are already part of any model's reported error.", "The transcript: there's no perfect way to add up these errors; evaluating the whole model on a test set is about as close as we can get."], "key": "Impute at most about 5% of each factor, and remember all data has some error.", "watch": "The 5% limit is per factor, not 5% of all data values overall."}, {"p": "20", "title": "Summary", "points": ["Data is always imperfect: errors, outliers, missing data."], "key": "Imperfect data is normal; handle it deliberately."}]}]}, {"module": "m15", "title": "Optimization", "n": 15, "lectures": [{"lec": "M15 L1", "title": "Introduction to Optimization", "intro": "Optimization sits underneath most of the models in the course and is also the main tool for prescriptive analytics: deciding what to do. This lecture gives examples and explains why it's harder to use than other models.", "topics": ["Optimization inside other models", "Prescriptive analytics", "Real optimization examples", "Software solves but doesn't build", "Adoption studies"], "slides": [{"p": "2\u20134", "title": "Where optimization fits", "points": ["Many statistical and machine learning models (classification, clustering, regression, variable selection, time series) use optimization to find their answers, so it underlies descriptive and predictive analytics.", "It's also the key tool for prescriptive analytics: given what I know and predict, what's the best action?"], "key": "Optimization is inside most models and is the main prescriptive tool.", "watch": "Prescriptive = what should we do; predictive = what will happen; descriptive = what happened."}, {"p": "5\u201312", "title": "Optimization for prescriptive analytics: examples", "points": ["Airplane mechanic scheduling (meet maintenance needs at lowest cost within federal rules and union contracts, allowing for breakdowns).", "Crude oil shipment planning (tanker vs pipeline, field to refinery), server farm allocation (which web pages and how many copies), machine shop production sequencing (throughput, deadlines, failed inspections), GPS routing for cars.", "The professor's own work: army recruiting asset usage, professional sports draft priority, worldwide oil tanker delivery routing and scheduling, electricity generation accounting for weather effects on pollution."], "key": "Optimization answers 'what's the best plan' across scheduling, shipping, routing and allocation."}, {"p": "13\u201314", "title": "Provides direction for an organization", "points": ["Diagram: descriptive analytics \u2192 predictive analytics \u2192 optimization (prescriptive analytics), which feeds decision making.", "Optimization sits on top of descriptive and predictive analytics and directs an organization at strategic, operational and tactical levels."], "key": "Prescriptive analytics builds on descriptive and predictive analytics to drive decisions."}, {"p": "15\u201316", "title": "Software: solving vs building", "points": ["Regression, classification, etc.: software automates both building the model and solving it.", "Optimization: software automates solving, but model building is up to you. It takes practice (the professor points to GT's optimization elective)."], "key": "Optimization solvers are good; building the model needs human expertise.", "watch": "The hard part is formulating the model, not running the solver."}, {"p": "17\u201320", "title": "Three studies", "points": ["2013 (Gartner): only 3% of companies used prescriptive analytics. The professor's reasons: they needed better data and descriptive/predictive analytics first, and people trained to build optimization models.", "2016 (Gartner): predicted 35% by 2020.", "2021 (Gurobi): 85% (of Fortune 500 companies, per the transcript) use prescriptive analytics / optimization."], "key": "Optimization use grew from rare to widespread; trained modelers are still scarce."}]}, {"lec": "M15 L2", "title": "Elements of Optimization Models", "intro": "Every optimization model has three parts: variables, constraints and an objective function. A political campaign schedule is the running example, followed by what 'feasible' and 'optimal' mean.", "topics": ["Variables (decisions)", "Constraints (restrictions)", "Linking constraints", "Objective function", "Inputs from other models", "Feasible and optimal solutions"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: optimization is a key piece of other models and a tool for prescriptive questions; there's good software for solving models, but building them needs human insight and expertise.", "This lesson: the three key pieces of an optimization model."], "key": "Three pieces: variables, constraints, objective."}, {"p": "4\u201311", "title": "Variables: decisions to be made", "points": ["Variables are the decisions the solver picks the best values for.", "Political candidate scheduling: x\u1d62 = total time spent in state i; y\u1d62 = number of visits to state i; z\u1d62 = 1 if state i is ever visited, 0 if not; w\u1d62d = time spent in state i on day d; v\u1d62d = 1 if state i is visited on day d, 0 if not."], "key": "Variables are the decisions; some are amounts, some are yes/no (binary).", "eq": ["x\u1d62 = total time in state i", "z\u1d62 = 1 if state i is ever visited, 0 if not", "v\u1d62d = 1 if state i visited on day d, 0 if not"]}, {"p": "12\u201318", "title": "Constraints: restrictions on variable values", "points": ["30 days left in the campaign: \u03a3\u1d62 x\u1d62 \u2264 30.", "At least 3 Florida visits in days 24\u201330: \u03a3_{d=24}^{30} v_Florida,d \u2265 3.", "Total visits must add up correctly: \u03a3_d v\u1d62d = y\u1d62. The solver only sees the math, not the English meaning of the variables, so variables must be linked by constraints or it could set y\u1d62 = 12 with every v\u1d62d = 0."], "key": "Constraints restrict the decisions; linking constraints make related variables agree.", "watch": "The slide defines v\u1d62d as 1/0 (visited that day or not), while the transcript calls it 'the number of visits on day d'. With the binary definition, \u03a3_d v\u1d62d counts the days visited.", "eq": ["\u03a3\u1d62 x\u1d62 \u2264 30", "\u03a3_{d=24}^{30} v_Florida,d \u2265 3", "\u03a3_d v\u1d62d = y\u1d62"]}, {"p": "19\u201320", "title": "Objective function: solution quality measure", "points": ["The objective is what we maximize or minimize; here, expected new votes.", "The slide's example: \u03a3\u1d62 (\u03b1p\u1d62 \u221a(x\u1d62 + \u2153 \u03a3_{j\u2208N(i)} x\u2c7c) + \u03b2 v\u1d62d f_d): population times the square root of time in the state plus a third of time in neighboring states, plus a term for each day's visits weighted by a day factor (too early or too late dilutes the effect).", "\u03b1, \u03b2, the square-root form and the day factors are 'determined by other analytics models!' (e.g. regression). Optimization often takes other models' outputs as inputs."], "key": "The objective scores a solution; its parameters often come from other models.", "eq": ["Maximize \u03a3\u1d62 (\u03b1p\u1d62 \u221a(x\u1d62 + \u2153 \u03a3_{j\u2208N(i)} x\u2c7c) + \u03b2 v\u1d62d f_d)"], "watch": "As printed, the \u03b2 term has no sum over days; the transcript's meaning ('visits each day times the factor for the day') implies \u03b2 \u03a3_d v\u1d62d f_d."}, {"p": "21\u201326", "title": "Solutions: feasible and optimal", "points": ["Solution: a value for each variable.", "Feasible solution: variable values that satisfy all constraints.", "Optimal solution: the feasible solution with the best objective value. Optimal = best.", "'More optimal' and 'most optimal' don't make sense (like 'more best'); a pet peeve of the professor's."], "key": "Feasible = meets every constraint; optimal = best feasible.", "watch": "A solution can be feasible without being optimal, but an optimal solution must be feasible."}, {"p": "27", "title": "Summary", "points": ["Variables (decisions), constraints (restrictions), objective function (quality measure); the output is an optimal solution. Specifying the model is as much art as science."], "key": "Three parts in, optimal solution out."}]}, {"lec": "M15 L3", "title": "Modeling is an Art: Two Examples", "intro": "Two classic models: the Army's diet problem, where intuition leads to the right model, and call-center scheduling, where the obvious variables make the key rule nearly impossible to write.", "topics": ["Diet problem", "Nutrient constraints and non-negativity", "Minimize cost", "Call center scheduling", "Choosing the right variables"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: basics of optimization, questions it answers, and the three parts of a model.", "This lesson: examples of simple models and some difficulties in building them."], "key": "Two examples show how variable choice makes or breaks a model."}, {"p": "4\u201317", "title": "Example 1: the diet problem (US Army)", "points": ["Goal: satisfy soldiers' nutritional requirements at minimum cost (1930s\u201340s).", "Data: n foods, m nutrients; a\u1d62\u2c7c = amount of nutrient j per unit of food i; m\u2c7c and M\u2c7c = minimum and maximum daily intake of nutrient j; c\u1d62 = per-unit cost of food i.", "Variables: x\u1d62 = amount of food i in the daily diet.", "Constraints: \u03a3\u1d62 a\u1d62\u2c7cx\u1d62 \u2265 m\u2c7c and \u03a3\u1d62 a\u1d62\u2c7cx\u1d62 \u2264 M\u2c7c for each nutrient j. a\u1d62\u2c7cx\u1d62 is the amount of nutrient j obtained from food i; the sum is the total from all foods.", "The often-overlooked constraint: x\u1d62 \u2265 0 for each food i (no negative food).", "Objective: minimize \u03a3\u1d62 c\u1d62x\u1d62, the total daily cost."], "key": "Diet model: amounts of each food, nutrient bounds, non-negativity, minimize cost.", "watch": "Don't forget non-negativity; the solver would happily 'eat' negative amounts of an expensive food to cut cost.", "eq": ["\u03a3\u1d62 a\u1d62\u2c7cx\u1d62 \u2265 m\u2c7c for each nutrient j", "\u03a3\u1d62 a\u1d62\u2c7cx\u1d62 \u2264 M\u2c7c for each nutrient j", "x\u1d62 \u2265 0 for each food i", "Minimize \u03a3\u1d62 c\u1d62x\u1d62"]}, {"p": "18\u201321", "title": "Other complexities", "points": ["Variety in diets, seasonal cost variation (plums are cheaper in summer), taste of foods and of combinations (peanut butter with jelly), etc.", "These can be added later; the basic model is what the Army started with."], "key": "Start simple, then add realism."}, {"p": "22\u201328", "title": "Example 2: call center scheduling, the intuitive model", "points": ["Meet forecasted demand d\u1d62 for each day of the week i (e.g. d_Tuesday = 247); workers work 5 days in a row, then 2 days off (union contract); minimize worker-days used.", "Intuitive variables: x\u1d62 = number of people working on day i.", "Objective: minimize x_Sunday + x_Monday + \u2026 + x_Saturday. Constraints: x\u1d62 \u2265 d\u1d62 for all days; x\u1d62 integer."], "key": "The obvious variables make the objective and demand easy\u2026", "eq": ["Minimize x_Sun + x_Mon + \u2026 + x_Sat", "x\u1d62 \u2265 d\u1d62, x\u1d62 integer"]}, {"p": "29\u201334", "title": "Choosing better variables", "points": ["With 'people working on day i', the 5-days-in-a-row rule is very hard to write (p28: '5-day requirement: ???').", "Better variables: x\u1d62 = number of people who START working on day i (e.g. x_Sunday work Sunday\u2013Thursday, off Friday and Saturday).", "Objective: minimize 5(x_Sunday + x_Monday + \u2026 + x_Saturday), since each person works 5 days.", "Meet demand: sum of x\u2c7c over everyone working on day i \u2265 d\u1d62. Example: x_Fri + x_Sat + x_Sun + x_Mon + x_Tue \u2265 d_Tue.", "Non-negativity x\u1d62 \u2265 0 and integrality x\u1d62 integer. The 5-day rule is built into the variable definition, so it needs no constraint."], "key": "Define variables so the hard rule is automatic: count people by start day.", "watch": "Tuesday's workers are those who started Fri, Sat, Sun, Mon or Tue (not Wed or Thu).", "eq": ["Minimize 5(x_Sun + x_Mon + \u2026 + x_Sat)", "x_Fri + x_Sat + x_Sun + x_Mon + x_Tue \u2265 d_Tue", "x\u1d62 \u2265 0, x\u1d62 integer"]}]}, {"lec": "M15 L4", "title": "Modeling with Binary Variables", "intro": "Binary (0/1) variables let a model include fixed charges, either/or choices, same-or-opposite decisions and if-then rules. The running example extends Markowitz's stock investment model.", "topics": ["Markowitz return\u2013risk model", "Fixed charges", "Linking constraints", "Minimum investment", "Choose / same / opposite decisions", "If-then constraints"], "slides": [{"p": "2", "title": "Overview", "points": ["Previously: optimization answers prescriptive questions with variables, constraints and an objective.", "This lesson: binary variables allow more complex models."], "key": "Binary variables add yes/no logic."}, {"p": "3", "title": "Stock market investment (Markowitz)", "points": ["Invest to balance return and risk. Data: budget B, n stocks, r\u1d62 = expected return of stock i relative to the market, Q\u1d62\u2c7c = covariance of returns of stocks i and j.", "Variables: x\u1d62 = amount invested in stock i. Constraints: \u03a3\u1d62 x\u1d62 \u2264 B; x\u1d62 \u2265 0 (no short selling).", "Objective: maximize \u03a3\u1d62 r\u1d62x\u1d62 \u2212 \u03b8 \u03a3\u1d62\u03a3\u2c7c Q\u1d62\u2c7cx\u1d62x\u2c7c (expected return minus \u03b8 times risk). Varying \u03b8 trades return against risk. This work helped Harry Markowitz win the Nobel Prize in economics."], "key": "Markowitz: maximize return minus \u03b8 \u00d7 variance, within budget.", "watch": "Larger \u03b8 penalizes risk more, giving more conservative portfolios.", "eq": ["\u03a3\u1d62 x\u1d62 \u2264 B, x\u1d62 \u2265 0", "Maximize \u03a3\u1d62 r\u1d62x\u1d62 \u2212 \u03b8 \u03a3\u1d62\u03a3\u2c7c Q\u1d62\u2c7cx\u1d62x\u2c7c"]}, {"p": "4", "title": "Transaction fees: a fixed charge", "points": ["Add y\u1d62 = 1 if we invest in stock i, 0 if not.", "Subtract \u03a3\u1d62 t y\u1d62 from the objective: a fixed charge t per stock bought, whatever the amount. It could be t\u1d62 if fees vary by stock, and it can be weighted as a one-time expense."], "key": "Fixed charge = cost \u00d7 binary 'do it' variable.", "eq": ["Maximize \u03a3\u1d62 r\u1d62x\u1d62 \u2212 \u03b8 \u03a3\u1d62\u03a3\u2c7c Q\u1d62\u2c7cx\u1d62x\u2c7c \u2212 \u03a3\u1d62 t y\u1d62"]}, {"p": "5", "title": "Linking constraints", "points": ["x\u1d62 \u2264 B y\u1d62 for all stocks i.", "y\u1d62 = 0 means x\u1d62 \u2264 0, and with x\u1d62 \u2265 0 that forces x\u1d62 = 0. y\u1d62 = 1 means x\u1d62 \u2264 B (no real limit).", "Without this, the solver could invest while setting y\u1d62 = 0 to dodge the fee."], "key": "Link amount and yes/no: x \u2264 B\u00b7y.", "eq": ["x\u1d62 \u2264 B y\u1d62"]}, {"p": "6", "title": "Minimum investment in each stock", "points": ["m\u1d62 = minimum dollar amount for stock i (you can't buy $0.03 of a stock priced in the hundreds).", "x\u1d62 \u2265 m\u1d62 y\u1d62: if y\u1d62 = 0, x\u1d62 \u2265 0 (and linking forces 0); if y\u1d62 = 1, x\u1d62 \u2265 m\u1d62."], "key": "x \u2265 m\u00b7y gives 'either nothing or at least m'.", "eq": ["x\u1d62 \u2265 m\u1d62 y\u1d62"]}, {"p": "7", "title": "Personal constraints", "points": ["Invest in Tesla: y_Tesla = 1.", "Invest in Amazon, Google or Apple (at least one): y_Amazon + y_Google + y_Apple \u2265 1. Exactly one: = 1.", "Both or neither of FedEx and UPS: y_FedEx = y_UPS.", "Exactly one of Coca-Cola and PepsiCo: y_Coca-Cola = 1 \u2212 y_PepsiCo."], "key": "Sums of binaries choose among options; equalities force same or opposite decisions.", "watch": "'\u2265 1' is at least one; '= 1' is exactly one.", "eq": ["y_Amazon + y_Google + y_Apple \u2265 1", "y_FedEx = y_UPS", "y_Coca-Cola = 1 \u2212 y_PepsiCo"]}, {"p": "8\u20139", "title": "If-then: if any energy stock, then at least 5", "points": ["Option 1: for each energy stock i, \u03a3_{j\u2208energy} y\u2c7c \u2265 5 y\u1d62. Investing in any energy stock triggers its constraint.", "Option 2: new binary z_Energy = 1 if we invest in energy, 0 if not. Then \u03a3_{j\u2208energy} y\u2c7c \u2265 5 z_Energy, and z_Energy \u2265 y\u1d62 for every energy stock i (so z must be 1 if any is bought)."], "key": "If-then rules: a binary on the right-hand side switches a constraint on.", "watch": "Option 2 needs both constraints; without z \u2265 y\u1d62 the solver would just set z = 0.", "eq": ["\u03a3_{j\u2208energy} y\u2c7c \u2265 5 y\u1d62 for all energy stocks i", "\u03a3_{j\u2208energy} y\u2c7c \u2265 5 z_Energy; z_Energy \u2265 y\u1d62"]}, {"p": "10\u201311", "title": "Integer variables in optimization: summary", "points": ["Fixed charges in the objective; constraints to choose among options; constraints requiring same/opposite decisions; if-then constraints.", "Optimization modeling is an art. The transcript adds: this is a big reason regression is more widely used than optimization; anyone can run a regression on a table of data, but building a correct optimization model takes expertise."], "key": "Four binary patterns: fixed charge, choose, same/opposite, if-then."}]}, {"lec": "M15 L4a", "title": "Discovering the Real Questions", "intro": "The call-center model from L3 looks finished, but in practice the request is vague: the real constraints and objective have to be discovered from stakeholders, inputs come from other models, and the model is refined in rounds of feedback.", "topics": ["The stated request vs the real problem", "Forecasting demand with regression", "Extra workers and wait-time probability", "Hidden constraints (no partial shifts)", "Iterate: build, check, repeat"], "slides": [{"p": "2\u20133", "title": "The textbook problem and model", "points": ["Earlier lessons turned a full English paragraph into a model, e.g. the call center: demand d\u1d62 each day, 5 days on then 2 off, minimize worker costs.", "Model: x\u1d62 = people who start on day i; minimize 5(x_Sun + \u2026 + x_Sat); meet demand, non-negativity, integrality. In reality we're almost never given a paragraph like this."], "key": "This is the model as a textbook states it."}, {"p": "4\u20138", "title": "Discovering the question", "points": ["The real request: 'Make call center schedules that don't conflict with the union contract and don't make us pay more than necessary.' It hints at the objective (minimize workers paid) and where the constraints are (the union contract).", "Analysts aren't expected to know the contract, so they get it from someone who does (the slides show a contract expert bringing it).", "The demand data isn't given either, and the supervisor doesn't know it."], "key": "Real requests are vague; the details have to be gathered."}, {"p": "9\u201313", "title": "How many workers each day?", "points": ["Daily demand d\u1d62 comes from a predictive model (e.g. regression: y = a\u2080 + a\u2081x\u2081 + \u2026 + a\u2098x\u2098).", "Extra workers for random variability come from a probability-based model, with a target like Prob(wait time > ??) < ??.", "How many extra depends on the setting: an emergency call center (medical, police, fire) needs both ?? low; a less important center can allow higher values. If unsure, ask the supervisor for a judgment call."], "key": "Inputs like demand and buffer come from forecasts and service-level choices.", "watch": "The 'extra workers' buffer depends on the business: emergency lines need far stricter wait-time targets."}, {"p": "14\u201320", "title": "Discovery is hard", "points": ["Discovery is hard: almost always, not every constraint gets mentioned. Not on purpose: there are too many to recall at once, and some seem too obvious to count as constraints.", "Example: told 'a five-day work week' but not that the 5 days must be in a row.", "Example: no partial shifts. Without that, the model could return 10.5 workers (10 full shifts plus one half shift)."], "key": "Experts leave out what seems obvious to them."}, {"p": "21", "title": "Repeat until done", "points": ["Present solutions as tentative to the supervisor (and the contract expert) and ask whether they make sense; if not, what needs adjusting.", "Add the newly learned constraint, re-optimize, and check again. It can take several rounds with several stakeholders."], "key": "Model building is iterative."}, {"p": "22\u201324", "title": "Where to find the objective and constraints", "points": ["The boss's request was still fairly helpful: it named the objective (minimize workers paid) and where to find the constraints (the union contract)."], "key": "The request itself hints at the objective and the constraint sources."}, {"p": "25\u201330", "title": "Vaguer requests, and discovering violations", "points": ["Some projects are vaguer still: 'Our worker schedule is all messed up. Can you see if you can fix that?' or 'I think we are spending too much.'", "Modeling can reveal that the employer is currently violating constraints. In one of the professor's projects, the company was accidentally violating US law; the goal shifted to minimizing the extra cost of full compliance. Optimization still slightly lowered operating costs while reaching full compliance, saving a very large fine."], "key": "Feedback refines the model; discovery can even uncover compliance problems."}, {"p": "31\u201332", "title": "Summary", "points": ["Need to discover the details: constraints, objective function, etc.", "(Maybe) build other models to determine inputs for optimization.", "Iterate between modeling, optimizing and getting feedback. The professor adds that the same discovery process matters in all analytics and data science, not just optimization."], "key": "Discover, model, optimize, get feedback, repeat."}]}, {"lec": "M15 L5", "title": "Optimization for Statistical Models", "intro": "Most models from earlier modules are fitted by solving an optimization problem. This lecture writes each one in variables\u2013constraints\u2013objective form, and warns that statistics and optimization use the word 'variable' in opposite ways.", "topics": ["Regression as optimization", "Statistics vs optimization terminology", "Lasso, ridge, elastic net", "Logistic regression and SVM", "Exponential smoothing, ARIMA, GARCH", "k-means"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: optimization models answer prescriptive questions; how to build them.", "This lesson: optimization in statistics."], "key": "Statistical models are optimization problems underneath."}, {"p": "4\u20136", "title": "Linear regression as an optimization model", "points": ["Given n data points with x\u1d62\u2c7c = jth factor of point i and y\u1d62 = response; find a\u2080, a\u2081 \u2026 a\u2098 to best fit the data (example plot: new car sales vs workforce participation rate).", "Variables: a\u2080, a\u2081 \u2026 a\u2098. Constraints: none. Objective: minimize \u03a3\u1d62 (y\u1d62 \u2212 (a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c))\u00b2."], "key": "Regression = choose coefficients to minimize squared error, no constraints.", "eq": ["Minimize \u03a3\u1d62\u208c\u2081\u207f (y\u1d62 \u2212 (a\u2080 + \u03a3\u2c7c\u208c\u2081\u1d50 a\u2c7cx\u1d62\u2c7c))\u00b2"]}, {"p": "7\u201312", "title": "Notation confusion: statistics vs optimization", "points": ["Statistical model y\u1d62 = a\u2080 + \u03a3\u2c7c a\u2c7cx\u1d62\u2c7c: the x\u1d62\u2c7c are variables (they vary across data points) and the a\u2c7c are constant coefficients.", "Optimization model for the same regression: the a\u2c7c are the variables (the solver picks them) and the x\u1d62\u2c7c are constant coefficients (fixed data).", "'That's how terminology developed\u2026 so get used to it.'"], "key": "Statistics: x's vary, a's are constants. Optimization: a's are the variables, x's are data.", "watch": "An exam stem about 'variables' in a regression fit as an optimization means the coefficients."}, {"p": "13\u201315", "title": "Other regression models", "points": ["Same variables and objective as linear regression, with one constraint added.", "Lasso: \u03a3\u2c7c|a\u2c7c| \u2264 \u03c4. Ridge: \u03a3\u2c7c a\u2c7c\u00b2 \u2264 \u03c4. Elastic net: \u03bb\u03a3\u2c7c|a\u2c7c| + (1 \u2212 \u03bb)\u03a3\u2c7c a\u2c7c\u00b2 \u2264 \u03c4."], "key": "Lasso, ridge and elastic net are regression plus one budget constraint.", "eq": ["\u03a3\u2c7c|a\u2c7c| \u2264 \u03c4", "\u03a3\u2c7c a\u2c7c\u00b2 \u2264 \u03c4", "\u03bb\u03a3\u2c7c|a\u2c7c| + (1 \u2212 \u03bb)\u03a3\u2c7c a\u2c7c\u00b2 \u2264 \u03c4"]}, {"p": "16", "title": "Logistic regression",
