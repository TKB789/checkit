s on a presidential election; impact of education on income; key factors in car purchasing; etc."], "key": "Regression explains how factors affect a response."}, {"p": "7\u201311", "title": "Regression", "points": ["Question type 2: what will happen in the future? (predictive)", "Examples: height of a child at adulthood; oil price 1.5 years from now; housing demand in the next months; remaining lifetime of an applicant; etc."], "key": "Regression also predicts future values."}, {"p": "12\u201318", "title": "Simple Linear Regression (SLR)", "points": ["SLR is linear regression with one predictor: look for a linear relationship between predictor and response.", "Scatter plot: new car sales (y, response) vs workforce participation rate (x\u2081, predictor).", "Regression equation: y = a\u2080 + a\u2081x\u2081.", "With m predictors: y = a\u2080 + a\u2081x\u2081 + a\u2082x\u2082 + \u2026 + a\u2098x\u2098 = a\u2080 + \u03a3\u2c7c\u208c\u2081\u1d50 a\u2c7cx\u2c7c."], "key": "Regression fits a linear equation of predictors to the response."}, {"p": "19\u201323", "title": "Simple Linear Regression (SLR)", "points": ["y\u1d62 = cars sold for data point i; \u0177\u1d62 = the model's prediction of cars sold.", "Prediction error for data point i: y\u1d62 \u2212 \u0177\u1d62 = y\u1d62 \u2212 (a\u2080 + a\u2081x\u1d62\u2081).", "Sum of squared errors: \u03a3\u1d62\u208c\u2081\u207f (y\u1d62 \u2212 \u0177\u1d62)\u00b2 = \u03a3\u1d62\u208c\u2081\u207f (y\u1d62 \u2212 (a\u2080 + a\u2081x\u1d62\u2081))\u00b2."], "key": "Model quality is measured by the sum of squared prediction errors."}, {"p": "24", "title": "Why sum of squared errors?", "points": ["The justification is given in the lesson on estimating model quality (maximum likelihood).", "Here it is simply taken as the fitting criterion."], "key": "Squared error is justified later."}, {"p": "25\u201327", "title": "Simple Linear Regression (SLR)", "points": ["The best-fit regression line minimizes the sum of squared errors and is defined by a\u2080 and a\u2081.", "Underlying math: minimize a convex quadratic function \u2014 set partial derivatives to zero and solve the simultaneous equations."], "key": "Least-squares coefficients come from setting derivatives to zero."}, {"p": "28\u201329", "title": "Simple Linear Regression (SLR)", "points": ["\"A picture is worth a thousand words\": a picture equals a block of \"blah blah\" text.", "Joke regression: y = 0 + 1000x\u2081 \u2014 words = 1000 \u00d7 pictures, with a question mark over whether that relationship holds."], "key": "A light illustration of what a coefficient means."}, {"p": "30", "title": "Summary", "points": ["This lesson: linear regression \u2014 what questions it answers and how it works.", "Future: more details about regression."], "key": "Regression basics covered."}]}, {"lec": "M8 L2", "title": "Maximum likelihood and information criteria", "intro": "Covers how to measure the quality of a model's fit: maximum likelihood (and why it reduces to least squares with normal errors), then AIC, corrected AIC and BIC for trading fit against simplicity.", "topics": ["Maximum likelihood estimation", "MLE equals least squares (normal errors)", "Akaike Information Criterion (AIC)", "Corrected AIC (AICc)", "Relative likelihood from AIC", "Bayesian Information Criterion (BIC)", "BIC rule-of-thumb thresholds"], "slides": [{"p": "2", "title": "Overview", "points": ["Previously: how statistical models can fit to a data set.", "This lesson: how to measure the quality of a model's fit."], "key": "Measuring fit quality."}, {"p": "3", "title": "Likelihood", "points": ["Likelihood measures the probability (density) of the data for any parameter set.", "Maximum likelihood: the parameters that give the highest probability."], "key": "MLE picks the parameters that make the observed data most probable."}, {"p": "4\u20136", "title": "Maximum Likelihood - Example", "points": ["Assume errors ~ N(0, \u03c3\u00b2), i.i.d.; observations z\u2081, \u2026, z\u2099; model estimates y\u2081, \u2026, y\u2099.", "The probability density of observing z\u1d62 if the true value is y\u1d62 is the normal density (1/(\u03c3\u221a2\u03c0)) e^(\u2212(z\u1d62 \u2212 y\u1d62)\u00b2/(2\u03c3\u00b2)).", "Page 6: the joint density over all n terms is the product of these individual densities."], "key": "With independent errors, likelihood = product of normal densities."}, {"p": "7", "title": "Maximum Likelihood - Example", "points": ["MLE: the set of parameters that minimizes the sum of squared errors.", "maximize (1/(\u03c3\u221a2\u03c0))\u207f e^(\u2212(1/(2\u03c3\u00b2)) \u03a3\u1d62\u208c\u2081\u207f (z\u1d62 \u2212 y\u1d62)\u00b2) \u2192 minimize \u03a3\u1d62\u208c\u2081\u207f (z\u1d62 \u2212 y\u1d62)\u00b2.", "A chart of e\u02e3 shows it is increasing, so maximizing e to a negative power means minimizing the sum in the exponent."], "key": "With normal i.i.d. errors, maximum likelihood = least squares."}, {"p": "8", "title": "Maximum Likelihood - Example", "points": ["For linear regression, minimize \u03a3\u1d62\u208c\u2081\u207f (z\u1d62 \u2212 y\u1d62)\u00b2 over the parameters a\u2080, \u2026, a\u2098.", "That is: minimize \u03a3\u1d62\u208c\u2081\u207f (z\u1d62 \u2212 (a\u2080 + \u03a3\u2c7c\u208c\u2081\u1d50 a\u2c7cx\u1d62\u2c7c))\u00b2."], "key": "This is exactly the regression fitting problem."}, {"p": "9", "title": "Maximum Likelihood Fitting", "points": ["Simple example: regression with independent normally distributed errors.", "It can get complex fast, with different estimation formulas and different assumptions about the error.", "Good statistical software can handle more complexity than simple regression."], "key": "Software handles MLE beyond the simple case."}, {"p": "10\u201313", "title": "Akaike Information Criterion (AIC)", "points": ["L*: maximum likelihood value; k: number of parameters being estimated.", "AIC = 2k \u2212 2ln(L*).", "The penalty term 2k balances likelihood with simplicity and helps avoid overfitting."], "key": "AIC rewards fit but penalizes extra parameters."}, {"p": "14\u201318", "title": "AIC - Example", "points": ["For regression with m predictors there are m + 1 parameters (a\u2080, \u2026, a\u2098), so k = m + 1.", "AIC = 2(m + 1) \u2212 2ln((1/(\u03c3\u221a2\u03c0))\u207f e^(\u2212(1/(2\u03c3\u00b2)) \u03a3\u1d62\u208c\u2081\u207f (z\u1d62 \u2212 (a\u2080 + \u03a3\u2c7c\u208c\u2081\u1d50 a\u2c7cx\u1d62\u2c7c))\u00b2)).", "Prefer models with smaller AIC."], "key": "Smaller AIC is better."}, {"p": "19", "title": "AIC", "points": ["Prefer models with smaller AIC.", "AIC has nice properties if there are infinitely many data points."], "key": "AIC's guarantees are asymptotic."}, {"p": "20", "title": "Corrected AIC (AICc)", "points": ["Use for smaller data sets.", "AICc = AIC + 2k(k + 1)/(n \u2212 k \u2212 1) = 2k \u2212 2ln(L*) + 2k(k + 1)/(n \u2212 k \u2212 1)."], "key": "AICc adds a small-sample correction to AIC.", "watch": "The correction grows as k approaches n and vanishes as n grows."}, {"p": "21", "title": "AICc - Example", "points": ["Model 1: AIC = 75; Model 2: AIC = 80.", "Relative likelihood: e^((AIC\u2081 \u2212 AIC\u2082)/2) = e^((75 \u2212 80)/2) \u2248 8.2%.", "Model 2 is 8.2% as likely as Model 1 to be better, so the first model is probably better."], "key": "An AIC gap converts to a relative likelihood via e^(\u0394AIC/2).", "watch": "Put the smaller AIC first so the exponent is negative; the result is how likely the higher-AIC model is to be better."}, {"p": "22", "title": "Bayesian Information Criterion (BIC)", "points": ["BIC = k ln(n) \u2212 2ln(L*), where n is the number of data points (vs AIC = 2k \u2212 2ln(L*)).", "Similar to AIC, but BIC's penalty term is larger than AIC's, so BIC encourages models with fewer parameters.", "Only use BIC when there are more data points than parameters."], "key": "BIC penalizes complexity more heavily than AIC."}, {"p": "23", "title": "BIC", "points": ["Rule of thumb on |BIC\u2081 \u2212 BIC\u2082|: > 10 \u2192 smaller-BIC model is \"very likely\" better; 6\u201310 \u2192 \"likely\" better.", "2\u20136 \u2192 \"somewhat likely\" better; 0\u20132 \u2192 \"slightly likely\" better."], "key": "Bigger BIC gaps mean stronger evidence."}, {"p": "24", "title": "Summary", "points": ["No hard-and-fast rule for using AIC, BIC or maximum likelihood.", "All three can give valuable information; looking at all three can help decide which model is best."], "key": "Use the criteria together, not as strict rules."}]}, {"lec": "M8 L3", "title": "Using regression", "intro": "Shows how to interpret regression coefficients through a descriptive example (runs a home run is worth in baseball) and a predictive example (a 2-year-old's adult height).", "topics": ["Interpreting regression coefficients", "Baseball runs-per-home-run example", "Adult height prediction example", "Descriptive vs predictive use"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: regression helps answer descriptive and predictive questions; visually, y = a\u2080 + a\u2081x\u2081 + \u2026 + a\u2098x\u2098.", "This lesson: interpreting regression coefficients."], "key": "Focus on what the coefficients mean."}, {"p": "4", "title": "Regression Coefficients", "points": ["Data table: each data point i (1\u2026n) has a response y\u1d62 and predictor values x\u1d62\u2081, x\u1d62\u2082, \u2026, x\u1d62\u2098.", "Use the data to produce coefficients (a\u2080, a\u2081, \u2026, a\u2098) for y = a\u2080 + a\u2081x\u2081 + \u2026 + a\u2098x\u2098."], "key": "Regression turns a data table into one coefficient per predictor."}, {"p": "5\u20139", "title": "Regression Coefficients", "points": ["Baseball example (descriptive question): the average number of runs a home run is worth.", "Response: how many runs a team scored that season. Predictors: number of home runs, triples, doubles, singles, outs, double plays, stolen bases, etc.", "Runs Scored = a\u2080 + a\u2081[Number of HR] + a\u2082[Number of Triples] + \u2026 + a\u2087[Number of Stolen Bases].", "If the fitted a\u2081 = 1.4, each home run is worth about 1.4 runs on average."], "key": "A coefficient = the response change per unit of that predictor."}, {"p": "10\u201313", "title": "Regression Coefficients", "points": ["Height example (predictive question): how tall will a given 2-year-old be as an adult?", "Response: a person's adult height. Predictors: father's height, mother's height, height at age 2, male or female.", "Adult Height = a\u2080 + a\u2081[Father's Height] + a\u2082[Mother's Height] + \u2026 + a\u2084[Male or Female]."], "key": "The same regression form serves prediction."}, {"p": "14\u201317", "title": "Regression Coefficients", "points": ["Illustration: father's height 6\u20323\u2033, mother's height 5\u20324\u2033, boy's height at age 2 of 2\u203211\u2033.", "Plug these into the fitted equation to predict his height at adulthood (shown as \"?\")."], "key": "Prediction = plug new predictor values into the fitted equation."}, {"p": "18\u201321", "title": "Summary", "points": ["Recaps the runs-scored and adult-height equations.", "Components of analytics: descriptive, predictive and prescriptive analytics.", "Future: random forests, transformations, trees and branching."], "key": "Regression covers descriptive and predictive analytics."}]}, {"lec": "M8 L4", "title": "Causation vs. correlation", "intro": "Distinguishes causation from correlation when interpreting regression output, using a winter-recreation example, a tiredness/scruffiness example, criteria for claiming causation, and spurious correlations.", "topics": ["Causation vs correlation", "Winter outdoor time vs temperature", "Hidden causal factor (kids)", "Criteria for claiming causation", "Spurious correlations"], "slides": [{"p": "2\u20133", "title": "Causation vs. Correlation", "points": ["Causation vs correlation is an important concept in interpreting output.", "Causation: one thing causes another thing.", "Correlation: two things tend to happen or not happen together \u2014 neither of them might cause the other."], "key": "Correlation does not imply causation."}, {"p": "4\u201310", "title": "Example - winter recreation", "points": ["y: hours/day spent outdoors in winter; x\u2081: the city's average daily winter temperature; model y = a\u2080 + a\u2081x\u2081.", "Correlation between y and x\u2081 shows as a low p-value of a\u2081; a scatter plot of average winter outdoor time vs average winter temperature slopes upward.", "Does higher winter temperature cause people to go outside? Kind of (probably).", "Reverse regression x\u2081 = b\u2080 + b\u2081y has the same correlation (p-value of b\u2081 = p-value of a\u2081), but saying time outdoors causes higher temperatures is pretty silly."], "key": "Regression is symmetric in correlation; causal direction must come from reasoning."}, {"p": "11\u201312", "title": "Example", "points": ["Tiredness vs scruffiness are correlated (chart), but neither one caused the other.", "The causal factor: kids."], "key": "A third factor can drive both variables."}, {"p": "13", "title": "How To Tell", "points": ["When is there causation? The cause is before the effect.", "The idea of causation makes sense (open to disagreement).", "No outside factors are causing the relationship (hard to guarantee).", "Be careful before claiming causation."], "key": "Claim causation only with timing, logic and no confounders."}, {"p": "14", "title": "Meaningless correlations", "points": ["From tylervigen.com/spurious-correlations: mozzarella cheese consumption vs civil engineering doctorates; divorce rate in Maine vs margarine consumption.", "Chart: length of the winning National Spelling Bee word vs number of people killed by venomous spiders, 1999\u20132009, correlation 80.57% (r = 0.8057)."], "key": "Strong correlations can be completely meaningless."}]}, {"lec": "M8 L5", "title": "Transformations and interactions", "intro": "Shows how linear regression can model nonlinear relationships by transforming predictors or the response (quadratic terms, logs, Box-Cox) and by adding interaction terms.", "topics": ["Quadratic regression", "Response transform log(y)", "Box-Cox transformations", "Variable interaction terms", "Generalized linear modeling"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: y = a\u2080 + a\u2081x\u2081 + \u2026 + a\u2098x\u2098 (e.g., new car sales vs workforce participation rate).", "This lesson: generalized models, interpreting the output, and what is important and what is not."], "key": "Extending the basic linear model."}, {"p": "4\u20136", "title": "Generalized Modeling", "points": ["Last time: y = a\u2080 + a\u2081x\u2081 + \u2026 + a\u2098x\u2098.", "Two charts of the same U-shaped data: a straight-line fit (left) misses the pattern badly, while a curved quadratic fit (right) follows it closely."], "key": "Some relationships aren't linear in the raw data."}, {"p": "7\u201312", "title": "Transforming the Data", "points": ["We could adjust the data so the fit is linear. Quadratic regression: y = a\u2080 + a\u2081x\u2081 + a\u2082x\u2081\u00b2.", "Something a bit more fun: y = a\u2080 + a\u2081x\u2081<sup>1.5<\/sup> + a\u2082x\u2081\u00b2x\u2083 + a\u2083sin(x\u2082).", "Response transform: log(y) = a\u2080 + a\u2081x\u2081 + \u2026 + a\u2098x\u2098; fun version 2: ln(y) = a\u2080 + a\u2081x\u2081\u00b2x\u2082x\u2083 + a\u2082log(x\u2083).", "Box-Cox transformations: can be automated."], "key": "Still \"linear\" regression: linear in the coefficients, not necessarily in the raw variables."}, {"p": "13\u201314", "title": "Transforming the Data", "points": ["Variable interaction example: estimating a 2-year-old's adult height.", "Possible influences: father's height (x\u2081), mother's height (x\u2082), and the product of the parents' heights (x\u2081x\u2082).", "y = a\u2080 + a\u2081x\u2081 + a\u2082x\u2082 + a\u2083(x\u2081x\u2082); treat x\u2081x\u2082 as a new input \"x\u2083\"."], "key": "An interaction is just a product of predictors used as a new predictor."}, {"p": "15", "title": "Summary", "points": ["Generalized modeling: transforming response or predictor variables, and variable interaction.", "Future: building more complicated regression models; software to find best-fit coefficients."], "key": "Transformations and interactions widen what regression can fit."}]}, {"lec": "M8 L6", "title": "Regression output", "intro": "Explains how to read regression output: p-values (and their pitfalls), confidence intervals, t-statistics, practical size of coefficients, and R-squared / adjusted R-squared.", "topics": ["Coefficient p-values", "p-value threshold 0.05", "Confidence interval and t-statistic", "Practical significance of coefficients", "R-squared and adjusted R-squared"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: how to fit and build regression models.", "This lesson: interpret the output from the model via helpful indicators."], "key": "Reading regression output."}, {"p": "4\u20136", "title": "P-Values", "points": ["The p-value estimates the probability that the coefficient = 0 (hypothesis testing).", "If p-value > 0.05, remove the corresponding attribute from the model.", "Other thresholds can be used: higher thresholds let more factors in (possibly irrelevant ones); lower thresholds let fewer in (possibly leaving out a relevant one)."], "key": "High p-value \u2192 attribute may not matter.", "watch": "Strictly, a p-value is the probability of seeing a coefficient this far from 0 if the true coefficient were 0; the slide's phrasing is a simplification."}, {"p": "7\u20138", "title": "P-Values", "points": ["Warning 1: with large amounts of data, p-values get small even when attributes are not at all related to the response.", "Warning 2: p-values are only probabilities even when meaningful \u2014 e.g., with 100 attributes each with p-value 0.02, each has a 2% chance of not being significant, so expect about 2 of them to be really irrelevant."], "key": "Don't trust small p-values blindly."}, {"p": "9\u201310", "title": "Confidence Interval (CI) and T-Statistic", "points": ["Confidence interval: where the coefficient probably lies, and how close that is to zero.", "T-statistic: the coefficient divided by its standard error; related to the p-value."], "key": "CI and t-stat give the same kind of evidence as the p-value."}, {"p": "11\u201312", "title": "Coefficient", "points": ["Look at the coefficient multiplied by the attribute value: it may make not much difference even with a very low p-value.", "Example: estimating household income with age as an attribute; a coefficient of 1 means the attribute isn't very important even with a very low p-value \u2014 it's unlikely to make even a $100 difference."], "key": "Statistical significance \u2260 practical importance."}, {"p": "13\u201315", "title": "R-squared Value", "points": ["R-squared: an estimate of how much variability the model accounts for.", "Example: R\u00b2 = 59% \u2192 the model accounts for about 59% of the variability; the remaining 41% is randomness or other factors.", "Adjusted R-squared adjusts for the number of attributes used."], "key": "R\u00b2 measures explained variability; adjusted R\u00b2 penalizes extra attributes."}, {"p": "16", "title": "Summary", "points": ["Some things aren't easily modelled \u2014 things that affect real-life systems, especially when humans are involved.", "In those settings, R-squared values of 0.4 or 0.3 can be quite good."], "key": "A \"good\" R\u00b2 depends on the context."}]}], "n": 8}, {"module": "m9", "title": "Advanced data preparation", "lectures": [{"lec": "M9 L1", "title": "Box-Cox transformations", "intro": "Explains why some models need normally distributed data, what heteroscedasticity (unequal variance) looks like, and how the Box-Cox transformation can fix it.", "topics": ["Normality assumption", "Heteroscedasticity (unequal variance)", "Box-Cox formula t(y) = (y^\u03bb \u2212 1)/\u03bb", "Q-Q plot to check normality"], "slides": [{"p": "2", "title": "Overview", "points": ["This lesson: transforming data before using it.", "The Box-Cox transformation."], "key": "Data preparation via transformation."}, {"p": "3\u20138", "title": "Normality assumption", "points": ["Some models assume data is normally distributed; results have bias when the assumption is wrong.", "Charts: height of American women in their 40s looks roughly normal; weight of the same women is not symmetric.", "Page 8 labels the issue heteroscedasticity \u2014 unequal variance."], "key": "Not all data is normal; variance can differ across the range."}, {"p": "9\u201310", "title": "Heteroscedasticity example", "points": ["Scatter plot of values (0\u2013100) over time (0\u2013100): an increasing trend whose spread grows over time.", "Early points are tightly clustered; later points are widely scattered \u2014 unequal variance."], "key": "Heteroscedasticity: variability changes with the level of the data."}, {"p": "11\u201314", "title": "Dealing with heteroscedasticity", "points": ["Box-Cox transformation is a logarithmic-type transformation: it stretches out the smaller range to enlarge its variability and shrinks the larger range to reduce its variability.", "t(y) = (y<sup>\u03bb<\/sup> \u2212 1)/\u03bb; with the right \u03bb, t(y) can become close to a normal distribution.", "Software can do it for you; first check whether you need the transformation (e.g., with a Q-Q plot)."], "key": "Box-Cox picks \u03bb to make the response close to normal with even variance."}, {"p": "15\u201320", "title": "Summary", "points": ["Box-Cox is named for George Box and David Cox (photos with Wikimedia credits).", "Box-Cox is useful for transforming a response to eliminate heteroscedasticity."], "key": "Use Box-Cox on the response to fix unequal variance."}]}, {"lec": "M9 L2", "title": "Detrending", "intro": "Explains what detrending time series data means, why it helps factor-based models, and the basic factor-by-factor regression method, using gold prices as an example.", "topics": ["Trend in time series data", "Why detrend for factor-based models", "Factor-by-factor linear detrending", "Gold price detrending example"], "slides": [{"p": "2", "title": "Overview", "points": ["This lesson: detrending data \u2014 what it means and when you'd want to do it.", "The basic method for detrending."], "key": "Removing trends from time series data."}, {"p": "3\u20136", "title": "Detrending Data", "points": ["Time series data can have a trend: an increase or decrease of data over time.", "Example: the price of gold over time, shown in a chart with a long-run upward trend."], "key": "Trends are systematic change over time."}, {"p": "7", "title": "Detrending", "points": ["Detrending may be needed for the response and for the predictors.", "It matters when using a factor-based model such as regression or SVM on time series data."], "key": "Detrend before factor-based modeling of time series."}, {"p": "8\u20139", "title": "How to Detrend", "points": ["Factor-by-factor: fit a one-dimensional regression y = a\u2080 + a\u2081x for each factor against time.", "Gold example: simple linear regression gives Price = \u221245,600 + 23.2 \u00d7 Year.", "De-trended price = Actual price \u2212 (\u221245,600 + 23.2 \u00d7 Year); the chart shows the de-trended series."], "key": "Subtract each factor's fitted linear trend."}, {"p": "10", "title": "Summary", "points": ["The detrending approach is simple and works well to remove trend effects in time series data.", "It is helpful in factor-based analysis."], "key": "Simple and effective for factor-based models."}]}, {"lec": "M9 L3", "title": "Intro to principal component analysis", "intro": "Motivates principal component analysis (PCA) for high-dimensional, correlated data with a stock-market example, and shows geometrically how PCA rotates data onto uncorrelated axes ranked by spread.", "topics": ["Stock-market predictors motivating example", "Many correlated predictors problem", "PCA removes correlations", "Ranking principal components by importance", "Rotating axes to directions of spread"], "slides": [{"p": "2", "title": "Overview", "points": ["This lesson: feature extraction using principal component analysis.", "For high-dimensional and correlated data."], "key": "PCA = feature extraction."}, {"p": "3\u20134", "title": "Motivational Example", "points": ["With a model with a lot of factors: which of them are the most important?", "Example: does past performance of particular stocks indicate how the overall market will perform the next day?", "Data: 6000+ securities; focus on days without major external events (wars, terrorist attacks, election results, natural disasters, etc.)."], "key": "Thousands of predictors raise the question of which matter."}, {"p": "5\u20137", "title": "Motivational Example - potential issues", "points": ["6000+ predictors require many years of daily data, but the underlying situation may have changed with time \u2014 can we reduce the amount of data needed?", "High correlation between some predictors: companies in the same sector tend to move together.", "Address both issues via Principal Component Analysis (PCA)."], "key": "Too many predictors and correlated predictors \u2192 PCA."}, {"p": "8\u20139", "title": "Principal component analysis (PCA)", "points": ["PCA transforms data: it removes correlations within the data and ranks coordinates by importance.", "Concentrate on the first n principal components to reduce the effect of randomness.", "Earlier principal components are likely to have a higher signal-to-noise ratio."], "key": "Keep the top components; drop the noisy rest."}, {"p": "10\u201315", "title": "PCA", "points": ["Scatter plot of correlated 2-D data (axes 0\u20133.6) forming an elongated diagonal cloud.", "New axes are drawn along the cloud: D1 in the direction of more spread, D2 perpendicular with less spread.", "Rotating the plot so D1 is horizontal shows the data with no remaining correlation between the new coordinates."], "key": "PCA rotates axes to align with directions of greatest variance."}, {"p": "16", "title": "Summary", "points": ["PCA is for high-dimensional and correlated data: it attempts to remove the correlations and rank coordinates by importance.", "Future: the math behind PCA."], "key": "PCA decorrelates and ranks."}]}, {"lec": "M9 L4", "title": "Using principal component analysis", "intro": "Gives the math of PCA \u2014 centering the data, eigenvectors of X\u1d40X, and principal components as XV\u2096 \u2014 then shows kernels for nonlinear PCA and how to translate a PCA-based regression back into coefficients on the original factors.", "topics": ["Centering data so \u03bc\u2c7c = 0", "Eigenvectors of X\u1d40X", "New factor t\u1d62\u2096 = \u03a3\u2c7c x\u1d62\u2c7cv\u2c7c\u2096", "Kernel PCA for nonlinear", "Implied coefficients a\u2c7c = \u03a3\u2096 b\u2096v\u2c7c\u2096"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: the basic ideas of PCA \u2014 reduce the number of factors used in the final model, and remove factor correlation.", "This lesson: how PCA works (the math). Page 3 revisits the earlier picture."], "key": "From intuition to the math of PCA."}, {"p": "4\u20137", "title": "Principal Component Analysis (PCA)", "points": ["X: initial matrix of data; x\u1d62\u2c7c is the jth factor of data point i. Scale so that (1/m)\u03a3\u1d62 x\u1d62\u2c7c = \u03bc\u2c7c = 0 (each factor has mean zero).", "Find all eigenvectors of X\u1d40X; V = [V\u2081 V\u2082 \u2026] is the matrix of eigenvectors sorted by eigenvalue, V\u2c7c the jth eigenvector.", "PCA is a linear transformation: first component XV\u2081, second XV\u2082, etc.", "kth new factor value for the ith data point: t\u1d62\u2096 = \u03a3\u2c7c\u208c\u2081\u1d50 x\u1d62\u2c7cv\u2c7c\u2096."], "key": "Principal components = centered data times eigenvectors of X\u1d40X.", "watch": "The centering formula is printed with 1/m even though the sum is over data points i; whatever the divisor, the point is that each factor's mean \u03bc\u2c7c is 0."}, {"p": "8\u20139", "title": "PCA - Linear Transformation", "points": ["PCA eliminates correlation between factors.", "Want fewer variables in your model? Only include the first n principal components."], "key": "Keep the top n components for a smaller model."}, {"p": "10", "title": "PCA - Linear Transformation", "points": ["The math assumed a linear transformation.", "For nonlinear functions, use kernels \u2014 similar to SVM modeling."], "key": "Kernels extend PCA to nonlinear transformations."}, {"p": "11\u201314", "title": "PCA - Regression", "points": ["How to interpret the new model in terms of the original factors? Example: PCA finds L new factors {t\u1d62\u2096}, then regression finds b\u2080, b\u2081, \u2026, b_L.", "y\u1d62 = b\u2080 + \u03a3\u2096\u208c\u2081\u1d38 b\u2096t\u1d62\u2096 = b\u2080 + \u03a3\u2096\u208c\u2081\u1d38 b\u2096[\u03a3\u2c7c\u208c\u2081\u1d50 x\u1d62\u2c7cv\u2c7c\u2096] = b\u2080 + \u03a3\u2c7c\u208c\u2081\u1d50 x\u1d62\u2c7c[\u03a3\u2096\u208c\u2081\u1d38 b\u2096v\u2c7c\u2096] = b\u2080 + \u03a3\u2c7c\u208c\u2081\u1d50 x\u1d62\u2c7c[a\u2c7c].", "Implied regression coefficient for x\u2c7c: a\u2c7c = \u03a3\u2096\u208c\u2081\u1d38 b\u2096v\u2c7c\u2096."], "key": "A PCA regression can be rewritten as a regression on the original factors."}, {"p": "15", "title": "Summary", "points": ["PCA is for high-dimensional and correlated data; it attempts to remove correlations and rank coordinates by importance.", "PCA results can be explained in the original factor space."], "key": "PCA models stay interpretable via implied coefficients."}]}, {"lec": "M9 L5", "title": "Eigenvalues and eigenvectors", "intro": "A short review of eigenvalues and eigenvectors of a square matrix and how they produce the principal components in PCA.", "topics": ["Definition Av = \u03bbv", "Characteristic equation det(A \u2212 \u03bbI) = 0", "Principal components as XV\u2c7c", "Orthogonal coordinate directions"], "slides": [{"p": "2", "title": "Overview", "points": ["This lesson: eigenvalues and eigenvectors of a square matrix.", "Application to principal component analysis (PCA)."], "key": "Linear algebra behind PCA."}, {"p": "3", "title": "Eigenvalues & Eigenvectors", "points": ["A: a square matrix. If v is a vector such that Av = \u03bbv, then v is an eigenvector of A and \u03bb is an eigenvalue of A.", "Eigenvalues solve det(A \u2212 \u03bbI) = 0.", "Given \u03bb, solve Av = \u03bbv to find the \"corresponding eigenvalue v\"."], "key": "Find \u03bb from the determinant equation, then v from Av = \u03bbv.", "watch": "Slide misprint: \"corresponding eigenvalue v\" should read \"corresponding eigenvector v\"."}, {"p": "4", "title": "Principal Component Analysis (PCA)", "points": ["Scaled data matrix X: x\u1d62\u2c7c = jth factor value for data point i, after scaling.", "Find eigenvectors v\u2081\u2026v\u2099 of X\u1d40X.", "Multiply X by the eigenvectors: Xv\u2081, Xv\u2082, \u2026, Xv\u2099 are the principal components \u2014 a transformed set of orthogonal coordinate directions."], "key": "PCA = project the scaled data onto eigenvectors of X\u1d40X."}, {"p": "5", "title": "Summary", "points": ["Finding eigenvalues and eigenvectors of a square matrix.", "Their application to PCA."], "key": "Eigenvectors give PCA's new axes."}]}, {"lec": "M9 L6", "title": "PCA: the good and the bad", "intro": "Reviews what PCA does and shows with two-class examples that the highest-variance component is not always the one that separates the classes.", "topics": ["PCA review: uncorrelated, sorted factors", "When PCA1 separates the classes", "When high variance isn't predictive", "PCA as an approach worth trying"], "slides": [{"p": "2\u20133", "title": "PCA Review", "points": ["PCA is a change of coordinates that creates uncorrelated factors, sorted by amount of variability explained.", "It allows the use of a smaller number of variables \u2014 usually the ones that explain the most variability.", "Page 3 repeats the scatter plot with the new rotated axes."], "key": "PCA keeps the highest-variance directions."}, {"p": "4\u20139", "title": "Example: PCA is Good", "points": ["Scatter plot of red and blue points with new axes D1 and D2 drawn.", "Good case: PCA1 has most of the variance, and the PCA1 dimension is a good differentiator between red and blue points."], "key": "PCA works well when the high-variance direction also separates the classes."}, {"p": "10", "title": "Example: PCA Can Also Be Bad", "points": ["Side by side: the good case (left) and a bad case (right).", "Bad case: PCA1 has most of the variance, but the PCA1 dimension is not a good differentiator between red and blue points."], "key": "Most variance \u2260 most useful for prediction.", "watch": "PCA ignores the response; dropping low-variance components can throw away the signal that matters."}, {"p": "11", "title": "Summary", "points": ["Sometimes PCA can be good, sometimes it can be bad (both examples shown).", "Often it can be a helpful approach to try."], "key": "Try PCA, but check it helps."}]}], "n": 9}, {"module": "m10", "title": "Advanced regression", "lectures": [{"lec": "M10 L1", "title": "Introduction to CART", "intro": "Introduces tree-based regression (CART): split the data into subsets and fit a separate model in each one, using a marketing-email spending example.", "topics": ["Classification and regression trees (CART)", "Separate regression per data subset", "Following a data point to its leaf", "Leaf model as node average", "Why the method is called a tree"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: building, fitting, evaluating and using regression models.", "This lesson: using trees, which divide a data set and build different models for different data subsets."], "key": "Trees let us use different models for different parts of the data."}, {"p": "4\u20135", "title": "Trees in Regression", "points": ["Trees are used in classification problems: CART stands for Classification and Regression Trees.", "Trees are also used in decision making (decision trees)."], "key": "The same tree idea shows up in regression, classification and decision making."}, {"p": "6\u20137", "title": "Trees in Regression: single regression model", "points": ["Example: impact of a marketing email on how much recipients spend.", "Predictors: demographics (age, sex, number of children, income, etc.), purchasing factors (average amount spent per month on the website), and a binary factor for whether the email was received.", "A scatter plot of money spent vs. age shows that one regression for everyone may fit poorly, since different age groups behave differently."], "key": "A single regression over all the data can miss differences between groups."}, {"p": "8", "title": "Trees in Regression: split by age", "points": ["The data are split into age \u2264 25 and age > 25, with a separate regression for each.", "25 or younger: Money spent = 50 + 13.75[# children] + 0[income > $30K] + \u2026", "Older than 25: Money spent = 32 + 28.13[# children] + 7.13[income > $30K] + \u2026", "The same factor can have very different coefficients in different subsets (e.g., income over $30K matters only for the older group)."], "key": "Each branch of the split gets its own regression model."}, {"p": "9\u201312", "title": "Trees in Regression: growing the tree", "points": ["The age > 25 branch is split again at age 50, giving ages 26\u201350 and age > 50.", "The ages 26\u201350 node is split again by children: no children vs. at least one child.", "Each node holds all data points meeting the conditions on its path (e.g., age 26\u201350 and no children).", "The final nodes, where no more splitting happens, are called leaves; each leaf has its own regression model."], "key": "Repeated splitting creates a tree whose leaves each carry a model."}, {"p": "13\u201318", "title": "Trees in Regression: example prediction", "points": ["Example: predict spending for a 37-year-old with 2 children.", "Follow the branches: age > 25, then age \u2264 50, then at least one child.", "The leaf reached gives the regression model used to make the prediction for this person."], "key": "To predict, follow a point down the tree to its leaf and use that leaf's model."}, {"p": "19\u201321", "title": "Trees in Regression: lots of regressions!", "points": ["A tree with many leaves means many separate regression models, one per leaf.", "Each leaf has fewer data points than the whole data set, which motivates simpler models in the leaves."], "key": "Trees can require fitting many regressions."}, {"p": "22\u201324", "title": "Regression Formula in Trees", "points": ["Full regression: y = a\u2080 + a\u2081x\u2081 + \u2026 + a\u2099x\u2099.", "Regression in a tree is often much simpler: just y = a\u2080 in each leaf.", "Quick derivation of best fit: minimize \u03a3\u1d62 (y\u1d62 \u2212 a\u2080)\u00b2; setting the derivative to zero gives \u03a3\u1d62 (y\u1d62 \u2212 a\u2080) = 0, so a\u2080 = (\u03a3 y\u1d62 in node)/(# data points in node).", "So a\u2080 is the average response of the data points in the node."], "key": "With a constant-only leaf model, the best prediction is the leaf's average response."}, {"p": "25\u201328", "title": "Final Comments: other places to use trees", "points": ["Logistic regression models: a leaf can predict the fraction of the node's data points with a \"true\" response.", "Classification models: a leaf predicts the most common classification among the node's data points.", "Decision models: each leaf can be a decision, e.g., \"Do I send a marketing email?\""], "key": "The leaf-level model can be a probability, a class, or a decision."}, {"p": "29\u201332", "title": "Common questions", "points": ["How do we choose what branches to put into the tree?", "When do we stop branching?", "Why is this method called a regression \"tree\"?"], "key": "Branching and stopping rules are covered in the next lesson."}, {"p": "33\u201339", "title": "Why a \"tree\"?", "points": ["A picture builds up a tree: the diagram drawn so far looks like a tree turned upside down.", "The splits are the branches and the final nodes are the leaves, with the starting node (all data) at the top as the root."], "key": "The splitting diagram looks like an upside-down tree with branches and leaves."}]}, {"lec": "M10 L2", "title": "Branching", "intro": "How to choose branches in a regression tree, when to stop branching, and how to prune branches that don't really improve the model.", "topics": ["Choosing the branching factor", "Variance-decrease splitting threshold", "Pruning with held-out data", "Minimum leaf size (5% rule)"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: what tree-based analysis is and why we might make different models for different data subsets.", "This lesson: a tree's branches, how to specify them, and stopping conditions."], "key": "Focus is on how branches are chosen and when to stop."}, {"p": "4\u20135", "title": "Branching", "points": ["Questions: which factor(s) should be in the branching decision, and how should we split the data?", "A branch can use a combination of factors. Example (predicting computational time): Branch 1: (#courses) \u00d7 (#available classrooms) \u2265 1000; Branch 2: (#courses) \u00d7 (#available classrooms) < 1000."], "key": "A branching rule can be based on one factor or a combination of factors."}, {"p": "6\u20138", "title": "Branching Methods", "points": ["Use half of the data to build the tree.", "Start with a regression on all the data, then split into subsets (Subset 1 and Subset 2) and fit a regression on each.", "Subsets can be split again (e.g., Subset 2 into Subsets 2.1 and 2.2)."], "key": "The tree is grown from one half of the data, one split at a time."}, {"p": "9\u201310", "title": "Branching Methods: growing and pruning", "points": ["For each leaf: try splitting on each factor and find the biggest decrease in variance.", "Make the split with the biggest decrease, if the decrease is more than a threshold. Repeat until no split decreases variance more than the threshold.", "Then, using the other half of the data, for each branching point calculate the estimation error with and without the branch; if branching increases error, remove the branch."], "key": "Grow by variance reduction on one half; prune using error on the other half."}, {"p": "11\u201313", "title": "Branching Methods: key ideas", "points": ["Use a metric related to the model's quality and find the \"best factor\" to branch with.", "Check whether the branch really improved the model; if not, prune it back.", "Reject a potential branch if the improvement is low, or if one side would have too few data points. Rule of thumb: each leaf contains at least 5% of the original data.", "\"Overfitting our model can be costly; make sure the benefit of each branch is greater than its cost.\""], "key": "Keep a branch only if its benefit outweighs the overfitting cost."}, {"p": "14", "title": "Summary", "points": ["Covered: how to perform branching and when a branch should be kept in the model.", "Next: random forests."], "key": "Branch for real improvement, prune the rest."}]}, {"lec": "M10 L3", "title": "Random Forests", "intro": "Random forests build many randomized trees (bootstrapped data, random factor subsets) and combine their predictions.", "topics": ["Bootstrapping the training data", "Random subset of branching factors", "Averaging many trees' predictions", "Black-box predictor tradeoff"], "slides": [{"p": "2\u20134", "title": "Overview", "points": ["Previously: tree-based analysis and why to build different models for different data subsets.", "This lesson: the random forest method."], "key": "From one tree to many trees."}, {"p": "5\u20137", "title": "Tree branching", "points": ["Example table of daily sales with columns Sales, Day, Holiday?, Promo? (e.g., 828 Sat, no holiday, promo; 409 Tue, no holiday, no promo; 588 Mon, holiday, promo).", "First split: no promotion vs. promotion. The promotion branch is then split into holiday vs. no holiday.", "There is one model for each leaf."], "key": "A single tree splits the data and fits one model per leaf."}, {"p": "8\u20139", "title": "Random Forests", "points": ["Introduce randomness to generate many different trees, each with different strengths and weaknesses.", "Question: might the average of many trees be better than a single tree?"], "key": "Many varied trees can be combined into a better predictor."}, {"p": "10\u201312", "title": "Introducing Randomness: bootstrapping", "points": ["Start with original data of n points.", "Each tree gets n points drawn from the original data, so it could have multiples of some points and none of others (sampling with replacement)."], "key": "Bootstrapping gives each tree a slightly different data set."}, {"p": "13\u201314", "title": "Introducing Randomness: branching", "points": ["Branching is not as before, where we choose among all factors one at a time.", "Instead, randomly choose a small number of factors, set X, and choose the best factor within X to branch on.", "No need to prune the tree."], "key": "Each split considers only a random subset of factors; trees aren't pruned."}, {"p": "15\u201320", "title": "Random Forests: many trees", "points": ["Each tree in the forest has slightly different data.", "We end up with a lot of different trees (usually 500\u20131000); this is a random forest.", "Each tree may give a different regression model, so which one do we use?"], "key": "The forest has hundreds of trees with different models."}, {"p": "21\u201326", "title": "Random Forests: combining and tradeoffs", "points": ["Regression trees: use the average predicted response across trees.", "Classification trees: use the most common predicted response.", "Benefits: better overall estimates; averaging between trees somewhat neutralizes overfitting.", "Drawbacks: harder to explain/interpret results; can't give a specific regression or classification model from the data."], "key": "Averaging improves predictions but sacrifices interpretability."}, {"p": "27", "title": "Summary", "points": ["Random forest method introduces randomness into the trees.", "Good as a black-box predictor; not good for detailed insight."], "key": "Use random forests for prediction, not explanation."}]}, {"lec": "M10 L3a", "title": "Explainability / Interpretability", "intro": "Compares how easy it is to explain linear regression, regression trees and random forests, and the tradeoff between explainability and model power.", "topics": ["Interpreting regression coefficients", "Movie ticket sales example", "Explainability spectrum of models", "Legal requirement for explainability", "Explainability vs. predictive power tradeoff"], "slides": [{"p": "2", "title": "Explainability / Interpretability", "points": ["Explainability: how easy (or not) it is to know how models create their output."], "key": "Some models are much easier to explain than others."}, {"p": "3\u20136", "title": "Linear Regression Example", "points": ["Model: y = a\u2080 + \u03a3\u2c7c\u208c\u2081\u207f a\u2c7cx\u1d62\u2c7c. How is y affected by different predictor values?", "y = number of tickets to this movie sold this year; x\u2081 = salary of top four stars; x\u2082 = number of movies with similar plots this year; x\u2083 = rated R or more restrictive (1 = yes, 0 = no); x\u2084 = number of days left in year.", "Coefficients: a\u2080 = 1,000,000; a\u2081 = 0.25; a\u2082 = \u22121,000,000; a\u2083 = \u22121,000,000; a\u2084 = 20,000.", "Reading: baseline 1,000,000 tickets; each dollar of star salary adds 1/4 ticket; each similar movie subtracts 1,000,000; a restrictive rating subtracts 1,000,000; each day left in the year adds 20,000."], "key": "Linear regression coefficients directly say how each predictor affects the response."}, {"p": "7\u201312", "title": "Regression Tree Example", "points": ["Same movie example as a tree, branching on x\u2082 (similar movies), then x\u2083 = 1? (restrictive rating), then x\u2084 \u2265 97? (days left), with a different model in each leaf (details not shown).", "Effect of star salary (a\u2081): if 5 or fewer similar movies, 1/3; otherwise, if rating is restrictive, 1/2; otherwise, if 97 or more days left, 1/6; otherwise, 0.", "Overlaying the tree on the predictors is \"not so helpful for understanding\"."], "key": "A tree's effects depend on the path, so they're harder to explain."}, {"p": "13\u201314", "title": "Random Forest Example", "points": ["One tree is hard to explain; 500 trees is even worse.", "A random forest does give the relative branching importance of each variable.", "But it doesn't say how a variable matters, so it is not precise for interpretability or explainability."], "key": "Random forests give variable importance but not explanation."}, {"p": "15\u201320", "title": "More Explainable vs. Less Explainable", "points": ["Spectrum from more to less explainable: linear regression, regression tree, random forest.", "Explainability helps us understand \"why\", helps decision-makers choose to use/implement a model, and is sometimes a legal requirement.", "Less-explainable models sometimes give better results, since they can identify and model more-complex patterns."], "key": "Explainable models build understanding and trust; less-explainable ones can fit more."}, {"p": "21", "title": "Tradeoff", "points": ["Less-explainable models can give more value by fitting more-complex patterns.", "More-explainable models can be more likely to be adopted, because they're easier for decision-makers to believe in, and are sometimes legally required.", "Pay attention to the tradeoffs when suggesting a model."], "key": "Weigh predictive value against adoptability and legal needs."}]}, {"lec": "M10 L4", "title": "Logistic Regression", "intro": "Logistic regression for estimating probabilities, how it compares with linear regression, thresholding for classification, and ROC curves/AUC.", "topics": ["Logit / log-odds model", "S-shaped logistic curve", "Pseudo R-squared", "Probability threshold for yes/no", "ROC curve and AUC"], "slides": [{"p": "2\u201310", "title": "Previously / This Lesson", "points": ["Previously: regression models, trees and variable selection, where the response is continuous.", "This lesson: estimating a probability. Linear regression won't work because we need responses between 0 and 1.", "Use logistic regression, sometimes called a logit model."], "key": "Probabilities need a model whose output stays between 0 and 1."}, {"p": "11", "title": "Logistic Regression Model", "points": ["Standard linear regression: y = a\u2080 + a\u2081x\u2081 + a\u2082x\u2082 + \u2026 + a\u2c7cx\u2c7c.", "Logistic regression, with p = probability of the event you want to observe: log(p/(1 \u2212 p)) = a\u2080 + a\u2081x\u2081 + a\u2082x\u2082 + \u2026 + a\u2c7cx\u2c7c.", "Equivalently p = 1/(1 + e^\u2212(a\u2080 + a\u2081x\u2081 + a\u2082x\u2082 + \u2026 + a\u2c7cx\u2c7c)).", "If the linear part \u2192 \u2212\u221e then p \u2192 0; if it \u2192 +\u221e then p \u2192 1."], "key": "Logistic regression models the log-odds as linear, keeping p in (0, 1)."}, {"p": "12\u201316", "title": "Logistic Regression Curve", "points": ["The logistic function is an S-shaped curve between 0 and 1, crossing 0.5 in the middle.", "Plot of Probability(Response) vs. predictor: data points are at 0 or 1, and the fitted curve rises from near 0 to near 1 across the predictor range."], "key": "The fitted curve turns 0/1 data into a smooth probability estimate."}, {"p": "17\u201318", "title": "Logistic regression on real data", "points": ["Bar chart of the observed fraction of \"yes\" responses (0 to 1) at each predictor value from about \u221254 to 61.", "The fraction is noisy at the extremes (few data points) but trends upward from about 0.2\u20130.3 to around 0.6\u20130.8, the pattern a logistic curve captures."], "key": "Real response fractions follow a rising, noisy trend that the logistic model smooths."}, {"p": "19\u201324", "title": "Logistic Regression vs. Linear Regression", "points": ["Similarities: transformations of input data, interaction terms, variable selection; there are also logistic regression trees and random logistic regression forests.", "Differences: logistic regression takes longer to compute and has no closed-form solution.", "Understanding model quality is also different."], "key": "Most linear-regression techniques carry over, but fitting is slower."}, {"p": "25\u201326", "title": "Measures of model quality", "points": ["Linear regression: R-squared, the fraction of variance explained by the model.", "Logistic regression: pseudo R-squared, which is not really measuring the fraction of variance."], "key": "Don't read a pseudo R\u00b2 as variance explained."}, {"p": "27\u201328", "title": "Logistic Regression \u2013 Classification: Thresholding", "points": ["Answer \"yes\" if probability p is at least some threshold number; otherwise answer \"no\".", "Example: if p \u2265 0.7, give the loan; otherwise, no."], "key": "A threshold turns a probability into a yes/no classification."}, {"p": "29\u201330", "title": "Receiver Operating Characteristic (ROC) Curve", "points": ["The ROC curve plots sensitivity (y-axis) against 1 \u2212 specificity (x-axis), from 0 to 1, as the threshold varies.", "Sensitivity = TP/(TP + FN); specificity = TN/(TN + FP).", "See Lesson 10.5 on confusion matrices."], "key": "ROC shows the sensitivity/specificity tradeoff across all thresholds."}, {"p": "31\u201335", "title": "ROC Curve: Area Under Curve", "points": ["AUC = area under the ROC curve = probability that the model estimates a random \"yes\" point higher than a random \"no\" point.", "Example: Joe repaid the loan, Moe did not; AUC = probability the model gives Joe's data point a higher response value than Moe's.", "For reference: AUC = 0.5 means just guessing."], "key": "AUC measures how well the model ranks yes-points above no-points."}, {"p": "36\u201337", "title": "Caveat: ROC/AUC", "points": ["Gives a quick-and-dirty estimate of quality, but does not differentiate between the cost of false negatives and false positives.", "To determine which model gives the highest value, refer to the lesson on valuing confusion-matrix output for a specific situation."], "key": "AUC ignores the different costs of different errors."}]}, {"lec": "M10 L5", "title": "Confusion Matrices", "intro": "Defines the confusion matrix (TP, FP, TN, FN) for classification models, works a spam-filter example, and shows the many metrics built from it.", "topics": ["True/false positives and negatives", "Confusion matrix layout", "Spam filter inbox example", "Sensitivity, specificity, precision metrics"], "slides": [{"p": "2\u20133", "title": "Measuring classification models", "points": ["Goal: measure how well a classification-type model works, e.g., support vector machine, k-nearest-neighbor, logistic regression."], "key": "Confusion matrices apply to any classifier."}, {"p": "4\u20135", "title": "Confusion Matrix", "points": ["Rows: true classification (yes/no); columns: model's classification (yes/no).", "Diagonal cells are correct; off-diagonal cells are incorrect."], "key": "The matrix cross-tabulates truth against the model's answer."}, {"p": "6\u20137", "title": "TP, FP, TN, FN", "points": ["True positive (TP): point in the category, correctly classified. False negative (FN): point in the category, model says no.", "False positive (FP): point not in the category, model says it is. True negative (TN): point not in the category, correctly classified.", "Guidelines: positive/negative = what the model says (in the category or not); true/false = whether the model got it right."], "key": "Positive/negative is the model's call; true/false is whether it was right."}, {"p": "8\u201310", "title": "Example: email spam filter", "points": ["50% of incoming email is spam. Here the category is \"real\" email: TP = 490 (real, kept), FN = 10 (real, marked spam), FP = 100 (spam, kept), TN = 400 (spam, filtered).", "Fraction of inbox that is spam = FP/(TP + FP) = 100/(100 + 490) = 17% (everything in the inbox was classified as real).", "Fraction of real email misclassified as spam = FN/(TP + FN) = 10/(10 + 490) = 2%."], "key": "Different ratios of the matrix cells answer different practical questions.", "watch": "In this example \"positive\" means real email, not spam."}, {"p": "11", "title": "Confusion matrix", "points": ["Recap of the layout: TP and FN in the true-yes row; FP and TN in the true-no row."], "key": "All the metrics come from these four cells."}, {"p": "12\u201313", "title": "Metrics from the confusion matrix", "points": ["A \"cloud\" of named metrics: accuracy = (TP + TN)/(TP + FP + TN + FN); true positive rate = recall = sensitivity = TP/(TP + FN); specificity = TN/(TN + FP); precision = positive predictive value = TP/(TP + FP).", "Fall out = false positive rate = FP/(FP + TN); false negative rate = miss rate = FN/(FN + TP); false omission rate = FN/(FN + TN).", "Positive likelihood ratio = [TP(FP + TN)]/[FP(TP + FN)]; diagnostic odds ratio = (TP\u00b7TN)/(FP\u00b7FN).", "As printed: negative predictive value = TP/(TP + FP); negative likelihood ratio = [FN(TN + FP)]/[TN(FN + TP)] = Sensitivity/(1 \u2212 Specificity)."], "key": "Many named metrics are just different ratios of TP, FP, TN and FN.", "watch": "Misprints: negative predictive value should be TN/(TN + FN). The negative likelihood ratio's right-hand side is the positive one's; it should be (1 \u2212 Sensitivity)/Specificity."}, {"p": "14", "title": "Confusion matrix", "points": ["Closing recap of the TP/FN/FP/TN layout."], "key": "Remember the four cells and what each means."}]}, {"lec": "M10 L6", "title": "Situationally-Driven Comparison", "intro": "Uses the spam-filter confusion matrix with costs of each kind of error to compare models, showing that the best model depends on the situation.", "topics": ["Cost of each misclassification", "Expected cost per email", "Effect of changing spam fraction", "Comparing two spam filters by cost"], "slides": [{"p": "2\u20134", "title": "Evaluating a model's quality", "points": ["Example using a confusion matrix from spam detection: TP = 490, FN = 10, FP = 100, TN = 400 (real email is the positive class)."], "key": "Same spam-filter matrix as the previous lesson."}, {"p": "5\u20138", "title": "Cost of lost productivity", "points": ["One more piece of information is needed: the cost of lost productivity.", "$0 for correct classifications; $0.04 to read a spam message; $1 to miss a real message."], "key": "Assign a cost to each cell of the matrix."}, {"p": "9\u201315", "title": "Total cost when 50% of email is spam", "points": ["Total cost = 490\u00d7$0 + 10\u00d7$1 + 100\u00d7$0.04 + 400\u00d7$0 = $14 per 1000 emails.", "That is 1.4 cents per email."], "key": "Weighting each cell by its cost gives a single comparable number."}, {"p": "16\u201318", "title": "Total cost when 40% of email is spam", "points": ["Rescale each row: real-email cells by 60%/50% and spam cells by 40%/50%.", "Total cost = 490\u00d7(60%/50%)\u00d7$0 + 10\u00d7(60%/50%)\u00d7$1 + 100\u00d7(40%/50%)\u00d7$0.04 + 400\u00d7(40%/50%)\u00d7$0 = $15.2.", "That is 1.52 cents per email."], "key": "The same model's cost changes when the mix of spam and real email changes."}, {"p": "19\u201321", "title": "Summary of the first model", "points": ["With 50% spam, total cost = 1.4 cents/email, and 17% of the inbox is spam."], "key": "First model: cheap but lets a fair amount of spam through."}, {"p": "22\u201325", "title": "Comparing a second model", "points": ["Second filter: TP = 450, FN = 50, FP = 50, TN = 450. Only 10% of its inbox is spam.", "Total cost = 450\u00d7$0 + 50\u00d7$1 + 50\u00d7$0.04 + 450\u00d7$0 = $52, i.e., 5.2 cents/email.", "So the first model (17% spam in inbox, 1.4 cents) is better than the second (10% spam, 5.2 cents) under these costs."], "key": "A model with less spam in the inbox can still cost more if it loses more real email."}, {"p": "26\u201327", "title": "Overdue Notification \u2013 Junk Email", "points": ["A mock email from the \"building administrator\" saying the office is on fire was flagged as junk.", "Follow-up message: this shows why you'd weight different types of mistakes differently; missing an important real email can cost much more than reading an extra spam. See the Classification/SVM lesson for how to do this."], "key": "Errors have unequal costs, and models should reflect that."}]}, {"lec": "M10 L7", "title": "Advanced Topics in Regression", "intro": "Brief tour of advanced parametric and non-parametric regression methods: Poisson regression, regression splines, Bayesian regression and KNN regression.", "topics": ["Poisson regression for counts", "Regression splines and MARS", "Bayesian regression with expert prior", "k-nearest-neighbor regression"], "slides": [{"p": "2\u20134", "title": "Overview", "points": ["This lesson: advanced methods related to regression, both parametric and non-parametric."], "key": "A survey of other regression methods."}, {"p": "5\u20137", "title": "Poisson regression", "points": ["Use when the response follows a Poisson distribution, f(z) = \u03bb^z e^\u2212\u03bb / z! (refer to the probability distributions lectures).", "Example: count arrivals at an airport security line.", "The arrival rate might be a function of time, so we estimate \u03bb(x)."], "key": "Poisson regression models a count's rate as a function of predictors."}, {"p": "8\u201313", "title": "Regression splines", "points": ["Spline: a function of polynomials that connect to each other.", "Fit different functions to different parts of the data set, with smooth connections between the parts.", "Order-k regression spline: the polynomials are all order k.", "Example: multi-adaptive regression splines (MARS), called \"Earth\" in many statistical libraries."], "key": "Splines fit piecewise polynomials joined smoothly."}, {"p": "14\u201318", "title": "Bayesian regression", "points": ["Start with data plus an estimate of how the regression coefficients and the random error are distributed.", "Example: predict a child's adult height from the heights of the mother and father, with expert opinion as a starting distribution (e.g., coefficients uniformly distributed between 0.8 and 1.2).", "Use Bayes' theorem to update the estimate.", "Most helpful when there isn't much data."], "key": "Bayesian regression combines prior expert opinion with data."}, {"p": "19\u201320", "title": "k-Nearest-Neighbor (KNN) Regression", "points": ["No estimate of a prediction function: just plot all the data.", "Predict the response as the average response of the k closest data points."], "key": "KNN regression predicts by averaging nearby data points."}, {"p": "21", "title": "Summary", "points": ["Advanced regression models: Poisson regression, regression splines, Bayesian regression, k-nearest-neighbor regression.", "There are other advanced models too."], "key": "Many regression variants exist for special situations."}]}], "n": 10}, {"module": "m11", "title": "Variable selection", "lectures": [{"lec": "M11 L1", "title": "Introduction to Variable Selection", "intro": "Why models with fewer factors are often better: too many factors leads to overfitting, and simpler models are cheaper, more reliable, easier to explain and sometimes legally required.", "topics": ["Too many factors causes overfitting", "Daughter's height from parents' height", "Temperature 37 days after birth", "Benefits of simple models", "Legally forbidden factors in credit"], "slides": [{"p": "2\u20135", "title": "Overview", "points": ["Previously: factor-based models such as classification, clustering and regression.", "This lesson: why not to keep so many factors, and how to choose factors (\"variable selection\").", "The ideas apply generally; regression is used for the examples. The professor notes any regression-specific method has analogues for other factor-based models."], "key": "Variable selection means choosing which factors go in the model."}, {"p": "6\u20138", "title": "Limiting Number of Factors in Model", "points": ["Two main reasons. First: overfitting, when the number of factors is close to or larger than the number of data points.", "The model might then fit too closely to random effects, not just real ones (as in the validation lessons)."], "key": "Too many factors relative to data points means fitting noise."}, {"p": "9\u201314", "title": "Example 1: daughter's height from parents' total height", "points": ["Predict how tall a girl will be as an adult from the total height of her father and mother.", "Chart: daughter's adult height (4\u2032\u20136.5\u2032) vs. parents' total height (9\u2032\u201314\u2032) with a regression line through many points; for parents totaling 11\u2032 the estimate is about 5\u20323\u2033.", "To show overfitting without a 12-dimensional picture, the professor keeps one factor but uses far fewer points: several sets of just three points, each with its own line."], "key": "With enough data, one factor gives a sensible fitted line."}, {"p": "15\u201316", "title": "Example 1: three-point fits", "points": ["Three-point regressions: y = 0.5102x \u2212 0.1061, y = 0.2926x + 2.0567, y = 0.0725x + 3.9006.", "For parents totaling 11\u2032 these give very different estimates (about 5.5\u2032, 5.3\u2032 and 4.7\u2032), because each fits the random taller- or shorter-than-expected points.", "With few data points, overfitting can cause bad estimates."], "key": "Overfit models' predictions swing with the random effects in the data."}, {"p": "17\u201322", "title": "Example 2: temperature 37 days after birth", "points": ["Predict a girl's adult height from how many degrees above or below the daily average the temperature was 37 days after birth (a factor with no real effect).", "All data: y = 0.0001x + 5.3492, essentially flat, showing no effect.", "Three-point subsets give y = 0.0252x + 5.3387, y = 0.0011x + 5.5067 and y = \u22120.174x + 5.4827, falsely suggesting effects.", "With few data points, overfitting can cause bad estimates."], "key": "Overfitting can even create effects that don't exist."}, {"p": "23\u201329", "title": "Simplicity", "points": ["Simple models are better than complex ones. Less data is required (collecting many factors can be difficult, expensive or impossible).", "Less chance of insignificant factors: the professor notes each factor at p = 0.05 still has a 5% chance of being meaningless, so with 20 such factors there's about a 64% chance at least one isn't real.", "Easier to interpret: managers want to know why a model works, and an unexplained model often won't be trusted or used.", "Sometimes factors are illegal to use, e.g., race, sex, religion, marital status for credit decisions. You also can't use factors highly correlated with forbidden ones (e.g., zip code with race), and it's hard to demonstrate a complex model is okay."], "key": "Fewer factors means cheaper, more reliable, explainable and legally defensible models."}, {"p": "30", "title": "Future", "points": ["This lesson: benefits of creating simple models.", "Future: how to create simple models."], "key": "Next: methods for choosing factors."}]}, {"lec": "M11 L2", "title": "Models for Variable Selection", "intro": "Greedy step-by-step variable selection (forward selection, backward elimination, stepwise regression) and global optimization methods (LASSO, elastic net), plus a first look at ridge regression.", "topics": ["Forward selection", "Backward elimination", "Stepwise regression", "Greedy algorithms", "LASSO coefficient budget T", "Elastic net constraint"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: it's better to create models with fewer factors.", "This lesson: variable selection approaches, in the context of regression."], "key": "How to actually choose the smaller set of factors."}, {"p": "4\u20136", "title": "Variable Selection: Forward Selection", "points": ["Flowchart: start with no factors; find the best new factor; if good enough, add it and fit the model with the current set of factors; repeat while we don't yet have enough factors.", "At the end, remove factors with high p-value and fit the model with the final set of factors.", "The professor notes \"good enough\" is a parameter, e.g., allow factors in at p < 0.1 or 0.15 for exploration, then remove those above 0.05 at the end."], "key": "Build up from nothing, adding the best factor each step."}, {"p": "7\u20138", "title": "Variable Selection: Backward Elimination", "points": ["Start with all factors; find the worst current factor and remove it while we have too many factors or it's bad enough.", "Remove factors with high p-value (p > 0.05), then fit the model with the final set of factors."], "key": "Start with everything and remove the worst factor each step."}, {"p": "9\u201310", "title": "Variable Selection: Stepwise Regression", "points": ["A combination of forward selection and backward elimination.", "The flowchart builds up from no factors, but after adding each factor it immediately removes any factors whose p-value is now high (p > 0.05), and again at the end.", "The professor notes other metrics (R-squared, AIC, BIC) can be used instead of p-values to pick factors to add or remove."], "key": "Stepwise lets earlier-added factors drop out as new ones enter."}, {"p": "11\u201315", "title": "Stepwise selection: greedy algorithms", "points": ["Decisions are made step by step; this is known as a greedy algorithm.", "At each step take the one thing that looks best; future options are not considered."], "key": "Forward, backward and stepwise are all greedy, classical methods."}, {"p": "16\u201320", "title": "LASSO", "points": ["Add a constraint to the standard regression: minimize \u03a3\u1d62\u208c\u2081\u1d50 (y\u1d62 \u2212 (a\u2080 + a\u2081x\u1d62\u2081 + a\u2082x\u1d62\u2082 + \u2026 + a\u2099x\u1d62\u2099))\u00b2 subject to \u03a3\u2c7c\u208c\u2081\u207f |a\u2c7c| \u2264 T.", "The professor describes T as a budget for coefficients: it gets spent on the most important ones, and the rest get zero coefficient and drop out.", "Scale the data first, since units change coefficient size: age measured in years vs. days (37 years = 13,505 days).", "Choosing T depends on the number of variables and the quality of the model; try LASSO with different T values for the best tradeoff."], "key": "LASSO's budget on |coefficients| forces some to zero, selecting variables."}, {"p": "21\u201323", "title": "Elastic Net", "points": ["Constrain a combination of the absolute values of the coefficients and their squares: minimize \u03a3\u1d62\u208c\u2081\u1d50 (y\u1d62 \u2212 (a\u2080 + a\u2081x\u1d62\u2081 + \u2026 + a\u2099x\u1d62\u2099))\u00b2 subject to \u03bb\u03a3\u2c7c|a\u2c7c| + (1 \u2212 \u03bb)\u03a3\u2c7ca\u2c7c\u00b2 \u2264 T.", "As with LASSO, scale the data, and choose T and \u03bb."], "key": "Elastic net mixes LASSO's absolute-value and ridge's squared constraint."}, {"p": "24", "title": "Ridge Regression", "points": ["Take out the absolute value term from elastic net: minimize \u03a3\u1d62 (y\u1d62 \u2212 (a\u2080 + a\u2081x\u1d62\u2081 + \u2026 + a\u2099x\u1d62\u2099))\u00b2 with only the squared-coefficient constraint.", "The professor notes it doesn't do variable selection, but can lead to better predictive models."], "key": "Ridge regression shrinks coefficients rather than selecting variables."}, {"p": "25\u201326", "title": "Future", "points": ["This lesson: forward selection, backward elimination, stepwise regression, LASSO, elastic net, ridge regression.", "Future: how to choose the right model."], "key": "Greedy vs. global methods; choosing among them comes next."}]}, {"lec": "M11 L2a", "title": "Lasso Regression vs Ridge Regression", "intro": "A two-dimensional graphical explanation of why lasso regression's constraint selects variables while ridge regression's does not.", "topics": ["Diamond-shaped lasso constraint region", "Circular ridge constraint region", "Elliptical error contours", "Solution at a corner sets coefficient to zero"], "slides": [{"p": "2\u20136", "title": "Lasso Regression and Ridge Regression", "points": ["Both choose coefficients a\u2080, a\u2081, \u2026, a\u2099 to minimize total error \u03a3\u1d62\u208c\u2081\u1d50 (y\u1d62 \u2212 (a\u2080 + \u03a3\u2c7c\u208c\u2081\u207f a\u2c7cx\u1d62\u2c7c))\u00b2.", "Lasso restricts solutions to \u03a3\u2c7c |a\u2c7c| \u2264 \u03c4_Lasso; ridge restricts them to \u03a3\u2c7c a\u2c7c\u00b2 \u2264 \u03c4_Ridge.", "The professor notes they look almost identical, so why does only lasso do variable selection?"], "key": "The two models differ only in the coefficient constraint."}, {"p": "7\u20139", "title": "Lasso Regression vs. Ridge Regression", "points": ["Humorous \"versus\" slides: Ali vs. Frazier, Yankees vs. Red Sox, Orca vs. Great White.", "The professor says this matchup will be settled with two-dimensional graphing instead of violence."], "key": "A graphical comparison is coming."}, {"p": "10\u201312", "title": "Two-dimensional version", "points": ["Cut down to two coefficients: minimize \u03a3\u1d62 (y\u1d62 \u2212 (a\u2080 + a\u2081x\u1d62\u2081 + a\u2082x\u1d62\u2082))\u00b2, subject to |a\u2081| + |a\u2082| \u2264 \u03c4_Lasso or a\u2081\u00b2 + a\u2082\u00b2 \u2264 \u03c4_Ridge.", "Then drop the constant a\u2080 so it can be drawn in two dimensions; the professor notes this doesn't change the intuition."], "key": "Two coefficients let us draw the constraint regions."}, {"p": "13\u201314", "title": "Allowed coefficient regions", "points": ["Lasso: |a\u2081| + |a\u2082| \u2264 \u03c4_Lasso is a diamond with corners at \u00b1\u03c4_Lasso on each axis; outside it |a\u2081| + |a\u2082| > \u03c4_Lasso.", "Ridge: a\u2081\u00b2 + a\u2082\u00b2 \u2264 \u03c4_Ridge is a circle of radius \u221a\u03c4_Ridge; outside it a\u2081\u00b2 + a\u2082\u00b2 > \u03c4_Ridge.", "Each solution must lie in its shaded region."], "key": "Lasso's region has straight edges and corners; ridge's is round."}, {"p": "15\u201319", "title": "The error function", "points": ["Total error \u03a3\u1d62 (y\u1d62 \u2212 (a\u2081x\u1d62\u2081 + a\u2082x\u1d62\u2082))\u00b2 expands into a quadratic in a\u2081 and a\u2082 (terms in a\u2081\u00b2, a\u2082\u00b2, a\u2081a\u2082, a\u2081, a\u2082 and the constant \u03a3y\u1d62\u00b2).", "Points with equal total error form ellipses in the (a\u2081, a\u2082) plane; larger ellipses mean larger error.", "Best solution: the smallest-error ellipse that touches the allowed region."], "key": "Error contours are ellipses; the solution is where they first touch the region."}, {"p": "20\u201324", "title": "Lasso solution", "points": ["Growing the error ellipse until it touches the diamond: because the diamond is made of straight lines, it usually touches at a corner.", "Solution a\u2081 = \u03c4_Lasso, a\u2082 = 0, so x\u2081 is selected for the model and x\u2082 is not.", "The ellipse can touch between corners (both a\u2081 and a\u2082 nonzero, both selected), but the professor notes that's less likely with more variables and smaller \u03c4; reducing \u03c4 makes it hit a corner."], "key": "Lasso's corners make zero coefficients likely, so it selects variables."}, {"p": "25\u201326", "title": "Ridge solution", "points": ["Ridge: both the ellipse and the circle are curved, so the ellipse almost always first touches at a point where a\u2081 and a\u2082 are both nonzero.", "So x\u2081 and x\u2082 are both selected for the model.", "Side-by-side: lasso keeps x\u2081 and drops x\u2082; ridge keeps both."], "key": "Ridge's round region rarely gives zero coefficients."}, {"p": "27", "title": "Summary", "points": ["Lasso regression does variable selection (diamond region, solution at a corner).", "Ridge regression does not do variable selection (circular region, both variables kept)."], "key": "Geometry explains why lasso selects variables and ridge doesn't."}]}, {"lec": "M11 L2b", "title": "The \"Bias-Variance Tradeoff\"", "intro": "Explains the bias-variance tradeoff as fitting more or less to both real and random patterns, connecting underfitting/overfitting to bias and variance.", "topics": ["Real vs. random patterns", "Underfitting vs. overfitting continuum", "High bias, low variance", "Two-by-two fit diagram", "Total error sweet spot"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Topic: the bias-variance tradeoff.", "Data has two kinds of patterns: real patterns and random patterns. The professor notes models can't tell which is which."], "key": "We can only fit more or less to all patterns together."}, {"p": "4\u20138", "title": "Bias-Variance Tradeoff: the fit continuum", "points": ["More fit: good, better fit to real patterns; bad, more fit to random patterns (overfitting).", "Less fit: good, less fit to random patterns; bad, less fit to real patterns (underfitting)."], "key": "Turning fit up risks overfitting; turning it down risks underfitting."}, {"p": "9\u201312", "title": "Bias-Variance Tradeoff: regression view", "points": ["Regression y = a\u2080 + a\u2081x\u2081 + a\u2082x\u2082 + \u2026 + a\u2099x\u2099: less fit means fewer variables and smaller coefficients, so predictions move toward a\u2080.", "Less fit = high bias (misses or minimizes real effects) and low variance (less differentiation between predictions).", "More fit = low bias (real effects modeled well) and high variance (more differentiation between predictions, including from random patterns).", "The professor says he isn't a fan of the words bias and variance here, but the term is widespread."], "key": "Underfit = high bias, low variance; overfit = low bias, high variance."}, {"p": "13\u201318", "title": "Real Patterns vs. Random Patterns", "points": ["Two-by-two grid: rows are low/high fit to real patterns, columns are low/high fit to random patterns.", "Ideal: high fit to real, low fit to random, but hard to get there.", "Worst: low fit to real, high fit to random, but possible. The professor's example: predicting adult height as 50 inches plus the day of the month the child was born."], "key": "The ideal model is hard to find; the worst is easy to build."}, {"p": "19", "title": "Combining the views", "points": ["The two-by-two grid is placed on the continuum: the high-bias/low-variance (underfit) end and the low-bias/high-variance (overfit) end are the off-diagonal corners we usually trade between.", "The professor notes validation and talking with domain experts help focus on real patterns."], "key": "In practice we trade between the two imperfect corners."}, {"p": "20\u201323", "title": "Error vs. fit", "points": ["Graph of error vs. level of fit: error due to underfitting (real patterns) falls as fit increases; error due to overfitting (random patterns) rises.", "Total error is smallest at a sweet spot in the middle; the professor notes it isn't necessarily easy to find."], "key": "Balance the error from underfitting against the error from overfitting."}]}, {"lec": "M11 L2c", "title": "Ridge Regression / Regularization", "intro": "What ridge regression is for: it shrinks all coefficients toward zero, reducing overfitting (variance) without removing variables.", "topics": ["Ridge shrinks coefficients toward origin", "Regularization", "Reducing fit to all patterns", "Choosing \u03c4_Ridge too small"], "slides": [{"p": "2\u20133", "title": "Ridge Regression", "points": ["Ridge restricts regression coefficient size but does not reduce the number of variables.", "Recap: lasso's diamond (x\u2081 selected, x\u2082 not) vs. ridge's circle (x\u2081 and x\u2082 both selected).", "So, what is ridge regression used for?"], "key": "Ridge doesn't select variables, so what's it good for?"}, {"p": "4\u201310", "title": "Ridge Regression: shrinking the solution", "points": ["Without the constraint, the solution is the linear regression solution at the center of the error ellipses.", "If that point is outside the circle a\u2081\u00b2 + a\u2082\u00b2 \u2264 \u03c4_Ridge, the ridge solution moves toward the origin: a\u2081 and a\u2082 are both smaller.", "The tighter the constraint (smaller circle), the smaller each coefficient gets.", "If the linear regression solution is already inside the circle, linear and ridge solutions are the same; \u03c4_Ridge must shrink to have an effect."], "key": "Ridge pulls all coefficients toward zero."}, {"p": "11\u201314", "title": "Coefficients Show Magnitude of Effect", "points": ["Effects x\u2081, x\u2082, \u2026, x\u2099 (variables) have magnitudes a\u2081, a\u2082, \u2026, a\u2099 (coefficients).", "If the model seems overfit (e.g., much worse on validation than training data), we can't remove only the random patterns, so we reduce fit to all patterns by shrinking every coefficient, moving left on the underfit\u2013overfit continuum.", "In bias-variance terms, smaller coefficients reduce variance. The professor calls this approach regularization.", "Making \u03c4_Ridge too small can lead to underfitting."], "key": "Ridge regression is a regularization tool for overfit linear models."}]}, {"lec": "M11 L3", "title": "Choosing a Variable Selection Model", "intro": "How to choose among greedy methods, LASSO, ridge and elastic net, including their pros and cons and the role of human judgment.", "topics": ["Greedy methods for initial analysis", "Lasso vs. ridge vs. elastic net formulas", "Prediction error from bias and variance", "Elastic net pros and cons", "Correlated variables in LASSO"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: forward selection, backward elimination, stepwise regression, LASSO, elastic net.", "This lesson: method selection."], "key": "How to pick a variable selection method."}, {"p": "4\u20138"
