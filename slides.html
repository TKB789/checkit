idge Regression", "intro": "A two-dimensional graphical explanation of why lasso regression's constraint selects variables while ridge regression's does not.", "topics": ["Diamond-shaped lasso constraint region", "Circular ridge constraint region", "Elliptical error contours", "Solution at a corner sets coefficient to zero"], "slides": [{"p": "2\u20136", "title": "Lasso Regression and Ridge Regression", "points": ["Both choose coefficients a\u2080, a\u2081, \u2026, a\u2099 to minimize total error \u03a3\u1d62\u208c\u2081\u1d50 (y\u1d62 \u2212 (a\u2080 + \u03a3\u2c7c\u208c\u2081\u207f a\u2c7cx\u1d62\u2c7c))\u00b2.", "Lasso restricts solutions to \u03a3\u2c7c |a\u2c7c| \u2264 \u03c4_Lasso; ridge restricts them to \u03a3\u2c7c a\u2c7c\u00b2 \u2264 \u03c4_Ridge.", "The professor notes they look almost identical, so why does only lasso do variable selection?"], "key": "The two models differ only in the coefficient constraint."}, {"p": "7\u20139", "title": "Lasso Regression vs. Ridge Regression", "points": ["Humorous \"versus\" slides: Ali vs. Frazier, Yankees vs. Red Sox, Orca vs. Great White.", "The professor says this matchup will be settled with two-dimensional graphing instead of violence."], "key": "A graphical comparison is coming."}, {"p": "10\u201312", "title": "Two-dimensional version", "points": ["Cut down to two coefficients: minimize \u03a3\u1d62 (y\u1d62 \u2212 (a\u2080 + a\u2081x\u1d62\u2081 + a\u2082x\u1d62\u2082))\u00b2, subject to |a\u2081| + |a\u2082| \u2264 \u03c4_Lasso or a\u2081\u00b2 + a\u2082\u00b2 \u2264 \u03c4_Ridge.", "Then drop the constant a\u2080 so it can be drawn in two dimensions; the professor notes this doesn't change the intuition."], "key": "Two coefficients let us draw the constraint regions."}, {"p": "13\u201314", "title": "Allowed coefficient regions", "points": ["Lasso: |a\u2081| + |a\u2082| \u2264 \u03c4_Lasso is a diamond with corners at \u00b1\u03c4_Lasso on each axis; outside it |a\u2081| + |a\u2082| > \u03c4_Lasso.", "Ridge: a\u2081\u00b2 + a\u2082\u00b2 \u2264 \u03c4_Ridge is a circle of radius \u221a\u03c4_Ridge; outside it a\u2081\u00b2 + a\u2082\u00b2 > \u03c4_Ridge.", "Each solution must lie in its shaded region."], "key": "Lasso's region has straight edges and corners; ridge's is round."}, {"p": "15\u201319", "title": "The error function", "points": ["Total error \u03a3\u1d62 (y\u1d62 \u2212 (a\u2081x\u1d62\u2081 + a\u2082x\u1d62\u2082))\u00b2 expands into a quadratic in a\u2081 and a\u2082 (terms in a\u2081\u00b2, a\u2082\u00b2, a\u2081a\u2082, a\u2081, a\u2082 and the constant \u03a3y\u1d62\u00b2).", "Points with equal total error form ellipses in the (a\u2081, a\u2082) plane; larger ellipses mean larger error.", "Best solution: the smallest-error ellipse that touches the allowed region."], "key": "Error contours are ellipses; the solution is where they first touch the region."}, {"p": "20\u201324", "title": "Lasso solution", "points": ["Growing the error ellipse until it touches the diamond: because the diamond is made of straight lines, it usually touches at a corner.", "Solution a\u2081 = \u03c4_Lasso, a\u2082 = 0, so x\u2081 is selected for the model and x\u2082 is not.", "The ellipse can touch between corners (both a\u2081 and a\u2082 nonzero, both selected), but the professor notes that's less likely with more variables and smaller \u03c4; reducing \u03c4 makes it hit a corner."], "key": "Lasso's corners make zero coefficients likely, so it selects variables."}, {"p": "25\u201326", "title": "Ridge solution", "points": ["Ridge: both the ellipse and the circle are curved, so the ellipse almost always first touches at a point where a\u2081 and a\u2082 are both nonzero.", "So x\u2081 and x\u2082 are both selected for the model.", "Side-by-side: lasso keeps x\u2081 and drops x\u2082; ridge keeps both."], "key": "Ridge's round region rarely gives zero coefficients."}, {"p": "27", "title": "Summary", "points": ["Lasso regression does variable selection (diamond region, solution at a corner).", "Ridge regression does not do variable selection (circular region, both variables kept)."], "key": "Geometry explains why lasso selects variables and ridge doesn't."}]}, {"lec": "M11 L2b", "title": "The \"Bias-Variance Tradeoff\"", "intro": "Explains the bias-variance tradeoff as fitting more or less to both real and random patterns, connecting underfitting/overfitting to bias and variance.", "topics": ["Real vs. random patterns", "Underfitting vs. overfitting continuum", "High bias, low variance", "Two-by-two fit diagram", "Total error sweet spot"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Topic: the bias-variance tradeoff.", "Data has two kinds of patterns: real patterns and random patterns. The professor notes models can't tell which is which."], "key": "We can only fit more or less to all patterns together."}, {"p": "4\u20138", "title": "Bias-Variance Tradeoff: the fit continuum", "points": ["More fit: good, better fit to real patterns; bad, more fit to random patterns (overfitting).", "Less fit: good, less fit to random patterns; bad, less fit to real patterns (underfitting)."], "key": "Turning fit up risks overfitting; turning it down risks underfitting."}, {"p": "9\u201312", "title": "Bias-Variance Tradeoff: regression view", "points": ["Regression y = a\u2080 + a\u2081x\u2081 + a\u2082x\u2082 + \u2026 + a\u2099x\u2099: less fit means fewer variables and smaller coefficients, so predictions move toward a\u2080.", "Less fit = high bias (misses or minimizes real effects) and low variance (less differentiation between predictions).", "More fit = low bias (real effects modeled well) and high variance (more differentiation between predictions, including from random patterns).", "The professor says he isn't a fan of the words bias and variance here, but the term is widespread."], "key": "Underfit = high bias, low variance; overfit = low bias, high variance."}, {"p": "13\u201318", "title": "Real Patterns vs. Random Patterns", "points": ["Two-by-two grid: rows are low/high fit to real patterns, columns are low/high fit to random patterns.", "Ideal: high fit to real, low fit to random, but hard to get there.", "Worst: low fit to real, high fit to random, but possible. The professor's example: predicting adult height as 50 inches plus the day of the month the child was born."], "key": "The ideal model is hard to find; the worst is easy to build."}, {"p": "19", "title": "Combining the views", "points": ["The two-by-two grid is placed on the continuum: the high-bias/low-variance (underfit) end and the low-bias/high-variance (overfit) end are the off-diagonal corners we usually trade between.", "The professor notes validation and talking with domain experts help focus on real patterns."], "key": "In practice we trade between the two imperfect corners."}, {"p": "20\u201323", "title": "Error vs. fit", "points": ["Graph of error vs. level of fit: error due to underfitting (real patterns) falls as fit increases; error due to overfitting (random patterns) rises.", "Total error is smallest at a sweet spot in the middle; the professor notes it isn't necessarily easy to find."], "key": "Balance the error from underfitting against the error from overfitting."}]}, {"lec": "M11 L2c", "title": "Ridge Regression / Regularization", "intro": "What ridge regression is for: it shrinks all coefficients toward zero, reducing overfitting (variance) without removing variables.", "topics": ["Ridge shrinks coefficients toward origin", "Regularization", "Reducing fit to all patterns", "Choosing \u03c4_Ridge too small"], "slides": [{"p": "2\u20133", "title": "Ridge Regression", "points": ["Ridge restricts regression coefficient size but does not reduce the number of variables.", "Recap: lasso's diamond (x\u2081 selected, x\u2082 not) vs. ridge's circle (x\u2081 and x\u2082 both selected).", "So, what is ridge regression used for?"], "key": "Ridge doesn't select variables, so what's it good for?"}, {"p": "4\u201310", "title": "Ridge Regression: shrinking the solution", "points": ["Without the constraint, the solution is the linear regression solution at the center of the error ellipses.", "If that point is outside the circle a\u2081\u00b2 + a\u2082\u00b2 \u2264 \u03c4_Ridge, the ridge solution moves toward the origin: a\u2081 and a\u2082 are both smaller.", "The tighter the constraint (smaller circle), the smaller each coefficient gets.", "If the linear regression solution is already inside the circle, linear and ridge solutions are the same; \u03c4_Ridge must shrink to have an effect."], "key": "Ridge pulls all coefficients toward zero."}, {"p": "11\u201314", "title": "Coefficients Show Magnitude of Effect", "points": ["Effects x\u2081, x\u2082, \u2026, x\u2099 (variables) have magnitudes a\u2081, a\u2082, \u2026, a\u2099 (coefficients).", "If the model seems overfit (e.g., much worse on validation than training data), we can't remove only the random patterns, so we reduce fit to all patterns by shrinking every coefficient, moving left on the underfit\u2013overfit continuum.", "In bias-variance terms, smaller coefficients reduce variance. The professor calls this approach regularization.", "Making \u03c4_Ridge too small can lead to underfitting."], "key": "Ridge regression is a regularization tool for overfit linear models."}]}, {"lec": "M11 L3", "title": "Choosing a Variable Selection Model", "intro": "How to choose among greedy methods, LASSO, ridge and elastic net, including their pros and cons and the role of human judgment.", "topics": ["Greedy methods for initial analysis", "Lasso vs. ridge vs. elastic net formulas", "Prediction error from bias and variance", "Elastic net pros and cons", "Correlated variables in LASSO"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: forward selection, backward elimination, stepwise regression, LASSO, elastic net.", "This lesson: method selection."], "key": "How to pick a variable selection method."}, {"p": "4\u20138", "title": "Comparison", "points": ["Forward selection, backward elimination and stepwise regression: good for initial analysis, but often don't perform as well on other data (they can fit random effects and look better than they are, e.g., higher R-squared).", "Stepwise is the most common of the first three.", "LASSO and elastic net: slower but better prediction. The professor recommends them except for introductory data exploration."], "key": "Greedy for quick exploration; LASSO/elastic net for the final model."}, {"p": "9\u201313", "title": "Regularized Regression", "points": ["Lasso (some coefficients forced to 0 to simplify model): minimize \u03a3\u1d62 (y\u1d62 \u2212 (a\u2080 + a\u2081x\u2081\u1d62 + \u2026 + a\u2c7cx\u2c7c\u1d62))\u00b2 subject to \u03a3|a\u2c7c| \u2264 T.", "Ridge (coefficients shrink toward 0 to reduce variance in estimate): same objective, subject to \u03a3a\u2c7c\u00b2 \u2264 T.", "Elastic net: same objective, subject to \u03bb\u03a3|a\u2c7c| + (1 \u2212 \u03bb)\u03a3a\u2c7c\u00b2 \u2264 T, i.e., the lasso term plus the ridge term.", "The professor notes shrinking adds some bias but reduces variance in the coefficient estimates."], "key": "Elastic net = lasso's absolute-value term + ridge's quadratic term."}, {"p": "14\u201315", "title": "Prediction Error", "points": ["Prediction error is a function of bias and variance.", "Chart vs. model complexity: bias\u00b2 falls, variance rises, and prediction error is U-shaped.", "So trading some bias for less variance can give better predictive models."], "key": "Accepting some bias can reduce total prediction error."}, {"p": "16\u201317", "title": "Elastic net", "points": ["Advantages: variable selection benefits of LASSO and predictive benefits of ridge regression.", "Disadvantages: arbitrarily rules out some correlated variables like LASSO; underestimates coefficients of very predictive variables like ridge regression.", "The professor's example: two highly correlated medical tests, one cheap and one costly; LASSO might keep the expensive one, so check correlations yourself."], "key": "Elastic net combines both methods' strengths and weaknesses."}, {"p": "18\u201321", "title": "Which one to use?", "points": ["No good rule of thumb for when to use each approach.", "Compare the differences: if you have time to try one, try several.", "Analytics is an art; human input is always beneficial."], "key": "Try multiple methods and apply judgment."}]}], "n": 11}, {"module": "m12", "title": "Design of experiments", "lectures": [{"lec": "M12 L1", "title": "Introduction to Design of Experiments", "intro": "When the full data set is hard to get, design of experiments (DOE) plans which data to collect; introduces comparison/control and blocking.", "topics": ["When full data is hard to get", "Representative survey samples", "Comparison and control", "Blocking factors", "Red vs. blue used cars"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: data is given, or can be easily collected.", "This lesson: the full data set is hard to get, so we use Design of Experiments (DOE). The professor describes it as designing a way to collect the best subset of data quickly and efficiently, sufficient to answer our questions."], "key": "DOE plans data collection when we can't get all the data."}, {"p": "4\u20136", "title": "Design of Experiments (DOE): banner ads", "points": ["Example: advertise Georgia Tech's Master of Science in Analytics degree.", "Two ads are designed (shown side by side); which is better, i.e., which gets more people to click?"], "key": "Choosing between designs is a DOE question."}, {"p": "7", "title": "Design of Experiments (DOE): online retailer", "points": ["Example: an online retailer's page showing \"related to items you've viewed\".", "Which similar or related products should it show? The professor adds: also which complementary products might lead to a larger purchase."], "key": "Retailers must decide which product mix to show customers."}, {"p": "8\u201314", "title": "Design of Experiments (DOE): surveys and more", "points": ["Surveys: surveying everyone is too expensive, so we need a representative sample.", "Many dimensions, not so many data points: the professor's poll example needs representative combinations of sex, age group and other factors while surveying only about 600 people.", "Other uses: comparing combinations of medical treatments, maximizing agricultural productivity, determining factors that lead to a startup company's success."], "key": "Small samples must still represent many combinations of factors."}, {"p": "15\u201318", "title": "Comparison and Control", "points": ["Question: do red used cars sell for higher prices than blue used cars? Compare the prices.", "Need to control other factors besides color, such as age and sports cars vs. family cars.", "The professor's example: comparing two-year-old red Porsches with 10-year-old blue family cars would confound color with age and car type."], "key": "Compare like with like by controlling for other factors."}, {"p": "19\u201320", "title": "Blocking", "points": ["A blocking factor is something that creates variation.", "Example: sports car vs. family car (sports cars are more likely to be red).", "The professor notes analyzing red sports cars and red family cars separately gives lower variance than analyzing all red cars together."], "key": "Accounting for blocking factors reduces variability in estimates."}, {"p": "21", "title": "Summary", "points": ["Future: specific methods of DOE and how they work."], "key": "Next: specific DOE methods."}]}, {"lec": "M12 L2", "title": "A/B Testing", "intro": "A/B testing chooses between two alternatives by randomly showing each, collecting data and running a hypothesis test, with conditions for when it works.", "topics": ["Two banner ad versions", "Click-through hypothesis test", "Conditions for valid A/B test", "Sample small relative to population"], "slides": [{"p": "2", "title": "Overview", "points": ["Previously: the need for design of experiments.", "This lesson: choosing the best out of several alternatives."], "key": "Starting with the simplest case: two alternatives."}, {"p": "3\u20135", "title": "A/B testing: banner ads", "points": ["Example: two different versions of a Georgia Tech banner ad (\"MS in Analytics\" vs. \"Master of Science in Analytics Degree\").", "How to decide which ad to show? The professor suggests randomly showing one or the other for, say, the first 2,000 displays and tracking clicks."], "key": "Collect data instead of arguing about which ad is better."}, {"p": "6\u20139", "title": "A/B testing: results", "points": ["Case 1: Ad A got 46 clicks in 1003 uses (5%); Ad B got 97 clicks in 997 uses (10%). Hypothesis test: B is significantly better.", "Case 2: Ad A 46/1003 (5%); Ad B 47/997 (5%). Hypothesis test: no significant difference.", "The professor notes this is essentially binomial data for each ad."], "key": "A simple hypothesis test tells whether one alternative is really better."}, {"p": "10\u201313", "title": "A/B testing: requirements", "points": ["Use to choose between two alternatives when: 1. data can be collected quickly;", "2. data is representative of the population the answer will be used on;", "3. the amount of data is small compared to the whole population (the professor's example: testing on 2,000 of only 2,500 expected views leaves little benefit)."], "key": "A/B testing needs fast, representative, relatively small samples."}, {"p": "14\u201315", "title": "Summary", "points": ["A/B testing tests which of two alternatives is better; a common approach in marketing.", "Future: what if there are several alternatives, and how to figure out the best one?"], "key": "Next: more alternatives and more factors."}]}, {"lec": "M12 L3", "title": "Factorial Designs", "intro": "Full and fractional factorial designs for measuring the impact of multiple factors, balanced designs, and using regression when factors are independent.", "topics": ["Full factorial design", "ANOVA for factor importance", "Fractional factorial design", "Balanced design", "Regression with independent factors"], "slides": [{"p": "2", "title": "Overview", "points": ["Previously: A/B testing to compare two alternatives, e.g., which banner ad generates more clicks.", "This lesson: compare the impact of multiple factors."], "key": "From which ad is better to why it's better."}, {"p": "3\u20135", "title": "Factorial design: full factorial", "points": ["The two ads differ in font, wording and background color.", "Full factorial design: test every combination, 2 fonts \u00d7 2 wordings \u00d7 2 backgrounds = 8 combinations; use ANOVA to determine the importance of each factor.", "What if there are many combinations? 7 factors with 3 choices each = 3\u2077 = 2187 combinations, often too many to test."], "key": "Testing every combination grows exponentially with factors."}, {"p": "6", "title": "Factorial design: fractional factorial", "points": ["Fractional factorial design: test a subset of combinations.", "Tables compare the 8-row full design (font \u00d7 MS in Analytics/Master of Science in Analytics \u00d7 White/Gold) with a 4-row fractional design.", "Balanced design: test each choice the same number of times (here twice) and each pair of choices the same number of times (here once)."], "key": "A balanced subset can still measure every factor's effect."}, {"p": "7", "title": "Independent Factors", "points": ["If factors are independent, test a subset of combinations and use regression to estimate effects, with a categorical variable per factor.", "Example: background color (gold, blue, white) and font size (10, 12, 14 point).", "Background color and font color are not independent (a white font on a white background fails), so interaction terms may be needed."], "key": "Regression works when factors don't interact much."}, {"p": "8", "title": "Summary", "points": ["Factorial design: use before collecting data, to determine effects of factors.", "Full factorial design tests all combinations; partial factorial design estimates all effects by comparing some combinations.", "The professor also mentions response surface methodology, which allows squared terms as well as linear ones."], "key": "Plan factorial tests before collecting data."}]}, {"lec": "M12 L4", "title": "Multi-Armed Bandits", "intro": "Testing many alternatives while balancing exploration (more information) against exploitation (immediate value), using the multi-armed bandit approach.", "topics": ["Exploration vs. exploitation", "Lost value from fixed testing", "One-armed bandit slot machine", "Updating probability each is best", "Bandit algorithm parameters"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: A/B testing two banner ad designs with a basic hypothesis test.", "This lesson: what if there are more alternatives?"], "key": "Extending testing to many alternatives."}, {"p": "4\u20137", "title": "Exploration vs. Exploitation", "points": ["Example with 10 alternatives: 10,000 tests (1,000 on each).", "Only the 1,000 tests on the best ad got maximum value; 9,000 tests lost value.", "Tradeoff: more information vs. immediate value, i.e., exploration vs. exploitation."], "key": "Every test on a worse option costs value."}, {"p": "8\u201311", "title": "Multi-Armed Bandit: the name", "points": ["A single slot machine is a one-armed bandit; the professor explains: one lever arm, and calibrated to give the player negative expected value.", "Several slot machines with unknown payouts: a multi-armed bandit. Finding the best requires testing them."], "key": "The name comes from choosing among slot machines."}, {"p": "12\u201317", "title": "Multi-Armed Bandit: the approach", "points": ["K alternatives; start with no information, so each has equal probability of being selected.", "Repeat: choose an alternative to test based on the probability of each being best; after testing, update the probabilities of each being best.", "Continue until the best alternative is clear. The professor notes this keeps exploring while making better options more likely (exploiting)."], "key": "Shift tests toward likely winners as evidence accumulates."}, {"p": "18\u201321", "title": "Parameters in the iteration", "points": ["Number of tests between recalculating probabilities.", "How to update the probabilities (the professor mentions Bayesian updates or estimating from observed distributions).", "How to pick an alternative to test, based on probabilities and/or expected values."], "key": "Several design choices control how the bandit behaves."}, {"p": "22\u201324", "title": "Summary", "points": ["There's no simple rule for the best parameter choices.", "Better than running a fixed, large number of tests; worthwhile because it learns faster on the fly and creates more value."], "key": "Bandits learn while earning."}]}], "n": 12}, {"module": "m13", "title": "Probability-based models and simulation", "lectures": [{"lec": "M13 L1", "title": "Introduction to Advanced Probability Distributions", "intro": "Why simple probability-distribution models are sometimes all you need, illustrated by predicting when season ticket holders won't show up.", "topics": ["Simple models can beat complex ones", "Season ticket seat upgrades", "Factors for no-show prediction", "Arrival time relative to crowd"], "slides": [{"p": "2", "title": "Overview", "points": ["This lesson: probability distributions and what they can tell us. The professor calls them a very underappreciated analytics tool."], "key": "Probability distributions can give insight on their own."}, {"p": "3\u20136", "title": "Simple Modeling", "points": ["Sometimes simple approaches work better.", "The professor's consulting examples: security lane flow at the Atlanta airport (after September 11), whether a season ticket holder will show up for a sporting event, staffing and promotions at a fast-food chain, etc."], "key": "Try a simple model before a big-data model."}, {"p": "7\u201311", "title": "Example: season ticket holder no-shows", "points": ["Predict when a season ticket holder might not show up for a game.", "Goal: improve fan experience and increase profit. Idea: upgrade fans at the game to unused season ticket seats.", "At what point should the seat upgrade be sold? Benefit of selling earlier: the upgraded customer is happier. Drawback: what if the ticket holder shows up?"], "key": "Selling upgrades earlier is worth more but riskier."}, {"p": "12\u201313", "title": "Example: the question", "points": ["Determine the earliest time they should sell the seat upgrade.", "Pause and think about factors to include in a predictive model."], "key": "Viewers are asked to brainstorm predictive factors."}, {"p": "14\u201319", "title": "Example: possible factors", "points": ["Season ticket holder factors: age, marital status, children, career, past arrival data.", "Team factors: how well the team is playing, standings, star players.", "Game factors: opponent, special milestones, giveaways, special significance of the game. Day factors: day of week, holiday, season, weather, traffic.", "Lots of data!"], "key": "A full predictive model would need a huge amount of data."}, {"p": "20\u201321", "title": "Example: simple distribution analysis", "points": ["Do a simple probability-distribution analysis first: arrival time before the game, relative to everyone else.", "Example: season ticket holder X tends to arrive after about 60% of others arrive, and this didn't depend much on other factors. The professor adds the deviation was modeled well by a normal distribution.", "Conclusion: use a simple probability distribution, tracking how the stadium fills, to help answer the company's question."], "key": "A simple distribution answered the question without the extra data."}, {"p": "22", "title": "Summary", "points": ["Sometimes a simple model is all you need.", "Probability distributions can form the backbone of such simple models."], "key": "Don't skip the simple probability model."}]}, {"lec": "M13 L2", "title": "Bernoulli, Binomial and Geometric Distributions", "intro": "What the Bernoulli, binomial and geometric distributions are good at modeling, and how to use the geometric distribution to test whether trials are i.i.d.", "topics": ["Bernoulli coin flip", "Charity donation consistency", "Binomial converges to normal", "Trials until first success", "Testing i.i.d. with geometric fit", "Airport screening example"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: matching data to a probability distribution.", "This lesson: specific distributions (binomial, geometric), focusing on modeling and use rather than formulas to memorize."], "key": "Focus on what each distribution models."}, {"p": "4", "title": "Bernoulli Distribution", "points": ["Like flipping a coin, but it might not be 50/50.", "Probability mass function: P(X = 1) = p, P(X = 0) = 1 \u2212 p.", "Useful when we start doing multiple \"coin flips\"."], "key": "Bernoulli models a single yes/no event."}, {"p": "5\u20136", "title": "Example: charity donations", "points": ["A charity asks 1/12 of its mailing list for donations each month.", "For each person, P(sends donation) = p and P(does not send donation) = 1 \u2212 p.", "Assumptions: donations are the same size, and p does not change month to month. The number of donations each month is then binomially distributed.", "The professor notes the charity can test whether p changed by checking how likely the observed count is under the binomial."], "key": "Summing Bernoulli trials gives a binomial count."}, {"p": "7\u20139", "title": "Binomial Distribution", "points": ["Probability of getting x successes out of n independent identically distributed Bernoulli(p) trials.", "PMF: P(X = x) = (n choose x) p\u02e3(1 \u2212 p)\u207f\u207b\u02e3 = [n!/((n \u2212 x)! x!)] p\u02e3(1 \u2212 p)\u207f\u207b\u02e3, with a plot of the probabilities f(x).", "For large n, the binomial converges to the normal distribution (handy since huge factorials get messy)."], "key": "Binomial counts successes; for large n use the normal approximation."}, {"p": "10\u201313", "title": "Example: how many trials until\u2026", "points": ["How many interviews until the first job offer? Or how many job offers until someone accepts?", "How many hits until a baseball bat breaks? How many good units manufactured before a defective one?", "How many Bernoulli trials until\u2026 is the geometric distribution."], "key": "\"How many tries until\" questions are geometric."}, {"p": "14\u201315", "title": "Geometric Distribution", "points": ["PMF: P(X = x) = (1 \u2212 p)\u02e3 p, with a decreasing bar plot of f(x).", "Probability of having x Bernoulli(p) failures until the first success, or x Bernoulli(1 \u2212 p) successes until the first failure.", "The professor warns to think carefully about which outcome p refers to (it can be a good or a bad outcome)."], "key": "Define p as the probability of the outcome that ends the run."}, {"p": "16\u201319", "title": "Geometric Distribution: testing i.i.d.", "points": ["Assumes each Bernoulli trial is independent and identically distributed (i.i.d.).", "Can compare data to the geometric distribution to test whether i.i.d. is true.", "Example, hits until a baseball bat breaks: if it fits a geometric distribution, hits are i.i.d. Bernoulli trials; if it doesn't fit, hits are not i.i.d. and other factors need to be considered."], "key": "A geometric fit suggests independent, identical trials."}, {"p": "20\u201323", "title": "Geometric Distribution Example: airport screening", "points": ["Are security personnel more likely to pull someone aside if there hasn't been a search in a while?", "Plot the number of people passed through before each search. Left chart: data close to geometric, so each person is screened independently.", "Right chart: data not close to geometric, so recent history affects decision making."], "key": "Comparing to geometric reveals whether screeners act independently."}, {"p": "24", "title": "Summary", "points": ["Bernoulli: like flipping a coin. Binomial: count of successful flips in n trials.", "Geometric: unsuccessful flips before the first success."], "key": "Three distributions built from Bernoulli trials."}]}, {"lec": "M13 L3", "title": "Poisson, Exponential and Weibull Distributions", "intro": "The Poisson, exponential and Weibull distributions, what they model (arrivals, inter-arrival times, time to failure) and cautions about distribution-fitting software.", "topics": ["Poisson random arrivals", "Exponential inter-arrival times", "ATL security line data", "Weibull time to failure", "Weibull shape parameter k", "Distribution-fitting software caution"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: matching data to a probability distribution.", "This lesson: Poisson, exponential, Weibull, focusing on modeling and use."], "key": "Distributions for arrivals and failures."}, {"p": "4\u20137", "title": "Poisson Distribution", "points": ["Probability mass function f(x) = \u03bb\u02e3e^\u2212\u03bb / x!, with a plot of probabilities for x = 0 to 20.", "Good at modeling random arrivals; \u03bb = average number of arrivals per time period.", "Arrivals are independent and identically distributed (i.i.d.)."], "key": "Poisson counts i.i.d. random arrivals per period."}, {"p": "8\u20139", "title": "Exponential Distribution", "points": ["As printed, \"Probability Mass Function\": f(x) = \u03bbe^\u2212\u03bbx, with a decreasing density plot.", "Relation to Poisson: if arrivals are Poisson(\u03bb), time between successive arrivals is exponential(\u03bb). Poisson arrivals \u27fa exponential inter-arrival times.", "The professor notes the average inter-arrival time is 1/\u03bb."], "key": "Exponential inter-arrival times go with Poisson arrivals.", "watch": "The slide labels this a probability mass function; the exponential is continuous, so f(x) is a probability density function."}, {"p": "10\u201311", "title": "Example: security line delays at ATL", "points": ["After September 11, 2001, stricter U.S. airport rules caused long security delays at Atlanta's airport; Georgia Tech helped out.", "Collected inter-arrival times (easier than counting arrivals per period); they turned out to be exponentially distributed.", "So the arrival process was Poisson, which the professor says helped build the simulation model."], "key": "Measuring inter-arrival times revealed Poisson arrivals."}, {"p": "12\u201315", "title": "Weibull Distribution", "points": ["As printed, \"Probability Mass Function\" with scale parameter \u03bb and shape parameter k: f(x) = (k/\u03bb)(x/\u03bb)\u1d4f\u207b\u00b9e^\u2212(x/\u03bb)\u1d4f.", "Weibull: time between failures. Geometric: number of tries between failures.", "Lightbulb example: how many light-switch flips until the bulb fails? (geometric). Leave the bulb on; how long until it fails? (Weibull)"], "key": "Weibull models time to failure; geometric models tries to failure.", "watch": "The slide says probability mass function; Weibull is continuous, so this is a probability density function."}, {"p": "16\u201318", "title": "Weibull Distribution: shape parameter k", "points": ["k < 1: failure rate decreases with time, \"worst things fail first\" (e.g., parts with defects).", "k > 1: failure rate increases with time, \"things that wear out\" (e.g., tires).", "k = 1: failure rate is constant with time."], "key": "k tells whether failures become rarer, more common or stay constant."}, {"p": "19", "title": "Weibull Distribution: k = 1", "points": ["f\u2096(x) = (k/\u03bb)(x/\u03bb)\u1d4f\u207b\u00b9e^\u2212(x/\u03bb)\u1d4f. If k = 1, Weibull = exponential: f\u2081(x) = (1/\u03bb)e^\u2212(x/\u03bb).", "Replace \u03bb with 1/\u03bb to get the exponential distribution. The professor jokes the two notations were never coordinated."], "key": "The exponential is a special case of the Weibull."}, {"p": "20", "title": "Data fitting", "points": ["Software input: a set of data. Outputs: fits to various distributions and their parameters.", "Warning: only use software output as guidance. Example: software returns Weibull with k = 1.002; it might be better to use exponential (Weibull with k = 1).", "Remember data may have random noise in it; think about what the output means before using it."], "key": "Don't let fitting software overfit noise with extra parameters."}]}, {"lec": "M13 L4", "title": "Q-Q Plots", "intro": "Quantile-quantile plots for visually checking whether two data sets, or a data set and a probability distribution, have about the same distribution.", "topics": ["Plotting matching quantiles", "45-degree line comparison", "Mismatched tails", "Data vs. theoretical quantiles", "Why visualize instead of test"], "slides": [{"p": "2\u20134", "title": "Overview", "points": ["This lesson: visualizing whether two distributions are about the same, or whether a data set is distributed similarly to a probability distribution.", "Statistical tests can hide details, so visualization is sometimes important."], "key": "A plot can show what a single test statistic hides."}, {"p": "5\u20137", "title": "Q-Q Plot: building it", "points": ["Axes: sample 1 quantiles (horizontal, 0\u201370) and sample 2 quantiles (vertical, 0\u201360).", "The professor explains that similar distributions should have about the same value at each quantile, even with different numbers of data points.", "Plot each quantile pair, e.g., the 50th percentile (median) of sample 1 vs. that of sample 2, then the 25th percentile, and so on."], "key": "Each point pairs the same percentile from both data sets."}, {"p": "8\u20139", "title": "Q-Q Plot: good and poor matches", "points": ["If the data sets match, points fall on or near the 45-degree line.", "Comparison plot: in the poor match, sample 2 has higher values at both the low and high ends of the range.", "The professor notes the plot shows how they differ, which a test result alone wouldn't."], "key": "Distance from the 45-degree line shows where distributions differ."}, {"p": "10\u201311", "title": "Q-Q Plot: tails", "points": ["Points match well everywhere except the very ends of the upper and lower tails.", "The professor notes a statistical test might call this a good match, but if the project is about extreme values, the Q-Q plot shows it isn't."], "key": "Check the tails when extreme values matter."}, {"p": "12", "title": "Q-Q Plots: data vs. a distribution", "points": ["Test whether a single data set is a good fit to a probability distribution.", "Horizontal axis: the data. Vertical axis: theoretical values of the percentiles (calculated or simulated)."], "key": "Q-Q plots also compare data to a theoretical distribution."}, {"p": "13", "title": "Q-Q Plots: reading shapes", "points": ["Example plot: for lower quantiles sample 2 has larger values and for higher quantiles smaller values, so sample 2 is squashed toward the middle.", "The professor says understanding how to read plots matters more than memorizing shapes."], "key": "Read Q-Q plots by reasoning, not memorization."}]}, {"lec": "M13 L5", "title": "Queuing", "intro": "Using Poisson and exponential distributions to model queues, closed-form results for simple queues, the memoryless property and Kendall notation.", "topics": ["Telemarketing autodialer queue", "Arrival rate \u03bb and service rate \u03bc", "Single-server queue formulas", "Memoryless property", "Tire failure lawsuit example", "Kendall notation"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: probability distributions.", "This lesson: using distributions to model queues."], "key": "From fitting distributions to modeling system behavior."}, {"p": "4\u20139", "title": "Queuing Example: telemarketing", "points": ["An autodialer automatically calls phone numbers; if a call is answered, it is put into a queue (waiting line).", "How many employees should we have? Based on how many people answer the autodialer and how long calls last once an employee is on the phone.", "Diagram: calls arrive to the queue based on a distribution of time between arrivals; employees answer calls; calls finish based on a distribution of talking time."], "key": "Staffing depends on arrival and service distributions."}, {"p": "10\u201311", "title": "Queuing Example: simple case", "points": ["Poisson(\u03bb) call arrivals, a queue of calls to be handled, 1 employee, exponential(\u03bc) call times.", "Can calculate: expected fraction of time the employee is busy, expected waiting time before talking to the employee, expected number of calls waiting in queue, etc."], "key": "Poisson arrivals with exponential service give computable answers."}, {"p": "12", "title": "Queuing Example: formulas", "points": ["Arrival rate = \u03bb; service rate = \u03bc > \u03bb.", "Transition equations (\u2265 1 call in the queue): P(next event is an arrival) = \u03bb/(\u03bb + \u03bc); P(next event is a finished call) = \u03bc/(\u03bb + \u03bc).", "Expected fraction of time busy = \u03bb/\u03bc; expected waiting time = \u03bb/(\u03bc(\u03bc \u2212 \u03bb)); expected number of calls waiting in queue = \u03bb\u00b2/(\u03bc(\u03bc \u2212 \u03bb))."], "key": "Closed-form queue measures follow from \u03bb and \u03bc."}, {"p": "13", "title": "Queuing Example: more complex", "points": ["A more complex example: Poisson(\u03bb) arrivals, 2 employees, exponential(\u03bc) call times (the professor adds a limit of four calls in the system).", "Closed-form answers still exist, due to the memoryless property."], "key": "Memorylessness keeps more complex queues solvable."}, {"p": "14\u201316", "title": "Memoryless Property", "points": ["Exponential is memoryless: the distribution of remaining call time = the initial distribution of call time.", "Poisson is memoryless: the distribution of time to next arrival = the initial distribution; Poisson inter-arrival times are exponentially distributed.", "Data fits exponential \u27f9 memoryless; not memoryless \u27f9 not exponential."], "key": "Fitting an exponential tells you the process has no memory."}, {"p": "17\u201318", "title": "Memoryless Property: law firm example", "points": ["Should a tire manufacturer pay damages for an accident when a tire with 10,000 miles failed? Probability(tire fails at 10,000 miles) = ?", "Tires are more likely to fail the more worn out they are, so tire failure is not memoryless and can't be modeled with the exponential.", "Maybe try Weibull with k > 1."], "key": "Wear-out processes need a Weibull, not an exponential."}, {"p": "19\u201324", "title": "Queuing Models: parameters", "points": ["Potential parameters: general arrival distribution [A], general service distribution [S], number of servers [c], size of the queue [K], population size [N], queuing discipline [D].", "Kendall notation describes these (e.g., \"M/M/1 queue\").", "The professor mentions extensions outside Kendall notation, like hanging up after waiting too long or balking at a long line, which make the math hard."], "key": "Kendall notation summarizes a queue's structure."}, {"p": "25", "title": "Summary", "points": ["Queuing models and the memoryless property.", "Future: simulation."], "key": "When queue math gets too hard, simulate."}]}, {"lec": "M13 L6", "title": "Simulation Basics", "intro": "Types of simulation, why discrete-event stochastic simulation is valuable for variable systems, simulation software elements, replications and validation.", "topics": ["Deterministic vs. stochastic simulation", "Continuous-time vs. discrete-event", "Wafer machine queue example", "Entities, modules, resources", "Replications", "Validating against real data"], "slides": [{"p": "2", "title": "Overview", "points": ["Simulation: build a model to watch its behavior.", "Examples: manufacturing processes, airport security lines, freight train dispatching, etc."], "key": "Simulation lets us study a system by running a model of it."}, {"p": "3\u20134", "title": "Types of Simulations: randomness", "points": ["Deterministic simulations: same inputs give the same outputs (no randomness).", "Stochastic simulations: used when the system has randomness; the focus of this lesson."], "key": "Stochastic simulations model randomness."}, {"p": "5\u20136", "title": "Types of Simulations: time", "points": ["Continuous-time simulations: changes happen continuously (e.g., chemical processes, propagation of diseases), often modeled with differential equations.", "Discrete-event simulations: changes happen at discrete time points, e.g., call center simulations when someone calls or a worker finishes talking to someone. The focus of this lesson."], "key": "Discrete-event simulation updates only when events happen."}, {"p": "7\u20139", "title": "Simulation: why use it", "points": ["Discrete-event stochastic simulations are valuable when systems have high variability; using average values isn't good enough.", "Example: a machine in a manufacturing process. The professor's numbers: wafers arrive every 20 seconds and take 19 seconds on average, so with no variability there's never a delay.", "Animation (Arena software) with Poisson arrivals and exponential processing: a large queue sometimes builds, about 19 wafers waiting on average."], "key": "Variability creates queues that averages hide."}, {"p": "10\u201313", "title": "Simulation: examples", "points": ["Airport baggage simulation (two concourses with gates): decide how many baggage tugs are needed and where.", "Cancer treatment clinic: building layout and staff, to find the right mix of workers and resources like exam rooms.", "Airline global flight network: help react to disruptions; the screen also shows the software's modeling elements."], "key": "Simulation handles complex real systems."}, {"p": "14", "title": "Simulation software", "points": ["Elements of a model include entities (things that move through the simulation, e.g., bags, people), modules (parts of a process, e.g., queues, storage), actions, resources (e.g., workers), decision points and statistical tracking.", "Often a \"drag and drop\" programming style.", "Under the hood: (pseudo) random number generation, tracking, animation, etc. The professor notes pseudo-random numbers matter if you code a simulation yourself."], "key": "Software assembles models from standard building blocks."}, {"p": "15", "title": "Replications", "points": ["Replications = number of runs of the simulation. One replication is one data point and may be unrepresentative.", "Run multiple times to get a distribution of outcomes.", "Example: a histogram of simulated average daily throughput across replications (bins from 150\u2013200 to 350\u2013400)."], "key": "Run many replications and look at the distribution."}, {"p": "16", "title": "Simulation Validation", "points": ["Use real data to validate that the simulation gives reasonable results.", "If real and simulated averages don't match, there's a problem; if averages match but variances don't, there's still a problem.", "Histograms compare simulated vs. actual throughput."], "key": "Validate both the mean and the spread against reality."}, {"p": "17", "title": "Summary", "points": ["This lesson: simulation basics.", "Future: simulations for prescriptive analytics."], "key": "Next: using simulation to make decisions."}]}, {"lec": "M13 L7", "title": "Prescriptive Simulation", "intro": "Using a validated simulation to answer what-if questions and compare alternatives, with care about randomness and input quality.", "topics": ["What-if questions with simulation", "Baggage tugs per gate", "Common random numbers", "Garbage in, garbage out", "Call center worker variability"], "slides": [{"p": "2", "title": "Overview", "points": ["Previously: simulation basics.", "This lesson: simulation for analysis."], "key": "Using simulations to decide what to do."}, {"p": "3\u20139", "title": "Simulation: asking \"what if?\"", "points": ["Simulation is useful for asking \"what if?\" questions.", "Examples: simulated change in throughput from investing in faster machines (the professor mentions $100,000), the value of hiring an extra call-center worker, where to station baggage tugs, etc.", "Compare simulation results across options; some simulation software can also do heuristic optimization of parameters (e.g., buffer sizes)."], "key": "Run the simulation under each option and compare."}, {"p": "10\u201313", "title": "Simulation Comparisons", "points": ["Example, baggage system: how many tugs at each gate? Simulation 1: one tug per gate. Simulation 2: one tug per two gates.", "Compare metrics, e.g., the fraction of bags that get to baggage claim in 20 minutes or less.", "Be careful: one set of \"random\" observations could be better than another. Avoid this by using the same random numbers in both, so each replication is a paired scenario."], "key": "Use common random numbers for fair comparisons."}, {"p": "14\u201315", "title": "Simulation Comparisons: caveat", "points": ["Simulation can be a powerful tool, but the model is only as good as the quality of its input; missing or incorrect information may lead to incorrect answers.", "Example: a call center simulation assumed workers answer calls equally quickly, but there was lots of variability between workers. The wrong assumption can lead to costly bad decisions."], "key": "Bad assumptions in, bad decisions out."}, {"p": "16", "title": "Summary", "points": ["Simulation as an analytics tool.", "Interested in learning more? Check out the Georgia Tech simulation course."], "key": "Simulation is a key prescriptive tool."}]}, {"lec": "M13 L7a", "title": "Example: The Difficulty of Validating a Simulation", "intro": "A disease-spread research example showing why validating a simulation can be hard and how simulating the data collection process solved it.", "topics": ["Validating systems that don't exist", "Two interacting diseases", "Multiple validation metrics", "Contact-tracing sampling bias", "Simulating data collection"], "slides": [{"p": "2\u20134", "title": "Validation Can Be Hard", "points": ["Easier to validate: a simulation of something that exists, by comparing performance metrics of simulation vs. reality.", "Harder to validate: a simulation of something that doesn't exist (e.g., a redesigned baggage system)."], "key": "Without a real system to compare, validation is harder."}, {"p": "5", "title": "Validation Example", "points": ["Spread of two interacting diseases (from the professor's PhD student's research).", "Matching disease prevalence doesn't work: multiple models match after D simulated days but give very different results after D + 7 days.", "At least one is wrong, but which? If we can't tell which model is right, we can't tell what's a good public health policy."], "key": "Matching one metric can't distinguish between models."}, {"p": "6\u20137", "title": "Deeper Validation", "points": ["Multiple measures of disease spread: overall prevalence, distribution of disease cluster size, largest disease cluster size, other structural metrics.", "Need matches in all metrics to show validation.", "Problem: the metrics didn't match up, even though medical parameters were up to date."], "key": "Validate on several metrics, not just one."}, {"p": "8\u201313", "title": "Answer: Simulated Data Collection!", "points": ["In the whole simulated population, 12 out of 41 = 29% have the disease.", "Real data came from contact tracing: start with a volunteer with the disease and check their contacts, and so on. The sample grows as 1 out of 1 = 100%, 4 out of 6 = 66.7%, 7 out of 12 = 58.3%, 7 out of 14 = 50% have the disease.", "So the collected data overestimates prevalence (and cluster size) compared with the true 29%."], "key": "The real data was biased by how it was collected."}, {"p": "14\u201316", "title": "Solution", "points": ["Simulation 1: simulate disease propagation.", "Simulation 2: given the simulated propagation, simulate data collection.", "The professor notes the results then matched in all metrics, and this was the only model tested that did."], "key": "Simulate the measurement process too, then compare to real data."}]}, {"lec": "M13 L8", "title": "Markov Chains", "intro": "Markov chain models based on system states and transition probabilities, steady-state probabilities, the memoryless assumption, and applications like web page ranking.", "topics": ["Transition matrix", "Weather states example", "Steady-state probabilities", "Memoryless assumption limits", "PageRank-style web ranking"], "slides": [{"p": "2", "title": "Overview", "points": ["This lesson: the Markov chain model, based on states of a system."], "key": "Markov chains model movement between states."}, {"p": "3\u20135", "title": "Markov Chains: transition matrix", "points": ["For each state i, p\u1d62\u2c7c = transition probability from state i to state j; P = {p\u1d62\u2c7c} is the transition matrix.", "Weather example (rows = today, columns = tomorrow: Sunny, Cloudy, Rainy): Sunny .75, .15, .10; Cloudy .20, .40, .40; Rainy .40, .30, .30."], "key": "The transition matrix holds all one-step probabilities."}, {"p": "6\u20139", "title": "Markov Chains: multi-step probabilities", "points": ["Question: long-run probability of rainy days?", "Given \u03c0 = (.5, .25, .25) = probabilities of (Sunny, Cloudy, Rainy) today, \u03c0P = (.525, .25, .225) gives tomorrow's probabilities.", "(\u03c0P)P = (.53375, .24625, .22) gives the day after tomorrow."], "key": "Multiply by P once per step forward."}, {"p": "10\u201314", "title": "Markov Chains: steady state", "points": ["Could calculate (((\u03c0P)P)P)P\u2026 = \u03c0P^\u221e, but instead use the \"steady state\".", "In steady state, applying P gives the vector back: \u03c0*P = \u03c0*. Solve \u03c0*P = \u03c0* with \u03a3\u1d62\u03c0*\u1d62 = 1.", "It might not always exist: there can't be cyclic behavior, and every state must be reachable from all others."], "key": "Steady-state probabilities solve \u03c0*P = \u03c0*."}, {"p": "15", "title": "Markov Chains \u2013 Key Assumption", "points": ["Memoryless: state transitions only depend on the most recent state (tomorrow's weather depends only on today's).", "Most systems do not exhibit this property, so why learn about Markov chains?"], "key": "Memorylessness is the main limitation."}, {"p": "16\u201320", "title": "Markov Chains: web search example", "points": ["States are the web pages on a topic (Pages A\u2013E in the diagram).", "For pages i, j: p\u1d62\u2c7c = p if page i links to page j, 0 if not. The Markov chain is jumping randomly from page to page.", "Use the steady-state probabilities to rank web pages: Google PageRank (sort of)."], "key": "Steady-state visit frequency can rank pages."}, {"p": "21", "title": "Markov Chains: other applications", "points": ["The professor's research: ranking college basketball teams (LRMC).", "Urban sprawl, population dynamics, disease propagation: not memoryless in the short run, but that doesn't matter for long-run system dynamics."], "key": "Useful for long-run analysis even when short-run memory exists."}, {"p": "22", "title": "Summary", "points": ["Markov chain modeling is not so common; its limitation is the assumption that the system is memoryless.", "Powerful in some cases."], "key": "A niche but powerful tool."}]}], "n": 13}, {"module": "m14", "title": "Missing data", "n": 14, "lectures": [{"lec": "M14 L1", "title": "Introduction to Missing Data", "intro": "Models usually assume every data value is available. This lecture shows how often data goes missing in practice and why the pattern of what's missing matters as much as how much is missing.", "topics": ["Where missing data comes from", "Missing vs wrong data", "Some factors are missing more often", "Bias: some values are missing more often", "Censored data (date of death)"], "slides": [{"p": "2\u20134", "title": "Overview", "points": ["Previously: analytics models built on data, assuming we know all of it. In regression, for example, every x_ij (factor j of data point i) is assumed to be there.", "This lesson: what if some of the data is missing?", "The transcript's point: data sets can easily hold billions of values, so it would be surprising if none were missing."], "key": "Real data sets almost always have some missing values.", "watch": "Big data sets don't avoid the problem; more values means more chances for some to be missing."}, {"p": "5\u20137", "title": "Missing data: where it comes from", "points": ["National temperature study (thousands of locations, hourly readings): gauges break down, and readings are lost until they're replaced.", "Biometric study with a wireless device sending readings every 10 seconds: transmission sometimes breaks up.", "Human interaction: people fill in forms incorrectly or skip fields (sometimes on purpose, e.g. leaving out a phone number), don't know parts of their medical history, and data can be unavailable because of something upstream (e.g. a data set bought from another company)."], "key": "Machines, transmission and people all cause missing values.", "watch": "Some data is left out on purpose, which is one reason missing values can follow a pattern."}, {"p": "8", "title": "Data problems", "points": ["Two kinds of problem: missing data and wrong data (a mistyped number, a garbled transmission, a value in the wrong field).", "Wrong data that is far from the rest is an outlier, covered in its own lesson (Module 5).", "There are often patterns in missing or wrong data."], "key": "Missing and wrong data are both common, and both can have patterns.", "watch": "This module is about missing values; very wrong values are handled as outliers."}, {"p": "9\u201313", "title": "Patterns in missing data", "points": ["Some data is more likely to be missing than other data.", "Transplanted livers: the recipient's sex is easy to record and is in standard records; whether they had headaches the week before must be asked and is often not recorded. One factor having more missing values than another is manageable.", "Income: people with higher incomes are more likely to leave the income question blank.", "Radar gun: more reliable at normal speeds; a very slow car may be treated as an anomaly and not recorded.", "Bias in the missing data: when certain values are more likely to be missing, the data you do have is not a fair sample.", "The transcript adds a related case: in heart transplant survival data, 'date of death' is missing for everyone still alive, so the missing values are mostly the successful transplants (censored data)."], "key": "The harder problem is when certain values (not just certain factors) are more likely to be missing.", "watch": "'This factor has more missing values' (fine) is different from 'high values of this factor are more likely to be missing' (biased)."}, {"p": "14", "title": "Summary", "points": ["Next: how to deal with missing data."], "key": "The next two lessons give the methods."}]}, {"lec": "M14 L2", "title": "Methods that Don't Require Imputation", "intro": "Three options exist when a data point has missing values: throw it away, mark it with a categorical variable, or estimate the value. This lecture covers the first two, which avoid guessing what the missing value is.", "topics": ["Three options for missing data", "Throwing away data points", "Adding a 'missing' category", "Zero plus a missing indicator for numeric factors", "Interaction terms split the model in two"], "slides": [{"p": "2\u20134", "title": "Overview: three ways to deal with missing data", "points": ["Previously: data can be incomplete, with missing values.", "Three options: throw the data point away, use a categorical variable to indicate that data is missing, or estimate the missing value (imputation).", "The car table shows 7 cars with Color, Style, Miles and Price; car 2's Style and car 5's Miles are 'missing'.", "This lesson: ways of dealing with missing data without estimating it."], "key": "Discard, flag, or estimate: this lesson covers discard and flag.", "watch": "Estimating missing values is imputation, which is the next lesson."}, {"p": "5\u20139", "title": "Throw away", "points": ["Pros: it doesn't introduce errors from bad estimates, and it's easy to implement.", "Cons: you may lose too many data points, and the missing data may be censored or biased.", "Example: living transplant recipients. Patients with no date of death are more likely to be successful transplants, so dropping them makes the model too pessimistic about survival.", "Example: consumer purchasing. If high-income people don't report income, dropping them gives a model that predicts low and middle earners well but is poorly trained for high earners.", "Check the pattern of missing data before throwing points away."], "key": "Throwing away is easy and adds no estimation error, but can shrink and bias the data.", "watch": "Dropping censored points (patients still alive) biases survival estimates downward."}, {"p": "10\u201312", "title": "Categorical variable has missing data: add a 'missing' category", "points": ["If the factor with missing data is categorical, add one more category, 'missing'.", "Example: Employed (full, part, un-) becomes (full, part, un-, missing); the person with no answer gets 'missing'."], "key": "For a categorical factor, 'missing' is just another category.", "watch": "This keeps the data point and doesn't guess which category it belongs to."}, {"p": "13\u201315", "title": "Quantitative variable has missing data: zero plus an indicator", "points": ["If the factor is quantitative (e.g. height, number of children), set all missing values to 0 and add a new categorical variable saying whether the value is missing.", "Table: ID, Height, # kids; persons 4 and 6 have no height. They get Height = 0 and Missing? = Yes; everyone else gets Missing? = No."], "key": "Missing numeric value \u2192 0 plus a yes/no 'missing' flag.", "watch": "The 0 isn't an estimate of height; the flag tells the model those rows are different."}, {"p": "16\u201322", "title": "Missing data could be biased: include interactions", "points": ["Missing data could be biased: here, the data points with missing height are more likely to have more kids (persons 4 and 6 have 4 and 5 kids).", "Then the other variables' coefficients can be pulled one way or another to account for the missing points.", "Fix: include interaction terms between the missing indicator and the other variables. The table adds a '#kids,missing' column that equals # kids when height is present and 0 when it's missing.", "With interactions between the indicator and every other variable, each variable effectively appears twice (e.g. # kids when height is missing, # kids when it isn't).", "That splits the data into two models: 'Height data' (persons 1, 2, 3, 5) and 'No height data' (persons 4, 6). The transcript calls it a tree with a single branch."], "key": "Interacting the missing flag with every other variable gives two separate models: one for rows with the value, one without.", "watch": "The '#kids,missing' column holds # kids for rows where height is NOT missing (0 for missing rows), despite its name."}, {"p": "23\u201324", "title": "Summary", "points": ["Two ways of dealing with missing data: remove the points, or add categorical variables.", "Both avoid estimating what the missing data may be.", "Next: imputation."], "key": "Removing and flagging both avoid guessing the missing value."}]}, {"lec": "M14 L3", "title": "Imputation Methods", "intro": "Imputation estimates the missing values. This lecture compares three approaches that trade off simplicity and realism, then gives a limit on how much to impute and how to think about the extra error.", "topics": ["Mean, median or mode imputation", "Regression imputation", "Adding perturbation", "No more than 5% per factor", "Layers of error"], "slides": [{"p": "2\u20133", "title": "Overview", "points": ["Previously: missing data exists, and there are ways to deal with it without estimating the missing values.", "This lesson: imputation, which means estimating the missing values."], "key": "Imputation = estimating missing values."}, {"p": "4\u20137", "title": "First approach: midrange value", "points": ["Use the mean or median (numeric data) or the mode (categorical data) for every missing value of that factor.", "Advantages: it hedges against being too wrong, and it's easy to compute.", "Disadvantage: biased imputation. Example: people with high incomes are less likely to answer the survey, so the mean or median of the answers will underestimate the missing values.", "Table: incomes 18,000, 27,000, 45,000 and 84,000 answered; 64,000, 120,000 and 340,000 did not. The answered mean is 43,500 and the median 36,000, below every non-answer."], "key": "Mean/median/mode imputation is simple but biased when certain values are more likely to be missing.", "watch": "Mode is for categorical factors; mean or median for numeric ones."}, {"p": "8\u201310", "title": "Second approach: regression", "points": ["Build a model that predicts the missing factor from the other factors. Aim: reduce or eliminate the bias problem.", "Income example: predict income from factors such as zip code, profession and number of cars owned (table from Fast food server, $15,000, 0 cars, up to Dentist, $403,000, 4 cars).", "Disadvantages: complex (build, fit, validate and test a whole model just to estimate missing values), and it doesn't capture all the variability.", "The transcript adds: the data gets used twice (once to impute, once to fit the main model), so you could overfit. It usually gives better values than the mean."], "key": "Regression imputation is less biased but more work, and it gives every similar point the same value.", "watch": "'Regression' here means any predictive model of the missing factor; the transcript says 'a predictive model like regression'."}, {"p": "11\u201313", "title": "Imputation with variability (perturbation)", "points": ["Imputation doesn't capture all the variability, even with a regression model (e.g. doctors in one zip code with three cars have a wide range of incomes but get the same estimate).", "Impute with added variability: add a perturbation (a random amount up or down) to each imputed value, e.g. normally distributed variation based on the predictive model's error.", "Less accurate on average, but more accurate variability.", "The figure is a line from 'No perturbation' (more accurate on average, less accurate variability) to 'Perturbation distributed according to actual variability' (less accurate on average, more accurate variability)."], "key": "Perturbation trades accuracy of each value for a realistic spread of values.", "watch": "Perturbation makes each imputed value less accurate on average; it doesn't improve accuracy."}, {"p": "14\u201319", "title": "Imputation approaches: limits and errors", "points": ["Data used twice (overfitting risk), so limit the amount of imputation you do.", "Rule of thumb: no more than 5% per factor. Beyond that, the transcript suggests an alternative such as indicator (categorical) variables for missing data.", "Question: doesn't imputation add errors? Yes: imputation error + perturbation error + model error.", "Yes\u2026 but regular data also probably has errors (mis-read instruments, typos, badly calibrated sensors), and those are already part of any model's reported error.", "The transcript: there's no perfect way to add up these errors; evaluating the whole model on a test set is about as close as we can get."], "key": "Impute at most about 5% of each factor, and remember all data has some error.", "watch": "The 5% limit is per factor, not 5% of all data values overall."}, {"p": "20", "title": "Summary", "points": ["Data is always imperfect: errors, outliers, missing data."], "key": "Imperfect data is normal; handle it deliberately."}]}]}]}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent); const MODS=D.modules;
const K='isye-ss-v1'; let S={u:{},f:{},best:{}}; try{const x=JSON.parse(localStorage.getItem(K)||'null'); if(x&&x.u) S=Object.assign({best:{}},x);}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}};
let V={m:0,l:null,mode:'mod'}; try{const v=JSON.parse(sessionStorage.getItem(K+'v')||'null'); if(v) V=v;}catch(e){}
const keep=()=>{try{sessionStorage.setItem(K+'v',JSON.stringify(V));}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s||'').replace(/<[^>]+>/g,'');
const sid=(L,s)=>L.lec+'#'+s.p; const $=s=>document.querySelector(s); const view=$('#view');
function prog(L){const n=L.slides.length,u=L.slides.filter(s=>S.u[sid(L,s)]).length;return {n,u};}
function chips(){ $('#mods').innerHTML=MODS.map((M,i)=>`<button data-m="${i}" aria-pressed="${V.mode!=='search'&&i===V.m}">M${M.n}</button>`).join(''); }
function card(L,s,showLec){ const id=sid(L,s),u=!!S.u[id],f=!!S.f[id];
  return `<div class="card${u?' ok':''}${f?' flag':''}" data-id="${esc(id)}"><div class="pg">${showLec?esc(L.lec)+' · ':''}Slide${/[–-]/.test(s.p)?'s':''} ${esc(s.p)}</div><h3>${s.title}</h3><ul>${s.points.map(x=>`<li>${x}</li>`).join('')}</ul>${s.key?`<div class="key"><b>Key idea:</b> ${s.key}</div>`:''}${s.watch?`<div class="watch"><b>Watch out:</b> ${s.watch}</div>`:''}<div class="acts"><button data-u="${esc(id)}" aria-pressed="${u}">${u?'✓ Understood':'I understand this'}</button><button data-f="${esc(id)}" aria-pressed="${f}">${f?'Marked not sure':'Not sure'}</button>${showLec?`<button data-open="${esc(L.lec)}">Open deck</button>`:''}</div></div>`; }
function findLec(name){ for(let i=0;i<MODS.length;i++){ const j=MODS[i].lectures.findIndex(L=>L.lec===name); if(j>=0) return [i,j]; } return null; }
function render(){ chips(); const M=MODS[V.m];
  if(V.mode==='search') return renderSearch();
  if(V.mode==='lec'&&M.lectures[V.l]) return renderLec(M,V.l);
  
  const fl=[]; M.lectures.forEach(L=>L.slides.forEach(s=>{ if(S.f[sid(L,s)]) fl.push([L,s]); }));
  let h=`<h2 style="margin:4px 0">Module ${M.n} · ${esc(M.title)}</h2><p class="sub">${M.lectures.length} slide decks · ${M.lectures.reduce((a,L)=>a+prog(L).u,0)} of ${M.lectures.reduce((a,L)=>a+L.slides.length,0)} summaries understood</p><div class="row" style="margin:0 0 12px"><a class="btnlink" href="index.html#slidetest=M${M.n}">Slide test for Module ${M.n} →</a></div>
`;
  M.lectures.forEach((L,j)=>{ const p=prog(L); h+=`<button class="lec" data-lec="${j}"><b>${esc(L.lec)} · ${esc(L.title)}</b><span>${esc(strip(L.intro||''))}</span><span>${p.n} summaries · ${p.u} understood</span><div class="bar"><i style="width:${p.n?100*p.u/p.n:0}%"></i></div></button>`; });
  if(fl.length) h+=`<h3>Marked "not sure" in this module</h3>`+fl.map(([L,s])=>card(L,s,true)).join('');
  view.innerHTML=h; }
function renderLec(M,j){ const L=M.lectures[j], p=prog(L);
  let h=`<div class="row"><button data-back="1">← Module ${M.n}</button></div><h2 style="margin:10px 0 2px">${esc(L.lec)} · ${esc(L.title)}</h2><p class="sub" id="lsub">${p.u} of ${p.n} understood</p>${L.intro?`<div class="intro">${L.intro}</div>`:''}<div class="row" style="margin:0 0 12px"><a class="btnlink" href="index.html#slidetest=${encodeURIComponent(L.lec)}">Test yourself on this deck →</a></div>`;
  h+=L.slides.map(s=>card(L,s,false)).join('');
  h+=`<div class="nav2">${j>0?`<button data-lec="${j-1}">← ${esc(M.lectures[j-1].lec)}</button>`:'<span></span>'}${j<M.lectures.length-1?`<button class="primary" data-lec="${j+1}">${esc(M.lectures[j+1].lec)} →</button>`:(V.m<MODS.length-1?`<button class="primary" data-m="${V.m+1}">Module ${MODS[V.m+1].n} →</button>`:'<span></span>')}</div>`;
  view.innerHTML=h; }
function renderSearch(){ const q=$('#q').value.trim().toLowerCase(); const terms=q.split(/\s+/).filter(Boolean); const out=[];
  MODS.forEach(M=>M.lectures.forEach(L=>L.slides.forEach(s=>{ const t=(strip(s.title)+' '+s.points.map(strip).join(' ')+' '+strip(s.key)+' '+strip(s.watch)+' '+L.title).toLowerCase(); if(terms.every(w=>t.includes(w))) out.push([L,s]); })));
  view.innerHTML=`<p class="sub">${out.length} slide summar${out.length===1?'y':'ies'} match “${esc(q)}”</p>`+out.slice(0,60).map(([L,s])=>card(L,s,true)).join('')+(out.length>60?'<p class="small">Showing the first 60; refine the search.</p>':''); }
// ---------- topic check (drag-and-drop matching)
let CK=null;
function shuffle(a,r){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rng(seed){ return ()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }; }
const SKIP=/^(overview|previously|this lesson|summary|recap|title|questions?|introduction|intro|example|examples|outline|agenda)\b/i;
function buildCheck(M){ const r=rng(Date.now()&0xffff); const seen=new Set(), pool=[];
  M.lectures.forEach(L=>L.slides.forEach(s=>{ const name=strip(s.title).trim(), desc=strip(s.key||'').trim(); const k=name.toLowerCase();
    if(!desc||!name||SKIP.test(name)||seen.has(k)) return; seen.add(k);
    const words=name.split(/\s+/).filter(w=>w.length>3).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    const masked=words.length?desc.replace(new RegExp('\\b('+words.join('|')+')\\b','gi'),'___'):desc;
    pool.push({name,desc:masked,ref:L.lec+', slide'+(/[–-]/.test(s.p)?'s ':' ')+s.p}); }));
  const per=5, maxQ=10; let picked=pool;
  if(pool.length>per*maxQ){ shuffle(pool,r); picked=pool.slice(0,per*maxQ); }
  const qs=[]; for(let i=0;i<picked.length;i+=per){ const g=picked.slice(i,i+per); if(g.length<2) { if(qs.length) qs[qs.length-1].pairs.push(...g); continue; } qs.push({pairs:g}); }
  qs.forEach(q=>{ q.cats=q.pairs.map(x=>x.name); q.items=shuffle(q.pairs.map((x,c)=>({t:x.desc,c,ref:x.ref})),r); q.place=q.items.map(()=>-1); q.done=false; });
  return {m:M.n,qs,i:0,sel:null}; }
function renderCheck(M){ if(!CK||CK.m!==M.n) CK=buildCheck(M); const Q=CK.qs[CK.i];
  let h=`<div class="row"><button data-back="1">← Module ${M.n}</button></div><h2 style="margin:10px 0 2px">Module ${M.n} topic check</h2><p class="sub">Question ${CK.i+1} of ${CK.qs.length}. Drag each description to the topic it describes (or tap a description, then tap a topic).</p>`;
  h+=`<div class="pool" data-zone="-1">${Q.items.map((it,i)=>Q.place[i]===-1?chip(Q,i):'').join('')}</div><div class="buckets">${Q.cats.map((c,ci)=>`<div class="bucket" data-zone="${ci}"><div class="bh">${esc(c)}</div><div class="bz">${Q.items.map((it,i)=>Q.place[i]===ci?chip(Q,i):'').join('')}</div></div>`).join('')}</div>`;
  if(Q.done){ const ok=Q.items.filter((it,i)=>Q.place[i]===it.c).length; h+=`<p class="score">${ok} of ${Q.items.length} placed correctly.</p>`; }
  h+=`<div class="row" style="margin-top:10px">${Q.done?'':`<button class="primary" data-grade="1">Check</button>`}${Q.done&&CK.i<CK.qs.length-1?`<button class="primary" data-next="1">Next question →</button>`:''}${Q.done&&CK.i===CK.qs.length-1?`<button class="primary" data-finish="1">See score</button>`:''}<button data-restart="1">Start over (new mix)</button></div>`;
  if(CK.fin){ const tot=CK.qs.reduce((a,q)=>a+q.items.length,0), ok=CK.qs.reduce((a,q)=>a+q.items.filter((it,i)=>q.place[i]===it.c).length,0), pct=Math.round(100*ok/tot);
    h+=`<div class="card"><h3>Score: ${ok} / ${tot} (${pct}%)</h3><p class="small">Each description shows its slide reference. Missed ones (red) show the right topic; open that deck to review.</p></div>`; }
  view.innerHTML=h; wireDnD(); }
function chip(Q,i){ const it=Q.items[i], p=Q.place[i]; const st=Q.done&&p!==-1?(p===it.c?' right':' wrong'):'';
  return `<span class="chip${CK.sel===i?' sel':''}${st}" draggable="${!Q.done}" data-ci="${i}" role="button" tabindex="0">${esc(it.t)}${Q.done?`<span class="fix">${p!==it.c?'→ '+esc(Q.cats[it.c])+' · ':''}${esc(it.ref)}</span>`:''}</span>`; }
function wireDnD(){ const Q=CK.qs[CK.i]; if(Q.done) return;
  view.querySelectorAll('.chip').forEach(c=>c.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',c.dataset.ci); }));
  view.querySelectorAll('[data-zone]').forEach(z=>{ z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over');}); z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{ e.preventDefault(); const i=+e.dataTransfer.getData('text/plain'); Q.place[i]=+z.dataset.zone; CK.sel=null; render(); }); }); }
// ---------- events
document.addEventListener('click',e=>{ const b=e.target.closest('button,.chip,[data-zone]'); if(!b) return; const d=b.dataset;
  if(b.classList.contains('chip')){ const Q=CK&&CK.qs[CK.i]; if(!Q||Q.done) return; const i=+d.ci; if(CK.sel!==null&&CK.sel!==i){ const z=b.closest('[data-zone]'); Q.place[CK.sel]=+z.dataset.zone; CK.sel=null; } else CK.sel=CK.sel===i?null:i; render(); return; }
  if(d.zone!==undefined&&!b.matches('button')){ const Q=CK&&CK.qs[CK.i]; if(Q&&!Q.done&&CK.sel!==null){ Q.place[CK.sel]=+d.zone; CK.sel=null; render(); } return; }
  if(d.m!==undefined){ V={m:+d.m,l:null,mode:'mod'}; $('#q').value=''; }
  else if(d.lec!==undefined){ V.mode='lec'; V.l=+d.lec; keep(); render(); scrollTo(0,0); return; }
  else if(d.back){ V.mode='mod'; }
  else if(d.check){ V.mode='check'; CK=null; }
  else if(d.open){ const f=findLec(d.open); if(f){ V={m:f[0],l:f[1],mode:'lec'}; $('#q').value=''; } }
  else if(d.u||d.f){ const id=d.u||d.f; if(d.u){ if(S.u[id]) delete S.u[id]; else { S.u[id]=1; delete S.f[id]; } } else { if(S.f[id]) delete S.f[id]; else { S.f[id]=1; delete S.u[id]; } } save();
    const c=b.closest('.card'); const u=!!S.u[id],f=!!S.f[id]; c.classList.toggle('ok',u); c.classList.toggle('flag',f); const bu=c.querySelector('[data-u]'),bf=c.querySelector('[data-f]'); bu.setAttribute('aria-pressed',u); bu.textContent=u?'✓ Understood':'I understand this'; bf.setAttribute('aria-pressed',f); bf.textContent=f?'Marked not sure':'Not sure';
    const ls=$('#lsub'); if(ls&&V.mode==='lec'){ const p=prog(MODS[V.m].lectures[V.l]); ls.textContent=p.u+' of '+p.n+' understood'; } return; }
  else if(d.grade){ CK.qs[CK.i].done=true; }
  else if(d.next){ CK.i++; CK.sel=null; }
  else if(d.finish){ CK.fin=true; const tot=CK.qs.reduce((a,q)=>a+q.items.length,0), ok=CK.qs.reduce((a,q)=>a+q.items.filter((it,i)=>q.place[i]===it.c).length,0); const pct=Math.round(100*ok/tot); S.best[CK.m]=Math.max(S.best[CK.m]||0,pct); save(); }
  else if(d.restart){ CK=null; }
  else return;
  keep(); render(); if(!d.grade&&!d.finish) scrollTo(0,0); });
let tm=null; $('#q').addEventListener('input',()=>{ clearTimeout(tm); tm=setTimeout(()=>{ if($('#q').value.trim()){ V.mode='search'; } else if(V.mode==='search'){ V.mode='mod'; } render(); },200); });
const TB=$('#theme'); const dark=()=>{const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;};
const paint=()=>TB.textContent=dark()?'☀️ Light':'🌙 Dark'; TB.onclick=()=>{const t=dark()?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('isye-ss-theme',t);}catch(e){}paint();}; paint();
if(V.mode==='search') V.mode='mod'; if(V.m>=MODS.length) V.m=0; render();
})();
</script>
