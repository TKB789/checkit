  if(Q.done){ const ok=Q.items.filter((it,i)=>Q.place[i]===it.c).length; h+=`<p class="score">${ok} of ${Q.items.length} placed correctly.</p>`; }
  h+=`<div class="row" style="margin-top:10px">${Q.done?'':`<button class="primary" data-grade="1">Check</button>`}${Q.done&&CK.i<CK.qs.length-1?`<button class="primary" data-next="1">Next question →</button>`:''}${Q.done&&CK.i===CK.qs.length-1?`<button class="primary" data-finish="1">See score</button>`:''}<button data-restart="1">Start over (new mix)</button></div>`;
  if(CK.fin){ const tot=CK.qs.reduce((a,q)=>a+q.items.length,0), ok=CK.qs.reduce((a,q)=>a+q.items.filter((it,i)=>q.place[i]===it.c).length,0), pct=Math.round(100*ok/tot);
    h+=`<div class="card"><h3>Score: ${ok} / ${tot} (${pct}%)</h3><p class="small">Each description shows its slide reference. Missed ones (red) show the right topic; open that deck to review.</p></div>`; }
  view.innerHTML=h; wireDnD(); }
function chip(Q,i){ const it=Q.items[i], p=Q.place[i]; const st=Q.done&&p!==-1?(p===it.c?' right':' wrong'):'';
  return `<span class="chip${CK.sel===i?' sel':''}${st}" draggable="${!Q.done}" data-ci="${i}" role="button" tabindex="0">${esc(it.t)}${Q.done?`<span class="fix">${p!==it.c?'→ '+esc(Q.cats[it.c])+' · ':''}${esc(it.ref)}</span>`:''}</span>`; }
function wireDnD(){ const Q=CK.qs[CK.i]; if(Q.done) return;
  view.querySelectorAll('.chip').forEach(c=>c.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',c.dataset.ci); }));
  view.querySelectorAll('[data-zone]').forEach(z=>{ z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over');}); z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{ e.preventDefault(); const i=+e.dataTransfer.getData('text/plain'); Q.place[i]=+z.dataset.zone; CK.sel=null; render(); }); }); }

// ---------- flashcards (one per slide summary)
/*FC-js*/const FCM=JSON.parse(document.getElementById('fc-data').textContent); const FK='isye-fc-v1';
let FS={c:{},think:false}; try{const x=JSON.parse(localStorage.getItem(FK)||'null'); if(x&&x.c) FS=x;}catch(e){}
const fsave=()=>{try{localStorage.setItem(FK,JSON.stringify(FS));}catch(e){}};
const fst=id=>{const r=FS.c[id]; return !r?'new':r.last==='r'?'known':'missed';};
let DK=null; const FIN={}; // inline state: id -> {pick, shown}
function cardsOf(lecs){ const out=[]; lecs.forEach(L=>L.slides.forEach(s=>{ const id=sid(L,s); if(FCM[id]) out.push(id); })); return out; }
function lecOf(id){ const lec=id.split('#')[0]; for(const M of MODS) for(const L of M.lectures) if(L.lec===lec) return [M,L]; return [null,null]; }
function sumOf(id){ const [M,L]=lecOf(id); return L?L.slides.find(s=>sid(L,s)===id):null; }
function fcStats(ids){ const k=ids.filter(i=>fst(i)==='known').length, m=ids.filter(i=>fst(i)==='missed').length; return {n:ids.length,k,m,u:ids.length-k-m}; }
function fcBar(ids,scope,label){ const t=fcStats(ids); if(!t.n) return '';
  return `<div class="fcbar"><button class="fcb primary" data-deck="${scope}">🃏 Flashcards: ${label} (${t.n})</button>${t.m?`<button class="fcb" data-deck="${scope}" data-miss="1">Redo missed (${t.m})</button>`:''}<span class="stat">${t.k} known · ${t.m} to redo · ${t.u} new</span></div>`; }
function order(id,n){ let h=2166136261; for(const ch of id+'#'+n) { h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } const r=rng(h>>>0); return shuffle([...Array(FCM[id].o.length).keys()],r); }
const ORDC={};/*FC-ordfix*/
function fcHTML(id,st,where){ const c=FCM[id], [M,L]=lecOf(id), sm=sumOf(id); const okey=where+':'+id;
  if(st.pick==null||!ORDC[okey]) ORDC[okey]=order(id,(FS.c[id]?FS.c[id].r+FS.c[id].w:0)+(st.n||0)); const ord=ORDC[okey];
  let h=`<div class="fc"><p class="fr">${esc(L?L.lec:'')} · slide${/[–-]/.test(id.split('#')[1])?'s':''} ${esc(id.split('#')[1])}${sm?' · '+sm.title:''}</p><p class="fq">${c.q}</p>`;
  if(FS.think&&!st.shown&&st.pick==null) return h+`<button class="fcb" data-fshow="${esc(id)}" data-w="${where}">Show choices</button></div>`;
  ord.forEach(i=>{ const o=c.o[i]; let cls='', why='';
    if(st.pick!=null){ if(i===0){cls='right';why=o[1];} else if(i===st.pick){cls='wrong';why=o[1]+(o[2]?' ('+o[2]+')':'');} else cls='dim'; }
    h+=`<button class="fo ${cls}" data-fa="${esc(id)}" data-oi="${i}" data-w="${where}" ${st.pick!=null?'disabled':''}>${o[0]}${why?`<span class="why">${why}</span>`:''}</button>`; });
  if(st.pick!=null) h+=`<p class="verdict ${st.pick===0?'ok':'no'}">${st.pick===0?'Correct':'Not quite: the green answer is right'}</p>`;
  return h+`</div>`; }
function record(id,ok){ const r=FS.c[id]||{r:0,w:0}; ok?r.r++:r.w++; r.last=ok?'r':'w'; r.t=Date.now(); FS.c[id]=r; fsave(); }
function startDeck(scope,missOnly){ let ids,title,back; const M=MODS[V.m];
  if(scope==='lec'){ const L=M.lectures[V.l]; ids=cardsOf([L]); title=L.lec+' · '+L.title; back={mode:'lec',m:V.m,l:V.l}; }
  else if(scope==='mod'){ ids=cardsOf(M.lectures); title='Module '+M.n+' · '+M.title; back={mode:'mod',m:V.m,l:null}; }
  else { const [m,l]=scope.split(':').map(Number); V.m=m; V.l=l; return startDeck(isNaN(l)?'mod':'lec',missOnly); }
  if(missOnly) ids=ids.filter(i=>fst(i)==='missed');
  else { const w={missed:0,new:1,known:2}; ids=ids.map((id,i)=>[id,i]).sort((a,b)=>w[fst(a[0])]-w[fst(b[0])]||a[1]-b[1]).map(x=>x[0]); }
  DK={ids,i:0,ok:0,no:0,pick:null,shown:false,title,back,missOnly,missed:[]}; V.mode='deck'; }
function renderDeck(){ if(!DK){ V.mode='mod'; return render(); } const n=DK.ids.length;
  let h=`<div class="row"><button data-dback="1">← Back to ${DK.back.mode==='lec'?'the deck':'the module'}</button></div><div class="deckhead"><h2 style="margin:10px 0 2px">🃏 ${esc(DK.title)}${DK.missOnly?' · missed only':''}</h2><label class="small"><input type="checkbox" id="think" ${FS.think?'checked':''}> Think first (hide choices until I tap)</label></div>`;
  if(!n){ view.innerHTML=h+'<p>No cards to review here.</p>'; return; }
  if(DK.i>=n){ const pct=Math.round(100*DK.ok/n);
    h+=`<div class="card"><p class="fcdone">${DK.ok} / ${n} correct (${pct}%)</p><p class="small">Missed cards are saved as “to redo” and come first next time.</p><div class="fcbar">${DK.missed.length?`<button class="fcb primary" data-dredo="1">Redo the ${DK.missed.length} I missed</button>`:''}<button class="fcb" data-drestart="1">Run all ${n} again</button><button class="fcb" data-dback="1">Back</button></div></div>`;
    view.innerHTML=h; return; }
  const id=DK.ids[DK.i];
  h+=`<p class="sub">Card ${DK.i+1} of ${n} · ${DK.ok} correct so far</p><div class="dprog"><i style="width:${100*DK.i/n}%"></i></div>`+fcHTML(id,{pick:DK.pick,shown:DK.shown,n:0},'deck');
  if(DK.pick!=null){ const sm=sumOf(id),[M,L]=lecOf(id); h+=`<details style="margin-top:10px"><summary class="small">Read the slide summary</summary>${sm?card(L,sm,true):''}</details><div class="fcbar" style="margin-top:10px"><button class="fcb primary" data-dnext="1">${DK.i<n-1?'Next card →':'See score'}</button></div>`; }
  view.innerHTML=h; }
function fcClick(b,d){
  if(d.deck){ startDeck(d.deck,!!d.miss); keep(); render(); scrollTo(0,0); return true; }
  if(d.fshow){ if(d.w==='deck') DK.shown=true; else (FIN[d.fshow]=FIN[d.fshow]||{}).shown=true; d.w==='deck'?render():paintInline(d.fshow); return true; }
  if(d.fa){ const id=d.fa, oi=+d.oi, ok=oi===0; record(id,ok);
    if(d.w==='deck'){ DK.pick=oi; ok?DK.ok++:(DK.no++,DK.missed.push(id)); render(); } else { const st=FIN[id]=FIN[id]||{}; st.pick=oi; paintInline(id); } return true; }
  if(d.dnext){ DK.i++; DK.pick=null; DK.shown=false; render(); scrollTo(0,0); return true; }
  if(d.dredo){ const ids=DK.missed.slice(); DK={...DK,ids,i:0,ok:0,no:0,pick:null,shown:false,missOnly:true,missed:[]}; render(); scrollTo(0,0); return true; }
  if(d.drestart){ DK={...DK,i:0,ok:0,no:0,pick:null,shown:false,missed:[]}; render(); scrollTo(0,0); return true; }
  if(d.dback){ V.mode=DK?DK.back.mode:'mod'; if(DK){ V.m=DK.back.m; V.l=DK.back.l; } DK=null; keep(); render(); scrollTo(0,0); return true; }
  if(d.fct){ const id=d.fct, box=document.getElementById('fcin-'+cssId(id)); if(!box) return true; if(box.innerHTML){ box.innerHTML=''; delete FIN[id]; b.textContent='🃏 Test yourself'; } else { FIN[id]={}; paintInline(id); b.textContent='Hide card'; } return true; }
  return false; }
const cssId=id=>id.replace(/[^a-zA-Z0-9]/g,'_');
function paintInline(id){ const box=document.getElementById('fcin-'+cssId(id)); if(!box) return; const st=FIN[id]||{}; box.innerHTML=fcHTML(id,{pick:st.pick,shown:st.shown,n:1},'in')+(st.pick!=null?`<div class="fcbar" style="margin-top:6px"><button class="fcb" data-fct="${esc(id)}">Close</button><span class="stat">${fst(id)==='known'?'Marked known':'Saved to redo'}</span></div>`:''); }
document.addEventListener('change',e=>{ if(e.target.id==='think'){ FS.think=e.target.checked; fsave(); if(DK){ DK.shown=false; render(); } } });
// ---------- events
document.addEventListener('click',e=>{ const b=e.target.closest('button,.chip,[data-zone]'); if(!b) return; const d=b.dataset;
  if(fcClick(b,d)) return;/*FC-click*/
  if(b.classList.contains('chip')){ const Q=CK&&CK.qs[CK.i]; if(!Q||Q.done) return; const i=+d.ci; if(CK.sel!==null&&CK.sel!==i){ const z=b.closest('[data-zone]'); Q.place[CK.sel]=+z.dataset.zone; CK.sel=null; } else CK.sel=CK.sel===i?null:i; render(); return; }
  if(d.zone!==undefined&&!b.matches('button')){ const Q=CK&&CK.qs[CK.i]; if(Q&&!Q.done&&CK.sel!==null){ Q.place[CK.sel]=+d.zone; CK.sel=null; render(); } return; }
  if(d.m!==undefined){ V={m:+d.m,l:null,mode:'mod'}; $('#q').value=''; }
  else if(d.lec!==undefined){ V.mode='lec'; V.l=+d.lec; keep(); render(); scrollTo(0,0); return; }
  else if(d.back){ V.mode='mod'; }
  else if(d.check){ V.mode='check'; CK=null; }
  else if(d.open){ const f=findLec(d.open); if(f){ V={m:f[0],l:f[1],mode:'lec'}; $('#q').value=''; } }
  else if(d.u||d.f){ const id=d.u||d.f; if(d.u){ if(S.u[id]) delete S.u[id]; else { S.u[id]=1; delete S.f[id]; } } else { if(S.f[id]) delete S.f[id]; else { S.f[id]=1; delete S.u[id]; } } save();
    const c=b.closest('.card'); const u=!!S.u[id],f=!!S.f[id]; c.classList.toggle('ok',u); c.classList.toggle('flag',f); const bu=c.querySelector('[data-u]'),bf=c.querySelector('[data-f]'); bu.setAttribute('aria-pressed',u); bu.textContent=u?'✓ Understood':'I understand this'; bf.setAttribute('aria-pressed',f); bf.textContent=f?'Marked not sure':'Not sure';
    const ls=$('#lsub'); if(ls&&V.mode==='lec'){ const p=prog(MODS[V.m].lectures[V.l]); ls.textContent=p.u+' of '+p.n+' understood'; } return; }
  else if(d.grade){ CK.qs[CK.i].done=true; }
  else if(d.next){ CK.i++; CK.sel=null; }
  else if(d.finish){ CK.fin=true; const tot=CK.qs.reduce((a,q)=>a+q.items.length,0), ok=CK.qs.reduce((a,q)=>a+q.items.filter((it,i)=>q.place[i]===it.c).length,0); const pct=Math.round(100*ok/tot); S.best[CK.m]=Math.max(S.best[CK.m]||0,pct); save(); }
  else if(d.restart){ CK=null; }
  else return;
  keep(); render(); if(!d.grade&&!d.finish) scrollTo(0,0); });
let tm=null; $('#q').addEventListener('input',()=>{ clearTimeout(tm); tm=setTimeout(()=>{ if($('#q').value.trim()){ V.mode='search'; } else if(V.mode==='search'){ V.mode='mod'; } render(); },200); });
const TB=$('#theme'); const dark=()=>{const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;};
const paint=()=>TB.textContent=dark()?'☀️ Light':'🌙 Dark'; TB.onclick=()=>{const t=dark()?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('isye-ss-theme',t);}catch(e){}paint();}; paint();
if(V.mode==='search'||V.mode==='deck') V.mode='mod'; if(V.m>=MODS.length) V.m=0;
/*FC-hash*/(function(){ const h=decodeURIComponent(location.hash||''); const m=h.match(/^#cards=M(\d+)(?: (L\w+))?$/); if(!m) return; const mi=MODS.findIndex(M=>M.n==+m[1]); if(mi<0) return; V.m=mi;
  if(m[2]){ const li=MODS[mi].lectures.findIndex(L=>L.lec==='M'+m[1]+' '+m[2]); if(li>=0){ V.l=li; startDeck('lec'); return; } } V.l=null; startDeck('mod'); })();
render();
})();
</script>
</body>
