<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midterm 1 Practice Exam</title>
<script>try{var t=localStorage.getItem('mp-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F9FC; --grid:#E1E8F3; --ink:#16233B; --ink-2:#4A5874; --line:#C9D4E6;
  --pen:#2F5BD3; --pen-ink:#FFFFFF; --ok:#1D7A4E; --ok-bg:#E3F4EA; --bad:#C23B2E; --bad-bg:#FBE8E5;
  --warn:#8A5A00; --warn-bg:#FFF3D1; --card:#FFFFFF; --muted-bg:#EEF2F8;
  --serif:"Literata", Georgia, serif; --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1522; --grid:#172033; --ink:#E4EAF5; --ink-2:#A5B1C8; --line:#2A3650; --pen:#7FA2FF; --pen-ink:#0F1522;
  --ok:#5CC592; --ok-bg:#12301F; --bad:#F2877B; --bad-bg:#3A1714; --warn:#F2C66B; --warn-bg:#3A2D08; --card:#161E2E; --muted-bg:#1C2639; } }
:root[data-theme="dark"]{ --paper:#0F1522; --grid:#172033; --ink:#E4EAF5; --ink-2:#A5B1C8; --line:#2A3650; --pen:#7FA2FF; --pen-ink:#0F1522;
  --ok:#5CC592; --ok-bg:#12301F; --bad:#F2877B; --bad-bg:#3A1714; --warn:#F2C66B; --warn-bg:#3A2D08; --card:#161E2E; --muted-bg:#1C2639; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 80px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,4.5vw,2rem);line-height:1.15;margin:4px 0}
h2{font-family:var(--serif);font-weight:600;font-size:1.25rem;margin:0 0 8px}
h3{font-size:1rem;margin:16px 0 8px}
.sub{color:var(--ink-2);margin:0;font-size:.95rem}
.small{font-size:.86rem;color:var(--ink-2)}
nav.tabs{display:flex;gap:4px;background:var(--muted-bg);border-radius:12px;padding:4px;border:1px solid var(--line);margin-top:12px;position:sticky;top:0;z-index:5}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--ink-2);font:600 .95rem var(--sans);padding:10px 6px;border-radius:9px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.btn{appearance:none;border:1px solid var(--pen);background:var(--pen);color:var(--pen-ink);font:600 .95rem var(--sans);padding:10px 16px;border-radius:10px;cursor:pointer;min-height:42px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn.ghost{background:transparent;color:var(--pen)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:500 .86rem var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat div{background:var(--muted-bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.3rem}
.stat span{font-size:.78rem;color:var(--ink-2)}
.setup{background:var(--muted-bg);border-radius:10px;padding:12px;margin:8px 0 4px}
.setup table,.qtext table{border-collapse:collapse;margin:8px 0;font-size:.85rem;width:100%;display:block;overflow-x:auto}
.setup,.qtext{overflow-wrap:anywhere}
.setup th,.setup td,.qtext th,.qtext td{border:1px solid var(--line);padding:4px 6px;text-align:left}
.setup th,.qtext th{background:var(--card)}
.tag{display:inline-block;font:600 .74rem var(--sans);padding:2px 8px;border-radius:999px;background:var(--muted-bg);color:var(--ink-2);margin:0 4px 4px 0}
.part{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.plbl{font:700 .8rem var(--sans);color:var(--pen);letter-spacing:.04em;margin:0 0 4px}
.qtext{font-family:var(--serif);font-size:1.03rem;margin:0 0 8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:8px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;cursor:pointer}
.opt .l{font-weight:700;color:var(--ink-2);flex:none}
.opt[aria-pressed="true"]{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.locked{cursor:default}
.fb{border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.93rem}
.fb.ok{background:var(--ok-bg)} .fb.no{background:var(--bad-bg)} .fb.sk{background:var(--warn-bg)}
.fb .refs{margin-top:6px;font-size:.84rem;color:var(--ink-2)}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pin{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:3px 10px;font:600 .78rem var(--sans);cursor:pointer;white-space:nowrap}
.pin[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.note.pinned{border-left-color:var(--warn)}
.note.mine{border-left-color:var(--pen)}
.addnote textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;background:var(--card);color:var(--ink)}
.addnote select{border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;background:var(--card);color:var(--ink)}
.xbtn{border:0;background:transparent;color:var(--ink-2);cursor:pointer;font:600 .8rem var(--sans);float:right}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.jump{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.jump button{min-width:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 7px;font:600 .8rem var(--sans);cursor:pointer}
.jump button.cur{outline:2px solid var(--pen)}
.jump button.done{background:var(--ok-bg);border-color:var(--ok)}
.jump button.part{background:var(--warn-bg)}
.jump button.miss{background:var(--bad-bg);border-color:var(--bad)}
table.g{border-collapse:collapse;width:100%;font-size:.9rem}
table.g th,table.g td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.bar{height:8px;border-radius:4px;background:var(--muted-bg);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--pen)}
.note{border-left:3px solid var(--bad);background:var(--card);padding:8px 10px;margin:8px 0;border-radius:0 8px 8px 0}
.note.fixed{border-left-color:var(--ok)}
.note .c{font-weight:700}
.note .r{font-size:.82rem;color:var(--ink-2)}
.mod{font:700 .9rem var(--sans);color:var(--pen);margin:16px 0 4px;letter-spacing:.03em}
.hint{font-size:.84rem;color:var(--ink-2);margin:6px 0 0}
details.how summary{cursor:pointer;font-weight:600}
@media print{ nav.tabs,.noprint,header .row{display:none!important} body{background:#fff} .panel{border:0;padding:0} .note{break-inside:avoid} }
</style>
</head>

<div class="wrap">
<header>
  <p class="small" style="margin:0">ISYE 6501 · Midterm 1 · Modules 1–10 + class discussions</p>
  <h1>Practice Exam</h1>
  <p class="sub">Written like the sample quiz: a scenario, then parts that build on each other. Skip anything you’re comfortable with: skipped questions don’t count. Your grade is the percentage of the questions you <b>answered</b>.</p>

<script>
const EXAM=[{"id": "A-1", "module": "M1", "title": "Bike-share questions and what 'model' means", "setup": "A city bike-share company asks its analytics team three questions:<br><b>Q1.<\/b> Which stations had the most rentals last summer, and which stations had similar usage patterns?<br><b>Q2.<\/b> How many bikes will be rented at Station 12 next Saturday?<br><b>Q3.<\/b> With 6 overnight trucks, how should bikes be moved between stations to minimize the number of empty stations at 8 a.m.?", "parts": [{"q": "Classify Q1, Q2 and Q3 (in that order) as descriptive, predictive or prescriptive.", "type": "single", "fixed": false, "options": ["Descriptive, predictive, prescriptive", "Descriptive, prescriptive, predictive", "Predictive, predictive, and prescriptive", "Descriptive, predictive, predictive"], "answer": [0], "explain": "Q1 explains what already happened (descriptive), Q2 estimates a value not yet observed (predictive), and Q3 asks for a best course of action under a limited resource (prescriptive). 'Predictive, predictive, prescriptive' wrongly treats any use of past data as prediction.", "trap": "none", "concept": "Descriptive / predictive / prescriptive", "note": "Descriptive = what happened; predictive = what will happen; prescriptive = what action is best (objective + constraints).", "refs": ["M1 L1 p5–8"]}, {"q": "For Q2, analysts Ana and Ben both write in their memos that they used 'a regression on temperature, day of week and rain'. Ana forecasts 85 rentals and Ben forecasts 70 because they fit on different years of data. In which sense of the word 'model' are their models the same, and in which are they different?", "type": "single", "fixed": false, "options": ["Same method only; their chosen variables and fitted equations differ", "Same method and variables; their fitted coefficients differ", "Same fitted equation; only the data sets they report on differ", "Same in every sense; the difference must come from a calculation error"], "answer": [1], "explain": "'Model' can mean (1) the method, (2) the method plus its chosen variables, or (3) the fitted equation with numbers. Both used regression on the same three variables, so senses 1 and 2 match; fitting on different data gives different coefficients, so sense 3 differs. 'Same method only' is wrong because their variables are the same too.", "trap": "WRONG-QUANTITY", "concept": "Three meanings of 'model'", "note": "'Model' = method / method + variables / fitted equation with coefficients — read which from the detail given.", "refs": ["M1 L3 p5"]}, {"q": "Ana's fitted equation outputs 85 rentals for Station 12. She then tells operations: 'Have 90 bikes at Station 12 by 7 a.m. Saturday.' Which step of the analytics process is that message?", "type": "single", "fixed": false, "options": ["Describing the real situation in mathematical terms", "Analyzing the math to get a numerical answer", "Turning the math answer into a real-life solution", "Validating the model on data it has not seen yet"], "answer": [2], "explain": "The lecture's process is: express the real situation as math (the model), analyze the math to get an answer (85), then turn that answer into a real-world solution (stock 90 bikes). Getting the number 85 was the analysis step; the instruction to operations is the translation back.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Analytics process", "note": "Process: real situation → math model → solve/analyze → translate answer back into a real action.", "refs": ["M1 L1"]}]}, {"id": "A-2", "module": "M2", "title": "Streaming subscriber data", "setup": "A streaming service has this data on past subscribers:<table class='dt'><tr><th>Column<\/th><th>Example value<\/th><\/tr><tr><td>Zip code<\/td><td>30332<\/td><\/tr><tr><td>Plan<\/td><td>Basic / Standard / Premium<\/td><\/tr><tr><td>Age<\/td><td>34<\/td><\/tr><tr><td>Monthly hours watched<\/td><td>41.5<\/td><\/tr><tr><td>Renewed? (coded 1/0)<\/td><td>1<\/td><\/tr><tr><td>Written review<\/td><td>&quot;Great shows but the app keeps freezing…&quot;<\/td><\/tr><tr><td>Hours watched in each of the last 52 weeks<\/td><td>12, 9, 14, 0, …<\/td><\/tr><\/table>", "parts": [{"q": "Select ALL columns that are categorical data (binary counts as categorical).", "type": "multi", "fixed": false, "options": ["Zip code", "Plan", "Age", "Monthly hours watched", "Renewed? (coded 1/0)"], "answer": [0, 1, 4], "explain": "Zip code is a number but only labels a location (no meaningful arithmetic), Plan is a category, and Renewed? is binary even though it is coded 1/0. Age and hours watched are quantitative; zip code is the classic trap because it looks numeric.", "trap": "SELECT-ALL", "concept": "Data types: quantitative vs categorical vs binary", "note": "Categorical = labels (zip code, plan); binary = two categories even if coded 0/1; quantitative = numbers with meaning.", "refs": ["M2 L3 p7"]}, {"q": "Which pairing is correct?", "type": "single", "fixed": false, "options": ["Review is unstructured; the 52 weekly values are a time series", "Zip code is unstructured; monthly hours watched is time-series data", "Written review is unstructured; Renewed? is time-series data", "Plan is unstructured; the 52 weekly values are cross-sectional data"], "answer": [0], "explain": "Free text is unstructured (it must be parsed before it can be used), and the same quantity recorded at successive times is a time series. Monthly hours is a single number per subscriber, not a series in time.", "trap": "none", "concept": "Structured vs unstructured; time series", "note": "Unstructured = text etc. not easily stored in columns; time series = same measure recorded over time.", "refs": ["M2 L3 p6", "M2 L3 p8"]}, {"q": "The service has no labels saying which subscribers are 'binge watchers', 'weekend viewers', etc. It wants to group subscribers with similar viewing behavior so it can design new plans. Which model is most appropriate?", "type": "single", "fixed": true, "options": ["ARIMA", "CART", "Cross-validation", "CUSUM", "Exponential smoothing", "GARCH", "k-means clustering", "k-nearest-neighbor classification", "Linear regression", "Logistic regression", "Support vector machine"], "answer": [6], "explain": "With no known 'correct answer' for each subscriber, this is unsupervised clustering: k-means. k-nearest-neighbor classification needs labeled training points (here Renewed? would be such a label, but it isn't what is being grouped), so it is the near-neighbor trap.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Classification vs clustering", "note": "Classification = supervised (known answer, separate from predictors); clustering = unsupervised (groups defined by the predictors).", "refs": ["Discussion 2.3 (classification vs clustering)", "M2 L1 p7"]}]}, {"id": "A-3", "module": "M2", "title": "Reading a fitted SVM", "setup": "A soft-margin SVM on two predictors gives the classifier <b>3x<sub>1<\/sub> + 4x<sub>2<\/sub> − 10 = 0<\/b>, predicting y = +1 when 3x<sub>1<\/sub> + 4x<sub>2<\/sub> − 10 ≥ 0 and y = −1 otherwise. Five training points:<table class='dt'><tr><th>Point<\/th><th>x<sub>1<\/sub><\/th><th>x<sub>2<\/sub><\/th><th>True y<\/th><\/tr><tr><td>P1<\/td><td>3<\/td><td>1<\/td><td>+1<\/td><\/tr><tr><td>P2<\/td><td>1<\/td><td>2<\/td><td>+1<\/td><\/tr><tr><td>P3<\/td><td>3<\/td><td>0<\/td><td>−1<\/td><\/tr><tr><td>P4<\/td><td>0<\/td><td>1<\/td><td>−1<\/td><\/tr><tr><td>P5<\/td><td>2<\/td><td>2<\/td><td>−1<\/td><\/tr><\/table>", "parts": [{"q": "Which points lie exactly on the margin lines, i.e. (Σ<sub>j<\/sub>a<sub>j<\/sub>x<sub>ij<\/sub> + a<sub>0<\/sub>)y<sub>i<\/sub> = 1?", "type": "single", "fixed": false, "options": ["P1 and P2", "P2 and P3", "P3 and P4", "P5 only"], "answer": [1], "explain": "P2: 3+8−10 = 1, times +1 = 1. P3: 9−10 = −1, times −1 = 1. P1 gives 3 and P4 gives 6 (safely outside the margin); P5 gives (4)(−1) = −4, a misclassified point, not one on the margin.", "trap": "WRONG-QUANTITY", "concept": "SVM constraint and support vectors", "note": "Point on margin line (support vector): (Σa_jx_ij + a0)·y_i = 1; ≥ 1 means correct and outside margin.", "refs": ["M2 L4 p8", "M2 L5 p10"]}, {"q": "What is the width of this classifier's margin (distance between the two margin lines)?", "type": "single", "fixed": true, "options": ["0.08", "0.2", "0.4", "2"], "answer": [2], "explain": "Margin = 2/√(Σa_j²) = 2/√(9+16) = 2/5 = 0.4. 0.08 forgets the square root (2/25), and 0.2 is only the distance from the classifier to one margin line.", "trap": "WRONG-QUANTITY", "concept": "SVM margin formula", "note": "Margin width = 2/√(Σ a_j²); smaller coefficients → wider margin.", "refs": ["M2 L4"]}, {"q": "In the soft-margin objective, what is P5's error term max{0, 1 − (Σ<sub>j<\/sub>a<sub>j<\/sub>x<sub>ij<\/sub> + a<sub>0<\/sub>)y<sub>i<\/sub>}?", "type": "single", "fixed": true, "options": ["0", "3", "4", "5"], "answer": [3], "explain": "P5's score is 6+8−10 = 4, and y = −1, so the product is −4 and the error is 1 − (−4) = 5. Forgetting to multiply by y gives 1 − 4 = −3 → max{0,−3} = 0, which wrongly says P5 has no error.", "trap": "WRONG-QUANTITY", "concept": "Soft-margin error term", "note": "Error_i = max{0, 1 − (Σa_jx_ij + a0)y_i}: 0 if outside margin on correct side, >1 if misclassified.", "refs": ["M2 L4 p15"]}, {"q": "The segment joining P1 and P2 passes through triangle P3–P4–P5, so no straight line separates the classes and a hard-margin SVM is infeasible. In the soft-margin objective Σ<sub>i<\/sub>error<sub>i<\/sub> + λΣ<sub>j<\/sub>a<sub>j<\/sub>², the analyst raises λ from 0.1 to 10. What is the expected effect?", "type": "single", "fixed": false, "options": ["Narrower margin and fewer training-set errors", "Wider margin, possibly more training-set errors", "Training errors are forced to zero, as in hard margin", "Only the intercept a₀ changes; the margin is unchanged"], "answer": [1], "explain": "Larger λ puts more weight on keeping Σa_j² small, i.e. a wider margin (2/√Σa_j²), accepting more classification errors on the training data. 'Narrower margin, fewer errors' is the effect of lowering λ.", "trap": "DIRECTION FLIP", "concept": "SVM: effect of λ", "note": "Larger λ → wider margin, more training errors; smaller λ → narrower margin, fewer training errors.", "refs": ["M2 L4 p19", "M2 L4 p11", "Discussion 1.1 (SVM margin)"]}]}, {"id": "A-4", "module": "M2", "title": "Loan SVM: costs, importance, kernels", "setup": "A bank fits a soft-margin SVM to approve (+1) or reject (−1) loans. All predictors were <b>scaled to [0,1]<\/b> first. Fitted coefficients: credit score 1.6, debt-to-income ratio −1.1, years at current address 0.01; intercept a<sub>0<\/sub> = 0.3.", "parts": [{"q": "Which predictor could most reasonably be removed from the model?", "type": "single", "fixed": false, "options": ["Debt-to-income ratio, because its negative coefficient hurts approval", "Years at current address, because its coefficient is close to 0", "Credit score, because its large coefficient dominates the classifier", "None; coefficient size says nothing unless data were scaled first"], "answer": [1], "explain": "Since the data were scaled, a coefficient near 0 means the predictor barely affects which side of the classifier a point is on, so years at address is probably unimportant. 'Unless scaled first' is true in general but doesn't apply here because the data were scaled; a negative sign just shows direction, not unimportance.", "trap": "GENERALLY-TRUE-BUT-OVERRIDDEN", "concept": "SVM: coefficient near 0 = unimportant (after scaling)", "note": "After scaling, a_j ≈ 0 → predictor j probably irrelevant; without scaling, size reflects units.", "refs": ["M2 L6 p13", "M2 L7 p5"]}, {"q": "On a plot with credit score on the horizontal axis and years at address on the vertical axis (other predictors held fixed), what does the classifier look like?", "type": "single", "fixed": false, "options": ["A nearly horizontal line", "A nearly vertical line", "A line at about 45 degrees", "A closed curve around one class"], "answer": [1], "explain": "With almost no weight on years at address, only the horizontal coordinate (credit score) decides the side, so the boundary is nearly vertical. A nearly horizontal line would mean credit score is the unused predictor.", "trap": "DIRECTION FLIP", "concept": "SVM: vertical/horizontal classifier = one predictor unused", "note": "Vertical line → horizontal-axis variable decides; vertical-axis variable unimportant (and vice versa).", "refs": ["M2 L2 p14"]}, {"q": "Separately, a hard-margin SVM on a smaller data set has intercept a<sub>0<\/sub> = 3, so any intercept from a<sub>0<\/sub> − 1 to a<sub>0<\/sub> + 1 classifies the training data correctly. A bad loan costs <b>twice<\/b> as much as rejecting a good one. Using the lecture's weighted blend ⅔(a<sub>0<\/sub> − 1) + ⅓(a<sub>0<\/sub> + 1), what intercept should be used?", "type": "single", "fixed": true, "options": ["2", "2⅔", "3", "3⅓"], "answer": [1], "explain": "⅔(2) + ⅓(4) = 4/3 + 4/3 = 8/3 = 2⅔: the line is pulled toward the costlier side in proportion to the cost. 3⅓ swaps the weights (⅓ and ⅔), moving the line the wrong way.", "trap": "DIRECTION FLIP", "concept": "SVM: unequal costs shift the intercept", "note": "Unequal costs: move the classifier (intercept) toward the costlier error; in soft SVM weight that error type more.", "refs": ["M2 L6 p7", "M2 L6 p9"]}, {"q": "The bank notices a pocket of defaulters surrounded on all sides by good borrowers. Which change lets an SVM capture that pocket?", "type": "single", "fixed": false, "options": ["Scale the data to [0,1] before refitting", "Use a kernel for a nonlinear classifier", "Raise λ to widen the margin", "Penalize bad-loan errors more heavily"], "answer": [1], "explain": "A kernel lets the SVM draw a curved boundary, which is needed to enclose a pocket. Scaling is good practice (and already done) but still gives a straight line; changing λ or the costs just moves or widens a straight line.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "SVM kernels", "note": "Kernel SVM → nonlinear (curved) classifier; everything else in plain SVM stays linear.", "refs": ["M2 L6"]}]}, {"id": "A-5", "module": "M2", "title": "Scaling or standardizing admissions data", "setup": "A university builds a model with these attributes:<table class='dt'><tr><th>Attribute<\/th><th>Range / distribution<\/th><\/tr><tr><td>SAT score<\/td><td>400–1600, many near the top<\/td><\/tr><tr><td>Photo pixel color (RGB)<\/td><td>0–255<\/td><\/tr><tr><td>Predicted graduation probability<\/td><td>0–1<\/td><\/tr><tr><td>Distance from home (km)<\/td><td>no upper bound, roughly bell-shaped after log<\/td><\/tr><tr><td>Family income<\/td><td>mean $60k, std. dev. $20k, roughly normal, plus a few multi-millionaires<\/td><\/tr><\/table>", "parts": [{"q": "A family income of $100k is standardized using the mean and standard deviation above. What is its value?", "type": "single", "fixed": true, "options": ["0.5", "1.67", "2", "40"], "answer": [2], "explain": "Standardization: z = (x − μ)/σ = (100 − 60)/20 = 2. 40 is just x − μ in thousands, and 1.67 is just x/μ.", "trap": "WRONG-QUANTITY", "concept": "Standardization formula", "note": "Standardize: z = (x − mean)/sd → mean 0, sd 1; scale: (x − min)/(max − min) → [0,1].", "refs": ["M2 L7 p9"]}, {"q": "Select ALL attributes for which scaling to [0,1] is usually the more appropriate choice (rather than standardization).", "type": "multi", "fixed": false, "options": ["SAT score", "Photo pixel color (RGB)", "Predicted graduation probability", "Distance from home (km)", "Family income (after handling outliers)"], "answer": [0, 1, 2], "explain": "Scaling fits data with set minimum and maximum values, especially with data near the bounds (SAT, RGB, probabilities). Distance and income have no natural bounds and look roughly normal, so standardization is usually better for them.", "trap": "SELECT-ALL", "concept": "Scaling vs standardization: when", "note": "Scale when bounded (SAT, RGB, probability, age); standardize when unbounded and roughly normal (income, distance).", "refs": ["Discussion 1.2 (scaling vs standardization)", "M2 L7 p11"]}, {"q": "A neural-network component needs family income in [0,1], but the few multi-millionaires would squeeze everyone else near 0 if income were min-max scaled directly. Following the professor's 'combination case', what should be done?", "type": "single", "fixed": false, "options": ["Scale all incomes to [0,1] exactly as they are", "Remove the few extreme outliers, then scale", "Standardize, leaving z-scores unbounded", "Drop income entirely because it is unbounded"], "answer": [1], "explain": "For data that is mostly in a nice bounded range with a few far-away cases (income), the professor suggests removing the outliers and then scaling the rest. Plain standardization is generally right for unbounded data but doesn't satisfy the [0,1] requirement here.", "trap": "GENERALLY-TRUE-BUT-OVERRIDDEN", "concept": "Scaling with outliers (combination case)", "note": "Mostly-bounded data with a few extreme values: remove outliers, then scale (a single huge max squeezes everyone toward 0).", "refs": ["Discussion 1.2 (scaling vs standardization)", "M2 L7 p8"]}, {"q": "Another option from the discussion: take z-scores from −3 to +3 and scale that range linearly onto [0,1]. A student's distance has z = 1.5. What is its value on the 0–1 scale?", "type": "single", "fixed": true, "options": ["0.25", "0.5", "0.75", "1.5"], "answer": [2], "explain": "Scaling maps −3 → 0 and +3 → 1: (z − (−3))/(3 − (−3)) = 4.5/6 = 0.75. 0.25 measures from the top instead of the bottom, and 0.5 would be z = 0.", "trap": "WRONG-QUANTITY", "concept": "Scaling a z-score range", "note": "Combo: scale z from [−3,3] to [0,1] via (z + 3)/6.", "refs": ["Discussion 1.2 (scaling vs standardization)", "M2 L7 p8"]}]}, {"id": "A-6", "module": "M2", "title": "KNN fraud screening", "setup": "A card issuer classifies transactions as <b>fraud<\/b> or <b>legit<\/b> with k-nearest-neighbor classification on two predictors: purchase amount and distance from the cardholder's home. Only about 1% of past transactions are fraud. Nearest neighbors of a new transaction (distances after scaling):<table class='dt'><tr><th>Rank<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><\/tr><tr><td>Class<\/td><td>Fraud<\/td><td>Legit<\/td><td>Legit<\/td><td>Fraud<\/td><td>Fraud<\/td><td>Fraud<\/td><td>Fraud<\/td><\/tr><tr><td>Distance<\/td><td>1<\/td><td>2<\/td><td>4<\/td><td>4<\/td><td>5<\/td><td>5<\/td><td>6<\/td><\/tr><\/table>", "parts": [{"q": "With k = 7 and an unweighted majority vote, what is the classification and the built-in probability estimate of fraud?", "type": "single", "fixed": false, "options": ["Fraud, estimated fraud probability 5/7 (≈71%)", "Fraud, estimated fraud probability 100% (it won)", "Legit, estimated fraud probability 2/7 (about 29%)", "Fraud, estimated fraud probability 5/2 = 2.5"], "answer": [0], "explain": "5 of the 7 neighbors are fraud, so classify fraud with probability estimate 5/7 (neighbors in the class ÷ k). Winning the vote doesn't make the probability 100%, and this estimate is unreliable at the extremes anyway.", "trap": "WRONG-QUANTITY", "concept": "KNN: probability from votes", "note": "KNN probability ≈ (# of k neighbors in class)/k; less reliable near 0 or 1.", "refs": ["Discussion 1.3 (SVM vs KNN)", "M2 L8"]}, {"q": "With k = 4, the unweighted vote is a 2–2 tie. If each neighbor's vote is instead weighted by 1/distance, what happens?", "type": "single", "fixed": false, "options": ["Legit wins, 0.75 to 0.50", "Still a tie, since each class has two votes", "Fraud wins, 1.25 to 0.75", "Legit wins, because its neighbors are closer on average"], "answer": [2], "explain": "Fraud: 1/1 + 1/4 = 1.25; legit: 1/2 + 1/4 = 0.75, so fraud wins. Closer neighbors count more; legit's average distance (3) is actually larger than fraud's (2.5). (For two classes, an odd k also avoids ties.)", "trap": "DIRECTION FLIP", "concept": "KNN: weighting neighbors / ties", "note": "Weight votes by closeness (e.g. 1/d) to break ties and favor near neighbors; odd k avoids two-class ties.", "refs": ["Discussion 1.3 (SVM vs KNN)", "M2 L8"]}, {"q": "A junior analyst forgot to scale: purchase amount was in cents (up to 500,000) and distance in kilometers (up to 50). What happens to the unscaled KNN?", "type": "single", "fixed": false, "options": ["Distance from home dominates which points count as nearest", "Both predictors count equally, since KNN ignores units", "Purchase amount dominates which points count as nearest", "Nothing important, because k is chosen by validation"], "answer": [2], "explain": "Differences in the large-unit predictor are thousands of times bigger, so they effectively weight that predictor in the distance and 'nearest' is decided almost entirely by purchase amount. Choosing k by validation doesn't fix the distorted distance.", "trap": "DIRECTION FLIP", "concept": "Why scale before KNN", "note": "Unscaled KNN: the predictor with the biggest numbers dominates the distance — scale first.", "refs": ["Discussion 1.4 (scaling before KNN)", "M2 L8 p8"]}, {"q": "Select ALL statements that are correct, according to the class discussion of SVM vs KNN.", "type": "multi", "fixed": false, "options": ["With only 1% fraud, KNN tends to predict 'legit', more so as k gets larger", "For millions of real-time card queries, SVM is easier to compute than KNN", "KNN can capture pockets of fraud surrounded by legit transactions", "If fraud and legit points are thoroughly mixed, raising k will fix it", "To be cautious about fraud, KNN can only change k, not the vote threshold"], "answer": [0, 1, 2], "explain": "Imbalance biases KNN toward the common class (fix by duplicating rare points or sampling common ones); KNN must find the k nearest training points for every new query, which is costly in real time; and KNN handles pockets well. Heavy mixing means we probably have the wrong predictors, and KNN can be made conservative by changing the vote threshold (e.g. 2 of 7 fraud votes → fraud).", "trap": "SELECT-ALL", "concept": "SVM vs KNN trade-offs", "note": "KNN: flexible (pockets, multi-class), built-in probability, but slow per query and biased by imbalance; very mixed classes → wrong predictors.", "refs": ["Discussion 1.3 (SVM vs KNN)"]}]}, {"id": "A-7", "module": "M3", "title": "Choosing among six loan models", "setup": "Dana built six candidate classifiers on a training set and scored each on a separate validation set:<table class='dt'><tr><th>Model<\/th><th>Training accuracy<\/th><th>Validation accuracy<\/th><\/tr><tr><td>SVM, λ = 0.1<\/td><td>0.90<\/td><td>0.84<\/td><\/tr><tr><td>SVM, λ = 1<\/td><td>0.93<\/td><td>0.85<\/td><\/tr><tr><td>SVM, λ = 10<\/td><td>0.88<\/td><td>0.83<\/td><\/tr><tr><td>KNN, k = 1<\/td><td>1.00<\/td><td>0.78<\/td><\/tr><tr><td>KNN, k = 5<\/td><td>0.91<\/td><td>0.86<\/td><\/tr><tr><td>KNN, k = 15<\/td><td>0.87<\/td><td>0.85<\/td><\/tr><\/table>", "parts": [{"q": "Which model should Dana choose?", "type": "single", "fixed": false, "options": ["KNN, k = 1, since it has perfect training accuracy", "SVM, λ = 1, since it has the best SVM training accuracy", "KNN, k = 5, since it has the best validation accuracy", "KNN, k = 15, since its two accuracies are closest"], "answer": [2], "explain": "Training accuracy includes both real and random effects of the training data, so models are compared on validation data: KNN k = 5 (0.86) is best. k = 1 fits the training data perfectly because each point is its own nearest neighbor — classic overfitting (0.78 on validation).", "trap": "OVERFIT-LOOKS-BETTER", "concept": "Validation: choose on validation, not training", "note": "Training error is optimistic (fits random effects); compare models on validation data.", "refs": ["M3 L1 p9", "M3 L2 p4"]}, {"q": "Several models are within 0.01–0.02 of each other on validation. How likely is it that KNN k = 5 is truly the best-predicting model?", "type": "single", "fixed": false, "options": ["It is certain, because it scored highest on validation", "It is the most likely to be best, but maybe under 50%", "It is no more likely to be best than any other model", "KNN k = 15 is more likely best, since simpler models are better"], "answer": [1], "explain": "When random effects are large relative to the real differences, the top validation scorer may not be truly best; it is still the most likely one to be best (so we choose it), but with several near-equal options its probability can be under 50%. 'Simpler is better' doesn't override the validation evidence here.", "trap": "GENERALLY-TRUE-BUT-OVERRIDDEN", "concept": "Selecting among near-equal models", "note": "Top validation model = most likely best, not certainly best (can be <50% when models are close).", "refs": ["Discussion 2.1 (choosing among close models)", "M3 L2 p10"]}, {"q": "Dana then scores KNN k = 5 on the test set and gets 0.82, below its 0.86 validation accuracy. Which explanation is best?", "type": "single", "fixed": false, "options": ["The validation score was boosted by selection bias toward random luck", "The validation score was boosted by selection bias, because test data is harder", "The model overfit the test data, which lowered its score", "KNN always scores lower on test data than SVM does"], "answer": [0], "explain": "Picking the best of several models on the same validation data favors a model that got a random boost there; test data has different random patterns, so the boost disappears. The second option adds an unsupported cause: the professor stresses that test data isn't inherently harder than validation data.", "trap": "CAUSAL ADD-ON", "concept": "Why best validation score is optimistic", "note": "Chosen model's validation score is biased upward (selection bias); use separate test data for an unbiased estimate.", "refs": ["Discussion 2.2 (validation vs test)", "M3 L2 p10"]}, {"q": "On the test set, SVM λ = 1 scores 0.84, beating KNN k = 5's 0.82. What should Dana do?", "type": "single", "fixed": false, "options": ["Switch to SVM λ = 1 and report 0.84 as its expected accuracy", "Keep KNN k = 5; choosing with test data biases its estimate", "Average the two test scores and report 0.83 for KNN", "Retest both on the training data to break the tie"], "answer": [1], "explain": "Using the test data to choose turns it into extra validation data, so it no longer gives an unbiased quality estimate — the 0.84 would likely overstate performance on new data. If she truly must use it to choose, she has to say clearly that the estimate is now optimistic.", "trap": "OVERFIT-LOOKS-BETTER", "concept": "Don't switch models after the test set", "note": "Test data is for one final unbiased estimate; choosing with it makes the estimate optimistic.", "refs": ["Discussion 2.2 (validation vs test)", "M3 L2 p13"]}]}, {"id": "A-8", "module": "M3", "title": "Splitting bakery sales data", "setup": "A bakery chain has 3 years of <b>weekday<\/b> (Mon–Fri) daily sales, in date order, and wants to compare two forecasting models, A and B, and then report how good the chosen one is.", "parts": [{"q": "Which split is appropriate for this purpose?", "type": "single", "fixed": false, "options": ["70% training, 30% test", "60% training, 20% validation, 20% test", "20% training, 40% validation, 40% test", "50% training, 50% validation, no test set"], "answer": [1], "explain": "Comparing models and then estimating the winner's quality needs three sets; typical ratios are 50/25/25, 60/20/20 or 70/15/15 with most data for training. 70/30 training/test is right when there is only one model, so there is nothing to choose with it here.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Splitting ratios", "note": "One model: train/test 70–90% / 10–30%; choosing among models: train/val/test e.g. 50/25/25, 60/20/20, 70/15/15.", "refs": ["M3 L3 p5", "M3 L2 p14"]}, {"q": "An analyst assigns days in a 5-point rotation — training, validation, training, test, training — starting on a Monday and repeating. What is the main risk?", "type": "single", "fixed": false, "options": ["Random chance could give one set more of the early or late years", "The training set ends up smaller than the test set", "Every validation day is a Tuesday and every test day a Thursday", "Rotation can't be used with data that is in date order"], "answer": [2], "explain": "Rotation spreads each set evenly over time, but its 5-day cycle matches the 5-day week, so validation gets only Tuesdays and test only Thursdays. Uneven coverage of years is the risk of a random split, not rotation.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Random vs rotation splits", "note": "Rotation: balanced over time but biased if its cycle matches a data cycle; random: may be uneven over time.", "refs": ["M3 L3 p17"]}, {"q": "They instead hold out 20% as test and run 4-fold cross-validation on the rest. Fold accuracies:<table class='dt'><tr><th>Model<\/th><th>Fold 1<\/th><th>Fold 2<\/th><th>Fold 3<\/th><th>Fold 4<\/th><\/tr><tr><td>A<\/td><td>82<\/td><td>83<\/td><td>84<\/td><td>83<\/td><\/tr><tr><td>B<\/td><td>88<\/td><td>76<\/td><td>80<\/td><td>80<\/td><\/tr><\/table>Which model should be chosen?", "type": "single", "fixed": false, "options": ["Model B, since its best fold (88) beats A's best fold (84)", "Model A, since its average (83) beats B's average (81)", "Model B, since its folds vary more and it is more flexible", "Neither; the test set must be used to make this choice"], "answer": [1], "explain": "In k-fold CV models are compared on the average over the k folds: A = 332/4 = 83, B = 324/4 = 81. B's 88 is one lucky fold — picking the best fold is the wrong quantity.", "trap": "WRONG-QUANTITY", "concept": "k-fold CV: compare averages", "note": "k-fold: each part is validation once; compare models by the average of the k scores.", "refs": ["M3 L4 p14", "M3 L4 p4"]}, {"q": "After choosing Model A, how is the final model built and evaluated?", "type": "single", "fixed": false, "options": ["Deploy the fold-3 model, since it scored highest (84)", "Average the coefficients of the four fold models", "Refit A on all CV data, then score it once on the test set", "Refit A on the test set, since that data hasn't been used yet"], "answer": [2], "explain": "After cross-validation picks the model, it is retrained on all the training/validation data and its quality is estimated once on the untouched test set. The fold models were each fit on only 3/4 of the data, so neither picking one nor averaging them is the lecture's procedure.", "trap": "OVERFIT-LOOKS-BETTER", "concept": "k-fold CV: refit on all data", "note": "After CV: retrain chosen model on all k parts; estimate quality on the held-out test set.", "refs": ["M3 L4"]}]}, {"id": "B-1", "module": "M4", "title": "Hospital logistics: which distance?", "setup": "A county hospital network works on a city laid out in a rectangular street grid (coordinates in km). Ambulance <b>Station A<\/b> is at (0, 0) and <b>Station B<\/b> is at (9, 4). A household <b>H<\/b> is at (3, 4).<table class='dt'><tr><th>Pair<\/th><th>East-west gap<\/th><th>North-south gap<\/th><\/tr><tr><td>H to Station A<\/td><td>3<\/td><td>4<\/td><\/tr><tr><td>H to Station B<\/td><td>6<\/td><td>0<\/td><\/tr><\/table>Inside the hospital, a pharmacy robot travels along a shelf aisle and raises its arm to the right shelf height.", "parts": [{"q": "Select ALL statements that are true about which station is closer to H.", "type": "multi", "fixed": false, "options": ["Under the 1-norm (rectilinear) distance, H is closer to Station B", "Under the 2-norm (Euclidean) distance, H is closer to Station A", "Under the ∞-norm distance, H is closer to Station A", "Under the 2-norm (Euclidean) distance, H is closer to Station B", "The closer station is the same under all three norms"], "answer": [0, 1, 2], "explain": "To A: 1-norm 3+4 = 7, 2-norm √(9+16) = 5, ∞-norm max(3,4) = 4. To B: all three are 6, since the gap is in one dimension only. So B wins under the 1-norm (6 < 7) but A wins under the 2- and ∞-norms; the choice of norm changes the answer.", "trap": "SELECT-ALL", "concept": "Distance norms: 1-, 2-, ∞-norm", "note": "Gap (3,4): 1-norm 7, 2-norm 5, ∞-norm 4. One-dimension gaps are equal under every norm. Norm choice can change which center is nearest.", "refs": ["M4 L2 p5–11 · applied", "M4 L2 p5–7"]}, {"q": "An ambulance must drive the street grid from Station A to H, while a medical drone flies straight there. Which pairing of distance and value is right?", "type": "single", "fixed": false, "options": ["Ambulance 2-norm = 5 km; drone 1-norm = 7 km", "Ambulance 1-norm = 7 km; drone 2-norm = 5 km", "Ambulance ∞-norm = 4 km; drone 2-norm = 5 km", "Ambulance 1-norm = 7 km; drone ∞-norm = 4 km"], "answer": [1], "explain": "Driving along a rectangular grid adds the two legs (rectilinear/Manhattan, 1-norm = 7); a straight-line flight is Euclidean (2-norm = 5). The ∞-norm (4) only counts the longer leg, which fits simultaneous motions, not a single vehicle's path.", "trap": "WRONG-QUANTITY", "concept": "Matching the norm to the real process", "note": "Grid driving → 1-norm; straight-line travel → 2-norm; simultaneous motions → ∞-norm.", "refs": ["M4 L2 p5–7 · applied", "M4 L2 p5 · applied"]}, {"q": "For H and Station A, what is the p-norm distance (Σ|x<sub>i<\/sub> − y<sub>i<\/sub>|<sup>p<\/sup>)<sup>1/p<\/sup> with p = 3?", "type": "single", "fixed": true, "options": ["Less than 4", "Between 4 and 5", "Between 5 and 7", "More than 7"], "answer": [1], "explain": "As p increases the distance shrinks from the 1-norm (7) through the 2-norm (5) toward the ∞-norm (4), so p = 3 lands between 4 and 5 (the cube root of 27 + 64 = 91 is about 4.5). It never goes below the largest single gap, and it does not grow with p.", "trap": "DIRECTION FLIP", "concept": "p-norm behavior as p grows", "note": "p-norm falls as p rises: 1-norm ≥ 2-norm ≥ … ≥ ∞-norm = largest single difference.", "refs": ["M4 L2 p20", "M4 L2 p13–19"]}, {"q": "The pharmacy robot needs 6 seconds to travel along the aisle and 8 seconds to raise its arm, and it does both <i>at the same time<\/i>. How long until it can pick, and which distance describes this?", "type": "single", "fixed": false, "options": ["14 seconds, the 1-norm", "10 seconds, the 2-norm", "8 seconds, the ∞-norm", "6 seconds, the shorter motion"], "answer": [2], "explain": "When the motions happen simultaneously, the robot is ready when the slower one finishes: max(6, 8) = 8, the ∞-norm. 14 seconds (the 1-norm) would be right only if it moved, stopped, then lifted.", "trap": "WRONG-QUANTITY", "concept": "∞-norm: simultaneous motions", "note": "Simultaneous moves → ∞-norm (max); one-after-another moves → 1-norm (sum).", "refs": ["M4 L2 p23–29", "M4 L2 p23–29 · applied"]}]}, {"id": "B-2", "module": "M4", "title": "Library branches: running k-means", "setup": "A city plans new library branches and runs k-means (k = 2, Euclidean distance) on the home locations of library-card holders. Partway through the algorithm, the most recent assignment step left these points in each cluster (coordinates in km):<table class='dt'><tr><th>Cluster<\/th><th>Points currently assigned<\/th><\/tr><tr><td>1<\/td><td>(0, 0), (2, 0), (4, 6)<\/td><\/tr><tr><td>2<\/td><td>(10, 10), (12, 10)<\/td><\/tr><\/table>", "parts": [{"q": "What is the next step's new center for Cluster 1?", "type": "single", "fixed": false, "options": ["(2, 0)", "(2, 2)", "(3, 3)", "(4, 6)"], "answer": [1], "explain": "The next step moves each center to the mean of its assigned points: x = (0+2+4)/3 = 2, y = (0+0+6)/3 = 2. (3, 3) is just the midpoint of two of the points, and (2, 0) is the middle point, not the mean.", "trap": "WRONG-QUANTITY", "concept": "k-means: recomputing centers", "note": "k-means center = mean (centroid) of the points in that cluster.", "refs": ["M4 L3 p12–19", "M4 L3 p8"]}, {"q": "The lecture connects k-means to expectation-maximization. Using the lecture's labels, what is the step in the previous part called, and what is the other step?", "type": "single", "fixed": false, "options": ["Expectation; assigning each point to its nearest center is maximization", "Maximization; assigning each point to its nearest center is expectation", "Expectation; choosing k with an elbow diagram is maximization", "Maximization; picking new random starting centers is expectation"], "answer": [0], "explain": "The lecture calls moving centers to the mean the expectation step (a mean is an expectation) and assigning points the maximization step (minimizing distance = maximizing its negative). Some textbooks swap these, but the lecture's convention wins on this exam.", "trap": "DIRECTION FLIP", "concept": "k-means as EM (lecture labels)", "note": "Lecture: E-step = move centers to the mean; M-step = assign points to nearest center. Stop when no point changes cluster.", "refs": ["M4 L3 p23"]}, {"q": "Two runs with k = 2 from different random starting centers give total distances of 140 km (run 1) and 120 km (run 2). What should the city do?", "type": "single", "fixed": false, "options": ["Conclude k-means has failed, since a correct algorithm gives one answer", "Average the two runs' centers to recover the true best clustering", "Prefer run 2, and try more random starts, keeping the lowest total", "Prefer run 1, since a higher total distance means less overfitting"], "answer": [2], "explain": "k-means is a heuristic: fast and usually close, but not guaranteed optimal, and the result depends on the start. With k fixed, comparing total distance is fair, so run it from several starts and keep the best. Averaging centers from different solutions has no meaning.", "trap": "none", "concept": "k-means is a heuristic: multiple starts", "note": "k-means = heuristic, not guaranteed optimal → run several random starts (same k), keep the lowest total distance.", "refs": ["M4 L3 p23", "M4 L4 p7"]}, {"q": "One card holder lives on a remote ranch at (40, 40), far from both clusters, and k-means pulls Cluster 2's center toward it. What should the city do <i>first<\/i>?", "type": "single", "fixed": false, "options": ["Delete the point and rerun, since outliers always distort centers", "Find out what the point represents and what assigning it implies", "Increase k until the ranch gets a cluster and a branch of its own", "Nothing, since k-means already ignores points far from all centers"], "answer": [1], "explain": "The lecture's default fix is to remove the outlier and rerun, but it stresses first understanding what the point is and the implication of forcing it into the nearest cluster; k-means has no 'not in a cluster' option, so it never ignores a point. Removing it may be the end result, but it isn't the first step.", "trap": "GENERALLY-TRUE-BUT-OVERRIDDEN", "concept": "Outliers in k-means", "note": "k-means forces every point into a cluster; an outlier drags its center. Investigate it before removing it.", "refs": ["M4 L4 p4", "M4 L4 p4 · applied"]}]}, {"id": "B-3", "module": "M4", "title": "Retail segments: choosing k", "setup": "A retailer clusters 20,000 customers using two attributes: <b>annual spend<\/b> ($200 to $20,000) and <b>store visits per year<\/b> (1 to 50). After scaling the data, it runs k-means for k = 1 to 6:<table class='dt'><tr><th>k<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr><tr><td>Total distance to centers<\/td><td>1000<\/td><td>600<\/td><td>350<\/td><td>300<\/td><td>270<\/td><td>250<\/td><\/tr><\/table>", "parts": [{"q": "Before scaling, a first attempt clustered the raw values. What was the most likely problem with that attempt?", "type": "single", "fixed": false, "options": ["Visits dominated, because its values vary more in relative terms", "Spend dominated, because its differences are far larger in raw units", "Nothing, since k-means automatically gives each attribute equal weight", "The clusters were random, because k-means can't use dollar amounts"], "answer": [1], "explain": "Distances add up differences across attributes, so an attribute measured in thousands (spend) swamps one measured in tens (visits); the clusters end up based almost entirely on spend. That's why data are scaled before distance-based methods like k-means.", "trap": "none", "concept": "Scaling before clustering", "note": "Unscaled data: the attribute with the biggest raw numbers dominates distance. Scale first.", "refs": ["M5 L1 p5", "M4 L1 p20–24 · applied"]}, {"q": "An analyst recommends k = 6 because it has the lowest total distance. What is the best assessment?", "type": "single", "fixed": false, "options": ["Right: k = 6 fits the customers most closely, so it is the best choice", "Flawed: total distance always falls as k rises, so it can't pick k", "Flawed: total distance should be maximized, so k = 1 is the best choice", "Right, as long as k-means was run from several starts at k = 6"], "answer": [1], "explain": "Adding a cluster (even one holding a single point) always lowers total distance, so 'lowest total distance' always picks the largest k tried, in the limit one cluster per point. The lower distance at k = 6 is not evidence of a better solution. Multiple starts help within a k, but they don't fix this.", "trap": "OVERFIT-LOOKS-BETTER", "concept": "Choosing k: total distance always falls", "note": "Total distance always decreases as k increases, so it can't pick k by itself.", "refs": ["M4 L4 p8–13"]}, {"q": "Based only on the table, which k does the elbow diagram suggest?", "type": "single", "fixed": true, "options": ["k = 2", "k = 3", "k = 4", "k = 6"], "answer": [1], "explain": "The drops are 400 (1→2), 250 (2→3), then only 50, 30, 20. The marginal benefit of another cluster becomes small after k = 3, which is the elbow. k = 6 is just the lowest total, which always happens at the largest k.", "trap": "WRONG-QUANTITY", "concept": "Elbow diagram", "note": "Elbow = k where the drop in total distance from adding a cluster becomes small.", "refs": ["M4 L4 p13–14"]}, {"q": "The marketing team says it can only produce <b>two<\/b> distinct campaigns this year. Which k should the retailer use?", "type": "single", "fixed": false, "options": ["k = 3, because the elbow diagram is the objective way to choose k", "k = 2, because the solution has to fit the actual situation", "k = 6, then randomly merge the clusters down into two campaigns", "k = 1, because with only two campaigns segmentation isn't worthwhile"], "answer": [1], "explain": "The lecture gives a qualitative answer first: the best solution is the one that fits the situation (like budget for only four fire stations). The elbow is a useful quantitative guide, but here a practical constraint overrides it.", "trap": "GENERALLY-TRUE-BUT-OVERRIDDEN", "concept": "Choosing k: the situation", "note": "Choose k by the situation first (budget, campaigns, facilities), then use the elbow as a guide.", "refs": ["M4 L4 p8–13", "M4 L1 p20–24"]}, {"q": "After the segments are final, a new customer's (scaled) spend and visits fall outside every existing cluster. How should the customer be assigned, following the lecture?", "type": "single", "fixed": false, "options": ["To the segment with the most customers, since it is the likeliest", "To the segment whose center is nearest: its Voronoi region", "Re-run k-means with the new customer included, then read off its group", "To no segment until enough similar customers form a new cluster"], "answer": [1], "explain": "Predictive clustering assigns a new point to the nearest cluster center. Doing that for every possible location divides the space into regions, a Voronoi diagram. There's no need to re-cluster, and cluster size doesn't matter.", "trap": "none", "concept": "Predicting the cluster of a new point (Voronoi)", "note": "New point → nearest center. Voronoi diagram = region of space closest to each center.", "refs": ["M4 L5 p4–7", "M4 L5 p8–10"]}, {"q": "Next year the retailer records whether each customer responded to a test mailing (yes/no) and wants to classify new customers as likely responders using spend and visits. Select ALL models that are appropriate.", "type": "multi", "fixed": false, "options": ["CART", "k-means clustering", "k-nearest-neighbor classification", "CUSUM", "Support vector machine"], "answer": [0, 2, 4], "explain": "Once the correct answer (responded or not) is known for past customers, this is classification, which is supervised: CART, KNN and SVM all classify from a set of factors. k-means is unsupervised clustering with no known answers, and CUSUM detects change over time.", "trap": "SELECT-ALL", "concept": "Classification vs clustering", "note": "Classification = supervised (answers known: CART, KNN, SVM…); clustering = unsupervised (no answers: k-means).", "refs": ["M4 L6 p6–8", "M4 L6 p10", "Discussion 2.3 (classification vs clustering)"]}]}, {"id": "B-4", "module": "M5", "title": "Delivery times: spotting outliers", "setup": "A meal-delivery company draws a box-and-whisker plot of order delivery times (minutes). The box runs from the 25th percentile (40) to the 75th percentile (50), with the median at 45. The analyst chose to draw the whiskers out to the <b>10th percentile (35)<\/b> and the <b>90th percentile (60)<\/b>. Among the recorded times are 20, 38, 58, 62 and 95 minutes.", "parts": [{"q": "Select ALL of the listed times that the plot shows as individual points (possible outliers).", "type": "multi", "fixed": false, "options": ["20 minutes", "38 minutes", "58 minutes", "62 minutes", "95 minutes"], "answer": [0, 3, 4], "explain": "Values beyond the whiskers (below 35 or above 60) are plotted individually as possible outliers: 20, 62 and 95. 38 and 58 are inside the whiskers. The whisker range is the analyst's choice; with 5th–95th whiskers, fewer points would be flagged.", "trap": "SELECT-ALL", "concept": "Box-and-whisker plot", "note": "Box = 25th–75th percentile, line = median, whiskers = chosen range (e.g., 10th–90th or 5th–95th); points beyond them are possible outliers.", "refs": ["M5 L2 p13–16"]}, {"q": "The company has 1,000,000 orders. If delivery times were normally distributed, about how many would you expect to be more than 3 standard deviations from the mean (in either direction)?", "type": "single", "fixed": false, "options": ["About 27", "About 1,350", "About 2,700", "About 45,000"], "answer": [2], "explain": "About 0.27% of normal data lies beyond 3 SDs on either side: roughly 2,700 per million. 1,350 counts only one tail, and about 45,000 is the count beyond 2 SDs. So thousands of extreme values in a large dataset are expected, not proof of bad data.", "trap": "WRONG-QUANTITY", "concept": "Normal tails: extreme values are expected", "note": "Normal: ~4.55% beyond 2 SD, ~0.27% beyond 3 SD (≈2,700 per million). Big data → many real extremes.", "refs": ["M5 L3 p17–20 · applied", "M5 L3 p17–20"]}, {"q": "One 3 a.m. order took 45 minutes, right at the median, but 3 a.m. orders (empty roads) normally take about 15. What kind of outlier is this, and how could it be found?", "type": "single", "fixed": false, "options": ["A point outlier; it would show up beyond the box plot's whiskers", "A contextual outlier; fit a time-based model and look for a large error", "A collective outlier; widen the whiskers to the 1st and 99th percentiles", "A contextual outlier; it would show up beyond the box plot's whiskers"], "answer": [1], "explain": "45 minutes is normal overall; it's only unusual for its time of day, which makes it contextual. A box plot of all times can't see that context. Fitting a model (for example exponential smoothing over time) and looking for points with large error can.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Contextual outliers and model-error detection", "note": "Contextual outlier = normal value, wrong context (time). Find it by fitting a model and looking for large errors, not with a box plot.", "refs": ["M5 L2 p8", "M5 L2 p17–20", "M5 L2 · transcript"]}, {"q": "In the class discussion, which type of outlier did the professor say is <i>hardest to identify<\/i>, and why?", "type": "single", "fixed": false, "options": ["Point outliers, because they are the most extreme values in the data", "Contextual outliers, because deciding whether to keep them is so hard", "Collective, since you may know something's missing, not where", "None; a box plot with well-chosen whiskers finds all three types"], "answer": [2], "explain": "The professor picked collective outliers (like a missing heartbeat): you may sense something is missing but can't easily say what or where. He said contextual outliers are often hard to <i>deal with<\/i> (bad, irrelevant or relevant?), which is true but not the question asked.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Outlier types: point, contextual, collective", "note": "Collective outliers are hardest to identify (professor); contextual are often hardest to decide what to do with.", "refs": ["Discussion 3.1 (hardest outlier type)", "M5 L2 p9–12"]}]}, {"id": "B-5", "module": "M5", "title": "Three outliers, three decisions", "setup": "Three analysts each find one outlier in their data:<table class='dt'><tr><th>Case<\/th><th>Question being studied<\/th><th>The outlier<\/th><\/tr><tr><td>1<\/td><td>Survey on credit scores (normally 300–850)<\/td><td>One response lists a credit score of 85,000; the respondent entered their income in the credit-score box<\/td><\/tr><tr><td>2<\/td><td>How many drive-through lanes a fast-food store needs<\/td><td>One week of sales spiked to a very high level when a counter-protest to a boycott brought in huge crowds<\/td><\/tr><tr><td>3<\/td><td>Whether the state needs a new power plant<\/td><td>A few manufacturers with power-intensive machinery and AI server farms use far more power per customer than anyone else<\/td><\/tr><\/table>", "parts": [{"q": "How should Case 1 be classified and handled?", "type": "single", "fixed": false, "options": ["Bad data: remove it, or impute a value if one is needed", "Real and relevant data: keep it, since it is a true answer", "Real but irrelevant data: remove it and document the event", "A contextual outlier: keep it, but flag it in the report"], "answer": [0], "explain": "A mistyped field is bad (incorrect) data, like a sensor malfunction or contaminated experiment, so it's thrown out or, if a value is needed, imputed. It isn't a real event at all.", "trap": "none", "concept": "Outlier handling: bad data", "note": "Bad data (entry error, sensor failure, contamination, failed transmission) → remove or impute.", "refs": ["Discussion 3.2 (outlier categories)", "M5 L3 p4–9", "M5 L3 p14–16"]}, {"q": "How should Case 2 be handled for the drive-through-lane question?", "type": "single", "fixed": false, "options": ["Remove it as bad data, since a spike that large must be an error", "Real but won't recur, so not relevant; it may be removed", "Keep it, since removing real data always biases the model", "Keep it, and build enough lanes to handle the spike's volume"], "answer": [1], "explain": "The spike really happened (good data), but a boycott/counter-protest is unlikely to repeat, so it isn't relevant to how many lanes the store needs, and it can be removed with the reason documented. 'Never remove real data' is usually sound, but relevance overrides it here.", "trap": "GENERALLY-TRUE-BUT-OVERRIDDEN", "concept": "Outlier handling: real but irrelevant", "note": "Real but irrelevant (one-off event that won't recur) → may remove; document why.", "refs": ["Discussion 3.2 (outlier categories)", "M5 L3 p29–31"]}, {"q": "How should Case 3 be handled?", "type": "single", "fixed": false, "options": ["Remove them, because they pull the average usage far upward", "Keep them: they're real and drive how much power is needed", "Replace their usage with the median customer's usage", "Remove them, because they are point outliers beyond the whiskers"], "answer": [1], "explain": "The heavy users are real and directly relevant to how much generating capacity the state needs, so they should stay. It's true they raise the average, but that's exactly the demand the plant must serve.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Outlier handling: real and relevant", "note": "Real and relevant outliers → keep them (removing them makes the model too optimistic).", "refs": ["Discussion 3.2 (outlier categories)", "M5 L3 p21–25"]}]}, {"id": "B-6", "module": "M5", "title": "Ferry crossings: two models", "setup": "A ferry operator predicts crossing times. Most crossings take about 2 hours, but roughly 1 in 10 is disrupted by storms and takes 8–14 hours. The operator has weather forecasts, season, and sea-state data for every past crossing, and knows which crossings were disrupted. Instead of one model, an analyst proposes modeling the disruptions separately from normal crossings.", "parts": [{"q": "Which model is most appropriate for estimating the <i>probability<\/i> that a crossing is disrupted, given the weather and sea-state factors?", "type": "single", "fixed": true, "options": ["ARIMA", "CART", "Cross-validation", "CUSUM", "Exponential smoothing", "GARCH", "k-means clustering", "k-nearest-neighbor classification", "Linear regression", "Logistic regression", "Support vector machine"], "answer": [9], "explain": "Logistic regression estimates the probability of a yes/no outcome from a set of factors, which is the lecture's suggestion for the 'chance of an outlier event' model. Linear regression could predict values below 0 or above 1.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Modeling outliers separately: probability model", "note": "Two-model approach: logistic regression for chance of the outlier event + regression for the normal case.", "refs": ["M5 L3 p26–28", "M5 L3 p26–28 · applied"]}, {"q": "Which data should the second model (crossing time under normal conditions) be fitted on?", "type": "single", "fixed": false, "options": ["All crossings, so that the model sees every possible outcome", "Only the undisrupted crossings, with the disruptions removed", "Only the disrupted crossings, since those carry the most risk", "All crossings, with disrupted times capped at 4 hours"], "answer": [1], "explain": "The normal-conditions model is fit on data with the outliers removed, so the huge delays don't distort the normal-case estimate. The disruptions aren't thrown away: the logistic model covers them.", "trap": "none", "concept": "Modeling outliers separately: normal-case model", "note": "Normal-case model is fit without the outlier events; the probability model handles them.", "refs": ["M5 L3 p26–28", "M5 L3 p27–28"]}, {"q": "A colleague suggests skipping the probability model and just deleting the disrupted crossings as outliers. What is the main risk?", "type": "single", "fixed": false, "options": ["None, since storm delays are bad data that should be removed", "Plans become too optimistic, ignoring real delays that recur", "The normal-time model will overfit because it has fewer points", "The normal-time model's R² will drop below what it was before"], "answer": [1], "explain": "Storm delays are real and relevant: they recur and matter for planning. Throwing them out makes the model too optimistic, and reality will supply bad surprises. Deleting them would actually tend to improve the fit statistics, which is why the danger is easy to miss.", "trap": "OVERFIT-LOOKS-BETTER", "concept": "Removing real, relevant outliers", "note": "Deleting real recurring outliers → model looks better but is too optimistic.", "refs": ["M5 L3 p21–25"]}]}, {"id": "B-7", "module": "M6", "title": "Call center: running CUSUM", "setup": "A call center watches for an <b>increase<\/b> in daily average hold time (minutes) using S<sub>t<\/sub> = max{0, S<sub>t−1<\/sub> + (x<sub>t<\/sub> − μ − C)}, with S<sub>0<\/sub> = 0, μ = 10, C = 1 and T = 6. A change is declared when S<sub>t<\/sub> ≥ T.<table class='dt'><tr><th>Day t<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr><tr><td>x<sub>t<\/sub><\/td><td>11<\/td><td>9<\/td><td>12<\/td><td>13<\/td><td>14<\/td><td>12<\/td><\/tr><\/table>", "parts": [{"q": "What is S<sub>4<\/sub>?", "type": "single", "fixed": true, "options": ["1", "3", "5", "9"], "answer": [1], "explain": "Each day adds x<sub>t<\/sub> − 11: S<sub>1<\/sub> = max(0, 0) = 0, S<sub>2<\/sub> = max(0, −2) = 0, S<sub>3<\/sub> = 1, S<sub>4<\/sub> = 1 + 2 = 3. Forgetting C gives 1, 0, 2, 5, which is the tempting wrong answer 5.", "trap": "WRONG-QUANTITY", "concept": "CUSUM calculation", "note": "CUSUM (increase): S_t = max{0, S_{t−1} + (x_t − μ − C)}; alarm when S_t ≥ T.", "refs": ["M6 L2 p14–17", "M6 L2 p20"]}, {"q": "The team plots S<sub>t<\/sub> on a control chart with a horizontal line at T = 6. On which day is a change first declared?", "type": "single", "fixed": true, "options": ["Day 3", "Day 4", "Day 5", "Day 6"], "answer": [2], "explain": "S<sub>5<\/sub> = 3 + (14 − 11) = 6, which reaches T = 6, so the line first touches the threshold on day 5 (S<sub>6<\/sub> = 7 stays above). Day 5 isn't the first high reading; CUSUM waits until enough evidence accumulates.", "trap": "none", "concept": "CUSUM control chart", "note": "Control chart: plot S_t over time with a line at T; change declared where S_t first reaches T.", "refs": ["M6 L2 p21", "M6 L2 p25–26"]}, {"q": "If the team raised T from 6 to 10, what would happen?", "type": "single", "fixed": false, "options": ["Sooner detection, with more false alarms", "Later detection (none by day 6 here), fewer false alarms", "Nothing would change, because T matters only for decrease CUSUMs", "Detection timing would be the same, since only C affects timing"], "answer": [1], "explain": "T is the sensitivity: a higher T needs more accumulated evidence, so detection is slower but there are fewer false alarms. Here S never reaches 10 by day 6 (it peaks at 7).", "trap": "DIRECTION FLIP", "concept": "CUSUM: effect of T", "note": "Higher T → slower detection, fewer false alarms. Lower T → faster, more false alarms. Same direction for C.", "refs": ["M6 L2 p21", "Discussion 3.3 (CUSUM C and T)"]}, {"q": "Hold times naturally vary a lot from day to day. A colleague proposes C = 0 with a very large T = 60 to avoid false alarms. Using the professor's reasoning, what is the best response?", "type": "single", "fixed": false, "options": ["Accept it: with T = 60, false alarms will be very rare", "Reject it: raise C instead; a huge T is slow to catch a sudden change", "Reject it: keep C = 0 and lower T, since C only matters when variation is low", "Accept it: C and T are interchangeable, so only their total matters"], "answer": [1], "explain": "With C = 0, several random above-mean days add up toward a false alarm, so high natural variation calls for a higher C. Leaning on a huge T instead would make a real, fast change take a long time to catch. It's true T = 60 would cut false alarms, but that isn't a reason to choose it.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "CUSUM: choosing C vs T", "note": "High natural variation → higher C. Prefer a sensible C over C = 0 with a huge T (huge T delays detecting a fast real change).", "refs": ["Discussion 3.3 (CUSUM C and T)", "M6 L2 p14–17"]}]}, {"id": "B-8", "module": "M6", "title": "Watching a deployed credit model", "setup": "A bank deployed a loan-default classification model three years ago. Each month it measures the model's accuracy x<sub>t<\/sub> (percent of loans classified correctly). During a stable first year accuracy averaged μ = 92%. The bank wants to use CUSUM to detect whether accuracy has <b>decreased<\/b>.", "parts": [{"q": "Which recursion detects a decrease (alarm when S<sub>t<\/sub> ≥ T)?", "type": "single", "fixed": false, "options": ["S<sub>t<\/sub> = max{0, S<sub>t−1<\/sub> + (μ − x<sub>t<\/sub> − C)}", "S<sub>t<\/sub> = max{0, S<sub>t−1<\/sub> + (μ − x<sub>t<\/sub> + C)}", "S<sub>t<\/sub> = max{0, S<sub>t−1<\/sub> + (x<sub>t<\/sub> − μ − C)}", "S<sub>t<\/sub> = max{0, S<sub>t−1<\/sub> + (x<sub>t<\/sub> − μ + C)}"], "answer": [0], "explain": "For a decrease, reverse the deviation to μ − x<sub>t<\/sub>, but still subtract C: C always works against accumulation. Adding C would give the total a free push every month and cause false alarms; x<sub>t<\/sub> − μ − C is the increase version.", "trap": "DIRECTION FLIP", "concept": "CUSUM for decreases", "note": "Decrease CUSUM: S_t = max{0, S_{t−1} + (μ − x_t − C)}; C is subtracted in both directions.", "refs": ["M6 L2 p24", "M6 L2 p24 · applied"]}, {"q": "An analyst suggests recomputing μ each month as the average of all accuracy readings so far, \"to keep μ current.\" What is the effect?", "type": "single", "fixed": false, "options": ["Better: alarms will reflect the latest normal level of accuracy", "Worse: μ drifts with the decline and absorbs the change", "Worse: μ becomes too low, so the decrease CUSUM alarms constantly", "No effect: after the first month CUSUM depends only on C and T"], "answer": [1], "explain": "μ is the fixed reference of 'no change.' If it's updated as data arrives, a gradual decline is folded into the baseline and the deviations shrink (like updating the mean of salary data since 1970, which masks the change). A lower μ makes a decrease CUSUM <i>less<\/i> likely to alarm, not more.", "trap": "DIRECTION FLIP", "concept": "CUSUM: don't update μ", "note": "Don't update μ as new data arrives; take it from a known-stable period, or the change gets masked.", "refs": ["Discussion 3.3 (CUSUM C and T)", "M6 L2 p6–7"]}, {"q": "In month 30 the decrease CUSUM crosses T. What is the most appropriate conclusion?", "type": "single", "fixed": false, "options": ["Accuracy has likely shifted down; investigate and consider retraining or rebuilding the model", "Accuracy has likely shifted down because borrowers changed after rate hikes; retrain on recent data", "The model was built wrong from the start, so its original validation was flawed", "One crossing is just noise, so ignore it unless it happens a second time"], "answer": [0], "explain": "CUSUM is useful for monitoring models in production: a detected change means it's time to investigate and retrain or reconsider the model. The method only detects that a change happened; it can't say why, so the 'because…' version claims more than the model shows.", "trap": "CAUSAL ADD-ON", "concept": "Monitoring deployed models with CUSUM", "note": "CUSUM on a deployed model's performance: change detected → investigate, retrain/reconsider. It shows that, not why.", "refs": ["Discussion 3.3 (CUSUM C and T)", "M6 L1 p3–5"]}, {"q": "Select ALL of the following that are change-detection questions.", "type": "multi", "fixed": false, "options": ["Has a machine's vibration started rising, signaling it needs maintenance?", "Did lowering business tax rates lead firms to hire more people?", "Have voting patterns shifted over the last several elections?", "Which groups of voters give similar answers on a survey?", "What will next month's sales be, based on the last three years?"], "answer": [0, 1, 2], "explain": "Change detection asks whether something has changed: whether action is needed (maintenance), whether an action had an effect (tax policy), or what has drifted over time (voting). Grouping similar voters is clustering, and predicting next month's value is forecasting.", "trap": "SELECT-ALL", "concept": "Uses of change detection", "note": "Change detection uses: do we need to act? did our action work? what has drifted? (Uses range from big long-term changes to short-term ones to small changes vs noise.)", "refs": ["M6 L1 p2", "Discussion 3.4 (change-detection uses)"]}]}, {"id": "C-1", "module": "M7", "title": "Holt-Winters on emergency-room admissions", "setup": "A hospital has 3 years of daily data and wants to use triple exponential smoothing (Holt-Winters, multiplicative seasonality) to see whether ER admissions follow a pattern by <b>day of the week<\/b>:<br><i>S<sub>t<\/sub><\/i> = α·<i>x<sub>t<\/sub><\/i>/<i>C<sub>t−L<\/sub><\/i> + (1−α)(<i>S<sub>t−1<\/sub><\/i> + <i>T<sub>t−1<\/sub><\/i>)<br><i>T<sub>t<\/sub><\/i> = β(<i>S<sub>t<\/sub><\/i> − <i>S<sub>t−1<\/sub><\/i>) + (1−β)<i>T<sub>t−1<\/sub><\/i><br><i>C<sub>t<\/sub><\/i> = γ·<i>x<sub>t<\/sub><\/i>/<i>S<sub>t<\/sub><\/i> + (1−γ)<i>C<sub>t−L<\/sub><\/i><table class='dt'><tr><th>Date<\/th><th>Day of week<\/th><th>Week of year<\/th><th>Average temperature (°F)<\/th><th>ER admissions<\/th><\/tr><tr><td>Mar 3<\/td><td>Mon<\/td><td>10<\/td><td>41<\/td><td>212<\/td><\/tr><tr><td>Mar 4<\/td><td>Tue<\/td><td>10<\/td><td>45<\/td><td>188<\/td><\/tr><tr><td>Mar 5<\/td><td>Wed<\/td><td>10<\/td><td>52<\/td><td>191<\/td><\/tr><tr><td>…<\/td><td>…<\/td><td>…<\/td><td>…<\/td><td>…<\/td><\/tr><\/table>", "parts": [{"q": "In the equations, what is <i>x<sub>t<\/sub><\/i>?", "type": "single", "fixed": false, "options": ["Week of year of day t", "ER admissions on day t", "Average temperature on day t", "Day of week of day t"], "answer": [1], "explain": "x_t is the observed value of the response being smoothed, here daily ER admissions. Temperature is a possible predictor, but exponential smoothing uses only the series' own past values, so it has no role as x_t.", "trap": "WRONG-QUANTITY", "concept": "Holt-Winters: x_t is the response", "note": "x_t = observed response at time t (never a predictor).", "refs": ["M7 L1 p16", "M7 L2 p18"]}, {"q": "What value of <i>L<\/i> should the hospital use?", "type": "single", "fixed": true, "options": ["3 (years of data)", "7", "24", "52", "365"], "answer": [1], "explain": "L is the length of one cycle. The question asks about day-of-week patterns in daily data, so one cycle is 7 days. 52 or 365 would be right only for a yearly pattern.", "trap": "WRONG-QUANTITY", "concept": "Holt-Winters: cycle length L", "note": "L = number of periods in one cycle (daily data, weekly cycle → L = 7).", "refs": ["M7 L2 p19"]}, {"q": "After fitting, the seasonal factors <i>C<\/i> are close to 1 for most days, but about 1.2 for Saturdays. What can be concluded?", "type": "single", "fixed": false, "options": ["Saturdays tend to have about 20% more admissions than the baseline.", "Saturdays tend to have about 20% fewer admissions than the baseline.", "Saturdays tend to have about 20% more admissions than the baseline, because people do riskier activities on weekends.", "Saturday admissions have been rising by about 20% per year.", "There is no meaningful day-of-week effect on admissions."], "answer": [0], "explain": "C > 1 means that period's response is higher than the baseline by that factor, so Saturdays run about 20% above the baseline. The model only describes the pattern and can't say why, so the 'riskier activities' version adds a causal claim the model can't support.", "trap": "CAUSAL ADD-ON", "concept": "Holt-Winters: interpreting C", "note": "C>1: that season's response is above baseline (×C); C<1: below. The model doesn't show cause.", "refs": ["M7 L2 p18", "M7 L2 p20"]}, {"q": "Over the 3 years, the fitted values of <i>T<\/i> are consistently slightly negative. What can be concluded?", "type": "single", "fixed": false, "options": ["The Saturday effect is getting weaker over time.", "Daily ER admissions tend to be increasing over time.", "The model has too much randomness to be used.", "Daily ER admissions tend to be decreasing over time."], "answer": [3], "explain": "T is the trend, meaning the change in the baseline S per period. A negative T means the baseline level of admissions is falling over time. A weakening weekly pattern would appear in C, not in T.", "trap": "DIRECTION FLIP", "concept": "Holt-Winters: interpreting T", "note": "T>0: baseline rising over time; T<0: falling. Seasonal changes show up in C, not T.", "refs": ["M7 L2 p18"]}, {"q": "An analyst uses the lecture's start values (<i>S<sub>1<\/sub><\/i> = <i>x<sub>1<\/sub><\/i>, <i>T<sub>1<\/sub><\/i> = 0, <i>C<sub>1<\/sub><\/i>…<i>C<sub>L<\/sub><\/i> = 1) but by mistake fixes γ = 0. What happens?", "type": "single", "fixed": false, "options": ["The factors are learned more slowly but still end up near 1.2 for Saturdays.", "The trend T is forced to 0, so the model can only capture seasonality.", "Each C_t equals the latest x_t/S_t, so the factors react fully to each new week.", "Every C stays at 1 forever, so the model never captures the weekly pattern."], "answer": [3], "explain": "With γ = 0, C_t = C_{t−L}, so every factor stays at its start value of 1, and the x_t/C_{t−L} term never adjusts for the day of the week. Fully reacting to the latest week would need γ = 1. Slow learning would need a small positive γ, not γ = 0.", "trap": "DIRECTION FLIP", "concept": "Holt-Winters: γ and start values", "note": "γ=0 → C never updates (stays at start value, e.g. 1); γ near 1 → C follows latest x/S. Start: S1=x1, T1=0, C=1.", "refs": ["M7 L2 p18", "M7 L2 p19", "M7 L1 p27"]}]}, {"id": "C-2", "module": "M7", "title": "Smoothing weekly sales of a staple product", "setup": "A grocery chain smooths weekly sales of a staple product (no trend or seasonality) with single exponential smoothing, <i>S<sub>t<\/sub><\/i> = α<i>x<sub>t<\/sub><\/i> + (1−α)<i>S<sub>t−1<\/sub><\/i>, using α = 0.5 and the start value <i>S<sub>1<\/sub><\/i> = <i>x<sub>1<\/sub><\/i>.<table class='dt'><tr><th>Week t<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><tr><td>Sales x<sub>t<\/sub><\/td><td>100<\/td><td>120<\/td><td>90<\/td><\/tr><\/table>", "parts": [{"q": "At the end of week 3, what is the forecast for week 5?", "type": "single", "fixed": false, "options": ["105", "90", "100", "110"], "answer": [2], "explain": "S1 = 100, S2 = 0.5(120) + 0.5(100) = 110, S3 = 0.5(90) + 0.5(110) = 100. Single smoothing has no trend term, so every future forecast equals S3 = 100. 90 is the last observation, not the smoothed estimate.", "trap": "WRONG-QUANTITY", "concept": "Single ES: computing S_t and the flat forecast", "note": "Single ES forecast for every horizon = latest S_t (flat
