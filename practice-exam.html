he bank's default rate", "Card count has no real relationship with default; the coefficient is noise"], "answer": [0], "explain": "A regression shows an association: applicants with more cards tend to default more. The 'because' option adds a cause the model can't establish (for example, already-struggling borrowers might open more cards), and the 'issue fewer cards' option assumes the same causation.", "trap": "CAUSAL ADD-ON", "concept": "Correlation vs causation in regression", "note": "A significant coefficient shows association, not cause; reject any \"…because\" that the data can't support.", "refs": ["M8 L4 p3", "M8 L4 p5–9", "M8 L4 p13"]}]}, {"id": "E-4", "module": "MIX", "title": "Airline delays and demand", "setup": "An airline has 8 years of data for one route: daily passengers (a weekly cycle on top of a steadily rising, non-stationary level), and for each flight its departure delay in minutes, inches of rain, wind speed, time of day, and whether it left more than 15 minutes late. Most delays are a few minutes but some last hours, and in plots of residuals against predicted delay, the spread is much larger for flights with larger predicted delays.", "parts": [{"q": "Consider three questions about flight 202: (1) Will it leave more than 15 minutes late? (2) What is the probability it leaves more than 15 minutes late? (3) How many minutes late will it leave? Which pairing of question and model fits the course's framework?", "type": "single", "fixed": false, "options": ["(1) SVM, (2) logistic regression, (3) linear regression", "(1) logistic regression, (2) linear regression, (3) SVM", "(1) SVM, (2) linear regression, (3) logistic regression", "(1) k-means, (2) logistic regression, (3) linear regression"], "answer": [0], "explain": "Yes/no is classification (SVM or KNN), a probability is estimated with logistic regression, and an amount is estimated with linear regression. The tempting swap gives the probability question to linear regression, whose output isn't bounded between 0 and 1. k-means is unsupervised, so it can't answer a yes/no question about known outcomes.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Question types → models", "note": "Classification → SVM/KNN; probability → logistic; amount → linear regression.", "refs": ["Discussion 7.2 (question types)", "M10 L4 p7–9"]}, {"q": "The operations team wants to estimate a flight's delay in minutes from weather and time of day, and to report <b>how many extra minutes each additional inch of rain adds<\/b>. Which model is most appropriate?", "type": "single", "fixed": true, "options": ["ARIMA", "CART", "Cross-validation", "CUSUM", "Exponential smoothing", "GARCH", "k-means clustering", "k-nearest-neighbor classification", "Linear regression", "Logistic regression", "Support vector machine"], "answer": [8], "explain": "Estimating an amount from factors, with a single interpretable coefficient per factor (minutes per inch of rain), is linear regression. Logistic regression estimates the probability of a yes/no outcome, not a number of minutes.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Amount estimation with interpretable coefficients", "note": "How much + effect per unit of a factor → linear regression (coefficient = change in response per unit).", "refs": ["M8 L1 p17–18", "M8 L1 p29", "Discussion 7.2 (question types)"]}, {"q": "Given the residual pattern described in the scenario, what data preparation is most appropriate for the delay-minutes regression?", "type": "single", "fixed": false, "options": ["Detrend the delay minutes over the 8 years", "Box-Cox transform the delay-minutes response", "Scale all predictors to the interval [0, 1]", "Replace the predictors with their principal components"], "answer": [1], "explain": "Spread that grows with the size of the value is heteroscedasticity, and Box-Cox transforms the response to make its variance more even. Scaling the predictors is good practice for distance-based models, but it doesn't change the residual spread. Detrending deals with trend over time, not unequal variance.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Box-Cox for unequal variance", "note": "Residuals fan out (heteroscedasticity) → Box-Cox the response (λ<1 shrinks large values).", "refs": ["M9 L1 p4–8 · applied", "M9 L1 p8", "M8 L5 p12 · M9 L1"]}, {"q": "To predict late departures, analysts fit 12 candidate models on training data and picked the one with the best <b>validation<\/b> accuracy (84%). On the <b>test<\/b> set it scores 80%. What should they report as the chosen model's expected accuracy?", "type": "single", "fixed": false, "options": ["84%, since validation data was used to choose the model, so it's more reliable", "80%: the best of 12 on validation likely got a random boost there, so test is fairer", "80%, because the 4-point drop shows the model was overfit to the test data", "Whichever model scores best on the test set, after switching to that model"], "answer": [1], "explain": "Choosing the top performer among several close models favors one that got lucky on the validation data, so its validation score is optimistic, and the untouched test set gives the unbiased estimate. Switching to the best model on the test set would turn the test data into validation data and leave no unbiased estimate.", "trap": "none", "concept": "Validation vs test", "note": "Validation picks the model (optimistic); test estimates its quality; don't re-pick on test.", "refs": ["M3 L2 p10", "M3 L2 p11–12", "M3 L2 p13", "Discussion 2.1 (best on validation)", "Discussion 2.2 (test vs validation)"]}, {"q": "For daily passengers, the airline wants a forecasting model that <b>differences<\/b> the series to remove the non-stationary level and then uses autoregressive and moving-average terms. Which model is it describing?", "type": "single", "fixed": true, "options": ["ARIMA", "CART", "Cross-validation", "CUSUM", "Exponential smoothing", "GARCH", "k-means clustering", "k-nearest-neighbor classification", "Linear const KEY='isye6501-practice-exam-v1';
const MODNAME={M1:'Module 1 · Foundations',M2:'Module 2 · Classification',M3:'Module 3 · Validation',M4:'Module 4 · Clustering',M5:'Module 5 · Data prep & outliers',M6:'Module 6 · Change detection',M7:'Module 7 · Time series',M8:'Module 8 · Regression',M9:'Module 9 · Advanced data prep',M10:'Module 10 · Advanced regression',MIX:'Cross-module: pick the right tool'};
const MODORDER=['M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','MIX'];
// ---- flatten parts
const PARTS=[]; EXAM.forEach((s,si)=>s.parts.forEach((p,pi)=>{ p.id=s.id+'.'+String.fromCharCode(97+pi); p.sid=s.id; p.mod=s.module; p.si=si; p.letter=String.fromCharCode(97+pi); PARTS.push(p); }));
const PBYID=Object.fromEntries(PARTS.map(p=>[p.id,p]));
// ---- storage
function load(){ try{ const j=JSON.parse(localStorage.getItem(KEY)||'null'); if(j&&j.attempts) return j; }catch(e){} return {attempts:[]}; }
let DB=load(); DB.pins=DB.pins||{}; DB.custom=DB.custom||[];
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){} }
function cur(){ if(!DB.attempts.length){ newAttempt(); } return DB.attempts[DB.attempts.length-1]; }
function newAttempt(){ DB.attempts.push({n:DB.attempts.length+1,started:Date.now(),ans:{},skip:{}}); save(); }
// ---- helpers
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function order(p,att){ const idx=p.options.map((_,i)=>i); if(p.fixed) return idx; const r=rng(hash(p.id+'#'+att.n)); for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];} return idx; }
const LET='ABCDEFGHIJKLMNOP';
function isCorrect(p,picks){ const a=[...p.answer].sort().join(','), b=[...picks].sort().join(','); return a===b; }
function stats(att,filter){ const ids=Object.keys(att.ans).filter(id=>PBYID[id]&&(!filter||filter(PBYID[id]))); const c=ids.filter(id=>att.ans[id].ok).length; return {answered:ids.length,correct:c,pct:ids.length?Math.round(1000*c/ids.length)/10:null,skipped:Object.keys(att.skip).filter(id=>PBYID[id]&&!att.ans[id]&&(!filter||filter(PBYID[id]))).length}; }
// history: last result per part across attempts
function history(pid){ return DB.attempts.map(a=>a.ans[pid]?{n:a.n,ok:a.ans[pid].ok}:null).filter(Boolean); }
function everMissed(pid){ return history(pid).some(h=>!h.ok); }
function latest(pid){ const h=history(pid); return h.length?h[h.length-1]:null; }
// ---- view state
let tab='exam'; let view={si:0, mod:'all', only:'all'}; let draft={};
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b))); render(); window.scrollTo(0,0); });
function scenList(){ const att=cur();
  return EXAM.map((s,si)=>({s,si})).filter(({s})=>view.mod==='all'||s.module===view.mod).filter(({s})=>{
    if(view.only==='all') return true;
    const ps=PARTS.filter(p=>p.sid===s.id);
    if(view.only==='missed') return ps.some(p=>{const l=latest(p.id); return l&&!l.ok;});
    if(view.only==='todo') return ps.some(p=>!att.ans[p.id]&&!att.skip[p.id]);
    return true; }); }
function render(){ if(tab==='exam') renderExam(); else if(tab==='grades') renderGrades(); else renderNotes(); }
function partState(att,p){ if(att.ans[p.id]) return att.ans[p.id].ok?'done':'miss'; if(att.skip[p.id]) return 'skip'; return 'todo'; }
function renderExam(){
  const att=cur(); const st=stats(att); const list=scenList();
  if(!list.length){ view.si=0; }
  let pos=list.findIndex(x=>x.si===view.si); if(pos<0){ pos=0; if(list[0]) view.si=list[0].si; }
  const mods=MODORDER.filter(m=>EXAM.some(s=>s.module===m));
  let h=`<section class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Attempt ${att.n}</h2><span class="small">started ${new Date(att.started).toLocaleString()}</span></div>
   <div class="stat"><div><b>${st.pct===null?'–':st.pct+'%'}</b><span>grade (answered only)</span></div><div><b>${st.correct}/${st.answered}</b><span>correct / answered</span></div><div><b>${st.skipped}</b><span>skipped</span></div><div><b>${PARTS.length-st.answered-st.skipped}</b><span>not seen yet</span></div></div>
   <details class="how" style="margin-top:10px"><summary>How this works</summary><ul class="small">
    <li>${EXAM.length} scenarios, ${PARTS.length} questions covering every module’s slides and the class discussions. Each answer shows the trap it tested and the slide / discussion to review.</li>
    <li><b>Skip</b> anything you already know; it doesn’t count against you. Your grade = correct ÷ answered.</li>
    <li>Every question you miss goes into <b>My notes</b>, with its slide reference, ready to print. Tap <b>☆ Add to notes</b> on any question to add it too, or write your own notes there.</li>
    <li>When you’re done, tap <b>Start attempt ${att.n+1}</b> to retake (all questions, or only the ones you missed). <b>My grades</b> shows each attempt’s score so you can see your progress.</li>
    <li>Select-all questions need exactly the right set. Progress saves in this browser.</li></ul></details>
   <h3>Show</h3><div class="chips" id="only">${[['all','All scenarios'],['todo','Not done in this attempt'],['missed','Missed last time']].map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${view.only===k}">${l}</button>`).join('')}</div>
   <div class="chips" id="mods" style="margin-top:6px"><button class="chip" data-m="all" aria-pressed="${view.mod==='all'}">All modules</button>${mods.map(m=>`<button class="chip" data-m="${m}" aria-pressed="${view.mod===m}">${m==='MIX'?'Mixed':m}</button>`).join('')}</div>
   <div class="jump">${list.map(({s,si})=>{ const ps=PARTS.filter(p=>p.sid===s.id); const sts=ps.map(p=>partState(att,p)); const cls=sts.some(x=>x==='miss')?'miss':sts.every(x=>x!=='todo')?'done':sts.some(x=>x!=='todo')?'part':''; return `<button class="${cls} ${si===view.si?'cur':''}" data-si="${si}" title="${esc(s.title)}">${si+1}</button>`; }).join('')}</div>
   <p class="hint">Numbers = scenarios. Green = finished, yellow = in progress, red = has a miss.</p></section>`;
  if(list.length){ const s=EXAM[view.si]; const ps=PARTS.filter(p=>p.sid===s.id);
    h+=`<section class="panel" id="scen"><p class="small" style="margin:0">Scenario ${view.si+1} of ${EXAM.length} · ${esc(MODNAME[s.module]||s.module)}</p><h2>${esc(s.title)}</h2><div class="setup">${s.setup}</div>`;
    ps.forEach(p=>{ h+=partHTML(att,p); });
    h+=`<div class="navrow"><button class="btn quiet" id="prev" ${pos<=0?'disabled':''}>← Previous</button><button class="btn quiet" id="skipall">Skip remaining parts</button><button class="btn" id="next" ${pos>=list.length-1?'disabled':''}>Next →</button></div></section>`;
  } else h+=`<section class="panel"><p>Nothing to show with these filters.</p></section>`;
  h+=`<section class="panel noprint"><h2>Finish this attempt</h2><p class="small">Start a new attempt to retake. Attempt ${att.n} is saved in <b>My grades</b>.</p><div class="row"><button class="btn" id="newall">Start attempt ${att.n+1}: all questions</button><button class="btn ghost" id="newmiss">Start attempt ${att.n+1}: only missed</button></div></section>`;
  $('#main').innerHTML=h;
  document.querySelectorAll('#only .chip').forEach(b=>b.onclick=()=>{view.only=b.dataset.k; renderExam();});
  document.querySelectorAll('#mods .chip').forEach(b=>b.onclick=()=>{view.mod=b.dataset.m; const l=scenList(); if(l.length) view.si=l[0].si; renderExam();});
  document.querySelectorAll('.jump button').forEach(b=>b.onclick=()=>{view.si=+b.dataset.si; renderExam(); $('#scen').scrollIntoView({behavior:'smooth'});});
  const go=d=>{ const l=scenList(); const p=l.findIndex(x=>x.si===view.si); const t=l[p+d]; if(t){ view.si=t.si; renderExam(); $('#scen').scrollIntoView(); return true; } return false; };
  if($('#prev')) $('#prev').onclick=()=>go(-1); if($('#next')) $('#next').onclick=()=>go(1);
  if($('#skipall')) $('#skipall').onclick=()=>{ const s=EXAM[view.si]; PARTS.filter(p=>p.sid===s.id&&!att.ans[p.id]).forEach(p=>att.skip[p.id]=1); save(); if(!go(1)) renderExam(); };
  $('#newall').onclick=()=>{ if(confirm(`Finish attempt ${att.n} and start attempt ${att.n+1} with all questions?`)){ newAttempt(); view={si:0,mod:'all',only:'all'}; draft={}; renderExam(); window.scrollTo(0,0);} };
  $('#newmiss').onclick=()=>{ if(confirm(`Finish attempt ${att.n} and start attempt ${att.n+1} showing only scenarios with a missed question?`)){ newAttempt(); view={si:0,mod:'all',only:'missed'}; draft={}; const l=scenList(); if(l.length) view.si=l[0].si; renderExam(); window.scrollTo(0,0);} };
  bindParts(att);
}
function partHTML(att,p){
  const o=order(p,att); const a=att.ans[p.id]; const sk=att.skip[p.id]; const picks=a?a.picks:(draft[p.id]||[]);
  const prev=DB.attempts.filter(x=>x.n<att.n&&x.ans[p.id]).map(x=>x.ans[p.id].ok?'✓':'✗').join(' ');
  const pin=!!DB.pins[p.id];
  let h=`<div class="part" id="p-${p.id}"><div class="phead"><p class="plbl">PART ${p.letter.toUpperCase()}${p.type==='multi'?' · SELECT ALL THAT APPLY':''}${prev?` <span class="small" style="font-weight:500">· earlier attempts: ${prev}</span>`:''}</p><button class="pin" data-pin="${p.id}" aria-pressed="${pin}">${pin?'★ In my notes':'☆ Add to notes'}</button></div><div class="qtext">${p.q}</div><div class="opts">`;
  o.forEach((oi,k)=>{ let cls='opt'; if(a){ cls+=' locked'; if(p.answer.includes(oi)) cls+=' right'; else if(a.picks.includes(oi)) cls+=' wrong'; }
    h+=`<button class="${cls}" data-p="${p.id}" data-oi="${oi}" aria-pressed="${picks.includes(oi)}"><span class="l">${p.type==='multi'?(picks.includes(oi)?'☑':'☐'):LET[k]+'.'}</span><span>${p.options[oi]}</span></button>`; });
  h+=`</div>`;
  if(a){ h+=`<div class="fb ${a.ok?'ok':'no'}"><b>${a.ok?'Correct.':'Not quite.'}</b> ${p.explain}${p.trap&&p.trap!=='none'?`<div class="refs"><b>Trap tested:</b> ${esc(p.trap)}</div>`:''}<div class="refs"><b>Review:</b> ${p.refs.map(esc).join(' · ')}</div></div>`; }
  else if(sk){ h+=`<div class="fb sk">Skipped (doesn’t count). <button class="btn ghost" data-unskip="${p.id}" style="min-height:32px;padding:4px 10px">Answer it after all</button></div>`; }
  else h+=`<div class="row" style="margin-top:8px"><button class="btn" data-submit="${p.id}" ${picks.length?'':'disabled'}>Submit</button><button class="btn quiet" data-skip="${p.id}">Skip</button></div>`;
  return h+`</div>`;
}
function bindParts(att){
  document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{ const id=b.dataset.pin; if(DB.pins[id]) delete DB.pins[id]; else DB.pins[id]=Date.now(); save(); const on=!!DB.pins[id]; b.setAttribute('aria-pressed',String(on)); b.textContent=on?'★ In my notes':'☆ Add to notes'; });
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const p=PBYID[b.dataset.p]; if(att.ans[p.id]||att.skip[p.id]) return; const oi=+b.dataset.oi; let d=draft[p.id]||[];
    d=p.type==='multi'?(d.includes(oi)?d.filter(x=>x!==oi):d.concat(oi)):[oi]; draft[p.id]=d; rerenderPart(att,p); });
  document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>{ const p=PBYID[b.dataset.submit]; const d=draft[p.id]||[]; if(!d.length) return;
    att.ans[p.id]={picks:d,ok:isCorrect(p,d),at:Date.now()}; delete att.skip[p.id]; save(); rerenderTop(att); rerenderPart(att,p); });
  document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{ const p=PBYID[b.dataset.skip]; att.skip[p.id]=1; save(); rerenderTop(att); rerenderPart(att,p); });
  document.querySelectorAll('[data-unskip]').forEach(b=>b.onclick=()=>{ const p=PBYID[b.dataset.unskip]; delete att.skip[p.id]; save(); rerenderTop(att); rerenderPart(att,p); });
}
function rerenderPart(att,p){ const el=document.getElementById('p-'+p.id); if(!el) return; const y=window.scrollY; el.outerHTML=partHTML(att,p); bindParts(att); window.scrollTo(0,y); }
function rerenderTop(att){ const st=stats(att); const box=document.querySelectorAll('.stat b'); if(box.length===4){ box[0].textContent=st.pct===null?'–':st.pct+'%'; box[1].textContent=st.correct+'/'+st.answered; box[2].textContent=st.skipped; box[3].textContent=PARTS.length-st.answered-st.skipped; }
  const s=EXAM[view.si]; const btn=document.querySelector(`.jump button[data-si="${view.si}"]`); if(btn){ const sts=PARTS.filter(p=>p.sid===s.id).map(p=>partState(att,p)); btn.className=(sts.some(x=>x==='miss')?'miss':sts.every(x=>x!=='todo')?'done':'part')+' cur'; } }
function renderGrades(){
  const rows=DB.attempts.map(a=>({a,st:stats(a)}));
  const mods=MODORDER.filter(m=>EXAM.some(s=>s.module===m));
  let h=`<section class="panel"><h2>My grades</h2><p class="small">Grade = correct ÷ questions answered in that attempt. Skipped questions don’t count.</p>
   <table class="g"><tr><th>Attempt</th><th>Date</th><th>Answered</th><th>Correct</th><th>Grade</th><th></th></tr>
   ${rows.map(({a,st})=>`<tr><td>#${a.n}</td><td>${new Date(a.started).toLocaleDateString()} ${new Date(a.started).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</td><td>${st.answered}</td><td>${st.correct}</td><td><b>${st.pct===null?'–':st.pct+'%'}</b></td><td><div class="bar"><i style="width:${st.pct||0}%"></i></div></td></tr>`).join('')}</table></section>
   <section class="panel"><h2>By module</h2><p class="small">Grade per module in each attempt (correct/answered).</p><div style="overflow-x:auto"><table class="g"><tr><th>Module</th>${rows.map(({a})=>`<th>#${a.n}</th>`).join('')}</tr>
   ${mods.map(m=>`<tr><td>${m==='MIX'?'Mixed':m}</td>${rows.map(({a})=>{const s=stats(a,p=>p.mod===m); return `<td>${s.answered?`${s.pct}% <span class="small">(${s.correct}/${s.answered})</span>`:'<span class="small">–</span>'}</td>`;}).join('')}</tr>`).join('')}</table></div></section>
   <section class="panel noprint"><h2>Save or move your progress</h2><p class="small">Progress lives in this browser only. Download it to keep a copy or move it to another device.</p>
   <div class="row"><button class="btn quiet" id="exp">Download progress</button><label class="btn quiet" style="display:inline-flex;align-items:center">Load progress<input type="file" id="imp" accept="application/json" style="display:none"></label><button class="btn danger" id="reset">Erase all attempts</button></div></section>`;
  $('#main').innerHTML=h;
  $('#exp').onclick=()=>{ const b=new Blob([JSON.stringify(DB)],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='practice-exam-progress.json'; a.click(); };
  $('#imp').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const j=JSON.parse(t); if(j.attempts){ DB=j; DB.pins=DB.pins||{}; DB.custom=DB.custom||[]; save(); renderGrades(); } }catch(err){ alert('That file isn’t a progress file.'); } }); };
  $('#reset').onclick=()=>{ if(confirm('Erase every attempt and grade? Your added notes are kept. This can’t be undone.')){ DB={attempts:[],pins:DB.pins,custom:DB.custom}; save(); renderGrades(); } };
}
let notesFilter='sheet';
function renderNotes(){
  const missed=PARTS.filter(p=>everMissed(p.id));
  const open=missed.filter(p=>{const l=latest(p.id); return l&&!l.ok;});
  const pinned=PARTS.filter(p=>DB.pins[p.id]);
  let shown;
  if(notesFilter==='sheet') shown=PARTS.filter(p=>DB.pins[p.id]||open.includes(p));
  else if(notesFilter==='all') shown=PARTS.filter(p=>DB.pins[p.id]||missed.includes(p));
  else shown=pinned;
  const showCustom=notesFilter!=='missedonly';
  const mods=MODORDER;
  let h=`<section class="panel"><h2>My notes</h2><p class="small">Your notes sheet: every question you’ve missed, plus anything you added with <b>☆ Add to notes</b> or wrote below. Each has the takeaway, the trap, and the slide or discussion to review. Print or save as PDF.</p>
   <div class="row noprint"><div class="chips" id="nf">
    <button class="chip" data-f="sheet" aria-pressed="${notesFilter==='sheet'}">Notes sheet: still missing + added (${new Set([...open,...pinned]).size + DB.custom.length})</button>
    <button class="chip" data-f="all" aria-pressed="${notesFilter==='all'}">Everything, incl. fixed (${new Set([...missed,...pinned]).size + DB.custom.length})</button>
    <button class="chip" data-f="pins" aria-pressed="${notesFilter==='pins'}">Only what I added (${pinned.length + DB.custom.length})</button></div>
    <button class="btn quiet" onclick="window.print()">Print / save as PDF</button></div>
   <div class="addnote noprint" style="margin-top:12px"><h3 style="margin-top:0">Add my own note</h3>
    <textarea id="ntext" placeholder="e.g. Holt-Winters: L = periods per cycle in the data (170 per batch), not days per batch"></textarea>
    <div class="row" style="margin-top:6px"><select id="nmod">${mods.map(m=>`<option value="${m}">${esc(MODNAME[m]||m)}</option>`).join('')}</select><input id="nref" placeholder="Slide / discussion (optional)" style="flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;background:var(--card);color:var(--ink)"><button class="btn" id="nadd">Add note</button></div></div>`;
  const any=shown.length||(showCustom&&DB.custom.length);
  if(!any) h+=`<p style="margin-top:12px">${notesFilter==='pins'?'Nothing added yet. Tap ☆ Add to notes on any question, or write a note above.':missed.length?'Everything you missed has since been answered correctly. 🎉':'No notes yet. Miss a question, tap ☆ Add to notes, or write a note above.'}</p>`;
  mods.forEach(m=>{ const ps=shown.filter(p=>p.mod===m); const cs=showCustom?DB.custom.filter(c=>c.mod===m):[]; if(!ps.length&&!cs.length) return;
    h+=`<p class="mod">${esc(MODNAME[m]||m)}</p>`;
    cs.forEach(c=>{ h+=`<div class="note mine"><button class="xbtn noprint" data-delc="${c.id}" title="Delete note">✕ delete</button><div class="c">My note</div><div>${esc(c.text).replace(/\n/g,'<br>')}</div>${c.ref?`<div class="r">Review: ${esc(c.ref)}</div>`:''}</div>`; });
    ps.forEach(p=>{ const hist=history(p.id); const l=hist[hist.length-1]; const wasMissed=missed.includes(p); const fixed=wasMissed&&l&&l.ok; const pin=!!DB.pins[p.id];
      const cls=pin&&!wasMissed?'pinned':fixed?'fixed':'';
      const badge=[pin?'★ added':'',wasMissed?(fixed?'✓ fixed':'✗ missed'):''].filter(Boolean).join(' · ');
      h+=`<div class="note ${cls}">${pin?`<button class="xbtn noprint" data-unpin="${p.id}" title="Remove from notes">✕ remove</button>`:''}<div class="c">${esc(p.concept||'')} <span class="small">${badge}</span></div><div>${p.note||p.explain}</div>${p.trap&&p.trap!=='none'?`<div class="r">Trap: ${esc(p.trap)}</div>`:''}<div class="r">Review: ${p.refs.map(esc).join(' · ')} · Q ${p.sid}${p.letter}${hist.length?' · '+hist.map(x=>`#${x.n} ${x.ok?'✓':'✗'}`).join(' '):''}</div></div>`; }); });
  h+=`</section>`;
  $('#main').innerHTML=h;
  document.querySelectorAll('#nf .chip').forEach(b=>b.onclick=()=>{notesFilter=b.dataset.f; renderNotes();});
  $('#nadd').onclick=()=>{ const t=$('#ntext').value.trim(); if(!t) return; DB.custom.push({id:'c'+Date.now(),text:t,mod:$('#nmod').value,ref:$('#nref').value.trim(),at:Date.now()}); save(); renderNotes(); };
  document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>{ if(confirm('Delete this note?')){ DB.custom=DB.custom.filter(c=>c.id!==b.dataset.delc); save(); renderNotes(); } });
  document.querySelectorAll('[data-unpin]').forEach(b=>b.onclick=()=>{ delete DB.pins[b.dataset.unpin]; save(); renderNotes(); });
}
render();
</script>
</body>
</html>
