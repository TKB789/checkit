 line).", "refs": ["M7 L1 p16", "M7 L4 p7"]}, {"q": "Using the forecast-error variance formula for simple exponential smoothing from class, σ<sub>k<\/sub><sup>2<\/sup> = σ<sup>2<\/sup>(1 + α<sup>2<\/sup>(k−1)), what is the error variance of the forecast for week 6, made at the end of week 3?", "type": "single", "fixed": true, "options": ["σ²", "1.25σ²", "1.5σ²", "2σ²", "3σ²"], "answer": [2], "explain": "Week 6 is k = 3 periods ahead, so σ²(1 + 0.25·2) = 1.5σ². 1.25σ² would be the 2-week-ahead (week 5) value.", "trap": "WRONG-QUANTITY", "concept": "Forecast error grows with horizon", "note": "Simple ES k-step error variance σ²(1+α²(k−1)): grows with k.", "refs": ["Discussion 4.3 (exp. smoothing horizon)", "M7 L4 p7"]}, {"q": "Suppose the chain looks at a different product over 3 years: sales rise slowly year over year, peak every December, and bounce up and down from week to week for no clear reason. Which description is correct?", "type": "single", "fixed": false, "options": ["Slow rise = randomness (α); December peak = cycle (C, γ); weekly bounce = trend (T, β)", "Single smoothing handles all three, because α adapts to whatever pattern is present", "Slow rise = seasonality (C, γ); December peak = trend (T, β); weekly bounce = randomness (α)", "Slow rise = trend (T, β); December peak = cycle (C, γ, L = 52); weekly bounce = randomness (α)"], "answer": [3], "explain": "Time series vary through trend (a long-run increase or decrease, handled by T and β), seasonality or cycles (a repeating pattern, handled by C, γ and L = 52 for weekly data with a yearly cycle) and randomness (handled by α's smoothing). Single smoothing has no T or C, so it lags a trend and misses the cycle.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Time-series components", "note": "Trend → T, β; seasonality/cycle → C, γ, L; randomness → α smoothing.", "refs": ["M7 L1 p7", "M7 L2 p22"]}, {"q": "Select ALL statements that are correct, according to the lecture and class discussion.", "type": "multi", "fixed": false, "options": ["The forecast for 2 weeks ahead will always have a larger error than the forecast for 1 week ahead.", "Good values of α (and of β, γ in Holt-Winters) are found by minimizing the sum of squared forecast errors on past data.", "A larger α makes the smoothed series respond more slowly to real changes.", "If seasonal swings grow in proportion to the overall level, a multiplicative seasonal factor fits better than an additive one.", "If most week-to-week fluctuation is random noise, α should be closer to 0."], "answer": [1, 3, 4], "explain": "Lots of randomness → α near 0, so the model trusts the baseline more. α, β and γ are fit by minimizing squared error, and proportional swings call for multiplicative seasonality. The variance of the error grows with the horizon, but the error is not always larger (Discussion 4.3). A larger α responds faster, not slower.", "trap": "SELECT-ALL", "concept": "Exponential smoothing: α, fitting, horizon, additive vs multiplicative", "note": "α near 0 = lots of noise (trust the past); fit α,β,γ by min Σ(error²); multiplicative when swings scale with level.", "refs": ["M7 L1 p16", "M7 L4 p17", "M7 L2 p20", "Discussion 4.3 (exp. smoothing horizon)"]}]}, {"id": "C-3", "module": "M7", "title": "ARIMA for monthly subscriber growth", "setup": "A streaming service has 72 months of new-subscriber counts. The series rises steadily, has little seasonality, and has few peaks, valleys or outliers. An analyst wants a short-term forecast for the next 2–3 months.", "parts": [{"q": "The analyst first takes one difference of the data (each month minus the previous month). Which ARIMA term does this set, and why?", "type": "single", "fixed": false, "options": ["d = 1, so the trending series becomes stationary", "q = 1, so one previous forecast error is used", "p = 1, so one previous value is used as a predictor", "d = 1, so the random noise is removed from the series"], "answer": [0], "explain": "d is the order of differencing (the 'I'). Differencing a trending series makes it stationary, with mean and variance roughly constant over time. p is the autoregressive order (past differenced values) and q is the moving-average order (past forecast errors). Differencing removes the trend, not the noise.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "ARIMA: d and stationarity", "note": "ARIMA(p,d,q): d = # differences to make data stationary; p = AR lags of differenced values; q = MA lags of past errors.", "refs": ["M7 L5 p4", "M7 L5 p8", "M7 L5 p20"]}, {"q": "The analyst fits ARIMA(0,1,1). A colleague points out that this is equivalent to a model already covered in the course. Which one?", "type": "single", "fixed": false, "options": ["A pure AR(1) model", "Simple (single) exponential smoothing", "Holt-Winters triple exponential smoothing", "GARCH(1,1)", "A random walk"], "answer": [1], "explain": "ARIMA(0,1,1), with one difference, no AR terms and one MA term, is simple exponential smoothing. A random walk is ARIMA(0,1,0). Holt-Winters adds trend and seasonal terms that ARIMA(0,1,1) doesn't have.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "ARIMA(0,1,1) = simple ES", "note": "ARIMA(0,1,1) = simple exponential smoothing; ARIMA(0,1,0) = random walk.", "refs": ["M7 L5 p19", "M7 L5 p20"]}, {"q": "A second product launched 15 weeks ago and its weekly sales are spiky. Which approach is more sensible for short-term forecasts?", "type": "single", "fixed": false, "options": ["ARIMA with large d, which removes the spikes and allows long-range forecasting", "ARIMA, because it contains exponential smoothing as a special case and so can't do worse", "GARCH, because spiky data means the variance is what should be forecast", "Exponential smoothing, because ARIMA usually needs about 40 data points and does best on stable data"], "answer": [3], "explain": "The lecture's rule of thumb is that ARIMA needs about 40 past data points and tends to beat exponential smoothing only on stable data. With 15 spiky points, exponential smoothing is the better choice. 'More general can't be worse' sounds reasonable, but too little data overrides it. Both methods are for short-term forecasting.", "trap": "GENERALLY-TRUE-BUT-OVERRIDDEN", "concept": "ARIMA data requirements", "note": "ARIMA: ~40+ points, stable data, short-term; spiky/short series → exponential smoothing.", "refs": ["M7 L5 p31"]}]}, {"id": "C-4", "module": "M7", "title": "Forecasting demand variability for safety stock", "setup": "An online retailer already forecasts average weekly demand for a popular item well, from 4 years of weekly data. What the operations team does not know is how much demand will vary around that forecast in the coming weeks: some periods are calm and others are volatile. They want to use that information to set safety stock. (A similar need arises for an investment team that measures risk as the variance of returns.)", "parts": [{"q": "Which model is most appropriate for forecasting how variable demand will be in the coming weeks?", "type": "single", "fixed": true, "options": ["ARIMA", "CART", "Cross-validation", "CUSUM", "Exponential smoothing", "GARCH", "k-means clustering", "k-nearest-neighbor classification", "Linear regression", "Logistic regression", "Support vector machine"], "answer": [5], "explain": "GARCH estimates or forecasts the variance of a time series. ARIMA and exponential smoothing forecast the value itself, which the retailer already has. CUSUM detects whether a change has happened. It doesn't forecast variance.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Model choice: GARCH for variance", "note": "Forecast VARIANCE of a time series → GARCH (investment risk, inventory buffers).", "refs": ["M7 L6 p7", "Discussion 4.2 (predicting variance)"]}, {"q": "Select ALL statements that correctly describe GARCH as presented in the lecture.", "type": "multi", "fixed": false, "options": ["It uses squared past errors (and past variances) as predictors.", "It estimates or forecasts the variance of the series rather than its value.", "It does not use differencing, unlike ARIMA's d term.", "It requires a cycle length L, like Holt-Winters.", "Its main output is a point forecast of next week's demand."], "answer": [0, 1, 2], "explain": "GARCH looks like ARIMA, but it models variance using squared errors and past variances, and it has no differencing term. It doesn't need a cycle length L. Its output is a forecast of variance, not of demand.", "trap": "SELECT-ALL", "concept": "GARCH vs ARIMA", "note": "GARCH: variance, squared errors, no d. ARIMA: value, raw errors, has d.", "refs": ["M7 L6 p11", "M7 L6 p13"]}, {"q": "How should the retailer use the GARCH variance forecast?", "type": "single", "fixed": false, "options": ["Carry less safety stock in weeks when the forecast variance is higher", "Use it to signal the exact week when average demand shifted", "Carry inventory above the point-estimate demand, with a larger buffer when the forecast variance is higher", "Use it in place of the demand forecast when ordering"], "answer": [2], "explain": "The professor's example: predicting the variance of demand tells you how much inventory to carry above the point-estimate expectation, and more variance means more buffer. Carrying less stock when variance is higher reverses this. Detecting a shift in the mean is a job for CUSUM.", "trap": "DIRECTION FLIP", "concept": "Uses of variance forecasts", "note": "Variance forecast → buffer above point estimate (inventory); risk in portfolio optimization.", "refs": ["Discussion 4.2 (predicting variance)", "M7 L6 p12"]}]}, {"id": "C-5", "module": "M8", "title": "Regression of delivery times", "setup": "A courier fits a linear regression of delivery time (minutes) on 100 past deliveries. Predictors: distance (km), number of stops, weekend (1 = weekend, 0 = weekday), rain (1 = raining, 0 = dry), and the product rain×distance.<table class='dt'><tr><th>Term<\/th><th>Coefficient<\/th><th>p-value<\/th><\/tr><tr><td>Intercept<\/td><td>10.0<\/td><td>&lt;0.001<\/td><\/tr><tr><td>distance<\/td><td>2.5<\/td><td>&lt;0.001<\/td><\/tr><tr><td>stops<\/td><td>2.0<\/td><td>0.003<\/td><\/tr><tr><td>weekend<\/td><td>−0.4<\/td><td>0.68<\/td><\/tr><tr><td>rain<\/td><td>1.0<\/td><td>0.04<\/td><\/tr><tr><td>rain×distance<\/td><td>0.5<\/td><td>0.01<\/td><\/tr><\/table>R² = 0.71, adjusted R² = 0.69", "parts": [{"q": "What does the coefficient 2.0 on <i>stops<\/i> mean?", "type": "single", "fixed": false, "options": ["Each extra stop is associated with about 2 more minutes, because drivers need about 2 minutes to park at each stop.", "Number of stops accounts for about 2% of the variation in delivery time.", "Each extra stop is associated with about 2 more minutes of delivery time, holding the other predictors fixed.", "Each extra stop increases delivery time by about 2%."], "answer": [2], "explain": "A coefficient is the change in the predicted response per one-unit increase in that predictor, holding the others fixed, in minutes per stop. The parking explanation may sound reasonable, but the regression shows association, not why.", "trap": "CAUSAL ADD-ON", "concept": "Regression: coefficient interpretation", "note": "a_j = change in predicted y per unit of x_j, others held fixed (units: y-units per x-unit).", "refs": ["M8 L1 p29", "M8 L3 p13"]}, {"q": "What is the best reading of the weekend p-value of 0.68?", "type": "single", "fixed": false, "options": ["There is an estimated 68% chance the weekend coefficient is really nonzero, so keep it.", "Weekend status explains 68% of the variation in delivery time.", "There's a high estimated probability that the weekend coefficient is really zero. Since p > 0.05, it's a candidate to remove.", "Weekend deliveries are estimated to be about 0.4 minutes faster than weekday ones."], "answer": [2], "explain": "Using the lecture's phrasing, the p-value estimates the probability that the coefficient might really be zero. Above 0.05 (the usual threshold), the attribute is a candidate for removal. The −0.4-minute reading is a true statement about the coefficient, but it doesn't answer what the p-value means.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Regression: p-values", "note": "p-value ≈ probability coefficient is really 0 (lecture); p > 0.05 → consider removing.", "refs": ["M8 L6 p6"]}, {"q": "Holding stops and weekend fixed, how much longer is the predicted time for a 6 km delivery in the rain than for the same delivery when it's dry?", "type": "single", "fixed": true, "options": ["1.0 minute", "3.0 minutes", "4.0 minutes", "4.5 minutes", "16.0 minutes"], "answer": [2], "explain": "Rain adds its own coefficient plus the interaction coefficient times distance: 1.0 + 0.5×6 = 4.0 minutes. 3.0 leaves out the rain main effect. The interaction lets the per-km slope differ, at 3.0 per km in rain versus 2.5 when dry, and the model is still linear regression because it is linear in the coefficients.", "trap": "WRONG-QUANTITY", "concept": "Regression: interaction terms", "note": "Interaction x1·x2: effect of x1 depends on x2; still linear (linear in coefficients).", "refs": ["M8 L5 p14", "M8 L5 p8"]}, {"q": "The manager asks two questions: (1) \"How much does each extra stop add to delivery time?\" and (2) \"How long will tomorrow's 8 km, 3-stop delivery on a dry weekday take?\" Which is correct?", "type": "single", "fixed": false, "options": ["(1) predictive, from the fitted response; (2) descriptive, from the coefficients, about 36 minutes", "(1) descriptive, from the stops coefficient; (2) predictive, from the fitted response, about 36 minutes", "(1) descriptive, from the stops coefficient; (2) predictive, from the fitted response, about 26 minutes", "(1) descriptive, from the stops coefficient; (2) predictive, from the fitted response, about 41 minutes"], "answer": [1], "explain": "Reading a coefficient answers a descriptive question about how the system works. Plugging values in answers a predictive one: 10 + 2.5×8 + 2.0×3 = 36 minutes on a dry weekday. 26 leaves out the intercept, and 41 wrongly adds the rain terms (1.0 + 0.5×8).", "trap": "WRONG-QUANTITY", "concept": "Regression: descriptive vs predictive use", "note": "Descriptive = interpret coefficients; predictive = plug in x to get ŷ (include the intercept).", "refs": ["M8 L1 p6", "M8 L1 p11"]}]}, {"id": "C-6", "module": "M8", "title": "Choosing among energy-use models with AIC and BIC", "setup": "An energy company fits three regression models of household energy use on n = 1,000 households.<table class='dt'><tr><th>Model<\/th><th>Parameters k<\/th><th>AIC<\/th><th>BIC<\/th><\/tr><tr><td>A<\/td><td>4<\/td><td>210<\/td><td>230<\/td><\/tr><tr><td>B<\/td><td>6<\/td><td>206<\/td><td>235<\/td><\/tr><tr><td>C<\/td><td>10<\/td><td>208<\/td><td>257<\/td><\/tr><\/table>Recall AIC = 2k − 2 ln L*, BIC = k ln n − 2 ln L*, and relative likelihood = e<sup>(AIC<sub>min<\/sub> − AIC<sub>i<\/sub>)/2<\/sup>.", "parts": [{"q": "Based on AIC, which model is preferred, and how likely is Model A to be better, relative to that model?", "type": "single", "fixed": false, "options": ["Model C, since it has the most parameters and the highest likelihood; A is about e⁻¹ as likely", "Model A, since it is the simplest; B is about e⁻² ≈ 14% as likely", "Model B; A is about e⁻² ≈ 14% as likely to be better", "Model B; A is about e⁻⁴ ≈ 2% as likely to be better"], "answer": [2], "explain": "B has the smallest AIC (206). A's relative likelihood is e^((206−210)/2) = e^−2 ≈ 0.135. C fits the training data best (highest L*), but its extra parameters don't make up for that, so its AIC is higher. e^−4 forgets to halve the difference.", "trap": "OVERFIT-LOOKS-BETTER", "concept": "AIC comparison and relative likelihood", "note": "Smaller AIC better; relative likelihood of model i = e^((AICmin−AICi)/2).", "refs": ["M8 L2 p13", "M8 L2 p21"]}, {"q": "BIC prefers Model A over Model B by 5. Using the lecture's rule of thumb for BIC differences, what can be said?", "type": "single", "fixed": true, "options": ["A is very likely better than B", "A is likely better than B", "A is somewhat likely better than B", "A is only slightly likely better than B"], "answer": [2], "explain": "Lecture bands: more than 10 = very likely better, 6–10 = likely, 2–6 = somewhat likely, 0–2 = slightly. A difference of 5 falls in 2–6. BIC disagrees with AIC here because its penalty per parameter is ln(1000) ≈ 6.9 rather than 2, so it favors fewer parameters.", "trap": "WRONG-QUANTITY", "concept": "BIC difference bands", "note": "BIC diff >10 very likely, 6–10 likely, 2–6 somewhat, 0–2 slightly; BIC penalizes params more (ln n > 2 for n ≥ 8).", "refs": ["M8 L2 p22", "M8 L2 p23"]}, {"q": "The software fit each model by least squares, but AIC and BIC are defined using the maximum likelihood L*. Is that a problem?", "type": "single", "fixed": false, "options": ["Yes. AIC and BIC can only be used with logistic regression.", "Yes. Least squares and maximum likelihood always give different coefficients.", "No. If the errors are independent and normally distributed with mean 0 and constant variance, least squares gives the maximum likelihood fit.", "No. Least squares maximizes R², and R² equals the likelihood."], "answer": [2], "explain": "Under independent, identically distributed normal errors, maximizing the likelihood is the same as minimizing the sum of squared errors, so least squares gives the maximum likelihood fit. Without that assumption they can differ, but they don't always differ.", "trap": "none", "concept": "Least squares = maximum likelihood", "note": "With iid normal errors (mean 0, constant σ²), least squares = maximum likelihood.", "refs": ["M8 L2 p3", "M8 L2 p9"]}, {"q": "Suppose Model A (k = 4) had instead been fit to only n = 25 households. Using AICc = AIC + 2k(k+1)/(n−k−1), how does AICc compare with AIC?", "type": "single", "fixed": true, "options": ["AICc = AIC", "AICc = AIC + 0.4", "AICc = AIC + 2", "AICc = AIC + 8", "AICc = AIC + 40"], "answer": [2], "explain": "2·4·5/(25−4−1) = 40/20 = 2. The correction matters when n is small relative to k, and it shrinks toward 0 as n grows. 40 forgets to divide by n−k−1.", "trap": "WRONG-QUANTITY", "concept": "AICc correction", "note": "AICc = AIC + 2k(k+1)/(n−k−1); use for small n; → AIC as n grows.", "refs": ["M8 L2 p20"]}]}, {"id": "C-7", "module": "M8", "title": "Push notifications and spending in 2 million users", "setup": "A mobile app regresses each user's monthly spending ($) on the number of push notifications the user received that month, using 2,000,000 users. Notifications are sent automatically when a user browses items. The coefficient on notifications is $0.01 per notification with p &lt; 0.0001. A typical user receives 20 notifications a month and spends $50. R² = 0.04.", "parts": [{"q": "What is the best summary of the notifications result?", "type": "single", "fixed": false, "options": ["p < 0.0001 means the model explains 99.99% of the variation in spending.", "Notifications are a major driver of spending, because p < 0.0001.", "It's statistically significant but practically tiny, about 20 cents a month for a typical user. With 2 million data points, even very small effects become significant.", "The effect is statistically significant, so notifications should stay in the model."], "answer": [2], "explain": "20 × $0.01 = $0.20 against $50 of spending. With huge data, p-values become tiny even for effects too small to matter, so check the coefficient's practical size. 'Significant, so keep it' is true but misses the point that the effect is negligible.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "p-values with huge data; practical significance", "note": "Huge n → tiny effects significant; check coefficient × typical x vs typical y.", "refs": ["M8 L6 p8", "M8 L6 p12"]}, {"q": "The product team wants to claim that notifications <i>cause<\/i> spending. Select ALL of the following that are rules of thumb from the lecture for claiming causation.", "type": "multi", "fixed": false, "options": ["Regressing notifications on spending gives a weaker p-value than regressing spending on notifications.", "The causal idea makes sense.", "The coefficient's p-value is below 0.05.", "There is no outside factor that could be causing the relationship.", "The cause comes before the effect."], "answer": [1, 3, 4], "explain": "The three rules: the cause comes first, the idea makes sense, and no outside factor could explain it. Here browsing triggers notifications and also leads to spending, so it is a likely outside factor. In simple regression, reversing x and y gives the same p-value and R², so the model can't show which way cause runs, and significance alone shows only correlation.", "trap": "SELECT-ALL", "concept": "Causation vs correlation", "note": "3 causation rules: cause before effect, makes sense, no outside factor. Reversing x,y gives the same p/R².", "refs": ["M8 L4 p10", "M8 L4 p12", "M8 L4 p13"]}, {"q": "A data scientist then tests 200 randomly generated user attributes, none truly related to spending, one at a time at the 0.05 level. About how many would be expected to appear significant?", "type": "single", "fixed": true, "options": ["0", "1", "10", "20", "190"], "answer": [2], "explain": "200 × 0.05 = 10 false positives expected by chance. This is the multiple-testing problem: with many tests, some unrelated attributes will look significant.", "trap": "WRONG-QUANTITY", "concept": "Multiple testing", "note": "Testing m unrelated attributes at 0.05 → ~0.05·m false 'significant' ones.", "refs": ["M8 L6 p6"]}]}, {"id": "C-8", "module": "M8", "title": "Admissions models: SVM, regression and R²", "setup": "A graduate program's admissions committee is exploring models built on past applicants (test scores, GPA, work experience, essays). One decision is classification: admit or don't admit. Separately, a corporate sponsor funds a fellowship for the applicant expected to have the most success, measured by first-year GPA.", "parts": [{"q": "Regression and SVM both produce a line y = a<sub>0<\/sub> + a<sub>1<\/sub>x<sub>1<\/sub> + … . Which statement is correct?", "type": "single", "fixed": false, "options": ["Regression is affected more by points close to the line; SVM is affected more by far points.", "SVM is affected more by points close to the line (the support vectors); regression is affected more by far points, because errors are squared.", "Neither is affected by far points, because both ignore outliers.", "Both are affected equally by all points, because the formulas look the same."], "answer": [1], "explain": "The SVM line is set by the support vectors near the margin. Squaring errors in regression gives far points a larger effect. Admit/don't-admit decisions depend on the borderline applicants, while picking a fellowship winner depends on telling apart the top applicants, who are far from the line.", "trap": "DIRECTION FLIP", "concept": "Regression vs SVM: near vs far points", "note": "SVM ← near points (support vectors); regression ← far points (squared error).", "refs": ["Discussion 5.1 (regression vs SVM)", "M8 L1 p23"]}, {"q": "The sponsor wants to estimate how much each extra year of work experience is associated with first-year GPA, holding the other applicant factors fixed. Which model is most appropriate?", "type": "single", "fixed": true, "options": ["ARIMA", "CART", "Cross-validation", "CUSUM", "Exponential smoothing", "GARCH", "k-means clustering", "k-nearest-neighbor classification", "Linear regression", "Logistic regression", "Support vector machine"], "answer": [8], "explain": "The question asks for a numeric response and the effect of each factor with the others held fixed, which a linear regression coefficient gives directly. Logistic regression is for probabilities or yes/no responses, and SVM and KNN classify.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Model choice: linear regression", "note": "Quantify effect of a factor on a numeric response (others fixed) → linear regression.", "refs": ["M8 L1 p29", "M8 L3 p13"]}, {"q": "The first-year GPA model has R² = 0.35. A physics-based model elsewhere in the university has R² = 0.95. What should the committee conclude?", "type": "single", "fixed": false, "options": ["R² = 0.35 means the model's predictions are correct 35% of the time.", "The GPA model is useless, since its R² is below 0.5.", "The GPA model may still be useful. With human behavior, R² around 0.3–0.4 is often a good result.", "Keep adding predictors until R² reaches about 0.9, as in the physics model."], "answer": [2], "explain": "Human behavior has a lot of variability and many factors, so R² of 0.3–0.4 (sometimes less) can still mean a positive result. Adding predictors never lowers training R², but chasing it just fits noise, and adjusted R² would penalize it.", "trap": "OVERFIT-LOOKS-BETTER", "concept": "R² for human behavior", "note": "Human-behavior models: R² 0.3–0.4 can be good; R² = share of variance explained; adjusted R² penalizes extra predictors.", "refs": ["Discussion 5.2 (R² human behavior)", "M8 L6 p15", "M8 L6 p16"]}, {"q": "Select ALL good ways, according to the professor and lecture, to check whether work experience has a linear or nonlinear relationship with first-year GPA.", "type": "multi", "fixed": false, "options": ["Trust a statistical test's result even if you can't see or explain the pattern it suggests.", "Look at plots and residuals, and if the data are too dense to read, look at subsets of the data.", "A scatterplot of GPA against work experience alone always shows the true shape, even with many other predictors.", "Add an x² term and see whether it helps. The model is still linear regression, because it is linear in the coefficients.", "Think about what the underlying relationship might be, then test that idea."], "answer": [1, 3, 4], "explain": "The professor reasons about the mechanism, looks at plots and residuals (using subsets when the data are dense), and confirms test results by looking at the data. A quadratic term is a valid way to test for curvature. He warns against accepting a test he can't make sense of, and notes that with many predictors, others can hide a predictor's relationship.", "trap": "SELECT-ALL", "concept": "Checking linearity", "note": "Check linearity: reason about mechanism + plots/residuals (subsets) + tests, confirming each with the other; x² term still linear regression.", "refs": ["Discussion 5.3 (checking linearity)", "M8 L5 p8"]}]}, {"id": "D-1", "module": "M9", "title": "Insurance claims that fan out", "setup": "An insurer regresses the size of each car-insurance claim (in $ thousands, always positive) on the driver's age and the vehicle's value. In the residual plot, the misses are small for small predicted claims and several times larger for large predicted claims, so the points form a widening fan. A Q-Q plot of the response bends away from the straight line. The analyst considers a Box-Cox transformation <b>t(y) = (y<sup>λ<\/sup> − 1) / λ<\/b>.", "parts": [{"q": "What is the pattern in the residual plot called, and why does it matter for the regression?", "type": "single", "fixed": false, "options": ["Multicollinearity: age and vehicle value move together, so the coefficients are unstable", "Heteroscedasticity: the large high-end misses dominate the squared-error sum and pull the fit", "A trend: claim sizes rise over time, so the same factor values give different claims in different years", "Overfitting: the model fits the small claims too closely and the large claims too loosely"], "answer": [1], "explain": "Spread that grows with the size of the value is heteroscedasticity, and because least squares sums squared errors, the big errors at the high end drive the fit. A trend is a different problem (a change in level over time), and detrending fixes it, not Box-Cox.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Box-Cox: heteroscedasticity", "note": "Heteroscedasticity = unequal spread (e.g. bigger at high values); large errors dominate SSE and bias the fit; Box-Cox fixes spread, detrending fixes level.", "refs": ["M9 L1 p8", "M9 L1 · transcript"]}, {"q": "Software picks λ = 0.5. The regression on t(y) predicts t = 3 for a new driver. What claim size (in $ thousands) should the analyst report?", "type": "single", "fixed": false, "options": ["3", "9", "6.25", "2.5"], "answer": [2], "explain": "Undo the transformation: y = (λt + 1)<sup>1/λ<\/sup> = (0.5·3 + 1)<sup>2<\/sup> = 2.5² = 6.25. Reporting 3 gives the prediction in transformed units; 9 just squares t and skips the −1 and ÷λ steps.", "trap": "WRONG-QUANTITY", "concept": "Box-Cox: back-transforming predictions", "note": "Box-Cox predictions are in transformed units: convert back with y = (λt + 1)^(1/λ) (or e^t if λ = 0).", "refs": ["M9 L1 p12 · applied", "M9 L1 p13–14"]}, {"q": "Select ALL steps that are good practice for this Box-Cox transformation.", "type": "multi", "fixed": false, "options": ["Check first (e.g. with the Q-Q plot) whether a transformation is needed at all", "Let the software choose λ so that the transformed response is as close to normal as possible", "Apply the transformation to the response, the claim size", "Use it to remove the steady year-over-year rise in claim sizes caused by inflation", "Read the fitted coefficients directly as dollars per unit of each predictor"], "answer": [0, 1, 2], "explain": "The lecture's Box-Cox recipe: check normality (Q-Q plot), let software pick λ to make t(y) close to normal, and transform the response. Removing a rise over time is detrending, and the coefficients are now in transformed units, not dollars.", "trap": "SELECT-ALL", "concept": "Box-Cox: procedure", "note": "Box-Cox: Q-Q check → software picks λ (t(y) ≈ normal) → model t(y) → transform predictions back.", "refs": ["M9 L1 p13–14", "M9 L1 p14"]}]}, {"id": "D-2", "module": "M9", "title": "Detrending gold prices", "setup": "An analyst builds a regression that estimates the end-of-year price of gold (1975–2015) from two predictors: the U.S. money supply, which has risen steadily over the whole period, and an annual political-risk index, which goes up and down with no trend. A line fitted to price against year gives <b>trend price ≈ −45,600 + 23.2 × year<\/b>. Suppose the actual price in the year 2000 was 1,000.", "parts": [{"q": "What is the detrended gold price for 2000?", "type": "single", "fixed": false, "options": ["1,000", "800", "−200", "200"], "answer": [3], "explain": "Trend value for 2000 = −45,600 + 23.2 × 2000 = −45,600 + 46,400 = 800, so detrended = actual − trend = 1,000 − 800 = 200. 1,000 is the raw price, 800 is the trend itself, and −200 subtracts in the wrong order.", "trap": "DIRECTION FLIP", "concept": "Detrending: computing a detrended value", "note": "Detrend: regress the variable on time (y = a0 + a1·t), then detrended value = actual − (a0 + a1·t).", "refs": ["M9 L2 p8–9", "M9 L2 p8–9 · applied"]}, {"q": "Which variables should be detrended before fitting the regression?", "type": "single", "fixed": false, "options": ["Only the gold price, since the response is what the model predicts", "The gold price and the money supply, the variables that trend", "Only the money supply, since predictors cause the response", "All three, including the political-risk index, so the variables match"], "answer": [1], "explain": "The lecture detrends the response and every predictor that has a trend, each by fitting its own line on time and subtracting it; the risk index has no trend, so there is nothing to remove. Detrending only the response leaves the money supply carrying the trend, so the same factor values in, say, 1974 and 2009 still go with very different prices.", "trap": "GENERALLY-TRUE-BUT-OVERRIDDEN", "concept": "Detrending: which variables", "note": "Detrend the response AND each trending predictor (separate fit on time for each); leave variables with no trend alone.", "refs": ["M9 L2 p3–6", "M9 L2 p7"]}, {"q": "Select ALL series that are natural candidates for detrending before they are used in a factor-based model (such as regression or SVM) built on data over many years.", "type": "multi", "fixed": false, "options": ["World-championship 100-meter dash winning times since 1950", "NFL field-goal success rates from 40–49 yards since 1978", "Annual sales of a company whose revenue has grown every year", "Heights of 500 adults all measured in the same week", "Daily coin-flip results from a fair coin over ten years"], "answer": [0, 1, 2], "explain": "Human performance against nature (sprint times getting faster, kickers making far more long field goals) and steadily growing sales all trend over time. The heights were all measured at one time, so there is no time dimension, and fair coin flips have no trend.", "trap": "SELECT-ALL", "concept": "Detrending: when to use it", "note": "Detrend any variable that drifts over time (inflation, growth, human performance over the decades) before a factor-based model uses it.", "refs": ["M9 L2 p7", "Discussion 6.1 (detrending examples)"]}]}, {"id": "D-3", "module": "M9", "title": "PCA on house predictors", "setup": "A realtor predicts house price from four scaled predictors: square footage, number of rooms, distance to downtown, and age. Square footage and number of rooms have correlation 0.95. PCA on the scaled data gives these eigenvalues:<table class='dt'><tr><th>Component<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><tr><td>Eigenvalue<\/td><td>2.9<\/td><td>0.8<\/td><td>0.25<\/td><td>0.05<\/td><\/tr><\/table>The realtor then regresses price on components 1 and 2 and gets <b>price = 50 + 10·z<sub>1<\/sub> + 4·z<sub>2<\/sub><\/b>. The eigenvector entries for square footage are v<sub>sqft,1<\/sub> = 0.6 and v<sub>sqft,2<\/sub> = 0.5.", "parts": [{"q": "The realtor wants a two-variable model. Which components should PCA keep?", "type": "single", "fixed": false, "options": ["Components 3 and 4, because their small eigenvalues mean they repeat the least information", "Square footage and distance, because those original predictors are least correlated with each other", "Components 1 and 2, because they have the largest eigenvalues and so the most variance", "Components 2 and 3, because component 1 is mostly the square footage–rooms overlap"], "answer": [2], "explain": "The components are ranked by eigenvalue, which is the variance along that direction, and you keep the first n. Keeping the smallest-eigenvalue components reverses the ranking, and PCA keeps components, not a subset of the original predictors.", "trap": "DIRECTION FLIP", "concept": "PCA: choosing components", "note": "Eigenvalue = variance along that component; rank by eigenvalue and keep the first n.", "refs": ["M9 L4 p8–9", "M9 L5 p3 · applied"]}, {"q": "What do the eigenvalue 0.05 for component 4, and the eigenvectors in general, tell the realtor?", "type": "single", "fixed": false, "options": ["The eigenvectors of XᵀX for the scaled data give the component directions; 0.05 means the data barely vary along component 4", "The eigenvectors of XᵀX for the scaled data give the component directions; 0.05 means component 4 cannot help predict price", "The eigenvectors are the regression coefficients on the original predictors; 0.05 means component 4's coefficient is small", "The eigenvectors are the correlations of each predictor with price; 0.05 means a predictor should be dropped"], "answer": [0], "explain": "PCA's directions are the eigenvectors of XᵀX (scaled data), and each eigenvalue measures the variance along its direction; a tiny one here probably reflects that square footage and rooms almost always move together. It does not prove component 4 is useless for price, because PCA never looks at the response.", "trap": "GENERALLY-TRUE-BUT-OVERRIDDEN", "concept": "PCA: eigenvectors and eigenvalues", "note": "PCA directions = eigenvectors of XᵀX (scaled data); eigenvalue ≈ variance along it; PCA ignores the response.", "refs": ["M9 L4 p5–6", "M9 L5 p3"]}, {"q": "What is the implied coefficient on (scaled) square footage in terms of the original predictors?", "type": "single", "fixed": false, "options": ["14", "6", "8", "0.6"], "answer": [2], "explain": "a<sub>j<\/sub> = Σ<sub>k<\/sub> b<sub>k<\/sub> v<sub>jk<\/sub> = 10·0.6 + 4·0.5 = 6 + 2 = 8. 14 adds the regression coefficients without weighting them by the eigenvector entries, and 6 uses only component 1.", "trap": "WRONG-QUANTITY", "concept": "PCA: converting back to original factors", "note": "Back to original factors: a_j = Σ_k b_k·v_jk (b = coefficient on component k, v_jk = factor j's entry in eigenvector k).", "refs": ["M9 L4 p12–14", "M9 L4 p12–14 · applied"]}]}, {"id": "D-4", "module": "M9", "title": "What PCA can and can't do", "setup": "A lab classifies blood samples as healthy (blue) or diseased (red) from five test measurements. In a two-test view, the points form a long, thin cloud tilted at 45°. The long direction is D1 and the short direction, at right angles to it, is D2. All red points lie on one side of the D1 axis and all blue points on the other side, so moving along D2 separates the classes, while moving along D1 does not.", "parts": [{"q": "The lab uses PCA on these two tests and keeps only one component. Which one does PCA recommend?", "type": "single", "fixed": false, "options": ["D2, because PCA picks the direction that best separates red from blue", "D1, because it has the larger variance; PCA does not look at the red/blue labels", "D2, because the smaller-variance direction is always the one carrying class information", "D1, because it separates red from blue better than D2 does"], "answer": [1], "explain": "PCA uses only the predictors, so it ranks D1 first because the data spread most along it, whatever the colors are. This is the lecture's Figure 2 case: with the same cloud but different labels (Figure 1) D1 would separate the classes; here the useful direction is D2, the one PCA says to drop.", "trap": "none", "concept": "PCA ignores the response", "note": "PCA ranks by predictor variance only; it never sees the response, so it can discard the direction that predicts best (Figure 2).", "refs": ["M9 L6 p7–9", "M9 L6 p10"]}, {"q": "For a separate continuous response, the lab runs one linear regression on all five original tests and another on all five principal components. Which has the higher R²?", "type": "single", "fixed": false, "options": ["The PCA regression, because its predictors are uncorrelated", "The original regression, because PCA loses some of the information", "It depends on how large the first eigenvalue is", "Neither: using all five components gives the same fit and the same R²"], "answer": [3], "explain": "Using all components just rotates the coordinate system; the points stay in the same places relative to each other, so the best-fit model and R² are identical. Information is lost only when you drop components.", "trap": "GENERALLY-TRUE-BUT-OVERRIDDEN", "concept": "PCA: all components give the same R²", "note": "Regression on ALL m principal components = same fit and same R² as on the m original predictors (just a rotation).", "refs": ["Discussion 6.2 (PCA and R²)", "M9 L3 p8–9"]}, {"q": "To cut costs, the lab plans to keep only the first principal component of the five tests. Which statement is correct?", "type": "single", "fixed": false, "options": ["The lab can stop running four of the tests, because the model now uses one variable", "The lab must still run all five tests, but the model now works in only one dimension", "The lab must still run all five tests, and the model still works in five dimensions", "The lab can stop running the tests with small entries in the eigenvector, without changing the model"], "answer": [1], "explain": "Each component is a weighted mix of all the original features, so computing it still needs all five tests; but every point is projected onto one direction, so the model is one-dimensional, simpler and less prone to overfitting. PCA does not save data collection.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "PCA: one component needs all features", "note": "One PC still needs ALL original features (it's a mix of them), but the data are reduced to one dimension → less overfitting.", "refs": ["Discussion 6.3 (one principal component)", "M9 L4 p7"]}, {"q": "In a different study, the points lie along a curved, crescent-shaped band rather than a straight cloud. Which approach suits this best?", "type": "single", "fixed": false, "options": ["Kernel PCA, which finds non-linear directions", "Standard PCA, keeping more components", "A Box-Cox transformation of each predictor", "Detrending each predictor before PCA"], "answer": [0], "explain": "Standard PCA finds straight-line directions; for curved structure the lecture points to kernel PCA. Box-Cox and detrending address spread and drift, not curvature among predictors.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Kernel PCA", "note": "PCA = linear rotation; non-linear structure → kernel PCA.", "refs": ["M9 L4 p10"]}]}, {"id": "D-5", "module": "M10", "title": "Bike-rental regression tree", "setup": "A bike-share company fits a regression tree to 400 days of data to predict daily rentals (Tree T1). Leaves show the number of days and the average rentals:<table class='dt'><tr><th>Leaf<\/th><th>Path<\/th><th>Days<\/th><th>Average rentals<\/th><\/tr><tr><td>A<\/td><td>Temp ≤ 15°C<\/td><td>120<\/td><td>40<\/td><\/tr><tr><td>B<\/td><td>Temp &gt; 15°C, weekend<\/td><td>150<\/td><td>90<\/td><\/tr><tr><td>C<\/td><td>Temp &gt; 15°C, weekday, public holiday<\/td><td>3<\/td><td>200<\/td><\/tr><tr><td>D<\/td><td>Temp &gt; 15°C, weekday, not a holiday<\/td><td>127<\/td><td>60<\/td><\/tr><\/table>Tree T2 is the same, except the weekday branch is not split on holiday (one leaf of 130 days). T1 has a slightly lower training error than T2.", "parts": [{"q": "Using T1, what does the tree predict for a 20°C Saturday?", "type": "single", "fixed": false, "options": ["150", "60", "97.5", "90"], "answer": [3], "explain": "The day goes to leaf B (warm, weekend), and a leaf predicts the average response of its data points: 90. 150 is the number of days in the leaf, and 97.5 averages the four leaf values, which the tree never does.", "trap": "WRONG-QUANTITY", "concept": "Regression tree: leaf prediction", "note": "Regression tree: follow the branches to a leaf; prediction = the average response of the training points in that leaf.", "refs": ["M10 L1 p13–18", "M10 L3 p5–7"]}, {"q": "Software fits only a constant in each leaf, y = a<sub>0<\/sub>. Why is that constant the leaf's average?", "type": "single", "fixed": false, "options": ["Minimizing Σ(y<sub>i<\/sub> − a<sub>0<\/sub>)² gives a<sub>0<\/sub> = the mean, exactly like a regression with no predictors", "Minimizing Σ(y<sub>i<\/sub> − a<sub>0<\/sub>)² gives a<sub>0<\/sub> = the median, so one extreme rental day cannot pull the leaf's estimate", "The average is the value that maximizes the variance decrease at the leaf", "The leaf uses the average because every leaf has a different full regression model"], "answer": [0], "explain": "Setting the derivative of Σ(y<sub>i<\/sub> − a<sub>0<\/sub>)² to zero gives a<sub>0<\/sub> = (1/n)Σy<sub>i<\/sub>, which is what a regression with only an intercept and no predictors returns. Trees can fit a different full regression in each branch, but in practice they use this constant because it is much faster.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Regression tree leaf = no-predictor regression", "note": "Leaf model y = a0: minimizing Σ(yi − a0)² → a0 = mean = regression with no predictors.", "refs": ["M10 L1 p22–24", "M10 L1 p20–21", "Discussion 7.1 (leaf average)"]}, {"q": "Which tree is better, and why?", "type": "single", "fixed": false, "options": ["T1, because its training error is lower than T2's, so it fits the data better", "T2, because leaf C has only 3 of 400 days, so T1 overfits that split", "T2, because a simpler model is always better than a more complex one", "T1, because it uses more factors to explain rentals"], "answer": [1], "explain": "Leaf C has 3 days, far below the rule of thumb of 5% of the data (20 of 400), so its 200-rental estimate mostly fits random noise. T1's lower training error is true but comes from that overfit leaf, and 'simpler is better' is not the main reason here.", "trap": "OVERFIT-LOOKS-BETTER", "concept": "Regression tree: overfit leaf", "note": "Each leaf should hold ≥ 5% of the data; a tiny leaf lowers training error by overfitting.", "refs": ["M10 L2 p13"]}, {"q": "Which describes how the lecture's method would have built and checked this tree?", "type": "single", "fixed": false, "options": ["Split on a combination of factors at once; keep splitting until every leaf is pure; prune using the same data", "Split one factor at a time at the biggest variance decrease, only if it beats a threshold; then use the other half of the data to remove branches that don't help", "Split one factor at a time at the biggest variance decrease; then use the same half of the data to remove any branches that don't lower the training error there", "Split one factor at a time at random; then keep every branch, since averaging many trees removes overfitting"], "answer": [1], "explain": "Grow on half the data: for each leaf, try each factor and split where the variance decrease is largest, if it exceeds a threshold. Then prune using the other half: remove a branch if it doesn't reduce error on that data. Random splits with no pruning describe a random forest, not a single tree.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Regression tree: branching and pruning", "note": "Tree: grow on half (one factor at a time, biggest variance decrease > threshold); prune on the other half; leaves ≥ 5% of data.", "refs": ["M10 L2 p6–10", "M10 L2 p10–11", "M10 L2 p4–5"]}, {"q": "The company now asks a yes/no question: will rentals exceed 100? In leaf B, 120 of the 150 days exceeded 100. What does leaf B give in (i) a logistic regression tree and (ii) a classification tree?", "type": "single", "fixed": false, "options": ["(i) 90 (ii) yes", "(i) 0.8 (ii) 0.8", "(i) 0.8 (ii) yes", "(i) yes (ii) 0.8"], "answer": [2], "explain": "In the simple version used in practice, a logistic regression tree leaf gives the fraction of its points that are 'yes' (120/150 = 0.8), and a classification tree leaf gives the most common class ('yes'). 90 is the regression-tree average rentals, not a probability.", "trap": "WRONG-QUANTITY", "concept": "Logistic and classification tree leaves", "note": "Leaf answers: regression tree = average; logistic tree = fraction 'yes'; classification tree = most common class; decision tree = the decision.", "refs": ["M10 L1 p26–27", "M10 L1 p28"]}]}, {"id": "D-6", "module": "M10", "title": "Forests, trees and movie tickets", "setup": "A studio predicts a movie's ticket sales. It has three models: a linear regression, a single regression tree, and a random forest of 500 trees. The linear regression's coefficient on the top four stars' total salary (in dollars) is <b>0.25<\/b>. The regression tree says salary's effect is 1/3 ticket per dollar if there are 5 or fewer similar movies; otherwise 1/2 if rated R; otherwise 1/6 if 97+ days remain; otherwise 0. The random forest has the lowest validation error of the three.", "parts": [{"q": "How is each of the forest's 500 trees built?", "type": "single", "fixed": false, "options": ["From a bootstrap sample of the data, choosing each split from a random subset of factors, with no pruning", "From all the data, choosing each split from all the factors, then pruned using the other half of the data", "From a bootstrap sample of the data, choosing each split from all factors, pruned to 5% leaves", "From a random half of the factors fixed for the whole tree, with no pruning"], "answer": [0], "explain": "Random forests add randomness two ways: each tree gets a bootstrap sample (n points drawn with replacement), and each branch chooses from a small random subset of factors. The trees are not pruned, because averaging many different trees is what controls overfitting.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Random forest: how trees are built", "note": "Random forest: bootstrap sample per tree + random factor subset at each branch + no pruning; usually 500–1000 trees.", "refs": ["M10 L3 p10–12", "M10 L3 p13", "M10 L3 p14"]}, {"q": "How does the forest produce its prediction of ticket sales for a new movie?", "type": "single", "fixed": false, "options": ["It uses the prediction of the one tree with the lowest error", "It takes the most common prediction among the 500 trees", "It averages the 500 trees' predictions", "It uses the leaf average from the first tree built"], "answer": [2], "explain": "For a regression forest, every tree predicts and the forest averages them; for classification, it takes the most common answer (a vote). No single tree is selected, which is why the forest gives no single specific model.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Random forest: combining trees", "note": "Forest answer: regression = average of the trees; classification = most common vote; no single tree is chosen.", "refs": ["M10 L3 p15–20", "M10 L3 p21–22"]}, {"q": "How should the studio read the linear regression's coefficient of 0.25 on star salary?", "type": "single", "fixed": false, "options": ["Each extra $0.25 of salary goes with one more ticket sold", "Each extra $4 of salary goes with about one more ticket sold, other factors held fixed", "Each extra $4 of salary sells one more ticket, because stars draw their fans to the movie", "About 25% of a movie's tickets are sold because of its stars"], "answer": [1], "explain": "A coefficient of 0.25 tickets per dollar means about one extra ticket per $4 of salary, holding the other factors fixed. The version with 'because stars draw their fans' adds a cause that the regression cannot show, and $0.25 per ticket inverts the rate.", "trap": "CAUSAL ADD-ON", "concept": "Explainability: reading a linear coefficient", "note": "Linear coefficient = change in response per unit of the factor, others fixed (0.25 tickets/$ = 1 ticket per $4); it shows association, not cause.", "refs": ["M10 L3a p4–6", "M10 L3a p6"]}, {"q": "An executive asks: 'How much does adding star salary change ticket sales?' Which model answers this most directly?", "type": "single", "fixed": false, "options": ["The random forest, because it has the lowest validation error", "The random forest, because its variable importance gives the effect per dollar", "The regression tree, because it gives a different effect for each kind of movie", "The linear regression, because one coefficient gives the effect per dollar"], "answer": [3], "explain": "Explainability falls from linear regression to tree to forest: the regression gives one clear number, the tree gives several conditional effects (which the slides call 'not so helpful'), and the forest gives only variable importance, not an effect size. The forest's accuracy is real but doesn't answer this question; explainability also helps people adopt a model and is sometimes a legal requirement, as with explaining why a loan was denied.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Explainability: linear vs tree vs forest", "note": "Explainability: linear regression > tree > forest; a forest gives better estimates but only variable importance; explainability aids adoption and may be legally required.", "refs": ["M10 L3a p7–12", "M10 L3a p13–14", "M10 L3a p15–21"]}]}, {"id": "D-7", "module": "M10", "title": "Loan repayment probability", "setup": "A bank estimates the probability that an applicant repays a loan with logistic regression: <b>p = 1 / (1 + e<sup>−(a<sub>0<\/sub> + a<sub>1<\/sub>x)<\/sup>)<\/b>, with a<sub>0<\/sub> = −2, a<sub>1<\/sub> = 0.5, and x = income in $10,000s. On validation data the model's ROC curve has an area under the curve (AUC) of 0.80. Among past applicants, Joe repaid his loan and Moe did not.", "parts": [{"q": "What repayment probability does the model give an applicant with an income of $40,000?", "type": "single", "fixed": false, "options": ["0.5", "0", "1", "0.73"], "answer": [0], "explain": "x = 4, so a<sub>0<\/sub> + a<sub>1<\/sub>x = −2 + 0.5·4 = 0, and p = 1/(1 + e<sup>0<\/sup>) = 1/2. The logistic function stays strictly between 0 and 1, approaching 0 as the linear part goes to −∞ and 1 as it goes to +∞.", "trap": "WRONG-QUANTITY", "concept": "Logistic regression: formula", "note": "Logistic: p = 1/(1 + e^−(a0 + Σ aj xj)); linear part 0 → p = 0.5; stays in (0,1), unlike linear regression.", "refs": ["M10 L4 p11", "M10 L4 p7–9"]}, {"q": "The bank approves loans when p ≥ 0.5. It changes the rule to p ≥ 0.7. What happens?", "type": "single", "fixed": false, "options": ["More loans approved, and a larger share of the approved borrowers end up defaulting", "Fewer loans approved, and the model's AUC rises above 0.80 as a result", "Fewer approved: fewer defaulters get loans, but more would-be repayers are turned down", "The same loans approved, because the model's coefficients and probabilities haven't changed"], "answer": [2], "explain": "A higher threshold says 'yes' less often, so fewer false yeses (defaulters approved) and more false nos (good borrowers rejected). It is a move along the same ROC curve; AUC summarizes all thresholds and doesn't change.", "trap": "DIRECTION FLIP", "concept": "Logistic regression: classification threshold", "note": "Raise threshold → fewer 'yes' → fewer false positives, more false negatives; AUC unchanged (it covers all thresholds).", "refs": ["M10 L4 p27–28", "M10 L4 p29–30"]}, {"q": "What does the AUC of 0.80 mean?", "type": "single", "fixed": false, "options": ["80% of applicants are classified correctly when the bank uses the 0.5 threshold to decide which loans to approve", "For a random repayer (Joe) and random defaulter (Moe), an 80% chance the repayer gets the higher estimate", "80% of the applicants the model approves (like Joe) will repay, and 20% (like Moe) will default", "The model is 30 percentage points more accurate than a guessing model, whose AUC is 0.5"], "answer": [1], "explain": "AUC (the concordance index) is the probability that a random 'yes' case gets a higher estimate than a random 'no' case; 0.5 means guessing. It is not accuracy at any one threshold, and not the share of approved borrowers who repay.", "trap": "WRONG-QUANTITY", "concept": "AUC meaning", "note": "AUC = P(random 'yes' scored above random 'no') (Joe vs Moe); 0.5 = guessing.", "refs": ["M10 L4 p31–35"]}, {"q": "Select ALL statements about this model and its evaluation that match the lectures.", "type": "multi", "fixed": false, "options": ["The ROC curve plots sensitivity (true positive rate) against 1 − specificity", "An AUC of 0.5 would mean the model is no better than guessing", "The AUC takes into account that a default costs the bank more than a turned-away good customer", "Unlike linear regression, the logistic coefficients have no closed-form solution and must be found iteratively", "A pseudo R² of 0.35 would mean the model explains 35% of the variance in repayment"], "answer": [0, 1, 3], "explain": "ROC = sensitivity vs 1 − specificity, AUC 0.5 = guessing, and logistic regression has no closed form (it takes longer to compute). AUC treats both kinds of error alike, so it ignores costs, and pseudo R² does not really measure the fraction of variance explained.", "trap": "SELECT-ALL", "concept": "Logistic regression: ROC, AUC, pseudo R²", "note": "ROC: sensitivity vs 1−specificity; AUC ignores costs ('quick and dirty'); logistic has no closed form; pseudo R² isn't variance explained.", "refs": ["M10 L4 p22–24", "M10 L4 p25–26", "M10 L4 p36–37"]}]}, {"id": "D-8", "module": "M10", "title": "Pricing a spam filter", "setup": "A spam filter is tested on 1,000 emails, half real and half spam. <b>Real email is the positive class.<\/b><table class='dt'><tr><th>Filter 1<\/th><th>Model: real (inbox)<\/th><th>Model: spam (filtered)<\/th><\/tr><tr><td>Actually real<\/td><td>TP = 490<\/td><td>FN = 10<\/td><\/tr><tr><td>Actually spam<\/td><td>FP = 100<\/td><td>TN = 400<\/td><\/tr><\/table>Costs: a correct answer costs $0; reading a spam message in the inbox costs $0.04; losing a real email to the spam folder costs $1. A stricter Filter 2 gives TP = 450, FN = 50, FP = 50, TN = 450.", "parts": [{"q": "What are Filter 1's sensitivity and specificity?", "type": "single", "fixed": false, "options": ["Sensitivity 80%, specificity 98%", "Sensitivity 98%, specificity 83%", "Sensitivity 98%, specificity 80%", "Sensitivity 83%, specificity 80%"], "answer": [2], "explain": "Sensitivity = TP/(TP + FN) = 490/500 = 98% (real emails kept), and specificity = TN/(TN + FP) = 400/500 = 80% (spam caught). 83% is 490/590, the share of the inbox that is real, a different quantity.", "trap": "WRONG-QUANTITY", "concept": "Confusion matrix: sensitivity and specificity", "note": "Sensitivity = TP/(TP+FN); specificity = TN/(TN+FP); positive = the class you call 'yes' (here real email).", "refs": ["M10 L5 p6–7", "M10 L5 p10"]}, {"q": "What share of Filter 1's inbox is spam?", "type": "single", "fixed": false, "options": ["About 17%", "20%", "10%", "2%"], "answer": [0], "explain": "The inbox holds everything predicted real: TP + FP = 590, of which FP = 100 are spam, so 100/590 ≈ 17%. 20% is 100/500, the share of spam that gets through (1 − specificity), not the share of the inbox.", "trap": "WRONG-QUANTITY", "concept": "Confusion matrix: inbox spam share", "note": "Share of inbox that is spam = FP/(TP + FP) (with real = positive).", "refs": ["M10 L5 p8–9"]}, {"q": "Which filter is better?", "type": "single", "fixed": false, "options": ["Filter 2, because it classifies 900 emails correctly versus 890", "Filter 1, because its expected cost is 1.4¢ per email versus 5.2¢", "Filter 2, because only about 10% of its inbox is spam versus 17%", "Filter 1, because its expected cost is 1.4¢ per email versus 2.6¢"], "answer": [1], "explain": "Filter 1: 10 × $1 + 100 × $0.04 = $14 per 1,000 = 1.4¢; Filter 2: 50 × $1 + 50 × $0.04 = $52 = 5.2¢. Filter 2's higher accuracy and cleaner inbox are true, but it trades cheap mistakes for expensive ones.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Valuing a model with costs", "note": "Expected cost = Σ (count × cost) over the cells; the lowest cost wins even with more mistakes (spam: 1.4¢ vs 5.2¢).", "refs": ["M10 L6 p6–8", "M10 L6 p9–16", "M10 L6 p22–25"]}, {"q": "Suppose the email mix changes to 60% real and 40% spam, with Filter 1's rates unchanged. What is Filter 1's expected cost per email?", "type": "single", "fixed": false, "options": ["1.28¢", "1.4¢", "1.32¢", "1.52¢"], "answer": [3], "explain": "Scale the real row by 60/50 = 1.2 (FN 10 → 12) and the spam row by 40/50 = 0.8 (FP 100 → 80): 12 × $1 + 80 × $0.04 = $12 + $3.20 = $15.20 per 1,000 = 1.52¢. 1.28¢ scales the rows the wrong way, and 1.32¢ scales only the spam row.", "trap": "DIRECTION FLIP", "concept": "Valuing a model: rescaling for a new mix", "note": "New class mix: multiply each actual-class row by (new share ÷ old share), keep the rates, recompute cost (40% spam → 1.52¢).", "refs": ["M10 L6 p16–17"]}]}, {"id": "D-9", "module": "MIX", "title": "A transit agency's modeling questions", "setup": "A city transit agency has several questions. It has years of rider data (age, distance from home to the nearest station, income, past ridership), counts of riders arriving at each station, and a brand-new express route with only three weeks of data.", "parts": [{"q": "The agency wants to estimate the <b>probability<\/b> that a given rider will buy a monthly pass next month, based on age, distance and income. Which model is most appropriate?", "type": "single", "fixed": true, "options": ["ARIMA", "CART", "Cross-validation", "CUSUM", "Exponential smoothing", "GARCH", "k-means clustering", "k-nearest-neighbor classification", "Linear regression", "Logistic regression", "Support vector machine"], "answer": [9], "explain": "Logistic regression is the course's model for estimating a probability from a set of factors. SVM and KNN would answer the classification version ('will they buy?'), and linear regression the amount version ('how many rides?').", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Question type: probability → logistic regression", "note": "Classification (yes/no) → SVM/KNN/tree; probability → logistic regression; amount → linear regression.", "refs": ["M10 L4 p7–9", "Discussion 7.2 (question types)"]}, {"q": "The agency wants to model the number of riders arriving at a station's turnstiles each 15 minutes, which depends on time of day, day of week and holidays. Which method fits best?", "type": "single", "fixed": false, "options": ["Regression splines (MARS, found in software as 'earth')", "Bayesian regression, combining an expert's prior opinion with the station data", "Poisson regression, with the arrival rate λ a function of the attributes", "KNN regression, averaging the most similar time periods"], "answer": [2], "explain": "Arrival counts follow a Poisson distribution, and Poisson regression lets the rate depend on the attributes, λ(x), just like the lecture's airport security-line example. Splines (MARS, 'earth' in R) build curves from polynomial pieces joined at knots; they fit flexible curves but are not built around a count (Poisson) response.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Poisson regression", "note": "Poisson regression: count response (e.g. arrivals); rate λ(x) depends on attributes. Splines/MARS ('earth'): polynomials joined at knots.", "refs": ["M10 L7 p5–7", "M10 L7 p9–13"]}, {"q": "For the new express route there are only three weeks of data, but a veteran planner has a well-founded opinion about how distance affects ridership. Which method fits best?", "type": "single", "fixed": false, "options": ["KNN regression, because it needs no formula for how distance relates to ridership", "Bayesian regression, using the planner's opinion as a prior updated by the data", "Regression splines, because three weeks of data can be split into pieces at knots", "Poisson regression, because the three weeks of ridership on the route are counts"], "answer": [1], "explain": "Bayesian regression combines expert opinion (the prior) with data and is most helpful when there is little data, as in the lecture's height example. KNN regression is non-parametric (it averages the k nearest points instead of fitting a formula) and needs plenty of data to have good neighbors.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Bayesian vs KNN regression", "note": "Bayesian regression: expert prior + data, best with little data. KNN regression: non-parametric, predicts the average of the k nearest points.", "refs": ["M10 L7 p15–18", "M10 L7 p3–4, p20"]}, {"q": "The agency's ridership model performs much worse on validation data than on training data. Select ALL reasonable ways to address this.", "type": "multi", "fixed": false, "options": ["Simplify the model, e.g. use fewer variables, prune the tree, or use a larger k", "Collect more data, so random patterns have less influence on the fit", "Add more variables so the model fits the training data even more closely", "Use cross-validation to choose how complex the model should be", "Report the training performance instead, since it is the higher number"], "answer": [0, 1, 3], "explain": "A large training-to-validation drop signals overfitting: the model fits random patterns. Fitting less closely, getting more data, and picking complexity by cross-validation all help; adding variables makes overfitting worse, and training performance is optimistic.", "trap": "SELECT-ALL", "concept": "Overfitting fixes", "note": "Validation ≪ training → overfit: simplify (fewer variables, prune, larger k), more data, choose complexity by cross-validation.", "refs": ["Discussion 7.3 (validation worse than training)", "M10 L2 p13"]}]}, {"id": "E-1", "module": "MIX", "title": "Hospital readmissions", "setup": "A hospital has records for 4,000 past patients. For each: age, length of stay (days), number of prior admissions, two lab values (one ranges 0–500 mg/dL, the other is a ratio between 0 and 1), the patient ID number, and whether the patient was <b>readmitted within 30 days<\/b> (yes/no). A handful of patients have a length of stay recorded as <b>999<\/b>. A nurse follow-up call after discharge costs about <b>$40<\/b>; a readmission that could have been prevented costs about <b>$1,000<\/b>.", "parts": [{"q": "The hospital wants to estimate, for each patient being discharged today, the <b>probability<\/b> that the patient will be readmitted within 30 days. Which model is most appropriate?", "type": "single", "fixed": true, "options": ["ARIMA", "CART", "Cross-validation", "CUSUM", "Exponential smoothing", "GARCH", "k-means clustering", "k-nearest-neighbor classification", "Linear regression", "Logistic regression", "Support vector machine"], "answer": [9], "explain": "Logistic regression is the course's model for estimating a probability from a set of factors. Linear regression is the tempting near-neighbor, but its output isn't bounded between 0 and 1, so it isn't suited to probabilities.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Probability from factors → logistic regression", "note": "Probability of a yes/no outcome from factors → logistic regression, not linear.", "refs": ["M10 L4 p7–9", "M10 L4 p11", "Discussion 7.2 (question types)"]}, {"q": "An administrator asks: <i>\"Out of 100 patients just like this one, how many would we expect to be readmitted within 30 days?\"<\/i> Which type of question is this (Discussion 7.2)?", "type": "single", "fixed": false, "options": ["Classification (e.g. SVM or KNN)", "Probability estimation (e.g. logistic regression)", "Amount estimation (e.g. linear regression)", "Clustering (e.g. k-means)"], "answer": [1], "explain": "\"How many out of 100 just like this one\" is the readmission probability times 100, so it is probability estimation. It sounds like a count (amount estimation), but the amount being estimated isn't a property of this patient; it's the chance of a yes/no event.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Question types: classification / probability / amount", "note": "Will it happen? = classification; what's the chance (or how many out of 100)? = probability; how much? = amount.", "refs": ["Discussion 7.2 (question types)", "M10 L4 p11"]}, {"q": "The hospital currently calls every patient whose predicted readmission probability is <b>50% or more<\/b>. Given the costs in the scenario, what should it do with the threshold?", "type": "single", "fixed": false, "options": ["Raise it: a higher threshold flags more patients, so more readmissions get caught", "Keep 50%: that threshold maximizes the share of patients classified correctly", "Lower it: a missed readmission costs far more than an unneeded call, so flag more patients", "Lower it: a lower threshold reduces both false positives and false negatives"], "answer": [2], "explain": "A false negative (missed readmission, ~$1,000) costs about 25 times a false positive (an unneeded $40 call), so lowering the threshold to flag more patients trades cheap errors for expensive ones. Raising the threshold flags fewer patients, not more, and moving the threshold always trades one error type for the other rather than cutting both.", "trap": "DIRECTION FLIP", "concept": "Logistic threshold and unequal costs", "note": "Unequal error costs → move the threshold toward the cheaper mistake (costly misses → lower threshold).", "refs": ["M10 L4 p27–28", "M10 L6 p6–8", "M2 L6 p9"]}, {"q": "Two models are tested on the same 1,000 patients. <table class='dt'><tr><th><\/th><th>Missed readmissions (FN)<\/th><th>Unneeded calls (FP)<\/th><\/tr><tr><td>Model A<\/td><td>20<\/td><td>100<\/td><\/tr><tr><td>Model B<\/td><td>10<\/td><td>300<\/td><\/tr><\/table> Using $1,000 per FN and $40 per FP, which model should the hospital use?", "type": "single", "fixed": false, "options": ["Model A, because it makes fewer total errors (120 vs. 310)", "Model B, because its total cost is $22,000 vs. $24,000 for A", "Model A, because its total cost is $22,000 vs. $24,000 for B", "Either one, since AUC is the right way to compare them and it includes costs"], "answer": [1], "explain": "A costs 20×$1,000 + 100×$40 = $24,000; B costs 10×$1,000 + 300×$40 = $22,000, so B is cheaper. A really does make fewer errors, but that isn't what matters when errors have unequal costs. AUC ignores costs.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Costed confusion matrix", "note": "Total cost = Σ(count × cost) over the confusion-matrix cells; fewest errors ≠ cheapest.", "refs": ["M10 L6 p9–16", "M10 L5 p8–9", "M10 L4 p36–37"]}, {"q": "Before fitting a <b>k-nearest-neighbor<\/b> classifier on these factors, which of the following steps are appropriate? <b>Select all that apply.<\/b>", "type": "multi", "fixed": false, "options": ["Scale or standardize the predictors so the 0–500 lab value doesn't dominate distances", "Look into the length-of-stay values of 999 (probably a missing-data code) before fitting", "Remove the patient ID number from the predictors", "Box-Cox transform the yes/no readmission response so that it becomes normal", "Use PCA so the hospital no longer has to collect the lab values"], "answer": [0, 1, 2], "explain": "KNN is distance-based, so unscaled factors are effectively weighted by their units. 999-day stays are almost certainly bad or coded data and need to be looked into, and an ID number is an irrelevant attribute that distorts distances. Box-Cox is meant for a continuous response with unequal variance, not a 0/1 label, and every principal component still needs every original feature.", "trap": "SELECT-ALL", "concept": "Data prep for distance-based models", "note": "KNN/k-means: scale, check outliers, drop irrelevant attributes; PCA still needs all original features.", "refs": ["M2 L7 p11", "M2 L8 p9–10", "M5 L3 p4–9", "Discussion 1.4 (scaling for KNN)", "Discussion 6.3 (one PC still uses all features)"]}]}, {"id": "E-2", "module": "MIX", "title": "Grocery chain analytics", "setup": "A grocery chain with 60 stores has loyalty-card data on 200,000 customers: monthly spend ($0–$2,000), visits per month (0–30), and share of purchases that are organic (0–1). No customer \"types\" are recorded. It also has 6 years of <b>weekly<\/b> sales for each store, which rise steadily and spike every holiday season, with bigger spikes in years when sales are higher overall. At store 17, which just added self-checkout, the daily average checkout wait has been steady at about 4 minutes for two years.", "parts": [{"q": "Marketing wants to divide customers into 4 groups with similar shopping habits so it can design a different coupon book for each group. Which model is most appropriate?", "type": "single", "fixed": true, "options": ["ARIMA", "CART", "Cross-validation", "CUSUM", "Exponential smoothing", "GARCH", "k-means clustering", "k-nearest-neighbor classification", "Linear regression", "Logistic regression", "Support vector machine"], "answer": [6], "explain": "There are no labels; the goal is to find groups of similar customers, which is clustering, so k-means. k-nearest-neighbor <i>classification<\/i> sounds similar, but it needs known labels to assign a new point to.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Clustering vs classification model", "note": "No known answer per point + 'find similar groups' → k-means (not KNN).", "refs": ["M4 L1 p6–9", "M4 L6 p6–8", "Discussion 2.3 (classification vs clustering)"]}, {"q": "After the coupon campaign, the chain records for every customer whether they <b>redeemed<\/b> a coupon, and now wants to predict redemption for new customers. How has the problem changed?", "type": "single", "fixed": false, "options": ["It's still clustering, because customers are still being put into groups", "It's now classification: each past customer has a known correct answer, separate from the predictors", "It's now clustering, because \"redeemed\" and \"didn't\" are two groups found from the predictors", "It's now classification, because there are two groups instead of four"], "answer": [1], "explain": "Classification is supervised: each data point has a known correct answer (redeemed or not), and that answer is a different variable from the predictors. It's true that customers are still put into groups, but both methods do that, so it isn't the difference. The number of groups doesn't matter either.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Classification vs clustering (supervised vs unsupervised)", "note": "Classification = known answers, separate from the predictors; clustering = groups defined by the predictors themselves.", "refs": ["Discussion 2.3 (classification vs clustering)", "M4 L6 p6–8", "M4 L6 p10"]}, {"q": "The chain wants to forecast each store's weekly sales for the next 12 weeks using a model that explicitly estimates a baseline, a trend, and a <b>multiplicative<\/b> seasonal factor for each week of the year. Which model is it describing?", "type": "single", "fixed": true, "options": ["ARIMA", "CART", "Cross-validation", "CUSUM", "Exponential smoothing", "GARCH", "k-means clustering", "k-nearest-neighbor classification", "Linear regression", "Logistic regression", "Support vector machine"], "answer": [4], "explain": "A baseline, trend, and multiplicative seasonal factors are the components of Holt-Winters (triple exponential smoothing), with L = 52 for weekly data. ARIMA can also forecast trended data, but it works by differencing and autoregressive/moving-average terms, not separate baseline, trend, and seasonal factors.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Holt-Winters components", "note": "Baseline + trend + seasonal factor (spikes grow with level → multiplicative) = Holt-Winters exponential smoothing.", "refs": ["M7 L2 p16–18", "M7 L2 p22", "M7 L4 p14–16"]}, {"q": "At store 17, managers want to find out as quickly as possible whether the average checkout wait has <b>increased<\/b> since self-checkout was installed, without raising many false alarms. Which model is most appropriate?", "type": "single", "fixed": true, "options": ["ARIMA", "CART", "Cross-validation", "CUSUM", "Exponential smoothing", "GARCH", "k-means clustering", "k-nearest-neighbor classification", "Linear regression", "Logistic regression", "Support vector machine"], "answer": [3], "explain": "Detecting whether, and when, a stable process has shifted is change detection, and CUSUM is the course's model for it. Exponential smoothing would smooth or forecast the wait times, but it doesn't flag a change on its own.", "trap": "NEAR-NEIGHBOR METHOD", "concept": "Change detection vs forecasting", "note": "\"Has it changed?\" → CUSUM; \"what will it be?\" → exponential smoothing/ARIMA.", "refs": ["M6 L1 p2", "M6 L2 p14–17", "Discussion 3.4 (change detection uses)"]}, {"q": "Which of these questions for the chain is <b>prescriptive<\/b>?", "type": "single", "fixed": false, "options": ["Which products were most often bought together last year?", "What will store 17's sales be next week?", "How many cashiers should each store schedule next week?", "Which customer group spent the most last quarter?"], "answer": [2], "explain": "Prescriptive analytics asks what action to take, such as how many cashiers to schedule. Next week's sales is a predictive question (what will happen), and the other two are descriptive (what happened).", "trap": "none", "concept": "Descriptive / predictive / prescriptive", "note": "Descriptive = what happened; predictive = what will happen; prescriptive = what should we do.", "refs": ["M1 L1 p5–8"]}]}, {"id": "E-3", "module": "MIX", "title": "Bank: fraud and lending", "setup": "A bank has 200,000 past card transactions, each labeled fraud or not fraud, with factors such as amount, distance from the cardholder's home, minutes since the previous transaction, and merchant category. New transactions (millions a day) must be approved or blocked in real time. Separately, the bank's lending division must give regulators and applicants a <b>specific reason for each denied loan<\/b>. A regression on past loans found that the number of credit cards an applicant holds has a positive, significant coefficient on default.", "parts": [{"q": "Which of these models are appropriate for classifying transactions as fraud or not fraud? <b>Select all that apply.<\/b>", "type": "multi", "fixed": false, "options": ["CART", "CUSUM", "k-means clustering", "Logistic regression (with a probability threshold)", "Support vector machine"], "answer": [0, 3, 4], "explain": "CART and SVM classify from a set of factors, and logistic regression classifies by comparing its predicted probability to a threshold. CUSUM detects a change in a time series rather than classifying individual points, and k-means is unsupervised: it ignores the known fraud labels.", "trap": "SELECT-ALL", "concept": "Classifiers in the course", "note": "Classify from factors: SVM, KNN, CART, logistic + threshold. Not CUSUM (change detection) or k-means (unlabeled).", "refs": ["M2 L1 p3 · M2 L6 p9 · applied", "M2 L8 p5–7", "M10 L4 p27–28", "M10 L1 p28"]}, {"q": "For the real-time fraud check, the team is choosing between SVM and KNN. Which choice is better, and why?", "type": "single", "fixed": false, "options": ["KNN, because it gives a built-in probability: the share of the k neighbors that are fraud", "SVM, because once fit, scoring a new transaction is one quick formula, while KNN searches the training set", "KNN, because it needs no training step, so it is the faster choice in real time", "SVM, because SVM never misclassifies any of its training points"], "answer": [1], "explain": "KNN has to find the k nearest of 200,000 training points for every new transaction, which is slow at millions per day, while SVM just evaluates its fitted formula. It's true that KNN gives an easy probability estimate, but that doesn't answer the speed requirement.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "SVM vs KNN computation", "note": "Many real-time queries + big training set → SVM (KNN must search neighbors for each new point).", "refs": ["Discussion 1.3 (SVM vs KNN)", "M2 L8 p14–15"]}, {"q": "A data scientist shows that a 500-tree random forest predicts loan defaults noticeably better than the bank's current logistic regression. Given the regulatory requirement, what should the bank do?", "type": "single", "fixed": false, "options": ["Switch to the forest: averaging hundreds of trees makes each denial easier to explain", "Use the forest and send regulators its variable-importance chart as each denial's reason", "Keep an explainable model (logistic or a small tree) for decisions, and use the forest internally", "Use whichever has the higher validation accuracy; accuracy outweighs explainability"], "answer": [2], "explain": "Decisions must be explained case by case, and a logistic regression or a small tree can give a reason for each case. The forest is still useful internally, to see what the explainable model is missing. A forest does report variable importance, but that's an overall ranking across all trees and can't say why this applicant was denied.", "trap": "TRUE-BUT-NOT-THE-ANSWER", "concept": "Explainability vs accuracy", "note": "If decisions must be explained (legally or to users), prefer logistic/small tree; a forest's importance is aggregate only.", "refs": ["M10 L3a p2", "M10 L3a p13–14", "M10 L3a p15–20", "M10 L3 p23–26"]}, {"q": "Given the regression result about the number of credit cards, what can the bank conclude?", "type": "single", "fixed": false, "options": ["Applicants holding more credit cards tend to default more often", "Applicants holding more cards default more, because extra cards lead them to overspend", "Issuing fewer cards to each customer will reduce t
