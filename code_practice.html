<style>

*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sub{color:var(--mute);margin:0 0 6px}.aidisc{font-size:.82rem;opacity:.75;margin:4px 0 14px}
a{color:var(--accent)}

button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
#theme{flex:none;white-space:nowrap;padding:6px 12px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.small{font-size:.88rem;color:var(--mute)}
.mod{font:700 .78rem system-ui;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:16px 0 6px}

.exrow b{display:block}.dots{display:flex;gap:4px;flex:none}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ok)}

.stages button{flex:1;min-width:88px;padding:6px 8px;font-size:.85rem;line-height:1.25}.stages button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}

.seq{border-style:solid;background:var(--code)}

.opt .why{display:block;font-size:.88rem;color:var(--mute);margin-top:3px}

<script id="ex-data" type="application/json">[{"id": "c01", "mod": "M1/M5", "title": "First look at a dataset", "task": "You get the built-in <code>mtcars<\/code> data (32 cars). Check its size, summarize horsepower (<code>hp<\/code>), and find which car is an outlier by the box-plot rule. Save the outlying hp values in <code>out<\/code>.", "plan": ["Load the data and check how many rows and columns it has", "Summarize the column you care about (hp)", "Apply the box-plot rule to flag outliers", "Look up which car each outlier belongs to"], "pick": {"q": "Which function lists the values outside the box-plot whiskers (1.5 × IQR)?", "options": [["boxplot.stats(x)$out", "Right: it returns exactly the points beyond the whiskers."], ["summary(x)", "Shows min, quartiles and max, but doesn’t say which values are outliers."], ["mean(x)", "One number; it can’t flag individual values."]], "answer": 0}, "lines": ["data(mtcars)", "dim(mtcars)", "summary(mtcars$hp)", "out <- boxplot.stats(mtcars$hp)$out", "out", "rownames(mtcars)[mtcars$hp %in% out]"], "deps": [[], [0], [0], [0], [3], [3]], "decoy": ["out <- summary(mtcars$hp)", "summary() gives quartiles, not the outlying values."], "hints": ["Four moves: look at the data, summarize hp, flag outliers, name the cars.", "boxplot.stats(x)$out returns the outliers; %in% tells you which rows match them.", "out <- boxplot.stats(mtcars$hp)$out, then rownames(mtcars)[mtcars$hp %in% out]"], "answer": "data(mtcars)\ndim(mtcars)                         # 32 rows, 11 columns\nsummary(mtcars$hp)                  # quartiles of horsepower\nout <- boxplot.stats(mtcars$hp)$out # values beyond 1.5 × IQR\nout\nrownames(mtcars)[mtcars$hp %in% out] # which car it is", "check": "if(!exists(\"out\")) cat(\"✗ Save the outlying hp values in a variable called out\\n\") else if(isTRUE(all.equal(sort(as.numeric(out)), 335))) cat(\"✓ out = 335 (the Maserati Bora)\\n\") else cat(\"✗ out should hold the hp values beyond the box-plot whiskers\\n\")", "checklist": ["Checked the size before analyzing", "Used the box-plot rule, not a guess", "Named the outlying car, ready to ask whether it is an error or real"], "starter": "# 1. Load the data and check how many rows and columns it has\n# 2. Summarize the column you care about (hp)\n# 3. Apply the box-plot rule to flag outliers\n# 4. Look up which car each outlier belongs to\n"}, {"id": "c02", "mod": "M3", "title": "Train, validation and test split", "task": "Split the built-in <code>iris<\/code> data (150 rows) into 70% training, 15% validation and 15% test, at random and reproducibly. Name them <code>train<\/code>, <code>valid<\/code> and <code>test<\/code>.", "plan": ["Fix the random seed so the split can be repeated", "Shuffle the row numbers", "Cut the shuffled rows into 70% / 15% / 15%", "Check the sizes add up and nothing overlaps"], "pick": {"q": "Why call set.seed() first?", "options": [["So the same random split comes out every time you run it", "Right: results you can reproduce are results you can check."], ["It makes the split more random", "The seed doesn’t change how random it is, only whether it repeats."], ["R needs it before sample() will work", "sample() works without it; you just get a different split each run."]], "answer": 0}, "lines": ["set.seed(1)", "idx <- sample(1:nrow(iris))", "train <- iris[idx[1:105], ]", "valid <- iris[idx[106:127], ]", "test <- iris[idx[128:150], ]", "c(nrow(train), nrow(valid), nrow(test))"], "deps": [[], [0], [1], [1], [1], [2, 3, 4]], "decoy": ["train <- iris[1:105, ]", "iris is sorted by species, so the first 105 rows hold no virginica at all: always shuffle first."], "hints": ["Seed, shuffle, cut, check.", "sample(1:nrow(iris)) shuffles the row numbers; 70% of 150 is 105, 15% is about 22–23.", "train <- iris[idx[1:105], ]; valid <- iris[idx[106:127], ]; test <- iris[idx[128:150], ]"], "answer": "set.seed(1)                         # reproducible\nidx <- sample(1:nrow(iris))         # shuffled row numbers\ntrain <- iris[idx[1:105], ]         # 70%\nvalid <- iris[idx[106:127], ]       # ~15%\ntest  <- iris[idx[128:150], ]       # ~15%\nc(nrow(train), nrow(valid), nrow(test))", "check": "ok <- all(sapply(c(\"train\",\"valid\",\"test\"), exists)); if(!ok) cat(\"✗ Make train, valid and test\\n\") else { n <- c(nrow(train),nrow(valid),nrow(test)); r <- c(rownames(train),rownames(valid),rownames(test)); if(sum(n)==150 && !any(duplicated(r))) cat(\"✓ 150 rows, no overlap:\", n, \"\\n\") else cat(\"✗ Sizes should add to 150 with no row in two sets\\n\"); if(length(unique(train$Species))<3) cat(\"✗ train is missing a species: did you shuffle?\\n\") else cat(\"✓ All 3 species are in train\\n\") }", "checklist": ["Seed set before sampling", "Rows shuffled before cutting", "Sizes add up with no overlap"], "starter": "# 1. Fix the random seed so the split can be repeated\n# 2. Shuffle the row numbers\n# 3. Cut the shuffled rows into 70% / 15% / 15%\n# 4. Check the sizes add up and nothing overlaps\n"}, {"id": "c03", "mod": "M4", "title": "k-means clustering", "task": "Cluster the four measurements in <code>iris<\/code> into 3 groups with k-means, then compare the clusters with the real species. Save the result in <code>km<\/code>.", "plan": ["Keep only the numeric columns", "Scale them so no measurement dominates the distances", "Run k-means with several random starts", "Compare the clusters with the known species"], "pick": {"q": "Why use nstart = 25 in kmeans()?", "options": [["k-means can get stuck in a poor solution; 25 random starts keep the best one", "Right: the result depends on the starting centers."], ["It asks for 25 clusters", "That’s centers =, not nstart =."], ["It runs 25 iterations", "That’s iter.max =."]], "answer": 0}, "lines": ["x <- scale(iris[, 1:4])", "set.seed(1)", "km <- kmeans(x, centers = 3, nstart = 25)", "km$size", "table(cluster = km$cluster, species = iris$Species)"], "deps": [[], [], [0, 1], [2], [2]], "decoy": ["km <- kmeans(iris, centers = 3)", "Column 5 is the species name (not a number), and the raw columns aren’t scaled."], "hints": ["Numeric columns → scale → kmeans → table.", "scale() standardizes columns; kmeans(x, centers = 3, nstart = 25).", "km <- kmeans(scale(iris[, 1:4]), centers = 3, nstart = 25); table(km$cluster, iris$Species)"], "answer": "x <- scale(iris[, 1:4])                    # numeric columns, standardized\nset.seed(1)\nkm <- kmeans(x, centers = 3, nstart = 25)  # best of 25 starts\nkm$size\ntable(cluster = km$cluster, species = iris$Species)", "check": "if(!exists(\"km\") || !inherits(km,\"kmeans\")) cat(\"✗ Save the kmeans() result as km\\n\") else { if(length(km$size)==3) cat(\"✓ 3 clusters, sizes\", km$size, \"\\n\") else cat(\"✗ Ask for centers = 3\\n\"); if(ncol(km$centers)==4) cat(\"✓ Used the 4 measurements\\n\") else cat(\"✗ Use the 4 numeric columns\\n\") }", "checklist": ["Dropped the species column before clustering", "Scaled before computing distances", "Used several starts", "Checked clusters against something known"], "starter": "# 1. Keep only the numeric columns\n# 2. Scale them so no measurement dominates the distances\n# 3. Run k-means with several random starts\n# 4. Compare the clusters with the known species\n"}, {"id": "c04", "mod": "M6", "title": "CUSUM by hand", "task": "The built-in <code>Nile<\/code> series is the river’s yearly flow, 1871–1970. Use the first 20 years as the baseline and run a CUSUM that detects a <b>decrease<\/b>. Save the first year the CUSUM crosses its threshold in <code>year_found<\/code>.", "plan": ["Pick a baseline period and compute its mean and spread", "Choose the slack C and the threshold T", "Add up each year’s shortfall below (mean − C), never going under 0", "Find the first year the total passes T"], "pick": {"q": "To detect a decrease, which running total do you keep?", "options": [["S = max(0, S + (μ − x − C))", "Right: it grows when values fall below μ − C."], ["S = max(0, S + (x − μ − C))", "That detects an increase."], ["S = S + (x − μ)", "No slack and no reset at 0, so random noise piles up."]], "answer": 0}, "lines": ["x <- as.numeric(Nile)", "mu <- mean(x[1:20])", "slack <- 0.5 * sd(x[1:20])", "thresh <- 5 * sd(x[1:20])", "S <- numeric(length(x)); s <- 0", "for (t in seq_along(x)) { s <- max(0, s + (mu - x[t] - slack)); S[t] <- s }", "year_found <- time(Nile)[which(S > thresh)[1]]", "year_found"], "deps": [[], [0], [0], [0], [0], [1, 2, 4], [3, 5], [6]], "decoy": ["T <- 5 * sd(x[1:20])", "In R, T means TRUE; overwriting it can break other code. Use a name like thresh."], "hints": ["Baseline mean and sd → slack and threshold → loop → first crossing.", "Inside the loop: s <- max(0, s + (mu - x[t] - slack)). which(S > thresh)[1] gives the first crossing.", "year_found <- time(Nile)[which(S > thresh)[1]]"], "answer": "x <- as.numeric(Nile)\nmu <- mean(x[1:20])            # baseline: 1871–1890\nslack <- 0.5 * sd(x[1:20])     # C: ignore small dips\nthresh <- 5 * sd(x[1:20])      # T: how much evidence is enough\nS <- numeric(length(x)); s <- 0\nfor (t in seq_along(x)) {\n  s <- max(0, s + (mu - x[t] - slack))  # grows when flow is low\n  S[t] <- s\n}\nyear_found <- time(Nile)[which(S > thresh)[1]]\nyear_found", "check": "if(!exists(\"year_found\") || is.na(year_found[1])) cat(\"✗ Save the first crossing year in year_found\\n\") else if(year_found[1] >= 1895 && year_found[1] <= 1915) cat(\"✓ Change detected in\", year_found[1], \"(the flow dropped around 1899)\\n\") else cat(\"✗ Check the sign: a decrease uses mu - x[t] - slack\\n\")", "checklist": ["Baseline taken from early, stable data", "Slack and threshold set before looking at the answer", "Total reset at 0", "Didn’t overwrite T"], "starter": "# 1. Pick a baseline period and compute its mean and spread\n# 2. Choose the slack C and the threshold T\n# 3. Add up each year’s shortfall below (mean − C), never going under 0\n# 4. Find the first year the total passes T\n"}, {"id": "c05", "mod": "M7", "title": "Holt-Winters forecast", "task": "Forecast the next 12 months of the built-in <code>AirPassengers<\/code> series with triple exponential smoothing. The seasonal swings grow as traffic grows. Save the model as <code>hw<\/code> and the forecast as <code>fc<\/code>.", "plan": ["Look at the series: trend? seasonality? do the swings grow?", "Choose additive or multiplicative seasonality", "Fit the model and read α, β, γ", "Forecast 12 months ahead"], "pick": {"q": "Seasonal swings grow with the level. Which seasonality?", "options": [["seasonal = \"multiplicative\"", "Right: the seasonal effect is a percentage of the level."], ["seasonal = \"additive\"", "Additive assumes swings stay the same size."], ["gamma = FALSE", "That turns seasonality off entirely."]], "answer": 0}, "lines": ["plot(AirPassengers)", "hw <- HoltWinters(AirPassengers, seasonal = \"multiplicative\")", "c(hw$alpha, hw$beta, hw$gamma)", "fc <- predict(hw, n.ahead = 12)", "fc"], "deps": [[], [], [1], [1], [3]], "decoy": ["hw <- HoltWinters(AirPassengers, gamma = FALSE)", "gamma = FALSE drops the seasonal part, so the summer peaks vanish from the forecast."], "hints": ["Look → choose the season type → fit → predict.", "HoltWinters(series, seasonal = \"multiplicative\"); predict(model, n.ahead = 12).", "hw <- HoltWinters(AirPassengers, seasonal = \"multiplicative\"); fc <- predict(hw, n.ahead = 12)"], "answer": "plot(AirPassengers)                     # trend + growing seasonal swings\nhw <- HoltWinters(AirPassengers, seasonal = \"multiplicative\")\nc(hw$alpha, hw$beta, hw$gamma)          # smoothing constants R chose\nfc <- predict(hw, n.ahead = 12)\nfc", "check": "if(!exists(\"hw\") || !inherits(hw,\"HoltWinters\")) cat(\"✗ Save the model as hw\\n\") else { if(identical(hw$seasonal,\"multiplicative\")) cat(\"✓ Multiplicative seasonality\\n\") else cat(\"✗ The swings grow, so use multiplicative\\n\") }; if(exists(\"fc\") && length(fc)==12) cat(\"✓ 12-month forecast\\n\") else cat(\"✗ fc should hold 12 forecasts\\n\")", "checklist": ["Looked at the plot before choosing", "Matched the season type to the data", "Let R pick α, β, γ, then read them"], "starter": "# 1. Look at the series: trend? seasonality? do the swings grow?\n# 2. Choose additive or multiplicative seasonality\n# 3. Fit the model and read α, β, γ\n# 4. Forecast 12 months ahead\n"}, {"id": "c06", "mod": "M8", "title": "Linear regression and prediction", "task": "Model fuel economy (<code>mpg<\/code>) in <code>mtcars<\/code> from weight (<code>wt<\/code>) and horsepower (<code>hp<\/code>), then predict mpg for a car with wt = 3 (3,000 lb) and hp = 150. Save the model as <code>fit<\/code> and the prediction as <code>pred<\/code>.", "plan": ["Fit the regression with the two predictors", "Read the coefficients, p-values and R²", "Put the new car into a data frame with the same column names", "Predict its mpg"], "pick": {"q": "How do you give predict() a new car?", "options": [["newdata = data.frame(wt = 3, hp = 150)", "Right: same column names as the model used."], ["newdata = c(3, 150)", "A plain vector has no column names, so predict() can’t match them."], ["predict(fit) with no newdata", "That returns predictions for the 32 training cars."]], "answer": 0}, "lines": ["fit <- lm(mpg ~ wt + hp, data = mtcars)", "summary(fit)", "new <- data.frame(wt = 3, hp = 150)", "pred <- predict(fit, newdata = new)", "pred", "AIC(fit)"], "deps": [[], [0], [], [0, 2], [3], [0]], "decoy": ["fit <- lm(mpg ~ wt + hp)", "Without data = mtcars, R looks for variables named mpg, wt and hp and can’t find them."], "hints": ["Fit → read → new data → predict.", "lm(y ~ x1 + x2, data = ...); predict(fit, newdata = data.frame(...)).", "pred <- predict(fit, newdata = data.frame(wt = 3, hp = 150))"], "answer": "fit <- lm(mpg ~ wt + hp, data = mtcars)\nsummary(fit)                         # coefficients, p-values, R²\nnew <- data.frame(wt = 3, hp = 150)  # same names as the model\npred <- predict(fit, newdata = new)  # about 20.8 mpg\npred\nAIC(fit)                             # for c ", "cm", "cost <- 1 * cm[\"0\", \"1\"] + 5 * cm[\"1\", \"0\"]", "cost"], "deps": [[], [0], [1], [2], [3], [3], [5]], "decoy": ["fit <- lm(am ~ wt + hp, data = mtcars)", "A linear model isn’t bounded to 0–1, so its outputs aren’t probabilities."], "hints": ["Fit → probabilities → threshold → table → cost.", "glm(..., family = binomial); ifelse(p > 0.5, 1, 0); table(actual, predicted).", "cost <- 1 * cm[\"0\",\"1\"] + 5 * cm[\"1\",\"0\"]  (row = actual, column = predicted)"], "answer": "fit <- glm(am ~ wt + hp, data = mtcars, family = binomial)\np <- predict(fit, type = \"response\")      # probabilities\npred <- ifelse(p > 0.5, 1, 0)             # threshold\ncm <- table(actual = mtcars$am, predicted = pred)\ncm\ncost <- 1 * cm[\"0\", \"1\"] + 5 * cm[\"1\", \"0\"]  # FP × 1 + FN × 5\ncost\n# Try thresholds like 0.3: when misses cost more, a lower threshold often costs less.", "check": "if(!exists(\"fit\") || !inherits(fit,\"glm\") || fit$family$family!=\"binomial\") cat(\"✗ Fit a glm with family = binomial as fit\\n\") else cat(\"✓ Logistic regression\\n\"); if(exists(\"cm\") && all(dim(cm)==c(2,2))) cat(\"✓ 2 × 2 confusion matrix\\n\") else cat(\"✗ cm should be the 2 × 2 table of actual vs predicted\\n\"); if(exists(\"cost\") && exists(\"cm\") && cost == 1*cm[\"0\",\"1\"] + 5*cm[\"1\",\"0\"]) cat(\"✓ cost =\", cost, \"\\n\") else cat(\"✗ cost = 1 × false positives + 5 × false negatives\\n\")", "checklist": ["Used glm with binomial", "Predicted on the probability scale", "Rows = actual, columns = predicted", "Weighted each mistake by its own cost"], "starter": "# 1. Fit a logistic regression\n# 2. Get predicted probabilities\n# 3. Turn them into yes/no with a threshold\n# 4. Build the confusion matrix\n# 5. Weight each kind of mistake by its cost\n"}, {"id": "c09", "mod": "M11", "title": "Backward elimination with step()", "task": "Start from a regression of <code>mpg<\/code> on every other column of <code>mtcars<\/code> and let R drop variables one at a time by AIC. eft\n# 4. Check the smaller model still makes sense\n"}, {"id": "c10", "mod": "M11", "title": "Lasso with cross-validation", "needs": "glmnet", "task": "Fit a lasso regression of <code>mpg<\/code> on the other <code>mtcars<\/code> columns, choosing the penalty by 10-fold cross-validation. Save the cross-validation result as <code>cv<\/code> and see which coefficients are exactly 0.", "plan": ["Put the predictors in a scaled matrix and the response in a vector", "Set the seed (the folds are random)", "Cross-validate the lasso penalty", "Read the coefficients at the best penalty"], "pick": {"q": "Which alpha makes glmnet a lasso?", "options": [["alpha = 1", "Right: all absolute-value penalty, so some coefficients hit 0."], ["alpha = 0", "That’s ridge: everything shrinks, nothing becomes 0."], ["alpha = 0.5", "Elastic net, a mix of the two."]], "answer": 0}, "lines": ["library(glmnet)", "x <- scale(as.matrix(mtcars[, -1]))", "y <- mtcars$mpg", "set.seed(1)", "cv <- cv.glmnet(x, y, alpha = 1)", "coef(cv, s = \"lambda.min\")"], "deps": [[], [], [], [], [0, 1, 2, 3], [4]], "decoy": ["cv <- cv.glmnet(x, y, alpha = 0)", "alpha = 0 is ridge regression, which never sets coefficients to exactly 0."], "hints": ["Matrix and vector → seed → cv.glmnet → coef.", "glmnet wants a matrix: as.matrix(mtcars[, -1]); scale it so the penalty treats columns fairly.", "cv <- cv.glmnet(x, y, alpha = 1); coef(cv, s = \"lambda.min\")"], "answer": "library(glmnet)                        # downloads in the browser the first time\nx <- scale(as.matrix(mtcars[, -1]))    # predictors, scaled\ny <- mtcars$mpg\nset.seed(1)                            # folds are random\ncv <- cv.glmnet(x, y, alpha = 1)       # lasso, 10-fold CV\ncoef(cv, s = \"lambda.min\")             # the dots (.) are coefficients set to 0", "check": "if(!exists(\"cv\") || !inherits(cv,\"cv.glmnet\")) cat(\"✗ Save the cv.glmnet() result as cv\\n\") else { b <- as.matrix(coef(cv, s=\"lambda.min\"))[-1, 1]; cat(\"✓ Lasso fitted;\", sum(b==0), \"of\", length(b), \"coefficients are exactly 0\\n\") }", "checklist": ["Predictors scaled", "Seed set before cross-validation", "alpha = 1 for lasso", "Read which coefficients became 0"], "starter": "# 1. Put the predictors in a scaled matrix and the response in a vector\n# 2. Set the seed (the folds are random)\n# 3. Cross-validate the lasso penalty\n# 4. Read the coefficients at the best penalty\n"}, {"id": "c11", "mod": "M13", "title": "Fit an exponential and check it with a Q-Q plot", "task": "You measured 200 gaps between customer arrivals (simulated below as <code>gaps<\/code>). Estimate the exponential rate and check the fit with a Q-Q plot. Save the rate in <code>rate<\/code>.", "plan": ["Get the data", "Estimate the rate from the average gap", "Compute the matching exponential quantiles", "Plot data quantiles against them and add the y = x line"], "pick": {"q": "How do you estimate an exponential rate λ from gaps?", "options": [["λ = 1 / mean(gaps)", "Right: the average gap is 1/λ."], ["λ = mean(gaps)", "That’s the average gap itself, not the rate."], ["λ = sd(gaps)", "For an exponential the sd equals the mean gap, so this is also 1/λ."]], "answer": 0}, "lines": ["set.seed(1)", "gaps <- rexp(200, rate = 0.5)", "rate <- 1 / mean(gaps)", "theory <- qexp(ppoints(200), rate = rate)", "qqplot(theory, gaps)", "abline(0, 1)"], "deps": [[], [0], [1], [2], [1, 3], [4]], "decoy": ["rate <- mean(gaps)", "mean(gaps) is the average gap (about 2 minutes), not the rate (about 0.5 per minute)."], "hints": ["Data → rate → theoretical quantiles → plot.", "ppoints(n) gives evenly spaced probabilities; qexp() turns them into exponential quantiles.", "qqplot(qexp(ppoints(200), rate = rate), gaps); abline(0, 1)"], "answer": "set.seed(1)\ngaps <- rexp(200, rate = 0.5)              # stand-in for measured gaps\nrate <- 1 / mean(gaps)                     # λ ≈ 0.5 per minute\ntheory <- qexp(ppoints(200), rate = rate)  # exponential quantiles\nqqplot(theory, gaps)                       # points near the line = good fit\nabline(0, 1)", "check": "if(!exists(\"rate\")) cat(\"✗ Save the estimated rate in rate\\n\") else if(rate > 0.4 && rate < 0.6) cat(\"✓ rate ≈\", round(rate,3), \"per minute\\n\") else cat(\"✗ rate should be 1 / mean(gaps), about 0.5\\n\")", "checklist": ["Estimated the parameter from the data", "Compared against the matching distribution", "Judged the overall line, not a few end points"], "starter": "# 1. Get the data\n# 2. Estimate the rate from the average gap\n# 3. Compute the matching exponential quantiles\n# 4. Plot data quantiles against them and add the y = x line\n"}, {"id": "c12", "mod": "M13", "title": "Simulate stockouts", "task": "Daily demand for a product is Poisson with an average of 20. Simulate 10,000 days and estimate how often stocking 25 units runs out. Then find the smallest stock level with at most a 5% chance of running out. Save them as <code>stockout<\/code> and <code>best<\/code>.", "plan": ["Fix the seed", "Simulate many days of demand", "Estimate the stockout probability for 25 units", "Repeat for a range of stock levels and pick the smallest that meets 5%"], "pick": {"q": "Which gives the probability of running out with 25 units?", "options": [["mean(demand > 25)", "Right: the average of TRUE/FALSE is the share of days."], ["sum(demand > 25)", "That’s the number of days, not the probability."], ["max(demand) > 25", "That only says whether it ever happened."]], "answer": 0}, "lines": ["set.seed(1)", "demand <- rpois(10000, lambda = 20)", "stockout <- mean(demand > 25)", "stock <- 20:35", "risk <- sapply(stock, function(s) mean(demand > s))", "best <- min(stock[risk <= 0.05])", "c(stockout, best)"], "deps": [[], [0], [1], [], [1, 3], [4], [2, 5]], "decoy": ["stockout <- sum(demand > 25)", "sum() counts the days; divide by 10,000 (or use mean) to get a probability."], "hints": ["Seed → simulate → estimate → repeat across levels.", "rpois(n, lambda) simulates counts; mean(condition) is a probability.", "stock <- 20:35; risk <- sapply(stock, function(s) mean(demand > s)); best <- min(stock[risk <= 0.05])"], "answer": "set.seed(1)\ndemand <- rpois(10000, lambda = 20)        # 10,000 simulated days\nstockout <- mean(demand > 25)              # about 11%\nstock <- 20:35                             # stock levels to try\nrisk <- sapply(stock, function(s) mean(demand > s))\nbest <- min(stock[risk <= 0.05])          # about 28 units\nc(stockout, best)", "check": "if(exists(\"stockout\") && stockout > 0.09 && stockout < 0.13) cat(\"✓ stockout ≈\", round(stockout,3), \"\\n\") else cat(\"✗ stockout should be the share of days with demand > 25 (about 0.11)\\n\"); if(exists(\"best\") && best %in% 27:29) cat(\"✓ best =\", best, \"units\\n\") else cat(\"✗ best should be the smallest level with risk ≤ 5% (about 28)\\n\")", "checklist": ["Seed set", "Many replications, not one", "Probability = share of days", "Compared options on the same simulated days"], "starter": "# 1. Fix the seed\n# 2. Simulate many days of demand\n# 3. Estimate the stockout probability for 25 units\n# 4. Repeat for a range of stock levels and pick the smallest that meets 5%\n"}, {"id": "c13", "mod": "M14", "title": "Impute missing values two ways", "task": "<code>airquality$Ozone<\/code> has missing values. Count them, then fill them two ways: with the mean (<code>mean_imp<\/code>) and with a regression on temperature (<code>reg_imp<\/code>).", "plan": ["Count the missing values", "Mean imputation: copy the column and fill the gaps with the mean", "Fit a regression on the rows that have Ozone", "Regression imputation: predict the missing rows and fill them in", "Compare the spread of the two versions"], "pick": {"q": "What’s the main weakness of mean imputation?", "options": [["Every filled value is the same, so the spread shrinks", "Right: it understates variability (and ignores other factors)."], ["It can’t handle more than 5 missing values", "It handles any number, just badly."], ["It changes one\n# 4. Regression imputation: predict the missing rows and fill them in\n# 5. Compare the spread of the two versions\n"}, {"id": "c14", "mod": "M15", "title": "A small linear program", "needs": "lpSolve", "task": "A bakery makes bread (profit $3) and cakes (profit $5). Bread uses 2 kg flour and 1 oven hour; a cake uses 3 kg and 2 hours. There are 120 kg of flour and 70 oven hours. How many of each maximize profit? Save the solver result as <code>res<\/code>.", "plan": ["Name the variables: how many breads, how many cakes", "Write the objective: total profit", "Write each constraint as a row: flour, oven hours", "Solve and check the answer uses no more than what’s available"], "pick": {"q": "How does lp() know the problem is to maximize?", "options": [["Its first argument: lp(\"max\", ...)", "Right: \"max\" or \"min\" comes first."], ["By making the objective negative", "That trick turns a max into a min, but lp() has a direct option."], ["It always maximizes", "It does whatever the first argument says."]], "answer": 0}, "lines": ["library(lpSolve)", "obj <- c(3, 5)", "A <- matrix(c(2, 3, 1, 2), nrow = 2, byrow = TRUE)", "res <- lp(\"max\", obj, A, c(\"<=\", \"<=\"), c(120, 70))", "res$solution", "res$objval"], "deps": [[], [], [], [0, 1, 2], [3], [3]], "decoy": ["res <- lp(\"min\", obj, A, c(\"<=\", \"<=\"), c(120, 70))", "Minimizing profit gives 0 bread and 0 cakes."], "hints": ["Variables → objective → constraint rows → solve.", "Each row of A is one resource: flour (2, 3), oven hours (1, 2).", "res <- lp(\"max\", c(3, 5), A, c(\"<=\",\"<=\"), c(120, 70))"], "answer": "library(lpSolve)\nobj <- c(3, 5)                          # profit per bread, per cake\nA <- matrix(c(2, 3,                     # flour per bread, per cake\n              1, 2),                    # oven hours\n            nrow = 2, byrow = TRUE)\nres <- lp(\"max\", obj, A, c(\"<=\", \"<=\"), c(120, 70))\nres$solution                            # 30 bread, 20 cakes\nres$objval                              # $190", "check": "if(!exists(\"res\") || is.null(res$objval)) cat(\"✗ Save the lp() result as res\\n\") else if(abs(res$objval-190) < 1e-6) cat(\"✓ Max profit $190 with\", res$solution[1], \"bread and\", res$solution[2], \"cakes\\n\") else cat(\"✗ Profit should be $190: check max vs min and the constraint rows\\n\")", "checklist": ["Wrote variables, objective and constraints before coding", "One row per resource", "Checked the answer against the limits"], "starter": "# 1. Name the variables: how many breads, how many cakes\n# 2. Write the objective: total profit\n# 3. Write each constraint as a row: flour, oven hours\n# 4. Solve and check the answer uses no more than what’s available\n"}, {"id": "c15", "mod": "M16", "title": "Paired tests: Wilcoxon and McNemar", "task": "The built-in <code>sleep<\/code> data has extra hours of sleep for the same 10 people on two drugs. Test the difference with a paired Wilcoxon signed-rank test (<code>res<\/code>). Then two models were scored on the same 100 cases (table below); test whether their error rates differ with McNemar’s test and save the p-value as <code>p_mc<\/code>.", "plan": ["Split the measurements into the two paired groups", "Run a paired Wilcoxon test (no normality assumption)", "Build the 2 × 2 table of right/wrong for the two models", "Run McNemar’s test on the disagreements"], "pick": {"q": "Same 10 people on both drugs. Which test?", "options": [["wilcox.test(a, b, paired = TRUE)", "Right: paired, and doesn’t assume normal differences."], ["wilcox.test(a, b)", "Unpaired (Mann-Whitney): it ignores that each pair is the same person."], ["mcnemar.test(a, b)", "McNemar is for paired yes/no outcomes, not hours."]], "answer": 0}, "lines": ["a <- sleep$extra[sleep$group == 1]", "b <- sleep$extra[sleep$group == 2]", "res <- wilcox.test(a, b, paired = TRUE)", "res$p.value", "tab <- matrix(c(40, 12, 5, 43), nrow = 2)", "p_mc <- mcnemar.test(tab)$p.value", "p_mc"], "deps": [[], [], [0, 1], [2], [], [4], [5]], "decoy": ["res <- wilcox.test(a, b)", "Without paired = TRUE it treats the groups as different people."], "hints": ["Split → paired test → 2 × 2 table → McNemar.", "wilcox.test(..., paired = TRUE); a warning about ties is normal here.", "p_mc <- mcnemar.test(matrix(c(40, 12, 5, 43), nrow = 2))$p.value"], "answer": "a <- sleep$extra[sleep$group == 1]\nb <- sleep$extra[sleep$group == 2]\nres <- wilcox.test(a, b, paired = TRUE)   # warns about ties: fine\nres$p.value\n# rows: model A right/wrong; columns: model B right/wrong\ntab <- matrix(c(40, 12, 5, 43), nrow = 2)\np_mc <- mcnemar.test(tab)$p.value         # only the 12 vs 5 disagreements matter\np_mc                                      # about 0.15: no clear difference", "check": "if(exists(\"res\") && inherits(res,\"htest\") && grepl(\"signed rank\", res$method)) cat(\"✓ Paired signed-rank test\\n\") else cat(\"✗ res should be wilcox.test(a, b, paired = TRUE)\\n\"); if(exists(\"p_mc\") && abs(p_mc-0.145) < 0.02) cat(\"✓ McNemar p ≈\", round(p_mc,3), \"\\n\") else cat(\"✗ p_mc should be McNemar’s p-value for the table\\n\")", "checklist": ["Matched the test to paired data", "Didn’t assume normality", "Read McNemar as a test on the disagreements"], "starter": "# 1. Split the measurements into the two paired groups\n# 2. Run a paired Wilcoxon test (no normality assumption)\n# 3. Build the 2 × 2 table of right/wrong for the two models\n# 4. Run McNemar’s test on the disagreements\n"}]</script>
<script>
(function(){
const EX=JSON.parse(document.getElementById('ex-data').textContent), BY=Object.fromEntries(EX.map(e=>[e.id,e]));
const KEY='isye-code-v1'; let ST={ex:{},cur:null};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null'); if(x&&x.ex) ST=x;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}};
const S=id=>ST.ex[id]=ST.ex[id]||{stage:0,plan:[],planOk:false,pick:null,asm:[],asmOk:false,code:null,hints:0,checkOk:false,cl:{},done:false};
const $=s=>document.querySelector(s), view=$('#view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function shuffled(n,seed){const a=[...Array(n).keys()];let x=seed||1;for(let i=n-1;i>0;i--){x=Math.imul(x^x>>>15,2246822507)>>>0;x=(x+0x6D2B79F5)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}if(n>1&&a.every((v,i)=>v===i))a.push(a.shift());return a;}
const STG=['Plan','Pick tools','Assemble','Write & run','Compare'];
const doneFlags=(e,s)=>[s.planOk,s.pick===e.pick.answer,s.asmOk,s.checkOk,s.done];

// ---------- home
function home(){ ST.cur=null; save();
  let h=`<div class="card"><h2>How to plan any analysis in R</h2><p style="margin:0">Most homework code follows the same five moves. Say them in words first, then find a function for each.</p>
  <ol class="tmpl"><li><b>Get the data</b> and look at it: <code>dim()</code>, <code>summary()</code>, <code>head()</code>, a plot.</li><li><b>Prepare</b> it: choose columns, scale, split, handle missing values.</li><li><b>Fit</b> the model: one function call, saved in a variable (<code>fit &lt;- ...</code>).</li><li><b>Use</b> it: <code>predict()</code>, <code>table()</code>, a forecast, a solution.</li><li><b>Check</b> it: an error measure, a plot, a sanity check against what you expected.</li></ol>
  <p class="small" style="margin:8px 0 0">Each exercise walks through 5 stages: <b>Plan</b> (order the steps), <b>Pick tools</b> (choose the function), <b>Assemble</b> (put code lines in a working order and spot the trap line), <b>Write &amp; run</b> (type it yourself and run real R in the page), and <b>Compare</b> (with a model answer). The first run downloads R into your browser, which takes a little while; after that it's quick. Your progress and code stay in this browser.</p></div>`;
  let lastMod=null;
  EX.forEach(e=>{ const s=S(e.id), f=doneFlags(e,s); if(e.mod!==lastMod){ h+=`<p class="mod">${esc(e.mod.replace(/M(\d+)/g,'Module $1'))}</p>`; lastMod=e.mod; }
    h+=`<button class="exrow" data-open="${e.id}"><span><b>${esc(e.title)}${e.needs?`<span class="badge">package: ${esc(e.needs)}</span>`:''}</b><span class="small">${f.filter(Boolean).length} of 5 stages done</span></span><span class="dots">${f.map(x=>`<i class="${x?'on':''}"></i>`).join('')}</span></button>`; });
  view.innerHTML=h; }

// ---------- exercise
function open(id,stage){ ST.cur=id; const s=S(id); if(stage!=null) s.stage=stage; save(); render(); scrollTo(0,0); }
function render(){ if(!ST.cur||!BY[ST.cur]) return home(); const e=BY[ST.cur], s=S(e.id), f=doneFlags(e,s), i=EX.indexOf(e);
  let h=`<div class="row" style="margin:0 0 8px"><button data-home="1">← All exercises</button>${i>0?`<button data-open="${EX[i-1].id}">‹ Previous</button>`:''}${i<EX.length-1?`<button data-open="${EX[i+1].id}">Next ›</button>`:''}</div>
  <div class="card"><p class="small" style="margin:0">${esc(e.mod.replace(/M(\d+)/g,'Module $1'))}${e.needs?` · uses the <code>${esc(e.needs)}</code> package`:''}</p><h2 style="margin:4px 0 6px">${esc(e.title)}</h2><div class="task">${e.task}</div></div>
  <div class="stages">${STG.map((t,k)=>`<button data-stage="${k}" class="${k===s.stage?'on':''} ${f[k]?'done':''}">${k+1}. ${t}</button>`).join('')}</div><div class="card" id="stage"></div>`;
  view.innerHTML=h; [plan,pick,asm,write,compare][s.stage](e,s); }

// stage 1: plan
function plan(e,s){ const ord=shuffled(e.plan.length,hash(e.id+'p'));
  let h=`<h3 style="margin-top:0">Put the steps in order</h3><p class="small" style="margin:0">Tap the steps in the order you'd do them. Tap a step in your list to take it back.</p><div class="seq">${s.plan.length?s.plan.map((k,j)=>`<button class="item ${s.planOk||s.planChecked?(k===j?'right':'wrong'):''}" data-pl-rm="${j}"><span class="n">${j+1}.</span>${esc(e.plan[k])}</button>`).join(''):'<span class="small">Your plan appears here.</span>'}</div>
  <div class="pool">${ord.filter(k=>!s.plan.includes(k)).map(k=>`<button class="item" data-pl-add="${k}">${esc(e.plan[k])}</button>`).join('')||'<span class="small">All steps placed.</span>'}</div>
  <div class="row"><button class="primary" data-pl-check="1" ${s.plan.length<e.plan.length?'disabled':''}>Check my plan</button><button data-pl-clear="1">Start over</button></div>`;
  if(s.planChecked) h+=s.planOk?`<div class="fb ok"><b>Good plan.</b> That's the order the code will follow. <button class="primary" data-stage="1" style="margin-left:6px">Next: pick tools →</button></div>`:`<div class="fb no"><b>Not yet.</b> ${s.plan.filter((k,j)=>k===j).length} of ${e.plan.length} are in the right spot. Ask: what does each step need from the one before it?</div>`;
  $('#stage').innerHTML=h; }
// stage 2: pick
function pick(e,s){ const P=e.pick; let h=`<h3 style="margin-top:0">${esc(P.q)}</h3>`;
  P.options.forEach(([t,w],k)=>{ const sh=s.pick!=null; h+=`<button class="opt ${sh?(k===P.answer?'right':k===s.pick?'wrong':''):''}" data-pk="${k}" ${sh?'disabled':''}><code>${esc(t)}</code>${sh?`<span class="why">${esc(w)}</span>`:''}</button>`; });
  if(s.pick!=null) h+=`<div class="fb ${s.pick===P.answer?'ok':'no'}"><b>${s.pick===P.answer?'Right.':'Not quite: the green one fits.'}</b> <button class="primary" data-stage="2" style="margin-left:6px">Next: assemble →</button> <button data-pk-redo="1">Try again</button></div>`;
  $('#stage').innerHTML=h; }
// stage 3: assemble (Parsons)
function asmCheck(e,s){ const L=e.lines.length, D=L; const placed=s.asm; const pos={}; placed.forEach((k,j)=>pos[k]=j);
  const decoy=placed.includes(D), missing=[...Array(L).keys()].filter(k=>!(k in pos));
  const bad=placed.filter(k=>k<L&&e.deps[k].some(d=>!(d in pos)||pos[d]>pos[k]));
  return {decoy,missing,bad,ok:!decoy&&!missing.length&&!bad.length}; }
function asm(e,s){ const all=[...e.lines,e.decoy[0]], ord=shuffled(all.length,hash(e.id+'a')), c=s.asmChecked?asmCheck(e,s):null;
  let h=`<h3 style="margin-top:0">Assemble the code</h3><p class="small" style="margin:0">Tap the lines into a working order. One line is a trap: leave it out. Order only matters where a line uses something an earlier line made.</p>
  <div class="seq">${s.asm.length?s.asm.map((k,j)=>{ let cls=''; if(c){ cls=k===e.lines.length||c.bad.includes(k)?'wrong':'right'; } return `<button class="item code ${cls}" data-as-rm="${j}"><span class="n">${j+1}</span>${esc(all[k])}</button>`; }).join(''):'<span class="small">Your code appears here.</span>'}</div>
  <div class="pool">${ord.filter(k=>!s.asm.includes(k)).map(k=>`<button class="item code" data-as-add="${k}">${esc(all[k])}</button>`).join('')||'<span class="small">All lines placed.</span>'}</div>
  <div class="row"><button class="primary" data-as-check="1" ${s.asm.length?'':'disabled'}>Check</button><button data-as-clear="1">Start over</button></div>`;
  if(c){ if(c.ok){ s.asmOk=true; save(); h+=`<div class="fb ok"><b>It runs.</b> You left out the trap line: <code>${esc(e.decoy[0])}</code>. ${esc(e.decoy[1])} <button class="primary" data-stage="3" style="margin-left:6px">Next: write it yourself →</button></div>`; }
    else { const m=[]; if(c.decoy) m.push(`The trap line is in: ${esc(e.decoy[1])}`); if(c.bad.length) m.push(`Red lines use something that isn't made yet (or isn't in your code).`); if(c.missing.length) m.push(`${c.missing.length} needed line${c.missing.length>1?'s are':' is'} still in the pool.`); h+=`<div class="fb no"><b>Not yet.</b> ${m.join(' ')}</div>`; } }
  $('#stage').innerHTML=h; }
// stage 4: write & run
function write(e,s){ if(s.code==null) s.code=e.starter;
  let h=`<h3 style="margin-top:0">Write it yourself</h3><p class="small" style="margin:0">Your plan is already in the editor as comments. Write the code under each one${e.needs?`. <code>library(${esc(e.needs)})</code> downloads the package the first time`:''}. <b>Run</b> shows R's output; <b>Check</b> runs your code and then tests the variables the task asked for.</p>
  <textarea class="ed" id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">${esc(s.code)}</textarea>
  <div class="row"><button class="primary" id="run">▶ Run</button><button id="chk">Check</button><button id="hint">Hint (${s.hints}/3)</button><button id="copy">Copy code</button><button id="rreset" title="Clear all variables in the R session">Reset R</button></div>
  <div id="hints">${e.hints.slice(0,s.hints).map((t,k)=>`<div class="hint"><b>Hint ${k+1}:</b> ${esc(t)}</div>`).join('')}</div>
  <p class="status" id="rstat">${RSTATE}</p><pre class="out" id="out" style="display:none"></pre><div id="plots"></div>`;
  if(s.checkOk) h+=`<div class="fb ok"><b>All checks passed.</b> <button class="primary" data-stage="4" style="margin-left:6px">Next: compare →</button></div>`;
  $('#stage').innerHTML=h;
  const ed=$('#ed'); ed.oninput=()=>{s.code=ed.value; save();};
  ed.onkeydown=ev=>{ if(ev.key==='Tab'){ ev.preventDefault(); const a=ed.selectionStart,b=ed.selectionEnd; ed.value=ed.value.slice(0,a)+'  '+ed.value.slice(b); ed.selectionStart=ed.selectionEnd=a+2; s.code=ed.value; save(); } };
  $('#run').onclick=()=>exec(e,s,false); $('#chk').onclick=()=>exec(e,s,true);
  $('#hint').onclick=()=>{ if(s.hints<3){ s.hints++; save(); write(e,s); } };
  $('#copy').onclick=()=>{ const t=ed.value; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>status('Copied. Paste it into RStudio or Posit Cloud.'),()=>{ ed.select(); status('Select-all done: copy with your keyboard.'); }); };
  $('#rreset').onclick=async()=>{ if(!R){ status('R isn’t loaded yet.'); return; } try{ await R.evalRVoid('rm(list = ls(all.names = TRUE))'); status('R session cleared.'); }catch(err){ status('Couldn’t reset: '+err.message); } };
}
// stage 5: compare
function compare(e,s){ let h=`<h3 style="margin-top:0">A model answer</h3><p class="small" style="margin:0">Yours doesn't have to match line for line. Compare the plan, the key function and the checks.</p><pre class="ans">${esc(e.answer)}</pre>
  <h3>Did your code…</h3>${e.checklist.map((t,k)=>`<label class="chk"><input type="checkbox" data-cl="${k}" ${s.cl[k]?'checked':''}> <span>${esc(t)}</span></label>`).join('')}
  <div class="row"><button class="primary" data-done="1">${s.done?'✓ Marked done':'Mark this exercise done'}</button>${EX.indexOf(e)<EX.length-1?`<button data-open="${EX[EX.indexOf(e)+1].id}">Next exercise ›</button>`:''}</div>`;
  $('#stage').innerHTML=h; }

// ---------- webR
let R=null, RLOAD=null, RSTATE='R loads the first time you press Run.';
const status=t=>{ RSTATE=t; const el=$('#rstat'); if(el) el.textContent=t; };
function getR(){ if(R) return Promise.resolve(R); if(RLOAD) return RLOAD;
  status('Loading R into your browser (the first time can take 20–60 seconds)…');
  RLOAD=(async()=>{ let mod=null, err=null; for(const v of ['v0.4.2','v0.3.1']){ try{ mod=await import(`https://webr.r-wasm.org/${v}/webr.mjs`); break; }catch(x){ err=x; } }
    if(!mod) throw err||new Error('could not load webR'); const w=new mod.WebR(); await w.init(); R=w; status('R is ready.'); return w; })();
  RLOAD.catch(err=>{ RLOAD=null; status('R couldn’t load in this browser ('+(err&&err.message||err)+'). Use Copy code and run it in RStudio or Posit Cloud.'); });
  return RLOAD; }
async function runR(code){ const w=await getR(); const sh=await new w.Shelter();
  try{ const r=await sh.captureR(code,{withAutoprint:true,captureStreams:true,captureConditions:false}); return {out:r.output||[],images:r.images||[]}; }
  catch(err){ return {out:[{type:'error',data:String(err&&err.message||err)}],images:[]}; }
  finally{ try{ sh.purge(); }catch(x){} } }
function show(res,append){ const o=$('#out'); if(!o) return; o.style.display='block'; if(!append){ o.innerHTML=''; $('#plots').innerHTML=''; }
  res.out.forEach(x=>{ const t=String(x.data==null?'':x.data); const cls=x.type==='error'?'err':x.type==='stderr'||x.type==='message'||x.type==='warning'?'msg':/^✓/.test(t)?'ok':/^✗/.test(t)?'err':''; o.innerHTML+=`<span class="${cls}">${esc(t)}</span>\n`; });
  res.images.forEach(img=>{ try{ const c=document.createElement('canvas'); c.className='plot'; c.width=img.width; c.height=img.height; c.getContext('2d').drawImage(img,0,0); $('#plots').appendChild(c); }catch(x){} }); }
async function exec(e,s,check){ const code=$('#ed').value; s.code=code; save(); $('#run').disabled=$('#chk').disabled=true;
  try{ const r1=await runR(code); show(r1,false);
    if(check){ const r2=await runR(e.check); const o=$('#out'); o.innerHTML+='<span class="msg">— checks —</span>\n'; show(r2,true);
      const txt=r2.out.map(x=>String(x.data)).join('\n'); const ok=/✓/.test(txt)&&!/✗/.test(txt)&&!r2.out.some(x=>x.type==='error'); if(ok&&!s.checkOk){ s.checkOk=true; save(); write(e,s); show(r1,false); const o2=$('#out'); o2.innerHTML+='<span class="msg">— checks —</span>\n'; show(r2,true); } }
    if(R) status('R is ready.'); }
  catch(err){ /* status already explains */ }
  finally{ const a=$('#run'),b=$('#chk'); if(a) a.disabled=false; if(b) b.disabled=false; } }

// ---------- events
document.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return; const d=b.dataset; const e=ST.cur&&BY[ST.cur], s=e&&S(e.id);
  if(d.home){ home(); scrollTo(0,0); return; }
  if(d.open){ open(d.open); return; }
  if(d.stage!=null&&e){ s.stage=+d.stage; save(); render(); return; }
  if(!e) return;
  if(d.plAdd!=null){ s.plan.push(+d.plAdd); s.planChecked=false; save(); plan(e,s); return; }
  if(d.plRm!=null){ if(s.planOk) return; s.plan.splice(+d.plRm,1); s.planChecked=false; save(); plan(e,s); return; }
  if(d.plCheck){ s.planChecked=true; s.planOk=s.plan.every((k,j)=>k===j)&&s.plan.length===e.plan.length; save(); render(); return; }
  if(d.plClear){ s.plan=[]; s.planChecked=false; s.planOk=false; save(); render(); return; }
  if(d.pk!=null){ s.pick=+d.pk; save(); render(); return; }
  if(d.pkRedo){ s.pick=null; save(); render(); return; }
  if(d.asAdd!=null){ s.asm.push(+d.asAdd); s.asmChecked=false; save(); asm(e,s); return; }
  if(d.asRm!=null){ s.asm.splice(+d.asRm,1); s.asmChecked=false; save(); asm(e,s); return; }
  if(d.asCheck){ s.asmChecked=true; save(); render(); return; }
  if(d.asClear){ s.asm=[]; s.asmChecked=false; save(); render(); return; }
  if(d.done){ s.done=!s.done; save(); render(); return; }
});
