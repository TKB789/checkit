<title>Study Group Practice</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#5b6475;--line:#dde1e8;--accent:#2f5bd3;--accent-ink:#fff;--ok:#1d7a46;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbeaea;--warnbg:#fff6e0;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--mute:#9aa3b2;--line:#2c3340;--accent:#7b9cff;--accent-ink:#0d1222;--ok:#5fd08f;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a1a;--warnbg:#332a12;--chip:#252b36}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--mute:#9aa3b2;--line:#2c3340;--accent:#7b9cff;--accent-ink:#0d1222;--ok:#5fd08f;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a1a;--warnbg:#332a12;--chip:#252b36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;margin:0 0 4px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#theme{flex:none;padding:6px 12px;font-size:.9rem}
.sub{color:var(--mute);margin:0 0 16px}
.tabs{display:flex;gap:8px;margin:0 0 16px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.setup{border-left:4px solid var(--accent)}
.setup h2{margin:0 0 6px;font-size:1.15rem}
.score{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--mute);font-size:.95rem}
.bar{flex:1 1 160px;height:8px;background:var(--chip);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.qn{font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.q{font-weight:600;margin:2px 0 4px}
.hint{color:var(--mute);font-size:.88rem;margin:0 0 10px}
label.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;cursor:pointer}
label.opt input{margin-top:4px;width:18px;height:18px;flex:none}
label.opt.right{background:var(--okbg);border-color:var(--ok)}
label.opt.wrong{background:var(--badbg);border-color:var(--bad)}
label.opt .tag{display:block;margin-top:3px;font-size:.8rem;font-weight:600}
.right .tag{color:var(--ok)}.wrong .tag{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fb{margin-top:12px;border-radius:10px;padding:12px;background:var(--chip)}
.fb .v{font-weight:700}.fb .v.ok{color:var(--ok)}.fb .v.no{color:var(--bad)}
.key{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warnbg);font-size:.93rem}
.refs{color:var(--mute);font-size:.82rem;margin-top:6px}
.done{border-color:var(--accent)}
.notes .n{border-top:1px solid var(--line);padding:12px 0}
.notes .n:first-child{border-top:0;padding-top:0}
.n h3{font-size:1rem;margin:0 0 4px}
.n .meta{color:var(--mute);font-size:.8rem}
.empty{color:var(--mute)}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:70px}
.hist{color:var(--mute);font-size:.9rem;margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none}
sub{font-size:.75em}

.pool,.zone{border:1px dashed var(--line);border-radius:12px;padding:10px;min-height:56px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;background:var(--bg)}
.pool.empty-pool{color:var(--mute);font-size:.9rem;align-items:center}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.zone{background:var(--bg);display:flex;flex-direction:column;gap:6px;cursor:pointer}
.zone>.zt{font-weight:600;font-size:.9rem}
.zone.over,.pool.over{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.zone.target{border-color:var(--accent)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.92rem;cursor:grab;user-select:none;touch-action:manipulation;max-width:100%}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.chip.right{background:var(--okbg);border-color:var(--ok);cursor:default}
.chip.wrong{background:var(--badbg);border-color:var(--bad);cursor:default}
.chip .tag{display:block;margin-top:4px;font-size:.8rem;font-weight:600}
.chip.right .tag{color:var(--ok)}.chip.wrong .tag{color:var(--bad)}
.chip svg.qq{display:block}
.chip.has-svg{padding:6px}
.nb textarea{min-height:180px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.filters button{padding:5px 12px;font-size:.88rem}

.scorebox .big{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;margin-bottom:8px}
.scorebox .num{font-size:2.6rem;font-weight:800;line-height:1;color:var(--accent)}
.scorebox .of{font-size:1.15rem;font-weight:600}
.scorebox .pct{margin-left:auto;color:var(--mute);font-weight:600}
.bar2{display:flex;height:12px;background:var(--chip);border-radius:9px;overflow:hidden;margin-bottom:8px}
.bar2 .g{background:var(--ok)}.bar2 .r{background:var(--bad);opacity:.75}
.tabscore{display:block;font-size:.8rem;font-weight:700;color:var(--accent)}
.sitebar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.88rem;margin:0 0 10px;color:var(--mute)}.sitebar a{color:var(--accent);text-decoration:none;font-weight:600}.sitebar a:hover{text-decoration:underline}
a.card.resource{display:block;text-decoration:none;color:var(--ink);border-color:var(--accent)}a.card.resource b{color:var(--accent);display:block;margin-bottom:2px}a.card.resource span{color:var(--mute);font-size:.92rem}
.tabmeta{display:block;font-size:.75rem;font-weight:500;color:var(--mute)}
.tabs button.on .tabmeta{color:var(--ink)}
.tabmeta .sm{display:none}@media (max-width:480px){.tabmeta{font-size:.7rem;white-space:nowrap}.tabmeta .lg{display:none}.tabmeta .sm{display:inline}}
.tabs button{flex:1 1 0;min-width:0;padding:8px 4px;line-height:1.25}
@media (max-width:480px){.tabs{gap:5px}.tabs button{font-size:.85rem}}
.fb .pts{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 10px;margin-right:6px;font-size:.9rem;color:var(--ink)}
.saved{color:var(--mute);font-size:.82rem;margin-top:4px}
.dt{border-collapse:collapse;margin:10px 0;font-size:.92rem}.dt th,.dt td{border:1px solid var(--line);padding:5px 10px;text-align:center}.dt th{background:var(--chip)}
</style>

<script id="data" type="application/json">[{"title": "Neighborhood crime rates", "setup": "A city analyst models the crime rate in <b>47<\/b> neighborhoods using <b>15<\/b> candidate factors. A regression with all 15 factors has R² = 0.80 on the training data, but 5-fold cross-validation estimates R² = 0.41.", "parts": [{"q": "What does the gap between 0.80 and 0.41 most likely tell her?", "type": "multi", "fixed": false, "options": ["The model is fitting many random patterns in the training data", "With only about three data points per factor, this is not surprising", "The model is underfit, so it needs more factors", "The cross-validated R² should be ignored, since the training R² uses all 47 neighborhoods"], "answer": [0, 1], "explain": "Training R² rewards fitting random patterns; cross-validation measures data the model didn't fit. With 47 points and 15 factors (about 3 per factor), overfitting is the most likely explanation. (A cross-validation mistake is possible in general, but nothing here suggests one, and the training R² is never the better estimate of performance on new data.)", "concept": "Spotting overfitting", "note": "Training R² ≫ cross-validated R² with few points per factor → overfit; trust the cross-validated estimate.", "refs": ["M11 L1", "M3 L4"]}, {"q": "A coworker runs stepwise regression: it keeps 8 factors, training R² 0.79, cross-validated R² 0.58. Removing the two factors that are no longer significant raises the cross-validated R² to 0.62. Which are true?", "type": "multi", "fixed": false, "options": ["The stepwise model still overfits somewhat (training 0.79 vs cross-validated 0.58)", "Dropping the two insignificant factors gave a simpler model that did no worse on the cross-validated estimate", "The models should be compared on cross-validated R², not training R²", "Stepwise found the best possible subset, since it checked each factor"], "answer": [0, 1, 2], "explain": "The remaining gap between 0.79 and 0.58 shows the stepwise model still fits some random patterns (greedy selection keeps a few such factors). Dropping the two weak factors gave a simpler model whose cross-validated R² didn't fall (0.58 to 0.62; a gain that small on 47 points may partly be noise). Only cross-validated R² can show this; training R² never falls when factors are added, so it always favors the bigger model. Stepwise is greedy, so it doesn't search every subset.", "concept": "Greedy selection and pruning weak factors", "note": "Greedy selection can still overfit; dropping insignificant factors gives a simpler model that may do as well or better; compare on cross-validated R².", "refs": ["M11 L2", "M11 L3"]}, {"q": "She then runs lasso on the <b>raw, unscaled<\/b> data. Median income is in dollars (tens of thousands); the number of police stations is 0–4. Both truly matter. Which are true?", "type": "multi", "fixed": false, "options": ["For an effect of similar size across its range, the station count needs a far larger coefficient than income", "So the station factor uses much more of the budget Σ|aⱼ| ≤ τ, and is more likely to be dropped", "Income is more likely to be dropped, because its values are larger", "The units don't matter, because lasso picks factors by importance"], "answer": [0, 1], "explain": "A coefficient converts units into effect: a factor with a tiny range needs a big coefficient, which is expensive under Σ|aⱼ| ≤ τ. Without scaling, the budget follows units, not importance. Scale first.", "concept": "Why lasso needs scaled data", "note": "Unscaled lasso penalizes small-range factors (they need big coefficients) → scale first.", "refs": ["M11 L2", "M2 L7"]}, {"q": "After scaling, lasso keeps 6 factors (cross-validated R² 0.63). It kept <b>property tax paid<\/b> and dropped <b>home value<\/b>, which are correlated 0.97. Next year only home value will be available for every neighborhood. Which are true?", "type": "multi", "fixed": false, "options": ["Lasso often keeps just one of a highly correlated pair, not necessarily the one you'd prefer", "She should swap in home value, refit, and check the cross-validated R²", "Home value must be useless, since lasso dropped it", "Ridge regression would have dropped both"], "answer": [0, 1], "explain": "With two near-duplicate factors, lasso usually keeps one. Which one isn't a statement about usefulness, so practical constraints (cost, availability) are the analyst's call. Ridge keeps both.", "concept": "Correlated factors in lasso", "note": "Lasso keeps one of a correlated pair; override with judgment (cost, availability) and re-validate.", "refs": ["M11 L3"]}, {"q": "Her manager asks her to cut τ much further, \"to be safe from overfitting.\" The cross-validated R² falls to 0.48. Which are true?", "type": "multi", "fixed": false, "options": ["The model is now likely underfit: real effects are being cut out", "τ should be chosen by comparing cross-validated results across several values", "A smaller τ always gives a safer, better model", "The fall means the data must have changed"], "answer": [0, 1], "explain": "Too tight a budget removes real factors and shrinks the rest: high bias. The best τ is in between, found by validation.", "concept": "Choosing the budget τ", "note": "Too small τ → underfit; pick τ where cross-validated quality is best.", "refs": ["M11 L2", "M11 L2b"]}]}, {"title": "Predicting hospital stays", "setup": "Two models predict how many days a patient stays in hospital. <b>Model A<\/b>: training R² 0.95, validation R² 0.60. <b>Model B<\/b>: training R² 0.70, validation R² 0.68.", "parts": [{"q": "Which are the most reasonable conclusions?", "type": "multi", "fixed": false, "options": ["Model A is overfit", "Model A has the higher variance in the bias–variance sense", "Model A will probably predict new patients better, since its training R² is higher", "Model B fits random patterns more than Model A"], "answer": [0, 1], "explain": "A's big drop from training to validation shows it fits random patterns: low bias, high variance. Judge models on validation data.", "concept": "Diagnosing with training vs validation", "note": "Big train–validation drop → overfit (high variance); choose by validation.", "refs": ["M11 L2b", "Discussion 7.3"]}, {"q": "The analyst refits Model A with ridge regression (Σⱼ aⱼ² ≤ τ), trying smaller and smaller τ. Which are true?", "type": "multi", "fixed": false, "options": ["Training R² falls or stays the same as τ gets smaller", "Validation R² may rise at first, then fall once τ is too small", "Factors drop out of the model one by one", "Training R² rises, because the coefficients get better"], "answer": [0, 1], "explain": "Shrinking coefficients reduces fit to all patterns: less variance, more bias. That helps validation until real effects are shrunk away. Ridge shrinks coefficients toward 0 but doesn't set them to exactly 0, so no factor drops out.", "concept": "Ridge regression and τ", "note": "Ridge: smaller τ → training fit down; validation up then down; no variables removed.", "refs": ["M11 L2c", "M11 L2b"]}, {"q": "At the first τ she tries, the coefficients don't change at all. Which are true?", "type": "multi", "fixed": false, "options": ["The ordinary regression solution was already inside the constraint region", "She needs a larger τ before ridge has any effect", "Ridge regression doesn't work on this kind of data", "The data must not have been scaled"], "answer": [0], "explain": "If Σaⱼ² of the ordinary solution is already ≤ τ, the constraint doesn't bind and nothing changes. A larger τ only loosens it further; she needs a smaller τ. Scaling changes the coefficients' sizes, but a non-binding constraint is fully explained by τ being too large, so 'must' doesn't follow.", "concept": "When the ridge constraint has no effect", "note": "Ridge changes nothing until τ is small enough that the ordinary solution falls outside the circle.", "refs": ["M11 L2c"]}, {"q": "A colleague asks why lasso on the same data set some coefficients to 0 but ridge didn't. Which are true?", "type": "multi", "fixed": false, "options": ["The lasso constraint region has corners on the axes, where some coefficients are 0", "The error contours usually first touch the round ridge region between the axes", "Ridge uses a different error function from lasso", "Ridge would also set coefficients to 0 if the data were scaled"], "answer": [0, 1], "explain": "Both minimize the same squared error. Lasso's diamond-shaped region has corners on the axes, where the error contours often touch first; ridge's circle has no corners, so the contours generally touch it between the axes and every coefficient stays nonzero. Scaling changes the sizes of the coefficients, not the shape of the region.", "concept": "Lasso vs ridge geometry", "note": "Same error; lasso diamond corners → zeros; ridge circle → no zeros.", "refs": ["M11 L2a"]}, {"q": "Besides ridge, which are reasonable next steps for Model A?", "type": "multi", "fixed": false, "options": ["Use fewer factors, chosen with lasso or elastic net and checked on validation data", "Collect data on more patients", "Ask physicians which factors are plausible real effects", "Add squared and interaction terms for every factor"], "answer": [0, 1, 2], "explain": "Fewer factors, more data and expert knowledge all reduce fitting to random patterns. More terms make overfitting worse.", "concept": "Fixing an overfit model", "note": "Overfit fixes: fewer factors, regularization, more data, expert input; not more terms.", "refs": ["Discussion 7.3", "M11 L1", "M11 L2b"]}]}]</script>
<script id="data2" type="application/json">[{"title": "A theme park's analytics week", "setup": "A theme park's analytics team is testing a new ticket-purchase page, measuring guests and rides, and checking which probability models fit its data. Every question on this page is drag and drop: drag each card into a box (or tap a card, then tap a box). A box can hold several cards, and some boxes may stay empty.", "parts": [{"q": "Each visitor to the ticket page either buys or doesn't. Match each quantity to the distribution that usually models it best.", "type": "match", "fixed": false, "cats": ["Bernoulli", "Binomial", "Geometric", "Poisson", "Exponential", "Weibull", "Normal"], "items": ["How many guests join the roller-coaster line in a 10-minute window, when guests arrive at random", "Whether one particular visitor buys a ticket (yes or no)", "How long a ride's motor runs before it fails, when failures get more likely as the motor wears", "How many of the next 1,000 visitors buy, if each buys independently with the same probability", "Adult guests' heights", "How many visitors arrive before the first purchase of the morning", "The time between two guests joining that line"], "answer": [3, 0, 5, 1, 6, 2, 4], "why": ["Count of random arrivals in a fixed time interval: Poisson.", "One yes/no trial with probability p: Bernoulli.", "Time to failure with a changing failure rate (shape k > 1 = wearing out): Weibull.", "Number of successes in n independent, identical yes/no trials: binomial.", "A quantity made of many small effects, clustered symmetrically around its mean: normal.", "Count of trials until (or before) the first success: geometric.", "Time between random (Poisson) arrivals: exponential."], "explain": "Ask what is being counted or timed: one yes/no (Bernoulli), successes in n tries (binomial), tries until the first success (geometric), arrivals in a time window (Poisson), time between random arrivals (exponential), time to failure with a changing rate (Weibull), and a measurement made of many small effects (normal).", "concept": "Matching distributions to quantities", "note": "Yes/no → Bernoulli; # successes in n → binomial; # until first → geometric; # arrivals per time → Poisson; time between arrivals → exponential; time to failure → Weibull.", "refs": ["M13 L2", "M13 L3"]}, {"q": "Each card is a Q-Q plot of park data (vertical axis) against a reference distribution (horizontal axis). The dashed line is y = x. Match each plot to what it shows about the data.", "type": "match", "fixed": false, "cats": ["Matches the reference distribution", "Longer right tail than the reference (right-skewed)", "Heavier tails at both ends", "Lighter tails at both ends", "Same shape, but a larger mean than the reference", "Same shape, but more spread than the reference"], "items": ["<svg class=\"qq\" viewBox=\"0 0 150 150\" width=\"150\" height=\"150\" role=\"img\" aria-label=\"right\"><rect x=\"1\" y=\"1\" width=\"148\" height=\"148\" rx=\"6\" fill=\"none\" stroke=\"var(--line)\"/><line x1=\"8.0\" y1=\"142.0\" x2=\"142.0\" y2=\"8.0\" stroke=\"var(--mute)\" stroke-dasharray=\"4 3\"/><circle cx=\"29.9\" cy=\"98.3\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"40.3\" cy=\"97.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"46.0\" cy=\"96.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"50.2\" cy=\"95.5\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"53.6\" cy=\"94.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"56.6\" cy=\"93.3\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"59.3\" cy=\"92.2\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"61.8\" cy=\"91.0\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"64.2\" cy=\"89.7\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"66.5\" cy=\"88.3\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"68.7\" cy=\"86.8\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"70.8\" cy=\"85.3\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"73.0\" cy=\"83.5\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"75.2\" cy=\"81.7\" r=\"3\" 6\" cy=\"55.7\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"97.8\" cy=\"52.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"103.5\" cy=\"46.1\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"113.9\" cy=\"36.7\" r=\"3\" fill=\"var(--accent)\"/><\/svg>", "<svg class=\"qq\" viewBox=\"0 0 150 150\" width=\"150\" height=\"150\" role=\"img\" aria-label=\"spread\"><rect x=\"1\" y=\"1\" width=\"148\" height=\"148\" rx=\"6\" fill=\"none\" stroke=\"var(--line)\"/><line x1=\"8.0\" y1=\"142.0\" x2=\"142.0\" y2=\"8.0\" stroke=\"var(--mute)\" stroke-dasharray=\"4 3\"/><circle cx=\"29.9\" cy=\"140.0\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"40.3\" cy=\"126.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"46.0\" cy=\"116.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"50.2\" cy=\"111.1\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"53.6\" cy=\"104.7\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"56.6\" cy=\"101.6\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"59.3\" cy=\"96.6\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"61.8\" cy=\"94.2\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"64.2\" cy=\"89.0\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"66.5\" cy=\"86.5\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"68.7\" cy=\"82.5\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"70.8\" cy=\"80.3\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"73.0\" cy=\"75.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"75.2\" cy=\"74.1\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"77.4\" cy=\"69.3\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"79.6\" cy=\"66.9\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"82.0\" cy=\"62.2\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"84.5\" cy=\"59.8\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"87.2\" cy=\"54.7\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"90.2\" cy=\"51.7\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"93.6\" cy=\"44.9\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"97.8\" cy=\"39.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"103.5\" cy=\"30.2\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"113.9\" cy=\"15.7\" r=\"3\" fill=\"var(--accent)\"/><\/svg>", "<svg class=\"qq\" viewBox=\"0 0 150 150\" width=\"150\" height=\"150\" role=\"img\" aria-label=\"shift\"><rect x=\"1\" y=\"1\" width=\"148\" height=\"148\" rx=\"6\" fill=\"none\" stroke=\"var(--line)\"/><line x1=\"8.0\" y1=\"142.0\" x2=\"142.0\" y2=\"8.0\" stroke=\"var(--mute)\" stroke-dasharray=\"4 3\"/><circle cx=\"29.9\" cy=\"98.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"40.3\" cy=\"89.9\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"46.0\" cy=\"82.8\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"50.2\" cy=\"79.6\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"53.6\" cy=\"74.9\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"56.6\" cy=\"73.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"59.3\" cy=\"69.6\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"61.8\" cy=\"68.6\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"64.2\" cy=\"64.6\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"66.5\" cy=\"63.1\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"68.7\" cy=\"60.3\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"70.8\" cy=\"59.2\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"73.0\" cy=\"55.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"75.2\" cy=\"55.1\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"77.4\" cy=\"51.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"79.6\" cy=\"50.2\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"82.0\" cy=\"46.6\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"84.5\" cy=\"45.5\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"87.2\" cy=\"41.8\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"90.2\" cy=\"40.2\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"93.6\" cy=\"35.1\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"97.8\" cy=\"31.7\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"103.5\" cy=\"25.4\" r=\"3\" fill=\"var(--accent)\"/><circle cx=\"113.9\" cy=\"16.1\" r=\"3\" fill=\"var(--accent)\"/><\/svg>"], "answer": [1, 2, 3, 0, 5, 4], "why": ["Points bend upward at the right and sit above the line at the far left: a long right tail and a short left tail (right-skewed).", "S-shape: points fall below the line on the left and rise above it on the right, so both tails are more extreme than the reference.", "Inverse S: points rise above the line on the left and fall below on the right, so both tails are less extreme than the reference.", "Points lie along y = x: the quantiles match.", "A straight line steeper than y = x: same shape, wider spread.", "A straight line parallel to y = x but above it: same shape, every quantile shifted up (larger mean)."], "explain": "On a Q-Q plot, a straight line means the shapes match; its position and slope compare the center and spread. Bends show the tails: ends that move away from y = x mean heavier tails on that side, and ends that pull toward the middle mean lighter tails.", "concept": "Reading Q-Q plots", "note": "Straight on y = x = match; parallel = shifted; steeper = more spread; S = heavy tails; inverse S = light tails; upward bend on the right = right-skewed.", "refs": ["M13 L4"]}, {"q": "Putting both together: for each check below, what will the Q-Q plot most likely look like? (Data on the vertical axis, reference on the horizontal axis.)", "type": "match", "fixed": false, "cats": ["Matches the reference distribution", "Longer right tail than the reference (right-skewed)", "Heavier tails at both ends", "Lighter tails at both ends", "Same shape, but a larger mean than the reference", "Same shape, but more spread than the reference"], "items": ["Adult guests' heights (roughly normal), plotted against a normal with the same mean and standard deviation", "Times between guests joining a ride line (truly exponential), plotted against a normal distribution", "Daily attendance (standard deviation 900), plotted against a normal with the correct mean (the same mean as the data) but standard deviation 300", "The same inter-arrival times, plotted against an exponential distribution with the correct rate (estimated from the data: λ = 1 ÷ average gap)", "Daily attendance (roughly normal, mean 18,000), plotted against a normal with mean 16,000 and the correct standard deviation (the same spread as the data)"], "answer": [0, 1, 5, 0, 4], "why": ["A normal against a matching normal lines up along y = x.", "Exponential data have a long right tail and a short left one, so against a normal the plot bends upward on the right.", "The data are 3 times as spread out, so the points form a line about 3 times as steep. (In analytics, this is what real data look like against a simulation that understates day-to-day swings, even when its average is correct.)", "Data plotted against their own distribution line up along y = x.", "Every data quantile sits about 2,000 above the reference's: a parallel line above y = x. (In analytics, this is what real data look like against a simulation whose average runs too low.)"], "explain": "Knowing a quantity's distribution lets you predict its Q-Q plot: the same distribution gives y = x, a skewed distribution against a symmetric one bends, and wrong mean or spread shift or tilt the line. That's also how Q-Q plots validate a simulation: compare simulated output with real data. Here \"correct\" parameters means estimated from the data (rate = 1 ÷ average gap; mean and standard deviation from the sample), so the plot checks only the shape. A parallel shift means the mean is off; a different slope means the spread is off.", "concept": "Distributions and their Q-Q plots", "note": "Same distribution → y = x; exponential vs normal → right-skew bend; wrong mean → parallel shift; wrong spread → different slope.", "refs": ["M13 L3", "M13 L4", "M13 L6"]}, {"q": "Match each situation to the design-of-experiments approach it calls for.", "type": "match", "fixed": false, "cats": ["Comparison and control", "Blocking", "A/B test", "Full factorial design", "Fractional factorial design", "Multi-armed bandit", "Representative survey sample"], "items": ["Survey guests about a new ride idea, making sure families, teens and seniors are included in proportion to the park's visitors", "Test two versions of the ticket page on randomly chosen visitors at the same time, and see which sells more", "Test 3 two-level features of the park app (8 combinations) when all 8 versions can be built", "Sales rose after the new page launched last month. Before crediting the page, compare with similar guests who still saw the old page during the same weeks", "Weekend and weekday guests behave very differently, so randomize the page versions separately within weekends and within weekdays", "Try 5 new snack prices over the summer, shifting more stands toward the prices that are selling best as results come in", "Test 8 two-level features of the park app, but only 16 versions can be built, chosen so each level and each pair of levels appears equally often"], "answer": [6, 2, 3, 0, 1, 5, 4], "why": ["A sample that represents the population: a representative survey sample.", "Two versions, random visitors, a quick answer: an A/B test.", "Every combination of the factors is tested: full factorial.", "Compare like with like so the difference can be credited to the change: comparison and control.", "Group by a factor that affects the response and randomize within groups: blocking.", "Exploit the leaders while still exploring, updating as results arrive: a bandit.", "A balanced subset of the 2⁸ = 256 combinations: fractional factorial."], "explain": "Match the design to the goal: compare fairly (comparison and control), cut noise from a known factor (blocking), pick between versions quickly (A/B), learn every factor's effect (full factorial) or most of them with fewer runs (fractional factorial), earn while learning (bandit), and survey a representative group.", "concept": "Matching designs to situations", "note": "Fair comparison → control; noisy known factor → block; two versions → A/B; all combos → full factorial; balanced subset → fractional; learn while earning → bandit.", "refs": ["M12 L1", "M12 L2", "M12 L3", "M12 L4"]}]}]</script>
<script id="data3" type="application/json">[{"title": "Cleaning a gym chain's member data", "setup": "A gym chain wants to predict which of its <b>40,000<\/b> members will cancel in the next 3 months. Its member table has plan type, age, annual income, distance from the gym, visits per week and cancellation date, but many fields have gaps.", "parts": [{"q": "Match each gap in the data to the best way to handle it.", "type": "match", "fixed": false, "cats": ["Throw the rows away", "Add a “missing” category", "Set to 0, add a missing indicator (and interactions)", "Impute the mean, median or mode", "Impute with a regression model", "Impute with regression plus perturbation", "Not really missing: it's censored"], "items": ["6 of the 40,000 records are blank in almost every field (abandoned online sign-ups)", "Age is blank for 1% of members, with no pattern, and the team needs a quick fix", "Payment method (card, cash, app) is blank for 2% of members, with no pattern", "Plan type (Basic, Plus, Family) is blank for 8% of members", "Visits per week is blank for 3% of members and well predicted by plan, distance and age; the filled-in values will feed a simulation of how crowded each gym gets, so realistic spread matters", "Cancellation date is blank for every member who is still active", "Annual income is blank for 14% of members, and higher earners skip it more often", "Visits per week is blank for 3% of members; it's well predicted by plan, distance and age"], "answer": [0, 3, 3, 1, 5, 6, 2, 4], "why": ["Dropping a handful of nearly empty records loses almost nothing and adds no estimation error.", "A tiny, random gap: a midrange value (mean or median) is quick and hedges against being too wrong. Regression would also work, but it's more effort than a 1% random gap needs.", "A small, random gap in a categorical factor: impute the mode (the most common method).", "A categorical factor gets one more category, “missing”. Mode imputation would fill far more than the ~5% per-factor limit.", "Regression gives every similar member the same value; adding a random perturbation restores realistic variability, which a simulation needs.", "Active members haven't cancelled yet: the date is unknown because the event is still in the future (censored), so it must not be imputed or treated as an ordinary blank.", "14% is well past the ~5% imputation guideline, and the gaps are biased, so use 0 plus an indicator, with interaction terms so the model can treat the two groups differently.", "A small gap that other factors predict well: regression imputation reduces the bias of a midrange value."], "explain": "Pick the method by the factor type (categorical vs numeric), how much is missing (≤ ~5% per factor for imputation), whether the gaps follow a pattern (bias), and what the values will be used for (perturbation when variability matters). Censored values aren't missing at random: the answer just isn't known yet.", "concept": "Choosing a missing-data method", "note": "Categorical → “missing” category; >5% or biased numeric → 0 + indicator (+ interactions); small random → mean/median; predictable → regression; variability matters → + perturbation; future event → censored.", "refs": ["M14 L1", "M14 L2", "M14 L3"]}, {"q": "Which are true?", "type": "multi", "fixed": false, "options": ["Dropping every member with any blank field could bias the model if the blanks are tied to cancelling, for example if members about to quit stop updating their profiles", "A member's age recorded as 25 when it is really 52 (digits swapped) is wrong data rather than missing data, and it's harder to spot because it looks like a normal value", "Filling the 14% of blank incomes with the mean of the answered incomes would likely underestimate those members' incomes", "Imputation adds no error, so imputing 30% of a factor is as safe as imputing 3%", "Adding a perturbation makes each imputed value more accurate on average"], "answer": [0, 1, 2], "explain": "Throwing data away is easy but can bias the model when the missing points differ from the rest. Wrong data (a typo, a garbled value) is a separate problem from missing data, and a plausible-looking wrong value is hard to catch. Because higher earners skip the question, the answered incomes are skewed low, and so is their mean. Imputation does add error (imputation, perturbation and model error), which is why it's limited to about 5% per factor. Perturbation makes each value <i>less<\/i> accurate on average but gives more realistic variability.", "concept": "Missing-data pitfalls", "note": "Throwing away can bias; wrong ≠ missing; mean imputation is biased when high/low values skip; imputation adds error (≤ ~5%); perturbation trades accuracy for variability.", "refs": ["M14 L1", "M14 L2", "M14 L3"]}]}, {"title": "Planning a meal-kit kitchen", "setup": "A meal-kit company buys ingredients from several suppliers, packs kits every day of the week, and wants the cheapest plan that meets every nutrition and contract rule. It also refits its regression for packing time, y = a₀ + a₁x₁ + … (x = items in the order, cold items, …).", "parts": [{"q": "Match each piece of the purchasing model to its role.", "type": "match", "fixed": false, "cats": ["Variable (a decision)", "Constraint", "Linking constraint", "Objective function", "Data (known input, maybe from another model)"], "items": ["Next week's kit demand, forecast by a regression on past orders", "xᵢ = kilograms of ingredient i to buy", "xᵢ ≥ 0 for every ingredient", "Minimize ingredient costs plus each used supplier's fixed delivery fee", "The price per kilogram of each ingredient", "yⱼ = 1 if supplier j is used, 0 if not", "Every kit contains at least 30 g of protein", "zⱼ = kilograms bought from supplier j, with zⱼ ≤ 2,000·yⱼ"], "answer": [4, 0, 1, 3, 4, 0, 1, 2], "why": ["Another model's output, fed in as a fixed number.", "The solver chooses how much to buy.", "Non-negativity: the easy-to-forget constraint.", "The quality measure the solver minimizes.", "Known before solving: data, not a decision.", "A yes/no decision the solver chooses.", "A restriction on the decisions.", "Ties the amount to the yes/no choice, so nothing is bought from an unused supplier and the fee can't be dodged."], "explain": "Variables are what the solver decides; constraints restrict them (a linking constraint ties two kinds of variables together); the objective scores a plan; everything known in advance, including other models' predictions, is data. The solver only reads the math, so a link like x ≤ 2,000·y has to be written out.", "concept": "Elements of an optimization model", "note": "Decisions = variables; restrictions = constraints (+ linking, + x ≥ 0); quality = objective; forecasts and prices = data.", "refs": ["M15 L2", "M15 L3", "M15 L4", "M15 L4a"]}, {"q": "Match each supplier rule to the constraint that models it (xⱼ = kilograms from supplier j, yⱼ = 1 if supplier j is used). A box may stay empty.", "type": "match", "fixed": false, "cats": ["xⱼ ≤ 2000·yⱼ", "xⱼ ≥ 50·yⱼ", "y_A + y_B ≥ 1", "y_A + y_B + y_C = 1", "y_A = y_B", "y_A = 1 − y_B", "y_A = 1", "(sum of yⱼ over organic suppliers) ≥ 3·yᵢ, for each organic supplier i", "xⱼ ≥ 2000·yⱼ"], "items": ["Use both dairy co-ops or neither", "Use exactly one of the three spice vendors", "If any organic supplier is used, use at least 3 organic suppliers", "If anything is bought from a supplier, its delivery fee must be paid", "The company has a contract that requires using the local farm", "Use exactly one of the two bakeries", "If a supplier is used, order at least 50 kg from it", "Use at least one of the two organic farms"], "answer": [4, 3, 7, 0, 6, 5, 1, 2], "why": ["The two yes/no decisions are equal.", "Exactly one of a group: the binaries sum to 1 (≥ 1 would allow more than one).", "Using organic supplier i (yᵢ = 1) switches on “at least 3”; if yᵢ = 0, the constraint says nothing.", "yⱼ = 0 forces xⱼ = 0, so buying anything forces yⱼ = 1 and the fee in the objective.", "A forced choice fixes the binary at 1.", "Exactly one is 1.", "yⱼ = 1 forces at least 50 kg; yⱼ = 0 leaves xⱼ ≥ 0.", "At least one of the two binaries is 1."], "explain": "Binary variables turn yes/no rules into linear constraints. xⱼ ≥ 2000·yⱼ models none of these rules: it would force 2,000 kg from every supplier used.", "concept": "Modeling with binary variables", "note": "Fee link x ≤ M·y; minimum x ≥ m·y; at least one Σy ≥ 1; both or neither y_A = y_B; exactly one y_A = 1 − y_B; if-then Σy ≥ k·yᵢ.", "refs": ["M15 L4"]}, {"q": "Which are true about building and using the kitchen's models?", "type": "multi", "fixed": false, "options": ["Optimization software builds the model from the data; the analyst only needs to read the answer", "A plan that meets every constraint is feasible; the optimal plan is the cheapest feasible plan, and no plan is “more optimal” than another optimal one", "Packers work 5 days in a row, then 2 off. With xᵢ = packers who start on day i, Wednesday is covered by x_Sat + x_Sun + x_Mon + x_Tue + x_Wed", "If the first schedule calls for 10.5 packers on Friday, a constraint was missed (no partial shifts); add it, re-solve and check again with the kitchen manager", "Adding a variety rule (at most 40% of protein from chicken) could lower the cheapest possible cost", "When the packing-time regression is fitted as an optimization, its variables are the coefficients aⱼ, and the data xᵢⱼ are constants", "The company invests its cash with the Markowitz model, maximize Σrᵢxᵢ − θΣΣQᵢⱼxᵢxⱼ; a larger θ gives a riskier portfolio"], "answer": [1, 2, 3, 5], "explain": "Software solves optimization models but doesn't build them; that takes human expertise. Feasible = meets all constraints; optimal = best feasible. Start-day variables build the 5-in-a-row rule in: Wednesday's packers started on Sat, Sun, Mon, Tue or Wed. Real constraints are discovered over several rounds of build, check and fix. An extra constraint can only keep the optimal cost the same or raise it. In the optimization view, coefficients are the decisions and the data are fixed. In the Markowitz model θ multiplies the risk (variance) term, so a larger θ gives a <i>less<\/i> risky portfolio.", "concept": "Building optimization models", "note": "Software solves, people build; feasible vs optimal; start-day variables; iterate to discover constraints; added constraints can't improve the optimum; coefficients are the variables.", "refs": ["M15 L1", "M15 L2", "M15 L3", "M15 L4a", "M15 L5"]}, {"q": "Every model below is fitted by solving an optimization. Match each optimization to its model.", "type": "match", "fixed": false, "cats": ["Linear regression", "Lasso", "Ridge regression", "Elastic net", "Logistic regression", "Soft-margin SVM", "Exponential smoothing", "k-means clustering", "Hard-margin SVM", "GARCH"], "items": ["Maximize the product of p(xᵢ) over points with yᵢ = 1 times the product of (1 − p(xᵢ)) over points with yᵢ = 0", "Minimize Σⱼ aⱼ² subject to (a₀ + Σⱼ aⱼxᵢⱼ)yᵢ ≥ 1 for every point", "Minimize Σᵢ (yᵢ − (a₀ + Σⱼ aⱼxᵢⱼ))² subject to Σⱼ |aⱼ| ≤ τ", "Choose centers and binaries yᵢₖ with Σₖ yᵢₖ = 1 for each point, minimizing total distance from points to their centers", "Minimize Σᵢ (yᵢ − (a₀ + Σⱼ aⱼxᵢⱼ))², no constraints", "Minimize Σₜ (σₜ² − σ̂ₜ²)², with no constraints", "Minimize Σₜ (xₜ − x̂ₜ)² subject to 0 ≤ α, β, γ ≤ 1", "Minimize Σᵢ (yᵢ − (a₀ + Σⱼ aⱼxᵢⱼ))² subject to λΣⱼ |aⱼ| + (1 − λ)Σⱼ aⱼ² ≤ τ", "Minimize Σᵢ max{0, 1 − (a₀ + Σⱼ aⱼxᵢⱼ)yᵢ} + λ Σⱼ aⱼ²", "Minimize Σᵢ (yᵢ − (a₀ + Σⱼ aⱼxᵢⱼ))² subject to Σⱼ aⱼ² ≤ τ"], "answer": [4, 8, 1, 7, 0, 9, 6, 3, 5, 2], "why": ["Maximum likelihood with p(x) = 1/(1 + e^−(a₀ + Σaⱼxⱼ)).", "Every point correctly classified; minimizing Σaⱼ² gives the widest margin (the slide misprints it as maximize).", "Absolute-value budget.", "Each point in exactly one cluster; minimize distance to centers.", "Least squares with no constraints.", "GARCH fits a variance forecast, so its error is in σ², not in x.", "Squared one-step errors, with smoothing constants between 0 and 1.", "A blend of both budgets.", "Hinge errors plus λ times the margin term.", "Squared budget."], "explain": "Most models you've fitted are optimizations: regression minimizes squared error (lasso, ridge and elastic net add one constraint each), logistic regression maximizes likelihood, SVM trades errors against margin, smoothing picks α, β, γ in [0, 1], and k-means assigns points with binary variables.", "concept": "Optimization inside statistical models", "note": "Regression: min SSE; + Σ|a| ≤ τ (lasso), Σa² ≤ τ (ridge), blend (elastic net); logistic: max likelihood; SVM: hinge + λΣa²; smoothing: 0 ≤ α,β,γ ≤ 1; k-means: binaries, Σₖy = 1.", "refs": ["M15 L5"]}, {"q": "Managers ask for changes to the packing-time regression. Match each request to the change that delivers it.", "type": "match", "fixed": false, "cats": ["Lower the error exponent (e.g. 3/2) or minimize absolute error", "Add the constraint a₀ = 0", "Add a₁ ≥ a₂ ≥ a₃ ≥ … and a₁ − a₂ ≥ a₂ − a₃ ≥ …", "Binaries wᵢ with Σwᵢ = F and Lᵢwᵢ ≤ aᵢ ≤ Uᵢwᵢ", "Lasso with budget τ", "Ridge with budget τ"], "items": ["With xₖ = 1 if the order has at least k items, the extra time for each additional item must never increase, and each drop must be no bigger than the one before", "Correlated predictors make the coefficients jump around; shrink them all without dropping any", "A few huge holiday orders pull the fitted line too hard", "Use exactly the 4 predictors that fit the training data best", "An order with zero items must take zero packing time", "Use fewer predictors, with some set exactly to 0, but no exact count is required"], "answer": [2, 5, 0, 3, 1, 4], "why": ["Ordered coefficients, and decreasing differences between them, are easy to add as linear constraints.", "Ridge shrinks every coefficient and sets none to 0.", "Squared error lets far points dominate; a lower exponent or absolute error reduces their pull.", "Picks exactly F features: the best subset on training data (still validate it).", "Forces the prediction to 0 when every factor is 0.", "Lasso zeroes some coefficients, but its count is only indirectly controlled by τ."], "explain": "Because regression is an optimization, you can change its objective (exponent, absolute error) or add constraints for the question at hand (zero intercept, ordered coefficients, exactly F features). Lasso and ridge are built-in versions of the same idea.", "concept": "Customizing models with optimization", "note": "Far points matter less → lower exponent; zero at zero → a₀ = 0; ordered → a₁ ≥ a₂ ≥ …; exactly F → binaries; fewer, count flexible → lasso; shrink all → ridge.", "refs": ["M15 L5a", "M11 L2"]}]}]</script>
<script id="data4" type="application/json">[{"title": "Bikes moving between city zones", "setup": "A bike-share company tracks where each bike is at the start of every hour: <b>Downtown (D)<\/b>, <b>University (U)<\/b> or <b>Riverside (R)<\/b>. From past trips it estimated these hourly probabilities:<table class=\"dt\"><tr><th>From ↓ / To →<\/th><th>D<\/th><th>U<\/th><th>R<\/th><\/tr><tr><th>D<\/th><td>0.6<\/td><td>0.3<\/td><td>0.1<\/td><\/tr><tr><th>U<\/th><td>0.2<\/td><td>0.7<\/td><td>0.1<\/td><\/tr><tr><th>R<\/th><td>0.3<\/td><td>0.2<\/td><td>0.5<\/td><\/tr><\/table>Each row adds to 1. The company assumes a bike's next zone depends only on its current zone.", "parts": [{"q": "A bike is Downtown now. What is the probability it is at University <b>two hours<\/b> from now?", "type": "single", "fixed": true, "options": ["0.30", "0.41", "0.09", "0.21"], "answer": [1], "explain": "Add up every two-step path from D that ends at U: D→D→U = 0.6 × 0.3 = 0.18; D→U→U = 0.3 × 0.7 = 0.21; D→R→U = 0.1 × 0.2 = 0.02. Total 0.41. 0.30 is only one hour; 0.09 squares one number; 0.21 counts only the path through University. (It's the D row times the U column, the (D, U) entry of P².)", "concept": "Multi-step transition probabilities", "note": "Two steps = sum over the middle state: Σₖ P(i→k)·P(k→j), the (i, j) entry of P².", "refs": ["M13 L8"]}, {"q": "Which are true about this chain in the long run?", "type": "multi", "fixed": false, "options": ["The long-run share of bikes in each zone is the same whatever zone a bike starts in", "The long-run shares π satisfy πP = π, with the shares adding to 1", "In the long run, University holds the largest share of bikes, a little under half", "In the long run, each zone holds one third of the bikes", "Steady state means the bikes stop moving between zones"], "answer": [0, 1, 2], "explain": "For a chain like this one (every zone can reach every other), the steady state doesn't depend on the start. Solving πP = π with π summing to 1 gives about D 36%, U 47%, R 17%, so University is largest. The shares aren't equal because the rows differ (University keeps 70% of its bikes each hour). Steady state means the <i>shares<\/i> stop changing; individual bikes keep moving.", "concept": "Steady state", "note": "Steady state: πP = π, Σπ = 1; shares stop changing, individuals keep moving; for a well-connected chain it doesn't depend on the start.", "refs": ["M13 L8"]}, {"q": "Match each item to the Markov chain idea it describes. A box may stay empty or get several cards.", "type": "match", "fixed": false, "cats": ["Transition probability", "Steady state", "Absorbing state", "The memoryless assumption fails", "Not a Markov chain question"], "items": ["The chance a bike at Riverside is Downtown one hour later", "Each row of the table adds to 1", "The share of bikes in each zone after the system has run for weeks", "Ranking web pages by the long-run share of time a random clicker spends on each page", "Bikes sent for repair are retired and never come back into service", "Bikes that have sat at University for 3+ hours are much less likely to move, so how long a bike has been there matters", "Forecast tomorrow's number of rides from weather and day of the week"], "answer": [0, 0, 1, 1, 2, 3, 4], "why": ["One entry of the table: P(R → D) = 0.3.", "Each row lists every place a bike in that zone can go next, so its probabilities sum to 1.", "The long-run distribution: the steady state.", "That's PageRank: the steady state of a random-surfer chain over web pages.", "Once in “Retired”, a bike stays there with probability 1: an absorbing state.", "Here the history (time already spent) changes the next step, which breaks memorylessness. A fix is to split the state (e.g. “University, just arrived” vs “University, 3+ hours”).", "That's predicting a count from factors: a regression-type question, not states and transitions."], "explain": "A Markov chain is built from states and transition probabilities (each row sums to 1). The steady state is the long-run share in each state (PageRank is one). An absorbing state is never left. The chain assumes memorylessness: only the current state matters.", "concept": "Markov chain vocabulary", "note": "Transition = P(next | current), rows sum to 1; steady state = long-run shares (PageRank); absorbing = never left; memoryless = history doesn't matter.", "refs": ["M13 L8"]}]}, {"title": "Delivery times: do we need a bell curve?", "setup": "A food-delivery company wants to check whether things changed or differ. Two families of tests can answer that:<ul><li><b>Parametric tests<\/b> (t-tests) use the actual values, compare <b>means<\/b>, and assume the data (or the differences) are roughly bell-shaped (normal).<\/li><li><b>Non-parametric tests<\/b> (Wilcoxon signed rank, Mann-Whitney, McNemar) line the values up by <b>rank<\/b> or count yes/no switches, compare <b>medians<\/b> or ranks, and don't assume a shape.<\/li><\/ul>Choose by asking: is the outcome a number or yes/no? Same people twice (paired) or two separate groups? Bell-shaped, or skewed / extreme values / ratings?", "parts": [{"q": "Match each question to the test that fits it best. A box may get several cards or none.", "type": "match", "fixed": false, "cats": ["Paired t-test (parametric)", "Wilcoxon signed rank (non-parametric: one sample, or paired)", "Two-sample t-test (parametric)", "Mann-Whitney (non-parametric: two separate groups)", "McNemar (paired yes/no)"], "items": ["The same 30 drivers’ average delivery time before and after a new routing app; the before-after changes look bell-shaped", "The same 30 drivers before and after the app, but a few drivers who used to get lost improved by 40+ minutes", "Delivery times in two different cities, 200 orders each, both roughly bell-shaped", "Delivery times in two different cities, where rare traffic jams create a long tail of very late orders", "The same 50 customers: did each one order (yes/no) in the week before a coupon, and in the week after?", "Customers rate the app 1–5 stars; one group sees the old app and a different group sees the new one", "Is the typical delivery time different from the promised 30 minutes, when times are heavily right-skewed?"], "answer": [0, 1, 2, 3, 4, 3, 1], "why": ["Same drivers twice → paired; bell-shaped changes → the t-test on the average change works.", "Same drivers twice → paired; a few huge changes would distort the average and the spread, so rank the changes instead.", "Two separate groups, bell-shaped data → compare the two means with a two-sample t-test.", "Two separate groups with a long tail → compare ranks, which a few extreme values can't distort.", "Paired yes/no answers → McNemar, which looks only at customers who switched (ordered → didn't, or didn't → ordered).", "Star ratings are ranks, not measurements, and the two groups are different people → Mann-Whitney.", "One sample compared with a fixed value, skewed data → Wilcoxon signed rank on the median (the one-sample t-test would need a bell shape)."], "explain": "Three questions decide it. (1) Number or yes/no? Paired yes/no → McNemar. (2) Same people twice (paired, or one sample vs. a value) or two separate groups? (3) For numbers: roughly bell-shaped → t-test on means (parametric); skewed, extreme values or ratings → rank-based test (non-parametric). Each parametric test has a non-parametric partner: paired t ↔ Wilcoxon signed rank, two-sample t ↔ Mann-Whitney.", "concept": "Choosing a test", "note": "Paired t ↔ Wilcoxon signed rank · two-sample t ↔ Mann-Whitney · paired yes/no → McNemar. Bell-shaped → t (means); skewed, outliers or ratings → ranks (medians).", "refs": ["M16 L1", "M16 L1a"]}, {"q": "Five delivery times (minutes) from each of two kitchens:<table class=\"dt\"><tr><th>Kitchen A<\/th><td>21<\/td><td>22<\/td><td>24<\/td><td>25<\/td><td>120<\/td><\/tr><tr><th>Kitchen B<\/th><td>28<\/td><td>29<\/td><td>30<\/td><td>31<\/td><td>32<\/td><\/tr><\/table>The 120 is a real order that got stuck in a storm. Which are true?", "type": "multi", "fixed": false, "options": ["A’s mean (42.4) makes it look slower than B, but its median (24) shows a typical A order is faster than B’s (30)", "Ranked from fastest to slowest, A has 4 of the 5 fastest orders; Mann-Whitney sees the 120 as just “the slowest”, whatever its size", "A t-test would treat the 120 as a huge spread, making it hard to see any difference", "The 120 should be deleted because it’s an outlier", "Because a non-parametric test exists, t-tests are never the right choice"], "answer": [0, 1, 2], "explain": "One extreme value drags the mean and inflates the spread, so a t-test is easily thrown off (here p ≈ 0.54). Ranks only care about order: A’s ranks are 1, 2, 3, 4 and 10 (sum 20) vs. B’s 5–9 (sum 35), and the 120 would count the same if it were 33 or 1,000 (Mann-Whitney p ≈ 0.15 with just 5 orders each). A real value shouldn’t be deleted just for being large; rank-based tests are made for this. t-tests are still the better choice for bell-shaped data.", "concept": "Why ranks resist extreme values", "note": "Mean and t-test are pulled by extreme values; median and ranks only care about order. Don't delete real values.", "refs": ["M16 L1", "M5 L3"]}, {"q": "When is a parametric test (t-test) the better choice?", "type": "single", "fixed": false, "options": ["When the data (or the paired differences) are roughly bell-shaped: it uses the actual values, so it can detect smaller real differences", "Whenever there are outliers, because it uses the exact values", "Only when the data are ratings like 1–5 stars", "Never: non-parametric tests are always safer and lose nothing"], "answer": [0], "explain": "When its assumption holds, a t-test uses all the information in the values, so it's more powerful (it can find smaller differences with the same data). Non-parametric tests trade a little of that power for safety when the shape is skewed, has extreme values or is unknown, or when the data are ranks like star ratings.", "concept": "When parametric wins", "note": "Bell-shaped → t-test (more power). Skewed, outliers, ratings or unknown shape → non-parametric (safer).", "refs": ["M16 L1"]}]}, {"title": "A solar company's optimization models", "setup": "A solar energy company has built eight optimization models. Variables are continuous unless stated; yᵢ ∈ {0, 1}. Prices pₜ, costs cᵢ, fᵢ, dᵢ, capacities and demands are known data.", "parts": [{"q": "Match each model to its type. A box may get several cards or none.", "type": "match", "fixed": false, "cats": ["Linear program", "Network model (a special LP)", "Convex quadratic program", "Convex program (not linear or quadratic)", "Integer program", "Mixed-integer program", "Non-convex program"], "items": ["Battery plan: maximize Σₜ pₜsₜ subject to bₜ = bₜ₋₁ + gₜ − sₜ, 0 ≤ bₜ ≤ 100, gₜ ≤ sunₜ, all variables ≥ 0 (gₜ = charging, sₜ = selling)", "Split 50 MW among plants whose costs rise faster as they work harder: minimize Σᵢ (cᵢxᵢ² + dᵢxᵢ) subject to Σᵢ xᵢ = 50, xᵢ ≥ 0", "Share power fairly between neighborhoods: maximize Σᵢ log(1 + xᵢ) subject to Σᵢ xᵢ ≤ 80, xᵢ ≥ 0", "Pick which of 12 rooftops to lease (fixed fee fᵢ) and how much to generate on each: maximize Σᵢ rᵢxᵢ − Σᵢ fᵢyᵢ subject to xᵢ ≤ capᵢ·yᵢ, xᵢ ≥ 0", "Schedule maintenance crews (whole crews only): minimize Σⱼ wⱼ subject to wⱼ + wⱼ₋₁ ≥ needⱼ for each day j, each wⱼ a whole number ≥ 0", "Send power from 3 plants to 6 towns at the lowest line cost: minimize Σ cᵢⱼfᵢⱼ subject to supply out of each plant, demand into each town, 0 ≤ fᵢⱼ ≤ uᵢⱼ", "Choose panel angles to maximize output when nearby buildings cast shadows, so output has several separate peaks as the angle changes", "Fit a sunlight-to-output forecast: minimize Σₜ (outputₜ − a − b·sunₜ)², no constraints"], "answer": [0, 2, 3, 5, 4, 1, 6, 2], "why": ["Linear objective and linear constraints (the battery balance is linear) → LP.", "A convex quadratic cost (cᵢ ≥ 0) minimized with linear constraints → convex QP.", "log(1 + x) e the variables integers.", "concept": "Max vs. min changes the class", "note": "Min convex or max concave → convex. Max convex or min concave → non-convex.", "refs": ["M15 L6"]}, {"q": "Which are true about solving these models?", "type": "multi", "fixed": false, "options": ["LPs and convex programs can be solved quickly and reliably to the true best answer, even when large", "Turning the rooftop choices into yes/no variables can make the model much slower to solve than the same model without them", "For the shaded-panel model, a solver might report a good answer that isn't the best one", "The number of constraints decides whether a model is linear", "Network models solve fast and naturally give whole-number flows when the supplies, demands and capacities are whole numbers"], "answer": [0, 1, 2, 4], "explain": "Convex problems (including LPs) have no misleading local optima, so solvers are fast and reliable. Integer variables add many combinations to search. Non-convex problems can trap a solver at a local optimum. Linearity is about the shape of the formulas, not how many there are. Network models are LPs with a special structure that gives whole-number answers for free.", "concept": "How hard is each type to solve?", "note": "LP, network, convex: fast and reliable. Integer / mixed-integer: can be much slower. Non-convex: may stop at a local optimum.", "refs": ["M15 L6", "M15 L8"]}]}, {"title": "A music festival's analytics questions", "setup": "A three-day music festival’s analytics team has a list of questions. Each one calls for a different method from Modules 13–16.", "parts": [{"q": "Match each question to the method that fits it best. A box may get several cards or none.", "type": "match", "fixed": false, "cats": ["Louvain community detection", "k-means clustering", "Game theory", "Queuing model", "Simulation", "Stochastic optimization", "Non-parametric test", "Markov chain", "Integer program with big-M constraints", "Regression"], "items": ["Find groups of <script>
(function(){
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600);}
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}
function shuf(n,seed){const idx=[...Array(n).keys()],r=rng(seed);for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}return idx;}
const same=(a,b)=>[...a].sort().join()===[...b].sort().join();
function refList(r){return (r||[]).map(x=>String(x).replace(/^M(\d+) L(\w+)/,'Module $1 · Lesson $2')).join('; ');}
const load=(k,d)=>{try{const s=JSON.parse(localStorage.getItem(k)||'null');return s||d;}catch(e){return d;}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

// ---- Practice 1 keeps its original storage key and format; the shared notes live there too, so existing notes stay.
const K1='study-group-practice-1-m2', K2='study-group-practice-2', K3='study-group-practice-3', K4='study-group-practice-4-v3';
let DB1=load(K1,null); if(!DB1||!DB1.attempts) DB1={attempts:[],notes:[]}; DB1.notes=DB1.notes||[]; if(typeof DB1.notebook!=='string') DB1.notebook='';
let DB2=load(K2,null); if(!DB2||!DB2.attempts) DB2={attempts:[]};
let DB3=load(K3,null); if(!DB3||!DB3.attempts) DB3={attempts:[]};
let DB4=load(K4,null); if(!DB4||!DB4.attempts) DB4={attempts:[]};
const PR={
  p1:{name:'Practice 1',sub:'Variable selection · 2 scenarios · 10 questions · select all that apply',SCS:JSON.parse(document.getElementById('data').textContent),pre:'',db:()=>DB1,save:()=>put(K1,DB1)},
  p2:{name:'Practice 2',sub:'Distributions, Q-Q plots and experiment design · 4 drag-and-drop questions',SCS:JSON.parse(document.getElementById('data2').textContent),pre:'p2-',db:()=>DB2,save:()=>put(K2,DB2)},
  p3:{name:'Practice 3',sub:'Missing data and optimization modeling (Modules 14–15 L5a) · 2 scenarios · 7 questions',SCS:JSON.parse(document.getElementById('data3').textContent),pre:'p3-',db:()=>DB3,save:()=>put(K3,DB3)},
  p4:{name:'Practice 4',sub:'Markov chains (M13 L8), parametric vs. non-parametric tests (M16 L1), classifying optimization models (M15 L6) and matching methods to questions (M13–M16) · 4 scenarios · 12 questions',SCS:JSON.parse(document.getElementById('data4').textContent),pre:'p4-',db:()=>DB4,save:()=>put(K4,DB4)}
};
for(const k in PR){const pr=PR[k];pr.P=[];pr.SCS.forEach((sc,si)=>sc.parts.forEach(p=>pr.P.push(Object.assign({id:pr.pre+'q'+(pr.P.length+1),n:pr.P.length+1,si,pr:k},p))));
  pr.byId=id=>pr.P.find(p=>p.id===id);
  pr.newAttempt=(ids,kind)=>{const D=pr.db();D.attempts.push({n:D.attempts.length+1,kind:kind||'all',ids:ids||pr.P.map(p=>p.id),ans:{},started:Date.now()});pr.save();};
  if(!pr.db().attempts.length) pr.newAttempt();
  {const D=pr.db(),a=D.attempts[D.attempts.length-1]; if(a.kind!=='missed'&&a.ids.length<pr.P.length){ if(!Object.keys(a.ans).length) a.ids=pr.P.map(p=>p.id); else pr.newAttempt(); D.attempts[D.attempts.length-1].kind='all'; pr.save(); }}
  pr.cur=()=>{const D=pr.db();return D.attempts[D.attempts.length-1];};}
const findP=id=>{for(const k in PR){const p=PR[k].byId(id);if(p)return p;}return null;};
const saveNotes=()=>put(K1,DB1);
function refsOf(n){const p=n.pid&&findP(n.pid);return n.refs||(p&&p.refs)||[];}
function hasNote(pid){return DB1.notes.some(n=>n.pid===pid);}
function addNote(p,why){if(hasNote(p.id))return false;const pr=PR[p.pr];DB1.notes.push({id:'n'+Date.now()+Math.random().toString(36).slice(2,6),pid:p.id,practice:pr.name,refs:p.refs||[],sc:pr.SCS[p.si].title,title:p.concept,key:p.note,explain:p.explain,q:p.q,why,mine:'',at:Date.now()});saveNotes();return true;}

// ---- drag-and-drop working state (not saved until submitted)
const WIP={}; let SEL=null;   // WIP[qid] = {itemIndex: catIndex}; SEL = {q, i}
function matchOk(p,place){return p.items.every((_,i)=>place[i]===p.answer[i]);}
// points: each drag-and-drop card is 1 point; each select-all / single question is 1 point (all-or-nothing, as before)
const maxPts=p=>p.type==='match'?p.items.length:p.options.length;  // real-exam style: per card, per option
const gotPts=(p,a)=>!a?0:p.type==='match'?p.items.filter((_,i)=>a.place[i]===p.answer[i]).length:p.type==='single'?(a.ok?p.options.length:0):p.options.filter((_,i)=>a.picks.includes(i)===p.answer.includes(i)).length;
function tally(k){const pr=PR[k],att=pr.cur();let got=0,max=0,ans=0;att.ids.forEach(id=>{const p=pr.byId(id),a=att.ans[id];max+=maxPts(p);if(a){got+=gotPts(p,a);ans+=maxPts(p);}});return {got,max,ans,att};}

const EXTRA={p2:`<a class="card resource" href="qq_explorer.html"><b>📈 Q-Q Plot Explorer →<span class="newb">NEW</span></b><span>New to Q-Q plots? Start there: how they're built, every distribution as a histogram and Q-Q plot, what each shape means, and a guess-the-shape quiz.</span></a>`};
function renderQuiz(k){
  const pr=PR[k],att=pr.cur(),ids=att.ids,done=ids.filter(id=>att.ans[id]).length,right=ids.filter(id=>att.ans[id]&&att.ans[id].ok).length;
  const T=tally(k),pct=T.max?Math.round(100*T.got/T.max):0;
  let h=(EXTRA[k]||'')+`<div class="card scorebox"><div class="big"><span class="num">${T.got}</span><span class="of">/ ${T.max} points</span><span class="pct">${T.ans?Math.round(100*T.got/T.ans)+'% of answered':''}</span></div><div class="bar2"><i class="g" style="width:${T.max?100*T.got/T.max:0}%"></i><i class="r" style="width:${T.max?100*(T.ans-T.got)/T.max:0}%"></i></div><div class="score"><b>Attempt ${att.n}${att.kind==='missed'?' · missed questions only':''}</b><span>${done} of ${ids.length} questions answered · ${pr.P.every(p=>p.type==='match')?'1 point per card':pr.P.some(p=>p.type==='match')?'1 point per drag-and-drop card; select-all: 1 point per option judged right':'select-all: 1 point per option judged right (partial credit, as on the real exam)'}</span></div></div>`;
  let lastSi=-1;
  ids.forEach((id,qi)=>{const p=pr.byId(id),a=att.ans[id];
    if(p.si!==lastSi){lastSi=p.si;const sc=pr.SCS[p.si];h+=`<div class="card setup"><div class="qn">Scenario ${p.si+1} of ${pr.SCS.length}</div><h2>${esc(sc.title)}</h2><div>${sc.setup}</div></div>`;}
    h+=`<div class="card" id="c-${id}"><div class="qn">Question ${qi+1} of ${ids.length}</div><div class="q">${p.q}</div>`;
    if(p.type==='match') h+=matchHTML(p,att,a); else h+=multiHTML(p,att,a);
    if(a){h+=`<div class="fb"><div class="v ${a.ok?'ok':'no'}"><span class="pts">${gotPts(p,a)} / ${maxPts(p)} ${maxPts(p)===1?'point':'points'}</span> ${a.ok?'Correct':'Not quite'}${a.ok?'':' · added to your notes'}</div><div>${p.explain}</div><div class="key"><b>Key idea:</b> ${p.note}</div>${p.refs&&p.refs.length?`<div class="refs">Lecture: ${esc(refList(p.refs))}</div>`:''}<div class="row">${hasNote(id)?`<button disabled>In your notes ✓</button>`:`<button data-add="${id}">Add to notes</button>`}</div></div>`;}
    h+=`</div>`;});
  if(done===ids.length){const missed=ids.filter(id=>!att.ans[id].ok),D=pr.db();
    h+=`<div class="card done"><h2 style="margin:0 0 6px;font-size:1.6rem">Final score: ${T.got} / ${T.max} points (${pct}%)</h2><p style="margin:0">${missed.length?`You missed ${missed.length}. ${missed.length===1?'It is':'They are'} in your notes.`:'All correct. Nice work.'}</p><div class="row"><button class="primary" data-retest="all" data-pr="${k}">Retest all questions</button>${missed.length?`<button data-retest="missed" data-pr="${k}">Retest missed only (${missed.length})</button>`:''}<button data-goto="notes">Review notes</button></div>`;
    if(D.attempts.length>1){h+=`<ul class="hist">`+D.attempts.map(t=>{const d=t.ids.filter(i=>t.ans[i]),r=d.filter(i=>t.ans[i].ok).length;const g=d.reduce((s,i)=>s+gotPts(pr.byId(i),t.ans[i]),0),m=t.ids.reduce((s,i)=>s+maxPts(pr.byId(i)),0);return `<li>Attempt ${t.n}${t.kind==='missed'?' (missed only)':''}: ${d.length?`${g} / ${m} points`:'not started'}</li>`;}).join('')+`</ul>`;}
    h+=`</div>`;}
  document.getElementById('v-'+k).innerHTML=h;
}
function multiHTML(p,att,a){
  const ord=p.fixed?p.options.map((_,i)=>i):shuf(p.options.length,att.n*97+p.n*13+7);
  let h=`<p class="hint">${p.type==='single'?'Choose one.':'Select all that apply.'}</p>`;
  ord.forEach(i=>{const picked=a?a.picks.includes(i):false,isAns=p.answer.includes(i);let cls='',tag='';
    if(a){ if(isAns&&picked){cls='right';tag='Correct choice';} else if(isAns&&!picked){cls='wrong';tag='Missed: this is true';} else if(!isAns&&picked){cls='wrong';tag='Not true';} }
    h+=`<label class="opt ${cls}"><input type="${p.type==='single'?'radio':'checkbox'}" name="r-${p.id}" data-p="${p.id}" value="${i}" ${picked?'checked':''} ${a?'disabled':''}><span>${p.options[i]}${tag?`<span class="tag">${tag}</span>`:''}</span></label>`;});
  if(!a) h+=`<div class="row"><button class="primary" data-submit="${p.id}">Submit</button></div>`;
  return h;
}
const chip=(p,i,extra,cls)=>`<div class="chip ${/<svg/.test(p.items[i])?'has-svg':''} ${cls||''}" ${extra||''}>${p.items[i]}</div>`;
function matchHTML(p,att,a){
  const ord=shuf(p.items.length,att.n*131+p.n*17+3);
  let h=`<p class="hint">Drag each card into a box, or tap a card and then tap a box. Tap a placed card to move it again. Some boxes may stay empty.</p>`;
  if(!a){const place=WIP[p.id]||{},left=ord.filter(i=>place[i]===undefined);
    h+=`<div class="pool ${left.length?'':'empty-pool'}" data-zone="${p.id}|pool">${left.length?left.map(i=>chip(p,i,`draggable="true" data-chip="${p.id}|${i}"`,SEL&&SEL.q===p.id&&SEL.i===i?'sel':'')).join(''):'All cards placed.'}</div><div class="zones">`;
    p.cats.forEach((c,ci)=>{h+=`<div class="zone ${SEL&&SEL.q===p.id?'target':''}" data-zone="${p.id}|${ci}"><div class="zt">${esc(c)}</div>${ord.filter(i=>place[i]===ci).map(i=>chip(p,i,`draggable="true" data-chip="${p.id}|${i}"`,SEL&&SEL.q===p.id&&SEL.i===i?'sel':'')).join('')}</div>`;});
    h+=`</div><div class="row"><button class="primary" data-submit="${p.id}">Submit</button><button data-clear="${p.id}">Clear</button></div>`;}
  else{h+=`<div class="zones">`;
    p.cats.forEach((c,ci)=>{const here=ord.filter(i=>a.place[i]===ci);
      h+=`<div class="zone" style="cursor:default"><div class="zt">${esc(c)}</div>${here.map(i=>{const ok=p.answer[i]===ci;return chip(p,i,'',ok?'right':'wrong').replace(/<\/div>$/,`<span class="tag">${ok?'Correct':'Belongs in: '+esc(p.cats[p.answer[i]])}</span><span style="display:block;font-size:.85rem;margin-top:2px">${esc(p.why[i])}</span></div>`);}).join('')||'<span class="empty" style="font-size:.85rem">(empty)</span>'}</div>`;});
    h+=`</div>`;}
  return h;
}
function renderNotes(){
  const F=renderNotes.f||'all', list=DB1.notes.filter(n=>F==='all'||(F==='own'?!n.pid:(n.practice||'Practice 1')===F));
  document.getElementById('nCount').textContent=DB1.notes.length?`(${DB1.notes.length})`:'';
  let h=`<div class="card nb"><b>Overall notebook</b><p class="hint" style="margin:2px 0 8px">One running page of notes for the whole topic, across all practices. Saved automatically in this browser. To see these together with your Midterm 1 and 2 notes, or to back them up, open <a href="index.html#notes">All notes on the main site ↗</a>.</p><textarea id="notebook" placeholder="Big ideas, formulas, things the group discussed…">${esc(DB1.notebook)}</textarea><div class="saved" id="nbSaved"></div></div>`;
  h+=`<div class="card notes"><div class="filters">${['all','Practice 1','Practice 2','Practice 3','Practice 4','own'].map(f=>`<button data-filter="${f}" class="${F===f?'on':''}">${f==='all'?'All':f==='own'?'My own notes':f}</button>`).join('')}</div>`;
  if(!list.length) h+=`<p class="empty">No notes here yet. Missed questions are added automatically, and you can add any graded question with "Add to notes".</p>`;
  list.forEach(n=>{h+=`<div class="n"><h3>${esc(n.title||'My note')}</h3>${n.pid?`<div class="meta">${n.why==='missed'?'Missed':'Added'} · ${esc(n.practice||'Practice 1')}${n.sc?' · '+esc(n.sc):''} · ${n.q.replace(/<svg[\s\S]*?<\/svg>/g,'[plot]').replace(/<[^>]+>/g,'')}</div><div class="key"><b>Key idea:</b> ${n.key}</div><div style="margin-top:6px">${n.explain}</div>${refsOf(n).length?`<div class="refs">Lecture: ${esc(refList(refsOf(n)))}</div>`:''}`:''}<textarea data-mine="${n.id}" placeholder="Your own note (saved automatically)">${esc(n.mine||'')}</textarea><div class="row"><button data-del="${n.id}">Remove</button></div></div>`;});
  h+=`</div><div class="card"><b>Add your own note</b><textarea id="newNote" placeholder="Anything you want to remember"></textarea><div class="row"><button class="primary" id="addOwn">Add note</button><button id="copyNotes">Copy all notes</button></div></div>`;
  h+=`<div class="card"><div class="row" style="margin:0"><button id="reset">Start over (clear grades and notes on this device)</button></div></div>`;
  document.getElementById('v-notes').innerHTML=h;
}
function render(){for(const k in PR)renderQuiz(k);renderNotes();
  for(const k in PR){const T=tally(k),b=document.querySelector(`.tabs button[data-t="${k}"]`);b.innerHTML=`${PR[k].name}<span class="tabmeta">${PR[k].P.length}<span class="lg"> questions</span><span class="sm"> Qs</span> (${T.max} pts)</span>${T.ans?`<span class="tabscore">score ${T.got}/${T.max}</span>`:''}`;}}
let TAB='p1';
function tab(t){TAB=t;for(const v of [...Object.keys(PR),'notes'])document.getElementById('v-'+v).classList.toggle('hidden',v!==t);
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.getElementById('sub').textContent=t==='notes'?'Shared notes for all practices':PR[t].sub;try{localStorage.setItem('sgp-tab',t);}catch(e){}window.scrollTo(0,0);}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

function place(qid,i,zone){const w=WIP[qid]=WIP[qid]||{};if(zone==='pool')delete w[i];else w[i]=+zone;SEL=null;const k=findP(qid).pr;renderQuiz(k);}
document.addEventListener('click',e=>{
  const ch=e.target.closest('[data-chip]'), z=e.target.closest('[data-zone]');
  if(SEL&&z){const [q,zone]=z.dataset.zone.split('|'),self=ch&&ch.dataset.chip===SEL.q+'|'+SEL.i;
    // holding a card: tapping anywhere in a box (even on another card) drops it there; tapping a pool card switches the selection
    if(q===SEL.q&&!self&&!(ch&&zone==='pool')){place(q,SEL.i,zone);return;}}
  if(ch){const [q,i]=ch.dataset.chip.split('|');SEL=(SEL&&SEL.q===q&&SEL.i===+i)?null:{q,i:+i};renderQuiz(findP(q).pr);return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.submit){const id=b.dataset.submit,p=findP(id),pr=PR[p.pr];
    if(p.type==='match'){const w=WIP[id]||{};if(p.items.some((_,i)=>w[i]===undefined)){toast('Place every card first');return;}
      const ok=matchOk(p,w);pr.cur().ans[id]={place:Object.assign({},w),ok};delete WIP[id];if(!ok)addNote(p,'missed');}
    else{const picks=[...document.querySelectorAll(`input[data-p="${id}"]:checked`)].map(x=>+x.value);if(!picks.length){toast('Select at least one option');return;}
      const ok=same(picks,p.answer);pr.cur().ans[id]={picks,ok};if(!ok)addNote(p,'missed');}
    pr.save();render();document.getElementById('c-'+id).scrollIntoView({block:'nearest'});}
  else if(b.dataset.clear){delete WIP[b.dataset.clear];SEL=null;renderQuiz(findP(b.dataset.clear).pr);}
  else if(b.dataset.add){if(addNote(findP(b.dataset.add),'added'))toast('Added to notes');render();document.getElementById('c-'+b.dataset.add).scrollIntoView({block:'nearest'});}
  else if(b.dataset.retest){const pr=PR[b.dataset.pr],att=pr.cur(),ids=b.dataset.retest==='missed'?att.ids.filter(id=>!att.ans[id].ok):pr.P.map(p=>p.id);pr.newAttempt(ids,b.dataset.retest);render();window.scrollTo(0,0);toast('New attempt started. Options are reshuffled.');}
  else if(b.dataset.goto){tab(b.dataset.goto);}
  else if(b.dataset.filter){renderNotes.f=b.dataset.filter;renderNotes();}
  else if(b.dataset.del){DB1.notes=DB1.notes.filter(n=>n.id!==b.dataset.del);saveNotes();render();}
  else if(b.id==='addOwn'){const t=document.getElementById('newNote').value.trim();if(!t)return;DB1.notes.push({id:'n'+Date.now(),title:'My note',mine:t,at:Date.now()});saveNotes();render();toast('Note added');}
  else if(b.id==='copyNotes'){const strip=s=>String(s||'').replace(/<svg[\s\S]*?<\/svg>/g,'[plot]').replace(/<sub>(.*?)<\/sub>/g,'$1').replace(/<[^>]+>/g,'');
    const txt=[DB1.notebook.trim()?'OVERALL NOTEBOOK\n'+DB1.notebook.trim():''].concat(DB1.notes.map(n=>[n.title+(n.practice?' ('+n.practice+')':''),n.key?'Key idea: '+strip(n.key):'',strip(n.explain),refsOf(n).length?'Lecture: '+refList(refsOf(n)):'',n.mine?'My note: '+n.mine:''].filter(Boolean).join('\n'))).filter(Boolean).join('\n\n');
    if(!txt){toast('Nothing to copy yet');return;}
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Notes copied'),()=>toast('Copy not available here'));}
  else if(b.id==='reset'){if(confirm('Clear all attempts and notes for every practice on this device?')){DB1={attempts:[],notes:[],notebook:''};DB2={attempts:[]};DB3={attempts:[]};DB4={attempts:[]};PR.p1.newAttempt();PR.p2.newAttempt();PR.p3.newAttempt();PR.p4.newAttempt();render();tab('p1');}}
});
// drag and drop (mouse); touch uses tap-to-place above
let DRAG=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-chip]');if(!c)return;DRAG=c.dataset.chip;e.dataTransfer.setData('text/plain',DRAG);e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-zone]');if(!z||!DRAG)return;if(z.dataset.zone.split('|')[0]!==DRAG.split('|')[0])return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over');});
document.addEventListener('dragleave',e=>{const z=e.target.closest('[data-zone]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over');});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-zone]');if(!z||!DRAG)return;e.preventDefault();const [q,i]=DRAG.split('|'),[zq,zone]=z.dataset.zone.split('|');DRAG=null;if(q===zq)place(q,+i,zone);});
document.addEventListener('dragend',()=>{DRAG=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));});
document.addEventListener('input',e=>{
  if(e.target.id==='notebook'){DB1.notebook=e.target.value;saveNotes();const s=document.getElementById('nbSaved');if(s)s.textContent='Saved';return;}
  const id=e.target.dataset&&e.target.dataset.mine;if(!id)return;const n=DB1.notes.find(x=>x.id===id);if(n){n.mine=e.target.value;saveNotes();}});
render();
let start='p1';try{const s=localStorage.getItem('sgp-tab');if(s&&['p1','p2','p3','p4','notes'].includes(s))start=s;}catch(e){}
if(/#p4|#practice4/.test(location.hash))start='p4';else if(/#p3|#practice3/.test(location.hash))start='p3';else if(/#p2|#practice2/.test(location.hash))start='p2';else if(/#notes/.test(location.hash))start='notes';
tab(start);
const TB=document.getElementById('theme');
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){TB.textContent=isDark()?'☀️ Light':'🌙 Dark';}
TB.onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('sgp-theme',t);}catch(e){}paintTheme();};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);}catch(e){}
paintTheme();
})();
</script>
</body>
