<style>
:root{
  --paper:#F7F9FC; --grid:#E1E8F3; --ink:#16233B; --ink-2:#4A5874; --line:#C9D4E6;
  --pen:#2F5BD3; --pen-ink:#FFFFFF; --hl:#FFE066; --hl-ink:#16233B;
  --ok:#1D7A4E; --ok-bg:#E3F4EA; --bad:#C23B2E; --bad-bg:#FBE8E5; --warn:#8A5A00; --warn-bg:#FFF3D1;
  --card:#FFFFFF; --muted-bg:#EEF2F8;

  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1522; --grid:#18213300; --ink:#E4EAF5; --ink-2:#A5B1C8; --line:#2A3650;
    --pen:#7FA2FF; --pen-ink:#0F1522; --hl:#5C4C00; --hl-ink:#FFF4C2;
    --ok:#5CC592; --ok-bg:#12301F; --bad:#F2877B; --bad-bg:#3A1714; --warn:#F2C66B; --warn-bg:#3A2D08;
    --card:#161E2E; --muted-bg:#1C2639; --grid:#172033;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1522; --ink:#E4EAF5; --ink-2:#A5B1C8; --line:#2A3650;
  --pen:#7FA2FF; --pen-ink:#0F1522; --hl:#5C4C00; --hl-ink:#FFF4C2;
  --ok:#5CC592; --ok-bg:#12301F; --bad:#F2877B; --bad-bg:#3A1714; --warn:#F2C66B; --warn-bg:#3A2D08;
  --card:#161E2E; --muted-bg:#1C2639; --grid:#172033;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg,var(--grid) 1px, transparent 1px);

.wrap{max-width:720px; margin:0 auto; padding:16px 16px 64px}
header.top{display:flex; flex-direction:column; gap:12px; padding:8px 0 4px}
h1{font-family:var(--serif); font-weight:600; font-size:clamp(1.5rem,4.5vw,2rem); line-height:1.15; margin:0; letter-spacing:-0.01em}
.sub{color:var(--ink-2); margin:0; font-size:.95rem}
nav.tabs{display:flex; gap:4px; background:var(--muted-bg); border-radius:12px; padding:4px; border:1px solid var(--line)}
nav.tabs button{flex:1; border:0; background:transparent; color:var(--ink-2); font:600 .95rem var(--sans); padding:10px 8px; border-radius:9px; cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 0 var(--line)}
button:focus-visible, textarea:focus-visible, input:focus-visible, .opt:focus-visible{outline:3px solid var(--pen); outline-offset:2px}
.panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:16px}
h2{font-family:var(--serif); font-weight:600; font-size:1.3rem; margin:0 0 8px}
h3{font-size:1rem; margin:18px 0 8px}
.btn{appearance:none; border:1px solid var(--pen); background:var(--pen); color:var(--pen-ink); font:600 1rem var(--sans); padding:12px 18px; border-radius:10px; cursor:pointer; min-height:46px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--pen)}
.btn.quiet{background:transparent; border-color:var(--line); color:var(--ink-2)}

.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:7px 12px; font:500 .9rem var(--sans); cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.small{font-size:.88rem; color:var(--ink-2)}
.timerbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--line); margin:0 -16px; padding:10px 16px}
.timerrow{display:flex; justify-content:space-between; align-items:center; gap:12px}
.clock{font:700 1.35rem var(--sans); font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.track{height:4px; background:var(--muted-bg); border-radius:4px; margin-top:8px; overflow:hidden}
.track>i{display:block; height:100%; background:var(--pen); width:0}
.qmeta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px}
.tag{font:600 .78rem var(--sans); padding:3px 9px; border-radius:6px; background:var(--muted-bg); color:var(--ink-2)}

.tag.disc{background:var(--hl); color:var(--hl-ink)}
.panel.prof{border:2px solid var(--pen)}

.citem .dtag{font:600 .72rem var(--sans); padding:2px 7px; border-radius:6px; background:var(--hl); color:var(--hl-ink); margin-left:6px; white-space:nowrap}
.qtext{font-family:var(--serif); font-size:1.12rem; line-height:1.6; margin:0 0 14px}
.opts{display:flex; flex-direction:column; gap:10px}

.opt[aria-pressed="true"]{background:linear-gradient(transparent 12%, var(--hl) 12%, var(--hl) 88%, transparent 88%); color:var(--hl-ink); border-color:var(--ink)}
.opt.locked{cursor:default}
.opt.right{border-color:var(--ok); background:var(--ok-bg); color:var(--ink)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg); color:var(--ink)}
.opt .lbl{font-weight:700; margin-right:6px}
.fb{font-size:.92rem; margin-top:8px; color:var(--ink); border-top:1px dashed var(--line); padding-top:8px}
.fb b.k{display:block; margin-bottom:2px}
.fb .mis{display:block; margin-top:4px; color:var(--ink-2)}
.verdict{font:700 1.05rem var(--sans); margin:14px 0 6px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
.note{background:var(--muted-bg); border-radius:10px; padding:10px 12px; font-size:.92rem; margin-top:12px}
.big{font-family:var(--serif); font-size:3.2rem; font-weight:600; line-height:1; margin:4px 0}
.bars{display:flex; flex-direction:column; gap:12px; margin-top:8px}
.bar .lab{display:flex; justify-content:space-between; font-size:.92rem; margin-bottom:4px; gap:8px}
.bar .t{height:10px; background:var(--muted-bg); border-radius:6px; overflow:hidden; display:flex}
.bar .t i{display:block; height:100%}
.bar .t i.m{background:var(--ok)} .bar .t i.r{background:var(--warn)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.85rem; color:var(--ink-2); margin-top:6px}
.legend span::before{content:""; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--c)}
.clist{display:flex; flex-direction:column; gap:8px}
.citem{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 13px; font:500 .98rem var(--sans); color:var(--ink); cursor:pointer}
.citem:disabled{cursor:not-allowed; opacity:.7}
.st{font:600 .78rem var(--sans); padding:3px 8px; border-radius:6px; white-space:nowrap}
.st.new{background:var(--muted-bg); color:var(--ink-2)} .st.solid{background:var(--ok-bg); color:var(--ok)} .st.review{background:var(--warn-bg); color:var(--warn)} .st.locked{background:var(--bad-bg); color:var(--bad)}
textarea{width:100%; min-height:180px; resize:vertical; border:1.5px solid var(--line); border-radius:10px; padding:12px; font:1rem/1.55 var(--serif); color:var(--ink); background:var(--card)}
.points{list-style:none; padding:0; margin:10px 0 0; display:flex; flex-direction:column; gap:8px}
.points label{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--card)}
.points input{width:20px; height:20px; margin-top:2px; accent-color:var(--ok); flex:none}
.points .hint{font-size:.8rem; color:var(--ok); margin-left:6px}
.missed{margin:8px 0 0; padding-left:20px}
.sum-list{padding-left:18px} .sum-list li{margin-bottom:8px}
.sync{font-size:.8rem; color:var(--ink-2)}
.titlerow{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:10px 12px}
.titlerow>div:first-child{flex:1 1 280px}
.theme{display:flex; flex:none; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--card)}
.theme button{border:0; background:transparent; color:var(--ink-2); font:600 .8rem var(--sans); padding:6px 10px; border-radius:999px; cursor:pointer; min-height:32px}
.theme button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
dialog{border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); max-width:420px; width:calc(100% - 32px); padding:20px}
dialog::backdrop{background:rgba(10,15,25,.55)}
@media (prefers-reduced-motion: no-preference){ .opt{transition:background-color .15s, border-color .15s} .track>i{transition:width 1s linear} }
@media (max-width:480px){ .wrap{padding:12px 12px 56px} .panel{padding:14px} .timerbar{margin:0 -12px; padding:10px 12px} }

<body>
<div class="wrap">
  <header class="top">
    <div class="titlerow"><div>
      <h1>Midterm practice: Modules 1–8</h1>
      <p class="sub">Critical-thinking questions and write-it-out recall drills. Your progress saves automatically in this browser. <span class="sync" id="sync"></span></p>
    </div>
    <div class="theme" role="group" aria-label="Color theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light">Light</button><button data-theme-set="dark">Dark</button></div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-exam" aria-selected="true" data-tab="exam">Practice exam</button>
      <button role="tab" id="tab-recall" aria-selected="false" data-tab="recall">Recall drills</button>
      <button role="tab" id="tab-progress" aria-selected="false" data-tab="progress">Progress</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<dialog id="dlg"><p id="dlg-msg" style="margin-top:0"></p><div class="actions" id="dlg-actions"></div></dialog>
<script>
const QS=[], RC=[];
function Q(m,tough,q,opts){ QS.push({m,tough:!!tough,q,opts}); }
function R(m,title,prompt,points){ RC.push({m,title,prompt,points}); }
function DQ(d,m,t,q,o){ Q(m,t,q,o); QS[QS.length-1].disc=d; }
function RD(d,m,title,prompt,points){ R(m,title,prompt,points); RC[RC.length-1].disc=d; RC[RC.length-1].prof=true; }
// First option is always correct in data; options are shuffled at render time.
// Q(module, tough(0/1), question, [[text, why], [text, why, misconception], ...])
Q('m1',0,`A hospital has 40 nurse follow-up calls available each week. It asks: "Which discharged patients should get a call?" What type of analytics question is this?`,[
 [`Prescriptive`,`The answer is an action (who gets a call) with a limited resource to allocate. That's the signature of a prescriptive question.`],
 [`Predictive, because it depends on each patient's readmission risk`,`Risk predictions might be an input, but the question asks what to do with 40 calls.`,`Confusing the inputs a model uses with the type of answer the question needs.`],
 [`Descriptive, because it uses historical patient records`,`Almost every analysis uses historical data. What matters is what the answer is.`,`Thinking "uses past data" means "descriptive."`],
 [`It can't be classified until a method is chosen`,`You classify the question first; that's what narrows the methods.`,`Believing the method determines the question type, when it's the other way around.`]
]);
Q('m1',1,`"Which attributes best distinguish customers who cancelled last year from those who stayed?" Which type is this?`,[
 [`Descriptive`,`It asks for an explanation of patterns already present in past behavior, not a value for something not yet observed.`],
 [`Predictive, because it involves customer cancellation`,`Nothing is being forecast for a new customer; it explains last year.`,`Assuming anything about churn is predictive because churn prediction is a common task.`],
 [`Prescriptive, because the business will use it to reduce cancellations`,`What the business does later doesn't change what this question asks.`,`Classifying by the eventual use of the answer rather than the answer itself.`],
 [`Predictive, because you'd use a classification method`,`A classification tool can be used descriptively. The shape of the answer sets the type, not the tool.`,`Thinking methods and question types map one-to-one.`]
]);
Q('m1',0,`A report says: "We compared five different SVM models." Which meaning of "model" is this?`,[
 [`Method plus its specific setup (variables, settings)`,`All five are SVMs, so the method is fixed. They differ in setup, which is level 2.`],
 [`The method (level 1), because SVM is named`,`If it were the method, there'd only be one "SVM model." Five means something below the method varies.`,`Latching onto the method name and ignoring "five different."`],
 [`The fitted equations, because comparing models means comparing coefficients`,`You compare setups by their performance; the coefficients are just a product of each setup.`,`Thinking "comparing models" means comparing the numbers inside them.`],
 [`All three meanings at once`,`The sentence is specific: five variations of one method.`,`Assuming the word is too vague to pin down, when the detail level tells you.`]
]);
Q('m1',1,`A forecasting model is very accurate on test data, but it arrives as a 40-column table two days after the weekly ordering deadline. Nobody uses it. What failed?`,[
 [`Turning the output into a recommendation that fits how the organization decides`,`Validation only checks the math. The last leg (math back into a usable recommendation) failed: wrong form, wrong time.`],
 [`The model is overfit, so its accuracy is misleading`,`It performed well on test data, which is exactly the check for overfitting.`,`Assuming every unused model must be statistically flawed.`],
 [`The data was not cleaned properly`,`Nothing suggests a data problem; accuracy is good.`,`Blaming the most time-consuming step by default.`],
 [`It should have been a prescriptive model instead`,`The question type may be fine; the delivery is what failed.`,`Treating a communication failure as a method-choice failure.`]
]);
Q('m1',0,`Which of these is a cross-cutting concept (used across many methods) rather than a method for answering a question?`,[
 [`Validation`,`Validation applies to classification, clustering, forecasting, regression — it's not a method on its own.`],
 [`Clustering`,`Clustering is a descriptive method family.`,`Mixing up tools with the checks you apply to tools.`],
 [`Support vector machines`,`SVM is a classification method.`,`Thinking anything technical is "cross-cutting."`],
 [`CUSUM`,`CUSUM is a change-detection method.`,`Same confusion: CUSUM answers a specific question type.`]
]);
Q('m1',1,`Your manager hands you a dataset and says, "Find something interesting." What should you establish first?`,[
 [`What decision the answer is supposed to inform`,`That tells you the question type, which method family fits, and what counts as "interesting."`],
 [`Which algorithm runs fastest on the data`,`Speed is irrelevant until you know what you're trying to answer.`,`Starting from tools instead of from the question.`],
 [`Whether the data needs scaling`,`Important later, but preparation depends on which method you'll use.`,`Jumping into the middle of the workflow.`],
 [`How many clusters are in the data`,`That assumes clustering is the right approach before you know the question.`,`Reaching for the method you know best.`]
]);
// ===== Module 2
Q('m2',0,`You fit a hard-margin SVM, then delete a point that sits deep inside the "repaid" group and refit. What happens?`,[
 [`The classifier stays the same`,`Only support vectors (points the margin rests on) constrain the line. An interior point doesn't.`],
 [`The margin gets wider`,`The margin is set by the closest points, which didn't change.`,`Thinking every point pushes on the line.`],
 [`The line shifts toward the "defaulted" group`,`Removing a far-away point changes nothing near the boundary.`,`Picturing the line as a balance between the two groups' averages.`],
 [`The support vectors change`,`The deleted point wasn't a support vector, so they stay.`,`Not knowing which points are support vectors.`]
]);
Q('m2',0,`A transplant team classifies donor organs as "safe" or "infected." Using an infected organ is far worse than discarding a safe one. How should the boundary move?`,[
 [`Toward the "safe" points, so borderline organs get classified as infected`,`Move the line away from the costly mistake so ambiguous cases land on the cheap-error side (discard).`],
 [`Toward the "infected" points, so fewer organs get discarded`,`That makes the dangerous mistake more likely.`,`Mixing up "move toward" and "move away from" the costly class.`],
 [`Keep it centered for the widest margin`,`The widest margin treats both errors as equally bad, which they aren't here.`,`Treating "widest margin" as always correct regardless of costs.`],
 [`Remove attributes until the classes separate perfectly`,`Dropping information doesn't address unequal costs.`,`Thinking perfect separation solves everything.`]
]);
Q('m2',0,`In soft-margin SVM (error + λ·Σa²), what happens as λ becomes very large?`,[
 [`A wide margin dominates, so more training points may be misclassified`,`λ multiplies the margin term, so large λ prioritizes width over avoiding training mistakes.`],
 [`The margin narrows and training error goes toward zero`,`That's what happens as λ approaches 0.`,`Getting the direction of λ backwards (easy to do if you've used software's C, which works the other way).`],
 [`λ only matters when the data can't be separated`,`λ always sets the trade-off in the soft-margin objective.`,`Confusing when soft margins are needed with how λ works.`],
 [`The model ignores the margin entirely`,`Opposite: the margin becomes the main priority.`,`Misreading which term λ multiplies.`]
]);
Q('m2',0,`An SVM trained on raw data has coefficients 0.0004 on income (in dollars) and 1.8 on credit score. What can you conclude?`,[
 [`Nothing reliable about importance; the data wasn't scaled`,`Income is measured in big numbers, so its coefficient is naturally tiny. Compare sizes only after scaling.`],
 [`Income is irrelevant and can be dropped`,`That rule ("coefficient near 0 → drop") only holds after scaling.`,`Applying the variable-selection rule without its condition.`],
 [`Credit score is 4,500× more important than income`,`Coefficient ratios on unscaled data reflect units, not importance.`,`Reading raw coefficients as importance weights.`],
 [`The model is broken`,`Coefficients on different scales are expected with unscaled data; it's a warning, not proof of failure.`,`Thinking coefficients should naturally be similar in size.`]
]);
Q('m2',1,`After scaling all attributes to 0–1, an SVM gives coefficients of about 1.5 on four attributes and 0.002 on a fifth. What's a reasonable conclusion?`,[
 [`The fifth attribute probably barely affects classification and is a candidate to drop (confirm with validation)`,`With comparable scales, a near-zero coefficient means that attribute hardly moves the boundary.`],
 [`Nothing, since coefficient size never indicates importance`,`After scaling, it does.`,`Over-learning the warning from unscaled data.`],
 [`The fifth attribute must be categorical`,`Coefficient size says nothing about data type.`,`Linking small coefficients to data type.`],
 [`The fifth attribute should be standardized instead of scaled`,`Switching transformations won't make an irrelevant attribute relevant.`,`Treating every odd result as a scaling problem.`]
]);
Q('m2',1,`Credit score is on the horizontal axis and income on the vertical. The fitted classifier runs almost parallel to the horizontal axis. Which attribute barely matters?`,[
 [`Credit score (horizontal)`,`A horizontal line means the decision changes only as income (vertical) changes. Moving left-right along credit score never crosses it.`],
 [`Income (vertical)`,`Moving up and down (income) is exactly what crosses a horizontal line.`,`Thinking "the line lies along the horizontal axis, so that axis matters."`],
 [`Both matter equally`,`A line parallel to one axis ignores that axis's attribute.`,`Assuming a 2-D line always uses both dimensions.`],
 [`Can't tell without the coefficients`,`The geometry tells you directly; coefficients just confirm it.`,`Not trusting the picture.`]
]);
Q('m2',1,`A KNN model with k = 1 scores 100% accuracy when tested on its own training data. What's the best interpretation?`,[
 [`Expected and meaningless: each point's nearest neighbor is itself`,`Every training point finds itself at distance 0 and votes for its own label. It says nothing about new data.`],
 [`k = 1 is clearly the best choice`,`A perfect training score is guaranteed here, so it can't be evidence.`,`Choosing settings by training accuracy.`],
 [`The data must be perfectly separable`,`KNN with k = 1 scores 100% on training data even when classes overlap heavily.`,`Linking 100% accuracy to separability.`],
 [`The model is underfit`,`Opposite: k = 1 is the most flexible setting and tends to overfit.`,`Mixing up underfitting and overfitting.`]
]);
Q('m2',0,`ZIP codes are stored as integers and used in a KNN with Euclidean distance. What's the main problem?`,[
 [`The model treats numeric gaps between ZIP codes as meaningful distances, but they're just labels`,`ZIP codes are categorical; 10002 isn't "close to" 10001 in any real sense the model can use.`],
 [`ZIP codes are unstructured data`,`They're structured (fixed format), just categorical.`,`Confusing categorical with unstructured.`],
 [`ZIP codes are binary`,`Binary means exactly two values.`,`Mixing up categorical and binary.`],
 [`KNN can't use more than two attributes`,`KNN works in any number of dimensions.`,`Assuming the 2-D pictures are a limit.`]
]);
Q('m2',0,`A neural network requires every input to be between 0 and 1. Which transformation should you use?`,[
 [`Scaling: (x − min)/(max − min)`,`Scaling guarantees a fixed range.`],
 [`Standardization: (x − mean)/SD`,`Standardized values are unbounded (e.g., −2.7 or 3.1).`,`Thinking standardization squeezes values into a range.`],
 [`Either, since they're interchangeable`,`They have different properties; only scaling bounds the range.`,`Treating the two as synonyms.`],
 [`Neither; neural networks scale inputs automatically`,`Not guaranteed; the requirement here is explicit.`,`Assuming software always handles it.`]
]);
Q('m2',1,`You have training and test sets. Where should the min/max (for scaling) come from?`,[
 [`The training data only, then apply those same numbers to the test data`,`Using test-set statistics leaks information from the test set into training and makes the test score optimistic.`],
 [`The full dataset, so the range covers everything`,`That lets test data influence training (leakage).`,`Thinking "more data = better statistics" always.`],
 [`Each set separately`,`Then the same raw value maps to different scaled values in each set.`,`Not realizing the transformation must be identical across sets.`],
 [`The test data, since that's what you're evaluating`,`Test data must stay untouched until the final check.`,`Misunderstanding the test set's role.`]
]);
Q('m2',1,`Why is the SVM response coded as +1 and −1 instead of 1 and 0?`,[
 [`Multiplying by y flips the inequality for red points, merging both "correct side" rules into one constraint`,`y·(Σaⱼxⱼ + a₀) ≥ 1 only works because y = −1 flips the sign for the red class.`],
 [`It keeps the classes centered on zero so the math is tidier`,`Tidiness isn't the reason; merging the constraints is.`,`Accepting a vague reason over the specific one.`],
 [`Models require inputs centered on zero`,`y is the response, not an input, and SVM has no such requirement.`,`Mixing up responses with standardized inputs.`],
 [`It lets SVM output probabilities`,`SVM outputs a side of the line, not probabilities.`,`Confusing SVM with logistic regression.`]
]);
Q('m2',0,`Which statement correctly contrasts SVM and KNN?`,[
 [`SVM builds a boundary from coefficients; KNN keeps all training points and votes among neighbors for each new point`,`SVM summarizes the data into a line; KNN never builds one.`],
 [`KNN draws a boundary; SVM votes among neighbors`,`Reversed.`,`Mixing up the two methods' mechanisms.`],
 [`Only SVM needs scaled data`,`KNN is distance-based, so it needs scaling just as much.`,`Linking scaling only to the margin math.`],
 [`KNN needs extra machinery for more than two classes`,`KNN handles many classes naturally: it just counts votes.`,`Assuming all classifiers are built for two classes.`]
]);
// ===== Module 3
Q('m3',0,`You compare 10 models on a validation set. The best scores 88%. What should you report as its expected performance?`,[

DQ([17],'m8',0,`What's a good first way to check whether a predictor has a linear or nonlinear relationship with the response?`,[

RD([1],'m2','Why a bigger SVM margin?',`Why do we prefer a larger margin in hard-classification SVM (think about the correctness and certainty of data)? In a soft-classification setting, what's the benefit of a bigger margin (possibly with more errors on known data) vs. a smaller margin (fewer errors on known data)?`,[
 [`Data is imprecise; a wide margin means small errors won't flip a classification`,['imprecise','measurement','error','certain','robust','noise']],
 [`New points near the boundary are classified with more confidence / less risk`,['new point','confiden','boundary','generaliz']],
 [`Soft, bigger margin: more robust to noise, less overfitting, but more training errors`,['overfit','robust','more error','generaliz']],
 [`Soft, smaller margin: fits known data more closely; good when data is accurate, risky when noisy`,['smaller','narrow','fewer error','accurate','trust']],

]);
RD([2],'m2','When to scale vs. standardize',`Give examples of situations where you'd suggest scaling (set minimum and maximum values) and where you'd suggest standardization (no set min/max, like a normal distribution).`,[
 [`Scaling: data with fixed bounds, e.g., survey 1–5, percentages 0–100, RGB 0–255, SAT 200–800`,['survey','percent','rgb','sat','0-255','bound','fixed']],

RD([3,4],'m2','SVM vs. KNN',`When would SVM be better than KNN, and when would KNN be better? Consider how points cluster, one class being much more common, heavily mixed classes, and wanting to know how likely a classification is correct. Also: why is scaling helpful before KNN?`,[

 [`Imbalanced classes: KNN votes get dominated by the common class`,['imbalanc','common','rare','majority']],
 [`Heavily mixed classes: both struggle; attributes may not separate the classes`,['mixed','overlap','struggle','attribute']],
 [`Confidence: KNN vote share; SVM distance from the line; for probabilities, logistic regression`,['vote','distance','probabil','logistic','confiden']],
 [`Scaling before KNN: big-unit attributes would otherwise dominate the distance`,['dominat','distance','unit','scal']]
]);
RD([5,6],'m3','Choosing among near-equal models',`If several near-equal models are compared on the same validation data, is the truly best one likely to be chosen? After picking the best on validation, why is its test score likely worse? And if a different model looks best on the test data, should you switch?`,[

<script>
(function(){
const MODS={m1:'Module 1 · Foundations',m2:'Module 2 · Classification',m3:'Module 3 · Validation',m4:'Module 4 · Clustering',m5:'Module 5 · Preparing data',m6:'Module 6 · Change detection',m7:'Module 7 · Time series',m8:'Module 8 · Regression',who:'Who picks the numbers',mix:'Pick the right tool'};
const SHORT={m1:'M1 Foundations',m2:'M2 Classification',m3:'M3 Validation',m4:'M4 Clustering',m5:'M5 Data prep',m6:'M6 Change detection',m7:'M7 Time series',m8:'M8 Regression',who:'Who picks',mix:'Right tool'};
const MOD_KEYS=Object.keys(MODS);
const DAY=864e5, TOUGH_GAP=5*DAY;
// stable ids
const cnt={}; QS.forEach(q=>{cnt[q.m]=(cnt[q.m]||0)+1; q.id=q.m+'-'+cnt[q.m];});
const rcnt={}; RC.forEach(r=>{rcnt[r.m]=(rcnt[r.m]||0)+1; r.id='r-'+r.m+'-'+rcnt[r.m];});
const DISC={1:'Why a bigger SVM margin?',2:'When to scale vs. standardize',3:'SVM vs. KNN',4:'Why scale before KNN?',5:'Does validation pick the truly best model?',6:'Test vs. validation; switching models',7:'Classification vs. clustering',8:'Hardest outlier to identify',9:'Bad, irrelevant, or relevant outliers',10:'Higher or lower C and T',11:'When to use change detection',12:'Examples of time-series data',13:'When to predict variance',14:'How far ahead smoothing is accurate',15:'Regression vs. SVM: near or far points',16:'R²: physical vs. human behavior',17:'Linear or nonlinear relationship?'};
const DISC_Q={'m2-1':[1],'m2-3':[1],'m2-13':[1],'m2-16':[1],'who-4':[1],'m2-9':[2],'m2-10':[2],'m2-12':[3],'mix-4':[3],'m4-8':[4],'m3-1':[5,6],'m3-7':[5],'m3-8':[5],'m3-13':[5],'m3-3':[6],'m3-20':[6],'m4-9':[7],'m4-13':[7],'mix-3':[7],'m5-1':[8],'m5-2':[8],'m5-8':[8],'m5-14':[8],'m5-4':[9],'m5-6':[9],'m5-7':[9],'m5-10':[9],'m5-12':[9],'m6-2':[10],'m6-7':[10],'m6-8':[10],'m6-12':[10],'m6-13':[10],'m6-15':[10],'m6-11':[11],'m6-14':[11],'mix-2':[11],'m7-8':[13],'m7-20':[13],'m7-17':[14],'m8-9':[15],'m8-4':[17],'m8-19':[17]};
const DISC_R={'r-m2-1':[1],'r-m2-2':[1],'r-m2-3':[2],'r-m2-4':[3,4],'r-m3-2':[5,6],'r-m4-4':[7],'r-m5-1':[8],'r-m5-2':[9],'r-m6-1':[11],'r-m6-2':[10],'r-m6-3':[10],'r-m7-3':[13],'r-m8-3':[16],'r-m8-5':[17]};
QS.forEach(q=>{ if(DISC_Q[q.id]) q.disc=(q.disc||[]).concat(DISC_Q[q.id]); });
RC.forEach(r=>{ if(DISC_R[r.id]) r.disc=(r.disc||[]).concat(DISC_R[r.id]); });
const discTag=d=>d&&d.length?`<span class="tag disc">Discussion topic: ${d.map(i=>DISC[i]).join(' · ')}</span>`:'';
const SESSION=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const KEY='midterm-practice-m1-8-v1';
let st={v:1,updatedAt:0,q:{},r:{}};
try{ const raw=localStorage.getItem(KEY); if(raw){ const p=JSON.parse(raw); if(p&&p.q&&p.r) st=p; } }catch(e){}
const $=s=>document.querySelector(s);
const main=$('#main');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function save(){
  st.updatedAt=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){}
  }
function setSync(t){ const el=$('#sync'); if(el) el.textContent=t; }
// ---------- status
function qStatus(q){
  const e=st.q[q.id]; if(!e) return 'new';
  if(e.s==='wrong' && e.last!==SESSION) return 'missed';
  if(e.s==='retry' && e.last!==SESSION) return 'retried';
  if(e.s==='mastered' && q.tough && (e.n||0)<3 && Date.now()-(e.at||0)>TOUGH_GAP && e.last!==SESSION) return 'due';
  return e.s;
}
function rStatus(r){
  const e=st.r[r.id]; if(!e) return 'new';
  if(e.s==='review' && e.last===SESSION) return 'locked';
  return e.s; // 'solid' | 'review'
}
function answeredNow(q){ const e=st.q[q.id]; return e && e.last===SESSION; }
function recordAnswer(q,correct){
  const e=st.q[q.id]||{n:0};
  const prev=qStatus(q);
  if(correct){
    let n=(['new','missed','retried'].includes(prev))?1:(e.n||0)+1;
    let s=(!q.tough||n>=2)?'mastered':'review';
    st.q[q.id]={s,n,last:SESSION,at:Date.now()};
  } else {
    st.q[q.id]={s:'wrong',n:0,last:SESSION,at:Date.now()};
  }
  save();
}
function markRetry(q){ st.q[q.id]={s:'retry',n:0,last:SESSION,at:Date.now()}; save(); }
// ---------- tabs
let tab='exam';
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{
  if(exam && exam.active && b.dataset.tab!=='exam'){ confirmDlg('Leave the exam? Your answers so far are saved, but the timer stops and the rest of this exam ends.','Leave exam',()=>{endExam(true); switchTab(b.dataset.tab);}); return; }
  switchTab(b.dataset.tab);
}));
function switchTab(t){ tab=t; document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t))); render(); window.scrollTo(0,0); }
function render(){ if(tab==='exam') renderExam(); else if(tab==='recall') renderRecall(); else renderProgress(); }
// ---------- dialog
function confirmDlg(msg,okLabel,onOk,cancelLabel='Cancel'){
  const d=$('#dlg'); $('#dlg-msg').textContent=msg; const a=$('#dlg-actions'); a.innerHTML='';
  const ok=document.createElement('button'); ok.className='btn'; ok.textContent=okLabel; ok.onclick=()=>{d.close(); onOk();};
  a.appendChild(ok);
  if(cancelLabel){ const c=document.createElement('button'); c.className='btn quiet'; c.textContent=cancelLabel; c.onclick=()=>d.close(); a.appendChild(c); }
  if(d.showModal) d.showModal(); else if(confirm(msg)) onOk();
}
// ---------- exam
let exam=null; let setup={mods:new Set(MOD_KEYS),n:20,incMastered:false,discOnly:false};
function available(){
  return QS.filter(q=>setup.mods.has(q.m) && (!setup.discOnly||q.disc) && !answeredNow(q) && (setup.incMastered || qStatus(q)!=='mastered'));
}
function renderExam(){
  if(exam && exam.active) return renderQuestion();
  if(exam && exam.done) return renderSummary();
  const av=available(); const cntS=s=>av.filter(q=>qStatus(q)===s).length;
  const missed=cntS('missed'), retried=cntS('retried'), due=cntS('review')+cntS('due'), toughNew=av.filter(q=>q.tough&&qStatus(q)==='new').length;
  const pr=[missed?`${missed} you missed before`:'',retried?`${retried} you asked to retry`:'',due?`${due} tough question${due>1?'s':''} due for another round`:''].filter(Boolean);
  const n=setup.n==='all'?av.length:Math.min(setup.n,av.length);
  main.innerHTML=`<section class="panel">
    <h2>Start a timed practice exam</h2>
    <p class="small" style="margin-top:0">One minute per question. Pick an answer, then press <b>Submit final answer</b> to lock it in and see why each option is right or wrong.</p>
    <h3>Modules</h3>
    <div class="chips" id="modchips">${MOD_KEYS.map(k=>`<button class="chip" data-m="${k}" aria-pressed="${setup.mods.has(k)}">${SHORT[k]}</button>`).join('')}</div>
    <div class="row" style="margin-top:8px"><button class="btn quiet" id="allm">Select all</button><button class="btn quiet" id="nonem">Clear</button></div>
    <h3>Number of questions</h3>
    <div class="chips" id="nchips">${[10,20,40,60,'all'].map(v=>`<button class="chip" data-n="${v}" aria-pressed="${setup.n===v}">${v==='all'?'All available':v}</button>`).join('')}</div>
    <label style="display:flex;align-items:flex-start;margin-top:14px;gap:10px;cursor:pointer"><input type="checkbox" id="disconly" ${setup.discOnly?'checked':''} style="width:20px;height:20px;flex:none;margin-top:2px"> <span>Only <span class="tag disc">professor's discussion topics</span> <span class="small">(${QS.filter(q=>q.disc).length} questions)</span></span></label>
    <label style="display:flex;align-items:flex-start;margin-top:10px;gap:10px;cursor:pointer"><input type="checkbox" id="incm" ${setup.incMastered?'checked':''} style="width:20px;height:20px;flex:none;margin-top:2px"> <span>Include questions I've already mastered <span class="small">(a wrong answer resets them)</span></span></label>
    <div class="note">${av.length} questions available. Each exam is a fresh random draw, weighted toward ${pr.length?pr.join(', ')+', and ':''}tough questions (${toughNew} not yet tried). This exam: <b>${n} question${n===1?'':'s'}, ${n} minute${n===1?'':'s'}</b>.</div>
    <div class="actions"><button class="btn" id="go" ${n?'':'disabled'}>Start exam (${n} min)</button></div>
    ${av.length===0?`<p class="small">Nothing left in the selected modules for this session. Wrong answers come back the next time you open this page, or turn on "Include questions I've already mastered."</p>`:''}
  </section>
  <section class="panel"><h2>How it works</h2>
   <ul class="small" style="padding-left:18px;margin:0">
    <li>Questions on your <span class="tag disc">professor's discussion topics</span> are highlighted and twice as likely to be drawn.</li>
    <li>Every exam is a new random draw. Questions you missed, asked to retry, or marked tough are much more likely to be picked, and so are modules where you're struggling.</li>
    <li>A correct answer counts toward your comfort score.</li>
    <li>A wrong answer resets that question and gives it top priority the next time you open this page.</li>
    <li>Tough questions (marked) must be answered correctly in two separate sessions, and return once more after 5 days.</li>
    <li>After a correct answer, <b>Ask me again next time</b> resets it so you can re-test yourself later.</li>
   </ul></section>`;
  document.querySelectorAll('#modchips .chip').forEach(c=>c.onclick=()=>{const m=c.dataset.m; setup.mods.has(m)?setup.mods.delete(m):setup.mods.add(m); renderExam();});
  $('#allm').onclick=()=>{setup.mods=new Set(MOD_KEYS); renderExam();};
  $('#nonem').onclick=()=>{setup.mods=new Set(); renderExam();};
  document.querySelectorAll('#nchips .chip').forEach(c=>c.onclick=()=>{const v=c.dataset.n; setup.n=v==='all'?'all':+v; renderExam();});
  $('#incm').onchange=e=>{setup.incMastered=e.target.checked; renderExam();};
  $('#disconly').onchange=e=>{setup.discOnly=e.target.checked; renderExam();};
  $('#go').onclick=()=>startExam(n);
}
function startExam(n){
  const av=available();
  const W={missed:8,retried:6,due:6,review:6,new:1,mastered:0.4};
  const weak={}; MOD_KEYS.forEach(m=>{const qq=QS.filter(q=>q.m===m); weak[m]=qq.length?qq.filter(q=>['missed','review','due'].includes(qStatus(q))).length/qq.length:0;});
  const weight=q=>{const s=qStatus(q); let w=W[s]||1; if(s==='new'&&q.tough) w=3; return w*(1+2*weak[q.m])*(q.disc?2:1);};
  const picked=av.map(q=>({q,k:Math.pow(Math.random(),1/weight(q))})).sort((a,b)=>b.k-a.k).slice(0,n).map(x=>x.q);
  const list=shuffle(picked).map(q=>({q,st0:qStatus(q),order:shuffle(q.opts.map((_,i)=>i)),pick:null,submitted:false,correct:null}));
  exam={active:true,done:false,items:list,i:0,total:n*60,left:n*60,timed:true,started:Date.now()};
  exam.tick=setInterval(()=>{ if(!exam.timed) return; exam.left--; updateClock(); if(exam.left<=0){ exam.left=0; timeUp(); } },1000);
  renderQuestion();
}
function fmt(s){const m=Math.floor(s/60), r=s%60; return m+':'+String(r).padStart(2,'0');}
function updateClock(){
  const c=$('#clock'); if(!c) return;
  if(!exam.timed){ c.textContent='Untimed'; c.classList.remove('low'); }
  else { c.textContent=fmt(exam.left); c.classList.toggle('low',exam.left<=60); }
  const t=$('#trk'); if(t) t.style.width=(100*(1-exam.left/exam.total))+'%';
}
function timeUp(){
  clearInterval(exam.tick); exam.timed=false;
  const left=exam.items.filter(it=>!it.submitted).length;
  if(left===0){ endExam(); return; }
  confirmDlg(`Time's up. You have ${left} question${left>1?'s':''} left. On the real exam, time would be over.`,'See results',()=>endExam(),null);
  const a=$('#dlg-actions'); const k=document.createElement('button'); k.className='btn quiet'; k.textContent='Keep going without the clock'; k.onclick=()=>{$('#dlg').close(); updateClock();}; a.appendChild(k);
}
function endExam(silent){ if(!exam) return; clearInterval(exam.tick); exam.active=false; exam.done=!silent; exam.used=Math.round((Date.now()-exam.started)/1000); if(silent) exam=null; render(); }
function renderQuestion(){
  const it=exam.items[exam.i], q=it.q; const L='ABCD';
  const answered=exam.items.filter(x=>x.submitted).length;
  const correctIdx=0;
  let html=`<div class="timerbar"><div class="timerrow"><div><span class="clock" id="clock"></span> <span class="small">left</span></div>
    <div class="small">Question ${exam.i+1} of ${exam.items.length} · ${answered} answered</div>
    <button class="btn quiet" id="endbtn" style="min-height:36px;padding:6px 12px">End exam</button></div><div class="track"><i id="trk"></i></div></div>
  <section class="panel">
    <div class="qmeta"><span class="tag">${MODS[q.m]}</span>${q.tough?'<span class="tag tough">Tough: needs 2 sessions</span>':''}${discTag(q.disc)}${{missed:'<span class="tag" style="background:var(--bad-bg);color:var(--bad)">Missed last time</span>',retried:'<span class="tag">You asked to retry this</span>',review:'<span class="tag">Second round</span>',due:'<span class="tag">5-day check</span>'}[it.st0]||''}</div>
    <p class="qtext">${q.q}</p><div class="opts">`;
  it.order.forEach((oi,pos)=>{
    const o=q.opts[oi]; let cls='opt'; if(it.submitted){cls+=' locked'; if(oi===correctIdx) cls+=' right'; else if(oi===it.pick) cls+=' wrong';}
    html+=`<button class="${cls}" data-oi="${oi}" aria-pressed="${it.pick===oi}" ${it.submitted?'aria-disabled="true"':''}><span class="lbl">${L[pos]}.</span>${o[0]}`;
    if(it.submitted){
      if(oi===correctIdx) html+=`<div class="fb"><b class="k">✓ Correct answer${oi===it.pick?' (your pick)':''}</b>${o[1]}</div>`;
      else html+=`<div class="fb"><b class="k">✗ ${oi===it.pick?'Your pick: why it\'s wrong':'Why it\'s wrong'}</b>${o[1]}<span class="mis"><b>Misconception behind it:</b> ${o[2]||''}</span></div>`;
    }
    html+=`</button>`;
  });
  html+=`</div>`;
  if(!it.submitted){
    html+=`<div class="actions"><button class="btn" id="submit" ${it.pick===null?'disabled':''}>Submit final answer</button><button class="btn quiet" id="skip">Skip for now</button></div>`;
  } else {
    const e=st.q[q.id]||{};
    html+=`<p class="verdict ${it.correct?'ok':'no'}">${it.correct?'Correct.':'Not quite. This question will come back next time you open the page.'}</p>`;
    if(it.correct){
      if(e.s==='retry') html+=`<p class="small">Reset: this question will be asked again next time.</p>`;
      else if(e.s==='review') html+=`<p class="small">Tough question: answer it correctly again in a future session to master it.</p>`;
      else html+=`<p class="small">Mastered. It counts toward your comfort score.</p>`;
    }
    html+=`<div class="actions"><button class="btn" id="next">${exam.i<exam.items.length-1||exam.items.some(x=>!x.submitted)?'Next question':'See results'}</button>${it.correct&&e.s!=='retry'?'<button class="btn ghost" id="retry">Ask me again next time</button>':''}</div>`;
  }
  html+=`</section>`;
  main.innerHTML=html; updateClock();
  $('#endbtn').onclick=()=>confirmDlg('End the exam now? Unanswered questions stay available for later.','End exam',()=>endExam());
  if(!it.submitted){
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{it.pick=+b.dataset.oi; renderQuestion();});
    $('#submit').onclick=()=>{ if(it.pick===null) return; it.submitted=true; it.correct=(it.pick===correctIdx); recordAnswer(q,it.correct); renderQuestion(); };
    $('#skip').onclick=()=>{ const x=exam.items.splice(exam.i,1)[0]; exam.items.push(x); if(exam.items[exam.i].submitted) goNext(); else renderQuestion(); };
  } else {
    $('#next').onclick=goNext;
    const r=$('#retry'); if(r) r.onclick=()=>{ markRetry(q); renderQuestion(); };
  }
}
function goNext(){
  const n=exam.items.length;
  for(let k=1;k<=n;k++){ const j=(exam.i+k)%n; if(!exam.items[j].submitted){ exam.i=j; renderQuestion(); window.scrollTo(0,0); return; } }
  endExam();
}
function renderSummary(){
  const done=exam.items.filter(x=>x.submitted), right=done.filter(x=>x.correct), wrong=done.filter(x=>!x.correct);
  const pct=done.length?Math.round(100*right.length/done.length):0;
  main.innerHTML=`<section class="panel"><h2>Exam results</h2>
    <p class="big">${right.length} / ${done.length}</p><p class="small">${pct}% correct · ${exam.items.length-done.length} not answered · time used ${fmt(Math.min(exam.used,exam.total))} of ${fmt(exam.total)}</p>
    ${wrong.length?`<h3>Review these (they'll come back next session)</h3><ol class="sum-list">${wrong.map(x=>`<li><span class="tag">${SHORT[x.q.m]}</span> ${x.q.q}<br><span class="small"><b>Answer:</b> ${x.q.opts[0][0]}</span></li>`).join('')}</ol>`:'<p>No misses this round.</p>'}
    <div class="actions"><button class="btn" id="again">Start another exam</button><button class="btn quiet" id="prog">See progress</button></div></section>`;
  $('#again').onclick=()=>{exam=null; renderExam();};
  $('#prog').onclick=()=>{exam=null; switchTab('progress');};
}
// ---------- recall
let drill=null;
function renderRecall(){
  if(drill) return renderDrill();
  let html=`<section class="panel"><h2>Write what you know</h2>
  <p class="small" style="margin-top:0">Pick a concept and write everything you remember, without looking. Then check it against the key points. If you miss any, review them and try again the next time you open this page.</p></section>`;
  const lab=s=>({new:'Not tried',solid:'Solid',review:'Needs another try',locked:'Try again next session'}[s]);
  const profs=RC.filter(r=>r.prof); const ps=profs.filter(r=>rStatus(r)==='solid').length;
  html+=`<section class="panel prof"><h2><span class="mark">From your professor's discussion forum</span></h2>
   <p class="small" style="margin-top:0">These are the questions your professor posted for discussion, a strong hint about what matters. Answer each one in your own words, then check it against the key points. (${ps} of ${profs.length} solid)</p><div class="clist">`;
  profs.forEach(r=>{ const s=rStatus(r); html+=`<button class="citem" data-r="${r.id}" ${s==='locked'?'disabled':''}><span>${r.title}</span><span class="st ${s}">${lab(s)}</span></button>`; });
  html+=`</div></section>`;
  MOD_KEYS.forEach(m=>{
    const rs=RC.filter(r=>r.m===m && !r.prof); if(!rs.length) return;
    html+=`<section class="panel"><h2 style="font-size:1.1rem">${MODS[m]}</h2><div class="clist">`;
    rs.forEach(r=>{ const s=rStatus(r); const lab={new:'Not tried',solid:'Solid',review:'Needs another try',locked:'Try again next session'}[s];
      html+=`<button class="citem" data-r="${r.id}" ${s==='locked'?'disabled':''}><span>${r.title}${r.disc?'<span class="dtag">Discussion</span>':''}</span><span class="st ${s}">${lab}</span></button>`; });
    html+=`</div></section>`;
  });
  main.innerHTML=html;
  document.querySelectorAll('.citem').forEach(b=>b.onclick=()=>{ drill={r:RC.find(x=>x.id===b.dataset.r),text:'',checked:false}; renderDrill(); window.scrollTo(0,0); });
}
function matchPoints(r,text){ const t=text.toLowerCase(); return r.points.map(p=>p[1].some(k=>t.includes(k.toLowerCase()))); }
function renderDrill(){
  const r=drill.r, e=st.r[r.id];
  let html=`<section class="panel${r.prof?' prof':''}"><div class="qmeta"><span class="tag">${MODS[r.m]}</span>${r.prof?'<span class="tag disc">Professor\'s discussion question</span>':`<span class="tag">${esc(r.title)}</span>`}${!r.prof?discTag(r.disc):''}</div>
    <p class="qtext">${r.prompt}</p>`;
  if(e && e.s==='review' && e.missed && !drill.checked) html+=`<div class="note">Last time you missed: ${e.missed.map(i=>esc(r.points[i][0])).join('; ')}</div>`;
  if(!drill.checked){
    if(r.prof) html+=`<p class="small" style="margin-top:0">Tip: answering in your own words here is also good preparation for your forum post.</p>`;
    html+=`<textarea id="ta" placeholder="Write it in your own words. Aim for 3–6 sentences.">${esc(drill.text)}</textarea>
    <div class="actions"><button class="btn" id="chk">Check my answer</button><button class="btn quiet" id="back">Back to list</button></div>`;
  } else {
    html+=`<h3>Your answer</h3><div class="note" style="white-space:pre-wrap;font-family:var(--serif)">${esc(drill.text)||'<i>(blank)</i>'}</div>
    <h3>Key points you should have included</h3><p class="small" style="margin:0">Tick each point you genuinely covered. Points with a matching keyword are pre-ticked as a hint, so double-check them.</p>
    <ul class="points">${r.points.map((p,i)=>`<li><label><input type="checkbox" data-i="${i}" ${drill.ticks[i]?'checked':''}><span>${esc(p[0])}${drill.auto[i]?'<span class="hint">keyword found</span>':''}</span></label></li>`).join('')}</ul>
    <div class="actions"><button class="btn" id="savr">Save result</button><button class="btn quiet" id="redo">Edit my answer</button></div>`;
  }
  html+=`</section>`;
  main.innerHTML=html;
  if(!drill.checked){
    const ta=$('#ta'); ta.oninput=()=>drill.text=ta.value; ta.focus();
    $('#chk').onclick=()=>{ drill.text=ta.value; drill.auto=matchPoints(r,drill.text); drill.ticks=drill.auto.slice(); drill.checked=true; renderDrill(); };
    $('#back').onclick=()=>{drill=null; renderRecall();};
  } else {
    document.querySelectorAll('.points input').forEach(c=>c.onchange=()=>{drill.ticks[+c.dataset.i]=c.checked;});
    $('#redo').onclick=()=>{drill.checked=false; renderDrill();};
    $('#savr').onclick=()=>{
      const missed=drill.ticks.map((t,i)=>t?null:i).filter(x=>x!==null);
      st.r[r.id]= missed.length? {s:'review',missed,last:SESSION,at:Date.now()} : {s:'solid',last:SESSION,at:Date.now()};
      save(); showRecallResult(r,missed);
    };
  }
}
function showRecallResult(r,missed){
  main.innerHTML=`<section class="panel">${missed.length?
    `<h2>Review these points</h2><p class="small" style="margin-top:0">You covered ${r.points.length-missed.length} of ${r.points.length}. Reread these in your guide, then try this concept again the next time you open the page.</p><ul class="missed">${missed.map(i=>`<li>${esc(r.points[i][0])}</li>`).join('')}</ul>`:
    `<h2>Solid</h2><p>You covered all ${r.points.length} key points for <b>${esc(r.title)}</b>. This counts toward your comfort score.</p>`}
    <div class="actions"><button class="btn" id="bk">Back to concepts</button></div></section>`;
  $('#bk').onclick=()=>{drill=null; renderRecall(); window.scrollTo(0,0);};
}
// ---------- progress
function renderProgress(){
  const qm=QS.filter(q=>qStatus(q)==='mastered').length, qr=QS.filter(q=>['review','due','missed'].includes(qStatus(q))).length;
  const rs=RC.filter(r=>rStatus(r)==='solid').length, rr=RC.filter(r=>['review','locked'].includes(rStatus(r))).length;
  const overall=Math.round(100*(qm+rs)/(QS.length+RC.length));
  let html=`<section class="panel"><h2>What you're comfortable with</h2>
   <p class="big">${overall}%</p><p class="small">of all ${QS.length} exam questions and ${RC.length} recall concepts combined</p>
   <div class="bars">${bar('Exam questions mastered',qm,qr,QS.length)}${bar('Recall concepts solid',rs,rr,RC.length)}${(()=>{const dq=QS.filter(q=>q.disc), dr=RC.filter(r=>r.disc); const c=dq.filter(q=>qStatus(q)==='mastered').length+dr.filter(r=>rStatus(r)==='solid').length; const p=dq.filter(q=>['review','due','missed'].includes(qStatus(q))).length+dr.filter(r=>['review','locked'].includes(rStatus(r))).length; return bar('Professor\'s discussion topics',c,p,dq.length+dr.length);})()}</div>
   <div class="legend"><span style="--c:var(--ok)">Comfortable</span><span style="--c:var(--warn)">In progress (missed questions, tough questions, or missed recall points)</span></div></section>
   <section class="panel"><h2>By module</h2><div class="bars">`;
  MOD_KEYS.forEach(m=>{
    const qq=QS.filter(q=>q.m===m), rr2=RC.filter(r=>r.m===m);
    const c=qq.filter(q=>qStatus(q)==='mastered').length+rr2.filter(r=>rStatus(r)==='solid').length;
    const p=qq.filter(q=>['review','due','missed'].includes(qStatus(q))).length+rr2.filter(r=>['review','locked'].includes(rStatus(r))).length;
    html+=bar(MODS[m],c,p,qq.length+rr2.length);
  });
  html+=`</div><p class="small" style="margin-bottom:0">Weakest modules first: ${weakest()}</p></section>
   <section class="panel"><h2>Start over</h2><p class="small" style="margin-top:0">Clears every saved answer and recall result on this page.</p><button class="btn danger" id="reset">Reset all progress</button></section>`;
  main.innerHTML=html;
  $('#reset').onclick=()=>confirmDlg('Reset all progress? This can\'t be undone.','Reset everything',()=>{ st={v:1,updatedAt:0,q:{},r:{}}; save(); renderProgress(); });
}
function bar(label,c,p,t){ const pc=t?100*c/t:0, pp=t?100*p/t:0;
  return `<div class="bar"><div class="lab"><span>${label}</span><span>${Math.round(pc)}% · ${c}/${t}</span></div><div class="t" role="img" aria-label="${label}: ${c} of ${t} comfortable"><i class="m" style="width:${pc}%"></i><i class="r" style="width:${pp}%"></i></div></div>`; }
function weakest(){
  return MOD_KEYS.map(m=>{const qq=QS.filter(q=>q.m===m), rr=RC.filter(r=>r.m===m); const t=qq.length+rr.length; const c=qq.filter(q=>qStatus(q)==='mastered').length+rr.filter(r=>rStatus(r)==='solid').length; return [m,t?c/t:1];})
   .sort((a,b)=>a[1]-b[1]).slice(0,3).map(x=>SHORT[x[0]]).join(', ');
}
// ---------- theme
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
  try{ localStorage.setItem('mp-theme',t); }catch(e){}
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeSet===t)));
}
let theme='auto'; try{ theme=localStorage.getItem('mp-theme')||'auto'; }catch(e){}
applyTheme(theme);
document.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>applyTheme(b.dataset.themeSet));
render();
setSync('');
})();

</script>
